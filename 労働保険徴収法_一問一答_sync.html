<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>労働保険徴収法 一問一答 — 社労士試験対策</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}

/* ===== SYNC BAR ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;background:#1a2434;border:1px solid #283848;border-radius:10px;padding:10px 14px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9bb0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#556070;flex-shrink:0;transition:background .3s}
.sync-dot.connected{background:#3dbe82}
.sync-dot.syncing{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.error{background:#e05050}
.sync-user{font-size:11px;color:#556070;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btns{display:flex;gap:6px;align-items:center}
.btn-gsign{display:flex;align-items:center;gap:6px;background:#fff;color:#3c4043;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-gsign:hover{background:#f1f3f4}
.btn-gsign svg{flex-shrink:0}
.btn-sync{background:transparent;border:1px solid #283848;color:#8a9bb0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sync:hover{border-color:#4a9eca;color:#4a9eca}
.btn-sync:disabled{opacity:.4;cursor:default}
.btn-signout{background:transparent;border:1px solid #283848;color:#556070;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-signout:hover{border-color:#e05050;color:#e05050}

/* ===== HEADER ===== */
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}

/* ===== QUESTION CARD ===== */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:14px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-num{font-size:15px;color:#556070}
/* Accuracy badge on card */
.q-acc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:none}
.q-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.q-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.q-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.q-text{font-size:18px;line-height:1.8;color:#d8d0c0;word-break:break-word;white-space:pre-wrap;padding-right:40px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}

/* ===== OX BUTTONS ===== */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* あなたの選択ラベル */
.your-choice-label{font-size:9px;letter-spacing:.08em;opacity:.85;margin-top:2px;font-weight:700}
/* 挑戦回数バッジ */
.q-tries{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(138,155,176,.12);border:1px solid #283848;color:#8a9bb0;display:none}

/* ===== SELECT CHOICES (選択式用) ===== */
.choices-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-choice{background:#182030;border:1.5px solid #283848;border-radius:8px;padding:12px 10px;font-size:13px;color:#c8c0b0;cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.btn-choice:hover{border-color:#c97a4a;background:#1e2a3a}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice:disabled{cursor:default}
.q-type-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
.q-type-badge.ox{background:rgba(91,184,224,.12);border:1px solid rgba(91,184,224,.25);color:#5bb8e0}
.q-type-badge.sel{background:rgba(130,201,122,.12);border:1px solid rgba(130,201,122,.25);color:#82c97a}
.q-blank{background:rgba(201,122,74,.15);border-bottom:2px solid #c97a4a;color:#e8a87a;padding:0 4px;font-weight:700;border-radius:2px}

/* ===== RESULT PANEL ===== */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:18px;font-weight:700;margin-bottom:8px}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:17px;line-height:1.7;color:#a0b0c0}
.result-source{font-size:15px;color:#556070;margin-top:8px}

/* ===== NAV BUTTONS ===== */
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;white-space:nowrap}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:disabled{opacity:.3;cursor:default}
/* ⏸ 中断ボタン */
.btn-suspend{border-color:#4a3a10 !important;color:#e8c97a !important}
.btn-suspend:hover{background:rgba(232,201,122,.1) !important;border-color:#e8c97a !important}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;border:none;background:#c97a4a;color:#1a0800;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}

/* ===== START SCREEN ===== */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filters{margin-bottom:22px}
.filter-label{font-size:12px;color:#8a9bb0;margin-bottom:8px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn-filter{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-filter.active{border-color:#c97a4a;background:rgba(201,122,74,.12);color:#c97a4a}
.btn-filter:hover{border-color:#4a9eca;color:#4a9eca}
.random-mode{margin-bottom:18px}
.random-input-wrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.random-input{background:#1a2434;border:1.5px solid #283848;border-radius:6px;color:#e8e0d0;padding:8px 10px;font-size:14px;width:60px;text-align:center}
.random-input:focus{outline:none;border-color:#c97a4a}
.random-label{font-size:13px;color:#8a9bb0}
.start-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-start{border:1.5px solid #c97a4a;background:transparent;color:#c97a4a;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-start:hover{background:rgba(201,122,74,.12)}
.btn-start.primary{background:#c97a4a;color:#1a0800}
.btn-start.primary:hover{background:#e8a87a}
.btn-shuffle{border:1.5px solid #8a9bb0;background:transparent;color:#8a9bb0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-shuffle:hover{background:rgba(138,155,176,.1)}

/* ===== RESULT SCREEN ===== */
.result-screen{text-align:center;padding:36px 16px}
.result-title{font-size:24px;font-weight:700;color:#e8e0d0;margin-bottom:16px}
.result-score{font-size:36px;font-weight:700;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-retry:hover{background:rgba(201,122,74,.12)}

/* ===== BOOKMARK LIST ===== */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-acc{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:1px}
.bm-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.bm-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.bm-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0;flex:1;min-width:0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2434;border:1px solid #283848;border-radius:8px;padding:10px 18px;font-size:13px;color:#e8e0d0;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#3dbe82;color:#3dbe82}
.toast.error{border-color:#e05050;color:#e05050}
.toast.warn{border-color:#c9a84c;color:#c9a84c}

/* ===== RESUME MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999}
.modal{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:24px;max-width:400px;width:90vw}
.modal-title{font-size:16px;font-weight:700;color:#e8e0d0;margin-bottom:12px}
.modal-desc{font-size:14px;color:#a0b0c0;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-modal{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-modal.primary{border-color:#c97a4a;color:#c97a4a}
.btn-modal:hover{background:rgba(138,155,176,.1)}
.btn-modal.primary:hover{background:rgba(201,122,74,.12)}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .3s ease}
</style>
</head>
<body>
<div class="app">

<!-- ===== GOOGLE DRIVE SYNC BAR ===== -->
<div class="sync-bar">
  <div class="sync-status">
    <div id="syncDot" class="sync-dot"></div>
    <span id="syncStatusText">Googleアカウントで同期</span>
    <div id="syncUser" class="sync-user"></div>
  </div>
  <div class="sync-btns">
    <button id="btnSignIn" class="btn-gsign" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <button id="btnManualSync" class="btn-sync" onclick="manualSync()">↑↓ 同期</button>
    <button id="btnSignOut" class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>社労士試験対策</h1>
  <div id="appTitle" class="title">雇用保険法 一問一答</div>
  <div id="appSubtitle" class="subtitle">択一式90問</div>
</div>

<!-- ===== NAV TABS ===== -->
<div class="nav-tabs">
  <button id="tabMain"  class="nav-tab active" onclick="showMain()">学習</button>
  <button id="tabBookmarks" class="nav-tab" onclick="showBookmarks()">栞<span id="bmBadge" class="bm-badge" style="display:none">0</span></button>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="screenMain" class="screen show">

<!-- ===== PROGRESS BAR ===== -->
<div id="progressWrap" class="progress-wrap" style="display:none">
  <div class="progress-info">
    <div id="progressNum" class="progress-num">0 / 0</div>
    <div id="progressScore" class="progress-score">正解: 0問</div>
  </div>
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill" style="width:0%"></div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="startScreen" class="start-screen">
  <span id="startCount" class="start-count">90</span>
  <span class="start-unit">問</span>
  <div class="start-desc">労働保険徴収法の知識を一問一答で確認しよう。<br>択一式90問を収録（TAC 60問＋LEC公開模試第1回 30問）。</div>
  
  <!-- フィルター -->
  <div class="filters">
    <div class="filter-label">出題範囲</div>
    <div id="filterBtns" class="filter-btns">
      <button class="btn-filter active" data-cat="all">すべて</button>
    </div>
  </div>

  <!-- ランダム出題モード -->
  <div class="random-mode">
    <div class="random-input-wrap">
      <input id="randomInput" class="random-input" type="number" value="10" min="1" max="90" oninput="updateRandomBtn()">
      <span class="random-label">問をランダムで出題</span>
    </div>
    <button id="btnRandomStart" class="btn-start" onclick="startRandom()">10問ランダムで出題</button>
  </div>

  <!-- 栞ランダム出題モード -->
  <div id="bookmarkRandomMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="bookmarkRandomInput" class="random-input" type="number" value="10" min="1" max="110" oninput="updateBookmarkRandomBtn()">
      <span class="random-label">問を栞からランダムで出題</span>
    </div>
    <button id="btnBookmarkRandomStart" class="btn-start" onclick="startBookmarkRandom()">栞から10問ランダムで出題</button>
  </div>

  <!-- ボタン群 -->
  <div class="start-btns">
    <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
    <button id="btnResumeStart" class="btn-start" onclick="resumeSession()" style="display:none">▶ 続きから開始</button>
    <button id="btnWeakStart" class="btn-start" onclick="startWeak()" style="display:none">正答率50%以下の問題を出題</button>
    <button id="btnLeastTried" class="btn-start" onclick="startLeastTried()" style="display:none">挑戦回数が少ない問題を出題</button>
    <button class="btn-start primary" onclick="start()">学習スタート</button>
    <button id="btnBookmarkStart" class="btn-start" onclick="startBookmarks()" style="display:none">栞の問題のみ</button>
  </div>
</div>

<!-- ===== QUESTION SCREEN ===== -->
<div id="questionScreen" class="screen">
  <div class="card">
    <div class="q-meta">
      <span id="qTag" class="q-tag">択一式（雇用保険法）</span>
      <span id="qTypeBadge" class="q-type-badge"></span>
      <span id="qNum" class="q-num"></span>
      <span id="qAcc" class="q-acc"></span>
      <span id="qTries" class="q-tries"></span>
    </div>
    <div id="qText" class="q-text"></div>
    <button id="btnBookmark" class="btn-bookmark" onclick="toggleBookmark()">☆</button>
  </div>

  <!-- ○× ボタン -->
  <div id="oxRow" class="btn-row">
    <button id="btnMaru" class="btn-answer btn-maru" onclick="answerOx(true)">
      <div>○</div><div class="btn-label">正しい</div>
    </button>

{no:"1雇徴-問9",opt:"A",q:"日雇労働被保険者は、事業主に使用されたときは、その都度雇用保険印紙の貼付又は印紙保険料納付計算器による納付印の押なつを受けるために、その所持する日雇労働被保険者手帳を事業主に提出しなければならない。",a:true,exp:"設問のとおり正しい。日雇労働被保険者は使用されるたびに、雇用保険印紙の貼付等のため手帳を事業主に提出しなければならない。",src:"則39条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"B",q:"事業主は、雇用保険印紙を購入しようとするときは、あらかじめ、所定の事項を記載した申請書を所轄公共職業安定所長に提出して、雇用保険印紙購入通帳の交付を受けなければならない。",a:true,exp:"設問のとおり正しい。雇用保険印紙の購入には、事前に購入通帳の交付を受ける必要がある。",src:"則42条1項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"C",q:"事業主は、日雇労働被保険者を使用しなくなったときは、その使用しなくなった日から1年間に限り、その保有する雇用保険印紙の買戻しを申し出ることができる。",a:false,exp:"「1年間に限り」が誤り。雇用保険印紙の買戻しの期限は特に定められておらず、使用しなくなったときはいつでも申し出ることができる。なお買戻しの申出は日本郵便株式会社の営業所で購入通帳を提出して行う。",src:"則43条2項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"D",q:"雇用保険印紙購入通帳の交付を受けている事業主は、所定の事項を記載した報告書によって、毎月における雇用保険印紙の受払状況を翌月末日までに、所轄都道府県労働局歳入徴収官に報告しなければならない。",a:true,exp:"設問のとおり正しい。毎月の雇用保険印紙の受払状況について、翌月末日までに報告が必要である。",src:"則24条、則54条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"E",q:"事業主が、正当な理由がないと認められるにもかかわらず、印紙保険料の納付を怠ったときは、その納付を怠った印紙保険料の額が1,000円未満であるときを除き、政府は、その納付すべき印紙保険料の額として決定した額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）の100分の25に相当する額の追徴金を徴収する。",a:true,exp:"設問のとおり正しい。正当な理由なく印紙保険料の納付を怠った場合、100分の25相当額の追徴金が徴収される。",src:"法25条2項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"A",q:"労働保険事務組合として認可を受けた事業主の団体又はその連合団体に労働保険事務の処理を委託することができるのは、その団体の構成員又はその連合団体を構成する団体の構成員である事業主だけではなく、労働保険事務の処理を当該労働保険事務組合に委託することが必要であると認められる事業主が含まれる。",a:true,exp:"設問のとおり正しい。労働保険事務組合への委託は、団体の構成員に限らず、委託が必要と認められる他の事業主（例えば当該団体の賛助会員）も含まれる。",src:"法33条1項、則62条1項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"B",q:"労働保険事務組合は、委託を受けて行う労働保険事務の処理の業務を廃止したときは、当該事実があった日の翌日から起算して60日以内に、その旨を厚生労働大臣に届け出なければならない。",a:false,exp:"「廃止したときは...60日以内」が誤り。正しくは「廃止しようとするときは、廃止しようとする日の60日前まで」に厚生労働大臣に届け出なければならない（事前届出）。",src:"法33条3項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"C",q:"労働保険事務組合に委託することができる労働保険事務には、労災保険の保険給付及び特別支給金に関する請求書等に係る事務手続、雇用保険の印紙保険料、被保険者に関する事務、保険給付に関する請求書等及び雇用保険二事業に係る事務手続は含まれない。",a:false,exp:"「被保険者に関する事務」が誤り。雇用保険の被保険者に関する事務は、労働保険事務組合に委託することができる労働保険事務に含まれる。なお、その他の記述（労災保険の保険給付及び特別支給金に関する請求書等に係る事務手続、雇用保険の印紙保険料、保険給付に関する請求書等及び雇用保険二事業に係る事務手続が含まれないこと）は正しい。",src:"法33条1項、平成12.3.31発徴31号",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"D",q:"事業主が労働保険事務組合に労働保険事務の処理を委託した場合であっても、政府が行う労働保険関係法令の規定による労働保険料の納入の告知その他の通知及び還付金の還付については、これを直接当該事業主に対してしなければならない。",a:false,exp:"「直接事業主に対してしなければならない」が誤り。委託された場合、政府は労働保険料の納入告知等の通知及び還付金の還付について、労働保険事務組合に対して行うことができ、この場合は事業主に対してしたものとみなされる。",src:"法34条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"E",q:"労働保険関係法令の規定により政府が追徴金又は延滞金を徴収する場合において、その徴収について労働保険事務組合の責めに帰すべき理由があるときは、その限度で、労働保険事務組合は、政府に対して当該徴収金の納付の責めに任ずるものとされており、この場合には、労働保険事務組合が納付すべき徴収金について、事業主が納付責任を負うことはない。",a:false,exp:"「事業主が納付責任を負うことはない」が誤り。労働保険事務組合が納付すべき徴収金について、当該組合に対して滞納処分をしてもなお徴収すべき残余がある場合に限り、その残余の額を当該事業主から徴収することができるとされており、事業主も責任を負う場合がある。",src:"法35条2項、3項",cat:"択一式（第1予想 雇徴）"},
{no:"1労徴-問8",opt:"A",q:"常時3人の労働者を使用する個人経営の林業の事業は、労災保険暫定任意適用事業であり、当該事業の事業主が任意加入の申請をし、厚生労働大臣の認可があったときは、その日に労災保険に係る保険関係が成立する。",a:false,exp:"常時3人の労働者を使用する個人経営の林業の事業は、労災保険暫定任意適用事業ではなく、労災保険の（強制）適用事業である。なお、労災保険暫定任意適用事業については、事業主が任意加入の申請をし、厚生労働大臣の認可があったときは、その日に労災保険に係る保険関係が成立する。",src:"(44)労災保険法附則12条、整備法5条1項、整備政令17条、平成12.12.25厚労告120条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"B",q:"労災保険法第3条第1項の適用事業に該当する事業が労災保険暫定任意適用事業に該当するに至ったときは、その日に、その事業につき厚生労働大臣の認可があったものとみなす。",a:false,exp:"設問の場合、「その翌日」に、その事業につき厚生労働大臣の（任意加入の）認可があったものとみなす。",src:"整備法5条3項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"C",q:"常時3人の労働者を雇用する個人経営の林業の事業であって、雇用保険に係る保険関係が成立している暫定任意適用事業の事業主は、当該労働者のうち2人の同意を得れば、当該保険関係の消滅の申請を行うことができる。",a:false,exp:"雇用保険に係る保険関係が成立している雇用保険暫定任意適用事業の保険関係の消滅の申請については、その事業に使用される労働者の4分の3以上の同意を得なければ行うことができない。設問の場合、3人の労働者のうち2人の同意（3分の2の同意）であるから、保険関係の消滅の申請を行うことはできない。",src:"法附則4条、雇用保険法附則2条、同法施行令附則2条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"D",q:"雇用保険に係る保険関係が成立していない雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者の2分の1以上が希望する場合には、任意加入の申請をしなければならないが、これに違反して申請をしなかったときであっても、罰則の適用はない。",a:false,exp:"設問の違反については、罰則（6月以下の拘禁刑又は30万円以下の罰金）が適用される。なお、労災保険に係る保険関係が成立していない労災保険暫定任意適用事業の事業主は、その事業に使用される労働者の過半数が希望する場合には、任意加入の申請をしなければならないが、これに違反して申請をしなかったときであっても、罰則の適用はない。",src:"法附則2条3項、7条1項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"E",q:"労災保険に係る保険関係が成立している労災保険暫定任意適用事業の事業主は、当該保険関係の消滅の申請をしようとする場合には、当該事業に使用される労働者の過半数の同意を得たことを証明することができる書類を添えて、所定の申請書を所轄都道府県労働局長に提出しなければならない。",a:true,exp:"設問の通り正しい。なお、設問の申請書の提出は、所轄労働基準監督署長を経由して行うものとされている。",src:"整備法8条1項、2項、整備省令3条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"A",q:"労働保険徴収法において「賃金」とは、賃金、給料、手当、賞与その他名称のいかんを問わず、労働の対償として事業主が労働者に支払うもの（3か月を超える期間ごとに受けるものを除く。）をいう。",a:false,exp:"「3か月を超える期間ごとに受けるものを除く」とする記述が誤りである。労働保険徴収法において「賃金」とは、賃金、給料、手当、賞与その他名称のいかんを問わず、労働の対償として事業主が労働者に支払うもの（通貨以外のもので支払われるものであって、厚生労働省令で定める範囲外のものを除く。）をいう。なお、賃金のうち通貨以外のもので支払われるものの評価に関し必要な事項は、厚生労働大臣が定めることとされており、また、賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、所轄労働基準監督署長又は所轄公共職業安定所長の定めるところによることとされている。",src:"法2条2項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"B",q:"労働基準法の規定による休業手当、年次有給休暇中の賃金及び解雇予告手当は、同法上使用者にその支払が義務付けられているものであり、労働保険徴収法上の賃金に該当する。",a:false,exp:"休業手当及び年次有給休暇中の賃金については賃金に該当するが、解雇予告手当については賃金に該当しない。なお、労働基準法の規定による休業補償、健康保険法の規定による傷病手当金についても、賃金に該当しない。",src:"法2条2項、昭和23.8.18基収2520号、昭和25.4.10基収950号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"C",q:"労働者が業務外の疾病又は負傷のため勤務に服することができないため、事業主から支払われる手当金や、個人的、臨時的な吉凶禍福に対して支払われる結婚祝金、死亡弔慰金、災害見舞金は、労働協約、就業規則等で労働者の権利として保障されているときは、労働保険徴収法上の賃金に該当する。",a:false,exp:"個人的、臨時的な吉凶禍福に対して支払われる結婚祝金、死亡弔慰金、災害見舞金は、労働協約、就業規則等で労働者の権利として保障されているときであっても、労働保険徴収法上の賃金に該当しない。なお、労働者が業務外の疾病又は負傷のため勤務に服することができないため、事業主から支払われる手当金は、労働協約、就業規則等で労働者の権利として保障されているときは、賃金に該当する（労働協約、就業規則等に定められておらず、単に恩恵的に見舞金として支給されている場合は、賃金に該当しない。）。",src:"法2条2項、昭和24.6.14基災収3850号、昭和25.2.16基発127号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"D",q:"労働者が在職中に、退職金相当額の全部又は一部を給与や賞与に上乗せするなど前払いされる場合は、労働の対償としての性格が明確であり、労働者の通常の生計にあてられる経常的な収入としての意義を有することから、原則として、一般保険料の算定基礎となる賃金総額に算入することとされている。",a:true,exp:"設問の通り正しい。なお、退職を事由として支払われる退職金であって、退職時に支払われるもの又は事業主の都合等により退職前に一時金として支払われるものについては、一般保険料の算定基礎となる賃金総額に算入しないこととされている。",src:"法2条2項、11条1項、2項、平成15.10.1基徴発1001001号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"E",q:"6月になってベースアップが1月に遡って行われることが決まり、各労働者の賃金の1月から6月までの差額及び支給が確定して6月に現実に支払われるような場合、4月から6月までの差額分は当保険年度の賃金総額に算入し、1月から3月までの差額分は前保険年度の賃金総額に算入することとなる。",a:false,exp:"設問の場合、1月から6月までの差額分は「賃金差額の支給が確定した日の属する年度」（6月に支給が確定しているので、当保険年度）の賃金総額に算入することとなる。",src:"法2条2項、11条1項、2項、昭和33.10.9基収5571号の2",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"ア",q:"【延滞金を徴収しない事由として正しいか】延滞金の額が1,000円未満であるとき。",a:false,exp:"延滞金の額が「100円未満」であるときは、延滞金は徴収されない。",src:"法28条5項3号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"イ",q:"【延滞金を徴収しない事由として正しいか】納期を繰り上げて徴収するとき。",a:false,exp:"設問のような規定は設けられていない。延滞金が徴収されない事由は、次のとおりである。①督促状に指定した期限までに労働保険料その他労働保険徴収法の規定による徴収金を完納したとき。②納付義務者の住所又は居所がわからないため、公示送達の方法によって督促したとき。③労働保険料の額が1,000円未満であるとき。④延滞金の額が100円未満であるとき。⑤労働保険料について滞納処分の執行を停止し、又は猶予したとき（その執行を停止し、又は猶予した期間に対応する部分の金額に限る。）。⑥労働保険料を納付しないことについてやむを得ない理由があると認められるとき。",src:"法28条5項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"ウ",q:"【延滞金を徴収しない事由として正しいか】督促状に指定した期限までに労働保険料その他労働保険徴収法の規定による徴収金を完納したとき。",a:true,exp:"設問の通り正しい。",src:"法28条5項1号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"エ",q:"【延滞金を徴収しない事由として正しいか】納付義務者の住所又は居所がわからないため、公示送達の方法によって督促したとき。",a:true,exp:"設問の通り正しい。",src:"法28条5項2号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"オ",q:"【延滞金を徴収しない事由として正しいか】労働保険料について滞納処分の執行を停止し、又は猶予したとき（その執行を停止し、又は猶予した期間に対応する部分の金額に限る。）。",a:true,exp:"設問の通り正しい。",src:"法28条5項4号",cat:"択一式（第1予想 労徴）"},
{no:"2雇徴-問8",opt:"A",q:"令和7年度の賃金総額の確定額が1億4,000万円、令和8年度の賃金総額の見込額が7,000万円である継続事業の場合、令和8年度の概算保険料である一般保険料は、7,000万円に一般保険料率を乗じて得た額となる。",a:false,exp:"「7,000万円」が誤り。継続事業の概算保険料は、前年度確定額の100分の50以上かつ100分の200以下の場合は前年度確定額を使用する。7,000万円は1億4,000万円の50%であり、この要件を満たすため令和8年度の概算保険料は「1億4,000万円に保険料率を乗じた額」となる。",src:"法15条1項1号、則24条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"B",q:"令和7年度の第1種特別加入者に係る保険料算定基礎額の確定額が3,000万円、令和8年度の第1種特別加入者に係る保険料算定基礎額の見込額が7,000万円である継続事業の場合、令和8年度の概算保険料である第1種特別加入保険料は、その事業に使用される労働者の賃金総額の増減の割合にかかわらず、7,000万円に第1種特別加入保険料率を乗じて得た額となる。",a:true,exp:"設問のとおり正しい。第1種特別加入保険料の概算保険料は、労働者の賃金総額増減にかかわらず、当年度見込額に保険料率を乗じて算定する（見込額は前年確定の200%超のため見込額を使用）。",src:"法15条1項2号、則24条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"C",q:"確定保険料申告書の記載に誤りがあり、政府が確定保険料を決定した場合において、既に納付した概算保険料の額が政府の決定した確定保険料の額に足りず、1万4,700円不足しているときは、その不足額のほか、1,470円の追徴金が徴収されることとなる。",a:false,exp:"「1,470円」が誤り。追徴金は不足額（その額に1,000円未満の端数があるときは端数を切り捨てた額）に100分の10を乗じた額となる。設問の場合、1万4,700円の端数700円を切り捨てた1万4,000円×10%=1,400円が追徴金となる。",src:"法19条5項、21条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"D",q:"確定保険料申告書の記載に誤りがあり、政府が確定保険料を決定した場合において、既に納付した概算保険料の額が政府の決定した確定保険料の額に足りないためその不足額を納付する場合には、政府の承認を受けて口座振替により納付することができる。",a:false,exp:"いわゆる認定決定による確定保険料は、口座振替により納付することはできない。口座振替により納付することができるのは概算保険料（延納する場合を含む。）及び確定保険料である。認定決定による概算保険料・確定保険料、増加概算保険料、印紙保険料、特例納付保険料等については、口座振替により納付することはできない。",src:"法21条の2、1項、則38条の4",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"E",q:"事業主が納付した概算保険料の額が、確定保険料の額を超える場合には、政府は、その超える額を還付しなければならない。",a:false,exp:"「還付しなければならない」が誤り。概算保険料が確定保険料を超える場合、政府は超える額を「次の保険年度の労働保険料等に充当し、又は還付する」ものとされており、無条件に還付義務があるわけではない。なお事業主が還付を請求した場合は還付される。",src:"法19条6項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"A",q:"特例納付保険料の対象事業主（以下本問において「対象事業主」という。）は、雇用保険法第22条第5項に規定する特例対象者を雇用していた事業主のうち、雇用保険に係る保険関係が成立していたにもかかわらず、保険関係成立の届出をしていなかった事業主に限られる。",a:true,exp:"設問のとおり正しい。特例納付保険料の対象事業主は、保険関係が成立していたにもかかわらず届出をしていなかった事業主に限られる。",src:"法26条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"B",q:"厚生労働大臣は、対象事業主に対して、特例納付保険料の納付を勧奨しなければならない。ただし、やむを得ない事情のため当該勧奨を行うことができない場合は、この限りでない。",a:true,exp:"設問のとおり正しい。厚生労働大臣は対象事業主に特例納付保険料の納付を勧奨しなければならないが、やむを得ない事情の場合は例外が認められる。",src:"法26条2項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"C",q:"所轄都道府県労働局歳入徴収官は、対象事業主から特例納付保険料の納付の申出を受けた場合には、特例納付保険料の額を決定し、これを当該対象事業主に通知するものとされており、対象事業主は、その通知を受けた日から15日以内に特例納付保険料を納付しなければならない。",a:false,exp:"「15日以内」が誤り。対象事業主は通知に定める納期限（「当該納期限まで」）に特例納付保険料を納付しなければならない。「15日以内」という規定はない。なお通知は納入告知書によって行われる。",src:"法26条4項、5項、則59条",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"D",q:"特例納付保険料は、日本銀行又は都道府県労働局収入官吏に納付しなければならない。",a:true,exp:"設問のとおり正しい。特例納付保険料は日本銀行（本店・支店・代理店・歳入代理店）又は都道府県労働局収入官吏に納付しなければならない。",src:"則38条3項2号",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"E",q:"対象事業主がその納付の申出をした特例納付保険料を納付しないときは、労働保険徴収法第27条の督促の対象となり、また、同法第28条の延滞金の対象にもなる。",a:true,exp:"設問のとおり正しい。特例納付保険料を納付しない場合は督促及び延滞金の対象となる。",src:"法26条、27条、28条",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"ア",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「介護補償給付の額」は正しいか。",a:false,exp:"「含まれないもの」として誤り。介護補償給付の額はメリット制の収支率の算定基礎に含まれる。なお、含まれないものはイ（二次健康診断等給付）・エ（特定疾病業務災害）・オ（複数業務要因災害）の3つ（正解C三つ）。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"イ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「二次健康診断等給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。二次健康診断等給付の額はメリット制の収支率の算定基礎に含まれない。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"ウ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「労働者の死亡の当時遺族補償年金を受けることができる遺族がない場合における遺族補償一時金の額」は正しいか。",a:false,exp:"「含まれないもの」として誤り。遺族がない場合の遺族補償一時金はメリット制の収支率の算定基礎に含まれる。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"エ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「特定疾病にかかった者に係る業務災害に関する保険給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。特定疾病（じん肺等）にかかった者に係る業務災害に関する保険給付の額は、メリット制の収支率の算定基礎に含まれない。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"オ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「複数業務要因災害に関する保険給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。複数業務要因災害に関する保険給付の額はメリット制の収支率の算定基礎に含まれない（複数業務要因災害は特定の事業主の責任に帰せられないため）。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2労徴-問8",opt:"A",q:"労災保険に係る保険関係が成立している事業のうち請負による建設の事業であって、賃金総額を正確に算定することが困難なものについては、その事業の種類に従い、請負金額（消費税等相当額を除く。以下同じ。）に労務費率を乗じて得た額を賃金総額とするが、機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれていない場合には、その機械装置の価額に相当する額（消費税等相当額を除く。）をその請負代金の額（消費税等相当額を除く。）に加算した額を請負金額とする。",a:false,exp:"設問の後半部分が誤りである。機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれていない場合には、その機械装置の価額に相当する額（消費税等相当額を除く。以下同じ。）をその請負代金の額（消費税等相当額を除く。以下同じ。）に加算しない額が請負金額（消費税等相当額を除く。以下同じ。）となる。なお、機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれている場合には、その機械装置の価額に相当する額をその請負代金の額から「控除」した額を請負金額とする。なお、機械装置の組み立て又はすえ付けの事業以外の建設の事業の請負金額については、事業主が注文者その他の者からその事業に使用する物の支給を受け、又は機械器具等の貸与を受けた場合には、支給された物の価額に相当する額（消費税等相当額を除く。）又は機械器具等の損料に相当する額（消費税等相当額を除く。）を請負代金の額に加算した額となる。",src:"法11条3項、則12条1号、13条、昭和58.2.21労告14号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"B",q:"労災保険に係る保険関係が成立している事業のうち造林の事業、木炭又は薪を生産する事業その他の林業の事業については、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。",a:false,exp:"労災保険に係る保険関係が成立している事業のうち「立木の伐採の事業」であって、賃金総額を正確に算定することが困難なものについては、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。なお、労災保険に係る保険関係が成立している事業のうち造林の事業、木炭又は薪を生産する事業その他の林業の事業（立木の伐採の事業を除く。）であって、賃金総額を正確に算定することが困難なものについては、その事業の労働者につき労働基準法の規定に基づき厚生労働大臣が定める平均賃金に相当する額に、それぞれの労働者の使用期間の総日数を乗じて得た額の合算額を賃金総額とする。",src:"法11条3項、則12条2号、3号、14条、15条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"C",q:"政府は、労働保険の事業に要する費用にあてるため保険料を徴収するものとされており、徴収する保険料（「労働保険料」という。）は、労災保険料、雇用保険料、第1種特別加入保険料、第2種特別加入保険料、第3種特別加入保険料、印紙保険料及び特例納付保険料とされている。",a:false,exp:"徴収する保険料（労働保険料）は、「一般保険料」、第1種特別加入保険料、第2種特別加入保険料、第3種特別加入保険料、印紙保険料及び特例納付保険料とされている。労働保険徴収法における労働保険料には、労災保険料、雇用保険料という概念はない（それぞれ一般保険料の額のうち労災保険率に応ずる部分の額、一般保険料の額のうち雇用保険率に応ずる部分の額である。）。",src:"法10条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"D",q:"労災保険率は、労災保険法の適用を受ける全ての事業の過去3年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定めるものとされており、二次健康診断等給付に要した費用の額は考慮されない。",a:false,exp:"「二次健康診断等給付に要した費用の額は考慮されない」とする部分が誤りである。労災保険率は、労災保険法の適用を受ける全ての事業の過去3年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに「二次健康診断等給付に要した費用の額」、社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定める。なお、特別加入保険料率については、特別加入者に二次健康診断等給付が行われないことから、二次健康診断等給付に要した費用の額は考慮されない（第1種特別加入保険料率は、二次健康診断等給付に要した費用の額を考慮して厚生労働大臣の定める率を減じる）こととなる。",src:"法12条2項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"E",q:"雇用保険率は、失業等給付費等充当徴収保険率、育児休業給付費充当徴収保険率及び二事業費充当徴収保険率を合計して得た率である。",a:true,exp:"設問の通り正しい。",src:"法12条4項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"A",q:"既に有期事業として単独で保険関係が成立している事業については、労働保険徴収法第7条に規定する有期事業の一括の要件に該当する場合であっても、一括の対象とならない。",a:true,exp:"設問の通り正しい。当初、独立の有期事業として保険関係が成立した事業は、その後事業の規模の変更等があった場合でも、一括扱いの対象とならない。また、有期事業の一括により一括された個々の事業については、その後、事業の規模の変更等があった場合でも、あくまで当初の一括扱いによることとされ、新たに独立の有期事業として取り扱われない。",src:"法7条、昭和40.7.31基発901号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"B",q:"有期事業の一括に係る個々の事業については、それぞれの事業が労災保険率表に定める労災保険率を同じくしていれば、必ずしも事業の種類を同じくしていなくとも、他の要件を満たす限り一括の対象となる。",a:false,exp:"有期事業の一括の対象とされるには、それぞれの事業が、労災保険率表に掲げる事業の種類を同じくすることが必要である。",src:"法7条5号、則6条2項2号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"C",q:"9月1日に保険関係が成立した一括有期事業について、当該事業に係る労働保険事務の処理が労働保険事務組合に委託されておらず、納付すべき概算保険料の額が30万円である場合、当該事業の事業主は、当該概算保険料を延納することができる。",a:true,exp:"設問の通り正しい。一括有期事業については、継続事業と同様の方法により概算保険料の延納が行われるが、次に掲げる場合には、事業主が概算保険料申告書を提出する際に申請をすることにより、概算保険料を延納することができる。設問の事業は、一括有期事業なので、労災保険に係る保険関係のみが成立している事業に該当することに注意。①納付すべき概算保険料の額が40万円（労災保険に係る保険関係又は雇用保険に係る保険関係のみが成立している事業については、20万円）以上である場合又は当該事業に係る労働保険事務の処理が労働保険事務組合に委託されている場合 ②当該保険年度において10月1日以降に保険関係が成立した事業ではない場合（9月30日までに保険関係が成立した事業である場合）",src:"法18条、則27条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"D",q:"労働保険徴収法第9条の規定により継続事業の一括に係る厚生労働大臣の認可を受けた場合であっても、一括された個々の事業（以下「被一括事業」という。）における雇用保険の被保険者に関する事務は、それぞれの被一括事業の所轄公共職業安定所長が行うこととなる。",a:true,exp:"設問の通り正しい。継続事業の一括の認可が行われた場合、労働保険徴収法の規定の適用については、当該認可に係る2以上の事業に使用されるすべての労働者は、これらの事業のうち厚生労働大臣が指定するいずれか一の事業に使用される労働者とみなすこととされているが、労災保険法の規定によるもの（労災保険の給付）及び雇用保険法の規定によるもの（雇用保険の被保険者及び給付）については一括の効果は及ばないので、これらの事務は、それぞれの被一括事業の所轄労働基準監督署長等又は所轄公共職業安定所長が行う。",src:"法9条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"E",q:"継続事業の一括に係る厚生労働大臣が指定する事業（以下「指定事業」という。）の事業の名称又は事業の行われる場所に変更があった場合には、その変更を生じた日の翌日から起算して10日以内に、所定の事項を記載した届書を所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない。",a:true,exp:"設問の通り正しい。指定事業の事業の名称又は事業の行われる場所に変更があった場合には、その変更を生じた日の翌日から起算して10日以内に、名称、所在地等変更届を所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない。なお、被一括事業の事業の名称又は当該事業の行われる場所に変更があったときは、遅滞なく、継続被一括事業名称・所在地変更届を、指定事業に係る所轄都道府県労働局長に提出しなければならない。",src:"法4条の2,2項、則5条1項、2項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"A",q:"事業主が概算保険料申告書を提出せず、政府が決定した概算保険料を納付しなければならない場合には、政府は、原則としてその納付すべき額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）に100分の10を乗じて得た額の追徴金を徴収する。",a:false,exp:"政府が決定した概算保険料（認定決定による概算保険料）については、追徴金は徴収されない。なお、事業主が確定保険料申告書を提出しないため、政府が決定した確定保険料（認定決定による確定保険料）を納付しなければならない場合には、政府は、原則としてその納付すべき額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）に100分の10を乗じて得た額の追徴金を徴収する。",src:"法21条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"B",q:"追徴金を納付しない者があるときは、政府は、期限を指定して督促しなければならない。",a:true,exp:"設問の通り正しい。労働保険料その他労働保険徴収法の規定による徴収金を納付しない者があるときは、政府は、期限を指定して督促しなければならないとされており、ここにいう「徴収金」には、追徴金も含まれる。なお、追徴金の督促が行われた場合であっても、追徴金について延滞金が徴収されることはない。",src:"法27条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"C",q:"政府は、一般保険料率の引上げを行ったときは、労働保険料を追加徴収するが、この場合には、事業主に対して、期限を指定して、その納付すべき労働保険料の額を納付書により通知しなければならない。",a:true,exp:"設問の通り正しい。なお、設問の場合（労働保険料を追加徴収しようとする場合）、具体的には、所轄都道府県労働局歳入徴収官が、通知を発する日から起算して30日を経過した日をその納期限と定め、事業主に、所定の事項を納付書により通知しなければならないとされている。",src:"法17条、則38条4項、5項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"D",q:"事業主は、被保険者に賃金を支払う都度、当該賃金に応ずる被保険者の負担すべき一般保険料の額に相当する額を当該賃金から控除することができるが、日雇労働被保険者については、当該賃金に応ずる日雇労働被保険者の負担すべき一般保険料の額に相当する額のほか、印紙保険料の額の2分の1の額に相当する額を当該賃金から控除することができる。",a:true,exp:"設問の通り正しい。なお、賃金からの控除を行う場合、事業主は、一般保険料控除計算簿を作成し、事業場ごとにこれを備えなければならない。",src:"法32条1項、則60条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"E",q:"労働保険料その他労働保険徴収法の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。",a:true,exp:"設問の通り正しい。なお、労働保険料その他労働保険徴収法の規定による徴収金は、労働保険徴収法に別段の定めがある場合を除き、国税徴収の例により徴収することとされている。",src:"法29条",cat:"択一式（第2予想 労徴）"},
{no:"LEC1労徴-問8",opt:"A",q:"事業主から労働者に対して住居施設等が無償で供与される場合において、住居施設等が供与されない労働者に対して、住居の利益を受ける者との均衡を失しない定額の均衡手当が一律に支給されない場合は、当該住居の利益は労働保険徴収法における賃金に該当しない。",a:true,exp:"本肢のとおり正しい（労働保険徴収法2条2項ほか）。なお、賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、所轄労働基準監督署長又は所轄公共職業安定所長の定めるところによる。",src:"法2条2項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"B",q:"事業主が社会保険料、所得税等の労働者負担分を労働協約等の定めによって義務づけられて負担した場合、その負担額に相当する部分は、労働保険徴収法における賃金に該当しない。",a:false,exp:"事業主が社会保険料、所得税等の労働者負担分を労働協約等の定めによって義務づけられて負担した場合、その負担額に相当する部分は、賃金に「該当する」（昭51.3.31労徴発12号）。",src:"昭51.3.31労徴発12号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"C",q:"事業主の定めた奉仕料がいったん客から徴収され、集計されて後に労働者に対して再分配されるものは、労働保険徴収法における賃金に該当しない。",a:false,exp:"事業主の定めた奉仕料がいったん客から徴収され、集計されて後に労働者に対して再分配されるものは、賃金に「該当する」（昭39.5.21基収3343号）。",src:"昭39.5.21基収3343号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"D",q:"結婚祝金、死亡弔慰金、災害見舞金など個人的、臨時的な吉凶禍福に対して支給されるものであって、それが労働協約等によって事業主にその支給が義務づけられているものである場合、労働保険徴収法における賃金に該当する。",a:false,exp:"結婚祝金、死亡弔慰金、災害見舞金など個人的、臨時的な吉凶禍福に対して支給されるものは、それが労働協約等によって事業主にその支給が義務づけられているものであっても、賃金に「該当しない」（昭25.2.16基発127号）。",src:"昭25.2.16基発127号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"E",q:"労働者の退職後の生活保障や在職中の死亡保障を行うことを目的として事業主が労働者を被保険者として保険会社と生命保険等の契約をし、会社が当該保険の保険料を全額負担した場合の当該保険料は、労働保険徴収法の賃金に該当する。",a:false,exp:"労働者の退職後の生活保障や在職中の死亡保障を行うことを目的として事業主が労働者を被保険者として保険会社と生命保険等の契約をし、会社が当該保険の保険料を全額負担した場合の当該保険料は、賃金に「該当しない」（昭30.3.31基災収1239号）。",src:"昭30.3.31基災収1239号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"ア",q:"概算保険料を納付しなかったことによる当該概算保険料の認定決定の通知は、納入告知書によって行われる。",a:false,exp:"概算保険料の認定決定の通知は「納付書」によって行われる（労働保険徴収法施行規則38条4項・5項）。なお、概算保険料の認定決定の通知を受けた事業主は、通知を受けた日から15日以内に、当該認定決定された概算保険料又はその不足額を納付しなければならない（法15条4項）。",src:"則38条4項・5項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"イ",q:"労災保険に係る保険関係が成立している立木の伐採の事業であって賃金総額を正確に算定することが困難なものについては、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。",a:true,exp:"本肢のとおり正しい（則12条、則14条）。",src:"則12条・14条",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"ウ",q:"労災保険に係る保険関係のみが成立していた事業主について、雇用保険に係る保険関係も成立することとなったため、増加概算保険料の納付の要件に該当するに至った場合において、当該事業主が増加概算保険料申告書を提出しないとき、又は提出した増加概算保険料申告書の記載に誤りがあると認められるときは、所轄都道府県労働局歳入徴収官は、増加概算保険料の額を決定し、これを当該事業主に通知しなければならない。",a:false,exp:"増加概算保険料については「認定決定は行われない」（法15条3項、法16条）。",src:"法15条3項・16条",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"エ",q:"事業主が確定保険料を納付しなかったために当該確定保険料について認定決定が行われた場合、当該事業主が口座振替納付の承認を受けていた場合であっても、当該認定決定された確定保険料は口座振替によって納付することはできない。",a:true,exp:"本肢のとおり正しい（則38条の4）。",src:"則38条の4",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"オ",q:"労災保険に係る保険関係が成立している労災保険暫定任意適用事業の事業主は、当該保険関係の消滅の申請をする場合は、その要件の1つとして、当該事業に使用される労働者の過半数の同意を得なければならない。",a:true,exp:"本肢のとおり正しい（整備法8条1項・2項）。",src:"整備法8条1項・2項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"A",q:"第3種特別加入者の当該特別加入に係る事業により業務災害が生じた場合の当該業務災害に係る保険給付の額は、メリット収支率の算定の基礎に算入されない。",a:true,exp:"本肢のとおり正しい（法12条3項）。",src:"法12条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"B",q:"継続事業の令和4年度から令和6年度までの連続する3保険年度間におけるメリット収支率を基礎とした労災保険率の引上げ又は引下げは、令和8年度の労災保険率について行われる。",a:true,exp:"本肢のとおり正しい（法12条3項）。継続事業のメリット制による労災保険率の引上げ又は引下げは、連続する3保険年度中最後の保険年度の次の次の保険年度から行われる。したがって、本肢の場合、令和6年度の次の次の保険年度である令和8年度からメリット制による労災保険率の引上げ又は引下げが行われる。",src:"法12条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"C",q:"連続する3保険年度中の各保険年度において100人以上の労働者を使用する継続事業については、所定の要件を満たせば、継続事業のメリット制が適用されるが、この労働者数には第1種特別加入者も含まれる。",a:true,exp:"本肢のとおり正しい（法12条3項、昭40.11.1基発1454号）。",src:"法12条3項、昭40.11.1基発1454号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"D",q:"一括有期事業である建設の事業についてメリット制の適用を受けるためには、当該保険年度の請負金額の総額が1億1000万円以上でなければならない。",a:false,exp:"一括有期事業である建設の事業についてメリット制の適用を受けるためには、その要件の1つとして、当該保険年度の「確定保険料の額が40万円以上」でなければならない（法12条3項、則17条3項）。",src:"法12条3項、則17条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"E",q:"継続事業の一括（一括されている継続事業の一括を含む。）が行われた場合には、メリット制の適用における労災保険に係る保険関係の成立期間は、一括の認可の時期に関係なく、当該指定事業の労災保険に係る保険関係成立の日から起算するため、当該指定事業以外の事業に係る一括前の保険料及び一括前の災害に係る給付は、当該指定事業のメリット収支率の算定の基礎に算入されない。",a:true,exp:"本肢のとおり正しい（法12条3項ほか）。",src:"法12条3項ほか",cat:"択一式（LEC1 労徴）"},
{no:"LEC1雇徴-問8",opt:"A",q:"特例納付保険料の額は、基本額に加算額を加算した額であるが、この加算額は、基本額に100分の10を乗じて得た額とされている。",a:true,exp:"本肢のとおり正しい（労働保険徴収法26条1項、労働保険徴収法施行規則57条）。",src:"法26条1項、則57条",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"B",q:"保険関係が消滅したため確定保険料申告書を提出しなければならない場合において、既に納付した概算保険料額と確定保険料額が同額であったときは、当該確定保険料申告書を日本銀行（本店、支店、代理店及び歳入代理店をいう。）を経由して所轄都道府県労働局歳入徴収官に提出することはできない。",a:true,exp:"本肢のとおり正しい（則38条1項・2項）。納付すべき確定保険料額がない場合の確定保険料申告書の提出は、日本銀行を経由することはできない。",src:"則38条1項・2項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"C",q:"継続事業の一括に係る認可を受けるためには、一括の申請前にそれぞれの事業について保険関係が成立していなければならないため、暫定任意適用事業について、任意加入の申請と同時に継続事業の一括の申請を行うことはできない。",a:false,exp:"必ずしも継続事業の一括の申請前に保険関係が成立している場合に限らず、暫定任意適用事業にあっては、「任意加入の申請と同時に一括の申請をして差し支えないものとされている」（法9条ほか）。",src:"法9条ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"D",q:"雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者（一定の者を除く。）の2分の1以上が希望するときは、雇用保険の任意加入の申請をしなければならない。",a:true,exp:"本肢のとおり正しい（法附則2条3項）。なお、労災保険暫定任意適用事業の事業主は、その事業に使用される労働者の過半数が希望するときは、任意加入の申請をしなければならない（整備法5条2項）。",src:"法附則2条3項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"E",q:"労働保険料その他労働保険徴収法の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとされているため、労働保険料等の徴収金について差押えをしている場合に、国税又は地方税の交付要求があった場合は、差押えに係る徴収金に優先して配当しなければならない。ただし、納付義務者が任意に国税に先んじて徴収金を納付してきた場合にまで、その効力は及ばない。",a:true,exp:"本肢のとおり正しい（法29条、昭56.9.25労徴発68号）。",src:"法29条、昭56.9.25労徴発68号",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"A",q:"事業主は、雇用保険印紙を購入しようとするときは、購入申込書に購入しようとする雇用保険印紙の種類別枚数、購入年月日、労働保険番号並びに事業主の氏名又は名称及び住所又は所在地を記入し、所轄公共職業安定所長に提出しなければならない。",a:false,exp:"事業主は、雇用保険印紙を購入しようとするときは、購入申込書に購入しようとする雇用保険印紙の種類別枚数、購入年月日、労働保険番号並びに事業主の氏名又は名称及び住所又は所在地を記入し、「雇用保険印紙を販売する日本郵便株式会社の営業所」に提出しなければならない（則43条1項）。",src:"則43条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"B",q:"印紙保険料の額は、日雇労働被保険者の賃金の日額に応じて、1人につき1日当たり、176円、146円及び96円の3種類に区分される。",a:true,exp:"本肢のとおり正しい（法22条1項）。",src:"法22条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"C",q:"事業主は、雇用保険印紙を譲り渡し、又は譲り受けてはならない。",a:true,exp:"本肢のとおり正しい（則41条2項）。なお、事業主その他正当な権限を有する者を除いては、何人も消印を受けない雇用保険印紙を所持してはならない（同条3項）。",src:"則41条2項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"D",q:"雇用保険印紙購入通帳の有効期間の更新を受けようとする事業主は、当該雇用保険印紙購入通帳の有効期間が満了する日の翌日の1月前から当該期間が満了する日までの間に、当該雇用保険印紙購入通帳を添えて、労働保険番号、事業主の氏名又は名称及び住所又は所在地並びに事業の名称、事業の行われる場所及び事業の種類を記載した申請書を所轄公共職業安定所長に提出して、新たに雇用保険印紙購入通帳の交付を受けなければならない。",a:true,exp:"本肢のとおり正しい（則42条4項）。",src:"則42条4項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"E",q:"印紙保険料の納付に関する帳簿の調製及び報告に関する事務の処理は、労働保険事務組合に委託することができない。",a:true,exp:"本肢のとおり正しい（法33条1項、平25.3.29基発0329第7号）。",src:"法33条1項、平25.3.29基発0329第7号",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"A",q:"継続事業の一括が行われた場合、当該一括の認可に係る2以上の事業に使用されるすべての労働者は、これらの事業のうち厚生労働大臣が指定するいずれか一の事業（以下本問において「指定事業」という。）に使用される労働者とみなされるが、この指定事業は、一括される事業のうち、労働保険事務を的確に処理する事務能力を有すると認められるものに限られるため、当該一括の申請に係る申請人の希望する事業と必ずしも一致しない場合がある。",a:true,exp:"本肢のとおり正しい（法9条ほか）。",src:"法9条ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"B",q:"政府は、確定保険料の認定決定に伴い徴収される追徴金の納付を督促したときは、当該追徴金の額に、納期限の翌日からその完納又は財産差押えの日の前日までの期間の日数に応じ、原則として、年14.6パーセント（当該納期限の翌日から2月を経過する日までの期間については、原則として、年7.3パーセント）の割合を乗じて計算した延滞金を徴収する。",a:false,exp:"延滞金が徴収されるのは政府が「労働保険料」の納付を督促した場合であって、追徴金の納付を督促した場合には、延滞金は徴収されない（法28条1項）。",src:"法28条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"C",q:"賃金の支払が月2回である場合、事業主は、その月の第1回目の賃金額から労働保険料の被保険者負担相当額を控除せず、その月の第2回目の賃金額から、その月の第1回目の賃金額に応ずる労働保険料の被保険者負担相当額とその月の第2回目の賃金額に応ずる労働保険料の被保険者負担相当額をまとめて控除することができる。",a:false,exp:"賃金からの控除は、被保険者に「賃金を支払う都度、当該賃金に応ずる額」について行うことができるため、本肢のように、第2回目の賃金から第1回目と第2回目の被保険者負担分の労働保険料を「まとめて控除することはできない」（則60条1項）。",src:"則60条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"D",q:"国、都道府県及び市町村の行う事業は、二元適用事業とされている。",a:false,exp:"都道府県及び市町村の行う事業は、二元適用事業とされているが、「国の行う事業は二元適用事業とはされていない」（法39条1項ほか）。",src:"法39条1項ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"E",q:"雇用保険率は、失業等給付費等充当徴収保険率と二事業費充当徴収保険率を合計して得た率とされている。",a:false,exp:"雇用保険率は、失業等給付費等充当徴収保険率、「育児休業給付費充当徴収保険率」及び二事業費充当徴収保険率を合計して得た率とされている（法12条4項）。",src:"法12条4項",cat:"択一式（LEC1 雇徴）"}
];

// ============================================================
//  GOOGLE DRIVE SYNC
// ============================================================
const CLIENT_ID    = APP_CONFIG.clientId;
const SCOPES       = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = APP_CONFIG.driveFileName;
let tokenClient = null, gapiInited = false, gisInited = false;
let accessToken = null, driveFileId = null, isSyncing = false;
let autoSaveTimer = null;
let tokenRefreshTimer = null; // トークン自動更新タイマー

window.addEventListener('load', () => {
  // ログイン済みの場合は「再接続中」表示
  if (getSavedAuth()) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncStatusText');
    if (dot) dot.className = 'sync-dot syncing';
    if (txt) txt.textContent = '再接続中…';
  }
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
    maybeEnableSync();
  });
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) {
          if (getSavedAuth()) {
            updateSyncUI(false);
            showToast('再接続できませんでした。再度ログインしてください', 'warn');
          }
          return;
        }
        accessToken = resp.access_token;
        gapi.client.setToken({ access_token: accessToken });
        onSignedIn();
        // 55分後にトークンを自動更新（アクセストークンは1時間で失効）
        if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
        tokenRefreshTimer = setTimeout(() => {
          if (getSavedAuth()) tokenClient.requestAccessToken({ prompt: '' });
        }, 55 * 60 * 1000);
      }
    });
    gisInited = true;
    maybeEnableSync();
  };
  document.head.appendChild(s);
});

function maybeEnableSync() {
  if (gapiInited && gisInited && getSavedAuth()) {
    tokenClient.requestAccessToken({ prompt: '' });
  }
}
function signIn() {
  if (!gapiInited || !gisInited) { showToast('初期化中です、少々お待ちください', 'error'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null; driveFileId = null;
  if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }
  clearSavedAuth(); updateSyncUI(false);
  showToast('ログアウトしました');
}
function onSignedIn() {
  updateSyncUI(true); saveAuthHint();
  showToast('ログイン成功、データを読み込んでいます…', 'success');
  loadFromDrive();
}
function updateSyncUI(loggedIn) {
  document.getElementById('syncDot').className = 'sync-dot' + (loggedIn ? ' connected' : '');
  document.getElementById('syncStatusText').textContent = loggedIn ? 'Googleドライブに同期中' : 'Googleアカウントで同期';
  document.getElementById('syncUser').style.display = 'none';
  document.getElementById('btnSignIn').style.display    = loggedIn ? 'none'  : 'flex';
  document.getElementById('btnManualSync').style.display = loggedIn ? 'block' : 'none';
  document.getElementById('btnManualSync').disabled = !loggedIn;
  document.getElementById('btnSignOut').style.display   = loggedIn ? 'block' : 'none';
}
function setSyncing(v) {
  isSyncing = v;
  const dot = document.getElementById('syncDot');
  const btn = document.getElementById('btnManualSync');
  if (v) { dot.className = 'sync-dot syncing'; if (btn) { btn.disabled = true; btn.textContent = '同期中…'; } }
  else   { dot.className = 'sync-dot connected'; if (btn) { btn.disabled = false; btn.textContent = '↑↓ 同期'; } }
}
async function loadFromDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const res = await gapi.client.request({
      path: 'https://www.googleapis.com/drive/v3/files',
      params: { spaces: 'appDataFolder', q: `name='${DRIVE_FILE_NAME}'`, fields: 'files(id,name)' }
    });
    const files = res.result.files || [];
    if (files.length > 0) {
      driveFileId = files[0].id;
      const fileRes = await gapi.client.request({
        path: `https://www.googleapis.com/drive/v3/files/${driveFileId}`,
        params: { alt: 'media' }
      });
      const data = typeof fileRes.result === 'string' ? JSON.parse(fileRes.result) : fileRes.result;
      mergeCloudData(data);
      showToast('クラウドから読み込みました', 'success');
    } else {
      showToast('クラウドにデータがありません（初回）');
      await saveToDrive();
    }
  } catch (e) {
    console.error(e);
    showToast('読み込み失敗: ' + (e?.message || '通信エラー'), 'error');
  }
  setSyncing(false);
}
async function saveToDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const body = JSON.stringify(buildSavePayload());
    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body
      });
    } else {
      const meta = JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&spaces=appDataFolder', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken }, body: form
      });
      driveFileId = (await res.json()).id;
    }
    showToast('クラウドに保存しました', 'success');
  } catch (e) {
    console.error(e);
    showToast('保存失敗: ' + (e?.message || '通信エラー'), 'error');
  }
  setSyncing(false);
}
async function manualSync() {
  if (!accessToken) { showToast('先にログインしてください', 'error'); return; }
  await loadFromDrive();
}
function scheduleAutoSave() {
  if (!accessToken) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveToDrive(), 3000);
}

// ============================================================
//  SAVE / LOAD PAYLOAD
//  ★ v2: stats（正答率）と session（中断データ）を両方保存
// ============================================================
function buildSavePayload() {
  // 現在進行中のセッション or 中断済みの pendingResume を保存
  let sessionData = null;
  if (currentSession && questions.length > 0) {
    sessionData = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
  } else if (pendingResume) {
    sessionData = pendingResume;
  }
  return {
    version: 2,
    bookmarks: [...bookmarks],          // ★ 栞 → Drive同期で他デバイスにも反映
    stats: JSON.parse(JSON.stringify(questionStats)), // ★ 正答率データ
    session: sessionData,               // ★ 中断セーブ
    savedAt: new Date().toISOString()
  };
}
function mergeCloudData(data) {
  if (!data) return;
  // 栞
  if (data.bookmarks) bookmarks = new Set(data.bookmarks);
  // ★ 正答率データを復元
  if (data.stats) {
    Object.entries(data.stats).forEach(([k, v]) => { questionStats[k] = v; });
  }
  // ★ 中断セッションを復元（1問以上回答済みの場合のみ）
  if (data.session && data.session.questionIndices && data.session.answers) {
    const answered = data.session.answers.filter(a => a !== null).length;
    if (answered > 0) pendingResume = data.session;
  }
  localSave();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
}

// ============================================================
//  STATS
// ============================================================
let questionStats = {}; // { origIdx: {correct:N, total:N} }

function recordStat(origIdx, isCorrect) {
  if (!questionStats[origIdx]) questionStats[origIdx] = {correct:0, total:0};
  questionStats[origIdx].total++;
  if (isCorrect) questionStats[origIdx].correct++;
  localSave(); scheduleAutoSave(); updateWeakBtn(); updateLeastTriedBtn();
}
function getAccuracyInfo(origIdx) {
  const s = questionStats[origIdx];
  if (!s || s.total === 0) return null;
  const pct = Math.round((s.correct / s.total) * 100);
  return {
    total: s.total, pct,
    cls: pct >= 80 ? 'high' : (pct >= 50 ? 'mid' : 'low')
  };
}

// ============================================================
//  WEAK QUESTIONS
// ============================================================
function updateWeakBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return s && s.total > 0 && (s.correct / s.total) <= 0.5;
  });
  const btn = document.getElementById('btnWeakStart');
  btn.style.display = pool.length > 0 ? 'block' : 'none';
  if (pool.length === 0) btn.textContent = 'まだ回答データがありません';
  else btn.textContent = `正答率50%以下の問題を出題（${pool.length}問）`;
}
function startWeak() {
  const s = { useWeak: true };
  startSession(s);
}
function updateLeastTriedBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return !s || s.total === 0 || s.total < 3; // 3回未満
  });
  const btn = document.getElementById('btnLeastTried');
  if (!btn) return;
  if (pool.length > 0) {
    btn.style.display = 'block';
    btn.textContent = `挑戦回数が少ない問題を出題（${pool.length}問）`;
  } else {
    btn.style.display = 'none';
  }
}
function startLeastTried() {
  // 挑戦回数でソート（少ない順）→上位20問を出題
  const indexed = ALL_QUESTIONS.map((q,i) => ({q, i, tries: (questionStats[i]||{total:0}).total}));
  indexed.sort((a,b) => a.tries - b.tries);
  const maxTries = indexed[Math.min(19, indexed.length-1)].tries;
  const pool = indexed.filter(x => x.tries <= maxTries).map(x => ({...x.q, _origIdx: x.i}));
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  const take = pool.slice(0, 20);
  questions = take; answers = Array(take.length).fill(null); current = 0;
  currentSession = { questionIndices: take.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`挑戦回数の少ない${take.length}問を出題`, 'success');
}

// ============================================================
//  RESUME SESSION
// ============================================================
let pendingResume = null;

function offerResume() {
  // モーダル廃止：スタート画面の「続きから開始」ボタンを表示
  updateResumeBtn();
}
function updateResumeBtn() {
  const btn = document.getElementById('btnResumeStart');
  if (!btn) return;
  if (pendingResume) {
    const done = pendingResume.answers.filter(a => a !== null).length;
    const total = pendingResume.questionIndices.length;
    btn.textContent = `▶ 続きから開始（${done}/${total}問 回答済み）`;
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}
function resumeSession() {
  if (!pendingResume) return;
  const pool = pendingResume.questionIndices.map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  if (pool.length === 0) { clearResume(); return; }
  questions = pool; answers = [...pendingResume.answers]; current = pendingResume.current || 0;
  currentSession = { ...pendingResume }; pendingResume = null;
  localSave(); showQuestionScreen(); updateQuestion();
  showToast('前回の続きから再開しました', 'success');
}
function clearResume() {
  pendingResume = null; localSave();
  updateResumeBtn();
  scheduleAutoSave();
}

// ============================================================
//  MAIN LOGIC
// ============================================================
let questions = [], answers = [], current = 0, currentSession = null;

const CATS = [...new Set(ALL_QUESTIONS.map(q => q.cat))];

// ============================================================
//  FILTER
// ============================================================
function initFilters() {
  const btns = document.getElementById('filterBtns');
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'btn-filter'; btn.textContent = cat; btn.dataset.cat = cat;
    btn.onclick = () => selectFilter(cat, btn);
    btns.appendChild(btn);
  });
}
function selectFilter(cat, btn) {
  document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  let p = ALL_QUESTIONS;
  if (cat !== 'all') p = p.filter(q => q.cat === cat);
  
  document.getElementById('startCount').textContent = p.length;
  
  // ランダム入力の max を更新
  const input = document.getElementById('randomInput');
  input.max = p.length; 
  if (parseInt(input.value) > p.length) input.value = p.length;
  updateRandomBtn();
}
function getFilteredPool() {
  const active = document.querySelector('.btn-filter.active');
  if (!active) return ALL_QUESTIONS;
  const cat = active.dataset.cat;
  if (cat === 'all') return ALL_QUESTIONS;
  return ALL_QUESTIONS.filter(q => q.cat === cat);
}

// ============================================================
//  RANDOM MODE
// ============================================================
function updateRandomBtn() {
  const input = document.getElementById('randomInput');
  const btn = document.getElementById('btnRandomStart');
  btn.textContent = `${input.value}問ランダムで出題`;
}
function startRandom() {
  const num = parseInt(document.getElementById('randomInput').value) || 10;
  let pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  if (num >= pool.length) pool = pool;
  else {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問をランダム出題開始`, 'success');
}

// 栞ランダムモード
function updateBookmarkRandomBtn() {
  const input = document.getElementById('bookmarkRandomInput');
  const btn = document.getElementById('btnBookmarkRandomStart');
  btn.textContent = `栞から${input.value}問ランダムで出題`;
}
function startBookmarkRandom() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const num = parseInt(document.getElementById('bookmarkRandomInput').value) || 10;
  let pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(q => q.no);
  if (num < pool.length) {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`栞から${pool.length}問をランダム出題開始`, 'success');
}

// ============================================================
//  SHUFFLE
// ============================================================
function shuffle() {
  const pool = getFilteredPool();
  const indices = Array.from({length: pool.length}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  ALL_QUESTIONS.length = 0;
  indices.forEach(i => ALL_QUESTIONS.push(pool[i]));
  showToast('問題をシャッフルしました', 'success');
}

// ============================================================
//  START MODES
// ============================================================
function start() {
  const s = {};
  startSession(s);
}
function startBookmarks() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const s = { useBookmarks: true };
  startSession(s);
}
function startSession(s) {
  let pool = [];
  
  if (s.useBookmarks) {
    pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  } else if (s.useWeak) {
    let p = ALL_QUESTIONS.map((q, i) => ({ ...q, _origIdx: i }));
    pool = p.filter(q => {
      const stat = questionStats[q._origIdx];
      return stat && stat.total > 0 && (stat.correct / stat.total) <= 0.5;
    });
  } else {
    pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  }

  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
}

function getOrigIdx(q) { return q._origIdx !== undefined ? q._origIdx : ALL_QUESTIONS.indexOf(q); }

// ============================================================
//  UPDATE QUESTION
// ============================================================
function updateQuestion() {
  if (questions.length === 0 || current >= questions.length) return;
  
  const q = questions[current];
  const currentQIndex = getOrigIdx(q);
  
  // プログレスバー
  const progressInfo = `${current + 1} / ${questions.length}`;
  const correctCount = answers.filter(a => a && a.correct).length;
  document.getElementById('progressNum').textContent = progressInfo;
  document.getElementById('progressScore').textContent = `正解: ${correctCount}問`;
  document.getElementById('progressFill').style.width = `${((current + 1) / questions.length) * 100}%`;
  
  // 問題カード
  document.getElementById('qTag').textContent = q.cat;
  document.getElementById('qNum').textContent = q.no + (q.opt ? '-' + q.opt : '');
  if (q.type === 'select') {
    document.getElementById('qText').innerHTML = q.context;
    // 空欄を強調
    const regex = /【[A-Z]】/g;
    document.getElementById('qText').innerHTML = document.getElementById('qText').innerHTML.replace(
      regex, '<span class="q-blank">$&</span>'
    );
  } else {
    document.getElementById('qText').textContent = q.q;
  }
  
  // タイプバッジ
  const typeBadge = document.getElementById('qTypeBadge');
  if (q.type === 'select') {
    typeBadge.textContent = '選択式';
    typeBadge.className = 'q-type-badge sel';
    typeBadge.style.display = 'inline-block';
  } else {
    typeBadge.textContent = '○×';
    typeBadge.className = 'q-type-badge ox';
    typeBadge.style.display = 'inline-block';
  }

  // ★ 正答率バッジ・挑戦回数バッジ・栞ボタン（回答後のみ表示）
  const accEl  = document.getElementById('qAcc');
  const triesEl = document.getElementById('qTries');
  const bBtn = document.getElementById('btnBookmark');

  const ans    = answers[current];
  const panel  = document.getElementById('resultPanel');
  const nextBtn = document.getElementById('btnNext');
  const isSelect = (q.type === 'select');

  if (ans) {
    // 回答後：バッジ・栞を表示
    const accInfo = getAccuracyInfo(currentQIndex);
    if (accInfo) {
      accEl.textContent = `過去${accInfo.total}回: ${accInfo.pct}%正解`;
      accEl.className   = `q-acc ${accInfo.cls}`;
      accEl.style.display = 'inline-block';
    } else {
      accEl.style.display = 'none';
    }
    const s = questionStats[currentQIndex];
    const tries = s ? s.total : 0;
    triesEl.textContent = `挑戦${tries}回`;
    triesEl.style.display = 'inline-block';
    bBtn.textContent = bookmarks.has(currentQIndex) ? '★' : '☆';
    bBtn.classList.toggle('active', bookmarks.has(currentQIndex));
    bBtn.style.visibility = 'visible';
  } else {
    // 回答前：バッジ・栞を非表示
    accEl.style.display = 'none';
    triesEl.style.display = 'none';
    bBtn.textContent = '☆';
    bBtn.classList.remove('active');
    bBtn.style.visibility = 'hidden';
  }

  // ボタン群の表示切替
  document.getElementById('oxRow').style.display       = isSelect ? 'none' : 'grid';
  document.getElementById('choicesGrid').style.display = isSelect ? 'grid' : 'none';
  if (ans) {
    if (isSelect) renderChoices(q, ans.userChoice, true);
    else          renderOxButtons(q, ans.userChoice, true);
    showResultPanel(q, ans.correct);
    nextBtn.style.display = 'block';
  } else {
    if (isSelect) renderChoices(q, null, false);
    else          renderOxButtons(q, null, false);
    panel.style.display = 'none'; panel.className = 'result-panel';
    nextBtn.style.display = 'none';
  }
  document.getElementById('btnBack').disabled = (current === 0);
  document.getElementById('btnSkip').style.display = ans ? 'none' : 'block';
}

function renderOxButtons(q, userChoice, isAnswered) {
  const bm = document.getElementById('btnMaru');
  const bb = document.getElementById('btnBatsu');
  // ラベルをリセット
  bm.innerHTML = '<div>○</div><div class="btn-label">正しい</div>';
  bb.innerHTML = '<div>×</div><div class="btn-label">誤り</div>';
  bm.className = 'btn-answer btn-maru'; bb.className = 'btn-answer btn-batsu';
  bm.disabled = false; bb.disabled = false;
  if (isAnswered) {
    bm.disabled = true; bb.disabled = true;
    if (userChoice === true) {
      bm.className = q.a === true  ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== true)  bb.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bm.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      bb.className = q.a === false ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== false) bm.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bb.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    }
  }
}

// 選択式問題の描画（選択式を含む科目でオーバーライドして使用）
function renderChoices(q, userChoice, isAnswered) {
  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  q.choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice'; btn.textContent = c;
    if (isAnswered) {
      btn.disabled = true;
      if (c === q.answer)   btn.className = c === userChoice ? 'btn-choice correct-chosen' : 'btn-choice reveal-correct';
      if (c === userChoice && c !== q.answer) btn.className = 'btn-choice wrong-chosen';
      if (c === userChoice) btn.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      btn.onclick = () => answerSelect(c);
    }
    grid.appendChild(btn);
  });
}

function showResultPanel(q, isCorrect) {
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  panel.className     = isCorrect ? 'result-panel correct' : 'result-panel wrong';
  document.getElementById('resultHeader').textContent = isCorrect ? '✓ 正解！' : '✗ 不正解';
  document.getElementById('resultExp').textContent    = q.exp;
  document.getElementById('resultSource').textContent = '根拠：' + q.src;
}

// ============================================================
//  ANSWER
// ============================================================
function answerOx(userAnswer) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userAnswer === q.a;
  answers[current] = { correct: isCorrect, userChoice: userAnswer };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}
function answerSelect(userChoice) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userChoice === q.answer;
  answers[current] = { correct: isCorrect, userChoice };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}

// ============================================================
//  NAVIGATION
// ============================================================
function nextQuestion() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function prevQuestion() {
  if (current > 0) { current--; updateQuestion(); }
  currentSession.current = current; localSave();
}
function skip() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function suspend() {
  // 中断時にセッションデータをpendingResumeに移す
  if (currentSession) {
    pendingResume = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
    currentSession = null;
    localSave(); scheduleAutoSave();
  }
  
  questions = []; answers = []; current = 0;
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  updateResumeBtn();
  showToast('セッションを中断しました', 'warn');
}

// ============================================================
//  FINISH & RESULTS
// ============================================================
function finishSession() {
  // 完了時にセッションデータをクリア
  currentSession = null; pendingResume = null;
  localSave(); scheduleAutoSave();
  showResultScreen();
}
function renderResults() {
  const correct = answers.filter(a => a && a.correct).length;
  const wrong   = answers.filter(a => a && !a.correct).length;
  const skipped = answers.filter(a => !a).length;
  const total   = questions.length;
  const rate    = total > 0 ? Math.round((correct / total) * 100) : 0;

  document.getElementById('resultScoreText').textContent = `${correct} / ${total}`;
  document.getElementById('correctCount').textContent   = correct;
  document.getElementById('wrongCount').textContent     = wrong;
  document.getElementById('skippedCount').textContent   = skipped;
  
  let msg = `正解率: ${rate}%\n`;
  if (rate >= 80) msg += '素晴らしい結果です！';
  else if (rate >= 60) msg += '良い成績です！';
  else if (rate >= 40) msg += 'もう少し頑張りましょう。';
  else msg += '復習をお勧めします。';
  
  document.getElementById('resultMessage').textContent = msg;
  
  // 再挑戦ボタンの表示制御
  document.getElementById('btnRetryWrong').style.display = wrong > 0 ? 'inline-block' : 'none';
  document.getElementById('btnRetrySkipped').style.display = skipped > 0 ? 'inline-block' : 'none';
}

// ============================================================
//  RETRY
// ============================================================
function retryWrong() {
  const wrongIndices = [];
  answers.forEach((a, i) => { if (a && !a.correct) wrongIndices.push(i); });
  if (wrongIndices.length === 0) return;
  
  const pool = wrongIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function retrySkipped() {
  const skippedIndices = [];
  answers.forEach((a, i) => { if (!a) skippedIndices.push(i); });
  if (skippedIndices.length === 0) return;
  
  const pool = skippedIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function restart() {
  questions = []; answers = []; current = 0;
  currentSession = null; pendingResume = null;
  localSave();
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
}

// ============================================================
//  BOOKMARKS
// ============================================================
function renderBookmarks() {
  const container = document.getElementById('bookmarkItems');
  const empty = document.getElementById('emptyBookmarks');
  
  if (bookmarks.size === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  container.innerHTML = '';
  
  [...bookmarks].sort((a, b) => a - b).forEach(idx => {
    const q = ALL_QUESTIONS[idx];
    if (!q) return;
    
    const item = document.createElement('div');
    item.className = 'bm-item';
    item.onclick = () => startFromBookmark(idx);
    
    const star = document.createElement('div');
    star.className = 'bm-star'; star.textContent = '★';
    
    const tag = document.createElement('div');
    tag.className = 'bm-tag'; tag.textContent = q.cat;
    
    const acc = document.createElement('div');
    const accInfo = getAccuracyInfo(idx);
    if (accInfo) {
      acc.className = `bm-acc ${accInfo.cls}`;
      acc.textContent = `${accInfo.pct}%`;
    }
    
    const text = document.createElement('div');
    text.className = 'bm-text';
    if (q.type === 'select') {
      text.textContent = `【${q.opt}】${q.context.slice(0, 80)}...`;
    } else {
      text.textContent = `${q.no}-${q.opt}: ${q.q.slice(0, 80)}...`;
    }
    
    item.appendChild(star);
    item.appendChild(tag);
    if (accInfo) item.appendChild(acc);
    item.appendChild(text);
    container.appendChild(item);
  });
}

function startFromBookmark(startIdx) {
  const pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i }))
    .filter(Boolean).sort((a, b) => a._origIdx - b._origIdx);
  const startPos = pool.findIndex(q => q._origIdx === startIdx);
  
  questions = pool; answers = Array(pool.length).fill(null); 
  current = Math.max(0, startPos);
  currentSession = { questionIndices: pool.map(q => q._origIdx), current, answers: [...answers] };
  showMain(); showQuestionScreen(); updateQuestion();
}

// ============================================================
//  TOAST
// ============================================================
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast${type ? ' ' + type : ''}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  localLoad();
  initFilters();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
});

// アプリ情報の表示
document.getElementById('appTitle').textContent    = APP_CONFIG.title;
document.getElementById('appSubtitle').textContent = APP_CONFIG.subtitle;

// 栞ボタンの表示制御
function checkBookmarkButton() {
  const btn = document.getElementById('btnBookmarkStart');
  btn.style.display = bookmarks.size > 0 ? 'block' : 'none';
  // 栞ランダムモードの表示制御
  const bmRandom = document.getElementById('bookmarkRandomMode');
  if (bmRandom) {
    bmRandom.style.display = bookmarks.size > 0 ? 'block' : 'none';
    const input = document.getElementById('bookmarkRandomInput');
    if (input) {
      input.max = bookmarks.size;
      if (parseInt(input.value) > bookmarks.size) input.value = bookmarks.size;
      updateBookmarkRandomBtn();
    }
  }
}

// 初期化時に栞ボタンをチェック
document.addEventListener('DOMContentLoaded', () => {
  checkBookmarkButton();
});

// 栞の更新時に栞ボタンもチェック
function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if (bookmarks.size > 0) {
    badge.textContent = bookmarks.size;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
  checkBookmarkButton(); // 栞ボタンの表示も更新
}
</script>
