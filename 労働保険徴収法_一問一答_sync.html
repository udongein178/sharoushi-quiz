{no:"1雇徴-問9",opt:"A",q:"日雇労働被保険者は、事業主に使用されたときは、その都度雇用保険印紙の貼付又は印紙保険料納付計算器による納付印の押なつを受けるために、その所持する日雇労働被保険者手帳を事業主に提出しなければならない。",a:true,exp:"設問のとおり正しい。日雇労働被保険者は使用されるたびに、雇用保険印紙の貼付等のため手帳を事業主に提出しなければならない。",src:"則39条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"B",q:"事業主は、雇用保険印紙を購入しようとするときは、あらかじめ、所定の事項を記載した申請書を所轄公共職業安定所長に提出して、雇用保険印紙購入通帳の交付を受けなければならない。",a:true,exp:"設問のとおり正しい。雇用保険印紙の購入には、事前に購入通帳の交付を受ける必要がある。",src:"則42条1項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"C",q:"事業主は、日雇労働被保険者を使用しなくなったときは、その使用しなくなった日から1年間に限り、その保有する雇用保険印紙の買戻しを申し出ることができる。",a:false,exp:"「1年間に限り」が誤り。雇用保険印紙の買戻しの期限は特に定められておらず、使用しなくなったときはいつでも申し出ることができる。なお買戻しの申出は日本郵便株式会社の営業所で購入通帳を提出して行う。",src:"則43条2項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"D",q:"雇用保険印紙購入通帳の交付を受けている事業主は、所定の事項を記載した報告書によって、毎月における雇用保険印紙の受払状況を翌月末日までに、所轄都道府県労働局歳入徴収官に報告しなければならない。",a:true,exp:"設問のとおり正しい。毎月の雇用保険印紙の受払状況について、翌月末日までに報告が必要である。",src:"則24条、則54条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問9",opt:"E",q:"事業主が、正当な理由がないと認められるにもかかわらず、印紙保険料の納付を怠ったときは、その納付を怠った印紙保険料の額が1,000円未満であるときを除き、政府は、その納付すべき印紙保険料の額として決定した額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）の100分の25に相当する額の追徴金を徴収する。",a:true,exp:"設問のとおり正しい。正当な理由なく印紙保険料の納付を怠った場合、100分の25相当額の追徴金が徴収される。",src:"法25条2項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"A",q:"労働保険事務組合として認可を受けた事業主の団体又はその連合団体に労働保険事務の処理を委託することができるのは、その団体の構成員又はその連合団体を構成する団体の構成員である事業主だけではなく、労働保険事務の処理を当該労働保険事務組合に委託することが必要であると認められる事業主が含まれる。",a:true,exp:"設問のとおり正しい。労働保険事務組合への委託は、団体の構成員に限らず、委託が必要と認められる他の事業主（例えば当該団体の賛助会員）も含まれる。",src:"法33条1項、則62条1項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"B",q:"労働保険事務組合は、委託を受けて行う労働保険事務の処理の業務を廃止したときは、当該事実があった日の翌日から起算して60日以内に、その旨を厚生労働大臣に届け出なければならない。",a:false,exp:"「廃止したときは...60日以内」が誤り。正しくは「廃止しようとするときは、廃止しようとする日の60日前まで」に厚生労働大臣に届け出なければならない（事前届出）。",src:"法33条3項",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"C",q:"労働保険事務組合に委託することができる労働保険事務には、労災保険の保険給付及び特別支給金に関する請求書等に係る事務手続、雇用保険の印紙保険料、被保険者に関する事務、保険給付に関する請求書等及び雇用保険二事業に係る事務手続は含まれない。",a:false,exp:"「被保険者に関する事務」が誤り。雇用保険の被保険者に関する事務は、労働保険事務組合に委託することができる労働保険事務に含まれる。なお、その他の記述（労災保険の保険給付及び特別支給金に関する請求書等に係る事務手続、雇用保険の印紙保険料、保険給付に関する請求書等及び雇用保険二事業に係る事務手続が含まれないこと）は正しい。",src:"法33条1項、平成12.3.31発徴31号",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"D",q:"事業主が労働保険事務組合に労働保険事務の処理を委託した場合であっても、政府が行う労働保険関係法令の規定による労働保険料の納入の告知その他の通知及び還付金の還付については、これを直接当該事業主に対してしなければならない。",a:false,exp:"「直接事業主に対してしなければならない」が誤り。委託された場合、政府は労働保険料の納入告知等の通知及び還付金の還付について、労働保険事務組合に対して行うことができ、この場合は事業主に対してしたものとみなされる。",src:"法34条",cat:"択一式（第1予想 雇徴）"},
{no:"1雇徴-問10",opt:"E",q:"労働保険関係法令の規定により政府が追徴金又は延滞金を徴収する場合において、その徴収について労働保険事務組合の責めに帰すべき理由があるときは、その限度で、労働保険事務組合は、政府に対して当該徴収金の納付の責めに任ずるものとされており、この場合には、労働保険事務組合が納付すべき徴収金について、事業主が納付責任を負うことはない。",a:false,exp:"「事業主が納付責任を負うことはない」が誤り。労働保険事務組合が納付すべき徴収金について、当該組合に対して滞納処分をしてもなお徴収すべき残余がある場合に限り、その残余の額を当該事業主から徴収することができるとされており、事業主も責任を負う場合がある。",src:"法35条2項、3項",cat:"択一式（第1予想 雇徴）"},
{no:"1労徴-問8",opt:"A",q:"常時3人の労働者を使用する個人経営の林業の事業は、労災保険暫定任意適用事業であり、当該事業の事業主が任意加入の申請をし、厚生労働大臣の認可があったときは、その日に労災保険に係る保険関係が成立する。",a:false,exp:"常時3人の労働者を使用する個人経営の林業の事業は、労災保険暫定任意適用事業ではなく、労災保険の（強制）適用事業である。なお、労災保険暫定任意適用事業については、事業主が任意加入の申請をし、厚生労働大臣の認可があったときは、その日に労災保険に係る保険関係が成立する。",src:"(44)労災保険法附則12条、整備法5条1項、整備政令17条、平成12.12.25厚労告120条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"B",q:"労災保険法第3条第1項の適用事業に該当する事業が労災保険暫定任意適用事業に該当するに至ったときは、その日に、その事業につき厚生労働大臣の認可があったものとみなす。",a:false,exp:"設問の場合、「その翌日」に、その事業につき厚生労働大臣の（任意加入の）認可があったものとみなす。",src:"整備法5条3項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"C",q:"常時3人の労働者を雇用する個人経営の林業の事業であって、雇用保険に係る保険関係が成立している暫定任意適用事業の事業主は、当該労働者のうち2人の同意を得れば、当該保険関係の消滅の申請を行うことができる。",a:false,exp:"雇用保険に係る保険関係が成立している雇用保険暫定任意適用事業の保険関係の消滅の申請については、その事業に使用される労働者の4分の3以上の同意を得なければ行うことができない。設問の場合、3人の労働者のうち2人の同意（3分の2の同意）であるから、保険関係の消滅の申請を行うことはできない。",src:"法附則4条、雇用保険法附則2条、同法施行令附則2条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"D",q:"雇用保険に係る保険関係が成立していない雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者の2分の1以上が希望する場合には、任意加入の申請をしなければならないが、これに違反して申請をしなかったときであっても、罰則の適用はない。",a:false,exp:"設問の違反については、罰則（6月以下の拘禁刑又は30万円以下の罰金）が適用される。なお、労災保険に係る保険関係が成立していない労災保険暫定任意適用事業の事業主は、その事業に使用される労働者の過半数が希望する場合には、任意加入の申請をしなければならないが、これに違反して申請をしなかったときであっても、罰則の適用はない。",src:"法附則2条3項、7条1項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問8",opt:"E",q:"労災保険に係る保険関係が成立している労災保険暫定任意適用事業の事業主は、当該保険関係の消滅の申請をしようとする場合には、当該事業に使用される労働者の過半数の同意を得たことを証明することができる書類を添えて、所定の申請書を所轄都道府県労働局長に提出しなければならない。",a:true,exp:"設問の通り正しい。なお、設問の申請書の提出は、所轄労働基準監督署長を経由して行うものとされている。",src:"整備法8条1項、2項、整備省令3条",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"A",q:"労働保険徴収法において「賃金」とは、賃金、給料、手当、賞与その他名称のいかんを問わず、労働の対償として事業主が労働者に支払うもの（3か月を超える期間ごとに受けるものを除く。）をいう。",a:false,exp:"「3か月を超える期間ごとに受けるものを除く」とする記述が誤りである。労働保険徴収法において「賃金」とは、賃金、給料、手当、賞与その他名称のいかんを問わず、労働の対償として事業主が労働者に支払うもの（通貨以外のもので支払われるものであって、厚生労働省令で定める範囲外のものを除く。）をいう。なお、賃金のうち通貨以外のもので支払われるものの評価に関し必要な事項は、厚生労働大臣が定めることとされており、また、賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、所轄労働基準監督署長又は所轄公共職業安定所長の定めるところによることとされている。",src:"法2条2項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"B",q:"労働基準法の規定による休業手当、年次有給休暇中の賃金及び解雇予告手当は、同法上使用者にその支払が義務付けられているものであり、労働保険徴収法上の賃金に該当する。",a:false,exp:"休業手当及び年次有給休暇中の賃金については賃金に該当するが、解雇予告手当については賃金に該当しない。なお、労働基準法の規定による休業補償、健康保険法の規定による傷病手当金についても、賃金に該当しない。",src:"法2条2項、昭和23.8.18基収2520号、昭和25.4.10基収950号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"C",q:"労働者が業務外の疾病又は負傷のため勤務に服することができないため、事業主から支払われる手当金や、個人的、臨時的な吉凶禍福に対して支払われる結婚祝金、死亡弔慰金、災害見舞金は、労働協約、就業規則等で労働者の権利として保障されているときは、労働保険徴収法上の賃金に該当する。",a:false,exp:"個人的、臨時的な吉凶禍福に対して支払われる結婚祝金、死亡弔慰金、災害見舞金は、労働協約、就業規則等で労働者の権利として保障されているときであっても、労働保険徴収法上の賃金に該当しない。なお、労働者が業務外の疾病又は負傷のため勤務に服することができないため、事業主から支払われる手当金は、労働協約、就業規則等で労働者の権利として保障されているときは、賃金に該当する（労働協約、就業規則等に定められておらず、単に恩恵的に見舞金として支給されている場合は、賃金に該当しない。）。",src:"法2条2項、昭和24.6.14基災収3850号、昭和25.2.16基発127号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"D",q:"労働者が在職中に、退職金相当額の全部又は一部を給与や賞与に上乗せするなど前払いされる場合は、労働の対償としての性格が明確であり、労働者の通常の生計にあてられる経常的な収入としての意義を有することから、原則として、一般保険料の算定基礎となる賃金総額に算入することとされている。",a:true,exp:"設問の通り正しい。なお、退職を事由として支払われる退職金であって、退職時に支払われるもの又は事業主の都合等により退職前に一時金として支払われるものについては、一般保険料の算定基礎となる賃金総額に算入しないこととされている。",src:"法2条2項、11条1項、2項、平成15.10.1基徴発1001001号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問9",opt:"E",q:"6月になってベースアップが1月に遡って行われることが決まり、各労働者の賃金の1月から6月までの差額及び支給が確定して6月に現実に支払われるような場合、4月から6月までの差額分は当保険年度の賃金総額に算入し、1月から3月までの差額分は前保険年度の賃金総額に算入することとなる。",a:false,exp:"設問の場合、1月から6月までの差額分は「賃金差額の支給が確定した日の属する年度」（6月に支給が確定しているので、当保険年度）の賃金総額に算入することとなる。",src:"法2条2項、11条1項、2項、昭和33.10.9基収5571号の2",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"ア",q:"【延滞金を徴収しない事由として正しいか】延滞金の額が1,000円未満であるとき。",a:false,exp:"延滞金の額が「100円未満」であるときは、延滞金は徴収されない。",src:"法28条5項3号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"イ",q:"【延滞金を徴収しない事由として正しいか】納期を繰り上げて徴収するとき。",a:false,exp:"設問のような規定は設けられていない。延滞金が徴収されない事由は、次のとおりである。①督促状に指定した期限までに労働保険料その他労働保険徴収法の規定による徴収金を完納したとき。②納付義務者の住所又は居所がわからないため、公示送達の方法によって督促したとき。③労働保険料の額が1,000円未満であるとき。④延滞金の額が100円未満であるとき。⑤労働保険料について滞納処分の執行を停止し、又は猶予したとき（その執行を停止し、又は猶予した期間に対応する部分の金額に限る。）。⑥労働保険料を納付しないことについてやむを得ない理由があると認められるとき。",src:"法28条5項",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"ウ",q:"【延滞金を徴収しない事由として正しいか】督促状に指定した期限までに労働保険料その他労働保険徴収法の規定による徴収金を完納したとき。",a:true,exp:"設問の通り正しい。",src:"法28条5項1号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"エ",q:"【延滞金を徴収しない事由として正しいか】納付義務者の住所又は居所がわからないため、公示送達の方法によって督促したとき。",a:true,exp:"設問の通り正しい。",src:"法28条5項2号",cat:"択一式（第1予想 労徴）"},
{no:"1労徴-問10",opt:"オ",q:"【延滞金を徴収しない事由として正しいか】労働保険料について滞納処分の執行を停止し、又は猶予したとき（その執行を停止し、又は猶予した期間に対応する部分の金額に限る。）。",a:true,exp:"設問の通り正しい。",src:"法28条5項4号",cat:"択一式（第1予想 労徴）"},
{no:"2雇徴-問8",opt:"A",q:"令和7年度の賃金総額の確定額が1億4,000万円、令和8年度の賃金総額の見込額が7,000万円である継続事業の場合、令和8年度の概算保険料である一般保険料は、7,000万円に一般保険料率を乗じて得た額となる。",a:false,exp:"「7,000万円」が誤り。継続事業の概算保険料は、前年度確定額の100分の50以上かつ100分の200以下の場合は前年度確定額を使用する。7,000万円は1億4,000万円の50%であり、この要件を満たすため令和8年度の概算保険料は「1億4,000万円に保険料率を乗じた額」となる。",src:"法15条1項1号、則24条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"B",q:"令和7年度の第1種特別加入者に係る保険料算定基礎額の確定額が3,000万円、令和8年度の第1種特別加入者に係る保険料算定基礎額の見込額が7,000万円である継続事業の場合、令和8年度の概算保険料である第1種特別加入保険料は、その事業に使用される労働者の賃金総額の増減の割合にかかわらず、7,000万円に第1種特別加入保険料率を乗じて得た額となる。",a:true,exp:"設問のとおり正しい。第1種特別加入保険料の概算保険料は、労働者の賃金総額増減にかかわらず、当年度見込額に保険料率を乗じて算定する（見込額は前年確定の200%超のため見込額を使用）。",src:"法15条1項2号、則24条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"C",q:"確定保険料申告書の記載に誤りがあり、政府が確定保険料を決定した場合において、既に納付した概算保険料の額が政府の決定した確定保険料の額に足りず、1万4,700円不足しているときは、その不足額のほか、1,470円の追徴金が徴収されることとなる。",a:false,exp:"「1,470円」が誤り。追徴金は不足額（その額に1,000円未満の端数があるときは端数を切り捨てた額）に100分の10を乗じた額となる。設問の場合、1万4,700円の端数700円を切り捨てた1万4,000円×10%=1,400円が追徴金となる。",src:"法19条5項、21条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"D",q:"確定保険料申告書の記載に誤りがあり、政府が確定保険料を決定した場合において、既に納付した概算保険料の額が政府の決定した確定保険料の額に足りないためその不足額を納付する場合には、政府の承認を受けて口座振替により納付することができる。",a:false,exp:"いわゆる認定決定による確定保険料は、口座振替により納付することはできない。口座振替により納付することができるのは概算保険料（延納する場合を含む。）及び確定保険料である。認定決定による概算保険料・確定保険料、増加概算保険料、印紙保険料、特例納付保険料等については、口座振替により納付することはできない。",src:"法21条の2、1項、則38条の4",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問8",opt:"E",q:"事業主が納付した概算保険料の額が、確定保険料の額を超える場合には、政府は、その超える額を還付しなければならない。",a:false,exp:"「還付しなければならない」が誤り。概算保険料が確定保険料を超える場合、政府は超える額を「次の保険年度の労働保険料等に充当し、又は還付する」ものとされており、無条件に還付義務があるわけではない。なお事業主が還付を請求した場合は還付される。",src:"法19条6項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"A",q:"特例納付保険料の対象事業主（以下本問において「対象事業主」という。）は、雇用保険法第22条第5項に規定する特例対象者を雇用していた事業主のうち、雇用保険に係る保険関係が成立していたにもかかわらず、保険関係成立の届出をしていなかった事業主に限られる。",a:true,exp:"設問のとおり正しい。特例納付保険料の対象事業主は、保険関係が成立していたにもかかわらず届出をしていなかった事業主に限られる。",src:"法26条1項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"B",q:"厚生労働大臣は、対象事業主に対して、特例納付保険料の納付を勧奨しなければならない。ただし、やむを得ない事情のため当該勧奨を行うことができない場合は、この限りでない。",a:true,exp:"設問のとおり正しい。厚生労働大臣は対象事業主に特例納付保険料の納付を勧奨しなければならないが、やむを得ない事情の場合は例外が認められる。",src:"法26条2項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"C",q:"所轄都道府県労働局歳入徴収官は、対象事業主から特例納付保険料の納付の申出を受けた場合には、特例納付保険料の額を決定し、これを当該対象事業主に通知するものとされており、対象事業主は、その通知を受けた日から15日以内に特例納付保険料を納付しなければならない。",a:false,exp:"「15日以内」が誤り。対象事業主は通知に定める納期限（「当該納期限まで」）に特例納付保険料を納付しなければならない。「15日以内」という規定はない。なお通知は納入告知書によって行われる。",src:"法26条4項、5項、則59条",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"D",q:"特例納付保険料は、日本銀行又は都道府県労働局収入官吏に納付しなければならない。",a:true,exp:"設問のとおり正しい。特例納付保険料は日本銀行（本店・支店・代理店・歳入代理店）又は都道府県労働局収入官吏に納付しなければならない。",src:"則38条3項2号",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問9",opt:"E",q:"対象事業主がその納付の申出をした特例納付保険料を納付しないときは、労働保険徴収法第27条の督促の対象となり、また、同法第28条の延滞金の対象にもなる。",a:true,exp:"設問のとおり正しい。特例納付保険料を納付しない場合は督促及び延滞金の対象となる。",src:"法26条、27条、28条",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"ア",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「介護補償給付の額」は正しいか。",a:false,exp:"「含まれないもの」として誤り。介護補償給付の額はメリット制の収支率の算定基礎に含まれる。なお、含まれないものはイ（二次健康診断等給付）・エ（特定疾病業務災害）・オ（複数業務要因災害）の3つ（正解C三つ）。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"イ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「二次健康診断等給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。二次健康診断等給付の額はメリット制の収支率の算定基礎に含まれない。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"ウ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「労働者の死亡の当時遺族補償年金を受けることができる遺族がない場合における遺族補償一時金の額」は正しいか。",a:false,exp:"「含まれないもの」として誤り。遺族がない場合の遺族補償一時金はメリット制の収支率の算定基礎に含まれる。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"エ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「特定疾病にかかった者に係る業務災害に関する保険給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。特定疾病（じん肺等）にかかった者に係る業務災害に関する保険給付の額は、メリット制の収支率の算定基礎に含まれない。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2雇徴-問10",opt:"オ",q:"〔問10〕労働保険徴収法第12条第3項に規定するいわゆるメリット制に関し、収支率の算定の基礎に含まれないものとして「複数業務要因災害に関する保険給付の額」は正しいか。",a:true,exp:"「含まれないもの」として正しい。複数業務要因災害に関する保険給付の額はメリット制の収支率の算定基礎に含まれない（複数業務要因災害は特定の事業主の責任に帰せられないため）。",src:"法12条3項",cat:"択一式（第2予想 雇徴）"},
{no:"2労徴-問8",opt:"A",q:"労災保険に係る保険関係が成立している事業のうち請負による建設の事業であって、賃金総額を正確に算定することが困難なものについては、その事業の種類に従い、請負金額（消費税等相当額を除く。以下同じ。）に労務費率を乗じて得た額を賃金総額とするが、機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれていない場合には、その機械装置の価額に相当する額（消費税等相当額を除く。）をその請負代金の額（消費税等相当額を除く。）に加算した額を請負金額とする。",a:false,exp:"設問の後半部分が誤りである。機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれていない場合には、その機械装置の価額に相当する額（消費税等相当額を除く。以下同じ。）をその請負代金の額（消費税等相当額を除く。以下同じ。）に加算しない額が請負金額（消費税等相当額を除く。以下同じ。）となる。なお、機械装置の組立て又はすえ付けの事業についての請負代金の額にその事業に使用する機械装置の価額が含まれている場合には、その機械装置の価額に相当する額をその請負代金の額から「控除」した額を請負金額とする。なお、機械装置の組み立て又はすえ付けの事業以外の建設の事業の請負金額については、事業主が注文者その他の者からその事業に使用する物の支給を受け、又は機械器具等の貸与を受けた場合には、支給された物の価額に相当する額（消費税等相当額を除く。）又は機械器具等の損料に相当する額（消費税等相当額を除く。）を請負代金の額に加算した額となる。",src:"法11条3項、則12条1号、13条、昭和58.2.21労告14号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"B",q:"労災保険に係る保険関係が成立している事業のうち造林の事業、木炭又は薪を生産する事業その他の林業の事業については、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。",a:false,exp:"労災保険に係る保険関係が成立している事業のうち「立木の伐採の事業」であって、賃金総額を正確に算定することが困難なものについては、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。なお、労災保険に係る保険関係が成立している事業のうち造林の事業、木炭又は薪を生産する事業その他の林業の事業（立木の伐採の事業を除く。）であって、賃金総額を正確に算定することが困難なものについては、その事業の労働者につき労働基準法の規定に基づき厚生労働大臣が定める平均賃金に相当する額に、それぞれの労働者の使用期間の総日数を乗じて得た額の合算額を賃金総額とする。",src:"法11条3項、則12条2号、3号、14条、15条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"C",q:"政府は、労働保険の事業に要する費用にあてるため保険料を徴収するものとされており、徴収する保険料（「労働保険料」という。）は、労災保険料、雇用保険料、第1種特別加入保険料、第2種特別加入保険料、第3種特別加入保険料、印紙保険料及び特例納付保険料とされている。",a:false,exp:"徴収する保険料（労働保険料）は、「一般保険料」、第1種特別加入保険料、第2種特別加入保険料、第3種特別加入保険料、印紙保険料及び特例納付保険料とされている。労働保険徴収法における労働保険料には、労災保険料、雇用保険料という概念はない（それぞれ一般保険料の額のうち労災保険率に応ずる部分の額、一般保険料の額のうち雇用保険率に応ずる部分の額である。）。",src:"法10条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"D",q:"労災保険率は、労災保険法の適用を受ける全ての事業の過去3年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定めるものとされており、二次健康診断等給付に要した費用の額は考慮されない。",a:false,exp:"「二次健康診断等給付に要した費用の額は考慮されない」とする部分が誤りである。労災保険率は、労災保険法の適用を受ける全ての事業の過去3年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに「二次健康診断等給付に要した費用の額」、社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定める。なお、特別加入保険料率については、特別加入者に二次健康診断等給付が行われないことから、二次健康診断等給付に要した費用の額は考慮されない（第1種特別加入保険料率は、二次健康診断等給付に要した費用の額を考慮して厚生労働大臣の定める率を減じる）こととなる。",src:"法12条2項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問8",opt:"E",q:"雇用保険率は、失業等給付費等充当徴収保険率、育児休業給付費充当徴収保険率及び二事業費充当徴収保険率を合計して得た率である。",a:true,exp:"設問の通り正しい。",src:"法12条4項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"A",q:"既に有期事業として単独で保険関係が成立している事業については、労働保険徴収法第7条に規定する有期事業の一括の要件に該当する場合であっても、一括の対象とならない。",a:true,exp:"設問の通り正しい。当初、独立の有期事業として保険関係が成立した事業は、その後事業の規模の変更等があった場合でも、一括扱いの対象とならない。また、有期事業の一括により一括された個々の事業については、その後、事業の規模の変更等があった場合でも、あくまで当初の一括扱いによることとされ、新たに独立の有期事業として取り扱われない。",src:"法7条、昭和40.7.31基発901号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"B",q:"有期事業の一括に係る個々の事業については、それぞれの事業が労災保険率表に定める労災保険率を同じくしていれば、必ずしも事業の種類を同じくしていなくとも、他の要件を満たす限り一括の対象となる。",a:false,exp:"有期事業の一括の対象とされるには、それぞれの事業が、労災保険率表に掲げる事業の種類を同じくすることが必要である。",src:"法7条5号、則6条2項2号",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"C",q:"9月1日に保険関係が成立した一括有期事業について、当該事業に係る労働保険事務の処理が労働保険事務組合に委託されておらず、納付すべき概算保険料の額が30万円である場合、当該事業の事業主は、当該概算保険料を延納することができる。",a:true,exp:"設問の通り正しい。一括有期事業については、継続事業と同様の方法により概算保険料の延納が行われるが、次に掲げる場合には、事業主が概算保険料申告書を提出する際に申請をすることにより、概算保険料を延納することができる。設問の事業は、一括有期事業なので、労災保険に係る保険関係のみが成立している事業に該当することに注意。①納付すべき概算保険料の額が40万円（労災保険に係る保険関係又は雇用保険に係る保険関係のみが成立している事業については、20万円）以上である場合又は当該事業に係る労働保険事務の処理が労働保険事務組合に委託されている場合 ②当該保険年度において10月1日以降に保険関係が成立した事業ではない場合（9月30日までに保険関係が成立した事業である場合）",src:"法18条、則27条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"D",q:"労働保険徴収法第9条の規定により継続事業の一括に係る厚生労働大臣の認可を受けた場合であっても、一括された個々の事業（以下「被一括事業」という。）における雇用保険の被保険者に関する事務は、それぞれの被一括事業の所轄公共職業安定所長が行うこととなる。",a:true,exp:"設問の通り正しい。継続事業の一括の認可が行われた場合、労働保険徴収法の規定の適用については、当該認可に係る2以上の事業に使用されるすべての労働者は、これらの事業のうち厚生労働大臣が指定するいずれか一の事業に使用される労働者とみなすこととされているが、労災保険法の規定によるもの（労災保険の給付）及び雇用保険法の規定によるもの（雇用保険の被保険者及び給付）については一括の効果は及ばないので、これらの事務は、それぞれの被一括事業の所轄労働基準監督署長等又は所轄公共職業安定所長が行う。",src:"法9条",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問9",opt:"E",q:"継続事業の一括に係る厚生労働大臣が指定する事業（以下「指定事業」という。）の事業の名称又は事業の行われる場所に変更があった場合には、その変更を生じた日の翌日から起算して10日以内に、所定の事項を記載した届書を所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない。",a:true,exp:"設問の通り正しい。指定事業の事業の名称又は事業の行われる場所に変更があった場合には、その変更を生じた日の翌日から起算して10日以内に、名称、所在地等変更届を所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない。なお、被一括事業の事業の名称又は当該事業の行われる場所に変更があったときは、遅滞なく、継続被一括事業名称・所在地変更届を、指定事業に係る所轄都道府県労働局長に提出しなければならない。",src:"法4条の2,2項、則5条1項、2項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"A",q:"事業主が概算保険料申告書を提出せず、政府が決定した概算保険料を納付しなければならない場合には、政府は、原則としてその納付すべき額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）に100分の10を乗じて得た額の追徴金を徴収する。",a:false,exp:"政府が決定した概算保険料（認定決定による概算保険料）については、追徴金は徴収されない。なお、事業主が確定保険料申告書を提出しないため、政府が決定した確定保険料（認定決定による確定保険料）を納付しなければならない場合には、政府は、原則としてその納付すべき額（その額に1,000円未満の端数があるときは、その端数は、切り捨てる。）に100分の10を乗じて得た額の追徴金を徴収する。",src:"法21条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"B",q:"追徴金を納付しない者があるときは、政府は、期限を指定して督促しなければならない。",a:true,exp:"設問の通り正しい。労働保険料その他労働保険徴収法の規定による徴収金を納付しない者があるときは、政府は、期限を指定して督促しなければならないとされており、ここにいう「徴収金」には、追徴金も含まれる。なお、追徴金の督促が行われた場合であっても、追徴金について延滞金が徴収されることはない。",src:"法27条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"C",q:"政府は、一般保険料率の引上げを行ったときは、労働保険料を追加徴収するが、この場合には、事業主に対して、期限を指定して、その納付すべき労働保険料の額を納付書により通知しなければならない。",a:true,exp:"設問の通り正しい。なお、設問の場合（労働保険料を追加徴収しようとする場合）、具体的には、所轄都道府県労働局歳入徴収官が、通知を発する日から起算して30日を経過した日をその納期限と定め、事業主に、所定の事項を納付書により通知しなければならないとされている。",src:"法17条、則38条4項、5項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"D",q:"事業主は、被保険者に賃金を支払う都度、当該賃金に応ずる被保険者の負担すべき一般保険料の額に相当する額を当該賃金から控除することができるが、日雇労働被保険者については、当該賃金に応ずる日雇労働被保険者の負担すべき一般保険料の額に相当する額のほか、印紙保険料の額の2分の1の額に相当する額を当該賃金から控除することができる。",a:true,exp:"設問の通り正しい。なお、賃金からの控除を行う場合、事業主は、一般保険料控除計算簿を作成し、事業場ごとにこれを備えなければならない。",src:"法32条1項、則60条1項",cat:"択一式（第2予想 労徴）"},
{no:"2労徴-問10",opt:"E",q:"労働保険料その他労働保険徴収法の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。",a:true,exp:"設問の通り正しい。なお、労働保険料その他労働保険徴収法の規定による徴収金は、労働保険徴収法に別段の定めがある場合を除き、国税徴収の例により徴収することとされている。",src:"法29条",cat:"択一式（第2予想 労徴）"},
{no:"LEC1労徴-問8",opt:"A",q:"事業主から労働者に対して住居施設等が無償で供与される場合において、住居施設等が供与されない労働者に対して、住居の利益を受ける者との均衡を失しない定額の均衡手当が一律に支給されない場合は、当該住居の利益は労働保険徴収法における賃金に該当しない。",a:true,exp:"本肢のとおり正しい（労働保険徴収法2条2項ほか）。なお、賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、所轄労働基準監督署長又は所轄公共職業安定所長の定めるところによる。",src:"法2条2項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"B",q:"事業主が社会保険料、所得税等の労働者負担分を労働協約等の定めによって義務づけられて負担した場合、その負担額に相当する部分は、労働保険徴収法における賃金に該当しない。",a:false,exp:"事業主が社会保険料、所得税等の労働者負担分を労働協約等の定めによって義務づけられて負担した場合、その負担額に相当する部分は、賃金に「該当する」（昭51.3.31労徴発12号）。",src:"昭51.3.31労徴発12号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"C",q:"事業主の定めた奉仕料がいったん客から徴収され、集計されて後に労働者に対して再分配されるものは、労働保険徴収法における賃金に該当しない。",a:false,exp:"事業主の定めた奉仕料がいったん客から徴収され、集計されて後に労働者に対して再分配されるものは、賃金に「該当する」（昭39.5.21基収3343号）。",src:"昭39.5.21基収3343号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"D",q:"結婚祝金、死亡弔慰金、災害見舞金など個人的、臨時的な吉凶禍福に対して支給されるものであって、それが労働協約等によって事業主にその支給が義務づけられているものである場合、労働保険徴収法における賃金に該当する。",a:false,exp:"結婚祝金、死亡弔慰金、災害見舞金など個人的、臨時的な吉凶禍福に対して支給されるものは、それが労働協約等によって事業主にその支給が義務づけられているものであっても、賃金に「該当しない」（昭25.2.16基発127号）。",src:"昭25.2.16基発127号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問8",opt:"E",q:"労働者の退職後の生活保障や在職中の死亡保障を行うことを目的として事業主が労働者を被保険者として保険会社と生命保険等の契約をし、会社が当該保険の保険料を全額負担した場合の当該保険料は、労働保険徴収法の賃金に該当する。",a:false,exp:"労働者の退職後の生活保障や在職中の死亡保障を行うことを目的として事業主が労働者を被保険者として保険会社と生命保険等の契約をし、会社が当該保険の保険料を全額負担した場合の当該保険料は、賃金に「該当しない」（昭30.3.31基災収1239号）。",src:"昭30.3.31基災収1239号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"ア",q:"概算保険料を納付しなかったことによる当該概算保険料の認定決定の通知は、納入告知書によって行われる。",a:false,exp:"概算保険料の認定決定の通知は「納付書」によって行われる（労働保険徴収法施行規則38条4項・5項）。なお、概算保険料の認定決定の通知を受けた事業主は、通知を受けた日から15日以内に、当該認定決定された概算保険料又はその不足額を納付しなければならない（法15条4項）。",src:"則38条4項・5項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"イ",q:"労災保険に係る保険関係が成立している立木の伐採の事業であって賃金総額を正確に算定することが困難なものについては、所轄都道府県労働局長が定める素材1立方メートルを生産するために必要な労務費の額に、生産するすべての素材の材積を乗じて得た額を賃金総額とする。",a:true,exp:"本肢のとおり正しい（則12条、則14条）。",src:"則12条・14条",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"ウ",q:"労災保険に係る保険関係のみが成立していた事業主について、雇用保険に係る保険関係も成立することとなったため、増加概算保険料の納付の要件に該当するに至った場合において、当該事業主が増加概算保険料申告書を提出しないとき、又は提出した増加概算保険料申告書の記載に誤りがあると認められるときは、所轄都道府県労働局歳入徴収官は、増加概算保険料の額を決定し、これを当該事業主に通知しなければならない。",a:false,exp:"増加概算保険料については「認定決定は行われない」（法15条3項、法16条）。",src:"法15条3項・16条",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"エ",q:"事業主が確定保険料を納付しなかったために当該確定保険料について認定決定が行われた場合、当該事業主が口座振替納付の承認を受けていた場合であっても、当該認定決定された確定保険料は口座振替によって納付することはできない。",a:true,exp:"本肢のとおり正しい（則38条の4）。",src:"則38条の4",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問9",opt:"オ",q:"労災保険に係る保険関係が成立している労災保険暫定任意適用事業の事業主は、当該保険関係の消滅の申請をする場合は、その要件の1つとして、当該事業に使用される労働者の過半数の同意を得なければならない。",a:true,exp:"本肢のとおり正しい（整備法8条1項・2項）。",src:"整備法8条1項・2項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"A",q:"第3種特別加入者の当該特別加入に係る事業により業務災害が生じた場合の当該業務災害に係る保険給付の額は、メリット収支率の算定の基礎に算入されない。",a:true,exp:"本肢のとおり正しい（法12条3項）。",src:"法12条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"B",q:"継続事業の令和4年度から令和6年度までの連続する3保険年度間におけるメリット収支率を基礎とした労災保険率の引上げ又は引下げは、令和8年度の労災保険率について行われる。",a:true,exp:"本肢のとおり正しい（法12条3項）。継続事業のメリット制による労災保険率の引上げ又は引下げは、連続する3保険年度中最後の保険年度の次の次の保険年度から行われる。したがって、本肢の場合、令和6年度の次の次の保険年度である令和8年度からメリット制による労災保険率の引上げ又は引下げが行われる。",src:"法12条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"C",q:"連続する3保険年度中の各保険年度において100人以上の労働者を使用する継続事業については、所定の要件を満たせば、継続事業のメリット制が適用されるが、この労働者数には第1種特別加入者も含まれる。",a:true,exp:"本肢のとおり正しい（法12条3項、昭40.11.1基発1454号）。",src:"法12条3項、昭40.11.1基発1454号",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"D",q:"一括有期事業である建設の事業についてメリット制の適用を受けるためには、当該保険年度の請負金額の総額が1億1000万円以上でなければならない。",a:false,exp:"一括有期事業である建設の事業についてメリット制の適用を受けるためには、その要件の1つとして、当該保険年度の「確定保険料の額が40万円以上」でなければならない（法12条3項、則17条3項）。",src:"法12条3項、則17条3項",cat:"択一式（LEC1 労徴）"},
{no:"LEC1労徴-問10",opt:"E",q:"継続事業の一括（一括されている継続事業の一括を含む。）が行われた場合には、メリット制の適用における労災保険に係る保険関係の成立期間は、一括の認可の時期に関係なく、当該指定事業の労災保険に係る保険関係成立の日から起算するため、当該指定事業以外の事業に係る一括前の保険料及び一括前の災害に係る給付は、当該指定事業のメリット収支率の算定の基礎に算入されない。",a:true,exp:"本肢のとおり正しい（法12条3項ほか）。",src:"法12条3項ほか",cat:"択一式（LEC1 労徴）"},
{no:"LEC1雇徴-問8",opt:"A",q:"特例納付保険料の額は、基本額に加算額を加算した額であるが、この加算額は、基本額に100分の10を乗じて得た額とされている。",a:true,exp:"本肢のとおり正しい（労働保険徴収法26条1項、労働保険徴収法施行規則57条）。",src:"法26条1項、則57条",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"B",q:"保険関係が消滅したため確定保険料申告書を提出しなければならない場合において、既に納付した概算保険料額と確定保険料額が同額であったときは、当該確定保険料申告書を日本銀行（本店、支店、代理店及び歳入代理店をいう。）を経由して所轄都道府県労働局歳入徴収官に提出することはできない。",a:true,exp:"本肢のとおり正しい（則38条1項・2項）。納付すべき確定保険料額がない場合の確定保険料申告書の提出は、日本銀行を経由することはできない。",src:"則38条1項・2項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"C",q:"継続事業の一括に係る認可を受けるためには、一括の申請前にそれぞれの事業について保険関係が成立していなければならないため、暫定任意適用事業について、任意加入の申請と同時に継続事業の一括の申請を行うことはできない。",a:false,exp:"必ずしも継続事業の一括の申請前に保険関係が成立している場合に限らず、暫定任意適用事業にあっては、「任意加入の申請と同時に一括の申請をして差し支えないものとされている」（法9条ほか）。",src:"法9条ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"D",q:"雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者（一定の者を除く。）の2分の1以上が希望するときは、雇用保険の任意加入の申請をしなければならない。",a:true,exp:"本肢のとおり正しい（法附則2条3項）。なお、労災保険暫定任意適用事業の事業主は、その事業に使用される労働者の過半数が希望するときは、任意加入の申請をしなければならない（整備法5条2項）。",src:"法附則2条3項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問8",opt:"E",q:"労働保険料その他労働保険徴収法の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとされているため、労働保険料等の徴収金について差押えをしている場合に、国税又は地方税の交付要求があった場合は、差押えに係る徴収金に優先して配当しなければならない。ただし、納付義務者が任意に国税に先んじて徴収金を納付してきた場合にまで、その効力は及ばない。",a:true,exp:"本肢のとおり正しい（法29条、昭56.9.25労徴発68号）。",src:"法29条、昭56.9.25労徴発68号",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"A",q:"事業主は、雇用保険印紙を購入しようとするときは、購入申込書に購入しようとする雇用保険印紙の種類別枚数、購入年月日、労働保険番号並びに事業主の氏名又は名称及び住所又は所在地を記入し、所轄公共職業安定所長に提出しなければならない。",a:false,exp:"事業主は、雇用保険印紙を購入しようとするときは、購入申込書に購入しようとする雇用保険印紙の種類別枚数、購入年月日、労働保険番号並びに事業主の氏名又は名称及び住所又は所在地を記入し、「雇用保険印紙を販売する日本郵便株式会社の営業所」に提出しなければならない（則43条1項）。",src:"則43条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"B",q:"印紙保険料の額は、日雇労働被保険者の賃金の日額に応じて、1人につき1日当たり、176円、146円及び96円の3種類に区分される。",a:true,exp:"本肢のとおり正しい（法22条1項）。",src:"法22条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"C",q:"事業主は、雇用保険印紙を譲り渡し、又は譲り受けてはならない。",a:true,exp:"本肢のとおり正しい（則41条2項）。なお、事業主その他正当な権限を有する者を除いては、何人も消印を受けない雇用保険印紙を所持してはならない（同条3項）。",src:"則41条2項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"D",q:"雇用保険印紙購入通帳の有効期間の更新を受けようとする事業主は、当該雇用保険印紙購入通帳の有効期間が満了する日の翌日の1月前から当該期間が満了する日までの間に、当該雇用保険印紙購入通帳を添えて、労働保険番号、事業主の氏名又は名称及び住所又は所在地並びに事業の名称、事業の行われる場所及び事業の種類を記載した申請書を所轄公共職業安定所長に提出して、新たに雇用保険印紙購入通帳の交付を受けなければならない。",a:true,exp:"本肢のとおり正しい（則42条4項）。",src:"則42条4項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問9",opt:"E",q:"印紙保険料の納付に関する帳簿の調製及び報告に関する事務の処理は、労働保険事務組合に委託することができない。",a:true,exp:"本肢のとおり正しい（法33条1項、平25.3.29基発0329第7号）。",src:"法33条1項、平25.3.29基発0329第7号",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"A",q:"継続事業の一括が行われた場合、当該一括の認可に係る2以上の事業に使用されるすべての労働者は、これらの事業のうち厚生労働大臣が指定するいずれか一の事業（以下本問において「指定事業」という。）に使用される労働者とみなされるが、この指定事業は、一括される事業のうち、労働保険事務を的確に処理する事務能力を有すると認められるものに限られるため、当該一括の申請に係る申請人の希望する事業と必ずしも一致しない場合がある。",a:true,exp:"本肢のとおり正しい（法9条ほか）。",src:"法9条ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"B",q:"政府は、確定保険料の認定決定に伴い徴収される追徴金の納付を督促したときは、当該追徴金の額に、納期限の翌日からその完納又は財産差押えの日の前日までの期間の日数に応じ、原則として、年14.6パーセント（当該納期限の翌日から2月を経過する日までの期間については、原則として、年7.3パーセント）の割合を乗じて計算した延滞金を徴収する。",a:false,exp:"延滞金が徴収されるのは政府が「労働保険料」の納付を督促した場合であって、追徴金の納付を督促した場合には、延滞金は徴収されない（法28条1項）。",src:"法28条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"C",q:"賃金の支払が月2回である場合、事業主は、その月の第1回目の賃金額から労働保険料の被保険者負担相当額を控除せず、その月の第2回目の賃金額から、その月の第1回目の賃金額に応ずる労働保険料の被保険者負担相当額とその月の第2回目の賃金額に応ずる労働保険料の被保険者負担相当額をまとめて控除することができる。",a:false,exp:"賃金からの控除は、被保険者に「賃金を支払う都度、当該賃金に応ずる額」について行うことができるため、本肢のように、第2回目の賃金から第1回目と第2回目の被保険者負担分の労働保険料を「まとめて控除することはできない」（則60条1項）。",src:"則60条1項",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"D",q:"国、都道府県及び市町村の行う事業は、二元適用事業とされている。",a:false,exp:"都道府県及び市町村の行う事業は、二元適用事業とされているが、「国の行う事業は二元適用事業とはされていない」（法39条1項ほか）。",src:"法39条1項ほか",cat:"択一式（LEC1 雇徴）"},
{no:"LEC1雇徴-問10",opt:"E",q:"雇用保険率は、失業等給付費等充当徴収保険率と二事業費充当徴収保険率を合計して得た率とされている。",a:false,exp:"雇用保険率は、失業等給付費等充当徴収保険率、「育児休業給付費充当徴収保険率」及び二事業費充当徴収保険率を合計して得た率とされている（法12条4項）。",src:"法12条4項",cat:"択一式（LEC1 雇徴）"},
{no:"TAC社06-問9",opt:"A",q:"労災保険暫定任意適用事業の事業主が、その事業に使用される労働者の過半数の同意を得ずに労災保険の任意加入の申請をした場合、当該申請は無効である。",a:false,exp:"労災保険暫定任意適用事業の事業主が労災保険の任意加入の申請を行うに当たり、その事業に使用される労働者の同意を得る必要はないため、設問の申請は「有効」である。なお、雇用保険暫定任意適用事業の事業主が雇用保険の任意加入の申請をする場合には、その事業に使用される労働者の2分の1以上の同意を得なければならない（整備法5条1項）。",src:"整備法5条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"B",q:"労働保険の保険関係が成立している事業の事業主は、当該事業を廃止したときは、当該事業に係る保険関係廃止届を所轄都道府県労働局長に提出し、厚生労働大臣の認可があった日の翌日に、当該事業についての保険関係が消滅する。",a:false,exp:"保険関係が成立している事業を廃止したときは、その翌日に、その事業についての保険関係は法律上当然に消滅するため、保険関係消滅のための手続は特に必要としない（「保険関係廃止届」というものは存在しない。）。なお、この場合、事業主は、確定保険料申告書を提出して、労働保険料の精算手続をとらなければならない（法5条）。",src:"法5条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"C",q:"当初、事業規模が一定以上であったため有期事業の一括の対象とされず、独立の有期事業として保険関係が成立した事業が、その後事業の規模に変更等があり、一括の要件を満たすこととなった場合でも、一括扱いの対象とはされない。",a:true,exp:"設問のとおり正しい。なお、有期事業の一括の対象とされた個々の事業について、その後事業の規模に変更等があった場合でも、あくまで当初の一括扱いによることとし、新たに独立の有期事業としては取り扱わない（法7条、昭40.7.31基発901号）。",src:"法7条、昭40.7.31基発901号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"D",q:"請負事業の一括が行われ、その事業を一の事業とみなして元請負人のみが当該事業の事業主とされる場合、当該元請負人は労働関係の当事者として下請負人やその使用する労働者に対して使用者となり、下請負人は当該元請負人に対して労働者となる。",a:false,exp:"請負事業の一括が行われる場合は、労働保険徴収法の規定の適用については、その事業を一の事業とみなし、元請負人のみを当該事業の事業主とするとされているのであって、当該元請負人が労働関係の当事者として下請負人やその使用する労働者に対して使用者となるわけではなく、下請負人も当該元請負人に対して労働者となるわけではない（法8条1項）。",src:"法8条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"E",q:"継続事業の一括の認可を受けるには、それぞれの事業が、労災保険率表に掲げる事業の種類を同じくすることが要件の1つとされているが、雇用保険に係る保険関係が成立している二元適用事業については、当該要件は問われない。",a:false,exp:"継続事業の一括の認可を受けるには、雇用保険に係る保険関係が成立している二元適用事業についても、それぞれの事業が、労災保険率表に掲げる事業の種類を同じくしていなければならない（法9条、則10条1項、昭40.7.31基発901号）。",src:"法9条、則10条1項、昭40.7.31基発901号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"ア",q:"X社は、転勤を命じた場合に転勤先に住居がないため単身で赴任し、一時的に家族と別居するときは単身赴任手当を支給することとしているが、当該手当は、一般保険料の額の算定の基礎となる賃金総額に含めない。",a:false,exp:"単身赴任手当は、賃金と認められるため、一般保険料の額の算定の基礎となる賃金総額に「含める」（法2条2項、法11条2項、昭32.10.18基収5970号の2）。",src:"法2条2項、法11条2項、昭32.10.18基収5970号の2",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"イ",q:"賃金のうち通貨以外のもので支払われるもの（以下「現物給与」という。）の価額の適用に当たっては、労働者の勤務地が所在する都道府県の現物給与の価額を適用することとされているが、派遣労働者については、派遣元と派遣先の事業所が所在する都道府県が異なる場合は、派遣元事業所が所在する都道府県の現物給与の価額を適用することとされている。",a:true,exp:"設問のとおり正しい（法2条3項、令和7.2.28厚労告46号）。",src:"法2条3項、令和7.2.28厚労告46号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"ウ",q:"労災保険に係る保険関係が成立している水産動植物の採捕又は養殖の事業であって、賃金総額を正確に算定することが困難なものについては、都道府県労働局長が定める1日当たりの労務費の額に、それぞれの労働者の使用期間の総日数を乗じて得た額の合算額を賃金総額として一般保険料の額を算定する。",a:false,exp:"労災保険に係る保険関係が成立している水産動植物の採捕又は養殖の事業であって、賃金総額を正確に算定することが困難なものについては、「厚生労働大臣が定める平均賃金に相当する額」に、それぞれの労働者の使用期間の総日数を乗じて得た額の合算額を賃金総額として一般保険料の額を算定する（法11条3項、則12条4号、則15条）。",src:"法11条3項、則12条4号、則15条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"エ",q:"労働保険の保険関係が成立している継続事業であって、労災保険率が1000分の5、雇用保険率が1000分の13.5である事業の事業主に雇用される者が、海外派遣者として特別加入している場合、当該者に係る給付基礎日額が10,000円であるときは、令和8年度の保険年度1年間の第3種特別加入保険料の額は、10,950円となる。",a:true,exp:"設問のとおり正しい（法14条の2第1項、則23条の2、則23条の3、則別表第4）。第3種特別加入保険料率は、一律に1000分の3と定められているため、設問の場合の第3種特別加入保険料の額は、10,000円×365×3/1000＝10,950円である。",src:"法14条の2第1項、則23条の2・23条の3・別表第4",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"オ",q:"牛馬育成、酪農、養鶏又は養豚の事業については、季節的に休業し、又は事業の規模が縮小することのない事業として厚生労働大臣が指定する事業に該当するものとして、一般の事業と同じ失業等給付費等充当徴収保険率が適用される。",a:true,exp:"設問のとおり正しい（法12条4項1号、平成28.12.21厚労告427号）。農林・畜産・養蚕・水産の事業のうち、季節的に休業し、又は事業の規模が縮小することのない事業として厚生労働大臣が指定する事業に係る失業等給付費等充当徴収保険率は、一般の事業と同じ率が適用される。一般の事業に係る失業等給付費等充当徴収保険率は、令和7年度は1000分の7、令和8年度は1000分の6とされている。",src:"法12条4項1号、平成28.12.21厚労告427号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問11",opt:"A",q:"労災保険及び雇用保険に係る保険関係が成立している一元適用事業であって、労働保険事務組合に労働保険事務の処理を委託するものの事業主は、その一般保険料に係る概算保険料申告書を、日本銀行又は所轄労働基準監督署長を経由して所轄都道府県労働局歳入徴収官に提出することができるが、概算保険料を口座振替により納付する場合には、日本銀行を経由して提出することができない。",a:false,exp:"設問の前半が誤り。設問の事業の事業主は、その一般保険料に係る概算保険料申告書を「所轄労働基準監督署長」を経由して提出することはできない（則38条1項・2項6号・7号）。",src:"則38条1項・2項6号・7号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問11",opt:"B",q:"Y社は9月15日に労災保険及び雇用保険に係る保険関係が成立した継続事業であり、労働保険事務組合に労働保険事務の処理を委託しておらず、当該保険年度の概算保険料の額は38万円であった。この場合、事業主は、当該概算保険料について延納の申請をすることができる。",a:false,exp:"設問の場合は、労働保険事務組合に労働保険事務の処理を委託しておらず、また、当該保険年度の概算保険料の額が40万円未満であるため、事業主は、当該保険年度の概算保険料について延納の申請をすることができない（法18条、則27条1項）。",src:"法18条、則27条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問11",opt:"C",q:"6月5日に事業を開始し、その翌年の6月30日に事業を終了する予定の有期事業（一括有期事業を除く。）の事業主であって、納付すべき概算保険料の額が120万円であるものについて、申請により当該概算保険料を延納する場合、第1期分の納期限は6月25日であり、納付額は40万円となる。",a:true,exp:"設問のとおり正しい。設問の場合は、保険関係が成立した日（6月5日）から、その日の属する延納に係る期の末日（7月31日）までの期間が2月を超えていないため、その期を1期として成立させず、次の期に含めて1期とすることとなる。したがって、6月5日から11月30日までを第1期、12月1日から翌年3月31日までを第2期、翌年4月1日から6月30日までを第3期として3回に分けて納付でき、それぞれの期の納付額は120万円÷3＝40万円となる。また、第1期の納期限は、保険関係が成立した日の翌日（6月6日）から起算して20日目である6月25日となる（法18条、則28条）。",src:"法18条、則28条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問11",opt:"D",q:"事業主が概算保険料申告書を提出しなかった場合は、所轄都道府県労働局歳入徴収官が労働保険料の額を決定し、これを当該事業主に通知するとともに、労働保険徴収法第27条に基づく督促が行われる。",a:false,exp:"事業主が概算保険料申告書を提出しなかった場合は、所轄都道府県労働局歳入徴収官が労働保険料の額を決定（認定決定）し、当該事業主に通知して決定した額を納付させることとなるので、督促を行うのは、この通知があってもなお法定納期限まで（通知を受けた日の翌日から起算して15日以内）に納付をしないときとなる（法15条3項・4項、法27条1項）。",src:"法15条3項・4項、法27条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問11",opt:"E",q:"事業主は、賃金総額等の見込額が増加した場合において、増加後の賃金総額等の見込額が増加前の賃金総額等の見込額の100分の200を超え、増加後の賃金総額等の見込額に基づき算定した概算保険料の額と既に納付した概算保険料の額との差額が13万円以上であるときは、増加概算保険料の申告・納付を行わなければならないが、継続事業と有期事業では、申告・納付の期限が異なる。",a:false,exp:"継続事業であっても、有期事業であっても、賃金総額等の増加が見込まれた日から30日以内に申告・納付を行わなければならない。なお、設問の前半の記述は正しい（法16条、則25条1項）。",src:"法16条、則25条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問12",opt:"A",q:"令和8年3月中に賃金締切日があり、令和8年4月1日以後に支払われる賃金は、令和7年度の確定保険料の額の算定基礎となる賃金総額に含める。",a:true,exp:"設問のとおり正しい。保険年度の末日までに支払が確定した賃金であれば、現実にはまだ支払われていないものであっても、その保険年度の確定保険料の額の算定基礎となる賃金総額に含める（法11条2項、法19条1項、昭24.10.5基災収5178号）。",src:"法11条2項、法19条1項、昭24.10.5基災収5178号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問12",opt:"B",q:"確定保険料の認定決定が行われ、既に納付した概算保険料の額が認定決定により決定された確定保険料の額を超える場合の超過額の還付請求は、事業主が、認定決定された額についての通知を受けた日の翌日から起算して10日以内に、労働保険料還付請求書を所轄都道府県労働局歳入徴収官に提出することによって行うものとされている。",a:false,exp:"労働保険料還付請求書の提出先は、「所轄都道府県労働局歳入徴収官」ではなく、「官署支出官」又は「所轄都道府県労働局資金前渡官吏」である。なお、既に納付した概算保険料の額が確定保険料の額（認定決定によるものでない場合）を超える場合におけるその超過額の還付請求は、事業主が確定保険料申告書を提出する際に、労働保険料還付請求書を官署支出官又は所轄都道府県労働局資金前渡官吏に提出することによって行うものとされている（法19条6項、則36条）。",src:"法19条6項、則36条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問12",opt:"C",q:"日雇労働被保険者を使用する事業主は、雇用保険に係る保険関係が消滅したときは、雇用保険印紙購入通帳に、その事由に該当することについて、あらかじめ所轄公共職業安定所長の確認を受けた上で、雇用保険印紙を販売する日本郵便株式会社の営業所に雇用保険印紙購入通帳を提出し、その保有する雇用保険印紙の買戻しを申し出ることができ、買戻しの期間は設けられていない。",a:true,exp:"設問のとおり正しい（則43条2項1号・3項）。",src:"則43条2項1号・3項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問12",opt:"D",q:"印紙保険料の認定決定が行われ、日雇労働被保険者を使用する事業主が決定された印紙保険料及び追徴金を納付する場合には、雇用保険印紙によらず、現金により日本銀行又は所轄都道府県労働局収入官吏に納付しなければならない。",a:true,exp:"設問のとおり正しい（法25条1項・2項、平成15.3.31基発0331002号）。",src:"法25条1項・2項、平成15.3.31基発0331002号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問12",opt:"E",q:"特例納付保険料の対象となるのは、その徴収する権利が時効によって消滅している保険料に限られる。",a:true,exp:"設問のとおり正しい。なお、徴収する権利が時効によって消滅していない保険料については、確定保険料額に係る認定決定をし、徴収することとなる（法26条1項）。",src:"法26条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問13",opt:"A",q:"令和5年5月8日に労災保険に係る保険関係が成立した継続事業であって、当初から100人以上の労働者を使用しているものは、令和8年3月31日時点においては継続事業のメリット制の適用対象とならない。",a:true,exp:"設問のとおり正しい。設問の事業は、令和8年3月31日時点において、労災保険に係る保険関係が成立した後3年以上経過していないため、継続事業のメリット制の適用対象とはされない（法12条3項）。",src:"法12条3項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問13",opt:"B",q:"障害補償年金差額一時金及び遺族補償一時金は、メリット収支率の算定の基礎となる保険給付の額に含めないこととされている。",a:false,exp:"障害補償年金差額一時金については正しいが、「遺族補償一時金」については、労災保険法16条の6第1項2号の場合に支給される遺族補償一時金（遺族補償年金の受給権者が全員失権したことにより支給される遺族補償一時金）はメリット収支率の算定の基礎となる保険給付の額に含めないが、同項1号の場合に支給される遺族補償一時金（遺族補償年金を受けることができる遺族がないときに支給される遺族補償一時金）については、メリット収支率の算定の基礎となる保険給付の額に含める（法12条3項、法20条1項、労災法附則58条4項）。",src:"法12条3項、法20条1項、労災法附則58条4項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問13",opt:"C",q:"労災保険に係る保険関係が成立している建設の事業（有期事業の一括の適用は受けていない。）は、請負金額（消費税等相当額を除く。）が1億1,000万円以上である場合は、確定保険料の額にかかわらず、有期事業のメリット制の適用対象となる。",a:true,exp:"設問のとおり正しい。労災保険に係る保険関係が成立している建設の事業については、確定保険料の額が40万円以上であるもの、又は請負金額（消費税等相当額を除く。）が1億1,000万円以上であるものが有期事業のメリット制の適用対象となる（法20条1項、則35条1項2号）。",src:"法20条1項、則35条1項2号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問13",opt:"D",q:"政府が行う労働保険料その他労働保険徴収法の規定による徴収金の督促は、時効の更新の効力を生ずるので、督促状の指定期限の翌日から、新たな時効が進行することとなる。",a:true,exp:"設問のとおり正しい。政府が行う労働保険料その他労働保険徴収法の規定による徴収金の徴収の告知又は督促は、時効の更新の効力を生ずるとされており、新たな時効の起算日は、徴収の告知の場合には「納入告知の納期限の翌日」であり、督促の場合には「督促状の指定期限の翌日」である（法41条2項、徴収関係事務取扱手引Ⅰ）。",src:"法41条2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問13",opt:"E",q:"雇用保険暫定任意適用事業の事業主は、その事業に使用される労働者の2分の1以上が希望するときは、雇用保険の加入の申請をしなければならず、この申請をしない場合は、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:true,exp:"設問のとおり正しい（法附則2条3項、法附則7条1項）。",src:"法附則2条3項、法附則7条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問14",opt:"A",q:"事業主は、被保険者が負担すべき労働保険料に相当する額を当該被保険者に支払う賃金から控除することが認められているため、例えば月給制で毎月賃金を支払う場合に、1年間分の被保険者が負担すべき保険料額をまとめて控除することもできる。",a:false,exp:"賃金からの被保険者負担保険料額の控除は、被保険者に賃金を支払う都度、当該賃金に応ずる額についてのみ行うことができるものであるから、月給制で毎月賃金を支払う場合に、毎月控除せず1年間分の被保険者が負担すべき保険料額をまとめて控除することはできない（法32条1項、則60条1項）。",src:"法32条1項、則60条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問14",opt:"B",q:"労働保険事務組合に労働保険事務の処理を委託した事業主は、遅滞なく、労働保険事務等処理委託届を、当該労働保険事務組合の主たる事務所の所在地を管轄する都道府県労働局長に提出しなければならない。",a:false,exp:"労働保険事務等処理委託届は、労働保険事務の処理を委託した「事業主」が提出するのではなく、委託を受けた「労働保険事務組合」が提出しなければならない（則64条1項）。",src:"則64条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問14",opt:"C",q:"不動産業を主たる事業とする事業主は、その使用する労働者数が臨時に増加し一時的に100人を超えることとなった場合であっても、常態として100人以下であれば、労働保険事務組合に労働保険事務の処理を委託することができる。",a:false,exp:"不動産業を主たる事業とする事業主については、その使用する労働者数が臨時に増加し一時的に「50人」を超えることとなった場合であっても、常態として「50人」以下であれば、労働保険事務組合に労働保険事務の処理を委託することができる（法33条1項、則62条2項、平成25.3.29基発0329第7号）。",src:"法33条1項、則62条2項、平成25.3.29基発0329第7号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問14",opt:"D",q:"労働保険事務組合の責めに帰すべき理由によって延滞金が徴収されることとなった場合は、当該労働保険事務組合が当該延滞金の納付の責任を負うこととなり、委託事業主が当該延滞金の納付責任を負うことはない。",a:false,exp:"委託事業主が当該延滞金の納付責任を負うことはある。政府が追徴金又は延滞金を徴収する場合において、その徴収について労働保険事務組合の責めに帰すべき理由があるときは、労働保険事務組合は、その限度において、政府に対して当該徴収金の納付の責任を負うが、政府が、労働保険事務組合が納付すべき当該徴収金について、労働保険事務組合に対して滞納処分をしてもなお徴収すべき残余がある場合に限り、委託事業主が直接に納付責任を負うものとされている（法35条2項・3項）。",src:"法35条2項・3項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問14",opt:"E",q:"確定保険料の認定決定に係る処分に不服がある事業主は、当該認定決定に係る処分について、厚生労働大臣に対して審査請求をせずに、直ちに当該処分の取消しの訴えを提起することができる。",a:true,exp:"設問のとおり正しい。労働保険料に関する処分などの労働保険徴収法の規定による行政庁の処分について不服がある場合には、行政不服審査法の規定に基づき、厚生労働大臣に対して審査請求をするか、裁判所に対して処分の取消しの訴えを提起することができる（行訴法8条1項）。",src:"行訴法8条1項",cat:"択一式（TAC社06）"},
{no:"LEC2労徴-問8",opt:"A",q:"継続事業が廃止され、当該廃止の日の属する保険年度の確定保険料の額が、既に納付した当該保険年度の概算保険料の額に満たない場合の精算返還金を受ける権利の消滅時効の起算日は、その廃止の日の翌日（当該確定保険料の申告書が法定納期内に提出されたときは、その提出された日の翌日）である。",a:true,exp:"本肢のとおりである（昭55.9.25労徴発49号）。労働保険料その他労働保険徴収法の規定による徴収金を徴収し、又はその還付を受ける権利は、これらを行使することができる時から「2年」を経過したときは、時効によって消滅する（法41条1項）。",src:"昭55.9.25労徴発49号",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問8",opt:"B",q:"雇用保険暫定任意適用事業の事業主は、その使用する労働者が労働保険徴収法附則第2条第1項の規定による雇用保険に係る保険関係の成立を希望したことを理由として、当該労働者に対して解雇その他不利益な取扱いをしてはならず、これに違反した事業主は、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:true,exp:"本肢のとおりである（法附則6条、法附則7条1項）。",src:"法附則6条・7条1項",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問8",opt:"C",q:"一括有期事業の事業主は、次の保険年度の6月1日から起算して40日以内又は保険関係が消滅した日から起算して50日以内に、所轄都道府県労働局歳入徴収官に対して所定の事項を記載した当該一括有期事業についての報告書の提出を行わなければならない。",a:true,exp:"本肢のとおりである（則34条）。",src:"則34条",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問8",opt:"D",q:"政府は、労働保険料の納付を督促したときは、労働保険料の額に、督促状に記載された期限の翌日からその完納又は財産差押えの日の前日までの期間の日数に応じ、原則として、年14.6パーセント（当該納期限の翌日から2月を経過する日までの期間については、原則として、年7.3パーセント）の割合を乗じて計算した延滞金を徴収する。",a:false,exp:"延滞金の計算の起算日は「納期限」の翌日であって、「督促状に記載された期限」の翌日ではない。政府は、労働保険料の納付を督促したときは、労働保険料の額に、納期限の翌日からその完納又は財産差押えの日の前日までの期間の日数に応じ、原則として、年14.6パーセント（当該納期限の翌日から2月を経過する日までの期間については、原則として、年7.3パーセント）の割合を乗じて計算した延滞金を徴収する（法28条1項）。",src:"法28条1項",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問8",opt:"E",q:"請負による建設の事業であって賃金総額を正確に算定することが困難なものについては、請負金額（消費税等相当額を除く。）に労働保険徴収法施行規則別表第2に掲げる労務費率を乗じて得た額を賃金総額とする。",a:true,exp:"本肢のとおりである（法11条3項、則12条、則13条1項）。",src:"法11条3項・則13条1項",cat:"択一式（LEC2 労徴）"},
{type:"select",no:"LEC2労徴-問9",opt:"延納回数・納期限",context:"次に示す建設の事業である有期事業（一括有期事業には該当しない。）の事業主が概算保険料の延納をする場合、概算保険料の延納の回数及び最初の期の納期限の組合せとして正しいものは【　】である。なお、本問に示す納期限の日は、土曜日、日曜日及び国民の祝日に関する法律に規定する国民の祝日に該当しないものとする。〔保険関係成立の日：令和8年6月10日／保険関係消滅の日：令和9年7月20日／概算保険料の総額：90万円／労働保険事務の処理を労働保険事務組合に委託していない。〕",choices:["概算保険料を3回に分けて延納することができ、最初の期の納期限は令和8年6月30日である。", "概算保険料を3回に分けて延納することができ、最初の期の納期限は令和8年7月10日である。", "概算保険料を4回に分けて延納することができ、最初の期の納期限は令和8年6月30日である。", "概算保険料を4回に分けて延納することができ、最初の期の納期限は令和8年7月10日である。", "概算保険料を4回に分けて延納することができ、最初の期の納期限は令和8年10月31日である。"],answer:"概算保険料を3回に分けて延納することができ、最初の期の納期限は令和8年6月30日である。",exp:"有期事業（一括有期事業を除く）の概算保険料の延納に係る各期は、4月1日〜7月31日、8月1日〜11月30日、12月1日〜翌年3月31日とされる。保険関係成立の日からその日の属する期の末日までの期間が2月以内であるときは、その成立の日からその日の属する期の次の期の末日までが最初の期となる。本問は成立日が令和8年6月10日で同年7月31日までの期間が2月以内のため、令和8年6月10日〜11月30日が最初の期、12月1日〜令和9年3月31日が第2期、令和9年4月1日〜7月20日が第3期となり、概算保険料を「3回」に分けて延納することができる。最初の期に係る納期限は保険関係成立の日の翌日から起算して20日目の「令和8年6月30日」である（則28条）。なお延納の要件は、納付すべき概算保険料の額が75万円以上であること又は労働保険事務の処理が労働保険事務組合に委託されていること、かつ事業の全期間が6月を超えていること。",src:"則28条",cat:"選択式（LEC2 労徴）"},
{no:"LEC2労徴-問10",opt:"A",q:"既に概算保険料を口座振替によって納付している事業主が、賃金総額の見込額が増加したため、増加概算保険料を納付しなければならないこととなった場合、当該増加概算保険料については口座振替によって納付することができる。",a:false,exp:"増加概算保険料は口座振替によって納付することは「できない」（法21条の2第1項、則38条の4）。",src:"法21条の2第1項・則38条の4",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問10",opt:"B",q:"特定の業務に長期間従事することによって発生する疾病であって厚生労働省令で定めるものにかかった者（厚生労働省令で定める事業の種類ごとに、当該事業における就労期間等を考慮して厚生労働省令で定める者に限る。）に係る保険給付の額は、メリット制に係るメリット収支率の計算の基礎となる保険給付の額から除かれるが、この疾病には、建設の事業における著しい騒音を発する場所における業務による難聴等の耳の疾患が含まれる。",a:true,exp:"本肢のとおりである（法12条3項、則17条の2）。",src:"法12条3項・則17条の2",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問10",opt:"C",q:"請負事業の一括の対象となった請負事業に係る下請負人をその請負事業の事業主とする認可を受けようとする元請負人及び下請負人は、やむを得ない理由がある場合を除き、保険関係が成立した日の翌日から起算して20日以内に、下請負人を事業主とする認可申請書を所轄都道府県労働局長に提出しなければならない。",a:false,exp:"正しくは、保険関係が成立した日の翌日から起算して「10日以内」に、下請負人を事業主とする認可申請書を所轄都道府県労働局長に提出しなければならない（則8条）。",src:"則8条",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問10",opt:"D",q:"労災保険率は、労災保険法の規定による保険給付及び社会復帰促進等事業に要する費用の予想額に照らし、将来にわたって、労災保険の事業に係る財政の均衡を保つことができるものでなければならないものとされ、政令で定めるところにより、労災保険法の適用を受ける全ての事業の過去5年間の業務災害、複数業務要因災害及び通勤災害に係る災害率並びに二次健康診断等給付に要した費用の額、社会復帰促進等事業として行う事業の種類及び内容その他の事情を考慮して厚生労働大臣が定める。",a:false,exp:"正しくは、労災保険法の適用を受ける全ての事業の過去「3年間」の業務災害、複数業務要因災害及び通勤災害に係る災害率等を考慮して厚生労働大臣が定める（法12条2項）。",src:"法12条2項",cat:"択一式（LEC2 労徴）"},
{no:"LEC2労徴-問10",opt:"E",q:"有期事業の一括の対象となった建設の事業について、事業開始後にその規模が変更されて請負金額が増加したことにより有期事業の一括の要件を満たさなくなった場合、その満たさなくなった日の翌日から当該事業は独立の有期事業として取り扱われる。",a:false,exp:"一括された個々の事業については、その後、事業の規模の変更等があった場合でも、「あくまで当初の一括扱いによることとし、新たに独立の有期事業として取り扱わない」（昭40.7.31基発901号）。",src:"昭40.7.31基発901号",cat:"択一式（LEC2 労徴）"},
{no:"LEC2雇徴-問8",opt:"ア",q:"労働保険事務組合の責めに帰すべき事由によって発生した延滞金については、当該労働保険事務組合に対して国税滞納処分の例による滞納処分をしてもなお徴収すべき残余がある場合であっても、政府は、その残余の額を当該労働保険事務組合に労働保険事務の処理を委託している事業主から徴収することはできない。",a:false,exp:"本肢の場合、政府は、その残余の額を当該労働保険事務組合に労働保険事務の処理を委託している事業主から徴収することが「できる」（法35条3項）。",src:"法35条3項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問8",opt:"イ",q:"事業主は、雇用保険印紙が変更された場合においては、雇用保険印紙を販売する日本郵便株式会社の営業所に雇用保険印紙購入通帳を提出し、その保有する雇用保険印紙の買戻しを申し出ることができるが、この場合の買戻しの期間は、雇用保険印紙が変更された日から6月間とされている。",a:true,exp:"本肢のとおりである（則43条2項）。",src:"則43条2項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問8",opt:"ウ",q:"令和8年11月1日に保険関係が成立した継続事業の事業主は、概算保険料の額にかかわらず、令和8年度の概算保険料を延納することはできない。",a:true,exp:"本肢のとおりである（則27条1項）。保険年度の中途に保険関係が成立した継続事業に係る概算保険料の延納は、「9月30日までにその保険関係が成立」していなければすることができないため、令和8年11月1日に保険関係が成立した継続事業の事業主は、令和8年度の概算保険料について延納をすることはできない。",src:"則27条1項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問8",opt:"エ",q:"確定保険料に係る認定決定の通知を受けた事業主が、既に納付した概算保険料の額が当該認定決定に係る確定保険料の額を超える場合において、当該認定決定に係る確定保険料の額の通知を受けた日の翌日から起算して10日以内に還付を請求したときは、官署支出官又は所轄都道府県労働局資金前渡官吏は、その超える額を還付するものとされている。",a:true,exp:"本肢のとおりである（則36条1項）。",src:"則36条1項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問8",opt:"オ",q:"労働保険事務組合は、労働保険事務組合の認可申請書に記載された事項に変更を生じた場合には、その変更があった日の翌日から起算して14日以内に、その旨を記載した届書をその主たる事務所の所在地を管轄する都道府県労働局長に提出しなければならない。",a:true,exp:"本肢のとおりである（則65条）。",src:"則65条",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問9",opt:"A",q:"印紙保険料納付計器を設置した事業主は、印紙保険料納付計器の使用状況その他一定の事項を記載した報告書によって、毎月における印紙保険料納付計器の使用状況を翌月末日までに、当該印紙保険料納付計器を設置した事業場の所在地を管轄する公共職業安定所長を経由して、納付計器に係る都道府県労働局歳入徴収官に報告しなければならない。",a:true,exp:"本肢のとおりである（則55条）。",src:"則55条",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問9",opt:"B",q:"事業主は、印紙保険料納付計器の全部又は一部を使用しなくなった場合において、その使用しなくなった際の始動票札を用いて印紙保険料納付計器により既に納付した印紙保険料の額の総額が、当該印紙保険料納付計器により表示することができる印紙保険料の額に相当する金額の総額に満たないときは、納付計器に係る都道府県労働局歳入徴収官に始動票札受領通帳を提出し、その差額に相当する金額の払戻しを申し出ることができる。",a:true,exp:"本肢のとおりである（則53条）。",src:"則53条",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問9",opt:"C",q:"印紙保険料納付計器の設置の承認を受けた事業主は、印紙保険料納付計器を使用する前に、納付計器に係る都道府県労働局歳入徴収官から当該印紙保険料納付計器を始動するために必要な始動標札の交付を受けなければならないが、当該始動票札の交付を受けようとする事業主は、あらかじめ、当該承認を受けた印紙保険料納付計器の名称、型式、計器番号、始動の予定年月日及び当該印紙保険料納付計器により表示しようとする印紙保険料の額に相当する金額の総額その他一定の事項を記載した申請書を日本郵便株式会社の営業所に提出して始動票札受領通帳の交付を受けなければならない。",a:false,exp:"始動票札の交付を受けようとする事業主は、あらかじめ所定の事項を記載した申請書を「納付計器に係る都道府県労働局歳入徴収官」に提出して始動票札受領通帳の交付を受けなければならない。「日本郵便株式会社の営業所」に提出するのではない。なお、本肢前段の記述は正しい（則49条1項、則50条1項）。",src:"則49条1項・50条1項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問9",opt:"D",q:"納付計器に係る都道府県労働局歳入徴収官は、印紙保険料納付計器の設置の承認に係る申請書の提出があった場合には、その事業主が労働保険徴収法第23条第4項の規定により印紙保険料納付計器の設置の承認を取り消された日の翌日から起算して2年を経過するまでの者であるときその他保険料の保全上不適当と認められるときを除き、その承認を与えるものとされている。",a:true,exp:"本肢のとおりである（則47条2項）。なお、事業主は、印紙保険料納付計器の設置の承認を受けようとする場合には、所定の事項を記載した申請書を当該印紙保険料納付計器を設置しようとする事業場の所在地を管轄する公共職業安定所長を経由して、納付計器に係る都道府県労働局歳入徴収官に提出しなければならない（則47条1項）。",src:"則47条2項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問9",opt:"E",q:"印紙保険料納付計器の全部又は一部を使用しなくなった事業主は、当該使用しなくなった印紙保険料納付計器を納付計器に係る都道府県労働局歳入徴収官に提示しなければならず、納付計器に係る都道府県労働局歳入徴収官は、当該提示を受けたときは、当該印紙保険料納付計器の封の解除その他必要な措置を講じなければならない。",a:true,exp:"本肢のとおりである（則52条1項・2項）。",src:"則52条1項・2項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問10",opt:"A",q:"所轄都道府県労働局歳入徴収官は、確定保険料の認定決定に係る追徴金を徴収する場合、通知を発する日から起算して15日を経過した日をその納期限と定め、納入告知書によって、事業主に所定の事項を通知しなければならない。",a:false,exp:"正しくは、通知を発する日から起算して「30日」を経過した日をその納期限と定め、納入告知書によって、事業主に所定の事項を通知しなければならない（法21条3項、則26条、則38条5項）。",src:"法21条3項・則26条",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問10",opt:"B",q:"雇用保険の被保険者の資格取得に係る届出に関する事務の処理は労働保険事務組合に委託することができるが、雇用保険の育児休業給付金の支給申請に関する事務の処理は労働保険事務組合に委託することができない。",a:true,exp:"本肢のとおりである（平25.3.29基発0329第7号）。",src:"平25.3.29基発0329第7号",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問10",opt:"C",q:"賃金総額の見込額が増加し、増加後の賃金総額の見込額が増加前の賃金総額の見込額の100分の200を超えた場合、事業主は、増加後の賃金総額の見込額に基づき算定した概算保険料の額と既に納付した概算保険料の額との差額にかかわらず、増加概算保険料を納付しなければならない。",a:false,exp:"正しくは、増加後の賃金総額の見込額が増加前の賃金総額の見込額の100分の200を超え、「かつ、増加後の賃金総額の見込額に基づき算定した概算保険料の額と既に納付した概算保険料の額との差額が13万円以上となった」場合に、増加概算保険料を納付しなければならない（法16条、則25条1項）。",src:"法16条・則25条1項",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問10",opt:"D",q:"事業主が支給した休業補償の額が平均賃金の60パーセントを超える場合、その超える部分の金額は、労働保険徴収法上の賃金に該当する。",a:false,exp:"休業補償の額が平均賃金の60パーセントを超える場合であっても、その超える部分を含めて、休業補償全体が労働保険徴収法上の賃金に「該当しない」（昭25.12.27基収3432号）。",src:"昭25.12.27基収3432号",cat:"択一式（LEC2 雇徴）"},
{no:"LEC2雇徴-問10",opt:"E",q:"請負事業の一括が行われたことにより元請負人が事業主とされる事業については、当該事業に係る労働者のうち下請負人が使用する日雇労働被保険者に係る印紙保険料については、当該元請負人が納付しなければならない。",a:false,exp:"請負事業の一括が行われたことにより元請負人が事業主とされる場合であっても、当該事業に係る労働者のうち下請負人が使用する日雇労働被保険者に係る印紙保険料については、「下請負人」が納付しなければならない（法23条1項）。",src:"法23条1項",cat:"択一式（LEC2 雇徴）"},
{no:"TAC社06労徴-問8",opt:"A",q:"労働保険の保険関係が成立している事業の事業主は、保険関係成立届によって届け出た事項のうち、所定の事項について変更があったときは、変更を生じた日の属する月の翌月10日までに、名称、所在地等変更届を所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない。",a:false,exp:"名称、所在地等変更届は、「変更を生じた日の翌日から起算して10日以内に」、所轄労働基準監督署長又は所轄公共職業安定所長に提出しなければならない（法4条の2第2項、則5条2項）。設問の「翌月10日まで」ではない。",src:"法4条の2第2項・則5条2項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問8",opt:"B",q:"労災保険に係る保険関係が成立している暫定任意適用事業の事業主は、その事業に使用される労働者の過半数の同意を得ることにより、いつでも、労災保険に係る保険関係の消滅の申請をすることができる。",a:false,exp:"労災保険暫定任意適用事業の事業主が労災保険に係る保険関係の消滅の申請をするには、労働者の過半数の同意を得るほか、擬制任意適用事業以外の事業にあっては保険関係が成立した後1年を経過していること、及び特別保険料が徴収される場合には特別保険料の徴収期間を経過していることが必要である（整備法8条1項・2項）。「いつでも」申請できるわけではない。",src:"整備法8条1項・2項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問8",opt:"C",q:"有期事業の一括には、地域的制限は設けられていないが、それぞれの事業に係る労働保険料の納付の事務は、一の事務所で取り扱われなければならない。",a:true,exp:"本肢のとおりである（法7条、則6条2項3号）。なお、労働保険料の納付を取り扱う一の事務所（一括事務所）とは、当該事業の施工に当たり、かつ、保険料の申告及び納付の事務を行う事務能力のある事務所をいう。",src:"法7条・則6条2項3号",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問8",opt:"D",q:"労災保険に係る保険関係が成立している事業のうち建設の事業又は立木の伐採の事業が数次の請負によって行われる場合には、労働保険徴収法の規定の適用については、それらの事業は一の事業とみなされ、元請負人のみが当該事業の事業主とされる。",a:false,exp:"請負事業の一括は「建設の事業」についてのみ行われ、「立木の伐採の事業」については行われない（法8条1項、則7条）。",src:"法8条1項・則7条",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問8",opt:"E",q:"継続事業の一括の認可があった場合は、厚生労働大臣が指定する一の事業（以下本肢において「指定事業」という。）については、事業規模が拡大することとなるため増加概算保険料の申告・納付の手続を要する場合があるが、指定事業以外の事業については、特段の手続は要しない。",a:false,exp:"継続事業の一括の認可があった場合、指定事業に一括される事業（指定事業以外の事業）については、保険関係が消滅するため、これに伴う労働保険料の確定精算に関する手続が必要となる（法9条、法16条、法19条1項・3項、昭40.7.31基発901号）。",src:"法19条1項・3項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問9",opt:"A",q:"労働保険徴収法第39条第1項に規定する事業以外の事業（一元適用事業）であって、雇用保険法の適用を受けない者を使用するものについては、当該事業を労災保険に係る保険関係及び雇用保険に係る保険関係ごとに別個の事業とみなして一般保険料の額を算定する。",a:true,exp:"本肢のとおりである（整備省令17条1項）。一元適用事業の一般保険料の額の算定は、原則として賃金総額に一般保険料率（労災保険率＋雇用保険率）を乗じて行うが、両保険の適用を受ける労働者の範囲が異なるために賃金総額が一致しない場合は、それぞれの賃金総額にそれぞれの保険料率を乗じて得た額の合計金額を一般保険料の額とする。",src:"整備省令17条1項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問9",opt:"B",q:"業務上の負傷により休業している労働者に対して、就業規則に基づき休業補償の名目により、平均賃金の100分の60を超える額を支給している場合は、平均賃金の100分の60を超える部分については、一般保険料の額の算定の基礎となる賃金総額に含めなければならない。",a:false,exp:"休業補償の額が平均賃金の100分の60を超える場合であっても、その超える部分についても、一般保険料の額の算定の基礎となる賃金総額には「含めない」（法2条2項、法11条2項、昭25.12.27基収3432号）。労働基準法76条に基づく休業補償は労働の対償ではなく賃金と認められないためである。",src:"昭25.12.27基収3432号",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問9",opt:"C",q:"令和8年度の一般の事業に係る雇用保険率は1000分の13.5とされており、その内訳としては、失業等給付費等充当徴収保険率が1000分の6、育児休業給付費充当徴収保険率が1000分の4、二事業費充当徴収保険率が1000分の3.5とされている。",a:true,exp:"本肢のとおりである（法12条4項・5項・8項、令8.3.12厚労告84号・85号）。令和8年度の一般の事業に係る雇用保険率は1000分の13.5（失業等給付費等充当徴収保険率1000分の6＋育児休業給付費充当徴収保険率1000分の4＋二事業費充当徴収保険率1000分の3.5）である。",src:"法12条4項・5項・8項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問9",opt:"D",q:"卸売業を営む個人事業主が、労災保険法第34条第1項の規定に基づき、令和8年6月25日に中小事業主等の特別加入の承認を受けた。当該事業に係る労災保険率は1000分の3、当該特別加入者の給付基礎日額は12,000円である場合、当該事業主に係る令和8年度の第1種特別加入保険料の額は、下記の算式により算定される。12,000円×365×12分の1×10か月×1000分の3",a:true,exp:"本肢のとおりである（法13条、則21条1項、則別表第1・第4）。第1種特別加入保険料の額は、特別加入保険料算定基礎額（給付基礎日額を365倍した額）を12で除した額に、その者が当該保険年度中に第1種特別加入者とされた期間の月数（1月未満の端数は1月とする）を乗じて算定する。令和8年6月25日承認の場合、6月分は1月未満の端数を1月として計算するため令和8年度の月数は「10月」となり、設問の算式となる。",src:"法13条・則21条1項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問9",opt:"E",q:"労働者派遣事業に係る労災保険率の適用については、派遣労働者の派遣先での作業実態に基づき労災保険率適用事業細目表により事業の種類を決定し、労災保険率表による労災保険率を適用することとされている。",a:true,exp:"本肢のとおりである（法12条2項、昭61.6.30発労徴41号・基発383号）。なお、派遣労働者の派遣先での作業実態が数種にわたる場合には、主たる作業実態に基づき事業の種類を決定する。",src:"法12条2項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問10",opt:"A",q:"立木の伐採の事業であって、有期事業の一括の適用を受けているものについては、連続する3保険年度中のいずれかの保険年度の確定保険料の額が40万円未満の場合には、メリット制の適用の対象とならない。",a:true,exp:"本肢のとおりである（法12条3項3号、則17条3項）。建設の事業又は立木の伐採の事業であって有期事業の一括の適用を受けているものは、連続する3保険年度中の各保険年度の確定保険料の額が40万円以上の場合に継続事業のメリット制の適用対象となり得るため、いずれかの保険年度で40万円未満の場合はメリット制の適用対象とならない。",src:"法12条3項3号・則17条3項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問10",opt:"B",q:"労災保険特別支給金支給規則に定める特別支給金は、メリット収支率の算定基礎に含めないこととされている。",a:false,exp:"特別支給金のうち、業務災害に係るもの（一部のものを除く）は、メリット収支率の算定基礎に「含める」（法12条3項、法20条1項、則18条の2、則附則1条の2）。",src:"則18条の2",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問10",opt:"C",q:"事業主の団体又はその連合団体が労働保険事務組合として認可を受けるためには、労働保険事務の委託を予定している事業主が20以上あることが必要である。",a:false,exp:"労働保険事務組合として認可を受けるためには、労働保険事務の委託を予定している事業主が「30」以上あることが必要である（法33条1項・2項、平12.3.31発労徴31号）。「20」以上ではない。",src:"法33条1項・2項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問10",opt:"D",q:"労働保険事務組合は、事業主の委託を受けて、印紙保険料の納付に関する事務を行うことができる。",a:false,exp:"労働保険事務組合は、事業主の委託を受けても、印紙保険料の納付に関する事務を行うことは「できない」（法33条1項）。印紙保険料に関する事項は、労働保険事務組合の受託業務の範囲から除かれている。",src:"法33条1項",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06労徴-問10",opt:"E",q:"労働保険事務組合が政府から労働保険料に係る報奨金の交付を受けるには、その納付すべき労働保険料を督促されることなく完納している必要がある。",a:false,exp:"報奨金の交付を受けるのは、納付すべき労働保険料を督促されることなく完納した場合だけでなく、その納付の状況が著しく良好であると認められるときも交付されることがある（整備法23条、報奨金政令1条1項1号）。",src:"整備法23条",cat:"択一式（TAC社06 労徴）"},
{no:"TAC社06雇徴-問8",opt:"A",q:"前保険年度より保険関係が引き続く一元適用事業である継続事業の事業主であって、労働保険事務組合に労働保険事務の処理を委託しているものについて、社会保険適用事業所の事業主である場合は、一般保険料に係る概算保険料申告書（口座振替による納付を行う場合に提出するものを除く。）を、年金事務所を経由して所轄都道府県労働局歳入徴収官に提出することができる。",a:false,exp:"設問の事業主は労働保険事務組合に労働保険事務の処理を委託しているため、一般保険料に係る概算保険料申告書を年金事務所を経由して提出することはできない（則38条1項、2項2号カッコ書・3号）。年金事務所経由提出ができるのは、労働保険事務組合に労働保険事務の処理を委託していないこと等の要件を満たす場合である。",src:"則38条1項・2項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問8",opt:"B",q:"労災保険及び雇用保険に係る保険関係が成立している継続事業において、令和7年度に使用したすべての労働者に係る賃金総額の確定額が6,800万円であり、令和8年度に使用するすべての労働者に係る賃金総額の見込額が3,500万円である場合、令和8年度の概算保険料の額は、3,500万円にその事業に適用される令和8年度の一般保険料率を乗じて得た額となる。なお、一般保険料以外の対象となる者はいないものとする。",a:false,exp:"令和8年度の賃金総額の見込額（3,500万円）が令和7年度の賃金総額の確定額（6,800万円）の100分の50以上100分の200以下の範囲内であるため、賃金総額見込額の特例が適用され、令和8年度の概算保険料の額は、令和7年度の賃金総額の確定額「6,800万円」を令和8年度の賃金総額の見込額として一般保険料率を乗じて計算する（法11条1項・2項、法15条1項1号、則24条1項）。",src:"法15条1項1号・則24条1項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問8",opt:"C",q:"10月15日に労災保険及び雇用保険に係る保険関係が成立した継続事業については、当該保険年度の概算保険料を延納することができず、11月24日までに当該概算保険料を納付しなければならない。",a:false,exp:"10月15日に保険関係が成立した継続事業については、当該保険年度の概算保険料を延納することができず、保険関係が成立した日の翌日から起算して「50日以内」に納付しなければならないため、納期限は「12月4日」となる（法15条1項、則27条1項）。設問の「11月24日まで」ではない。",src:"法15条1項・則27条1項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問8",opt:"D",q:"甲社は、建設工事を請け負い、工事を開始したが、概算保険料（250万円）について6回の延納が認められている。この場合、最初の期に納付すべき額は、416,670円となる。",a:true,exp:"本肢のとおりである（則28条2項、国等の債権債務等の金額の端数計算に関する法律3条、昭43.3.12基発123号）。延納の場合の各期の納付額は概算保険料の額を期の数で除した額であるが、1円未満の端数を生じたときは第1期分に加えて納付する。設問では、2,500,000÷6＝416,666.666…により第2期から第6期は各416,666円となり、最初の期は2,500,000−416,666×5＝416,670円となる。",src:"則28条2項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問8",opt:"E",q:"概算保険料について延納が認められている継続事業の事業主が労働保険徴収法第17条に規定する概算保険料の追加徴収の通知を受けた場合、追加徴収される概算保険料については延納することができない。",a:false,exp:"概算保険料について延納が認められている事業主は、追加徴収の通知により指定された納期限までに延納の申請をすることにより、追加徴収される概算保険料についても延納することができる（法17条、法18条、則31条）。",src:"法18条・則31条",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問9",opt:"A",q:"労災保険に係る保険関係のみが成立していた事業が、新たに雇用保険に係る保険関係が成立したため当該事業に係る一般保険料率が変更し、変更後の一般保険料率に基づいて算定した概算保険料の額が、既に納付した概算保険料の額の100分の200を超えた場合であっても、その差額が13万円未満であるときは、増加概算保険料の申告・納付の対象とならない。",a:true,exp:"本肢のとおりである（法附則5条、則附則4条1項）。保険関係の拡大による一般保険料率の変更の場合、変更後の一般保険料率に基づき算定した概算保険料の額が既に納付した概算保険料の額の100分の200を超え、「かつ」、その差額が13万円以上である場合に増加概算保険料の申告・納付の対象となる。差額が13万円未満であれば対象とならない。",src:"法附則5条・則附則4条1項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問9",opt:"B",q:"事業主が所定の要件に該当するにもかかわらず、増加概算保険料申告書を提出しなかった場合には、所轄都道府県労働局歳入徴収官は増加概算保険料の額を決定し、これを当該事業主に通知することとされているが、この場合、追徴金は徴収しない。",a:false,exp:"増加概算保険料については、「認定決定は行われない」（法16条）。設問のように所轄都道府県労働局歳入徴収官が増加概算保険料の額を決定して通知するという手続はない。",src:"法16条",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問9",opt:"C",q:"継続事業の事業主が既に納付した概算保険料の額が、確定保険料の額を超える場合であって、当該事業主から当該超過額の還付請求がないときは、所轄都道府県労働局歳入徴収官は、当該超過額を次の保険年度の概算保険料又は未納の労働保険料等に充当するものとされており、また、充当したときは、その旨を当該事業主に通知しなければならない。",a:true,exp:"本肢のとおりである（法19条6項、則37条）。納付した概算保険料の額が確定保険料の額を超える場合で、事業主から超過額の還付請求がないときは、所轄都道府県労働局歳入徴収官は当該超過額を次の保険年度の概算保険料又は未納の労働保険料等に充当し、充当したときはその旨を当該事業主に通知しなければならない。",src:"法19条6項・則37条",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問9",opt:"D",q:"労働保険料の納付義務者の住所又は居所がわからないため、公示送達の方法によって労働保険料の納付を督促した場合は、督促状の指定期限までに労働保険料が完納されないときであっても、延滞金は徴収しない。",a:true,exp:"本肢のとおりである（法28条5項2号）。公示送達の方法によって督促する場合に延滞金を徴収しないこととしているのは、滞納者の住所又は居所が不明のため、その督促の徹底を期することが困難である点を考慮したものである。",src:"法28条5項2号",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問9",opt:"E",q:"事業主は、既に納付した概算保険料の額が確定保険料の額に足りない場合はその不足額を納付しなければならないが、当該不足額の納付については、口座振替による納付の対象となる。",a:true,exp:"本肢のとおりである（法21条の2第1項、則38条の4）。口座振替による納付の対象となる労働保険料は、納付書によって行われる概算保険料（延納により納付する場合を含む）及び確定保険料であり、確定保険料の不足額の納付も口座振替の対象となる。",src:"法21条の2第1項・則38条の4",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問10",opt:"ア",q:"特例納付保険料の額は、労働保険徴収法第26条第1項に規定する厚生労働省令で定めるところにより算定した基本額に、当該額に100分の10を乗じて得た額を加算した額とされている。",a:true,exp:"本肢のとおりである（法26条1項、則56条、則57条）。",src:"法26条1項・則56条・57条",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問10",opt:"イ",q:"厚生労働大臣は、特例納付保険料の対象事業主に対して、特例納付保険料の納付を勧奨しなければならない。ただし、やむを得ない事情のため当該勧奨を行うことができない場合は、この限りでない。",a:true,exp:"本肢のとおりである（法26条2項）。",src:"法26条2項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問10",opt:"ウ",q:"請負事業の一括の規定により元請負人が事業主とされる場合は、当該元請負人が、その使用する日雇労働被保険者及び下請負人が使用する日雇労働被保険者に係る印紙保険料を納付しなければならない。",a:false,exp:"請負事業の一括が適用されている場合であっても、雇用保険に係る保険関係は一括されないため、下請負人が使用する日雇労働被保険者に係る印紙保険料については、当該「下請負人」が納付しなければならない（法23条1項カッコ書）。元請負人が納付するのではない。",src:"法23条1項カッコ書",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問10",opt:"エ",q:"日雇労働被保険者を5日間雇用する事業主が、賃金を最終日の5日目にまとめて支払う場合、雇用保険印紙による印紙保険料の納付については、当該最終日に、5日分の雇用保険印紙をその者の日雇労働被保険者手帳の該当日欄にはり、これに消印をすることによって印紙保険料を納付すればよい。",a:true,exp:"本肢のとおりである（法23条1項・2項、則40条1項）。事業主は日雇労働被保険者に賃金を支払う都度その者に係る印紙保険料を納付しなければならないため、賃金を後払いとしたり一定の日数分を一度に支払ったときは、現実に賃金が支払われるときに雇用保険印紙の貼付及び消印を行えばよい。",src:"則40条1項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC社06雇徴-問10",opt:"オ",q:"事業主は、被保険者が負担すべき労働保険料相当額を当該被保険者に支払う賃金から控除することができるが、日雇労働被保険者にあっては、印紙保険料の額の2分の1の額（その額に1円未満の端数があるときは、その端数は、切り捨てる。）及び当該日雇労働被保険者が負担すべき一般保険料の額を、当該日雇労働被保険者に支払う賃金から控除することができる。",a:true,exp:"本肢のとおりである（法31条1項・2項、法32条1項）。日雇労働被保険者にあっては、印紙保険料の額の2分の1の額（1円未満の端数は切り捨て）及び当該日雇労働被保険者が負担すべき一般保険料の額を、支払う賃金から控除することができる。",src:"法31条1項・2項・法32条1項",cat:"択一式（TAC社06 雇徴）"},
{no:"TAC公開労徴-問8",opt:"A",q:"労働保険徴収法第2条第2項の賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、厚生労働大臣の定めるところによるとされている。",a:false,exp:"労働保険徴収法2条2項の賃金に算入すべき通貨以外のもので支払われる賃金の範囲は、食事、被服及び住居の利益のほか、「所轄労働基準監督署長又は所轄公共職業安定所長」の定めるところによるとされている（則3条）。なお、通貨以外のもので支払われるものの評価に関し必要な事項は、厚生労働大臣が定めることとされている。",src:"則3条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問8",opt:"B",q:"従業員の退職後の生活保障又は在職中の死亡保障を行うことを目的として事業主が従業員を被保険者として保険会社と生命保険等の契約をし、会社が当該保険の保険料を全額負担した場合の当該保険料は、一般保険料の額の算定基礎となる賃金総額に含めなければならない。",a:false,exp:"設問の場合の保険料は、賃金と認められないため、一般保険料の額の算定基礎となる賃金総額には「含めない」（法2条2項、法11条2項、昭26.6.15基収2542号）。",src:"昭26.6.15基収2542号",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問8",opt:"C",q:"労災保険に係る保険関係が成立している請負による建設の事業であって、一般保険料の額の算定に当たり賃金総額を正確に算定することが困難なものについては、請負金額（消費税等相当額を除く。）を当該事業の賃金総額とすることとされている。",a:false,exp:"設問の場合には、「その事業の種類に従い、請負金額（消費税等相当額を除く。）に労務費率を乗じて得た額」を当該事業の賃金総額とする（法11条3項、則12条1号、則13条1項）。請負金額そのものを賃金総額とするのではない。",src:"法11条3項・則13条1項",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問8",opt:"D",q:"特別加入する海外派遣者に係る第3種特別加入保険料の額の算定に用いる第3種特別加入保険料率は、派遣先の事業の種類に係る労災保険率と同一の率とされる。",a:false,exp:"第3種特別加入保険料率は、「一律に1000分の3」である（法14条の2第1項、則23条の3）。派遣先の事業の種類に係る労災保険率と同一の率ではない。",src:"法14条の2第1項・則23条の3",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問8",opt:"E",q:"雇用保険に係る一般保険料は、事業主と被保険者が一定割合ずつを負担することとされているが、建設の事業における令和8年度の雇用保険率は、1000分の16.5とされており、事業主が1000分の10.5に相当する額を、被保険者が1000分の6に相当する額を負担する。",a:true,exp:"本肢のとおりである（法12条4項・5項・8項、法31条1項1号・3項、令8.3.12厚労告84号・85号）。雇用保険に係る一般保険料については、被保険者は雇用保険率に応ずる部分の額から二事業費に係る額（就職支援法事業分を除く。）を減じた額の2分の1を負担し、残りの部分を事業主が負担するものとされている。",src:"法31条1項1号・3項",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問9",opt:"ア",q:"事業主は、あらかじめ代理人を選任し、その旨を所轄労働基準監督署長又は所轄公共職業安定所長に届け出ている場合には、労働保険徴収法施行規則によって事業主が行わなければならない届出に係る事項について、その代理人に行わせることができる。",a:true,exp:"本肢のとおりである（則73条）。事業主は、あらかじめ代理人を選任した場合には、労働保険徴収法施行規則によって事業主が行わなければならない事項を、その代理人に行わせることができるが、代理人を選任し、又は解任したときは、代理人選任・解任届により、その旨を所轄労働基準監督署長又は所轄公共職業安定所長に届け出なければならない。",src:"則73条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問9",opt:"イ",q:"法人が解散した場合には、その事業が廃止されたものとみなされ、その清算が結了する前であっても、解散した日の翌日に保険関係が消滅する。",a:false,exp:"設問の場合は、「解散した日の翌日」ではなく、特別の事情がない限り「その清算結了の日の翌日」に保険関係が消滅する（法5条、適用手引1編2章3ハ）。単に営業廃止の法律上の手続が完了したときをもって直ちに事業の廃止とみるべきではなく、現実にその事業の活動が停止され、その事業における労働関係が消滅したときをもって事業の廃止又は終了があったと解すべきであるとされている。",src:"法5条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問9",opt:"ウ",q:"一括有期事業に係る労働保険徴収法施行規則の規定による事務については、労働保険料の納付の事務を取り扱う一の事務所の所在地を管轄する都道府県労働局長及び労働基準監督署長を、それぞれ、所轄都道府県労働局長及び所轄労働基準監督署長とする。",a:true,exp:"本肢のとおりである（則6条3項）。一括有期事業については、労働保険徴収法施行規則の規定による労働保険事務は、一括事務所の所在地を管轄する都道府県労働局長及び労働基準監督署長が行うこととされている。",src:"則6条3項",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問9",opt:"エ",q:"労災保険に係る保険関係が成立している建設の事業が数次の請負によって行われる場合において、下請負人の請負に係る事業が有期事業の一括の対象となる規模を超えるときは、当該下請負人の請負に係る事業については、法律上当然に請負事業の一括から分離し、独立した保険関係が成立する。",a:false,exp:"設問の場合、法律上当然に請負事業の一括から分離するのではなく、元請負人及び下請負人が共同で申請し、厚生労働大臣の認可を受けることにより、元請負人の請負に係る事業から下請負人の請負に係る事業を分離し、独立した保険関係が成立することとなる（法8条、則7条、則9条）。",src:"法8条・則9条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問9",opt:"オ",q:"継続事業の一括について厚生労働大臣の認可があったときは、労働保険徴収法の規定の適用については、当該認可に係る2以上の事業に使用されるすべての労働者は、これらの事業のうち厚生労働大臣が指定するいずれか一の事業に使用される労働者とみなされ、厚生労働大臣が指定する一の事業以外の事業に係る保険関係は消滅する。",a:true,exp:"本肢のとおりである（法9条）。",src:"法9条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問10",opt:"A",q:"継続事業のメリット制の適用要件に係る連続する3保険年度中の各保険年度の労働者数は、船きょ、船舶、岸壁、波止場、停車場又は倉庫における貨物の取扱いの事業にあっては、当該保険年度中に使用した延労働者数を当該保険年度中の所定労働日数で除して算定する。",a:true,exp:"本肢のとおりである（法12条3項、則17条1項）。なお、設問の事業以外の事業にあっては、当該保険年度中の各月の末日（賃金締切日がある場合は、各月の末日の直前の賃金締切日）において使用した労働者数の合計数を12で除して算定する。",src:"法12条3項・則17条1項",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問10",opt:"B",q:"メリット収支率を算定する基礎となる保険給付の額は、特定の業務に長期間従事することにより発症する一定の疾病にかかった者に係る保険給付の額は除くこととされているが、この疾病には、建設の事業にあっては、労働基準法施行規則別表第1の2第3号2のいわゆる「非災害性腰痛」が含まれる。",a:false,exp:"建設の事業にあっては、いわゆる「非災害性腰痛」は特定疾病に含まれない（法12条3項、法20条1項、則17条の2）。",src:"則17条の2",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問10",opt:"C",q:"有期事業のメリット制に係る収支率の算定に当たっては、その事業が終了した日から3箇月を経過した日前の期間で算定する場合は、第1種調整率を用い、その事業が終了した日から9箇月を経過した日前の期間で算定する場合は、第2種調整率を用いる。",a:true,exp:"本肢のとおりである（法20条1項）。有期事業のメリット制に係る収支率の算定においては、①その事業が終了した日から3箇月を経過した日前の期間を算定対象とする場合と、②その事業が終了した日から9箇月を経過した日前の期間を算定対象とする場合の2通りがあり、①の期間で算定した収支率がその日以後において変動せず、又は厚生労働省令で定める範囲を超えて変動しないと認められる場合は①の期間で、これに該当する場合以外の場合は②の期間で、それぞれ収支率を算定する。",src:"法20条1項",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問10",opt:"D",q:"事業主若しくは事業主であった者又は労働保険事務組合若しくは労働保険事務組合であった団体は、労働保険徴収法又は労働保険徴収法施行規則の規定による書類をその完結の日から3年間（雇用保険被保険者関係届出事務等処理簿にあっては、4年間）保存しなければならない。",a:true,exp:"本肢のとおりである（則72条）。",src:"則72条",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開労徴-問10",opt:"E",q:"確定保険料の認定決定の処分がなされたが、当該処分について不服がある場合は、厚生労働大臣に対して審査請求をすることができる。",a:true,exp:"本肢のとおりである（行審法4条3号）。なお、直ちに処分の取消しの訴えを提起することもできる。",src:"行審法4条3号",cat:"択一式（TAC公開 労徴）"},
{no:"TAC公開雇徴-問8",opt:"A",q:"労働保険事務組合の認可を受けた団体について組織変更があり、認可を受けたときは法人でなかった団体がその後法人となった場合であって、その後も引き続いて労働保険事務組合としての業務を行おうとするときは、従前の労働保険事務組合についての業務を廃止する旨の届書を提出するとともに、あらためて認可申請をしなければならない。",a:true,exp:"本肢のとおりである（法33条2項・3項、労働保険事務組合事務処理手引）。なお、労働保険事務組合の認可を受けたときは法人であった団体がその後法人でなくなった場合であって、その後も引き続いて労働保険事務組合としての業務を行おうとするときにも、従前の労働保険事務組合についての業務を廃止する旨の届書を提出するとともに、あらためて認可申請をしなければならない。",src:"法33条2項・3項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問8",opt:"B",q:"常時300人の労働者を使用する清掃業を主たる事業とする事業主は、労働保険事務組合に労働保険事務の処理を委託することができない。",a:false,exp:"設問の事業主は、労働保険事務組合に労働保険事務の処理を委託することが「できる」（法33条1項、則62条2項、平25.3.29基発0329第7号）。委託することができる事業主は、その使用する労働者数が常時300人（金融業若しくは保険業、不動産業又は小売業を主たる事業とする場合にあっては常時50人、卸売業又はサービス業を主たる事業とする場合にあっては常時100人）以下の事業主であるが、清掃業、火葬業、と畜業、自動車修理業及び機械修理業はこれらの業種に含めないものとされているため、清掃業を主たる事業とする事業主は常時300人以下であれば委託することができる。",src:"法33条1項・則62条2項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問8",opt:"C",q:"政府は、労働保険事務組合に労働保険事務の処理を委託した事業主に対してすべき労働保険料の納入の告知その他の通知及び還付金の還付については、これを労働保険事務組合に対してすることができるが、この場合において、労働保険事務組合に対してした労働保険料の納入の告知その他の通知及び還付金の還付は、労働保険事務組合と当該事業主との間の委託契約の内容いかんによっては、当該事業主に対してなされたものとみなされる。",a:false,exp:"設問の場合において、労働保険事務組合に対してした労働保険料の納入の告知その他の通知及び還付金の還付は、労働保険事務組合と当該事業主との間の委託契約の内容の「いかんにかかわらず」、当該事業主に対してなされたものとみなされる（法34条、平12.3.31発労徴31号）。",src:"法34条",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問8",opt:"D",q:"政府は、事業主から、預金又は貯金の払出しとその払い出した金銭による印紙保険料以外の労働保険料の納付（厚生労働省令で定めるものに限る。）をその預金口座又は貯金口座のある金融機関に委託して行うことを希望する旨の申出があった場合には、その申出を承認しなければならない。",a:false,exp:"政府は、事業主から設問の申出があった場合には、「その納付が確実と認められ、かつ、その申出を承認することが労働保険料の徴収上有利と認められるときに限り、その申出を承認することができる」とされている（法21条の2第1項）。必ず承認しなければならないわけではない。",src:"法21条の2第1項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問8",opt:"E",q:"前保険年度より保険関係が引き続く継続事業において、年度更新期間（6月1日〜7月10日）の確定精算に伴う精算返還金に係る時効の起算日は7月11日とされている。ただし、確定保険料申告書が法定納期限内に提出された場合は、時効の起算日はその提出された日の翌日とされる。",a:false,exp:"設問の「7月11日」は、正しくは「6月1日」である（法41条1項、平21.2.27基発0227003号、徴収関係事務取扱手引Ⅰ）。なお、その他の記述は正しい。",src:"法41条1項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問9",opt:"A",q:"労災保険に係る保険関係が成立している建設の事業であって、事業期間4年間、請負金額40億円のものについては、各保険年度ごとに概算保険料を申告・納付しなければならない。",a:false,exp:"設問の有期事業は、その事業規模（請負金額40億円）から、有期事業の一括の対象とはなり得ず、保険年度ごとに概算保険料を申告・納付することはない（法15条2項）。設問の事業のように一括有期事業以外の有期事業については、保険関係が成立した日（当該保険関係が成立した日の翌日以後に中小事業主等の特別加入の承認があった事業に係る第1種特別加入保険料に関しては、当該承認があった日）から20日以内に、概算保険料を申告・納付しなければならない。",src:"法15条2項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問9",opt:"B",q:"労災保険及び雇用保険に係る保険関係が4月15日に成立した継続事業の事業主であって、労働保険事務組合に労働保険事務の処理を委託しているものについて、当該保険関係が成立した保険年度の納付すべき概算保険料の額が110万円である場合、延納を申請することにより、当該概算保険料を3回に分けて納付することができるが、この場合、第1期分は納期限が6月4日、納付額は366,668円であり、第2期分は納期限が10月31日、納付額は366,666円であり、第3期分は納期限が翌年1月31日、納付額は366,666円である。",a:false,exp:"設問の事業は、継続事業であり、労働保険事務組合に労働保険事務の処理を委託しているため、第2期及び第3期の納期限は14日遅く設定されており、第2期分の納期限は「11月14日」、第3期分の納期限は「翌年2月14日」である。なお、その他の記述は正しい。設問の事業は4月15日に保険関係が成立した事業であるため、概算保険料を3回に分けて納付することができ、第1期分の納期限は保険関係が成立した日の翌日から起算して50日目である6月4日となる。また、各期の納付額は、1,100,000円÷3＝366,666.666…円により、第2期及び第3期は各366,666円、第1期は1,100,000円−366,666円×2＝366,668円となる。",src:"法18条・則27条",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問9",opt:"C",q:"政府が、保険年度の中途に、一般保険料率、第1種特別加入保険料率、第2種特別加入保険料率又は第3種特別加入保険料率の引下げを行ったときは、事業主は、既に納付した概算保険料の額と引き下げた保険料率に基づき算定した概算保険料の額との差額について、官署支出官又は所轄都道府県労働局資金前渡官吏に労働保険料還付請求書を提出することにより、還付を請求することができる。",a:false,exp:"設問の場合に、その還付を行うとする規定はない（法17条）。なお、保険料率の引上げが行われたときは概算保険料の追加徴収が行われる。",src:"法17条",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問9",opt:"D",q:"保険関係が成立している継続事業の事業主は、当該保険年度における概算保険料について、賃金総額の見込額を1,000万円として算定し、165,000円を所定の納期限までに申告・納付したが、保険年度の中途に賃金総額の見込額が2,000万円に増加し、これに基づき算定した概算保険料の額が330,000円となった。この場合、当該事業主は、増加概算保険料を申告・納付する必要はない。",a:true,exp:"本肢のとおりである（法16条、則25条）。増加概算保険料は、増加後の賃金総額等の見込額が増加前の賃金総額等の見込額の100分の200を超え、かつ、増加後の賃金総額等の見込額に基づき算定した概算保険料の額と既に納付した概算保険料の額との差額が13万円以上であるときに、申告・納付しなければならない。設問の場合は、増加後の賃金総額の見込額が増加前の賃金総額の見込額の100分の200であり、100分の200を「超えていない」ため、差額は13万円以上であるが、増加概算保険料を申告・納付する必要はない。",src:"法16条・則25条",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問9",opt:"E",q:"事業主が労働保険料を滞納したため、政府が労働保険料の納付を督促し、延滞金を徴収することとなった場合において、労働保険料の額の一部につき納付があったときは、その納付の日前の期間に係る延滞金の額の計算の基礎となる労働保険料の額については、その納付のあった労働保険料の額を控除した額とする。",a:false,exp:"設問の場合において、労働保険料の額の一部につき納付があったときは、その納付の「日以後」の期間に係る延滞金の額の計算の基礎となる労働保険料の額について、その納付のあった労働保険料の額を控除した額とする（法28条2項）。「納付の日前」ではない。",src:"法28条2項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問10",opt:"A",q:"事業主は、既に納付した概算保険料の額と確定保険料の額が同一であり納付すべき労働保険料がない場合であっても、確定保険料申告書を所轄都道府県労働局歳入徴収官に提出しなければならないが、この場合は、日本銀行を経由して提出することはできない。",a:true,exp:"本肢のとおりである（法19条1項、則38条1項、2項4号・7号）。事業主は、既に納付した概算保険料の額と確定保険料の額が同一であり納付すべき労働保険料がない場合は、確定保険料申告書を所轄都道府県労働局歳入徴収官に提出するに当たって、日本銀行を経由することができない。",src:"法19条1項・則38条2項",cat:"択一式（TAC公開 雇徴）"},
{no:"TAC公開雇徴-問10",opt:"B",q:"9月30日に事業が終了した有期事業の事業主は、同年11月19日までに確定保険料申告書を所轄都道府県労働局歳入徴収官に提出しなければならない。",a:true,exp:"本肢のとおりである（法5条、法19条2項、則38条1項）。有期事業の事業主は、保険関係が消滅した日から50日以内に確定保険料申告書を提出しなければならないが、設問の場合は、9月30日に事業が終了しているので、保険関係消滅日は10月1日であり、同年11月19日までに確定保険料申告書を提出しなければならないこととなる。",src:"法19条2項・則38条1項",cat:"択一式（TAC公開 雇徴）"},
