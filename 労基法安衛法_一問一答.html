<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>労基法・安衛法 一問一答</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0;letter-spacing:.03em}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.02em}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}
/* Progress */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0;letter-spacing:.05em}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}
/* Card */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:10px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-type-badge{font-size:10px;letter-spacing:.08em;border-radius:4px;padding:2px 8px;font-weight:600}
.q-type-badge.ox{color:#5bb8e0;background:rgba(91,184,224,.1);border:1px solid rgba(91,184,224,.2)}
.q-type-badge.sel{color:#82c97a;background:rgba(130,201,122,.1);border:1px solid rgba(130,201,122,.2)}
.q-num{font-size:11px;color:#556070;letter-spacing:.05em}
.q-text{font-size:14px;line-height:1.8;color:#d8d0c0;word-break:break-all;padding-right:40px}
.q-blank{background:rgba(201,122,74,.15);border:1px solid rgba(201,122,74,.3);border-radius:4px;padding:1px 8px;color:#e8a87a;font-weight:600;display:inline-block;margin:0 2px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}
/* OX buttons */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* Select (4-choice) buttons */
.choices-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.btn-choice{border-radius:10px;padding:13px 16px;font-size:13px;font-weight:500;cursor:pointer;transition:transform .1s,background .15s;text-align:left;line-height:1.5;border:1.5px solid #283848;background:#131920;color:#c8c0b0}
.btn-choice:hover{background:#1a2434;border-color:#556070}
.btn-choice:active{transform:scale(.98)}
.btn-choice:disabled{cursor:default}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
/* Result panel */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:.05em}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:13px;line-height:1.7;color:#a0b0c0}
.result-source{font-size:11px;color:#556070;margin-top:8px;letter-spacing:.05em}
/* Navigation buttons */
.nav-btns{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;letter-spacing:.03em}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:active{transform:scale(.98)}
.btn-nav:disabled{opacity:.3;cursor:default}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s,transform .1s;border:none;background:#c97a4a;color:#1a0a00;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}
.btn-next:active{transform:scale(.98)}
/* Result screen */
.result-screen{display:none;text-align:center;padding:28px 16px}
.result-screen.show{display:block}
.score-circle{width:150px;height:150px;border-radius:50%;border:3px solid #c97a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 22px}
.score-big{font-size:44px;font-weight:700;color:#e8a87a;line-height:1}
.score-denom{font-size:13px;color:#8a9bb0;margin-top:4px}
.score-pct{font-size:17px;font-weight:600;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s;letter-spacing:.04em}
.btn-retry:hover{background:rgba(201,122,74,.12)}
.btn-retry.gold{border-color:#e8c97a;color:#e8c97a}
.btn-retry.gold:hover{background:rgba(232,201,122,.1)}
/* Start screen */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filter-section{margin-bottom:16px}
.filter-label{font-size:12px;color:#556070;letter-spacing:.08em;margin-bottom:8px;text-align:center}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.filter-btn{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #283848;background:transparent;color:#8a9bb0;cursor:pointer;transition:all .15s}
.filter-btn.active{border-color:#c97a4a;color:#c97a4a;background:rgba(201,122,74,.1)}
.controls{display:flex;justify-content:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.btn-ctrl{font-size:12px;padding:5px 14px;border-radius:6px;border:1px solid #283848;background:transparent;color:#8a9bb0;cursor:pointer;letter-spacing:.05em;transition:all .15s}
.btn-ctrl.active{border-color:#c97a4a;color:#c97a4a;background:rgba(201,122,74,.1)}
.btn-start{background:#c97a4a;color:#1a0800;border:none;border-radius:10px;padding:13px 36px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.1em;transition:background .15s;display:block;width:100%;max-width:280px;margin:0 auto 10px}
.btn-start:hover{background:#e8a87a}
.btn-start.secondary{background:transparent;border:1.5px solid #e8c97a;color:#e8c97a;font-size:14px}
.btn-start.secondary:hover{background:rgba(232,201,122,.1)}
.btn-start:disabled{opacity:.35;cursor:not-allowed}
/* Bookmark list */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;letter-spacing:.08em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-type{font-size:10px;border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600;color:#5bb8e0;background:rgba(91,184,224,.1);border:1px solid rgba(91,184,224,.2)}
.bm-type.sel{color:#82c97a;background:rgba(130,201,122,.1);border-color:rgba(130,201,122,.2)}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>社会保険労務士 試験対策</h1>
    <div class="title">労基法・安衛法 一問一答</div>
    <div class="subtitle">選択式20問 ＋ 択一式60問 計80問</div>
  </div>

  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" onclick="switchTab('start')">問題</button>
    <button class="nav-tab" onclick="switchTab('bookmark')" id="tabBm">★ 栞 <span class="bm-badge" id="bmBadge" style="display:none"></span></button>
  </div>

  <!-- Start Screen -->
  <div id="startScreen">
    <span class="start-count" id="startCount">80</span>
    <span class="start-unit">問（選択式20問 ＋ 択一式60問）</span>
    <div class="start-desc">選択式は語群から選択、択一式は○×で回答します。</div>
    <div class="filter-section">
      <div class="filter-label">出題範囲</div>
      <div class="filter-row" id="filterRow"></div>
    </div>
    <div class="controls">
      <button class="btn-ctrl" id="btnShuffle" onclick="toggleShuffle()">シャッフル</button>
    </div>
    <button class="btn-start" onclick="startQuiz()">スタート →</button>
    <button class="btn-start secondary" onclick="startBookmarked()" id="btnStartBm" style="display:none">★ 栞の問題のみ</button>
  </div>

  <!-- Bookmark List -->
  <div class="bookmark-list" id="bookmarkList">
    <div class="section-title">栞をつけた問題</div>
    <div id="bmItems"></div>
    <div style="margin-top:14px;text-align:center" id="bmActions"></div>
  </div>

  <!-- Quiz Screen -->
  <div id="quizScreen" style="display:none">
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-num" id="progressNum">1 / 80</span>
        <span class="progress-score" id="progressScore">正解 0 問</span>
      </div>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="card">
      <div class="q-meta">
        <span class="q-tag" id="qTag">問1</span>
        <span class="q-type-badge" id="qTypeBadge">○×</span>
        <span class="q-num" id="qNum"></span>
      </div>
      <p class="q-text" id="qText"></p>
      <button class="btn-bookmark" id="btnBookmark" onclick="toggleBookmark()" title="栞をつける">☆</button>
    </div>

    <!-- OX buttons -->
    <div class="btn-row" id="oxRow">
      <button class="btn-answer btn-maru" id="btnMaru" onclick="answerOx(true)">○<span class="btn-label">CORRECT</span></button>
      <button class="btn-answer btn-batsu" id="btnBatsu" onclick="answerOx(false)">×<span class="btn-label">WRONG</span></button>
    </div>

    <!-- Select choices -->
    <div class="choices-grid" id="choicesGrid" style="display:none"></div>

    <div class="result-panel" id="resultPanel">
      <div class="result-header" id="resultHeader"></div>
      <div class="result-exp" id="resultExp"></div>
      <div class="result-source" id="resultSource"></div>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題 →</button>

    <div class="nav-btns">
      <button class="btn-nav" id="btnBack" onclick="goBack()">← 戻る</button>
      <div></div>
      <button class="btn-nav" id="btnSkip" onclick="skipQuestion()">スキップ →</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="result-screen" id="resultScreen">
    <div class="score-circle">
      <span class="score-big" id="finalScore">0</span>
      <span class="score-denom" id="finalDenom">/ 80</span>
    </div>
    <div class="score-pct" id="finalPct"></div>
    <div class="breakdown">
      <div class="breakdown-item"><div class="breakdown-num ok" id="okCount">0</div><div class="breakdown-label">正解</div></div>
      <div class="breakdown-item"><div class="breakdown-num ng" id="ngCount">0</div><div class="breakdown-label">不正解</div></div>
      <div class="breakdown-item"><div class="breakdown-num sk" id="skCount">0</div><div class="breakdown-label">未回答</div></div>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="btns-wrap">
      <button class="btn-retry" onclick="resetToStart()">最初から</button>
      <button class="btn-retry" onclick="retryWrong()" id="btnRetryWrong">間違えた問題のみ</button>
      <button class="btn-retry gold" onclick="retrySkipped()" id="btnRetrySkipped" style="display:none">未回答問題のみ</button>
    </div>
  </div>
</div>

<script>
// ========================== QUESTION DATA ==========================

function mkOx(no,opt,q,a,exp,src,cat){
  return {type:'ox',no,opt,q,a,exp,src,cat};
}
function mkSel(no,opt,context,choices,answer,exp,src){
  return {type:'select',no,opt,context,choices:[...choices],answer,exp,src,cat:'選択式'};
}

const ALL_QUESTIONS = [
// ===== 選択式 問1 =====
mkSel('選択1','空欄A',
  '「何人も、法律に基いて許される場合の外、【空欄A】他人の就業に介入して利益を得てはならない。」（労基法6条）',
  ['業として','主業として','他人の求めに応じて','使用者と連帯して'],
  '業として',
  '中間搾取の排除（労基法6条）。「業として」他人の就業に介入して利益を得ることを禁じる。',
  '労基法6条'),
mkSel('選択1','空欄B',
  '「使用者は、公民としての権利行使等のために必要な時間を請求した場合は拒んではならない。但し、【空欄B】限り、請求された時刻を変更することができる。」（労基法7条）',
  ['権利の行使又は公の職務の執行に妨げがない','事業の正常な運営を妨げる場合に','就業規則又は労働協約等に定めがある場合に','労働者の同意を得た場合に'],
  '権利の行使又は公の職務の執行に妨げがない',
  '公民権行使（労基法7条）。「権利の行使又は公の職務の執行に妨げがない」限り時刻変更可。',
  '労基法7条'),
mkSel('選択1','空欄C',
  '「使用者は、労働契約の不履行について【空欄C】を定め、又は損害賠償額を予定する契約をしてはならない。」（労基法16条）',
  ['違約金','罰則','減給の制裁','保証金'],
  '違約金',
  '賠償予定の禁止（労基法16条）。「違約金」の定めと損害賠償額の予定を禁じる。',
  '労基法16条'),
mkSel('選択1','空欄D',
  '「労働安全衛生法は、…危害防止基準の確立、責任体制の明確化及び【空欄D】活動の促進の措置を講ずる…」（安衛法1条）',
  ['自主的','自発的','主体的','積極的'],
  '自主的',
  '安衛法の目的（安衛法1条）。「自主的」活動の促進。目的条文は完全暗記が必要。',
  '安衛法1条'),
mkSel('選択1','空欄E',
  '「…職場における労働者の【空欄E】を確保するとともに、快適な職場環境の形成を促進することを目的とする。」（安衛法1条）',
  ['安全と健康','安全と衛生','安全','健康'],
  '安全と健康',
  '安衛法の目的（安衛法1条）。「安全と健康」の確保。①安全 ②衛生 ではなく「安全と健康」である点に注意。',
  '安衛法1条'),

// ===== 選択式 問2 =====
mkSel('選択2','空欄A',
  '「解雇予告の規定は…試の使用期間中の者が【空欄A】を超えて引き続き使用されるに至った場合においては、この限りでない。」（労基法20条）',
  ['14日','7日','10日','30日'],
  '14日',
  '解雇予告除外（労基法20条）。試用期間中の者は14日を超えて使用されるに至ると適用対象となる。',
  '労基法20条'),
mkSel('選択2','空欄B',
  '「解雇の予告の規定を適用しない者：【空欄B】使用される者」（労基法21条）',
  ['２箇月以内の期間を定めて','１箇月以内の期間を定めて','４箇月以内の期間を定めて','期間を定めて'],
  '２箇月以内の期間を定めて',
  '解雇予告除外（労基法21条）。「２箇月以内の期間を定めて」使用される者は適用除外。',
  '労基法21条'),
mkSel('選択2','空欄C',
  '「解雇の予告の規定を適用しない者：季節的業務に【空欄C】以内の期間を定めて使用される者」（労基法21条）',
  ['４箇月','２箇月','１箇月','６箇月'],
  '４箇月',
  '季節的業務に「４箇月」以内の期間を定めて使用される者は解雇予告の適用除外。',
  '労基法21条'),
mkSel('選択2','空欄D',
  '「厚生労働大臣は、【空欄D】の意見をきいて、労働災害防止計画を策定しなければならない。」（安衛法6条）',
  ['労働政策審議会','社会保障審議会','地方労働審議会','労働保険審査会'],
  '労働政策審議会',
  '労災防止計画（安衛法6条）。「労働政策審議会」の意見を聴いて策定。',
  '安衛法6条'),
mkSel('選択2','空欄E',
  '「厚生労働大臣は、労働災害防止計画の実施のために必要があると認めるときは、事業者等に対し、必要な【空欄E】をすることができる。」（安衛法9条）',
  ['勧告又は要請','助言','助言又は指導','援助'],

mkOx('択一_労基1','A','労基法1条2項は「この法律で定める基準を理由として労働条件を低下させてはならない」と規定するが、社会経済情勢の変動等、他に決定的な理由がある場合には当該規定に違反しない。',true,'社会経済情勢等の変動を理由とする労働条件の低下は、法1条2項違反とはならない（昭和63.3.14基発150号）。','労基法1条2項','択一式（労基法）'),
mkOx('択一_労基1','B','労基法2条2項では、使用者だけでなく労働者に対しても、労働協約・就業規則・労働契約の遵守義務を課している。',true,'「労働者及び使用者は」遵守し誠実に義務を履行しなければならない（法2条2項）。使用者だけでなく労働者も対象。','労基法2条2項','択一式（労基法）'),
mkOx('択一_労基1','C','使用者が労働者の国籍を理由として賃金について差別的取扱いをすることは、労基法3条に違反する。',true,'均等待遇（法3条）は国籍・信条・社会的身分を理由とした賃金・労働時間等の差別的取扱いを禁じる。','労基法3条','択一式（労基法）'),
mkOx('択一_労基1','D','労基法4条では、女性であることを理由として賃金その他の労働条件について男性と差別的取扱いをすることを禁止している。',false,'法4条が禁じるのは「賃金」についての差別的取扱いのみ。「その他の労働条件」についての差別禁止は規定されていない。','労基法4条','択一式（労基法）'),
mkOx('択一_労基1','E','労基法5条（強制労働の禁止）に違反した場合には、労基法上最も重い罰則（1年以上10年以下の拘禁刑または20万円以上300万円以下の罰金）が適用される。',true,'法5条違反には労基法中最重罰の罰則が適用される。','労基法5条、法117条','択一式（労基法）'),

// ===== 択一式 労基法 問2 =====
mkOx('択一_労基2','A','労基法で定める基準に違反する労働条件を定める労働契約は、基準を上回る部分も含め全体として無効となる。',false,'無効になるのは「基準に達しない部分」のみ。上回る部分は有効。無効部分は法定基準に補充される（法13条）。','労基法13条','択一式（労基法）'),
mkOx('択一_労基2','B','一定の事業の完了に必要な期間を定める労働契約を締結する場合は、3年を超える契約期間を定めることができる。',true,'法14条1項は「一定の事業の完了に必要な期間を定めるもの」を3年の上限から除外している。','労基法14条1項','択一式（労基法）'),
mkOx('択一_労基2','C','満60歳の労働者が2年の期間を定めて労働契約を締結した場合、期間初日から1年経過後にいつでも退職することができる。',false,'満60歳以上の労働者との契約は法14条1項2号に該当し、附則137条（1年後の任意退職）の適用除外となる。','労基法14条1項2号、附則137条','択一式（労基法）'),
mkOx('択一_労基2','D','産前産後の女性が法65条により休業する期間及びその後30日間は、やむを得ない事由のために事業の継続が不可能となった場合でも解雇してはならない。',false,'天災事変等やむを得ない事由で事業継続不可の場合は解雇制限が解除される（行政官庁の認定要）（法19条）。','労基法19条','択一式（労基法）'),
mkOx('択一_労基2','E','6月30日の終了をもって労働者を解雇する場合（解雇手当なし）は、6月1日までに解雇の予告をしなければならない。',false,'解雇予告期間は予告翌日から暦日30日以上必要。6月30日終了なら「5月31日まで」に予告が必要（6/1〜6/30の30日間）。','労基法20条1項','択一式（労基法）'),

// ===== 択一式 労基法 問3 =====
mkOx('択一_労基3','ア','出来高払制・請負制で使用する労働者については、使用者は労働時間に応じた一定額の賃金保障をしなければならない。',true,'出来高払制の保障給（法27条）。労働時間に応じた一定額の賃金保障義務がある。','労基法27条','択一式（労基法）'),
mkOx('択一_労基3','イ','平均賃金とは、算定事由発生日以前3箇月の賃金総額をその期間の総労働日数で除した金額をいう。',false,'除する分母は「総日数」（暦日数）であり、「総労働日数」ではない。','労基法12条1項','択一式（労基法）'),
mkOx('択一_労基3','ウ','6箇月ごとに支給される通勤定期乗車券は、法11条の賃金に該当するが、平均賃金の算定基礎には含まれない。',false,'通勤定期券は賃金の前払として認められ、平均賃金の算定基礎に含めなければならない（昭33.2.13基発90号）。','労基法12条4項','択一式（労基法）'),
mkOx('択一_労基3','エ','労働協約に通貨以外の支払に関する定めがある場合でも、当該協約の適用を受けない労働者には通貨以外での支払はできない。',true,'賃金の通貨払原則（法24条1項）。労働協約による例外は、その協約の適用を受ける労働者にのみ及ぶ。','労基法24条1項','択一式（労基法）'),
mkOx('択一_労基3','オ','最高裁判例によれば、賃金の全額払規定は一般的には使用者の相殺を制限するものではない。',false,'最高裁（福島県教組事件）は、全額払規定は「使用者の相殺を許されない」趣旨も包含するとした。よって「制限しない」は誤り。','労基法24条1項、最一小昭44.12.18','択一式（労基法）'),

// ===== 択一式 労基法 問4 =====
mkOx('択一_労基4','A','三菱重工判例によれば、労基法32条の労働時間とは使用者の指揮命令下に置かれている時間をいい、客観的に定まるものとされている。',true,'使用者の指揮命令下の時間が「労働時間」であり、労働契約・就業規則・労働協約の定めで変わらない（最一小平12.3.9三菱重工長崎造船所事件）。','労基法32条','択一式（労基法）'),
mkOx('択一_労基4','B','1か月単位の変形労働時間制を採用する場合は、就業規則等で変形期間の起算日を明らかにしなければならない。',true,'1箇月単位の変形労働時間制（法32条の2）では起算日を明らかにする必要がある（則12条の2）。','労基法32条の2','択一式（労基法）'),
mkOx('択一_労基4','C','フレックスタイム制で清算期間が1箇月の場合、使用者は労使協定を所轄労働基準監督署長に届け出る必要はない。',true,'清算期間が1箇月以内の場合は届出不要。1箇月を超える場合は届出が必要（法32条の3第4項）。','労基法32条の3','択一式（労基法）'),
mkOx('択一_労基4','D','1年単位の変形労働時間制における1日10時間・週52時間の労働時間限度は、特定期間には適用されない。',false,'特定期間についても労働時間の限度規定は適用される。ただし特定期間は週48時間超の連続週数等に別途制約がある（法32条の4第3項）。','労基法32条の4','択一式（労基法）'),
mkOx('択一_労基4','E','1週間単位の非定型的変形労働時間制を採用する場合、労使協定に労働日ごとの労働時間を定める必要はない。',true,'1週間単位の非定型的変形制では、各日の労働時間は前週末等に「通知」すれば足り、労使協定への記載は不要（法32条の5）。','労基法32条の5','択一式（労基法）'),

// ===== 択一式 労基法 問5 =====
mkOx('択一_労基5','A','休憩時間の利用について事業場の規律保持を理由に制限を加えることは、休憩の目的を害わない場合であっても許されない。',false,'休憩の目的を害わない限り、規律保持上必要な制限を加えることは差し支えない（昭22.9.13発基17号）。','労基法34条3項','択一式（労基法）'),
mkOx('択一_労基5','B','労働時間が6時間以内の場合には休憩時間を与える必要はない。',true,'法34条1項は「6時間を超える場合」に45分以上、「8時間を超える場合」に1時間以上の休憩を義務付ける。6時間以内は不要。','労基法34条1項','択一式（労基法）'),
mkOx('択一_労基5','C','坑内労働の場合であっても、休憩時間は労働時間の途中に与えなければならない。',true,'坑内労働について休憩の途中付与の例外規定は設けられていない。',  '労基法34条1項','択一式（労基法）'),
mkOx('択一_労基5','D','休日とは労働義務がない日をいい、原則として午前0時から午後12時までの1暦日の休みのことである。',true,'法35条の「休日」は原則として1暦日（0時〜24時）の単位。','労基法35条','択一式（労基法）'),
mkOx('択一_労基5','E','休日と労働日を振り替える場合は、振り替える前にあらかじめ振り替えるべき日を特定することが必要である。',true,'休日の振替には、事前に特定した日を特定して行う必要がある（昭23.4.5基発535号）。','労基法35条','択一式（労基法）'),

mkOx('択一_労基6','A','36協定は所轄労働基準監督署長に届け出ることで効力が発生する。届出なしで法定時間外労働をさせると労基法違反となる。',true,'36協定の効力発生要件は届出（法36条1項）。届出前の法定外労働は法32条違反。','労基法36条1項','択一式（労基法）'),
mkOx('択一_労基6','B','36協定には、1日・1箇月・1年それぞれの期間について、時間外延長可能時間や休日労働可能日数を定めなければならない。',true,'36協定の必要記載事項（法36条2項4号）に1日・1箇月・1年の各限度時間等が含まれる。','労基法36条2項4号','択一式（労基法）'),
mkOx('択一_労基6','C','36協定の絶対的上限として「1箇月について時間外労働+休日労働が100時間未満」の要件を満たさなければならない。',true,'法36条6項2号。時間外+休日労働の1箇月合計が100時間未満でなければならない。','労基法36条6項2号','択一式（労基法）'),
mkOx('択一_労基6','D','フレックスタイム制（清算期間1箇月以内）では、法定労働時間の総枠を超えた時間が時間外労働となる。',true,'フレックスタイム制の時間外労働は清算期間における法定労働時間総枠を超えた時間（法37条1項）。','労基法37条1項','択一式（労基法）'),
mkOx('択一_労基6','E','法定休日労働（深夜に及ばない）で8時間を超えた部分については、通常賃金の6割以上の割増賃金が必要である。',false,'法定休日労働の割増率は3割5分以上（一律）。8時間超でも6割は不要。深夜に及べば別途加算（則20条）。','労基法37条1項、則20条','択一式（労基法）'),

mkOx('択一_労基7','A','労働者が事業場外で業務に従事し労働時間を算定し難い場合は、法定労働時間労働したものとみなされる。',false,'事業場外みなしは「所定労働時間」労働したものとみなされる（法38条の2第1項）。法定ではなく所定。','労基法38条の2第1項','択一式（労基法）'),
mkOx('択一_労基7','B','専門業務型裁量労働制の対象業務は、事業の運営に関する企画・立案・調査・分析の業務である。',false,'それは企画業務型裁量労働制（法38条の4）の説明。専門業務型（法38条の3）は厚生労働省令で定める業務（研究・情報処理・デザイン等）。','労基法38条の3','択一式（労基法）'),
mkOx('択一_労基7','C','企画業務型裁量労働制は、労使協定を所轄労働基準監督署長に届け出ることで採用できる。',false,'企画業務型は「労使委員会の委員の5分の4以上の多数による議決」が必要。労使協定では採用できない（法38条の4）。','労基法38条の4','択一式（労基法）'),
mkOx('択一_労基7','D','機密の事務を取り扱う者は、所轄労働基準監督署長の許可を受けることで労働時間等の適用除外となる。',false,'機密の事務を取り扱う者（法41条2号）は許可不要で当然に適用除外。許可が必要なのは「監視・断続的労働従事者」（則34条）。','労基法41条2号','択一式（労基法）'),

// ========================== INIT ==========================
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
// Shuffle choices for select type
ALL_QUESTIONS.forEach(q=>{if(q.type==='select')q.choices=shuffleArray(q.choices);});

const CATS=[...new Set(ALL_QUESTIONS.map(q=>q.cat))];
let questions=[];
let current=0;
let answers=[];  // null | {correct:bool, userChoice:any}
let bookmarks=new Set();
let selectedCats=new Set();
let shuffleMode=false;
let currentTab='start';
let currentQIndex=-1;

function loadBookmarks(){
  try{const s=localStorage.getItem('roki_bm');if(s)bookmarks=new Set(JSON.parse(s));}catch(e){}
}
function saveBookmarks(){
  try{localStorage.setItem('roki_bm',JSON.stringify([...bookmarks]));}catch(e){}
}

function initFilters(){
  const row=document.getElementById('filterRow');
  const all=document.createElement('button');
  all.className='filter-btn active';all.textContent='すべて';all.dataset.val='all';
  all.onclick=()=>{
    selectedCats.clear();
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.val==='all'));
    updateStartCount();
  };
  row.appendChild(all);
  CATS.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';btn.textContent=c;btn.dataset.val=c;
    btn.onclick=()=>{
      document.querySelector('.filter-btn[data-val="all"]').classList.remove('active');
      btn.classList.toggle('active');
      if(selectedCats.has(c))selectedCats.delete(c);else selectedCats.add(c);
      if(selectedCats.size===0)document.querySelector('.filter-btn[data-val="all"]').classList.add('active');
      updateStartCount();
    };
    row.appendChild(btn);
  });
}

function updateStartCount(){
  let pool=ALL_QUESTIONS;
  if(selectedCats.size>0)pool=ALL_QUESTIONS.filter(q=>selectedCats.has(q.cat));
  document.getElementById('startCount').textContent=pool.length;
}

function updateBmBadge(){
  const cnt=bookmarks.size;
  const badge=document.getElementById('bmBadge');
  badge.style.display=cnt>0?'inline-block':'none';
  badge.textContent=cnt;
  const btn=document.getElementById('btnStartBm');
  if(btn)btn.style.display=cnt>0?'block':'none';
}

function toggleShuffle(){shuffleMode=!shuffleMode;document.getElementById('btnShuffle').classList.toggle('active',shuffleMode);}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-tab').forEach((t,i)=>{
    t.classList.toggle('active',(i===0&&tab==='start')||(i===1&&tab==='bookmark'));
  });
  document.getElementById('startScreen').style.display=tab==='start'?'':'none';
  const bl=document.getElementById('bookmarkList');
  if(tab==='bookmark'){bl.classList.add('show');renderBmList();}else bl.classList.remove('show');
}

function renderBmList(){
  const container=document.getElementById('bmItems');
  const actions=document.getElementById('bmActions');
  if(bookmarks.size===0){
    container.innerHTML='<div class="empty-bm">栞がついている問題はありません。<br>問題を解きながら ☆ ボタンで栞をつけられます。</div>';
    actions.innerHTML='';return;
  }
  container.innerHTML='';
  [...bookmarks].forEach(idx=>{
    const q=ALL_QUESTIONS[idx];if(!q)return;
    const isSel=q.type==='select';
    const div=document.createElement('div');
    div.className='bm-item';
    div.innerHTML=`<span class="bm-star">★</span><span class="bm-tag">${q.no}</span><span class="bm-type${isSel?' sel':''}">${isSel?'選択式':'○×'}</span><span class="bm-text">${isSel?q.context.replace('【空欄'+q.opt.replace('空欄','')+'】','【　】'):q.q}</span>`;
    container.appendChild(div);
  });
  actions.innerHTML=`<button class="btn-retry gold" onclick="startBookmarked()">★ 栞の問題を解く</button>
    <button class="btn-retry" style="border-color:#e05050;color:#e05050" onclick="clearBookmarks()">すべて削除</button>`;
}

function clearBookmarks(){
  if(!confirm('すべての栞を削除しますか？'))return;
  bookmarks.clear();saveBookmarks();updateBmBadge();renderBmList();
}

function startQuiz(pool){
  if(!pool){
    let p=ALL_QUESTIONS.map((q,i)=>({...q,_origIdx:i}));
    if(selectedCats.size>0)p=p.filter(q=>selectedCats.has(q.cat));
    if(shuffleMode)p=shuffleArray(p);
    pool=p;
  }
  questions=pool;
  current=0;
  answers=new Array(questions.length).fill(null);
  document.getElementById('startScreen').style.display='none';
  document.getElementById('bookmarkList').classList.remove('show');
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizScreen').style.display='block';
  document.getElementById('navTabs').style.display='none';
  renderQuestion();
}

function startBookmarked(){
  const pool=[...bookmarks].map(i=>({...ALL_QUESTIONS[i],_origIdx:i})).filter(Boolean);
  if(pool.length===0)return;
  startQuiz(pool);
}

function getOrigIdx(q){return q._origIdx!==undefined?q._origIdx:ALL_QUESTIONS.indexOf(q);}

// ========================== RENDER ==========================
function renderQuestion(){
  if(current>=questions.length){showResult();return;}
  const q=questions[current];
  currentQIndex=getOrigIdx(q);
  const total=questions.length;
  const answered=answers[current];

  // Progress
  document.getElementById('progressNum').textContent=`${current+1} / ${total}`;
  const corrCount=answers.filter(a=>a&&a.correct).length;
  document.getElementById('progressScore').textContent=`正解 ${corrCount} 問`;
  document.getElementById('progressFill').style.width=`${(current/total)*100}%`;

  // Tag & type badge
  document.getElementById('qTag').textContent=q.no;
  const badge=document.getElementById('qTypeBadge');
  const isSel=q.type==='select';
  badge.textContent=isSel?'語群選択':'○×';
  badge.className='q-type-badge '+(isSel?'sel':'ox');
  document.getElementById('qNum').textContent=q.opt||'';

  // Text
  const qTextEl=document.getElementById('qText');
  if(isSel){
    const blankLabel=q.opt.replace('空欄','');
    const html=q.context.replace(`【空欄${blankLabel}】`,`<span class="q-blank">　${q.opt}　</span>`);
    qTextEl.innerHTML=html;
  }else{
    qTextEl.textContent=q.q;
  }

  // Bookmark
  const bBtn=document.getElementById('btnBookmark');
  bBtn.textContent=bookmarks.has(currentQIndex)?'★':'☆';
  bBtn.classList.toggle('active',bookmarks.has(currentQIndex));

  // Show/hide UI
  document.getElementById('oxRow').style.display=isSel?'none':'grid';
  document.getElementById('choicesGrid').style.display=isSel?'grid':'none';

  // Result panel
  const panel=document.getElementById('resultPanel');
  const nextBtn=document.getElementById('btnNext');

  if(answered){
    // Re-show answered state
    if(isSel){
      renderChoices(q,answered.userChoice,true);
    }else{
      renderOxButtons(q,answered.userChoice,true);
    }
    showResultPanel(q,answered.correct);
    nextBtn.style.display='block';
  }else{
    if(isSel){
      renderChoices(q,null,false);
    }else{
      renderOxButtons(q,null,false);
    }
    panel.style.display='none';
    panel.className='result-panel';
    nextBtn.style.display='none';
  }

  // Back/skip buttons
  document.getElementById('btnBack').disabled=current===0;
  document.getElementById('btnSkip').style.display=answered?'none':'block';
  document.getElementById('btnSkip').disabled=false;
}

function renderOxButtons(q,userChoice,isAnswered){
  const bm=document.getElementById('btnMaru');
  const bb=document.getElementById('btnBatsu');
  bm.className='btn-answer btn-maru';
  bb.className='btn-answer btn-batsu';
  bm.disabled=false;bb.disabled=false;
  if(isAnswered){
    bm.disabled=true;bb.disabled=true;
    if(userChoice===true){
      bm.className=q.a===true?'btn-answer correct-chosen':'btn-answer wrong-chosen';
      if(q.a!==true)bb.className='btn-answer reveal-correct';
    }else{
      bb.className=q.a===false?'btn-answer correct-chosen':'btn-answer wrong-chosen';
      if(q.a!==false)bm.className='btn-answer reveal-correct';
    }
  }
}

function renderChoices(q,userChoice,isAnswered){
  const grid=document.getElementById('choicesGrid');
  grid.innerHTML='';
  q.choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='btn-choice';
    btn.textContent=c;
    if(isAnswered){
      btn.disabled=true;
      if(c===q.answer){btn.className='btn-choice reveal-correct';}
      if(c===userChoice&&c!==q.answer){btn.className='btn-choice wrong-chosen';}
      if(c===userChoice&&c===q.answer){btn.className='btn-choice correct-chosen';}
    }else{
      btn.onclick=()=>answerSelect(c);
    }
    grid.appendChild(btn);
  });
}

function showResultPanel(q,isCorrect){
  const panel=document.getElementById('resultPanel');
  panel.style.display='block';
  panel.className=isCorrect?'result-panel correct':'result-panel wrong';
  document.getElementById('resultHeader').textContent=isCorrect?'✓ 正解！':'✗ 不正解';
  document.getElementById('resultExp').textContent=q.exp;
  document.getElementById('resultSource').textContent='根拠：'+q.src;
}

// ========================== ANSWER ==========================
function answerOx(userAnswer){
  if(answers[current])return;
  const q=questions[current];
  const isCorrect=userAnswer===q.a;
  answers[current]={correct:isCorrect,userChoice:userAnswer};
  renderOxButtons(q,userAnswer,true);
  showResultPanel(q,isCorrect);
  document.getElementById('btnNext').style.display='block';
  document.getElementById('btnSkip').style.display='none';
  const corrCount=answers.filter(a=>a&&a.correct).length;
  document.getElementById('progressScore').textContent=`正解 ${corrCount} 問`;
}

function answerSelect(choice){
  if(answers[current])return;
  const q=questions[current];
  const isCorrect=choice===q.answer;
  answers[current]={correct:isCorrect,userChoice:choice};
  renderChoices(q,choice,true);
  showResultPanel(q,isCorrect);
  document.getElementById('btnNext').style.display='block';
  document.getElementById('btnSkip').style.display='none';
  const corrCount=answers.filter(a=>a&&a.correct).length;
  document.getElementById('progressScore').textContent=`正解 ${corrCount} 問`;
}

function nextQuestion(){current++;renderQuestion();}

function goBack(){
  if(current===0)return;
  current--;
  renderQuestion();
}

function skipQuestion(){
  if(answers[current])return;
  current++;
  renderQuestion();
}

// ========================== BOOKMARK ==========================
function toggleBookmark(){
  if(currentQIndex<0)return;
  if(bookmarks.has(currentQIndex))bookmarks.delete(currentQIndex);
  else bookmarks.add(currentQIndex);
  saveBookmarks();updateBmBadge();
  const bBtn=document.getElementById('btnBookmark');
  bBtn.textContent=bookmarks.has(currentQIndex)?'★':'☆';
  bBtn.classList.toggle('active',bookmarks.has(currentQIndex));
}

// ========================== RESULT ==========================
function showResult(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('navTabs').style.display='flex';
  const rs=document.getElementById('resultScreen');
  rs.classList.add('show');
  const total=questions.length;
  const ok=answers.filter(a=>a&&a.correct).length;
  const ng=answers.filter(a=>a&&!a.correct).length;
  const sk=answers.filter(a=>a===null).length;
  document.getElementById('finalScore').textContent=ok;
  document.getElementById('finalDenom').textContent=`/ ${total}`;
  document.getElementById('finalPct').textContent=`正解率 ${Math.round(ok/total*100)}%`;
  document.getElementById('okCount').textContent=ok;
  document.getElementById('ngCount').textContent=ng;
  document.getElementById('skCount').textContent=sk;
  const pct=Math.round(ok/total*100);
  let msg='';
  if(pct>=80)msg='素晴らしい！本試験レベルの高得点です。\n引き続き精度を高めましょう。';
  else if(pct>=60)msg='合格ラインに近い水準です。\n間違えた問題を重点的に復習しましょう。';
  else msg='基礎からの確認が必要です。\n間違えた問題を繰り返し解いて定着させましょう。';
  document.getElementById('scoreMsg').textContent=msg;
  const wrongIdx=answers.map((a,i)=>a&&!a.correct?i:-1).filter(i=>i>=0);
  const skipIdx=answers.map((a,i)=>a===null?i:-1).filter(i=>i>=0);
  document.getElementById('btnRetryWrong').style.display=wrongIdx.length>0?'inline-block':'none';
  document.getElementById('btnRetrySkipped').style.display=skipIdx.length>0?'inline-block':'none';
  document.getElementById('btnRetryWrong').onclick=()=>startQuiz(wrongIdx.map(i=>({...questions[i]})));
  document.getElementById('btnRetrySkipped').onclick=()=>startQuiz(skipIdx.map(i=>({...questions[i]})));
}

function resetToStart(){
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('startScreen').style.display='';
  switchTab('start');
}

// ========================== BOOT ==========================
loadBookmarks();
initFilters();
updateBmBadge();
updateStartCount();
</script>
</body>
</html>
