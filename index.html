<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社労士試験対策 — 一問一答</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.wrap{width:100%;max-width:560px}

.header{text-align:center;padding:32px 0 36px}
.header .badge{font-size:11px;letter-spacing:.2em;color:#556070;text-transform:uppercase;margin-bottom:10px}
.header h1{font-size:26px;font-weight:700;color:#e8e0d0;letter-spacing:.04em;margin-bottom:8px}
.header p{font-size:13px;color:#556070;line-height:1.6}

/* Subject cards */
.section-label{font-size:11px;letter-spacing:.15em;color:#556070;text-transform:uppercase;margin-bottom:12px;padding-left:4px}
.cards{display:flex;flex-direction:column;gap:10px;margin-bottom:32px}
.card{
  background:#1a2434;border:1px solid #283848;border-radius:12px;
  padding:18px 20px;text-decoration:none;color:inherit;
  display:flex;align-items:center;gap:16px;
  transition:border-color .15s,background .15s,transform .1s;
  cursor:pointer;
}
.card:hover{border-color:#c97a4a;background:#1e2a3a;transform:translateY(-1px)}
.card:active{transform:translateY(0)}
.card-icon{
  width:44px;height:44px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:700;color:#e8e0d0;margin-bottom:3px;letter-spacing:.02em}
.card-sub{font-size:12px;color:#8a9bb0}
.card-arrow{font-size:16px;color:#556070;flex-shrink:0}
.card:hover .card-arrow{color:#c97a4a}

/* Colors per subject */
.icon-kenpo{background:rgba(74,158,202,.15);color:#4a9eca}
.icon-koyo{background:rgba(74,158,202,.15);color:#4a9eca}
.icon-roki{background:rgba(201,122,74,.15);color:#c97a4a}
.icon-nenkin{background:rgba(130,201,122,.15);color:#82c97a}
.icon-roho{background:rgba(201,170,74,.15);color:#c9aa4a}
.icon-choushuu{background:rgba(180,74,201,.15);color:#b44ac9}
.icon-general{background:rgba(201,74,74,.15);color:#c94a4a}

/* Progress dots (future use) */
.card-meta{display:flex;gap:6px;align-items:center;margin-top:4px}
.dot-ok{width:6px;height:6px;border-radius:50%;background:#3dbe82}
.dot-empty{width:6px;height:6px;border-radius:50%;background:#283848}

/* Coming soon */
.card.disabled{opacity:.45;cursor:default;pointer-events:none}
.coming-badge{font-size:10px;background:rgba(85,96,112,.2);border:1px solid #283848;border-radius:4px;padding:1px 6px;color:#556070;margin-left:6px;letter-spacing:.05em}

/* Footer */
.footer{text-align:center;padding:20px 0;font-size:11px;color:#3a4a5a;letter-spacing:.05em}
.footer a{color:#4a6a8a;text-decoration:none}
.footer a:hover{color:#8a9bb0}

/* Sync hint */
.sync-hint{
  background:#1a2434;border:1px solid #283848;border-radius:10px;
  padding:12px 16px;margin-bottom:24px;
  display:flex;align-items:center;gap:10px;
  font-size:12px;color:#8a9bb0;
}
.sync-hint-icon{font-size:18px;flex-shrink:0}
.sync-hint-text{line-height:1.5}
.sync-hint-text strong{color:#c97a4a}
</style>
</head>
