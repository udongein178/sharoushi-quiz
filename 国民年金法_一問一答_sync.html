<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国民年金法 一問一答 — 社労士試験対策</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}

/* ===== SYNC BAR ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;background:#1a2434;border:1px solid #283848;border-radius:10px;padding:10px 14px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9bb0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#556070;flex-shrink:0;transition:background .3s}
.sync-dot.connected{background:#3dbe82}
.sync-dot.syncing{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.error{background:#e05050}
.sync-user{font-size:11px;color:#556070;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btns{display:flex;gap:6px;align-items:center}
.btn-gsign{display:flex;align-items:center;gap:6px;background:#fff;color:#3c4043;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-gsign:hover{background:#f1f3f4}
.btn-gsign svg{flex-shrink:0}
.btn-sync{background:transparent;border:1px solid #283848;color:#8a9bb0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sync:hover{border-color:#4a9eca;color:#4a9eca}
.btn-sync:disabled{opacity:.4;cursor:default}
.btn-signout{background:transparent;border:1px solid #283848;color:#556070;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-signout:hover{border-color:#e05050;color:#e05050}

/* ===== HEADER ===== */
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}

/* ===== QUESTION CARD ===== */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:14px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-num{font-size:15px;color:#556070}
/* Accuracy badge on card */
.q-acc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:none}
.q-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.q-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.q-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.q-text{font-size:18px;line-height:1.8;color:#d8d0c0;word-break:break-word;white-space:pre-wrap;padding-right:40px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}

/* ===== OX BUTTONS ===== */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* あなたの選択ラベル */
.your-choice-label{font-size:9px;letter-spacing:.08em;opacity:.85;margin-top:2px;font-weight:700}
/* 挑戦回数バッジ */
.q-tries{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(138,155,176,.12);border:1px solid #283848;color:#8a9bb0;display:none}

/* ===== SELECT CHOICES (選択式用) ===== */
.choices-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-choice{background:#182030;border:1.5px solid #283848;border-radius:8px;padding:12px 10px;font-size:13px;color:#c8c0b0;cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.btn-choice:hover{border-color:#c97a4a;background:#1e2a3a}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice:disabled{cursor:default}
.q-type-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
.q-type-badge.ox{background:rgba(91,184,224,.12);border:1px solid rgba(91,184,224,.25);color:#5bb8e0}
.q-type-badge.sel{background:rgba(130,201,122,.12);border:1px solid rgba(130,201,122,.25);color:#82c97a}
.q-blank{background:rgba(201,122,74,.15);border-bottom:2px solid #c97a4a;color:#e8a87a;padding:0 4px;font-weight:700;border-radius:2px}

/* ===== RESULT PANEL ===== */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:18px;font-weight:700;margin-bottom:8px}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:17px;line-height:1.7;color:#a0b0c0}
.result-source{font-size:15px;color:#556070;margin-top:8px}

/* ===== NAV BUTTONS ===== */
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;white-space:nowrap}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:disabled{opacity:.3;cursor:default}
/* ⏸ 中断ボタン */
.btn-suspend{border-color:#4a3a10 !important;color:#e8c97a !important}
.btn-suspend:hover{background:rgba(232,201,122,.1) !important;border-color:#e8c97a !important}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;border:none;background:#c97a4a;color:#1a0800;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}

/* ===== START SCREEN ===== */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filters{margin-bottom:22px}
.filter-label{font-size:12px;color:#8a9bb0;margin-bottom:8px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn-filter{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-filter.active{border-color:#c97a4a;background:rgba(201,122,74,.12);color:#c97a4a}
.btn-filter:hover{border-color:#4a9eca;color:#4a9eca}
.random-mode{margin-bottom:18px}
.random-input-wrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.random-input{background:#1a2434;border:1.5px solid #283848;border-radius:6px;color:#e8e0d0;padding:8px 10px;font-size:14px;width:60px;text-align:center}
.random-input:focus{outline:none;border-color:#c97a4a}
.random-label{font-size:13px;color:#8a9bb0}
.start-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-start{border:1.5px solid #c97a4a;background:transparent;color:#c97a4a;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-start:hover{background:rgba(201,122,74,.12)}
.btn-start.primary{background:#c97a4a;color:#1a0800}
.btn-start.primary:hover{background:#e8a87a}
.btn-shuffle{border:1.5px solid #8a9bb0;background:transparent;color:#8a9bb0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-shuffle:hover{background:rgba(138,155,176,.1)}

/* ===== RESULT SCREEN ===== */
.result-screen{text-align:center;padding:36px 16px}
.result-title{font-size:24px;font-weight:700;color:#e8e0d0;margin-bottom:16px}
.result-score{font-size:36px;font-weight:700;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-retry:hover{background:rgba(201,122,74,.12)}

/* ===== BOOKMARK LIST ===== */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-acc{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:1px}
.bm-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.bm-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.bm-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0;flex:1;min-width:0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2434;border:1px solid #283848;border-radius:8px;padding:10px 18px;font-size:13px;color:#e8e0d0;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#3dbe82;color:#3dbe82}
.toast.error{border-color:#e05050;color:#e05050}
.toast.warn{border-color:#c9a84c;color:#c9a84c}

/* ===== RESUME MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999}
.modal{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:24px;max-width:400px;width:90vw}
.modal-title{font-size:16px;font-weight:700;color:#e8e0d0;margin-bottom:12px}
.modal-desc{font-size:14px;color:#a0b0c0;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-modal{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-modal.primary{border-color:#c97a4a;color:#c97a4a}
.btn-modal:hover{background:rgba(138,155,176,.1)}
.btn-modal.primary:hover{background:rgba(201,122,74,.12)}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .3s ease}
</style>
</head>
<body>
<div class="app">

<!-- ===== GOOGLE DRIVE SYNC BAR ===== -->
<div class="sync-bar">
  <div class="sync-status">
    <div id="syncDot" class="sync-dot"></div>
    <span id="syncStatusText">Googleアカウントで同期</span>
    <div id="syncUser" class="sync-user"></div>
  </div>
  <div class="sync-btns">
    <button id="btnSignIn" class="btn-gsign" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <button id="btnManualSync" class="btn-sync" onclick="manualSync()">↑↓ 同期</button>
    <button id="btnSignOut" class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>社労士試験対策</h1>
  <div id="appTitle" class="title">雇用保険法 一問一答</div>
  <div id="appSubtitle" class="subtitle">TAC 択一式100問 ＋ 選択式10問　計110問</div>
</div>

<!-- ===== NAV TABS ===== -->
<div class="nav-tabs">
  <button id="tabMain"  class="nav-tab active" onclick="showMain()">学習</button>
  <button id="tabBookmarks" class="nav-tab" onclick="showBookmarks()">栞<span id="bmBadge" class="bm-badge" style="display:none">0</span></button>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="screenMain" class="screen show">

<!-- ===== PROGRESS BAR ===== -->
<div id="progressWrap" class="progress-wrap" style="display:none">
  <div class="progress-info">
    <div id="progressNum" class="progress-num">0 / 0</div>
    <div id="progressScore" class="progress-score">正解: 0問</div>
  </div>
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill" style="width:0%"></div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="startScreen" class="start-screen">
  <span id="startCount" class="start-count">110</span>
  <span class="start-unit">問</span>
  <div class="start-desc">国民年金法の知識を一問一答で確認しよう。<br>第1予想55問・第2予想55問（択一式100問・選択式10問）を収録。</div>
  
  <!-- フィルター -->
  <div class="filters">
    <div class="filter-label">出題範囲</div>
    <div id="filterBtns" class="filter-btns">
      <button class="btn-filter active" data-cat="all">すべて</button>
    </div>
  </div>

  <!-- ランダム出題モード -->
  <div class="random-mode">
    <div class="random-input-wrap">
      <input id="randomInput" class="random-input" type="number" value="10" min="1" max="110" oninput="updateRandomBtn()">
      <span class="random-label">問をランダムで出題</span>
    </div>
    <button id="btnRandomStart" class="btn-start" onclick="startRandom()">10問ランダムで出題</button>
  </div>

  <!-- 栞ランダム出題モード -->
  <div id="bookmarkRandomMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="bookmarkRandomInput" class="random-input" type="number" value="10" min="1" max="110" oninput="updateBookmarkRandomBtn()">
      <span class="random-label">問を栞からランダムで出題</span>
    </div>
    <button id="btnBookmarkRandomStart" class="btn-start" onclick="startBookmarkRandom()">栞から10問ランダムで出題</button>
  </div>

  <!-- ボタン群 -->
  <div class="start-btns">
    <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
    <button id="btnResumeStart" class="btn-start" onclick="resumeSession()" style="display:none">▶ 続きから開始</button>
    <button id="btnWeakStart" class="btn-start" onclick="startWeak()" style="display:none">正答率50%以下の問題を出題</button>
    <button id="btnLeastTried" class="btn-start" onclick="startLeastTried()" style="display:none">挑戦回数が少ない問題を出題</button>
    <button class="btn-start primary" onclick="start()">学習スタート</button>
    <button id="btnBookmarkStart" class="btn-start" onclick="startBookmarks()" style="display:none">栞の問題のみ</button>
  </div>
</div>

<!-- ===== QUESTION SCREEN ===== -->
<div id="questionScreen" class="screen">
  <div class="card">
    <div class="q-meta">
      <span id="qTag" class="q-tag">択一式（雇用保険法）</span>
      <span id="qTypeBadge" class="q-type-badge"></span>
      <span id="qNum" class="q-num"></span>
      <span id="qAcc" class="q-acc"></span>
      <span id="qTries" class="q-tries"></span>
    </div>
    <div id="qText" class="q-text"></div>
    <button id="btnBookmark" class="btn-bookmark" onclick="toggleBookmark()">☆</button>
  </div>

  <!-- ○× ボタン -->
  <div id="oxRow" class="btn-row">
    <button id="btnMaru" class="btn-answer btn-maru" onclick="answerOx(true)">
      <div>○</div><div class="btn-label">正しい</div>
    </button>
    <button id="btnBatsu" class="btn-answer btn-batsu" onclick="answerOx(false)">

const ALL_QUESTIONS = [
{no:"問1",opt:"A",q:"国民年金法第10章（国民年金基金及び国民年金基金連合会）に規定する厚生労働大臣の権限のうち国民年金基金（以下「基金」という。）に係るものは、その一部を地方厚生局長に委任することができる。",a:true,exp:"設問の通り正しい。なお、設問の地方厚生局長に委任された権限は、地方厚生支局長に委任することができる。",src:"法142条の2,1項",cat:"択一式（国民年金法）"},
{no:"問1",opt:"B",q:"国民年金事業の事務の一部は、政令の定めるところにより、都道府県知事又は市町村長（特別区の区長を含む。以下同じ。）が行うこととすることができる。",a:false,exp:"国民年金事業の事務の一部は、政令の定めるところにより、市町村長（特別区の区長を含む。）が行うこととすることができる（「都道府県知事」は、国民年金事業の事務の一部を行うこととすることができるとされていない。）。なお、国民年金事業の事務の一部は、政令の定めるところにより、法律によって組織された共済組合、国家公務員共済組合連合会、全国市町村職員共済組合連合会、地方公務員共済組合連合会又は日本私立学校振興・共済事業団（「共済組合等」という。）に行わせることができる。",src:"法3条3項",cat:"択一式（国民年金法）"},
{no:"問1",opt:"C",q:"第1号被保険者としての被保険者期間のうち、保険料4分の3免除、保険料半額免除又は保険料4分の1免除の規定によりその一部の額につき納付することを要しないものとされた保険料につきその残余の額が納付又は徴収された期間は、保険料納付済期間となる。",a:false,exp:"保険料4分の3免除、保険料半額免除又は保険料4分の1免除の規定によりその一部の額につき納付することを要しないものとされた保険料につきその残余の額（つまり免除されていない額）が納付又は徴収された期間は、それぞれ保険料4分の3免除期間、保険料半額免除期間又は保険料4分の1免除期間となる。なお、免除されている部分の額を追納した場合には、これらの期間は保険料納付済期間となる。",src:"法5条1項",cat:"択一式（国民年金法）"},
{no:"問1",opt:"D",q:"第1号被保険者が生活保護法による生活扶助を受けることとなり、国民年金法第89条（法定免除）の規定の適用を受ける場合には、生活扶助を受けるに至った日の属する月からこれに該当しなくなる日の属する月の翌月までの期間に係る保険料は、既に納付されたものを除き、納付することを要しない。",a:false,exp:"設問の場合、生活扶助を受けるに至った日の属する「月の前月」からこれに該当しなくなる日の属する「月」までの期間に係る保険料は、既に納付されたものを除き、納付することを要しない。",src:"法89条1項",cat:"択一式（国民年金法）"},
{no:"問1",opt:"E",q:"国民年金法第90条の3（学生納付特例）の規定により保険料を納付することを要しないものとされている者は、同法第89条の法定免除の事由に該当した場合であっても、法定免除の対象とはならない。",a:false,exp:"学生納付特例の規定により保険料を納付することを要しないものとされている者であっても、法定免除の事由に該当した場合には、法定免除の対象となる。学生納付特例の規定の適用を受ける者については、保険料の申請全額免除、保険料の一部（4分の3・半額・4分の1）免除の対象とならないが、産前産後期間の保険料免除、法定免除の対象となる。また、産前産後期間の保険料免除、保険料の一部（4分の3・半額・4分の1）免除の規定の適用を受ける者については、法定免除の対象とならないが、学生納付特例、保険料の申請全額免除の規定の適用を受ける者については、法定免除の対象となる。",src:"法89条1項",cat:"択一式（国民年金法）"},
{no:"問2",opt:"A",q:"日本の国籍を有しない者であって、出入国管理及び難民認定法の規定に基づく特定活動として法務大臣が定める活動のうち、本邦に相当期間滞在して、病院又は診療所に入院し疾病又は傷害について医療を受ける活動を行うものは、日本国内に住所を有する20歳以上60歳未満の者であっても、第1号被保険者とならない。",a:true,exp:"設問の通り正しい。第1号被保険者とは、日本国内に住所を有する20歳以上60歳未満の者であって第2号被保険者及び第3号被保険者のいずれにも該当しないもの（厚生年金保険法に基づく老齢給付等を受けることができる者その他国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）とされているが、設問の者は、国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者に該当するため、第1号被保険者とならない。",src:"法7条1項1号、則1条の2",cat:"択一式（国民年金法）"},
{no:"問2",opt:"B",q:"63歳の厚生年金保険の被保険者は、繰上げ支給の老齢基礎年金及び老齢厚生年金の支給を受けている場合であっても、第2号被保険者となる。",a:true,exp:"設問の通り正しい。第2号被保険者となるのは、65歳以上の厚生年金保険の被保険者にあっては、当分の間、老齢又は退職を支給事由とする年金たる給付であって政令で定める給付（老齢基礎年金、老齢厚生年金等）の受給権を有しない者に限られているが、設問の者は63歳であるため、第2号被保険者となる。",src:"法7条1項2号",cat:"択一式（国民年金法）"},
{no:"問2",opt:"C",q:"第3号被保険者に係る主として第2号被保険者の収入により生計を維持することの認定は、健康保険法、国家公務員共済組合法、地方公務員等共済組合法及び私立学校教職員共済法における被扶養者の認定の取扱いを勘案して日本年金機構が行う。",a:true,exp:"設問の通り正しい。",src:"法7条2項、令4条",cat:"択一式（国民年金法）"},
{no:"問2",opt:"D",q:"第2号被保険者の20歳以上60歳未満の配偶者であって主として第2号被保険者の収入により生計を維持するものは、ボランティア活動の目的で一時的に海外に渡航し、日本国内に住所を有していない者であっても、第3号被保険者となる。",a:true,exp:"設問の通り正しい。日本国内に住所を有していない者であっても、外国において留学をする学生その他の日本国内に住所を有しないが渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められる者として厚生労働省令で定める者については、他の要件を満たす限り、第3号被保険者となる。設問の者（ボランティア活動の目的で一時的に海外に渡航する者）は、日本国内に生活の基礎があると認められる者として厚生労働省令で定める者に該当するため、第3号被保険者となる。",src:"法7条1項3号、則1条の3",cat:"択一式（国民年金法）"},
{no:"問2",opt:"E",q:"第1号被保険者及び第3号被保険者は、死亡したとき、又は60歳に達したとき（第2号被保険者に該当するときを除く。）は、その日に、被保険者の資格を喪失する。",a:false,exp:"第1号被保険者及び第3号被保険者は、死亡したときは、その日の「翌日」に、被保険者の資格を喪失する（第2号被保険者も同様である。）。なお、その他の記述は正しい。",src:"法9条",cat:"択一式（国民年金法）"},
{no:"問3",opt:"A",q:"被保険者期間を計算する場合には、月によるものとし、被保険者の資格を取得した日の属する月の翌月からその資格を喪失した日の属する月までをこれに算入する。",a:false,exp:"被保険者期間を計算する場合には、月によるものとし、被保険者の資格を取得した日の属する「月」からその資格を喪失した日の属する「月の前月」までをこれに算入する。なお、第1号被保険者としての被保険者期間、第2号被保険者としての被保険者期間又は第3号被保険者としての被保険者期間を計算する場合には、被保険者の種別（第1号被保険者、第2号被保険者又は第3号被保険者のいずれであるかの区別をいう。以下同じ。）に変更があった月は、変更後の種別の被保険者であった月とみなすこととされており、同一の月において、2回以上にわたり被保険者の種別に変更があったときは、その月は最後の種別の被保険者であった月とみなすこととされている。",src:"法11条1項",cat:"択一式（国民年金法）"},
{no:"問3",opt:"B",q:"厚生労働大臣は、国民年金原簿を備え、これに被保険者の氏名、資格の取得及び喪失、種別の変更、保険料の納付状況、基礎年金番号その他厚生労働省令で定める事項を記録するものとされているが、第2号被保険者については、第1号厚生年金被保険者のみが記録の対象となる。",a:true,exp:"設問の通り正しい。国民年金原簿の記録の対象となる被保険者のうち、第2号被保険者については、当分の間、第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者であるものを除くこととされている。",src:"法14条、法附則7条の5,1項",cat:"択一式（国民年金法）"},
{no:"問3",opt:"C",q:"年金給付の支払額に1円未満の端数が生じたときは、これを切り捨てるものとされているが、毎年4月から翌年3月までの間において切り捨てた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを翌年4月の支払期月の年金額に加算するものとされている。",a:false,exp:"年金給付の支払額に1円未満の端数が生じたときは、これを切り捨てるものとされているが、「毎年3月から翌年2月」までの間において切り捨てた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを「当該2月」の支払期月の年金額に加算するものとされている。",src:"法18条の2",cat:"択一式（国民年金法）"},
{no:"問3",opt:"D",q:"年金給付の受給権者が死亡した場合において、その死亡した者に支給すべき年金給付でまだその者に支給しなかったものがあるときは、所定の遺族は、自己の名で、その未支給の年金の支給を請求することができるが、死亡した受給権者が死亡前にその年金を請求していなかったときは、その年金を請求することはできない。",a:false,exp:"死亡した受給権者が死亡前にその年金を請求していなかったときについても、所定の遺族は、自己の名で、その年金を請求することができる。なお、未支給の給付の支給を請求することができる所定の遺族は、その者の配偶者、子、父母、孫、祖父母、兄弟姉妹又はこれらの者以外の三親等内の親族であって、その者の死亡の当時その者と生計を同じくしていたものである。",src:"法19条1項、3項",cat:"択一式（国民年金法）"},
{no:"問3",opt:"E",q:"年金給付の受給権が消滅したにもかかわらず、その受給権が消滅した日の属する月の翌月以降の分として当該年金給付の過誤払が行われた場合において、当該過誤払による返還金に係る債権（以下「返還金債権」という。）に係る債務の弁済をすべき者に支払うべき年金給付があるときは、当該年金給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。",a:false,exp:"年金給付の受給権者が死亡したためその受給権が消滅したにもかかわらず、その死亡の日の属する月の翌月以降の分として当該年金給付の過誤払が行われた場合において、当該過誤払による返還金債権に係る債務の弁済をすべき者に支払うべき年金給付があるときは、当該年金給付の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。年金給付について充当処理が行われるのは、その受給権の消滅が「受給権者が死亡したこと」による場合に限られている。",src:"法21条の2",cat:"択一式（国民年金法）"},
{no:"問4",opt:"A",q:"保険料納付済期間の月数を420月、平成21年4月以後に保険料4分の3免除期間の月数を24月有している者が、令和8年4月1日に65歳に達し、老齢基礎年金の支給を受けることとなる場合には、老齢基礎年金の額の計算に当たり、保険料4分の3免除期間の月数は15月として年金額に反映されることとなる。",a:true,exp:"設問の通り正しい。老齢基礎年金の額の計算に当たり、平成21年4月以後の保険料4分の3免除期間の月数（480から保険料納付済期間の月数、保険料4分の1免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）は、その8分の5に相当する月数が年金額に反映される。したがって、設問の場合、「24月×5／8＝15月」が年金額に反映されることとなる。",src:"法27条1項",cat:"択一式（国民年金法）"},
{no:"問4",opt:"B",q:"保険料納付済期間の月数を400月、平成21年4月以後に保険料半額免除期間の月数を80月有している者が、令和8年4月1日に60歳に達し、任意加入被保険者となった場合には、20月間保険料を納付すれば、満額の老齢基礎年金を受けることができる月数（480月）に達することとなる。",a:false,exp:"設問の場合、満額の老齢基礎年金を受けることができる月数（480月）に達することとはならない。設問の場合、任意加入被保険者として20月間保険料を納付したときは、保険料納付済期間の月数は420月となる。また、保険料半額免除期間の月数は、480から保険料納付済期間の月数及び保険料4分の1免除期間の月数を合算した月数を控除して得た月数については当該月数の4分の3に相当する月数が、それを超える月数については当該月数の4分の1に相当する月数が、それぞれ年金額に反映されることとされている。したがって、設問の場合、60月（480月－420月）の4分の3に相当する月数（45月）と20月の4分の1に相当する月数（5月）を合わせた月数（50月）が年金額に反映されることとなるが、当該月数（50月）と保険料納付済期間の月数（420月）とを合わせた月数が480月に満たないため、満額の老齢基礎年金を受けることができる月数（480月）に達することとはならない。",src:"法27条1項",cat:"択一式（国民年金法）"},
{no:"問4",opt:"C",q:"日本国籍を有する24歳の者が、令和7年1月から1年間海外に居住した場合において、その者が任意加入被保険者となったものの保険料を滞納していたときは、当該期間は老齢基礎年金の受給資格期間の計算に当たり合算対象期間とされる。",a:true,exp:"設問の通り正しい。任意加入被保険者であった期間のうち、20歳以上60歳未満で保険料を滞納していた期間は、合算対象期間となる（保険料を納付していた期間は、保険料納付済期間となる。）。なお、設問の者が海外に居住した期間について、任意加入をしなかったときについても、当該期間は合算対象期間となる。",src:"(24)法附則12条",cat:"択一式（国民年金法）"},
{no:"問4",opt:"D",q:"任意加入の対象とされていた昭和36年4月1日から平成3年3月31日までの学生であった期間のうち、20歳以上60歳未満で任意加入をしなかった期間については、老齢基礎年金の受給資格期間の計算に当たり合算対象期間とされる。",a:true,exp:"設問の通り正しい。",src:"(元)法附則4条",cat:"択一式（国民年金法）"},
{no:"問4",opt:"E",q:"老齢基礎年金の満額は、780,900円に改定率を乗じて得た額であるが、令和7年度の改定率は、昭和31年4月1日以前に生まれた者と昭和31年4月2日以後に生まれた者で異なる。",a:true,exp:"設問の通り正しい。なお、令和7年度の改定率は、昭和31年4月1日以前に生まれた者については1.062、昭和31年4月2日以後に生まれた者については1.065とされているので、老齢基礎年金の満額は、それぞれ829,300円（昭和31年4月1日以前に生まれた者）、831,700円（昭和31年4月2日以後に生まれた者）となる。",src:"法27条1項、改定率改定令1条",cat:"択一式（国民年金法）"},
{no:"問5",opt:"A",q:"初診日において被保険者であった者であって、かつ、60歳以上65歳未満の者は、当該初診日に日本国内に住所を有していない場合には、障害認定日において当該傷病により障害等級に該当する程度の障害の状態にあり、かつ、保険料納付要件を満たしているときであっても、障害基礎年金は支給されない。",a:true,exp:"設問の通り正しい。障害基礎年金が支給されるには、傷病に係る初診日において、次の①又は②のいずれかに該当していなければならない。① 被保険者であること。② 被保険者であった者であって、日本国内に住所を有し、かつ、60歳以上65歳未満であること。",src:"法30条1項",cat:"択一式（国民年金法）"},
{no:"問5",opt:"B",q:"初診日において被保険者である者が、障害認定日において障害等級に該当する程度の障害の状態になかったが、同日後65歳に達する日の前日までの間において当該傷病により障害等級に該当する程度の障害の状態に該当するに至ったときは、その者は、その65歳に達する日の前日までの期間内に限り、障害基礎年金の支給を請求することができる。なお、保険料納付要件を満たしているものとする。",a:true,exp:"設問の通り正しい。いわゆる事後重症による障害基礎年金に関する記述である。なお、事後重症による障害基礎年金は、障害等級に該当したときに受給権が発生するのではなく、その支給を請求したときに受給権が発生し、その支給は、当該請求をした月の翌月から開始される。",src:"法30条の2,1項、2項",cat:"択一式（国民年金法）"},
{no:"問5",opt:"C",q:"既に障害の状態にある者が、新たな傷病（以下「基準傷病」という。）の初診日において被保険者であり、基準傷病に係る障害認定日から65歳に達する日の前日までの間において、初めて、基準傷病による障害と既存の障害とを併合して障害等級に該当する程度の障害の状態に該当するに至ったときは、その者に基準障害と他の障害とを併合した障害の程度による障害基礎年金が支給される。なお、基準傷病の初診日は既存の障害に係る傷病の初診日以降であるものとし、また、保険料納付要件を満たしているものとする。",a:true,exp:"設問の通り正しい。いわゆる基準傷病に係る障害（基準障害）による障害基礎年金に関する記述である。なお、基準障害による障害基礎年金は、障害等級に該当したときに受給権が発生するが、その支給は、当該基準障害による障害基礎年金の請求があった月の翌月から開始される。また、保険料納付要件は、基準傷病の初診日の前日において満たしていればよく、既存の障害に係る傷病の初診日の前日においては問われない。",src:"法30条の3,1項、2項",cat:"択一式（国民年金法）"},
{no:"問5",opt:"D",q:"障害基礎年金の受給権者がその権利を取得した日の翌日以後にその者によって生計を維持しているその者の子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満であって障害等級に該当する障害の状態にある子に限る。）を有するに至ったことにより、障害基礎年金に子の加算額を加算することとなったときは、当該子を有するに至った日の属する月から、障害基礎年金の額が改定される。",a:false,exp:"設問の場合、当該子を有するに至った日の属する「月の翌月」から、障害基礎年金の額が改定される。",src:"法33条の2,2項",cat:"択一式（国民年金法）"},
{no:"問5",opt:"E",q:"障害基礎年金の受給権者は、厚生労働大臣に対し、障害の程度が増進したことによる障害基礎年金の額の改定を請求することができるが、当該請求は、障害基礎年金の受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害基礎年金の受給権を取得した日又は厚生労働大臣の診査を受けた日から起算して1年を経過した日後でなければ行うことができない。",a:true,exp:"設問の通り正しい。",src:"法34条2項、3項",cat:"択一式（国民年金法）"},
{no:"問6",opt:"A",q:"行方不明となった被保険者について、失踪の宣告を受けたことにより死亡したとみなされた場合には、当該被保険者の死亡に係る遺族基礎年金の支給に関し、遺族に係る身分関係、年齢及び障害の状態は、行方不明となった当時を基準として判断する。",a:false,exp:"設問の場合、身分関係、年齢及び障害の状態は、「死亡したとみなされた当時」を基準として判断する。なお、生計維持関係、被保険者等要件及び保険料納付要件は、「行方不明となった当時」を基準として判断する。",src:"法18条の4",cat:"択一式（国民年金法）"},
{no:"問6",opt:"B",q:"遺族基礎年金の受給権を取得した当時13歳であった子については、16歳のときに障害等級に該当する障害の状態となり引き続き当該障害の状態にある場合であっても、18歳に達した日以後の最初の3月31日が終了したときは、その子の遺族基礎年金の受給権は消滅する。",a:false,exp:"設問の場合、18歳に達した日以後の最初の3月31日が終了したときに、障害等級に該当する障害の状態にあるため、遺族基礎年金の受給権は消滅しない。",src:"法40条3項",cat:"択一式（国民年金法）"},
{no:"問6",opt:"C",q:"遺族基礎年金の受給権者が配偶者と1人の子の2人である場合において、その子が死亡した被保険者の直系血族である父と養子縁組をしたときは、配偶者の遺族基礎年金の受給権は消滅する。",a:true,exp:"設問の通り正しい。配偶者の有する遺族基礎年金の受給権は、その年金額の加算の対象となる子が1人であるときはその子が、2人以上であるときは同時に又は時を異にしてその全ての子が、次の①〜⑧の減額改定事由に該当するに至ったときは、消滅する。① 死亡したとき ② 婚姻（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。）をしたとき ③ 配偶者以外の者の養子（届出をしていないが、事実上養子縁組関係と同様の事情にある者を含む。）となったとき ④ 離縁によって、死亡した被保険者又は被保険者であった者の子でなくなったとき ⑤ 配偶者と生計を同じくしなくなったとき ⑥ 18歳に達した日以後の最初の3月31日が終了したとき（障害等級に該当する障害の状態にあるときを除く） ⑦ 障害等級に該当する障害の状態にある子について、その事情がやんだとき（その子が18歳に達する日以後の最初の3月31日までの間にあるときを除く） ⑧ 20歳に達したとき。設問の場合、子が1人であり、その子が上記③の配偶者以外の者の養子となったため、配偶者の遺族基礎年金の受給権は消滅する。なお、子の遺族基礎年金の受給権は消滅しない（直系血族の養子となったことは、失権事由に該当しない。）。",src:"法40条2項",cat:"択一式（国民年金法）"},
{no:"問6",opt:"D",q:"子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するときは、その間、その支給を停止するものとされており、その配偶者の申出により、当該配偶者の遺族基礎年金の全額の支給を停止することとなった場合であっても、配偶者が遺族基礎年金の受給権を有する限り、子に対する遺族基礎年金の支給は停止される。",a:false,exp:"子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するときは、その間、その支給が停止されるが、その配偶者の申出により、当該配偶者の遺族基礎年金の全額の支給を停止することとなった場合には、子に対する遺族基礎年金の支給は停止されない。なお、子に対する遺族基礎年金は、生計を同じくするその子の父又は母があるときは、その間、その支給を停止することとされている。",src:"法41条2項",cat:"択一式（国民年金法）"},
{no:"問6",opt:"E",q:"子に支給する遺族基礎年金の額は、受給権者が子1人の場合には、780,900円に改定率を乗じて得た額に224,700円に改定率を乗じて得た額を加算した額となる。",a:false,exp:"子に支給する遺族基礎年金の額は、受給権者が子1人の場合には、780,900円に改定率を乗じて得た額である。",src:"法38条、39条の2,1項",cat:"択一式（国民年金法）"},
{no:"問7",opt:"A",q:"障害基礎年金の受給権者は、国民年金法第89条の法定免除の事由に該当するが、保険料を納付する旨の申出をしたときは、その申出の期間に係る保険料を納付することができる。この場合には、付加保険料を納付する者となる旨の申出も行うことができるが、これにより付加保険料を納付した者がその後に老齢基礎年金の受給権を取得した場合であっても、障害基礎年金の支給を受けている間は、付加年金の支給を受けることはできない。",a:true,exp:"設問の通り正しい。付加年金は、老齢基礎年金がその全額につき支給を停止されているときは、その支給を停止する。障害基礎年金の支給を受けている間は、老齢基礎年金の支給は停止されるので、これに伴い、付加年金の支給も停止される。なお、設問の者が老齢基礎年金の支給を受けることとした場合には、老齢基礎年金と付加年金を併せて受給することができる。",src:"法20条1項、47条、87条の2,1項、89条2項、法附則9条の2の4",cat:"択一式（国民年金法）"},
{no:"問7",opt:"B",q:"付加保険料に係る保険料納付済期間を有する者が老齢基礎年金の支給繰上げの請求をしたときは、付加年金の支給についても同様に繰り上げられ、その支給額は老齢基礎年金と同様の率で減額されることとなる。",a:true,exp:"設問の通り正しい。なお、老齢基礎年金の支給繰下げの申出をしたときは、付加年金の支給についても同様に繰り下げられ、その支給額は老齢基礎年金と同様の率で増額されることとなる。",src:"法43条、法附則9条の2,6項",cat:"択一式（国民年金法）"},
{no:"問7",opt:"C",q:"老齢基礎年金と付加年金の支給を受けている受給権者について、老齢基礎年金の額が改定率の改定により改定された場合には、付加年金の支給額についても同様の率で改定されることとなる。",a:false,exp:"付加年金の額については、改定率による改定は行われない。付加年金の額は、200円に付加保険料に係る保険料納付済期間の月数を乗じて得た額とされている。",src:"法44条",cat:"択一式（国民年金法）"},
{no:"問7",opt:"D",q:"遺族基礎年金の受給権を有したことがあっても、脱退一時金の要件に該当している者は、脱退一時金の支給を請求することができる。",a:true,exp:"設問の通り正しい。【脱退一時金の支給要件】保険料納付済期間等の月数が6月以上である日本国籍を有しない者（被保険者でない者に限る。）であって、老齢基礎年金の受給資格期間を満たしていないものは、次の①〜③のいずれかに該当するときを除き、脱退一時金の支給を請求することができる。① 日本国内に住所を有するとき ② 障害基礎年金その他政令で定める給付の受給権を有したことがあるとき ③ 最後に被保険者の資格を喪失した日（同日において日本国内に住所を有していた者にあっては、同日初めて、日本国内に住所を有しなくなった日）から起算して2年を経過しているとき。",src:"法附則9条の3の2,1項",cat:"択一式（国民年金法）"},
{no:"問7",opt:"E",q:"脱退一時金の額は、基準月（請求の日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間、保険料4分の1免除期間、保険料半額免除期間又は保険料4分の3免除期間のうち請求の日の前日までに当該期間の各月の保険料として納付された保険料に係る月のうち直近の月をいう。）の属する年度における保険料の額に2分の1を乗じて得た額に保険料納付済期間等の月数に応じて政令で定める数を乗じて得た額とされている。",a:true,exp:"設問の通り正しい。保険料納付済期間等についてはDの解説参照のこと。なお、設問の政令で定める数は、請求の日の属する月の前月までの第1号被保険者としての被保険者期間のうち保険料を納付した直近の月（最後に保険料を納付した月）が令和3年4月以後の場合には、上限が60とされている。",src:"法附則9条の3の2,3項",cat:"択一式（国民年金法）"},
{no:"問8",opt:"A",q:"基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であった者が死亡した場合において、その遺族が遺族基礎年金を受けたときには、その遺族に支給されるものでなければならない。",a:false,exp:"基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であった者が死亡した場合において、その遺族が「死亡一時金」を受けたときには、その遺族に支給されるものでなければならない。なお、基金が支給する一時金の額は、8,500円を超えるものでなければならない。",src:"法129条3項",cat:"択一式（国民年金法）"},
{no:"問8",opt:"B",q:"老齢基礎年金の受給権者に対し基金が支給する年金の額は、200円（支給繰下げによる老齢基礎年金又は支給繰上げによる老齢基礎年金の受給権者に対し基金が支給する年金については、これらの老齢基礎年金と同様の率で増額又は減額した額）に加入員期間の月数を乗じて得た額を超えるものでなければならない。",a:true,exp:"設問の通り正しい。なお、基金が支給する年金は、少なくとも、当該基金の加入員であった者が老齢基礎年金の受給権を取得したときには、その者に支給されるものでなければならない。また、老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金の受給権の消滅事由以外の事由によって、その受給権を消滅させるものであってはならない。",src:"法130条2項、基金令24条",cat:"択一式（国民年金法）"},
{no:"問8",opt:"C",q:"基金が支給する年金及び一時金を受ける権利は、その権利を有する者の請求に基づいて、基金が裁定する。",a:true,exp:"設問の通り正しい。",src:"法133条",cat:"択一式（国民年金法）"},
{no:"問8",opt:"D",q:"基金は、政令で定めるところにより、厚生労働大臣の認可を受けて、その業務（加入員又は加入員であった者に年金又は一時金の支給を行うために必要となるその者に関する情報の収集、整理又は分析を含む。）の一部を信託会社、信託業務を営む金融機関、生命保険会社、農業協同組合連合会、共済水産業協同組合連合会、国民年金基金連合会その他の法人に委託することができる。",a:true,exp:"設問の通り正しい。なお、銀行その他の政令で定める金融機関は、他の法律の規定にかかわらず、設問の業務（基金の加入員となる旨の申出の受理に関する業務に限る。）を受託することができる。",src:"法128条5項",cat:"択一式（国民年金法）"},
{no:"問8",opt:"E",q:"基金の掛金は、年金の額の計算の基礎となる各月につき、徴収するものとされており、掛金の額は、国民年金基金令第35条（掛金の額の上限の特例）に該当する場合を除き、1月につき68,000円を超えてはならないとされている。",a:true,exp:"設問の通り正しい。なお、掛金の額は、年金及び一時金に要する費用の予想額並びに予定運用収入の額に照らし、将来にわたって、財政の均衡を保つことができるように計算されるものでなければならず、かつ、少なくとも5年ごとにこの基準に従って再計算されなければならない。",src:"法134条2項、基金令34条",cat:"択一式（国民年金法）"},
{no:"問9",opt:"A",q:"死亡一時金の支給を受ける者が、同一人の死亡により遺族基礎年金を受けることができるときは、その者の選択により、死亡一時金と遺族基礎年金とのうち、その一を支給し、他は支給しない。",a:false,exp:"設問のような規定はない。死亡一時金は、死亡した者の死亡日においてその者の死亡により遺族基礎年金を受けることができる者があるときは、当該死亡日の属する月に当該遺族基礎年金の受給権が消滅したとき等を除き、支給されない。",src:"法52条の2,2項",cat:"択一式（国民年金法）"},
{no:"問9",opt:"B",q:"夫の死亡により既に遺族基礎年金の支給を受けていた妻は、当該夫の死亡による寡婦年金の支給を受けることはできない。",a:false,exp:"夫の死亡により既に遺族基礎年金の支給を受けていた妻であっても、当該夫の死亡による寡婦年金の支給を受けることができる。なお、遺族基礎年金と寡婦年金を併せて（同時に）受給することはできない。",src:"法37条、49条",cat:"択一式（国民年金法）"},
{no:"問9",opt:"C",q:"死亡一時金の支給を受ける者が、同一人の死亡により寡婦年金を受けることができるときは、寡婦年金を支給し、死亡一時金は支給しない。",a:false,exp:"死亡一時金の支給を受ける者が、同一人の死亡により寡婦年金を受けることができるときは、その者の選択により、死亡一時金と寡婦年金とのうち、その一を支給し、他は支給しないこととされている。",src:"法52条の6",cat:"択一式（国民年金法）"},
{no:"問9",opt:"D",q:"遺族基礎年金又は寡婦年金として支給を受けた金銭を標準として、租税その他の公課を課することはできないが、死亡一時金については、この限りでない。",a:false,exp:"租税その他の公課は、給付として支給を受けた金銭を標準として、課することができないが、老齢基礎年金及び付加年金については、この限りでないとされている。したがって、死亡一時金についても、その支給を受けた金銭を標準として、租税その他の公課を課することはできない。",src:"法25条",cat:"択一式（国民年金法）"},
{no:"問9",opt:"E",q:"遺族基礎年金、寡婦年金又は死亡一時金は、被保険者又は被保険者であった者を故意に死亡させた者には、支給しない。",a:true,exp:"設問の通り正しい。遺族基礎年金、寡婦年金又は死亡一時金は、被保険者又は被保険者であった者を故意に死亡させた者には、支給しないものとされており、被保険者又は被保険者であった者の死亡前に、その者の死亡によって遺族基礎年金又は死亡一時金の受給権者となるべき者を故意に死亡させた者についても、同様とするものとされている。なお、遺族基礎年金の受給権は、受給権者が他の受給権者を故意に死亡させたときは、消滅する。",src:"法71条1項",cat:"択一式（国民年金法）"},
{no:"問10",opt:"A",q:"令和元年度以後の年度に属する月の月分の保険料の額は、17,000円に保険料改定率を乗じて得た額（その額に5円未満の端数が生じたときは、これを切り捨て、5円以上10円未満の端数が生じたときは、これを10円に切り上げるものとする。）であり、令和8年度の保険料の額は、17,920円である。",a:true,exp:"設問の通り正しい。令和8年度における保険料改定率は1.054であり、保険料の額は、17,000円×1.054≒17,920円となる。",src:"法87条3項、改定率改定令2条",cat:"択一式（国民年金法）"},
{no:"問10",opt:"B",q:"世帯主は、その世帯に属する第1号被保険者の保険料を連帯して納付する義務を負う。",a:true,exp:"設問の通り正しい。なお、配偶者の一方は、第1号被保険者たる他方の保険料を連帯して納付する義務を負う。",src:"法88条2項",cat:"択一式（国民年金法）"},
{no:"問10",opt:"C",q:"厚生労働大臣は、毎年度、第1号被保険者に対し、各年度の各月に係る保険料について、保険料の額、納期限その他厚生労働省令で定める事項を通知するものとされている。",a:true,exp:"設問の通り正しい。なお、毎月の保険料は、翌月末日までに納付しなければならない。",src:"法92条1項",cat:"択一式（国民年金法）"},
{no:"問10",opt:"D",q:"厚生労働大臣は、保険料を滞納する者があるときは、期限を指定して、これを督促しなければならないが、督促状により指定する期限は、督促状を発する日から起算して10日以上を経過した日でなければならない。",a:false,exp:"「督促しなければならない」とする記述が誤りである。厚生労働大臣は、保険料を滞納する者があるときは、期限を指定して、これを督促することができる。なお、「督促状により指定する期限は、督促状を発する日から起算して10日以上を経過した日でなければならない」とする記述は正しい。",src:"法96条1項、3項",cat:"択一式（国民年金法）"},
{no:"問10",opt:"E",q:"厚生労働大臣は、第1号被保険者から、預金又は貯金の払出しとその払い出した金銭による保険料の納付をその預金口座又は貯金口座のある金融機関に委託して行うことを希望する旨の申出があった場合には、その納付が確実と認められ、かつ、その申出を承認することが保険料の徴収上有利と認められるときに限り、その申出を承認することができる。",a:true,exp:"設問の通り正しい。なお、保険料を設問の方法（口座振替納付）により納付する場合には、その月の保険料を当月末振替（早割）で納付する（1月単位の納付で保険料の割引を受ける）ことができる（保険料の一部免除を受けている者については、翌月末振替のみであり、早割を利用することはできない。）。",src:"法92条の2",cat:"択一式（国民年金法）"},
{no:"第2-問1",opt:"A",q:"72歳の厚生年金保険の高齢任意加入被保険者の被扶養配偶者であって、国内に居住する58歳の者は、国民年金の第3号被保険者となる。",a:true,exp:"設問の通り正しい。65歳以上の厚生年金保険の被保険者は、当分の間、老齢又は退職を支給事由とする年金たる給付であって政令で定める給付（老齢基礎年金、老齢厚生年金等）の受給権を有しない者に限り、第2号被保険者となるが、厚生年金保険の高齢任意加入被保険者は、老齢又は退職を支給事由とする年金たる給付であって政令で定める給付の受給権を有していない（有することとなったときは、高齢任意加入被保険者の資格を喪失する）ので、設問の被扶養配偶者〔日本国内に住所を有する者等であって、主として第2号被保険者の収入により生計を維持するもの（第2号被保険者である者その他国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）〕は、国民年金の第3号被保険者となる。",src:"法7条1項3号、法附則3条、厚年法附則4条の3,1項、同法附則4条の5,1項",cat:"択一式（国民年金法）"},
{no:"第2-問1",opt:"B",q:"第3号被保険者は、配偶者である第2号被保険者と離婚し、当該第2号被保険者の被扶養配偶者でなくなったときは、その日から14日以内に、所定の事項を記載した届書又はこれらの事項を記録した光ディスクを日本年金機構（以下「機構」という。）に提出しなければならない。",a:true,exp:"設問の通り正しい。なお、設問の届出（被扶養配偶者非該当の届出）は、第1号厚生年金被保険者である第2号被保険者の被扶養配偶者である第3号被保険者にあっては、その配偶者である第2号被保険者を使用する事業主を経由して行うものとし、第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者である第2号被保険者の被扶養配偶者である第3号被保険者にあっては、その配偶者である第2号被保険者を組合員又は加入者とする国家公務員共済組合、地方公務員共済組合又は日本私立学校振興・共済事業団を経由して行うものとされている。また、被扶養配偶者非該当の届出について、第3号被保険者でなくなった理由が「第3号被保険者の配偶者である第2号被保険者が第2号被保険者でなくなったこと」「第3号被保険者が厚生年金保険の被保険者の資格を取得したこと」等による場合には、その届出を行う必要はない。",src:"法12条の2,1項、則6条の2の2",cat:"択一式（国民年金法）"},
{no:"第2-問1",opt:"C",q:"任意加入被保険者は、特別支給の老齢厚生年金の支給を受けることとなったときであっても、その資格を喪失しない。",a:true,exp:"設問の通り正しい。なお、65歳以上70歳未満の特例による任意加入被保険者については、老齢基礎年金等の老齢又は退職を支給事由とする年金たる給付であって政令で定めるものの受給権を取得したときは、その日の翌日に資格を喪失する。",src:"法附則5条7項、8項",cat:"択一式（国民年金法）"},
{no:"第2-問1",opt:"D",q:"日本国籍を有し、日本国内に住所を有しない20歳以上65歳未満のものが任意加入の申出を行おうとする場合には、口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならない。",a:false,exp:"日本国籍を有し、日本国内に住所を有しない20歳以上65歳未満のものの任意加入については、設問の口座振替納付を希望する旨等の申出は義務付けられていない。口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならないのは、日本国内に住所を有する20歳以上60歳未満の者であって厚生年金保険法に基づく老齢給付等を受けることができるもの、又は日本国内に住所を有する60歳以上65歳未満の者（いずれも国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）が任意加入の申出を行おうとする場合である。",src:"法附則5条2項",cat:"択一式（国民年金法）"},
{no:"第2-問1",opt:"E",q:"日本国籍を有し、日本国内に住所を有しない32歳の任意加入被保険者が出産することとなった場合であっても、国民年金法第88条の2（産前産後期間の保険料免除）の規定による保険料の免除は行われない。",a:true,exp:"設問の通り正しい。任意加入被保険者については、保険料免除の規定（法定免除、申請全額免除、保険料一部免除、学生納付特例、納付猶予、産前産後期間の保険料免除）は適用されない。",src:"法附則5条10項",cat:"択一式（国民年金法）"},
{no:"第2-問2",opt:"A",q:"国民年金法第90条第1項の規定による保険料全額免除の申請に係る所得の要件は、申請に係る第1号被保険者に扶養親族等（特定年齢扶養親族にあっては、控除対象扶養親族に限る。）が3人いる場合には、その年の前年の所得（1月から6月までの月分の保険料については、前々年の所得とする。）が147万円以下であることとされる。",a:false,exp:"保険料全額免除の申請に係る所得の要件は、扶養親族等（特定年齢扶養親族にあっては、控除対象扶養親族に限る。以下同じ。）の数に1を加えた数を35万円に乗じて得た額に32万円を加算した額以下であることとされている。設問の場合、扶養親族等は3人であるから、所得の要件は「（3＋1）×35万円＋32万円＝172万円」以下であることとされる。",src:"法90条1項1号、令6条の7、則77条の2",cat:"択一式（国民年金法）"},
{no:"第2-問2",opt:"B",q:"保険料の納付猶予制度の対象とされるには、本人及び配偶者の前年の所得が一定額以下であること等の要件に該当することを要するが、世帯主について当該要件が問われることはない。",a:true,exp:"設問の通り正しい。なお、学生納付特例については、本人のみ所得等の要件が問われる。また、申請全額免除及び保険料一部免除については、本人、配偶者及び世帯主につき所得等の要件が問われる（世帯主又は配偶者のいずれかが所定の要件のいずれにも該当しないときは、免除されない。）。",src:"(16)法附則19条1項、(24)法附則14条1項",cat:"択一式（国民年金法）"},
{no:"第2-問2",opt:"C",q:"保険料の前納は、厚生労働大臣が定める期間のすべての保険料（既に前納されたものを除く。）をまとめて前納する場合に限り、6月又は年を単位として行うことができる。",a:false,exp:"保険料の前納は、厚生労働大臣が定める期間につき、6月又は年を単位として、行うものとされており、厚生労働大臣が定める期間のすべての保険料（既に前納されたものを除く。）をまとめて前納する場合においては、6月又は年を単位として行うことを要しないとされている。",src:"法93条4項、令7条",cat:"択一式（国民年金法）"},
{no:"第2-問2",opt:"D",q:"保険料を前納する場合、前納すべき額は、当該期間の各月の保険料の額から政令で定める額を控除した額とされており、この政令で定める額は、前納に係る期間の各月の保険料の合計額から、その期間の各月の保険料の額を民法の法定利率による複利現価法によって前納に係る期間の最初の月から当該各月までのそれぞれの期間に応じて割り引いた額の合計額を控除した額とされている。",a:false,exp:"「法定利率」とする記述が誤りである。保険料の額から控除されることとなる政令で定める額は、前納に係る期間の各月の保険料の合計額から、その期間の各月の保険料の額を「年4分」の利率による複利現価法によって前納に係る期間の最初の月から当該各月までのそれぞれの期間に応じて割り引いた額の合計額を控除した額とされている。",src:"法93条2項、令8条1項",cat:"択一式（国民年金法）"},
{no:"第2-問2",opt:"E",q:"保険料の前納に係る期間の経過前において、第1号被保険者が国民年金法第90条の3（学生納付特例）の規定により前納に係る期間の保険料を納付することを要しないものとされたときであっても、前納した保険料については、還付が行われることはない。",a:false,exp:"設問の場合、前納に係る第1号被保険者の請求に基づき、前納した保険料のうち、学生納付特例の規定により保険料を納付することを要しないものとされた期間に係る保険料が還付される。",src:"令9条",cat:"択一式（国民年金法）"},
{no:"第2-問3",opt:"A",q:"住民基本台帳法の規定による転入届、転居届又は転出届があったとき（当該届出に係る書面に同法の規定による付記がされたときに限る。）は、その届出と同一の事由に基づく第1号被保険者に係る届出があったものとみなされる。",a:true,exp:"設問の通り正しい。第1号被保険者は、その資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項を市町村長に届け出なければならないが、住民基本台帳法の規定による転入届、転居届又は転出届があったとき（当該届出に係る書面に同法の規定による付記がされたときに限る。）は、その届出と同一の事由に基づく第1号被保険者に係る届出（住所の変更の届出）があったものとみなされる。なお、第1号被保険者の住所の変更の届出は、厚生労働大臣が住民基本台帳法の規定により機構保存本人確認情報の提供を受けることができるときは、不要とされている。",src:"法12条3項",cat:"択一式（国民年金法）"},
{no:"第2-問3",opt:"B",q:"第1号被保険者の属する世帯の世帯主は、当該第1号被保険者と連帯してその者に係る届出をする義務を負う。",a:false,exp:"第1号被保険者の属する世帯の世帯主は、第1号被保険者に代って、第1号被保険者に係る届出をすることができる（「第1号被保険者と連帯してその者に係る届出をする義務を負う」のではない。）。",src:"法12条2項",cat:"択一式（国民年金法）"},
{no:"第2-問3",opt:"C",q:"第1号被保険者は、その個人番号を変更したときは、所定の事項を記載した届書を、その日から14日以内に、市町村長（特別区の区長を含む。以下同じ。）に提出しなければならない。",a:false,exp:"第1号被保険者は、その個人番号を変更したときは、所定の事項を記載した届書を、速やかに、「日本年金機構」に提出しなければならない。",src:"則8条の2,1項",cat:"択一式（国民年金法）"},
{no:"第2-問3",opt:"D",q:"国民年金法第30条の4（20歳前傷病による障害基礎年金）の規定による障害基礎年金の受給権者は、毎年、誕生日の属する月の末日までに、同日前3月以内に作成された障害基礎年金所得状況届等の所定の書類を機構に提出しなければならない。ただし、前年の所得に関する当該書類が提出されているとき、厚生労働大臣が同法第108条第2項の規定により必要な書類を閲覧し、若しくは資料の提供を受けることにより前年の所得に関する当該書類に係る事実を確認することができるとき又は当該障害基礎年金の額の全部につき支給が停止されているときは、この限りでない。",a:false,exp:"設問文中の「誕生日の属する月の末日」を「9月30日」と、「3月以内」を「1月以内」と読み替えると、正しい記述となる。",src:"則36条の5、令和3.6.24厚労告248号",cat:"択一式（国民年金法）"},
{no:"第2-問3",opt:"E",q:"被保険者又は受給権者が死亡したときは、戸籍法の規定による死亡の届出義務者は、その旨を第1号被保険者に係るものにあっては市町村長に、第3号被保険者又は受給権者に係るものにあっては厚生労働大臣に届け出なければならない。ただし、厚生労働大臣が住民基本台帳法の規定により機構保存本人確認情報の提供を受けることができる被保険者又は受給権者の死亡について、死亡の日から10日以内に同法の規定による死亡の届出をした場合は、この限りでない。",a:false,exp:"設問文中の「10日以内」を「7日以内」と読み替えると、正しい記述となる。なお、戸籍法の規定による死亡の届出義務者が、死亡の届出の規定に違反して、その届出をしなかったときは、10万円以下の過料に処せられる。",src:"法105条4項、則4条3項、4項、24条6項、7項、38条1項、53条1項、60条の8",cat:"択一式（国民年金法）"},
{no:"第2-問4",opt:"A",q:"繰上げ支給の老齢基礎年金の受給権者は、任意加入被保険者となることができない。",a:true,exp:"設問の通り正しい。なお、任意加入被保険者は、老齢基礎年金の支給繰上げの請求をすることはできない。",src:"法附則9条の2の3",cat:"択一式（国民年金法）"},
{no:"第2-問4",opt:"B",q:"老齢基礎年金の支給繰上げの請求は、老齢厚生年金の支給繰上げの請求をすることができる者にあっては、当該請求と同時に行わなければならない。",a:true,exp:"設問の通り正しい。なお、老齢基礎年金の支給繰下げの申出は、老齢厚生年金の支給繰下げの申出と同時に行うことを要しない（それぞれ単独で支給繰下げの申出をすることができる。）。",src:"法附則9条の2,2項、9条の2の2,2項",cat:"択一式（国民年金法）"},
{no:"第2-問4",opt:"C",q:"65歳に達した日に老齢基礎年金の受給権を取得した者が、他の年金たる給付（他の年金給付（付加年金を除く。）又は厚生年金保険法による年金たる保険給付（老齢を支給事由とするものを除く。）をいう。以下同じ。）の受給権者であったことがないままであったが、69歳のときに障害厚生年金の受給権を取得した。この者が71歳のときに老齢基礎年金の支給繰下げの申出をしたときは、障害厚生年金の受給権を取得した日に支給繰下げの申出をしたものとみなされる。",a:true,exp:"設問の通り正しい。65歳に達した日に老齢基礎年金の受給権を取得した者であって、老齢基礎年金の支給繰下げの申出をすることができる者が、70歳に達した日後に当該老齢基礎年金を請求し、かつ、当該請求の際に支給繰下げの申出をしないときは、次の①又は②に該当する場合を除き、当該請求をした日の5年前の日に支給繰下げの申出があったものとみなすこととされている。① 80歳に達した日以後にあるとき ② 65歳に達した日から当該請求をした日の5年前の日までの間において他の年金たる給付の受給権者となったとき",src:"法28条2項",cat:"択一式（国民年金法）"},
{no:"第2-問4",opt:"D",q:"65歳に達した日に老齢基礎年金の受給権を取得した者が、他の年金たる給付の受給権者であったことがないままであったが、71歳に達した日に当該老齢基礎年金の請求をした。この者が当該老齢基礎年金の請求の際に支給繰下げの申出をしないときは、66歳に達した日に支給繰下げの申出をしたものとみなされる。",a:true,exp:"設問の通り正しい。",src:"法28条5項",cat:"択一式（国民年金法）"},
{no:"第2-問4",opt:"E",q:"令和6年9月に65歳に達し、老齢基礎年金の受給権を取得した者が、令和8年4月に老齢基礎年金の支給繰下げの申出をした場合には、支給繰下げによる増額率は14.0％となる。",a:false,exp:"老齢基礎年金の支給繰下げによる増額率は、1000分の7に当該年金の受給権を取得した日の属する月から当該年金の支給の繰下げの申出をした日の属する月の前月までの月数（当該月数が120を超えるときは、120）を乗じて得た率である。設問の場合、受給権を取得した日の属する月（令和6年9月）から支給の繰下げの申出をした日の属する月の前月（令和8年3月）までの月数が19月であるから、増額率は「1000分の7×19＝13.3％」となる。",src:"法28条4項、令4条の5,1項",cat:"択一式（国民年金法）"},
{no:"第2-問5",opt:"ア",q:"繰上げ支給の老齢基礎年金の受給権者が、寡婦年金を受けることができることとなったときは、繰上げ支給の老齢基礎年金の受給権は消滅する。",a:false,exp:"繰上げ支給の老齢基礎年金の受給権者には、寡婦年金の規定は適用されない（「寡婦年金を受けることができること」となることはない。）。なお、寡婦年金の受給権者が、繰上げ支給の老齢基礎年金の受給権者となったときは、寡婦年金の受給権は消滅する。",src:"法附則9条の2の3",cat:"択一式（国民年金法）"},
{no:"第2-問5",opt:"イ",q:"死亡した夫が、死亡日の前日において死亡日の属する月の前月までに、第1号被保険者として保険料を全額納付した期間を8年間、合算対象期間を3年間、厚生年金保険の被保険者期間を3年間有していた場合、妻に対して寡婦年金が支給されることはない。",a:true,exp:"設問の通り正しい。寡婦年金が支給されるには、死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が10年以上である夫が死亡したことを要し、合算対象期間や厚生年金保険の被保険者期間は、支給要件に係る「10年以上」の期間に算入されない（設問の者は、第1号被保険者としての被保険者期間に係る保険料納付済期間を8年しか有しておらず、「10年以上」の支給要件に該当しない。）。",src:"法49条1項",cat:"択一式（国民年金法）"},
{no:"第2-問5",opt:"ウ",q:"死亡した者が、死亡日の前日において死亡日の属する月の前月までに、第1号被保険者として保険料を全額納付した月数を24月、保険料4分の3免除期間の月数を24月、保険料全額免除期間の月数を24月有していた場合、その者の一定の遺族に死亡一時金が支給されることはない。",a:true,exp:"設問の通り正しい。死亡一時金が支給されるには、死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間の月数、保険料4分の1免除期間の月数の4分の3に相当する月数、保険料半額免除期間の月数の2分の1に相当する月数及び保険料4分の3免除期間の月数の4分の1に相当する月数を合算した月数が36月以上である者が死亡したことを要する。設問の者は、第1号被保険者としての被保険者期間に係る保険料納付済期間の月数が24月、保険料4分の3免除期間の月数（24月）の4分の1に相当する月数が6月であり、合算した月数が30月（36月未満）であるため、死亡一時金の「36月以上」の支給要件に該当しない。",src:"法52条の2,1項",cat:"択一式（国民年金法）"},
{no:"第2-問5",opt:"エ",q:"死亡した者が、死亡日の前日において死亡日の属する月の前月までに、第1号被保険者として保険料を全額納付した月数を12月、65歳未満の任意加入被保険者として保険料を全額納付した月数を12月、65歳以上70歳未満の特例による任意加入被保険者として保険料を全額納付した月数を12月有していた場合、その者の一定の遺族に死亡一時金が支給されることはない。",a:false,exp:"死亡一時金の規定の適用については、65歳未満の任意加入被保険者としての被保険者期間及び65歳以上70歳未満の特例による任意加入被保険者としての被保険者期間は、第1号被保険者としての被保険者期間とみなすこととされている。したがって、設問の者は、死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間の月数を36月有することとなり、死亡一時金の「36月以上」の支給要件に該当するため、他の支給要件を満たせば、死亡一時金が支給されることとなる。なお、寡婦年金の規定の適用については、65歳未満の任意加入被保険者としての被保険者期間は、第1号被保険者としての被保険者期間とみなすこととされているが、65歳以上70歳未満の特例による任意加入被保険者としての被保険者期間は、第1号被保険者としての被保険者期間とみなすこととされていない（寡婦年金の支給要件に係る「10年以上」の期間に算入されない。）。",src:"法52条の2,1項、法附則5条9項、(6)法附則11条9項、(16)法附則23条9項、(R7)法附則40条9項",cat:"択一式（国民年金法）"},
{no:"第2-問5",opt:"オ",q:"老齢基礎年金又は障害基礎年金の支給を受けたことがある者が死亡したときは、寡婦年金又は死亡一時金のいずれも支給されることはないが、遺族基礎年金又は障害厚生年金の支給を受けたことがあるものが死亡したときであっても、これらの支給を受けたことを理由として寡婦年金又は死亡一時金が不支給となることはない。",a:true,exp:"設問の通り正しい。",src:"法49条1項、52条の2,1項、2項",cat:"択一式（国民年金法）"},
{no:"第2-問6",opt:"ア",q:"受給権者が婚姻（届出をしていないが、事実上婚姻関係と同様の事情にある場合を含む。）をしたときは、その受給権は消滅する。",a:false,exp:"設問のような規定はない。法30条の4に規定する（20歳前傷病による）障害基礎年金の失権事由は、法30条1項に規定する（一般の）障害基礎年金と同様である。",src:"法35条他",cat:"択一式（国民年金法）"},
{no:"第2-問6",opt:"イ",q:"労働者災害補償保険法の規定による遺族補償年金を受けることができるときは、その該当する期間、その支給を停止する。",a:true,exp:"設問の通り正しい。法30条の4に規定する（20歳前傷病による）障害基礎年金は、恩給法に基づく年金たる給付、労働者災害補償保険法の規定による年金たる給付その他の年金たる給付であって政令で定めるものを受けることができるときは、その該当する期間、その支給を停止する。",src:"法36条の2,1項1号、令4条の8,1項",cat:"択一式（国民年金法）"},
{no:"第2-問6",opt:"ウ",q:"日本国内に住所を有しないときは、その該当する期間、その支給を停止する。",a:true,exp:"設問の通り正しい。",src:"法36条の2,1項4号",cat:"択一式（国民年金法）"},
{no:"第2-問6",opt:"エ",q:"受給権者の前年の所得が、その者の扶養親族等の有無及び数に応じて、政令で定める額を超えるときは、その年の10月から翌年の9月まで、その全部又は2分の1（子の加算額が加算された障害基礎年金にあっては、子の加算額を控除した額の2分の1）に相当する部分の支給を停止する。",a:true,exp:"設問の通り正しい。なお、震災、風水害、火災その他これらに類する災害により、自己又は所得税法に規定する同一生計配偶者若しくは扶養親族の所有に係る住宅、家財又は政令で定めるその他の財産につき被害金額（保険金、損害賠償金等により補充された金額を除く。）がその価格のおおむね2分の1以上である損害を受けた者（以下「被災者」という。）がある場合においては、その損害を受けた月から翌年の9月までの法30条の4に規定する（20歳前傷病による）障害基礎年金については、その損害を受けた年の前年又は前々年における当該被災者の所得を理由とする支給の停止は、行わないこととされている。",src:"法36条の3,1項",cat:"択一式（国民年金法）"},
{no:"第2-問6",opt:"オ",q:"国庫は、毎年度、その給付に要する費用の100分の80に相当する額を負担する。",a:false,exp:"国庫は、毎年度、法30条の4に規定する（20歳前傷病による）障害基礎年金の給付に要する費用の「100分の60」に相当する額を負担する。",src:"法85条1項1号、3号",cat:"択一式（国民年金法）"},
{no:"第2-問7",opt:"A",q:"60歳に達した日に被保険者の資格を喪失し、その後被保険者となることなく日本国内に住所を有していた者が、64歳となった令和8年4月1日に死亡した場合であって、その死亡日の前日において、60歳に達するまでの1年間における被保険者期間が全て保険料納付済期間であるときは、遺族基礎年金に係る保険料納付要件を満たしていることとなる。",a:true,exp:"設問の通り正しい。死亡日の前日において、死亡日の属する月の前々月までに被保険者期間がある場合、当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の3分の2に満たないときは、原則として保険料納付要件を満たさないこととなるが、令和18年4月1日前に死亡した65歳未満の者については、原則の保険料納付要件を満たさない場合であっても、当該死亡日の前日において当該死亡日の属する月の前々月までの1年間（当該死亡日において被保険者でなかった者については、当該死亡日の属する月の前々月以前における直近の被保険者期間に係る月までの1年間）のうちに保険料納付済期間及び保険料免除期間以外の被保険者期間がないときは、保険料納付要件（特例）を満たすこととなる。設問の者は、死亡日において被保険者でなかった者であるが、死亡日の前日において、直近の被保険者期間に係る月までの1年間（60歳に達するまでの1年間）の全てが保険料納付済期間であることから、特例の保険料納付要件を満たしていることとなる。",src:"(60)法附則20条2項",cat:"択一式（国民年金法）"},
{no:"第2-問7",opt:"B",q:"昭和32年4月20日に生まれた外国籍の者が、41歳の時に第1号被保険者となり60歳に達するまでの19年間（平成10年4月から平成29年3月まで）につき保険料を納付していた。その後63歳から6年間の間は会社に勤務し、厚生年金保険の被保険者期間（令和2年4月から令和8年3月まで）を有することとなったが、令和8年4月1日に68歳で死亡した。この場合、その死亡の当時その者によって生計を維持していたその者の一定の子があるときは、その子は遺族基礎年金を受けることができる遺族となる。なお、死亡した者について、上記の期間以外の保険料納付済期間、保険料免除期間及び合算対象期間はない。",a:true,exp:"設問の通り正しい。遺族基礎年金が支給されるには、「①被保険者が死亡したとき」「②被保険者であった者であって、日本国内に住所を有し、かつ、60歳以上65歳未満であるものが、死亡したとき」「③保険料納付済期間と保険料免除期間とを合算した期間が25年以上である者が、死亡したとき」のいずれかの要件に該当していることを要する。設問の者は、①及び②に該当していないため、③の要件に該当することを要するが、保険料納付済期間と保険料免除期間とを合算した期間が25年に満たなくても、保険料納付済期間、保険料免除期間及び合算対象期間並びに65歳に達した日の属する月以後の厚生年金保険の被保険者期間を合算した期間が25年以上であれば、③の25年の要件を満たすこととされる。設問の者は、保険料納付済期間が19年、合算対象期間（令和2年4月から令和4年3月）が2年、65歳に達した日の属する月以後の厚生年金保険の被保険者期間（令和4年4月から令和8年3月）が4年であり、合算して25年となることから、当該要件を満たしていることとなる。",src:"法37条3号、37条の2,1項、法附則9条1項",cat:"択一式（国民年金法）"},
{no:"第2-問7",opt:"C",q:"昭和31年3月20日に生まれた外国籍の者が、45歳から24年間につき会社に勤務し、厚生年金保険の被保険者期間（平成13年4月から令和7年3月まで）を有することとなったが、その後に退職しそのまま被保険者となることなく令和8年4月1日に70歳で死亡した。この場合、その死亡の当時その者によって生計を維持していたその者の一定の子があるときであっても、その子は遺族基礎年金を受けることができる遺族とならない。なお、死亡した者について、上記の期間以外の保険料納付済期間、保険料免除期間及び合算対象期間はない。",a:false,exp:"設問の子は遺族基礎年金を受けることができる遺族となる。遺族基礎年金が支給されるには、「①被保険者が死亡したとき」「②被保険者であった者であって、日本国内に住所を有し、かつ、60歳以上65歳未満であるものが、死亡したとき」「③保険料納付済期間と保険料免除期間とを合算した期間が25年以上である者が、死亡したとき」のいずれかの要件に該当していることを要する。設問の者は、①及び②に該当していないため、③の要件に該当することを要するが、保険料納付済期間と保険料免除期間とを合算した期間が25年に満たなくても、昭和30年4月2日から昭和31年4月1日までの間に生まれた者について、厚生年金保険の被保険者期間が24年以上であるときは、③の25年の要件を満たすこととされる。設問の者は、昭和31年3月20日生まれであり、厚生年金保険の被保険者期間（平成13年4月から令和7年3月まで）が24年あることから、当該要件を満たしていることとなる。",src:"法37条の2,1項、(60)法附則12条1項、同法附則別表第2",cat:"択一式（国民年金法）"},
{no:"第2-問7",opt:"D",q:"被保険者の死亡の当時その者によって生計を維持していた配偶者と1人の子がいる場合、その子が障害等級に該当する障害の状態にある19歳の子であったとしても、既に婚姻をしているときは、その子及び配偶者はいずれも遺族基礎年金を受けることができる遺族とならない。なお、保険料納付要件は満たしているものとする。",a:true,exp:"設問の通り正しい。現に婚姻をしている子は遺族基礎年金を受けることができる遺族とならず、また、その子と生計を同じくしている配偶者も遺族基礎年金を受けることができる遺族とならない。遺族基礎年金を受けることができる配偶者又は子は、被保険者又は被保険者であった者の配偶者又は子であって、被保険者又は被保険者であった者の死亡の当時その者によって生計を維持し、かつ、次の要件に該当したものとされている。① 配偶者については、被保険者又は被保険者であった者の死亡の当時その者によって生計を維持し、かつ、②に掲げる要件に該当する子と生計を同じくすること ② 子については、18歳に達する日以後の最初の3月31日までの間にあるか又は20歳未満であって障害等級に該当する障害の状態にあり、かつ、現に婚姻をしていないこと",src:"法37条の2,1項",cat:"択一式（国民年金法）"},
{no:"第2-問7",opt:"E",q:"被保険者である夫の死亡の当時その者によって生計を維持していた妻（後妻）と夫の13歳の連れ子（夫と前妻との間の子）が1人いる場合、後妻と連れ子が養子縁組をしてなくとも、後妻がその連れ子と生計を同じくしているときは、その連れ子及び後妻は遺族基礎年金を受けることができる遺族となる。なお、保険料納付要件は満たしているものとする。",a:true,exp:"設問の通り正しい。設問の連れ子及び後妻は、いずれも遺族基礎年金を受けることができる配偶者又は子の要件に該当している（Dの解説参照）ため、遺族基礎年金を受けることができる遺族となる。なお、遺族基礎年金の支給対象となる子は、死亡した者の子（実子・養子）であることを要し、死亡した者の配偶者の連れ子は（死亡した者と養子縁組をしていない場合には）遺族基礎年金の支給対象とならず、また、養子には事実上養子縁組関係と同様の事情にある者は含まない。",src:"法37条の2,1項",cat:"択一式（国民年金法）"},
{no:"第2-問8",opt:"A",q:"障害厚生年金及びこれと同一の支給事由に基づく障害基礎年金の受給権者によって生計を維持しており、かつ、当該障害厚生年金の加給年金額の加算の対象となっているその者の配偶者が、令和8年4月1日に65歳に達し、老齢基礎年金の受給権を取得したときは、原則として当該老齢基礎年金に振替加算額が加算される。",a:true,exp:"設問の通り正しい。振替加算は、大正15年4月2日から昭和41年4月1日までの間に生まれた者であって、65歳に達した日において、次の①又は②のいずれかに該当するその者の配偶者によって生計を維持しており、かつ、65歳に達した日の前日において当該配偶者がその受給権を有する①又は②に掲げる年金たる給付の加給年金額の計算の基礎となっていた場合に行われる。なお、65歳に達した日以後にその者の配偶者が次の①又は②のいずれかに該当するに至った場合において、その当時その者がその者の配偶者によって生計を維持していたときについても、振替加算が行われる。① 老齢厚生年金〔その額の計算の基礎となる被保険者期間の月数が240以上であるもの（中高齢者の特例により240とみなされる場合を含む）に限る。〕の受給権者 ② 障害厚生年金の受給権者（当該障害厚生年金と同一の支給事由に基づく障害基礎年金の受給権を有する者に限る。）",src:"(60)法附則14条1項",cat:"択一式（国民年金法）"},
{no:"第2-問8",opt:"B",q:"振替加算の対象となるのは、老齢基礎年金の受給権者であって、大正15年4月2日から昭和41年4月1日までの間に生まれた者であり、また、振替加算額は、224,700円に改定率を乗じて得た額に、当該受給権者の生年月日に応じて政令で定める率を乗じて得た額である。",a:true,exp:"設問の通り正しい。政令で定める率は、老齢基礎年金の受給権者（振替加算額が加算される者）の生年月日に応じて定められていることに留意しよう。",src:"(60)法附則14条1項",cat:"択一式（国民年金法）"},
{no:"第2-問8",opt:"C",q:"老齢基礎年金の受給権者が、その額の計算の基礎となる被保険者期間の月数が240以上である老齢厚生年金又は遺族厚生年金を受けることができるときは、当該老齢基礎年金に振替加算額は加算されない。",a:false,exp:"「遺族厚生年金を受けることができるとき」とする記述が誤りである。老齢基礎年金の受給権者が、その額の計算の基礎となる被保険者期間の月数が240以上である老齢厚生年金を受けることができるときは、当該老齢基礎年金に振替加算額は加算されないが、遺族厚生年金を受けることができるときについては、振替加算額を加算しないこととはされていない。",src:"(60)法附則14条1項、(61)措置令25条",cat:"択一式（国民年金法）"},
{no:"第2-問8",opt:"D",q:"振替加算額が加算された老齢基礎年金は、その受給権者が障害厚生年金の支給を受けることができるときは、その間、振替加算額に相当する部分の支給が停止される。",a:true,exp:"設問の通り正しい。振替加算額が加算された老齢基礎年金は、障害基礎年金、旧国民年金法による障害年金、障害厚生年金、旧厚生年金保険法による障害年金等の障害を支給事由とする年金たる給付であって政令で定めるものの支給を受けることができるときは、その間、振替加算額に相当する部分の支給が停止される。",src:"(60)法附則16条1項、(61)措置令28条",cat:"択一式（国民年金法）"},
{no:"第2-問8",opt:"E",q:"老齢基礎年金の支給繰上げの請求をした場合であっても、振替加算額の加算が繰り上げられることはなく、また、老齢基礎年金の支給繰下げの申出をした場合であっても、振替加算額が増額されることはない。",a:true,exp:"設問の通り正しい。老齢基礎年金の支給繰上げの請求をした場合であっても、振替加算額の加算が繰り上げられることはなく、減額されることもない。また、老齢基礎年金の支給繰下げの申出をした場合には、振替加算額の加算についても繰り下げられる（繰下げ支給の老齢厚生年金の支給開始と同時に加算されることとなる）が、振替加算額が増額されることはない。",src:"(60)法附則14条1項、2項",cat:"択一式（国民年金法）"},
{no:"第2-問9",opt:"A",q:"老齢基礎年金の受給権者が厚生労働大臣の承認を受け、保険料を追納したときは、その追納が行われた日の属する月の翌月から、当該老齢基礎年金の額が改定される。",a:false,exp:"設問のような規定はない。老齢基礎年金の受給権者は、保険料を追納することはできない。",src:"法94条1項",cat:"択一式（国民年金法）"},
{no:"第2-問9",opt:"B",q:"保険料の4分の1免除の規定によりその4分の1の額につき納付することを要しないものとされた保険料については、その残余の4分の3の額につき納付していないときであっても、免除された4分の1の額についてのみ、追納することができる。",a:false,exp:"設問の場合、追納することはできない。保険料一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料については、その残余の額につき納付されたときに限り、追納することができる。設問の場合、残余の4分の3の額を納付していないので、追納することはできない。",src:"法94条1項",cat:"択一式（国民年金法）"},
{no:"第2-問9",opt:"C",q:"学生納付特例により納付を要しないものとされた令和5年4月の保険料について、令和8年3月に追納をする場合には、追納すべき額は、保険料の額に政令で定める額を加算した額となる。",a:false,exp:"保険料が免除された月の属する年度の翌々年度（免除の月が3月のときは、翌々年の4月）までに追納する場合には、追納に係る加算は行われない。設問の場合、令和5年度（令和5年4月）の保険料を翌々年度の令和7年度（令和8年3月）に追納する場合であるから、追納に係る加算は行われないこととなる。",src:"法94条3項、令10条1項",cat:"択一式（国民年金法）"},
{no:"第2-問9",opt:"D",q:"納付することを要しないものとされた保険料の一部について追納する場合、学生納付特例の規定により納付することを要しないものとされた保険料より前に納付義務が生じ、保険料一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料があるときは、保険料一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料について、先に経過した月の分の保険料から追納をすることができる。",a:true,exp:"設問の通り正しい。追納は、納付することを要しないものとされた保険料の一部につき追納をするときは、原則として、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料につき行い、次いで法定免除若しくは申請全額免除の規定により納付することを要しないものとされた保険料又は保険料一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料につき行うものとされ、これらの保険料のうちにあっては、先に経過した月の分から順次行うものとされている。ただし、学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料より前に納付義務が生じ、法定免除若しくは申請全額免除の規定により納付することを要しないものとされた保険料又は保険料一部免除の規定によりその一部の額につき納付することを要しないものとされた保険料があるときは、当該保険料について、先に経過した月の分の保険料から追納をすることができるものとされている。",src:"法94条2項",cat:"択一式（国民年金法）"},
{no:"第2-問9",opt:"E",q:"追納を行うことができるのは、厚生労働大臣の承認の日以前10年以内の期間に係るものに限られており、また、保険料を滞納した期間について追納を行うことはできないが、合算対象期間のうち20歳以上60歳未満の期間については、追納を行うことができる。",a:false,exp:"追納は、厚生労働大臣の承認の日の属する「月前」10年以内の期間に係るものに限る。また、保険料を滞納した期間について追納を行うことはできず、合算対象期間についても追納を行うことはできない。",src:"法94条1項",cat:"択一式（国民年金法）"},
{no:"第2-問10",opt:"A",q:"保険料その他国民年金法の規定による徴収金に関する処分に不服がある者は、社会保険審査会に対して審査請求をすることができる。",a:false,exp:"「社会保険審査会」とする記述が誤りである。保険料その他国民年金法の規定による徴収金に関する処分に不服がある者は、「社会保険審査官」に対して審査請求をし、その決定に不服がある者は、社会保険審査会に対して再審査請求をすることができる。",src:"法101条1項",cat:"択一式（国民年金法）"},
{no:"第2-問10",opt:"B",q:"被保険者の資格に関する処分に不服がある者は、社会保険審査官に対して審査請求をすることができるほか、審査請求をすることなく、裁判所に対して処分の取消しの訴えを提起することができる。",a:false,exp:"「審査請求をすることなく、裁判所に対して処分の取消しの訴えを提起することができる」とする記述が誤りである。被保険者の資格に関する処分又は給付に関する処分（共済組合等が行った障害基礎年金に係る障害の程度の診査に関する処分を除く。）の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない。",src:"法101条の2",cat:"択一式（国民年金法）"},
{no:"第2-問10",opt:"C",q:"被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく給付に関する処分の不服の理由とすることができる。",a:false,exp:"被保険者の資格に関する処分が確定したときは、その処分についての不服を当該処分に基づく給付に関する処分の不服の理由とすることはできない。",src:"法101条4項",cat:"択一式（国民年金法）"},
{no:"第2-問10",opt:"D",q:"共済組合等が行った障害基礎年金に係る障害の程度の診査に関する処分に不服がある者は、当該共済組合等に係る共済各法の定めるところにより、当該共済各法に定める審査機関に審査請求をすることができる。",a:true,exp:"設問の通り正しい。なお、共済各法とは、国家公務員共済組合法、地方公務員等共済組合法及び私立学校教職員共済法をいう。",src:"法101条6項",cat:"択一式（国民年金法）"},

// ============================================================
//  GOOGLE DRIVE SYNC
// ============================================================
const CLIENT_ID    = APP_CONFIG.clientId;
const SCOPES       = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = APP_CONFIG.driveFileName;
let tokenClient = null, gapiInited = false, gisInited = false;
let accessToken = null, driveFileId = null, isSyncing = false;
let autoSaveTimer = null;
let tokenRefreshTimer = null; // トークン自動更新タイマー

window.addEventListener('load', () => {
  // ログイン済みの場合は「再接続中」表示
  if (getSavedAuth()) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncStatusText');
    if (dot) dot.className = 'sync-dot syncing';
    if (txt) txt.textContent = '再接続中…';
  }
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
    maybeEnableSync();
  });
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) {
          if (getSavedAuth()) {
            updateSyncUI(false);
            showToast('再接続できませんでした。再度ログインしてください', 'warn');
          }
          return;
        }
        accessToken = resp.access_token;
        gapi.client.setToken({ access_token: accessToken });
        onSignedIn();
        // 55分後にトークンを自動更新（アクセストークンは1時間で失効）
        if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
        tokenRefreshTimer = setTimeout(() => {
          if (getSavedAuth()) tokenClient.requestAccessToken({ prompt: '' });
        }, 55 * 60 * 1000);
      }
    });
    gisInited = true;
    maybeEnableSync();
  };
  document.head.appendChild(s);
});

function maybeEnableSync() {
  if (gapiInited && gisInited && getSavedAuth()) {
    tokenClient.requestAccessToken({ prompt: '' });
  }
}
function signIn() {
  if (!gapiInited || !gisInited) { showToast('初期化中です、少々お待ちください', 'error'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null; driveFileId = null;
  if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }
  clearSavedAuth(); updateSyncUI(false);
  showToast('ログアウトしました');
}
function onSignedIn() {
  updateSyncUI(true); saveAuthHint();
  showToast('ログイン成功、データを読み込んでいます…', 'success');
  loadFromDrive();
}
function updateSyncUI(loggedIn) {
  document.getElementById('syncDot').className = 'sync-dot' + (loggedIn ? ' connected' : '');
  document.getElementById('syncStatusText').textContent = loggedIn ? 'Googleドライブに同期中' : 'Googleアカウントで同期';
  document.getElementById('syncUser').style.display = 'none';
  document.getElementById('btnSignIn').style.display    = loggedIn ? 'none'  : 'flex';
  document.getElementById('btnManualSync').style.display = loggedIn ? 'block' : 'none';
  document.getElementById('btnManualSync').disabled = !loggedIn;
  document.getElementById('btnSignOut').style.display   = loggedIn ? 'block' : 'none';
}
function setSyncing(v) {
  isSyncing = v;
  const dot = document.getElementById('syncDot');
  const btn = document.getElementById('btnManualSync');
  if (v) { dot.className = 'sync-dot syncing'; if (btn) { btn.disabled = true; btn.textContent = '同期中…'; } }
  else   { dot.className = 'sync-dot connected'; if (btn) { btn.disabled = false; btn.textContent = '↑↓ 同期'; } }
}
async function loadFromDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const tokenInfo = await fetch('https://www.googleapis.com/oauth2/v1/tokeninfo?access_token=' + accessToken);
    if (!tokenInfo.ok) {
      accessToken = null; clearSavedAuth(); updateSyncUI(false);
      showToast('セッション切れ：再度ログインしてください', 'warn');
      setSyncing(false); return;
    }
    const params = new URLSearchParams({ spaces: 'appDataFolder', q: `name='${DRIVE_FILE_NAME}'`, fields: 'files(id,name)' });
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?${params}`, { headers: { 'Authorization': 'Bearer ' + accessToken } });
    if (!listRes.ok) { const eb = await listRes.text(); throw new Error(`list:${listRes.status} ${eb.substring(0,100)}`); }
    const listData = await listRes.json();
    const files = listData.files || [];
    if (files.length > 0) {
      driveFileId = files[0].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, { headers: { 'Authorization': 'Bearer ' + accessToken } });
      if (!fileRes.ok) throw new Error(`read:${fileRes.status}`);
      const data = await fileRes.json();
      mergeCloudData(data);
      showToast('クラウドから読み込みました', 'success');
    } else {
      showToast('クラウドにデータがありません（初回）');
      await saveToDrive();
    }
  } catch (e) {
    console.error('Drive load error:', e);
    const msg = (e instanceof Error && e.message) ? e.message : (typeof e === 'object' ? JSON.stringify(e).substring(0,100) : String(e)) || '通信エラー';
    showToast('読み込み失敗: ' + msg, 'error');
  }
  setSyncing(false);
}
async function saveToDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const body = JSON.stringify(buildSavePayload());
    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body
      });
    } else {
      const meta = JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&spaces=appDataFolder', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken }, body: form
      });
      driveFileId = (await res.json()).id;
    }
    showToast('クラウドに保存しました', 'success');
  } catch (e) {
    console.error(e);
    showToast('保存失敗: ' + (e?.message || '通信エラー'), 'error');
  }
  setSyncing(false);
}
async function manualSync() {
  if (!accessToken) { showToast('先にログインしてください', 'error'); return; }
  await loadFromDrive();
}
function scheduleAutoSave() {
  if (!accessToken) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveToDrive(), 3000);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && accessToken) {
    if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
    saveToDrive();
  }
});
// ページが非表示になる瞬間（タブ切替・閉じる直前）に即時保存
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && accessToken) {
    if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
    saveToDrive();
  }
});

// ============================================================
//  SAVE / LOAD PAYLOAD
//  ★ v2: stats（正答率）と session（中断データ）を両方保存
// ============================================================
function buildSavePayload() {
  // 現在進行中のセッション or 中断済みの pendingResume を保存
  let sessionData = null;
  if (currentSession && questions.length > 0) {
    sessionData = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
  } else if (pendingResume) {
    sessionData = pendingResume;
  }
  return {
    version: 2,
    bookmarks: [...bookmarks],          // ★ 栞 → Drive同期で他デバイスにも反映
    stats: JSON.parse(JSON.stringify(questionStats)), // ★ 正答率データ
    session: sessionData,               // ★ 中断セーブ
    savedAt: new Date().toISOString()
  };
}
function mergeCloudData(data) {
  if (!data) return;
  // 栞
  if (data.bookmarks) bookmarks = new Set(data.bookmarks);
  // ★ 正答率データを復元
  if (data.stats) {
    Object.entries(data.stats).forEach(([k, v]) => { questionStats[k] = v; });
  }
  // ★ 中断セッションを復元（1問以上回答済みの場合のみ）
  if (data.session && data.session.questionIndices && data.session.answers) {
    const answered = data.session.answers.filter(a => a !== null).length;
    if (answered > 0) pendingResume = data.session;
  }
  localSave();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
}

// ============================================================
//  LOCAL STORAGE
// ============================================================
const LS_KEY  = 'sharoushi_' + DRIVE_FILE_NAME;
const LS_AUTH = 'sharoushi_auth_hint';

function localSave() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      bookmarks: [...bookmarks], stats: questionStats, session: pendingResume
    }));
  } catch {}
}
function localLoad() {
  try {
    const data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (data.bookmarks) bookmarks = new Set(data.bookmarks);
    if (data.stats) questionStats = data.stats;
    if (data.session) pendingResume = data.session;
  } catch {}
}
function saveAuthHint()  { try { localStorage.setItem(LS_AUTH, '1'); } catch {} }
function getSavedAuth()  { try { return localStorage.getItem(LS_AUTH) === '1'; } catch { return false; } }
function clearSavedAuth() { try { localStorage.removeItem(LS_AUTH); } catch {} }

// ============================================================
//  BOOKMARK
// ============================================================
let bookmarks = new Set();
function toggleBookmark() {
  const idx = getOrigIdx(questions[current]);
  if (bookmarks.has(idx)) bookmarks.delete(idx);
  else bookmarks.add(idx);
  localSave(); updateQuestion(); updateBmBadge();
  if (accessToken) saveToDrive(); else scheduleAutoSave();
}
function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if (bookmarks.size > 0) {
    badge.textContent = bookmarks.size;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

// ============================================================
//  STATS
// ============================================================
let questionStats = {}; // { origIdx: {correct:N, total:N} }

function recordStat(origIdx, isCorrect) {
  if (!questionStats[origIdx]) questionStats[origIdx] = {correct:0, total:0};
  questionStats[origIdx].total++;
  if (isCorrect) questionStats[origIdx].correct++;
  localSave(); scheduleAutoSave(); updateWeakBtn(); updateLeastTriedBtn();
}
function getAccuracyInfo(origIdx) {
  const s = questionStats[origIdx];
  if (!s || s.total === 0) return null;
  const pct = Math.round((s.correct / s.total) * 100);
  return {
    total: s.total, pct,
    cls: pct >= 80 ? 'high' : (pct >= 50 ? 'mid' : 'low')
  };
}

// ============================================================
//  WEAK QUESTIONS
// ============================================================
function updateWeakBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return s && s.total > 0 && (s.correct / s.total) <= 0.5;
  });
  const btn = document.getElementById('btnWeakStart');
  btn.style.display = pool.length > 0 ? 'block' : 'none';
  if (pool.length === 0) btn.textContent = 'まだ回答データがありません';
  else btn.textContent = `正答率50%以下の問題を出題（${pool.length}問）`;
}
function startWeak() {
  const s = { useWeak: true };
  startSession(s);
}
function updateLeastTriedBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return !s || s.total === 0 || s.total < 3; // 3回未満
  });
  const btn = document.getElementById('btnLeastTried');
  if (!btn) return;
  if (pool.length > 0) {
    btn.style.display = 'block';
    btn.textContent = `挑戦回数が少ない問題を出題（${pool.length}問）`;
  } else {
    btn.style.display = 'none';
  }
}
function startLeastTried() {
  // 挑戦回数でソート（少ない順）→上位20問を出題
  const indexed = ALL_QUESTIONS.map((q,i) => ({q, i, tries: (questionStats[i]||{total:0}).total}));
  indexed.sort((a,b) => a.tries - b.tries);
  const maxTries = indexed[Math.min(19, indexed.length-1)].tries;
  const pool = indexed.filter(x => x.tries <= maxTries).map(x => ({...x.q, _origIdx: x.i}));
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  const take = pool.slice(0, 20);
  questions = take; answers = Array(take.length).fill(null); current = 0;
  currentSession = { questionIndices: take.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`挑戦回数の少ない${take.length}問を出題`, 'success');
}

// ============================================================
//  RESUME SESSION
// ============================================================
let pendingResume = null;

function offerResume() {
  // モーダル廃止：スタート画面の「続きから開始」ボタンを表示
  updateResumeBtn();
}
function updateResumeBtn() {
  const btn = document.getElementById('btnResumeStart');
  if (!btn) return;
  if (pendingResume) {
    const done = pendingResume.answers.filter(a => a !== null).length;
    const total = pendingResume.questionIndices.length;
    btn.textContent = `▶ 続きから開始（${done}/${total}問 回答済み）`;
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}
function resumeSession() {
  if (!pendingResume) return;
  const pool = pendingResume.questionIndices.map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  if (pool.length === 0) { clearResume(); return; }
  questions = pool; answers = [...pendingResume.answers]; current = pendingResume.current || 0;
  currentSession = { ...pendingResume }; pendingResume = null;
  localSave(); showQuestionScreen(); updateQuestion();
  showToast('前回の続きから再開しました', 'success');
}
function clearResume() {
  pendingResume = null; localSave();
  updateResumeBtn();
  scheduleAutoSave();
}

// ============================================================
//  MAIN LOGIC
// ============================================================
let questions = [], answers = [], current = 0, currentSession = null;

const CATS = [...new Set(ALL_QUESTIONS.map(q => q.cat))];

// ============================================================
//  FILTER
// ============================================================
function initFilters() {
  const btns = document.getElementById('filterBtns');
  CATS.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'btn-filter'; btn.textContent = cat; btn.dataset.cat = cat;
    btn.onclick = () => selectFilter(cat, btn);
    btns.appendChild(btn);
  });
}
function selectFilter(cat, btn) {
  document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  let p = ALL_QUESTIONS;
  if (cat !== 'all') p = p.filter(q => q.cat === cat);
  
  document.getElementById('startCount').textContent = p.length;
  
  // ランダム入力の max を更新
  const input = document.getElementById('randomInput');
  input.max = p.length; 
  if (parseInt(input.value) > p.length) input.value = p.length;
  updateRandomBtn();
}
function getFilteredPool() {
  const active = document.querySelector('.btn-filter.active');
  if (!active) return ALL_QUESTIONS;
  const cat = active.dataset.cat;
  if (cat === 'all') return ALL_QUESTIONS;
  return ALL_QUESTIONS.filter(q => q.cat === cat);
}

// ============================================================
//  RANDOM MODE
// ============================================================
function updateRandomBtn() {
  const input = document.getElementById('randomInput');
  const btn = document.getElementById('btnRandomStart');
  btn.textContent = `${input.value}問ランダムで出題`;
}
function startRandom() {
  const num = parseInt(document.getElementById('randomInput').value) || 10;
  let pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  if (num >= pool.length) pool = pool;
  else {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問をランダム出題開始`, 'success');
}

// 栞ランダムモード
function updateBookmarkRandomBtn() {
  const input = document.getElementById('bookmarkRandomInput');
  const btn = document.getElementById('btnBookmarkRandomStart');
  btn.textContent = `栞から${input.value}問ランダムで出題`;
}
function startBookmarkRandom() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const num = parseInt(document.getElementById('bookmarkRandomInput').value) || 10;
  let pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(q => q.no);
  if (num < pool.length) {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`栞から${pool.length}問をランダム出題開始`, 'success');
}

// ============================================================
//  SHUFFLE
// ============================================================
function shuffle() {
  const pool = getFilteredPool();
  const indices = Array.from({length: pool.length}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  ALL_QUESTIONS.length = 0;
  indices.forEach(i => ALL_QUESTIONS.push(pool[i]));
  showToast('問題をシャッフルしました', 'success');
}

// ============================================================
//  START MODES
// ============================================================
function start() {
  const s = {};
  startSession(s);
}
function startBookmarks() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const s = { useBookmarks: true };
  startSession(s);
}
function startSession(s) {
  let pool = [];
  
  if (s.useBookmarks) {
    pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  } else if (s.useWeak) {
    let p = ALL_QUESTIONS.map((q, i) => ({ ...q, _origIdx: i }));
    pool = p.filter(q => {
      const stat = questionStats[q._origIdx];
      return stat && stat.total > 0 && (stat.correct / stat.total) <= 0.5;
    });
  } else {
    pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  }

  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
}

function getOrigIdx(q) { return q._origIdx !== undefined ? q._origIdx : ALL_QUESTIONS.indexOf(q); }

// ============================================================
//  SCREENS
// ============================================================
function showMain() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.getElementById('screenMain').classList.add('show');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tabMain').classList.add('active');

  if (questions.length > 0 && current < questions.length) {
    showQuestionScreen(); updateQuestion();
  } else {
    document.getElementById('startScreen').style.display = 'block';
    document.getElementById('questionScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';

}
function showBookmarks() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.getElementById('screenBookmarks').classList.add('show');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tabBookmarks').classList.add('active');
  document.querySelector('.bookmark-list').classList.add('show');
