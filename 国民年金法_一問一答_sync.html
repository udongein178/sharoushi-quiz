{no:"TAC06-問16",opt:"A",q:"死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間の月数が30月、任意加入被保険者としての被保険者期間に係る保険料納付済期間の月数が10月である者（老齢基礎年金又は障害基礎年金の支給を受けたことがないものとする。）が61歳の時に死亡した場合において、死亡の当時その者と生計を同じくしていた遺族がその者の妻のみであったときは、その妻に死亡一時金が支給される。",a:true,exp:"本肢のとおりである。任意加入被保険者期間は死亡一時金については第1号被保険者期間とみなされ、保険料納付済期間は40月となり36月以上の要件を満たすため、妻に死亡一時金が支給される。",src:"法52条の2第1項ほか",cat:"択一式（国民年金法）"},
{no:"TAC06-問16",opt:"B",q:"夫の死亡の当時54歳の妻が寡婦年金の受給権を取得した。当該妻に対する寡婦年金は、当該妻が60歳に達した日の属する月の翌月から、その支給を始める。",a:true,exp:"本肢のとおりである。夫の死亡当時60歳未満の妻に支給する寡婦年金は、妻が60歳に達した日の属する月の翌月から支給を始める。",src:"法49条3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問16",opt:"C",q:"寡婦年金の受給権は、受給権者が繰上げ支給の老齢基礎年金の受給権を取得したときは、消滅する。",a:true,exp:"本肢のとおりである。寡婦年金の受給権は、受給権者が繰上げ支給の老齢基礎年金の受給権を取得したときは消滅する。",src:"法附則9条の2第5項",cat:"択一式（国民年金法）"},
{no:"TAC06-問16",opt:"D",q:"付加年金の失権事由と老齢基礎年金の失権事由は同じである。",a:true,exp:"本肢のとおりである。付加年金と老齢基礎年金は、いずれも受給権者が死亡したときにのみ消滅する。",src:"法29条、法48条",cat:"択一式（国民年金法）"},
{no:"TAC06-問16",opt:"E",q:"第1号被保険者としての被保険者期間に係る保険料納付済期間を50月、第2号被保険者としての被保険者期間に係る保険料納付済期間を70月有する外国籍の者が、45歳の時に母国に帰国し、日本国内に住所を有しなくなったときは、脱退一時金の他の支給要件を満たす限り、その支給を請求することができる。",a:false,exp:"設問の者は老齢基礎年金の受給資格期間を満たしているため、「脱退一時金の支給を請求することはできない」。",src:"法附則9条の3の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問17",opt:"A",q:"年金給付は、その支給を停止すべき事由が生じたときは、その事由が生じた日の属する月からその事由が消滅した日の属する月の前月までの分の支給を停止する。ただし、これらの日が同じ月に属する場合は、支給を停止しない。",a:false,exp:"年金給付は、支給を停止すべき事由が生じたときは、その事由が生じた日の属する月の「翌月」からその事由が消滅した日の属する月までの分の支給を停止する（これらの日が同じ月に属するときは支給を停止しない）。",src:"法18条2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問17",opt:"B",q:"調整期間における新規裁定者に係る改定率の改定については、物価変動率に、調整率に当該年度の前年度の特別調整率を乗じて得た率を乗じて得た率（当該率が1を下回るときは、1）を基準とする。",a:false,exp:"設問文中の「物価変動率」を「名目手取り賃金変動率」に置き換えると正しい記述となる。",src:"法27条の4第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問17",opt:"C",q:"65歳に達し、老齢基礎年金の受給権を取得した者が、当該老齢基礎年金を請求しないままその4年後に死亡した。この場合において、死亡の当時その者と生計を同じくしていた者が、その者の20歳の孫のみであったときは、その孫が自己の名で、当該老齢基礎年金を請求することができる。",a:true,exp:"本肢のとおりである。未支給年金は、受給権者の死亡当時生計を同じくしていた配偶者・子・父母・孫・祖父母・兄弟姉妹又はこれら以外の3親等内の親族のうち最先順位者が、自己の名で請求できる。",src:"法19条1項・3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問17",opt:"D",q:"障害等級3級の障害厚生年金の受給権者が65歳に達し、老齢基礎年金及び老齢厚生年金の受給権を取得した場合、この者は、老齢基礎年金と障害厚生年金の組合せで支給を受けるのか、老齢基礎年金と老齢厚生年金の組合せで支給を受けるのか、いずれかを選択することができる。",a:false,exp:"老齢基礎年金と障害厚生年金の組合せで支給を受けることは「できない」。",src:"法20条1項ほか",cat:"択一式（国民年金法）"},
{no:"TAC06-問17",opt:"E",q:"老齢基礎年金の受給権者が死亡し、その受給権が消滅したにもかかわらず、その死亡の日の属する月の翌月以後の分として当該老齢基礎年金の過誤払が行われた場合において、当該過誤払による返還金債権に係る債務の弁済をすべき者に支払うべき障害基礎年金がある場合には、当該障害基礎年金の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。",a:false,exp:"障害基礎年金の支払金の金額を設問の過誤払による返還金債権の金額に充当することは「できない」（充当の対象となる年金給付は所定の遺族基礎年金に限られる）。",src:"法21条の2、則86条の2",cat:"択一式（国民年金法）"},
{no:"TAC06-問18",opt:"A",q:"学生納付特例及び納付猶予の期間に係る老齢基礎年金の給付に要する費用については、その2分の1を国庫が負担する。",a:false,exp:"学生納付特例及び納付猶予の期間は、「国庫負担の対象とならない」。",src:"法85条1項2号ほか",cat:"択一式（国民年金法）"},
{no:"TAC06-問18",opt:"B",q:"保険料納付確認団体は、当該団体の構成員その他これに類する者である被保険者からの委託により、当該被保険者に係る保険料が納期限までに納付されていない事実の有無について確認し、その結果を当該被保険者に通知する業務を行うものとする。",a:true,exp:"本肢のとおりである。",src:"法109条の3第2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問18",opt:"C",q:"第1号被保険者としての被保険者期間のみを有する者に支給する老齢基礎年金を受ける権利の裁定の請求の受理及びその請求に係る事実についての審査に関する事務は、市町村長（特別区の区長を含む。）が行うこととする。",a:true,exp:"本肢のとおりである。",src:"令1条の2第3号イ",cat:"択一式（国民年金法）"},
{no:"TAC06-問18",opt:"D",q:"国民年金事務組合は、その構成員である被保険者の委託を受けて、当該被保険者に係る資格の取得及び喪失並びに種別の変更に関する事項並びに氏名及び住所の変更に関する事項の届出をすることができる。",a:true,exp:"本肢のとおりである。なお、国民年金事務組合は、設問の委託を受けようとするときは、厚生労働大臣の認可を受けなければならない。",src:"法109条1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問18",opt:"E",q:"年金給付を受ける権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、年金給付を支給すべき事由が生じた日の属する月の翌月以後に到来する当該年金給付の支給に係る国民年金法第18条第3項本文に規定する支払期月の翌月の初日から5年を経過したときは、時効によって、消滅する。",a:true,exp:"本肢のとおりである。",src:"法102条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問19",opt:"A",q:"国民年金法による年金の額は、国民の生活水準その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、速やかに改定の措置が講ぜられなければならない。",a:true,exp:"本肢のとおりである。",src:"法4条",cat:"択一式（国民年金法）"},
{no:"TAC06-問19",opt:"B",q:"国民年金法第4条の3第1項の財政の現況及び見通しに係る財政均衡期間は、財政の現況及び見通しが作成される年以降おおむね100年間とする。",a:true,exp:"本肢のとおりである。",src:"法4条の3第2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問19",opt:"C",q:"政府は、国民年金法第4条の3第1項の規定により財政の現況及び見通しを作成するに当たり、国民年金事業の財政が、財政均衡期間の終了時に給付の支給に支障が生じないようにするために必要な積立金（年金特別会計の国民年金勘定の積立金をいう。以下本問において同じ。）を保有しつつ当該財政均衡期間にわたってその均衡を保つことができないと見込まれる場合には、年金たる給付（付加年金を除く。）の額（以下本問において「給付額」という。）及び保険料の額を調整するものとし、政令で、当該給付額及び保険料の額を調整する期間の開始年度を定めるものとする。",a:false,exp:"政府は、設問の場合には、年金たる給付（付加年金を除く。）の額（給付額）を調整するものとし、政令で給付額を調整する期間（調整期間）の開始年度を定める。「保険料の額は調整の対象とされていない」。",src:"法16条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問19",opt:"D",q:"積立金の運用は、積立金が国民年金の被保険者から徴収された保険料の一部であり、かつ、将来の給付の貴重な財源となるものであることに特に留意し、専ら国民年金の被保険者の利益のために、長期的な観点から、安全かつ効率的に行うことにより、将来にわたって、国民年金事業の運営の安定に資することを目的として行うものとする。",a:true,exp:"本肢のとおりである。",src:"法75条",cat:"択一式（国民年金法）"},
{no:"TAC06-問19",opt:"E",q:"積立金の運用は、厚生労働大臣が、国民年金法第75条の目的に沿った運用に基づく納付金の納付を目的として、年金積立金管理運用独立行政法人に対し、積立金を寄託することにより行うものとする。",a:true,exp:"本肢のとおりである。",src:"法76条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問20",opt:"A",q:"国民年金基金（以下本問において「基金」という。）の加入員は、第2号被保険者又は第3号被保険者となったときは、その日に、加入員の資格を喪失する。",a:true,exp:"本肢のとおりである。",src:"法127条3項1号",cat:"択一式（国民年金法）"},
{no:"TAC06-問20",opt:"B",q:"合併をする基金は、吸収合併契約を締結しなければならず、また、当該吸収合併契約については、代議員会において代議員の定数の3分の2以上の多数により議決しなければならない。",a:true,exp:"本肢のとおりである。",src:"法137条の3第2項ほか",cat:"択一式（国民年金法）"},
{no:"TAC06-問20",opt:"C",q:"基金が支給する一時金は、少なくとも、当該基金の加入員又は加入員であった者が死亡した場合において、その遺族が遺族基礎年金を受けたときには、その遺族に支給されるものでなければならない。",a:false,exp:"基金が支給する一時金は、少なくとも、加入員又は加入員であった者が死亡した場合において、その遺族が「死亡一時金」を受けたときに、その遺族に支給されるものでなければならない（遺族基礎年金ではない。なお一時金の額は8,500円を超えるものでなければならない）。",src:"法129条3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問20",opt:"D",q:"国民年金基金連合会（以下「連合会」という。）は、その会員である基金が解散したときは、当該基金の解散基金加入員に係る国民年金法第95条の2に規定する責任準備金に相当する額を当該解散した基金から徴収し、当該責任準備金に相当する額を徴収した基金に係る解散基金加入員が老齢基礎年金の受給権を取得したときは、当該解散基金加入員に年金を支給するものとする。",a:true,exp:"本肢のとおりである。",src:"法137条の19第1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問20",opt:"E",q:"解散した基金又は連合会が、正当な理由がなくて、国民年金法第95条の2の規定による徴収金を督促状に指定する期限までに納付しないときは、その代表者、代理人又は使用人その他の従業者でその違反行為をした者は、6月以下の拘禁刑又は50万円以下の罰金に処する。",a:true,exp:"本肢のとおりである。",src:"法111条の3第1項",cat:"択一式（国民年金法）"},
{no:"LEC第2回-問1",opt:"A",q:"障害等級2級の障害基礎年金の受給権者が60歳の時に障害の程度が軽快し、厚生年金保険法に規定する障害等級3級にも該当しなくなった場合、その該当しなくなった日から起算して障害等級3級にも該当することなく3年を経過した場合は、当該障害基礎年金の受給権は消滅する。",a:false,exp:"障害基礎年金の受給権は、障害の程度が軽減し、障害等級3級にも該当しなくなった場合であって、そのまま障害等級3級に該当することなく65歳に達したとき又は3年を経過したときのいずれか「遅い方」に達したときに消滅する。本肢の者は障害等級3級に該当しなくなってから3年を経過してもまだ65歳に達していないため、当該3年を経過した時点では障害基礎年金の受給権は「消滅しない」。",src:"法35条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"B",q:"夫の死亡について寡婦年金の支給要件を満たす場合、妻が繰上げ支給の老齢基礎年金の受給権者である場合であっても、妻に寡婦年金の受給権が発生するが、繰上げ支給の老齢基礎年金と寡婦年金は併給できないため、いずれかを選択受給することとなる。",a:false,exp:"夫の死亡当時、妻が繰上げ支給の老齢基礎年金の受給権者である場合、「寡婦年金の受給権は発生しない」。",src:"法附則9条の2の3",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"C",q:"第3号被保険者の資格に係る「主として第2号被保険者の収入により生計を維持すること」の認定は、健康保険法、国家公務員共済組合法、地方公務員等共済組合法及び私立学校教職員共済法における被扶養者の認定の取扱いを勘案して厚生労働大臣が行うものとされている。",a:false,exp:"第3号被保険者の資格に係る「主として第2号被保険者の収入により生計を維持すること」の認定は、健康保険法、国家公務員共済組合法、地方公務員等共済組合法及び私立学校教職員共済法における被扶養者の認定の取扱いを勘案して「日本年金機構」が行うものとされている。",src:"令4条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"D",q:"「保険料4分の3免除期間」とは、第1号被保険者としての被保険者期間であって保険料4分の3免除の規定によりその4分の3の額につき納付することを要しないものとされた保険料に係るもののうち、保険料の追納の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいい、その納付することを要しないものとされた4分の3の額以外の4分の1の額につき納付されていない期間についても保険料4分の3免除期間に該当する。",a:false,exp:"「保険料4分の3免除期間」とは、第1号被保険者としての被保険者期間であって保険料4分の3免除の規定によりその4分の3の額につき納付することを要しないものとされた保険料（「納付することを要しないものとされた4分の3の額以外の4分の1の額につき納付されたものに限る」）に係るもののうち、保険料の追納の規定により納付されたものとみなされる保険料に係る被保険者期間を除いたものを合算した期間をいう。したがって、免除されていない部分である4分の1の額について納付されていない期間については保険料4分の3免除期間に該当しない。",src:"法5条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"E",q:"第1号被保険者としての被保険者期間のみを有する者（所定の期間を有する者を除く。）に支給する老齢基礎年金（所定の規定により支給するものを除く。）を受ける権利に係る裁定の請求の受理及びその請求に係る事実についての審査に関する事務は市町村長（特別区の区長を含む。）が行うものとされている。",a:true,exp:"本肢のとおりである。",src:"令1条の2",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"ア",q:"受給権者が65歳に達していれば、老齢基礎年金と障害厚生年金は併給できる。",a:false,exp:"受給権者の年齢にかかわらず、老齢基礎年金と障害厚生年金は「併給できない」。",src:"法20条1項・法附則9条の2の4",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"イ",q:"配偶者の一方は、被保険者たる他方の保険料を連帯して納付する義務を負うものとされている。",a:true,exp:"本肢のとおりである。",src:"法88条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"ウ",q:"老齢基礎年金の支給繰上げの請求をすることができる者が、老齢厚生年金の支給繰上げの請求をすることもできる場合、これらの請求は必ずしも同時に行う必要はなく、片方の請求のみを行うことも認められる。",a:false,exp:"老齢基礎年金の支給繰上げの請求は、老齢厚生年金の支給繰上げの請求をすることができる者にあっては、当該請求と「同時に行わなければならない」。",src:"法附則9条の2第2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"エ",q:"付加年金は、老齢基礎年金がその全額につき支給を停止されているときは、その間、その支給が停止される。",a:true,exp:"本肢のとおりである。",src:"法47条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"オ",q:"寡婦年金の額は、死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間及び保険料免除期間につき、老齢基礎年金の額を定めた国民年金法第27条の規定の例によって計算した額に相当する額とされている。",a:false,exp:"寡婦年金の額は、死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間及び保険料免除期間につき、老齢基礎年金の額の計算の例によって計算した額の「4分の3」に相当する額とされている。",src:"法50条",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LEC第2回-問3",opt:"正しい記述",context:"夫（40歳）、妻（38歳）、長男（10歳）及び長女（8歳）の4人世帯で第1号被保険者である夫のみに所得がある場合において、夫の前年の所得（1月から6月までの月分の保険料については前々年の所得とする。）が200万円であったときに夫が受けることができる保険料の免除に関する次の記述のうち、正しいものはどれか。なお、妻、長男及び長女は夫の扶養親族等に該当するものとし、このうち妻については所得税法に規定する同一生計配偶者に該当するものとする。その他特に記載のない条件等については考慮する必要はない。",choices:["夫は法定免除の適用を受けることができる。", "夫は申請をすることにより、保険料全額免除の適用を受けることができるが、法定免除の適用を受けることはできない。", "夫は申請をすることにより、保険料4分の3免除の適用を受けることができるが、保険料全額免除の適用を受けることはできない。", "夫は申請をすることにより、保険料半額免除の適用を受けることができるが、保険料4分の3免除の適用を受けることはできない。", "夫は申請をすることにより、保険料4分の1免除の適用を受けることができるが、保険料半額免除の適用を受けることはできない。"],answer:"夫は申請をすることにより、保険料4分の3免除の適用を受けることができるが、保険料全額免除の適用を受けることはできない。",exp:"法定免除は障害基礎年金等の受給権者・生活扶助を受ける者・所定の施設入所者に適用されるもので、所得を理由として適用されるものではないため、本肢の夫は法定免除の適用を受けられない（A誤）。申請による保険料全額免除の所得基準は「（扶養親族等の数＋1）×35万円＋32万円」以下＝(3＋1)×35万円＋32万円＝172万円以下であり、夫の所得200万円はこれを超えるため全額免除は受けられない（B・C前半）。一方、保険料4分の3免除の所得基準は原則「扶養親族等の数×38万円（同一生計配偶者は48万円）＋88万円」以下＝1×48万円＋2×38万円＋88万円＝212万円以下であり、夫の所得200万円は212万円以下のため「保険料4分の3免除」を受けることができる。したがって、申請により保険料4分の3免除の適用を受けられるが全額免除は受けられないとするCが正しい（令6条の8の2ほか）。",src:"令6条の8の2ほか",cat:"選択式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"ア",q:"日本年金機構は、滞納処分等を行う場合には、あらかじめ、財務大臣の承認を受けるとともに、滞納処分等実施規程に従い、徴収職員に行わせなければならない。",a:false,exp:"日本年金機構は、滞納処分等を行う場合には、あらかじめ、「厚生労働大臣の認可」を受けるとともに、滞納処分等実施規程に従い、徴収職員に行わせなければならない。",src:"法109条の6第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"イ",q:"昭和36年4月1日から昭和61年3月31日までの国会議員であった期間（60歳以上であった期間に係るものを除く。）は、老齢基礎年金の支給要件に係る受給資格期間の算定に当たって、合算対象期間に算入される。",a:false,exp:"昭和36年4月1日から「昭和55年」3月31日までの国会議員であった期間（60歳以上であった期間に係るものを除く）は、一定の期間を除き、老齢基礎年金の支給要件に係る受給資格期間の算定に当たって、合算対象期間に算入される。",src:"昭60法附則8条5項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"ウ",q:"障害等級2級の障害基礎年金の受給権者が婚姻をし、配偶者の5歳の子と養子縁組をして生計を維持することとなった場合、当該障害基礎年金に子の加算額は加算されない。",a:false,exp:"障害基礎年金の子の加算額は、受給権取得時点で生計を維持する所定の子を有していることを要件としていないため、障害基礎年金の受給権者がその権利を取得した日の翌日以後にその者によって生計を維持している所定の子を有するに至った場合にも、当該障害基礎年金に子の加算額が「加算される」。",src:"法33条の2第1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"エ",q:"政府は、国民年金事業の円滑な実施を図るため、国民年金に関し、①教育及び広報を行うこと、②被保険者、受給権者その他の関係者（以下本肢において「被保険者等」という。）に対し、相談その他の援助を行うこと及び③被保険者等に対し、被保険者等が行う手続に関する情報その他の被保険者等の利便の向上に資する情報を提供することの事業を行うことができる。",a:true,exp:"本肢のとおりである。",src:"法74条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"オ",q:"年金給付の支給を停止すべき事由が生じた日の属する月において、当該停止すべき事由が消滅した場合、その月の年金給付の支給は停止されない。",a:true,exp:"本肢のとおりである。年金給付は、その支給を停止すべき事由が生じたときは、その事由が生じた日の属する月の翌月からその事由が消滅した日の属する月までの分の支給が停止される。ただし、これらの日が同じ月に属する場合は、支給は停止されない。",src:"法18条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"A",q:"基礎年金拠出金の額の算定基礎となる第1号被保険者数は、保険料納付済期間、保険料4分の1免除期間、保険料半額免除期間又は保険料4分の3免除期間を有する者の総数とされている。",a:true,exp:"本肢のとおりである。",src:"法94条の3第2項・令11条の3",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"B",q:"国民年金基金の加入員である者が法定免除の適用を受けることとなった場合、法定免除の適用により保険料を納付することを要しないものとされた月の末日に加入員の資格を喪失する。",a:false,exp:"国民年金基金の加入員である者が法定免除の適用を受けることとなった場合、法定免除の適用により保険料を納付することを要しないものとされた月の「初日」に加入員の資格を喪失する。",src:"法127条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"C",q:"第1号被保険者が死亡し、当該第1号被保険者と前妻との間の子が遺族基礎年金の受給権を取得したが、その子が前妻（子の母親）と生計を同じくしているために遺族基礎年金の支給が停止された場合、死亡した第1号被保険者と生計を同じくしていた当該第1号被保険者の現在の妻（生計を同じくしている子はいないものとする。）は、死亡一時金を受けることができる。",a:true,exp:"本肢のとおりである。",src:"法52条の2第3項・法52条の3第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"D",q:"厚生労働大臣は、毎月、住民基本台帳法第30条の9の規定による老齢基礎年金の受給権者に係る機構保存本人確認情報の提供を受け、必要な事項について確認を行うものとされている。",a:true,exp:"本肢のとおりである。なお、厚生労働大臣は、本肢の規定により機構保存本人確認情報の提供を受けるために必要と認める場合は、老齢基礎年金の受給権者に対し、当該受給権者に係る個人番号の報告を求めることができる。",src:"則18条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"E",q:"国民年金基金の代議員会の議事は、出席した代議員の過半数で決し、可否同数のときは議長が決するのが原則であるが、規約の変更（国民年金基金令第5条各号に掲げる事項に係るものを除く。）の議事は、代議員の定数の3分の2以上の多数で決する。",a:true,exp:"本肢のとおりである。",src:"基金令12条1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"A",q:"死亡一時金の支給を受ける者が、同一の死亡について寡婦年金を受けることができるときは、その者の選択により、死亡一時金と寡婦年金とのうち、その一が支給され、他は支給されない。",a:true,exp:"本肢のとおりである。",src:"法52条の6",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"B",q:"国民年金基金が支給する年金及び一時金を受ける権利は、譲り渡し、担保に供し、又は差し押えることができない。ただし、国民年金基金が支給する年金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押える場合は、この限りでない。",a:true,exp:"本肢のとおりである。なお、租税その他の公課は、国民年金基金が支給する一時金として支給を受けた金銭を標準として課することができない。",src:"法24条・法133条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"C",q:"第3号被保険者がその配偶者である第2号被保険者と離婚したことにより生計維持関係がなくなったために第1号被保険者へと被保険者の種別が変更された場合、当該第3号被保険者であった者は、種別変更の届出を行わなければならないほか、第2号被保険者の被扶養配偶者でなくなったことの届出も行わなければならない。",a:true,exp:"本肢のとおりである。",src:"則6条の2第1項・則6条の2の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"D",q:"付加保険料を納付する旨の申出をしている者が国民年金法第88条の2の産前産後期間中の保険料免除の適用を受ける場合、その適用を受ける期間については付加保険料を納付することはできない。",a:false,exp:"産前産後期間中の保険料免除の適用を受ける期間についても付加保険料を納付することが「できる」。",src:"法87条の2第1項ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"E",q:"第2号被保険者のうち第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者であるものの氏名、資格の取得及び喪失、種別の変更、保険料の納付状況、基礎年金番号その他厚生労働省令で定める事項については、当分の間、国民年金原簿に記録するものとされていない。",a:true,exp:"本肢のとおりである。",src:"法14条・法附則7条の5第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"A",q:"年金給付を受ける権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、当該日の属する月の翌月以後に到来する当該年金給付の支給に係る国民年金法第18条第3項本文に規定する支払期月の翌月の初日から2年を経過したときは、時効によって消滅する。",a:false,exp:"年金給付を受ける権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利は、当該日の属する月の翌月以後に到来する当該年金給付の支給に係る支払期月の翌月の初日から「5年」を経過したときは、時効によって消滅する。",src:"法102条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"B",q:"国民年金原簿の訂正請求に係る国民年金原簿の訂正をしない旨の決定に不服がある者は、社会保険審査官に対して審査請求をすることができる。",a:false,exp:"国民年金原簿の訂正請求に係る国民年金原簿の訂正をする旨及びしない旨の決定については、社会保険審査官に対して審査請求をすることが「できない」。",src:"法101条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"C",q:"遺族基礎年金は、当該被保険者又は被保険者であった者の死亡について、労災保険法の規定による遺族補償年金が支給されるべきものであるときは、死亡日から6年間、その支給が停止される。",a:false,exp:"遺族基礎年金は、当該被保険者又は被保険者であった者の死亡について、「労働基準法の規定による遺族補償」が行われるべきものであるときは、死亡日から6年間、その支給が停止される。本肢の場合、遺族基礎年金の支給は停止されず、遺族補償年金が減額されて支給される。",src:"法41条1項ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"D",q:"65歳未満の任意加入被保険者について、保険料納付済期間の月数が480月に達したときは、その日に被保険者の資格を喪失する。なお、本肢の者は保険料の免除を受けたことはないものとする。",a:true,exp:"本肢のとおりである。",src:"法附則5条5項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"E",q:"被保険者が登山中に滑落して行方不明となり、その者の生死が3箇月間分からない場合、その死亡を支給事由とする給付の支給に関する規定の適用については、その者が行方不明となった日に、その者は死亡したものと推定される。",a:false,exp:"死亡推定の規定は、被保険者が船舶の航行中に行方不明となった場合や航空機の航行中に行方不明となった場合等に適用されるものであるため、登山中に行方不明となった本肢のような場合については「死亡推定の規定は適用されない」。",src:"法18条の3",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"A",q:"震災、風水害、火災その他これらに類する災害により、自己又は所得税法に規定する同一生計配偶者若しくは扶養親族の所有に係る住宅、家財又は政令で定めるその他の財産につき被害金額（保険金、損害賠償金等により補充された金額を除く。）がその価格のおおむね2分の1以上である損害を受けた者がある場合、原則として、その損害を受けた月から翌年の9月までの20歳前傷病による障害基礎年金については、その損害を受けた年の前年又は前々年における当該被災者の所得を理由とする支給停止は行われない。",a:true,exp:"本肢のとおりである。",src:"法36条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"B",q:"国民年金法第88条の2の規定による産前産後期間の保険料免除を受けたことにより、保険料の過誤納金が生じた場合において、当該被保険者が納付する義務を負う保険料に係る未納期間があるときは、国民年金法第95条の規定によりその例によるものとされる国税通則法第57条の規定に基づき、過誤納金の還付に代えて、当該未納期間に係る保険料に充当される。",a:true,exp:"本肢のとおりである。",src:"平30.12.6年管管発1206第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"C",q:"被保険者は、厚生労働大臣に対し、指定代理納付者から付与される番号、記号その他の符号を通知することにより、当該指定代理納付者をして当該被保険者の保険料を立て替えて納付させることを希望する旨の申出をすることができ、厚生労働大臣は、当該申出を受けたときは、その納付が確実と認められ、かつ、その申出を承認することが保険料の徴収上有利と認められるときに限り、その申出を承認することができる。",a:true,exp:"本肢のとおりである。",src:"法92条の2の2第1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"D",q:"令和6年4月1日に第3号被保険者の資格を取得し、引き続き第3号被保険者である者の資格取得の届出が令和8年8月23日に行われた。この場合、令和6年7月以後の各月が保険料納付済期間に算入される。なお、届出を遅滞したことにつきやむを得ない事由はないものとする。",a:true,exp:"本肢のとおりである。第3号被保険者に該当しなかった者が第3号被保険者となったことに関する届出が行われた日の属する月前の当該届出に係る第3号被保険者としての被保険者期間（当該届出が行われた日の属する月の前々月までの2年間のうちにあるものを除く）は、保険料納付済期間に算入されない。本肢の場合、令和6年4月から同年6月までは、届出が行われた日の属する月の前々月までの2年間のうちにないため、保険料納付済期間に算入されない。",src:"法附則7条の3第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"E",q:"付加保険料を納付する旨の申出をしている者が令和8年5月1日に国民年金基金の加入員となった場合、付加保険料は同年4月分まで納付することができる。なお、この者は国民年金基金の加入員となった時点で令和8年3月分までの付加保険料を既に納付しており、前納された付加保険料はない。",a:false,exp:"付加保険料を納付する者となったものが、国民年金基金の加入員となったときは、その加入員となった日に、付加保険料を納付する者でなくなる旨の申出をしたものとみなされる。本肢の者は令和8年5月1日に国民年金基金の加入員となっているため、同年4月以後の各月に係る保険料につき付加保険料を納付する者でなくなる。したがって、付加保険料は「令和8年3月分」まで納付することができる。",src:"法87条の2第3項・4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"ア",q:"脱退一時金の額は、基準月の属する年度における保険料の額に2分の1を乗じて得た額に保険料納付済期間等の月数を乗じて得た額である。",a:false,exp:"脱退一時金の額は、基準月の属する年度における保険料の額に2分の1を乗じて得た額に「保険料納付済期間等の月数に応じて政令で定める数」を乗じて得た額である。",src:"法附則9条の3の2第3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"イ",q:"老齢基礎年金の受給権者の属する世帯の世帯主その他その世帯に属する者は、当該受給権者の所在が1月以上明らかでないときは、原則として、速やかに、受給権者の所在不明となった年月日その他一定の事項を記載した届書を日本年金機構に提出しなければならない。",a:true,exp:"本肢のとおりである。",src:"則23条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"ウ",q:"振替加算が加算されている老齢基礎年金の受給権者が、夫と離婚し、厚生年金保険法第78条の2の規定によるいわゆる合意分割に係る標準報酬改定請求を行ったことにより、その計算の基礎となる被保険者期間がすべて離婚時みなし被保険者期間である老齢厚生年金の受給権を取得した場合、当該被保険者期間の月数が240以上である場合であっても、当該老齢基礎年金には引き続き振替加算が加算される。",a:false,exp:"老齢基礎年金の受給権者が、老齢厚生年金、退職共済年金その他の老齢又は退職を支給事由とする給付であって政令で定めるものを受けることができるときは、当該老齢基礎年金に振替加算は加算されない。この「老齢又は退職を支給事由とする給付であって政令で定めるもの」には、老齢厚生年金であって、その額の計算の基礎となる被保険者期間の月数が240以上であるものが含まれており、当該被保険者期間からは、離婚時みなし被保険者期間及び被扶養配偶者みなし被保険者期間は除かれていない。したがって、本肢の老齢基礎年金には「振替加算は加算されなくなる」。",src:"昭60法附則14条1項・経過措置政令25条ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"エ",q:"日本国内に住所を有する60歳以上65歳未満の任意加入被保険者が保険料を滞納し、その後、保険料を納付することなく2年間が経過したときは、その日の翌日に被保険者の資格を喪失する。",a:false,exp:"日本国内に住所を有する60歳以上65歳未満の任意加入被保険者が保険料を滞納し、「督促の規定による指定の期限までに、その保険料を納付しないとき」は、その日の翌日に被保険者の資格を喪失する。",src:"法附則5条7項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"オ",q:"年金給付の受給権者が、正当な理由がなくて、国民年金法第107条第1項の受給権者に関する調査の規定による命令に従わず、又は同項の規定による当該職員の質問に応じなかった場合においては、その年金給付の額の全部又は一部につき、その支給を停止することができる。",a:true,exp:"本肢のとおりである。",src:"法72条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"A",q:"厚生労働大臣は、国民年金法第108条の3第1項の規定による被保険者若しくは被保険者であった者又は受給権者に係る保険料の納付に関する実態その他の厚生労働省令で定める事項に関する統計調査に関し必要があると認めるときは、官公署に対し、必要な情報の提供を求めることができるが、当該情報の提供を求めるに当たっては、被調査者を識別することができない方法による情報の提供を求めるものとされている。",a:true,exp:"本肢のとおりである。",src:"法108条の3第2項・3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"B",q:"外国人である第1号被保険者が日本国内に住所を有しなくなったときの資格喪失日は、原則として、出国の日とされている。",a:false,exp:"外国人である第1号被保険者が日本国内に住所を有しなくなったときの資格喪失日は、原則として、出国の日の「翌日」とされている。",src:"法9条・平24.6.14年管管発0614第2号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"C",q:"老齢基礎年金の受給権者が死亡し、その死亡した者に支給すべき老齢基礎年金でまだその者に支給しなかったものがある場合において、その死亡の当時その者と生計を同じくしていた者が姉と叔母であったときは、叔母が、自己の名で、その未支給の老齢基礎年金の支給を請求することができる。",a:false,exp:"未支給年金を受けるべき者の順位は、死亡した者の配偶者、子、父母、孫、祖父母、兄弟姉妹及びこれらの者以外の3親等内の親族の順序とされる。叔母は「これらの者以外の3親等内の親族」に該当するため、本肢の場合、「姉」が、自己の名で、その未支給の老齢基礎年金の支給を請求することができる。",src:"法19条1項・4項・令4条の3の2",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"D",q:"老齢基礎年金の受給権者が、厚生労働大臣に対し、国民年金法その他の政令で定める法令の規定に基づいて行われるべき事務の処理が行われなかったことにより保険料全額免除の申請をすることができなかった旨の申出をした場合において、その申出が承認され、かつ、当該申出に係る期間（学生納付特例の期間及び保険料納付猶予に係る期間を除く。）が特定全額免除期間とみなされたときは、当該申出のあった日の属する月から老齢基礎年金の額が改定される。",a:false,exp:"本肢の場合、当該申出のあった日の属する月の「翌月」から老齢基礎年金の額が改定される。",src:"法附則9条の4の7第7項・令14条の16ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"E",q:"日本の国籍を有しない者であって、出入国管理及び難民認定法第7条第1項第2号の規定に基づく同法別表第1の5の表の下欄に掲げる活動として法務大臣が定める活動のうち、本邦に相当期間滞在して、病院若しくは診療所に入院し疾病若しくは傷害について医療を受ける活動又は当該入院の前後に当該疾病若しくは傷害について継続して医療を受ける活動を行うもの及びこれらの活動を行う者の日常生活上の世話をする活動を行うものである20歳以上60歳未満のもののうち、日本国内に住所を有するものは、第1号被保険者に該当する。",a:false,exp:"日本国内に住所を有する20歳以上60歳未満の者であって第2号被保険者及び第3号被保険者のいずれにも該当しないもの（厚生年金保険法に基づく老齢給付等を受けることができる者その他「国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く」）は、第1号被保険者に該当する。本肢の者は、国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者に該当するため、「第1号被保険者とならない」。",src:"法7条1項1号・則1条の2",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問5",opt:"空欄A",context:"国民年金は、国民年金法第1条の目的を達成するため、【A】に関して必要な給付を行うものとする。",choices:["国民の老齢、障害又は死亡", "国民の加齢に伴って生ずる心身の変化に起因する疾病等", "被保険者の業務災害以外の疾病、負傷又は死亡", "被保険者の疾病、負傷又は死亡"],answer:"国民の老齢、障害又は死亡",exp:"国民年金は、国民年金法第1条の目的を達成するため、「国民の老齢、障害又は死亡」に関して必要な給付を行うものとする。",src:"法2条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問5",opt:"空欄B",context:"国民年金事業は、【B】が、管掌する。",choices:["政府", "市町村（特別区を含む。）", "都道府県", "日本年金機構"],answer:"政府",exp:"国民年金事業は、「政府」が、管掌する。",src:"法3条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問5",opt:"空欄C",context:"国民年金事業の財政は、【C】その均衡が保たれたものでなければならず、著しくその均衡を失すると見込まれる場合には、速やかに所要の措置が講ぜられなければならない。",choices:["長期的に", "おおむね10年間にわたり", "おおむね50年間にわたり", "おおむね100年間にわたり"],answer:"長期的に",exp:"国民年金事業の財政は、「長期的に」その均衡が保たれたものでなければならない。",src:"法4条の2第1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問5",opt:"空欄D",context:"国民年金事業の財政は、長期的にその均衡が保たれたものでなければならず、著しくその均衡を失すると見込まれる場合には、【D】所要の措置が講ぜられなければならない。",choices:["速やかに", "国民の理解及び信頼を得た上で", "直ちに", "遅滞なく"],answer:"速やかに",exp:"著しくその均衡を失すると見込まれる場合には、「速やかに」所要の措置が講ぜられなければならない。",src:"法4条の2第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問5",opt:"空欄E",context:"政府は、【E】、保険料及び国庫負担の額並びに国民年金法による給付に要する費用の額その他の国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通しを作成しなければならない。",choices:["少なくとも5年ごとに", "おおむね6年ごとに", "少なくとも3年ごとに", "毎年"],answer:"少なくとも5年ごとに",exp:"政府は、「少なくとも5年ごとに」、国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通し（財政の現況及び見通し）を作成しなければならない。",src:"法4条の3第1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄A",context:"老齢基礎年金は、保険料納付済期間又は保険料免除期間（国民年金法第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者が【A】に達したときに、その者に支給する。ただし、その者の保険料納付済期間、保険料免除期間を合算した期間が10年に満たないときは、この限りでない。",choices:["65歳", "60歳", "66歳", "70歳"],answer:"65歳",exp:"老齢基礎年金は、所定の期間を有する者が「65歳」に達したときに、その者に支給する。",src:"法26条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄B",context:"老齢基礎年金は、保険料納付済期間又は保険料免除期間（国民年金法第90条の3第1項の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者が65歳に達したときに、その者に支給する。ただし、その者の保険料納付済期間、保険料免除期間を合算した期間が【B】に満たないときは、この限りでない。",choices:["10年", "15年", "20年", "25年"],answer:"10年",exp:"その者の保険料納付済期間、保険料免除期間を合算した期間が「10年」に満たないときは、この限りでない。",src:"法26条ただし書",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄C",context:"障害基礎年金は、その受給権者が当該傷病による障害について、労働基準法の規定による障害補償を受けることができるときは、【C】年間、その支給を停止する。",choices:["6", "2", "3", "5"],answer:"6",exp:"障害基礎年金は、その受給権者が当該傷病による障害について、労働基準法の規定による障害補償を受けることができるときは、「6」年間、その支給を停止する。",src:"法36条の2第1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄D",context:"付加年金は、国民年金法第87条の2第1項の規定による保険料に係る【D】の受給権を取得したときに、その者に支給する。",choices:["保険料納付済期間を有する者が老齢基礎年金", "保険料納付済期間、保険料免除期間又は合算対象期間を有する者が老齢基礎年金", "保険料納付済期間、保険料免除期間又は合算対象期間を有する者が老齢基礎年金又は障害基礎年金", "保険料納付済期間を有する者が老齢基礎年金又は障害基礎年金"],answer:"保険料納付済期間を有する者が老齢基礎年金",exp:"付加年金は、第87条の2第1項の規定による保険料に係る「保険料納付済期間を有する者が老齢基礎年金」の受給権を取得したときに、その者に支給する。",src:"法43条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄E",context:"付加年金の支給は、その受給権者が国民年金法第28条第1項に規定する老齢基礎年金の支給繰下げの申出を行ったときは、同法第18条第1項の規定にかかわらず、当該申出のあった【E】から始めるものとする。",choices:["日の属する月の翌月", "日の属する月", "日の翌日の属する月", "日の翌日の属する月の翌月"],answer:"日の属する月の翌月",exp:"付加年金の支給は、老齢基礎年金の支給繰下げの申出を行ったときは、当該申出のあった「日の属する月の翌月」から始めるものとする。",src:"法46条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問7",opt:"空欄A",context:"地域型基金を設立するには、加入員たる資格を有する者及び【A】が任命した者が設立委員とならなければならない。",choices:["年金に関する学識経験を有する者のうちから厚生労働大臣", "公益を代表する者のうちから都道府県知事", "厚生労働省の職員から厚生労働大臣", "社会保障に関する学識経験を有する者のうちから都道府県知事"],answer:"年金に関する学識経験を有する者のうちから厚生労働大臣",exp:"地域型基金を設立するには、加入員たる資格を有する者及び「年金に関する学識経験を有する者のうちから厚生労働大臣」が任命した者が設立委員とならなければならない。",src:"法119条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問7",opt:"空欄B",context:"職能型基金を設立するには、その加入員となろうとする【B】の者が発起人とならなければならず、当該職能型基金は、3,000人以上の加入員がなければ設立することができない。",choices:["15人以上", "6人以上", "9人以上", "30人以上"],answer:"15人以上",exp:"職能型基金を設立するには、その加入員となろうとする「15人以上」の者が発起人とならなければならない。",src:"法119条の2",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問7",opt:"空欄C",context:"職能型基金を設立するには、その加入員となろうとする15人以上の者が発起人とならなければならず、当該職能型基金は、【C】以上の加入員がなければ設立することができない。",choices:["3,000人", "100人", "300人", "700人"],answer:"3,000人",exp:"職能型基金は、「3,000人」以上の加入員がなければ設立することができない。",src:"法119条の2",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問7",opt:"空欄D",context:"老齢基礎年金の受給権者に対し基金が支給する年金は、【D】場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、200円に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。",choices:["当該老齢基礎年金がその全額につき支給を停止されている", "当該受給権者が一定の金額以上の収入を得ている", "当該受給権者が死亡した", "当該老齢基礎年金がその全額又は一部につき支給を停止されている"],answer:"当該老齢基礎年金がその全額につき支給を停止されている",exp:"基金が支給する年金は、「当該老齢基礎年金がその全額につき支給を停止されている」場合を除いては、その支給を停止することができない。",src:"法129条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問7",opt:"空欄E",context:"老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金がその全額につき支給を停止されている場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、【E】に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。",choices:["200円", "100円", "300円", "400円"],answer:"200円",exp:"当該年金の額のうち、「200円」に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。",src:"法129条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問8",opt:"空欄A",context:"被保険者は、出産の予定日（厚生労働省令で定める場合にあっては、出産の日）の属する月（以下本問において「出産予定月」という。）の前月（多胎妊娠の場合においては、【A】）から出産予定月の翌々月までの期間に係る保険料は、納付することを要しない。",choices:["3月前", "4月前", "6月前", "前々月"],answer:"3月前",exp:"多胎妊娠の場合においては、出産予定月の前月ではなく「3月前」から産前産後期間の保険料免除が適用される。",src:"法88条の2",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問8",opt:"空欄B",context:"被保険者は、出産の予定日（厚生労働省令で定める場合にあっては、出産の日）の属する月（以下本問において「出産予定月」という。）の前月（多胎妊娠の場合においては、3月前）から【B】までの期間に係る保険料は、納付することを要しない。",choices:["出産予定月の翌々月", "出産予定月の翌月", "出産した日の属する月の翌月", "出産した日から起算して3月を経過する日の属する月"],answer:"出産予定月の翌々月",exp:"産前産後期間の保険料免除は、出産予定月の前月（多胎妊娠は3月前）から「出産予定月の翌々月」までの期間に係る保険料が対象となる。",src:"法88条の2",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問8",opt:"空欄C",context:"国民年金法第27条の4第1項の規定によると、調整期間における改定率の改定については、名目手取り賃金変動率に、調整率に当該年度の【C】を乗じて得た率を乗じて得た率（当該率が1を下回るときは、1）を基準とするものとされている。",choices:["前年度の特別調整率", "前年度の物価調整率", "特別調整率", "物価調整率"],answer:"前年度の特別調整率",exp:"調整期間における改定率の改定については、名目手取り賃金変動率に、調整率に当該年度の「前年度の特別調整率」を乗じて得た率を乗じて得た率（当該率が1を下回るときは、1）を基準とする。",src:"法27条の4第1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問8",opt:"空欄D",context:"保険料を前納する際の前納すべき額を計算するときの当該期間の各月の保険料の額から控除する額は、前納に係る期間の各月の保険料の合計額から、その期間の各月の保険料の額を【D】の利率による複利現価法によって前納に係る期間の最初の月から当該各月（国民年金法第92条の2に定める方法により納付する場合にあっては、当該各月の翌月）までのそれぞれの期間に応じて割り引いた額の合計額（この額に10円未満の端数がある場合において、その端数金額が5円未満であるときは、これを切り捨て、その端数金額が5円以上であるときは、これを10円として計算する。）を控除した額である。",choices:["年4分", "年3分", "年5分", "年6分"],answer:"年4分",exp:"前納の際に控除する額の計算は、各月の保険料の額を「年4分」の利率による複利現価法によって割り引いた額の合計額（10円未満四捨五入）を控除した額である。",src:"令8条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問8",opt:"空欄E",context:"前納された保険料について保険料納付済期間又は保険料4分の3免除期間、保険料半額免除期間若しくは保険料4分の1免除期間を計算する場合においては、【E】に、それぞれその月の保険料が納付されたものとみなす。",choices:["前納に係る期間の各月が経過した際", "前納に係る期間の各月の初日が到来した際", "前納に係る期間の各月の末日が到来した際", "保険料を前納した日"],answer:"前納に係る期間の各月が経過した際",exp:"前納された保険料について各期間を計算する場合においては、「前納に係る期間の各月が経過した際」に、それぞれその月の保険料が納付されたものとみなす。",src:"令8条1項",cat:"選択式（LEC公開模試）"},
{no:"TAC06-問1",opt:"ア",q:"【次の資格喪失事由について、被保険者の資格喪失の時期がその事由に該当するに至った「その日」であるものとして正しいか】被保険者が死亡したとき。",a:false,exp:"被保険者が死亡したときは、その日の翌日に被保険者の資格を喪失する。「その日」ではないため誤り。",src:"法9条1号、法附則5条5項他",cat:"択一式（国民年金法）"},
{no:"TAC06-問1",opt:"イ",q:"【次の資格喪失事由について、被保険者の資格喪失の時期がその事由に該当するに至った「その日」であるものとして正しいか】第2号被保険者が厚生年金保険の被保険者の資格を喪失したとき（国民年金法第7条第1項各号のいずれかに該当するときを除く。）。",a:true,exp:"第2号被保険者が厚生年金保険の被保険者の資格を喪失したとき（法7条1項各号該当を除く）は、その日に資格を喪失する。",src:"法9条5号",cat:"択一式（国民年金法）"},
{no:"TAC06-問1",opt:"ウ",q:"【次の資格喪失事由について、被保険者の資格喪失の時期がその事由に該当するに至った「その日」であるものとして正しいか】日本国内に住所を有する60歳以上65歳未満の任意加入被保険者が、保険料を滞納し、国民年金法第96条第1項の規定による指定の期限までに、その保険料を納付しないとき。",a:false,exp:"国内に住所を有する60歳以上65歳未満の任意加入被保険者が保険料を滞納し指定期限までに納付しないときは、その日の翌日に資格を喪失する。",src:"法附則5条7項",cat:"択一式（国民年金法）"},
{no:"TAC06-問1",opt:"エ",q:"【次の資格喪失事由について、被保険者の資格喪失の時期がその事由に該当するに至った「その日」であるものとして正しいか】日本国籍を有する者であって、日本国内に住所を有しない20歳以上65歳未満の任意加入被保険者が保険料を滞納し、その後、保険料を納付することなく2年間が経過したとき。",a:false,exp:"日本国籍を有し国外に住所を有する任意加入被保険者が保険料を滞納し、納付なく2年経過したときは、その日の翌日に資格を喪失する。",src:"法附則5条8項4号",cat:"択一式（国民年金法）"},
{no:"TAC06-問1",opt:"オ",q:"【次の資格喪失事由について、被保険者の資格喪失の時期がその事由に該当するに至った「その日」であるものとして正しいか】任意加入被保険者が厚生労働大臣に資格喪失の申出を行い、その申出が受理されたとき。",a:true,exp:"任意加入被保険者が厚生労働大臣に資格喪失の申出を行い受理されたときは、その日に資格を喪失する。",src:"法附則5条5項3号他",cat:"択一式（国民年金法）"},
{no:"TAC06-問2",opt:"A",q:"被保険者の兄弟姉妹は、その被保険者の保険料を連帯して納付する義務を負う。",a:false,exp:"兄弟姉妹に連帯納付義務はない。連帯納付義務を負うのは世帯主（その世帯の被保険者の保険料）と配偶者の一方（被保険者たる他方の保険料）。",src:"法88条2項・3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問2",opt:"B",q:"令和8年度に属する月の月分の保険料の額は、保険料改定率が1.054とされたことから、17,900円とされた。",a:false,exp:"令和8年度の保険料額は17,000円に保険料改定率1.054を乗じ端数処理した17,920円。17,900円ではない。",src:"法87条3項、改定率改定令2条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問2",opt:"C",q:"令和7年4月から令和8年3月までの期間について付加保険料を前納していた者が、令和8年2月27日に国民年金基金の加入員となった場合、令和8年3月までは引き続き付加保険料を納付する者とされ、4月以後の各月について、付加保険料を納付する者でなくなる。",a:false,exp:"国民年金基金の加入員となった日に付加保険料を納付する者でなくなる申出をしたものとみなされ、その日の属する月（令和8年2月）以後の各月について納付者でなくなる。「4月以後」ではない。",src:"法87条の2第2項・3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問2",opt:"D",q:"第1号被保険者（産前産後期間の保険料免除及び保険料の一部免除の規定の適用を受ける被保険者を除く。）が生活保護法による医療扶助を受けるに至ったときは、その日の属する月の前月からこれに該当しなくなる日の属する月までの期間に係る保険料は、既に納付されたものを除き、納付することを要しない。",a:false,exp:"法定免除の対象は生活扶助等であり、生活保護法の医療扶助は法定免除の対象とされない。設問の医療扶助では納付を要しないとはならない。",src:"法89条1項2号、則74条1号",cat:"択一式（国民年金法）"},
{no:"TAC06-問2",opt:"E",q:"令和8年4月1日に60歳に達した甲は、平成28年3月から令和8年3月までの期間を保険料全額免除期間として有していた。甲が追納の申込みをし、令和8年4月中にその承認を受けた場合、平成28年4月から令和8年3月までの保険料全額免除期間について、その免除された保険料の全部又は一部につき納付することができる。",a:true,exp:"全額免除等の保険料のうち、厚生労働大臣の承認の日の属する月前10年以内の期間に係るものに限り追納できる。設問のとおり。",src:"法94条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問3",opt:"A",q:"甲（昭和35年4月10日生まれとし、厚生年金保険の被保険者であったことがないものとする。）が65歳に達して老齢基礎年金の受給権を取得した日後に、その者の配偶者である乙（昭和47年4月4日生まれとする。）が、国民年金の第2号被保険者である時に初診日がある傷病により、障害認定日において障害等級2級に該当する障害状態に該当し、障害厚生年金の受給権を取得した。乙が当該障害厚生年金の受給権を取得した当時甲が乙によって生計を維持していたときは、甲に対する老齢基礎年金の額は、振替加算額を加算した額とし、その翌月から、当該老齢基礎年金の額を改定する。",a:true,exp:"配偶者（乙）が障害厚生年金の受給権を取得した当時、老齢基礎年金受給権者（甲）が乙に生計を維持されていたときは、甲の老齢基礎年金に振替加算額を加算し、その翌月から額を改定する。",src:"(60)法附則14条2項・4項",cat:"択一式（国民年金法）"},
{no:"TAC06-問3",opt:"B",q:"60歳に達した日において、保険料納付済期間、保険料免除期間及び合算対象期間を合算した期間を7年有する者が、同日に任意加入被保険者の資格を取得し、引き続き滞納することなく保険料を納付していた。その後、保険料納付済期間、保険料免除期間及び合算対象期間を合算した期間を10年有するに至ったため、63歳の時に老齢基礎年金の支給繰上げの請求をした。この場合、その請求をした日に繰上げ支給の老齢基礎年金の受給権を取得し、その翌日に、任意加入被保険者の資格を喪失する。",a:false,exp:"任意加入被保険者である者は、老齢基礎年金の支給繰上げの請求をすることができない。",src:"法附則9条の2第1項カッコ書",cat:"択一式（国民年金法）"},
{no:"TAC06-問3",opt:"C",q:"65歳に達した日に老齢基礎年金の受給権を取得した丙（昭和30年4月2日生まれ。生計を同じくする丙の妻である丁がいるものとする。）は、75歳に達したときに当該老齢基礎年金の支給繰下げの申出をする予定であったが、当該老齢基礎年金の請求及び繰下げの申出をしないまま71歳の時に死亡した。丁が丙の死亡に係る未支給の老齢基礎年金を請求した場合、いわゆる特例的な繰下げみなし増額の規定が適用され、丁が受けることができる未支給の老齢基礎年金の額は、繰下げによる加算額を加算した額とされる。なお、丙は、老齢基礎年金以外の年金たる給付の受給権を取得したことはないものとする。",a:false,exp:"繰下げ待機中に請求せず70歳到達後に死亡し遺族が未支給年金を請求するときは、特例的な繰下げみなし増額は適用されず、支分権が時効消滅していない過去5年分に限り（増額なしで）支給される。",src:"法19条1項・3項、法28条5項、令5.3.20年管管発0320第1号",cat:"択一式（国民年金法）"},
{no:"TAC06-問3",opt:"D",q:"老齢基礎年金の受給権を取得した当時その者によって生計を維持していたその者の子（18歳に達する日以後の最初の3月31日までの間にある子及び20歳未満で障害等級の1級若しくは2級に該当する障害の状態にある子に限る。）があるときは、その者の保険料納付済期間が25年以上である場合に限り、国民年金法第27条に定める額に、当該子に係る加算額を加算する。",a:false,exp:"老齢基礎年金には振替加算額の規定はあるが、子に係る加算額を加算する規定はない。",src:"規定なし",cat:"択一式（国民年金法）"},
{no:"TAC06-問3",opt:"E",q:"老齢基礎年金の受給権者の前年の所得が政令で定める額を超えるときは、その年の10月から翌年の9月まで、その全部又は一部に相当する部分の支給を停止する。",a:false,exp:"老齢基礎年金は、受給権者の所得金額によって支給が停止される規定はない。",src:"規定なし",cat:"択一式（国民年金法）"},
{no:"TAC06-問4",opt:"A",q:"障害等級に該当する程度の障害状態に該当しなくなったことにより支給を停止されている障害基礎年金の受給権者に対して更に障害基礎年金を支給すべき事由が生じたときは、国民年金法第31条第1項の規定により支給する前後の障害を併合した障害の程度による障害基礎年金は、従前の障害基礎年金の支給を停止する期間、その支給を停止するものとし、その間、その者に従前の障害を併合しない障害の程度による障害基礎年金を支給する。",a:false,exp:"法31条1項により支給する前後の障害を併合した障害基礎年金は支給停止されず、従前の障害を併合しない障害基礎年金が支給されることもない。冒頭を「期間を定めて支給停止されている」に置き換えると概ね正しい記述となる。",src:"法31条、法32条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問4",opt:"B",q:"甲は、60歳に達した月に老齢基礎年金の支給繰上げの請求をし、その翌月から繰り上げた老齢基礎年金の支給を受けている。その後、61歳の時に第2号被保険者となったが、その被保険者である期間中の62歳の時に初診日がある疾病により、障害認定日において障害等級に該当する程度の障害の状態にあった。この場合、甲に障害基礎年金が支給される。なお、保険料納付要件は満たしているものとする。",a:true,exp:"繰上げ支給の老齢基礎年金受給権者でも「初診日に被保険者であること」は適用され、甲は初診日に第2号被保険者で納付要件等も満たすため、障害認定日に障害基礎年金の受給権を取得する。",src:"法30条、法附則9条の2の3",cat:"択一式（国民年金法）"},
{no:"TAC06-問4",opt:"C",q:"障害基礎年金の受給権者は、加算額対象者である18歳に達する日以後の最初の3月31日までの間にある子が障害等級の1級又は2級に該当する程度の障害の状態に該当するに至ったときは、速やかに、「障害の状態に該当するに至った加算額対象者である子の氏名及び生年月日」、「障害の状態に該当するに至った年月日」等を記載した届書を日本年金機構に提出しなければならない。",a:true,exp:"加算額対象の子が障害等級1級・2級に該当するに至ったときは、速やかに所定事項を記載した届書を日本年金機構に提出しなければならない。",src:"則33条の5第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問4",opt:"D",q:"27歳の第1号被保険者である期間中に交通事故に遭い障害基礎年金の受給権を取得した者が、その後、35歳の時に拘禁刑の執行のため刑事施設に拘置されるに至った場合でも、当該障害基礎年金の支給は停止しない。",a:true,exp:"いわゆる一般的な障害基礎年金は、受給権者が拘禁刑の執行のため刑事施設に拘置されても支給停止されない（20歳前傷病による障害基礎年金は一定の場合に停止）。",src:"法36条の2他",cat:"択一式（国民年金法）"},
{no:"TAC06-問4",opt:"E",q:"障害の程度が障害等級の1級に該当する者に支給する障害基礎年金の額は、障害等級2級に該当する者に支給する障害基礎年金の額（子に係る加算額を除く。）の100分の125に相当する額とする。",a:true,exp:"1級の障害基礎年金の額は、2級の障害基礎年金の額（子に係る加算額を除く）の100分の125に相当する額とする。",src:"法33条2項",cat:"択一式（国民年金法）"},
{no:"TAC06-問5",opt:"ア",q:"夫（第1号被保険者としての被保険者期間に係る保険料納付済期間を30年有していたものとする。）が死亡した当時、夫によって生計を維持していた者は、離婚歴のある妻の甲（52歳）と甲の連れ子の乙（17歳、夫の養子となっていないものとする。）のみであった。この場合、甲と乙は、遺族基礎年金の受給権を取得する。",a:false,exp:"乙は死亡した夫の子ではないため遺族とされず、甲も遺族基礎年金を受けられる子と生計を同じくしていないため遺族とされない。甲・乙とも受給権を取得しない。",src:"法37条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問5",opt:"イ",q:"14歳の時に父の死亡により遺族基礎年金の受給権者となったその者の子が、15歳の時に叔父の養子となったときは、当該子に対する遺族基礎年金の支給は停止する。",a:false,exp:"子が叔父（傍系血族）の養子となったときは受給権が消滅する（失権）。直系血族・直系姻族の養子を除き養子縁組で失権する。「支給停止」ではない。",src:"法40条1項3号",cat:"択一式（国民年金法）"},
{no:"TAC06-問5",opt:"ウ",q:"遺族基礎年金の受給権者である子（障害等級に該当する障害の状態にないものとする。）について、18歳に達した日以後の最初の3月31日が終了したことにより、当該遺族基礎年金の受給権が消滅したときは、国民年金法施行規則第52条第1項に規定する失権に係る届書を提出する必要はない。",a:true,exp:"失権事由が死亡・年齢到達等の場合は失権に係る届書（遺族年金失権届）の提出を要しない。",src:"法40条3項2号、則52条1項カッコ書",cat:"択一式（国民年金法）"},
{no:"TAC06-問5",opt:"エ",q:"子に対する遺族基礎年金は、配偶者が遺族基礎年金の受給権を有するときは、その間、その支給を停止するとされているが、配偶者の所在が1年以上明らかでないことにより、遺族基礎年金の受給権を有する子の申請によって、その所在が明らかでなくなった時に遡って配偶者の遺族基礎年金の支給を停止するときは、子に対する遺族基礎年金の支給は停止しない。",a:true,exp:"子に対する遺族基礎年金は配偶者が受給権を有するとき支給停止されるが、配偶者の所在1年以上不明により子の申請で配偶者分を遡って停止するときは、子に対する支給は停止しない。",src:"法41条2項、法41条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問5",opt:"オ",q:"日本国内に住所を有さず、かつ、被保険者でない61歳の者（学生納付特例期間、納付猶予期間及び合算対象期間を合算した期間のみを25年有するものとする。）が死亡した当時その者によって生計を維持するその者の16歳の子がいた場合であっても、その子は遺族基礎年金の受給権を取得しない。",a:true,exp:"学生納付特例・納付猶予・合算対象期間のみを25年有しても法37条3号の死亡者要件を満たさず、その子は遺族基礎年金の受給権を取得しない。",src:"法37条3号、法附則9条1項、(26)法附則14条3項他",cat:"択一式（国民年金法）"},
{no:"TAC06-問6",opt:"A",q:"付加保険料に係る保険料納付済期間を20年有する者（昭和31年4月2日生まれのものとする。）が、65歳に達したときに老齢基礎年金及び付加年金の受給権を取得した。この者が70歳に達した日に老齢基礎年金の支給繰下げの申出をしたときは、付加年金は、老齢基礎年金と同じ増額率（42%）を用いて増額される。なお、この者は、老齢基礎年金及び付加年金以外の年金たる給付の受給権を取得したことはないものとする。",a:true,exp:"老齢基礎年金・付加年金の繰下げ加算の増額率は共通で、1000分の7に受給権取得月から繰下げ申出月の前月までの月数を乗じた率。70歳繰下げ（60月）で0.7%×60＝42%。付加年金も同率で増額される。",src:"法46条2項、令4条の5",cat:"択一式（国民年金法）"},
{no:"TAC06-問6",opt:"B",q:"死亡日の前日において死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る保険料納付済期間を40年有する夫が、65歳に達して老齢基礎年金の受給権を取得した月に死亡した。夫の死亡当時夫によって生計を維持していた妻は61歳であり、また、夫との婚姻関係は15年継続していた。この場合、妻に寡婦年金は支給されない。なお、夫は障害基礎年金の支給を受けたことはない。",a:false,exp:"夫は老齢基礎年金・障害基礎年金の支給を受けておらず、第1号期間の納付済期間10年以上、妻は65歳未満かつ婚姻10年以上で寡婦年金の支給要件を満たす。妻に寡婦年金は支給される。",src:"法18条1項、法49条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問6",opt:"C",q:"寡婦年金の受給権は、受給権者が繰上げ支給の老齢基礎年金の受給権を取得したときは、消滅する。",a:true,exp:"寡婦年金の受給権は、受給権者が繰上げ支給の老齢基礎年金の受給権を取得したときは消滅する。",src:"法附則9条の2第5項",cat:"択一式（国民年金法）"},
{no:"TAC06-問6",opt:"D",q:"死亡日の属する月の前月までの第1号被保険者としての被保険者期間に係る死亡日の前日における保険料納付済期間の月数が420月以上あり、かつ、付加保険料に係る保険料納付済期間が3年以上である者の遺族に支給する死亡一時金の額は、328,500円である。",a:true,exp:"保険料納付済期間420月以上かつ付加保険料納付済期間3年以上の遺族に支給する死亡一時金は、320,000円に8,500円を加算した328,500円。",src:"法52条の4",cat:"択一式（国民年金法）"},
{no:"TAC06-問6",opt:"E",q:"脱退一時金を受ける権利は、差し押えることができる。",a:true,exp:"設問のとおり正しい。",src:"法24条、法附則9条の3の2第7項、令14条の5",cat:"択一式（国民年金法）"},
{no:"TAC06-問7",opt:"A",q:"未支給の年金を受けるべき同順位者が2人以上あるときは、その支給の請求は、当該同順位者それぞれで行わなければならない。",a:false,exp:"同順位者がそれぞれ請求しなければならない規定はない。2人以上あるときは、その1人がした請求は全員のためその全額につきしたものとみなされる。",src:"法19条5項",cat:"択一式（国民年金法）"},
{no:"TAC06-問7",opt:"B",q:"付加年金の額は、200円に改定率を乗じて得た額に付加保険料に係る保険料納付済期間の月数を乗じて得た額とする。",a:false,exp:"付加年金の額は200円に付加保険料に係る保険料納付済期間の月数を乗じた額。200円に改定率は乗じない。",src:"法44条",cat:"択一式（国民年金法）"},
{no:"TAC06-問7",opt:"C",q:"失踪の宣告を受けたことにより死亡したとみなされた者に係る遺族基礎年金の支給に関する当該死亡したとみなされた者と遺族基礎年金を受けることができる遺族との生計維持関係の認定については、行方不明になった日において行うものとされる。",a:true,exp:"失踪宣告で死亡とみなされた者に係る遺族基礎年金の生計維持関係の認定は、行方不明となった日（当時）を基準に判断する。",src:"法18条の4",cat:"択一式（国民年金法）"},
{no:"TAC06-問7",opt:"D",q:"年金給付（国民年金法の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金給付を除く。）は、その受給権者の申出により、その全部又は2分の1に相当する部分の支給を停止する。ただし、国民年金法の他の規定又は他の法令の規定によりその額の一部につき支給を停止されているときは、停止されていない部分の全部又は2分の1に相当する部分の支給を停止する。",a:false,exp:"申出による支給停止は「全部」であり「2分の1」ではない。一部停止中のときは、停止されていない部分の額の支給を停止する。",src:"法20条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問7",opt:"E",q:"脱退一時金の支給を受けたときは、支給を受けた者は、その額の計算の基礎となった第1号被保険者としての被保険者であった期間は、被保険者でなかったものとみなされるが、その被保険者でなかったものとみなされた期間は、老齢基礎年金の支給要件の特例の適用については、合算対象期間に算入する。",a:false,exp:"脱退一時金の計算基礎となった第1号被保険者期間は被保険者でなかったものとみなされ、その期間は合算対象期間に算入されない。",src:"法附則9条の3の2第4項",cat:"択一式（国民年金法）"},
{no:"TAC06-問8",opt:"A",q:"厚生年金保険の適用事業所に使用される70歳以上の高齢任意加入被保険者は、第2号被保険者とされる。",a:true,exp:"厚生年金保険の高齢任意加入被保険者は老齢給付の受給権を有しない者であり、第2号被保険者とされる。",src:"法7条1項2号、法附則3条他",cat:"択一式（国民年金法）"},
{no:"TAC06-問8",opt:"B",q:"第1号被保険者は、その個人番号を変更したときは、変更前及び変更後の個人番号等を記載した届書を、速やかに、市町村長に提出しなければならない。",a:false,exp:"個人番号変更の届書は、速やかに「日本年金機構」に提出しなければならない。市町村長ではない。",src:"則8条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問8",opt:"C",q:"国民年金法第4条の規定によると、この法律による年金の額及び保険料の額は、国民の生活水準その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、速やかに改定の措置が講ぜられなければならないとされている。",a:false,exp:"法4条の調整（速やかな改定措置）の対象は「年金の額」であり、保険料の額は同条の対象とされていない。",src:"法4条",cat:"択一式（国民年金法）"},
{no:"TAC06-問8",opt:"D",q:"産前産後期間の保険料免除の規定により納付することを要しないものとされた保険料に係る被保険者期間は、老齢基礎年金の支給要件においては保険料納付済期間に算入されるが、死亡一時金及び脱退一時金の支給要件においては保険料納付済期間に算入されない。",a:false,exp:"産前産後免除の保険料に係る被保険者期間は、老齢基礎年金のみならず死亡一時金・脱退一時金の支給要件においても保険料納付済期間に算入される。",src:"法5条1項他",cat:"択一式（国民年金法）"},
{no:"TAC06-問8",opt:"E",q:"保険料その他国民年金法の規定による徴収金に関する処分に不服がある者は、社会保険審査会に対して審査請求をしなければならない。",a:false,exp:"徴収金に関する処分に不服がある者は、まず「社会保険審査官」に審査請求し、その決定に不服があるとき「社会保険審査会」に再審査請求する。",src:"法101条1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問9",opt:"A",q:"国民年金法第10章「国民年金基金及び国民年金基金連合会」に規定する厚生労働大臣の権限のうち国民年金基金（以下「基金」という。）に係るものは、厚生労働省令の定めるところにより、その一部を地方厚生局長に委任することができる。また、これにより地方厚生局長に委任された権限は、厚生労働省令の定めるところにより、地方厚生支局長に委任することができる。",a:true,exp:"基金に係る厚生労働大臣の権限は、その一部を地方厚生局長に委任でき、委任された権限は地方厚生支局長に委任できる。",src:"法142条の2",cat:"択一式（国民年金法）"},
{no:"TAC06-問9",opt:"B",q:"基金の加入員は、国民年金法第89条第1項の法定免除の規定により保険料を納付することを要しないものとされたときは、当該保険料を納付することを要しないものとされた月の翌月の初日に、加入員の資格を喪失する。",a:false,exp:"法定免除により保険料を要しないものとされたときは、その月の「初日」に加入員の資格を喪失する。「翌月の初日」ではない。",src:"法127条3項3号",cat:"択一式（国民年金法）"},
{no:"TAC06-問9",opt:"C",q:"基金が支給する一時金の額は、8,500円を超えるものでなければならない。",a:true,exp:"基金が支給する一時金の額は、8,500円を超えるものでなければならない。",src:"法130条3項",cat:"択一式（国民年金法）"},
{no:"TAC06-問9",opt:"D",q:"基金における中途脱退者とは、当該基金の加入員の資格を喪失した者（当該加入員の資格を喪失した日において当該基金が支給する年金の受給権を有する者を除く。）であって、政令の定めるところにより計算したその者の当該基金の加入員期間が15年に満たないものをいう。",a:true,exp:"中途脱退者とは、加入員資格を喪失した者（喪失日に基金の年金受給権を有する者を除く）で、加入員期間が15年に満たないものをいう。",src:"法137条の17第1項、基金令45条",cat:"択一式（国民年金法）"},
{no:"TAC06-問9",opt:"E",q:"政府は、基金又は国民年金基金連合会（以下「連合会」という。）が解散したときは、その解散した日において当該基金又は連合会が年金の支給に関する義務を負っている者に係る政令の定めるところにより算出した責任準備金に相当する額を当該解散した基金又は連合会から徴収する。ただし、国民年金法第137条の19第1項の規定により連合会が当該解散した基金から徴収すべきときは、この限りでない。",a:true,exp:"政府は、基金・連合会が解散したときは責任準備金相当額を徴収する。ただし連合会が法137条の19第1項により当該解散基金から徴収すべきときはこの限りでない。",src:"法95条の2",cat:"択一式（国民年金法）"},
{no:"TAC06-問10",opt:"A",q:"保険料の納付に関する事務（以下「納付事務」という。）を適正かつ確実に実施することができると認められ、かつ、政令で定める要件に該当する者として厚生労働大臣が指定するものは、被保険者の委託を受けて、納付事務を行うことができる。",a:true,exp:"納付事務を適正かつ確実に実施できると認められ政令要件に該当する者として厚生労働大臣が指定するものは、被保険者の委託を受けて納付事務を行うことができる。",src:"法92条の3第1項2号",cat:"択一式（国民年金法）"},
{no:"TAC06-問10",opt:"B",q:"国民年金法第90条第1項の申請（以下本問において「全額免除申請」という。）に関する事務を適正かつ確実に実施することができると認められる者であって、厚生労働大臣が当該者からの申請に基づき指定するもの（「指定全額免除申請事務取扱者」という。）は、同項各号のいずれかに該当する被保険者又は被保険者であった者（厚生労働省令で定める者に限る。以下本問において「全額免除要件該当被保険者等」という。）の委託を受けて、全額免除要件該当被保険者等に係る全額免除申請をすることができる。",a:true,exp:"指定全額免除申請事務取扱者は、全額免除要件該当被保険者等の委託を受けて全額免除申請をすることができる。",src:"法109条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC06-問10",opt:"C",q:"厚生労働大臣は、保険料納付確認団体がその行うべき業務の処理を怠り、又はその処理が著しく不当であると認めるときは、保険料納付確認団体に対し、その改善に必要な措置を採るべきことを命ずることができ、保険料納付確認団体がその命令に違反したときは、当該保険料納付確認団体の指定を取り消すことができる。",a:true,exp:"厚生労働大臣は、保険料納付確認団体に改善措置を命じることができ、命令に違反したときは指定を取り消すことができる。",src:"法109条の3第4項・5項",cat:"択一式（国民年金法）"},
{no:"TAC06-問10",opt:"D",q:"基礎年金拠出金の額の算定における政府及び実施機関に係る被保険者の総数は、第2号被保険者及び第3号被保険者であるすべての者を基礎として計算するものとする。",a:false,exp:"基礎年金拠出金算定の被保険者総数は、第2号被保険者は「20歳以上60歳未満の者」、第3号被保険者は全ての者を基礎として計算する。第2号の全てではない。",src:"法94条の3第2項、令11条の3",cat:"択一式（国民年金法）"},
{no:"TAC06-問10",opt:"E",q:"厚生労働大臣は、毎年度、被保険者に対し、各年度の各月に係る保険料について、保険料の額、納期限その他厚生労働省令で定める事項を通知するものとする。",a:true,exp:"厚生労働大臣は毎年度、被保険者に対し各年度各月の保険料の額・納期限その他所定事項を通知する。",src:"法92条1項",cat:"択一式（国民年金法）"},
{type:"select",no:"TAC06-選択問8",opt:"空欄A",context:"国民年金法第27条では、「老齢基礎年金の額は、【A】円に改定率（次条第１項の規定により設定し、同条（第１項を除く。）から第27条の５までの規定により改定した率をいう。）を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。ただし、保険料納付済期間の月数が480に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（480を限度とする。）を480で除して得た数を乗じて得た額とする。一　保険料納付済期間の月数　二　保険料４分の１免除期間の月数（480から保険料納付済期間の月数を控除して得た月数を限度とする。）の8分の7に相当する月数　三〜五　〔…（略）…〕　六　保険料４分の３免除期間の月数（480から保険料納付済期間の月数、保険料４分の１免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の8分の5に相当する月数　七、八　〔…（略）…〕」と規定している。",choices:["708,900", "780,900", "790,800", "847,300"],answer:"780,900",exp:"老齢基礎年金の満額算定の基礎となる額は「780,900」円。障害基礎年金（2級）・遺族基礎年金の額とも共通の金額。",src:"法27条、(26)法附則14条1項",cat:"選択式"},
{type:"select",no:"TAC06-選択問8",opt:"空欄B",context:"国民年金法第27条では、「老齢基礎年金の額は、780,900円に改定率（次条第１項の規定により設定し、同条（第１項を除く。）から第27条の５までの規定により改定した率をいう。）を乗じて得た額（その額に【B】ものとする。）とする。ただし、保険料納付済期間の月数が480に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（480を限度とする。）を480で除して得た数を乗じて得た額とする。一　保険料納付済期間の月数　二　保険料４分の１免除期間の月数（480から保険料納付済期間の月数を控除して得た月数を限度とする。）の8分の7に相当する月数　三〜五　〔…（略）…〕　六　保険料４分の３免除期間の月数（480から保険料納付済期間の月数、保険料４分の１免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の8分の5に相当する月数　七、八　〔…（略）…〕」と規定している。",choices:["1円未満の端数が生じたときは、これを切り捨てる", "5円未満の端数が生じたときは、これを切り捨て、5円以上10円未満の端数が生じたときは、これを10円に切り上げる", "50銭未満の端数が生じたときは、これを切り捨て、50銭以上1円未満の端数が生じたときは、これを1円に切り上げる", "50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げる"],answer:"50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げる",exp:"老齢基礎年金の額の端数処理は「50円未満切捨て・50円以上100円未満は100円に切上げ」。給付の通則の1円未満四捨五入と混同しない。",src:"(16)法附則19条2項",cat:"選択式"},
{type:"select",no:"TAC06-選択問8",opt:"空欄C",context:"国民年金法第27条では、「老齢基礎年金の額は、780,900円に改定率（次条第１項の規定により設定し、同条（第１項を除く。）から第27条の５までの規定により改定した率をいう。）を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。ただし、保険料納付済期間の月数が480に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（480を限度とする。）を480で除して得た数を乗じて得た額とする。一　保険料納付済期間の月数　二　保険料４分の１免除期間の月数（480から保険料納付済期間の月数を控除して得た月数を限度とする。）の【C】に相当する月数　三〜五　〔…（略）…〕　六　保険料４分の３免除期間の月数（480から保険料納付済期間の月数、保険料４分の１免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の8分の5に相当する月数　七、八　〔…（略）…〕」と規定している。",choices:["2分の1", "8分の5", "4分の3", "8分の7"],answer:"8分の7",exp:"保険料4分の1免除期間の月数が老齢基礎年金額に反映される割合は「8分の7」（1/2＋1/2×3/4＝7/8）。国庫負担分1/2に保険料負担分3/4×1/2を加味する。",src:"法27条2号",cat:"選択式"},
{type:"select",no:"TAC06-選択問8",opt:"空欄D",context:"国民年金法第27条では、「老齢基礎年金の額は、780,900円に改定率（次条第１項の規定により設定し、同条（第１項を除く。）から第27条の５までの規定により改定した率をいう。）を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とする。ただし、保険料納付済期間の月数が480に満たない者に支給する場合は、当該額に、次の各号に掲げる月数を合算した月数（480を限度とする。）を480で除して得た数を乗じて得た額とする。一　保険料納付済期間の月数　二　保険料４分の１免除期間の月数（480から保険料納付済期間の月数を控除して得た月数を限度とする。）の8分の7に相当する月数　三〜五　〔…（略）…〕　六　保険料４分の３免除期間の月数（480から保険料納付済期間の月数、保険料４分の１免除期間の月数及び保険料半額免除期間の月数を合算した月数を控除して得た月数を限度とする。）の【D】に相当する月数　七、八　〔…（略）…〕」と規定している。",choices:["2分の1", "8分の5", "4分の3", "8分の7"],answer:"8分の5",exp:"保険料4分の3免除期間の月数が老齢基礎年金額に反映される割合は「8分の5」（1/2＋1/2×1/4＝5/8）。国庫負担分1/2に保険料負担分1/4×1/2を加味する。",src:"法27条6号",cat:"選択式"},
{type:"select",no:"TAC06-選択問8",opt:"空欄E",context:"令和７年６月20日に社会経済の変化を踏まえた年金制度の機能強化のための国民年金法等の一部を改正する等の法律が公布され、これにより、50歳未満の第１号被保険者等であって本人及び配偶者の所得の額が一定の額以下であるものに係る国民年金の保険料の免除の特例（納付猶予）が５年間延長され、【E】までとされた。",choices:["令和17年3月", "令和17年6月", "令和18年3月", "令和18年6月"],answer:"令和17年6月",exp:"令和7年6月20日公布の改正法により、50歳未満の第1号被保険者等に係る納付猶予の特例が5年間延長され「令和17年6月」までとされた。",src:"(16)法附則19条・令和7年改正法附則",cat:"選択式"},
{no:"TAC公開-問1",opt:"A",q:"基礎年金拠出金の額の算定に係る被保険者の総数は、第1号被保険者にあっては、保険料納付済期間、保険料4分の1免除期間、保険料半額免除期間、保険料4分の3免除期間又は保険料全額免除期間（学生納付特例又は納付猶予の規定により納付することを要しないものとされた保険料に係るものを除く。）を有する者を基礎として計算するものとする。",a:false,exp:"基礎年金拠出金の算定に係る被保険者の総数は、第1号被保険者にあっては「保険料納付済期間、保険料4分の1免除期間、保険料半額免除期間又は保険料4分の3免除期間」を有する者を基礎とし、「保険料全額免除期間」を有する者は基礎とされない。",src:"法94条の3第2項、令11条の3",cat:"択一式（国民年金法）"},
{no:"TAC公開-問1",opt:"B",q:"日本国内に住所を有する60歳以上65歳未満の者（第2号被保険者及び国民年金法の適用を除外すべき特別の理由がある者として厚生労働省令で定める者を除く。）が、任意加入被保険者に係る資格取得の申出を行おうとする場合には、口座振替納付を希望する旨の申出又は口座振替納付によらない正当な事由がある場合として厚生労働省令で定める場合に該当する旨の申出を厚生労働大臣に対してしなければならない。当該資格取得の申出を行う時点において、預金口座又は貯金口座を有していない場合は、当該厚生労働省令で定める場合に当たる。",a:true,exp:"任意加入の資格取得の申出には口座振替納付を希望する旨等の申出を要する。申出時点で預金口座・貯金口座を有していない場合は厚生労働省令で定める場合に当たる。なお65歳到達等で資格喪失するまでの期間の保険料を前納する場合も同様である。",src:"法附則5条2項、則2条の2第1号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問1",opt:"C",q:"任意加入被保険者に係る資格取得の申出の受理及びその申出に係る事実についての審査に関する事務は、市町村長（特別区の区長を含む。）が行うこととする。",a:true,exp:"任意加入被保険者に係る資格取得の申出の受理及び申出に係る事実についての審査に関する事務は、市町村長（特別区の区長を含む。）が行う。",src:"令1条の2第1号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問1",opt:"D",q:"日本国内に住所を有しない65歳以上70歳未満の特例による任意加入被保険者が、日本国内に住所を有するに至ったときは、その翌日（日本国内に住所を有するに至った日に更に被保険者の資格を取得したときは、その日）に、当該被保険者の資格を喪失する。",a:true,exp:"国外居住の65歳以上70歳未満の特例による任意加入被保険者が国内に住所を有するに至ったときは、その翌日（同日に更に被保険者資格を取得したときはその日）に資格を喪失する。",src:"(令和7)法附則40条8項1号他",cat:"択一式（国民年金法）"},
{no:"TAC公開-問1",opt:"E",q:"第1号被保険者の属する世帯の世帯主が、当該第1号被保険者に代って、当該第1号被保険者に係るその資格の取得及び喪失並びに種別の変更等に関する事項の届出をする場合において、虚偽の届出をしたときは、当該世帯主は、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:true,exp:"世帯主が第1号被保険者に代って届出をする場合に虚偽の届出をしたときは、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",src:"法112条2号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問2",opt:"ア",q:"国民年金基金（以下「基金」という。）の掛金の額は、国民年金基金令第35条の掛金の額の上限の特例が適用される場合を除き、1月につき68,000円を超えてはならない。",a:true,exp:"基金の掛金の額は、掛金の額の上限の特例が適用される場合を除き、1月につき68,000円を超えてはならない。",src:"基金令34条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問2",opt:"イ",q:"老齢基礎年金の受給権者に対し基金が支給する年金は、当該老齢基礎年金がその全額につき支給を停止されている場合を除いては、その支給を停止することができない。ただし、当該年金の額のうち、200円（支給の繰下げ又は繰上げが行われた老齢基礎年金の受給権者に対し基金が支給する年金については、政令で定める額）に当該基金に係る加入員期間の月数を乗じて得た額を超える部分については、この限りでない。",a:true,exp:"老齢基礎年金が全額支給停止の場合を除き基金の年金は支給停止できない。ただし年金額のうち200円（繰下げ・繰上げの場合は政令で定める額）に加入員期間の月数を乗じた額を超える部分はこの限りでない。",src:"法130条2項カッコ書、法131条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問2",opt:"ウ",q:"国民年金法第86条の規定によると、政府は、政令の定めるところにより、市町村（特別区を含む。以下同じ。）に対し、市町村長（特別区の区長を含む。）がこの法律又はこの法律に基づく政令の規定によって行う事務の処理に必要な費用の2分の1に相当する額を交付するとされている。",a:false,exp:"法86条によると、政府が市町村に交付するのは市町村長が行う「事務の処理に必要な費用」であり、「2分の1に相当する額」ではない。",src:"法86条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問2",opt:"エ",q:"国民年金法において、「実施機関たる共済組合等」とは、国家公務員共済組合連合会、全国市町村職員共済組合連合会、地方公務員共済組合連合会又は私立学校教職員共済法の規定により私立学校教職員共済制度を管掌することとされた日本私立学校振興・共済事業団をいい、当該実施機関たる共済組合等は、毎年度、基礎年金の給付に要する費用に充てるため、基礎年金拠出金を納付する。",a:false,exp:"「実施機関たる共済組合等」に全国市町村職員共済組合連合会は含まれていない。その他の記述は正しい。",src:"法5条9項、法94条の2第2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問2",opt:"オ",q:"令和8年度における国民年金法第27条に規定する改定率は、昭和31年4月1日以前に生まれた者については1.082とされ、同月2日以後に生まれた者については1.085とされた。",a:true,exp:"令和8年度の改定率は、昭和31年4月2日以後生まれの者は1.085（1.065×1.019）、同月1日以前生まれの者は1.082（1.062×1.019）とされた。",src:"国民年金法による改定率の改定等に関する政令1条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問3",opt:"A",q:"令和8年4月10日に20歳に達し、国民年金の第1号被保険者の資格を取得した者が、同月25日に日本国内に住所を有しなくなり、その翌日に被保険者の資格を喪失した。この者が、同月中に再度被保険者の資格を取得しない場合であっても、同月分の保険料は徴収される。",a:true,exp:"被保険者が資格取得した日の属する月にその資格を喪失したときは、その月を1箇月として被保険者期間に算入し、保険料は被保険者期間の計算の基礎となる各月につき徴収される。設問の令和8年4月分の保険料は徴収される。",src:"法11条2項、法87条2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問3",opt:"B",q:"令和5年3月1日に第1号被保険者から第3号被保険者となり、同日以後引き続き第3号被保険者である者について、第3号被保険者の種別の変更の届出が、令和8年4月10日に行われた。この場合、令和6年2月以後の第3号被保険者としての被保険者期間が保険料納付済期間に算入される。なお、種別の変更の届出を遅滞したことについてやむを得ない事由があると認められないものとする。",a:false,exp:"設問の場合、保険料納付済期間に算入されるのは「令和6年3月以後」の第3号被保険者としての被保険者期間である。届出日の属する月の前々月までの2年間のうちにあるものが基準となる。",src:"法附則7条の3第1項〜3項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問3",opt:"C",q:"被保険者又は被保険者であった者が死亡した場合において、寡婦年金を受けることができる妻は、国民年金原簿に記録された死亡した夫に係る特定国民年金原簿記録（被保険者の資格の取得及び喪失、種別の変更、保険料の納付状況その他厚生労働省令で定める事項の内容をいう。以下本問において同じ。）が事実でない、又は国民年金原簿に死亡した夫に係る特定国民年金原簿記録が記録されていないと思料するときであっても、厚生労働大臣に対し、国民年金原簿の訂正の請求をすることはできない。",a:false,exp:"寡婦年金を受けることができる妻は、死亡した夫に係る特定国民年金原簿記録について、厚生労働大臣に対し国民年金原簿の訂正の請求をすることができる。",src:"法14条の2第1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問3",opt:"D",q:"国民年金法第14条の2第1項の規定による国民年金原簿の訂正の請求の受理に関する厚生労働大臣の権限は、地方厚生局長に委任されている。",a:false,exp:"国民年金原簿の訂正の請求の受理は、日本年金機構への権限に係る事務の委任の規定により日本年金機構に行わせるものとされている。地方厚生局長への委任ではない（訂正請求の措置に関する権限は地方厚生局長等に委任）。",src:"法109条の4第1項4号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問3",opt:"E",q:"日本年金機構（以下「機構」という。）は、滞納処分等を行う場合には、あらかじめ、財務大臣の認可を受けるとともに、機構が定め、財務大臣の認可を受けた滞納処分等実施規程に従い、徴収職員に行わせなければならない。",a:false,exp:"滞納処分等を行う場合にあらかじめ認可を受ける相手は「厚生労働大臣」である。設問文中の「財務大臣」を「厚生労働大臣」に置き換えると正しい記述となる。",src:"法109条の6第1項、法109条の7第1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問4",opt:"A",q:"甲（昭和35年4月10日生まれとし、厚生年金保険の被保険者であったことはなかったものとする。）は、65歳に達したときに老齢基礎年金の受給権を取得することができなかったため、特例による任意加入被保険者に係る資格取得の申出を行い、65歳に達した日の属する月以後の期間について、滞納することなく保険料を納付している。甲が66歳の時に老齢基礎年金の受給権を取得した場合、当該老齢基礎年金に振替加算額が加算される。なお、甲は、65歳に達した日の前日において甲の夫に支給する老齢厚生年金の加給年金額の計算の基礎となっており、かつ、65歳に達した日以後においても引き続き夫によって生計を維持しているものとする。",a:true,exp:"設問のとおり正しい。65歳到達日の前日に夫の老齢厚生年金の加給年金額の計算の基礎となっており、その後も生計維持されている場合、特例による任意加入により66歳で老齢基礎年金の受給権を取得したときは振替加算額が加算される。",src:"(60)法附則18条2項他",cat:"択一式（国民年金法）"},
{no:"TAC公開-問4",opt:"B",q:"乙は、60歳に達した月に老齢基礎年金の支給繰上げの請求をし、その翌月から繰り上げた老齢基礎年金の支給を受けている。その後、第2号被保険者である期間中の61歳の時に初診日がある疾病により、障害認定日においては障害等級に該当する程度の障害の状態になかったものの、64歳の時にその疾病により障害等級2級に該当する程度の障害の状態に該当するに至った。この場合、乙は、65歳に達する日の前日までの間であれば、障害基礎年金の支給を請求することができる。なお、保険料納付要件は満たしているものとする。",a:false,exp:"繰上げ支給の老齢基礎年金の受給権者は、いわゆる事後重症による障害基礎年金の支給を請求することはできない。",src:"法30条の2、法附則9条の2の3",cat:"択一式（国民年金法）"},
{no:"TAC公開-問4",opt:"C",q:"65歳に達した日に老齢基礎年金の受給権を取得した丙（昭和29年4月10日生まれ）は、75歳に達した時に支給繰下げの申出をする予定であったところ、66歳の時に遺族厚生年金の受給権を取得した。その後、丙が73歳に達した日に当該老齢基礎年金を請求し、かつ、当該請求の際に支給繰下げの申出をしなかった場合、68歳に達した日に支給繰下げの申出があったものとみなされる。",a:false,exp:"設問の者は65歳到達日から請求日の5年前の日（68歳到達日）までの間に他の年金たる給付（遺族厚生年金）の受給権者となったため、特例的な繰下げみなし増額制度は適用されない。",src:"法28条5項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問4",opt:"D",q:"夫の死亡により遺族基礎年金の受給権を取得した妻が、その受給権を取得した当時30歳未満である場合、当該遺族基礎年金の受給権を取得した日から起算して5年を経過した日に、当該妻の有する遺族基礎年金の受給権は消滅する。",a:false,exp:"設問のような規定はない。遺族基礎年金の受給権は、30歳未満の妻について5年を経過した日に消滅するという規定は存在しない（遺族厚生年金との混同に注意）。",src:"法40条1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問4",opt:"E",q:"遺族基礎年金の受給権者となる配偶者に係る生計維持関係の認定については、当該配偶者の前年の収入が年額850万円以上（又は所得が年額655.5万円以上）であるときは、定年退職等の事情により近い将来収入が年額850万円未満（又は所得が年額655.5万円未満）となると認められる場合であっても、生計維持関係の認定に係る収入要件は満たさない。",a:false,exp:"前年の収入が年額850万円以上（所得655.5万円以上）でも、定年退職等の事情により近い将来850万円未満（所得655.5万円未満）となると認められる者は、収入要件を満たす。",src:"平成23.3.23年発0323第1号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問5",opt:"ア",q:"【老齢基礎年金の支給要件の特例の適用について合算対象期間に算入されるものとして正しいか】第2号被保険者としての被保険者期間に係る保険料納付済期間を有する者の20歳に達した日の属する月前の期間及び60歳に達した日の属する月以後の期間に係る当該保険料納付済期間",a:true,exp:"第2号被保険者としての保険料納付済期間のうち、20歳到達月前及び60歳到達月以後の期間は合算対象期間に算入される。",src:"(60)法附則8条4項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問5",opt:"イ",q:"【老齢基礎年金の支給要件の特例の適用について合算対象期間に算入されるものとして正しいか】昭和36年4月1日から昭和61年3月31日までの第1号厚生年金被保険者期間のうち、20歳に達した日の属する月前の期間及び60歳に達した日の属する月以後の期間に係るもの",a:true,exp:"昭和36年4月1日から昭和61年3月31日までの第1号厚生年金被保険者期間のうち、20歳到達月前及び60歳到達月以後の期間は合算対象期間に算入される。",src:"(60)法附則8条5項6号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問5",opt:"ウ",q:"【老齢基礎年金の支給要件の特例の適用について合算対象期間に算入されるものとして正しいか】国会議員であった期間（60歳以上であった期間に係るものを除く。）のうち、昭和36年4月1日から昭和55年3月31日までの期間に係るもの（厚生年金保険の被保険者であった期間を除く。）",a:true,exp:"国会議員であった期間（60歳以上を除く）のうち昭和36年4月1日から昭和55年3月31日までの期間に係るものは合算対象期間に算入される。",src:"(60)法附則8条5項8号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問5",opt:"エ",q:"【老齢基礎年金の支給要件の特例の適用について合算対象期間に算入されるものとして正しいか】昭和36年5月1日以後国籍法の規定により日本の国籍を取得した者（20歳に達した日の翌日から65歳に達した日の前日までの間に日本の国籍を取得した者に限る。）が日本国内に住所を有しなかった期間（20歳未満であった期間及び60歳以上であった期間に係るものを除く。）のうち、昭和36年4月1日から当該日本の国籍を取得した日の前日までの期間に係るもの（厚生年金保険の被保険者であった期間を除く。）",a:true,exp:"昭和36年5月1日以後国籍法の規定により日本国籍を取得した者が国内に住所を有しなかった期間のうち、昭和36年4月1日から国籍取得日の前日までの期間に係るものは合算対象期間に算入される。",src:"(60)法附則8条5項11号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問5",opt:"オ",q:"【老齢基礎年金の支給要件の特例の適用について合算対象期間に算入されるものとして正しいか】昭和36年4月1日から平成3年3月31日までの学生であった期間（厚生年金保険の被保険者であった期間及び20歳未満であった期間並びに60歳以上であった期間を除く。）のうち、任意加入被保険者に係る資格取得の申出を行わなかったため、被保険者とならなかった期間",a:true,exp:"昭和36年4月1日から平成3年3月31日までの学生であった期間のうち、任意加入の申出を行わず被保険者とならなかった期間は合算対象期間に算入される。",src:"(60)法附則8条5項1号、(元)法附則4条1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問6",opt:"A",q:"14歳の時に父の死亡により遺族基礎年金の受給権者となったその者の子は、その受給権を取得した当時は障害等級1級又は2級に該当する障害の状態になかったが、16歳の時に障害等級2級に該当する障害の状態となった。その子が引き続き障害等級2級に該当する程度の障害の状態にある場合、他の失権事由に該当しない限り、20歳に達するまでは当該子の有する遺族基礎年金の受給権は消滅しない。",a:true,exp:"子の有する遺族基礎年金の受給権は、18歳到達日以後の最初の3月31日が終了したときにおいて障害等級1級又は2級に該当する障害の状態にあるときは消滅しない。",src:"法40条3項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問6",opt:"B",q:"第2号被保険者である19歳の夫が死亡した当時生計を維持するその者の妻及び1歳の子がいた場合、当該子及び当該子と生計を同じくする妻はいずれも遺族基礎年金の受給権を取得しない。",a:false,exp:"第2号被保険者である19歳の夫が死亡した場合、被保険者期間があればすべて第2号被保険者期間であるため納付要件を満たし、前々月までに被保険者期間がなければ納付要件は問われない。いずれの場合も設問の妻及び子は遺族基礎年金の受給権を取得できる。",src:"法37条1項1号、法37条の2第1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問6",opt:"C",q:"65歳から67歳の時の初診日（令和8年4月10日とする。）まで引き続き特例による任意加入被保険者であった者について、初診日の前日において、当該初診日の属する月の前々月までの国民年金の被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が、当該被保険者期間の3分の2に満たない場合であっても、障害認定日において障害等級に該当する程度の障害の状態にあったときは、この者に障害基礎年金を支給する。なお、65歳に達した日の属する月から当該初診日の属する月の前々月までの被保険者期間は、すべて保険料納付済期間であるものとする。",a:false,exp:"初診日において65歳以上の者に対して保険料納付要件の特例は適用されない。したがって納付要件を満たさない設問の者に障害基礎年金は支給されない。",src:"法30条1項、(60)法附則20条1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問6",opt:"D",q:"障害の程度が増進したことによる障害基礎年金の額の改定の請求は、受給権者の障害の程度が増進したことが明らかである場合として厚生労働省令で定める場合を除き、当該障害基礎年金の受給権を取得した日又は国民年金法第34条第1項の規定による厚生労働大臣の診査を受けた日から起算して6月を経過した日後でなければ行うことができない。当該厚生労働省令で定める場合の一つとして、障害基礎年金の受給権を取得した日又は厚生労働大臣の診査を受けた日のいずれか遅い日以後、遷延性植物状態（意識障害により昏睡した状態にあることをいい、当該状態が3月を超えて継続している場合に限る。）となった場合が挙げられる。",a:false,exp:"設問文中の「6月」を「1年」に置き換えると正しい記述となる。遷延性植物状態は当該状態が3月を超えて継続している場合に限る旨は正しい。",src:"法34条3項、則33条の2の2第1項10号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問6",opt:"E",q:"国民年金法第30条の4第1項の規定によるいわゆる20歳前傷病による障害基礎年金の支給事由となった障害が第三者の行為によって生じ、受給権者が第三者から同一の事由について損害賠償を受けた場合であっても、同法第22条第2項の規定は適用されず、政府は、その給付を行う責を免れない。",a:false,exp:"20歳前傷病による障害基礎年金でも、受給権者が第三者から同一の事由について損害賠償を受けたときは、政府はその価額の限度で給付を行う責を免れる。",src:"法22条2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問7",opt:"A",q:"63歳の甲は、現在（令和8年4月10日とする。）、日本国内に住所を有さず、かつ、国民年金の被保険者ではないが、第1号被保険者としての被保険者期間に係る保険料納付済期間を20年、合算対象期間を7年有している。また、甲には生計を維持する15歳の子がいる。甲が令和8年4月中に死亡した場合、当該子は遺族基礎年金の受給権を取得する。",a:true,exp:"甲は保険料納付済期間20年と合算対象期間7年で合計27年を有し、「保険料納付済期間と保険料免除期間とを合算した期間が25年以上である者の死亡」として取扱われるため、甲の子は遺族基礎年金の受給権を取得する。",src:"法37条3号、法37条の2第1項2号",cat:"択一式（国民年金法）"},
{no:"TAC公開-問7",opt:"B",q:"20歳に達して第1号被保険者の資格を取得した月から継続して学生納付特例の適用を受けている者が、学生である21歳の時に初診日がある疾病により、障害認定日において障害等級に該当する程度の障害の状態にあるときは、その者に障害基礎年金を支給する。",a:true,exp:"設問の者は初診日において第1号被保険者であり、初診日の前日において前々月までの被保険者期間がすべて学生納付特例期間であることから保険料納付要件を満たすため、障害認定日に障害等級に該当すれば障害基礎年金の受給権を取得する。",src:"法30条、(60)法附則20条1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問7",opt:"C",q:"障害基礎年金の受給権者が、63歳の時に障害の状態が軽減し、障害等級3級に該当する程度の障害の状態となったため、その支給が停止された。その後、その者が、引き続き障害等級3級に該当する程度の障害の状態のまま3年を経過した後の66歳の時に、障害の程度が増進し、障害等級2級に該当した場合、当該障害基礎年金の支給の停止は解除される。",a:true,exp:"障害等級3級のまま3年を経過し65歳以上の場合であっても障害基礎年金の受給権は消滅せず、その後障害の程度が増進し2級以上に該当することとなれば支給停止は解除される。",src:"法36条2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問7",opt:"D",q:"死亡一時金の支給要件を満たした者が死亡した当時、その者と生計を同じくしていた者が、その者の祖父と弟のみであった場合、死亡一時金を受けることができる遺族は、祖父である。",a:true,exp:"死亡一時金を受けることができる遺族は、配偶者、子、父母、孫、祖父母又は兄弟姉妹であって死亡当時生計を同じくしていた者とし、順位もこの順序による。祖父は祖父母として弟（兄弟姉妹）より先順位である。",src:"法52条の3第1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問7",opt:"E",q:"寡婦年金の支給対象となる妻は、国民年金法第49条第1項に規定する夫の死亡の当時夫によって生計を維持し、かつ、夫との婚姻関係が10年以上継続した65歳未満のものとされるが、当該婚姻関係は、届出をしていないが事実上婚姻関係と同様の事情にある場合を含まない。",a:false,exp:"寡婦年金の支給対象となる妻の婚姻関係には、届出をしていないが事実上婚姻関係と同様の事情にある場合を含む。",src:"法49条1項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問8",opt:"A",q:"偽りその他不正の手段により給付を受けた者があるときは、厚生労働大臣は、その者に対して、受給額の2倍に相当する額以下の金額を納付することを命じることができる。",a:false,exp:"設問のような規定はない。偽りその他不正の手段により給付を受けた者があるときは、厚生労働大臣は受給額に相当する金額の全部又は一部をその者から徴収することができる。",src:"法23条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問8",opt:"B",q:"死亡一時金を受ける権利は、国税滞納処分（その例による処分を含む。）により差し押さえることができる。",a:false,exp:"死亡一時金を受ける権利を国税滞納処分（その例による処分を含む。）により差し押さえることはできない。",src:"法24条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問8",opt:"C",q:"脱退一時金の支給要件を満たした者に係る基準月の属する年度が令和8年度であり、かつ、その者の保険料納付済期間等の月数が60以上である場合、その者に支給する脱退一時金の額は、537,600円である。",a:true,exp:"脱退一時金の額は「基準月の属する年度における保険料の額（令和8年度17,920円）×1/2×月数に応じて政令で定める数（60）＝537,600円」である。",src:"法附則9条の3の2第3項、令14条の3の2",cat:"択一式（国民年金法）"},
{no:"TAC公開-問8",opt:"D",q:"65歳に達したときに老齢基礎年金の受給権を取得した夫が、当該老齢基礎年金を請求しないまま67歳の時に死亡した。夫の死亡当時生計を同じくしていた妻が当該老齢基礎年金を請求する場合には、夫の名でしなければならない。",a:false,exp:"設問の妻は、自己の名で老齢基礎年金（未支給年金）を請求することができる。夫の名で請求するのではない。",src:"法19条1項・3項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問8",opt:"E",q:"年金給付を受ける権利又は当該権利に基づき支払期月ごとに支払うものとされる年金給付の支給を受ける権利については、会計法第31条の規定が適用される。",a:false,exp:"年金給付を受ける権利等については、会計法31条の規定を適用しない。",src:"法102条3項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問9",opt:"A",q:"第1号被保険者は、国民年金法第89条第1項各号の法定免除の事由のいずれかに該当するに至ったときは、当該事実があった日から14日以内に、「保険料の免除理由及びそれに該当した年月日」等を記載した届書を市町村長（特別区にあっては、区長とする。）に提出しなければならない。この場合において、当該届書に基礎年金番号を記載するときは、当該届書に基礎年金番号通知書その他の基礎年金番号を明らかにすることができる書類を添えなければならない。ただし、厚生労働大臣が同法第89条第1項各号の法定免除の事由のいずれかに該当するに至ったことを確認したときは、この限りでない。",a:true,exp:"法定免除の事由に該当するに至ったときは14日以内に所定事項を記載した届書を市町村長に提出しなければならない。厚生労働大臣が該当を確認したときはこの限りでない。",src:"則75条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問9",opt:"B",q:"学生納付特例事務法人は、その設置する学校教育法第83条に規定する大学その他の政令で定める教育施設において当該教育施設の学生等である被保険者（以下本問において「学生等被保険者」という。）の委託を受けて、学生等被保険者に係る学生納付特例申請をすることができる。学生等被保険者が学生納付特例事務法人に学生納付特例申請の委託をしたときは、当該委託をした日に、学生納付特例申請があったものとみなす。",a:true,exp:"学生納付特例事務法人は学生等被保険者の委託を受けて学生納付特例申請をすることができ、委託をした日に申請があったものとみなす。",src:"法109条の2の2第1項・2項",cat:"択一式（国民年金法）"},
{no:"TAC公開-問9",opt:"C",q:"国民年金・厚生年金保険障害認定基準によると、障害の程度を認定する場合におけるその障害の状態の基本は、1級については、例えば、身のまわりのことはかろうじてできるが、それ以上の活動はできないもの又は行ってはいけないもの、すなわち、病院内の生活でいえば、活動の範囲がおおむねベッド周辺に限られるものであり、家庭内の生活でいえば、活動の範囲がおおむね就床室内に限られるものであるとされている。",a:true,exp:"障害認定基準によると、1級の障害の状態の基本は、身のまわりのことはかろうじてできるがそれ以上の活動はできないもの等で、病院内では活動範囲がおおむねベッド周辺、家庭内では就床室内に限られるものとされている。",src:"国民年金・厚生年金保険障害認定基準",cat:"択一式（国民年金法）"},
{no:"TAC公開-問9",opt:"D",q:"遺族基礎年金の受給権者である配偶者は、毎年、指定日までに、「加算額対象者の氏名及び生年月日並びにその者と引き続き生計を同じくしている旨」等を記載し、かつ、自ら署名した届書を機構に提出しなければならないとされ、正当な理由がなくて、当該届書を提出しないときは、当該遺族基礎年金について、国民年金法第73条の規定によって、その額の全部又は一部につき、その支給を停止することができる。",a:false,exp:"設問の場合、遺族基礎年金について法73条の規定によって、その「支払を一時差し止める」ことができる。支給を停止するのではない。",src:"法73条、則51条の3、則69条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問9",opt:"E",q:"市町村長（地方自治法第252条の19第1項の指定都市においては、区長又は総合区長とする。）は、厚生労働大臣又は被保険者、被保険者であった者若しくは受給権者に対して、当該市町村の条例の定めるところにより、被保険者、被保険者であった者若しくは受給権者又は遺族基礎年金の支給若しくは障害基礎年金若しくは遺族基礎年金の額の加算の要件に該当する子の戸籍に関し、無料で証明を行うことができる。",a:true,exp:"市町村長は、当該市町村の条例の定めるところにより、被保険者等又は加算の要件に該当する子の戸籍に関し無料で証明を行うことができる。",src:"法104条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問10",opt:"A",q:"保険料その他国民年金法の規定による徴収金に関する処分の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない。",a:false,exp:"徴収金に関する処分の取消しの訴えは、社会保険審査官の決定を経た後でなくても提起することができる。審査請求前置となるのは法101条1項に規定する処分（資格・給付に関する処分）に限る。",src:"法101条の2",cat:"択一式（国民年金法）"},
{no:"TAC公開-問10",opt:"B",q:"国民年金法第93条第1項の規定による保険料の前納は、厚生労働大臣が定める期間につき、6月又は年を単位として、行うものとする。ただし、厚生労働大臣が定める期間のすべての保険料（既に前納されたものを除く。）をまとめて前納する場合においては、6月又は年を単位として行うことを要しない。",a:true,exp:"保険料の前納は6月又は年を単位として行うが、厚生労働大臣が定める期間のすべての保険料をまとめて前納する場合は、6月又は年を単位として行うことを要しない。",src:"令7条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問10",opt:"C",q:"65歳以上70歳未満の特例による任意加入被保険者は、付加保険料を納付する者となることができる。",a:false,exp:"65歳以上70歳未満の特例による任意加入被保険者は、付加保険料を納付する者となることができない。",src:"(令和7)法附則40条10項他",cat:"択一式（国民年金法）"},
{no:"TAC公開-問10",opt:"D",q:"保険料その他国民年金法の規定による徴収金の先取特権の順位は、国税及び地方税と同順位とする。",a:false,exp:"徴収金の先取特権の順位は、国税及び地方税に「次ぐ」ものとする。同順位ではない。",src:"法98条",cat:"択一式（国民年金法）"},
{no:"TAC公開-問10",opt:"E",q:"国民年金法第14条の5の規定によると、厚生労働大臣は、国民年金制度に対する国民の理解を増進させ、及びその信頼を向上させるため、厚生労働省令で定めるところにより、被保険者及び受給権者に対し、当該被保険者及び受給権者の保険料納付の実績及び給付に関する必要な情報を分かりやすい形で通知するものとするとされている。",a:false,exp:"法14条の5の通知の対象は「被保険者」であり、通知する情報は保険料納付の実績及び「将来の給付」に関する必要な情報である。受給権者は対象とされていない。",src:"法14条の5",cat:"択一式（国民年金法）"},
{type:"select",no:"TAC公開-選択問8",opt:"空欄A",context:"国民年金法第4条の3第1項の規定によると、政府は、少なくとも【A】ごとに、保険料及び国庫負担の額並びにこの法律による給付に要する費用の額その他の国民年金事業の財政に係る収支についてその現況及び財政均衡期間における見通しを作成しなければならないとされている。",choices:["3年", "4年", "5年", "6年"],answer:"5年",exp:"政府はいわゆる財政検証として、少なくとも「5年」ごとに国民年金事業の財政の現況及び財政均衡期間における見通しを作成しなければならない。",src:"法4条の3第1項",cat:"選択式"},
