{no:"TAC社06-問3",opt:"オ",q:"厚生年金保険法第26条に規定する3歳に満たない子を養育する被保険者等の標準報酬月額の特例（以下「本特例」という。）の適用を受けている被保険者の養育する第1子が3歳に達する前に第2子の養育が始まり、この第2子の養育にも本特例の適用を受ける場合、第1子の養育に係る本特例の適用期間は、第2子について本特例の適用を受ける場合における当該第2子を養育することとなった日の翌日の属する月の前月までとなる。",a:true,exp:"設問の通り正しい。第1子の養育に係る本特例の適用期間は、第2子を養育することとなった日の翌日の属する月の前月までとなる。",src:"法26条1項3号",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問4",opt:"A",q:"その受給権を取得した当時より継続して障害等級3級に該当する障害厚生年金の受給権者に対して、新たに障害等級2級の障害厚生年金を支給すべき事由が生じたときは、厚生年金保険法第48条第1項の規定により、前後の障害を併合した障害の程度による障害厚生年金を支給することとし、従前の障害厚生年金の受給権は消滅する。",a:false,exp:"受給権取得当時から引き続き障害等級「1級又は2級」に該当したことがない障害等級3級の障害厚生年金の受給権者については、設問の併合認定は行われない。",src:"法48条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問4",opt:"B",q:"厚生年金保険法第48条第1項の規定による障害厚生年金の額は、その額が同条第2項の規定により消滅した障害厚生年金の額より低額であるときは、従前の障害厚生年金の額に相当する額とされる。",a:true,exp:"設問の通り正しい。併合認定による障害厚生年金の額が、消滅した従前の障害厚生年金の額より低額であるときは、消滅した従前の障害厚生年金の額に相当する額が支給される。",src:"法50条4項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問4",opt:"C",q:"傷病に係る初診日が被保険者であった期間中にある場合であっても、当該傷病に係る障害認定日が被保険者であった期間中にないときは、障害厚生年金は支給されない。",a:false,exp:"障害認定日が被保険者であった期間中にない場合であっても、他の要件を満たす限り、障害厚生年金は支給される（初診日が被保険者期間中にあれば足りる）。",src:"法47条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問4",opt:"D",q:"障害認定日に障害等級に該当しなかった者が障害認定日後65歳に達する日の前日までに当該傷病により障害等級3級に該当する程度の障害の状態となった場合、65歳に達した日以後であっても障害厚生年金の支給を請求することができる。なお、保険料納付要件等その他の要件は満たしているものとする。",a:false,exp:"いわゆる事後重症による障害厚生年金は、「65歳に達した日以後」にその支給を請求することはできない。",src:"法47条の2第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問4",opt:"E",q:"障害厚生年金の給付事由となった障害について国民年金法による障害基礎年金を受けることができない場合において、障害厚生年金の額が国民年金法第33条第1項に規定する障害基礎年金の額に3分の2を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）に満たないときは、当該額を障害厚生年金の額とする。",a:false,exp:"設問の「3分の2」を「4分の3」に置き換えると正しい記述となる。",src:"法50条3項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問5",opt:"A",q:"妻に支給する遺族厚生年金の額に経過的寡婦加算が行われるのは、当該妻が昭和30年4月1日以前に生まれた者である場合に限られる。",a:false,exp:"設問の「昭和30年4月1日」を「昭和31年4月1日」に置き換えると正しい記述となる。",src:"(60)法附則73条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問5",opt:"B",q:"遺族厚生年金の受給権者がその権利を取得した当時その者によって生計を維持する15歳の子が1人あった場合、遺族厚生年金の額に当該子に係る加給年金額が加算されるが、当該加算額は、224,700円に改定率を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）とされている。",a:false,exp:"遺族厚生年金の額に、子に係る加給年金額の加算は行われない。",src:"法60条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問5",opt:"C",q:"子に対する遺族厚生年金は、生計を同じくするその子の父又は母があるときは、その間、その支給を停止する。",a:false,exp:"子に対する遺族厚生年金は、生計を同じくするその子の父又は母があることを事由として、その支給は停止されない。なお、子に対する遺族「基礎」年金は、生計を同じくするその子の父又は母があるときは、その間支給停止される。",src:"法66条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問5",opt:"D",q:"保険料納付済期間と保険料免除期間とを合算した期間が25年以上である者の死亡により、その者の配偶者（老齢厚生年金の受給権を有する65歳以上の者であり、子はいないものとする。）が遺族厚生年金の受給権を取得した場合における当該遺族厚生年金の額は、死亡した被保険者の被保険者期間を基礎として計算した老齢厚生年金相当額の4分の3に相当する額（以下、本肢において「原則額」とする。）と、原則額に2分の1を乗じて得た額と当該配偶者の老齢厚生年金の額に3分の2を乗じて得た額を合算した額のうち、いずれか多い額を当該配偶者に支給する遺族厚生年金の額とする。",a:false,exp:"設問の額は、原則額と、原則額に「3分の2」を乗じて得た額と当該配偶者の老齢厚生年金の額に「2分の1」を乗じて得た額を合算した額のうち、いずれか多い額とされる（設問は分数が逆）。",src:"法60条1項2号・法附則17条の2第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問5",opt:"E",q:"16歳の子（障害の状態にはないものとする。）と生計を同じくする55歳の夫が妻の死亡により遺族基礎年金及び遺族厚生年金の受給権を取得した。この場合、子が18歳に達した日以後の最初の3月31日が終了するまでの間は、夫は遺族基礎年金と遺族厚生年金の両方を併せて受給することができるが、子について18歳に達した日以後の最初の3月31日が終了したときは、その翌月から夫が60歳に達するまでの間は、夫に対する遺族厚生年金は支給停止される。",a:true,exp:"設問の通り正しい。子が18歳到達後最初の3月31日終了で、子は遺族基礎・遺族厚生年金の受給権を失い、夫は遺族基礎年金の受給権を失う。夫に対する遺族厚生年金は、同一支給事由の遺族基礎年金の受給権を有さなくなるため、60歳に達するまでの期間、その支給を停止する。",src:"法59条1項・法65条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問6",opt:"A",q:"離婚の届出をしていないが、夫婦としての共同生活が営まれておらず、事実上離婚したと同様の事情にあると認められる場合であって、両当事者がともに当該事情にあると認めている場合には、いわゆる合意分割の請求（以下「標準報酬改定請求」という。）をすることができる。",a:false,exp:"設問の場合には、いわゆる合意分割の請求はできない。合意分割は「離婚、婚姻の取消しその他厚生労働省令で定める事由」があった場合に請求できるものである。",src:"法78条の2第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問6",opt:"B",q:"2以上の種別の被保険者であった期間を有する者について、いわゆる合意分割の規定を適用する場合においては、各号の厚生年金被保険者期間のうち一の期間に係る標準報酬についての標準報酬改定請求は、他の期間に係る標準報酬についての当該請求と同時に行わなければならない。",a:true,exp:"設問の通り正しい。",src:"法78条の36",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問6",opt:"C",q:"死亡した甲は、過去に厚生年金保険の被保険者であったことはないが、離婚時みなし被保険者期間及び被扶養配偶者みなし被保険者期間を有し、また、国民年金の第1号被保険者及び第3号被保険者としての被保険者期間に係る保険料納付済期間を30年有していた。その死亡当時甲によって生計を維持していた甲の子である乙（16歳）がいた場合、乙に遺族厚生年金が支給される。",a:true,exp:"設問の通り正しい。過去に被保険者であったことがない者でも、離婚時みなし被保険者期間及び被扶養配偶者みなし被保険者期間を有し、遺族厚生年金の「長期要件」に該当する場合には、その者の一定の遺族に遺族厚生年金が支給される。",src:"法58条1項4号・法59条1項2号・法78条の11",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問6",opt:"D",q:"標準報酬改定請求により標準報酬が決定された第2号改定者について、当該決定された標準賞与額は、当該第2号改定者がその後65歳以後の在職老齢年金の受給権者となった場合においても、総報酬月額相当額の計算の基礎とされない。",a:true,exp:"設問の通り正しい。",src:"法78条の11",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問6",opt:"E",q:"特定被保険者が障害厚生年金の受給権者である場合、当該障害厚生年金の額の計算の基礎となった特定期間に係る被保険者期間は、いわゆる3号分割の請求（3号分割標準報酬改定請求）をする場合における特定期間に係る被保険者期間から除かれる。",a:true,exp:"設問の通り正しい。",src:"令3条の12の11・則78条の17第1項1号",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問7",opt:"A",q:"老齢厚生年金の繰上げ支給を受けているものは、65歳に達するまでの間は、支給繰上げの請求日以後において被保険者であった期間を有し退職した場合であっても、厚生年金保険法第43条第3項の規定によるいわゆる退職改定は行われない。",a:true,exp:"設問の通り正しい。報酬比例部分のみの特別支給の老齢厚生年金の支給開始年齢が61〜64歳（特例支給開始年齢）に引き上げられている者が、特例支給開始年齢に達する前に支給繰上げの請求をした場合、退職改定の規定は特例支給開始年齢に達しているものに限り適用される（特例支給開始年齢到達後であれば65歳到達前でも退職改定は行われる）。",src:"法附則15条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問7",opt:"B",q:"国民年金法による寡婦年金の支給を受けていた者は、老齢厚生年金の支給繰下げの申出をすることができない。",a:false,exp:"設問の事由により老齢厚生年金の支給繰下げの申出はできないが、寡婦年金の受給権は受給権者が65歳に達したときに消滅するので、老齢厚生年金の支給繰下げの申出に影響しない（繰下げの申出はできる）。",src:"法44条の3第1項・国年法51条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問7",opt:"C",q:"65歳に達し老齢厚生年金の受給権を取得した者が、その後、72歳に達した日に老齢厚生年金の請求をした場合において、当該請求をした日の5年前の日以前に他の年金たる給付の受給権者であったときは、厚生年金保険法第44条の3第5項の規定によるいわゆる支給繰下げの申出のみなし規定は適用されない。",a:false,exp:"他の年金たる給付の受給権者となったのが、老齢厚生年金の受給権取得日（設問では65歳到達日）から請求日の5年前の日までの間でなければ、いわゆる繰下げの申出のみなし規定は適用される。",src:"法44条の3第5項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問7",opt:"D",q:"老齢厚生年金の繰上げ支給を受ける者に加給年金額の加算対象となる配偶者がいる場合、加給年金額も繰り上げて加算される。",a:false,exp:"支給繰上げの請求をした場合であっても、加給年金額は繰り上げて加算されず、原則として「65歳」から加算される。",src:"法附則7条の3第6項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問7",opt:"E",q:"繰上げ支給の老齢厚生年金の額は、請求日の属する月までの厚生年金保険の被保険者期間を基礎として計算した老齢厚生年金の額から政令で定める額を減じた額とする。",a:false,exp:"繰上げ支給の老齢厚生年金の額は、請求日の属する月の「前月」までの厚生年金保険の被保険者期間を基礎として計算した老齢厚生年金の額から政令で定める額を減じた額とされる（設問は「前月」が抜けている）。",src:"法43条1項・法附則7条の3第4項・令6条の3",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問8",opt:"A",q:"脱退一時金の額は、被保険者であった期間に応じて、その期間の平均標準報酬額（被保険者期間の計算の基礎となる各月の標準報酬月額と標準賞与額に、再評価率を乗じて得た額の総額を、当該被保険者期間の月数で除して得た額をいう。）に支給率を乗じて得た額とする。",a:false,exp:"平均標準報酬額の算定に当たっては、標準報酬月額及び標準賞与額に「再評価率は乗じない」。脱退一時金の額は、各月の標準報酬月額と標準賞与額の総額を被保険者期間の月数で除して得た平均標準報酬額に支給率を乗じて得た額とされている。",src:"法附則29条3項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問8",opt:"B",q:"障害厚生年金の支給を受けたことがある者の障害の状態が軽快し、現に障害厚生年金の支給が停止されている場合であっても、この者は脱退一時金の支給を請求することはできない。",a:true,exp:"設問の通り正しい。障害厚生年金その他政令で定める保険給付の受給権を有したことがあるときは、他の要件を満たす場合であっても脱退一時金の支給を請求することはできない。",src:"法附則29条1項2号",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問8",opt:"C",q:"脱退一時金の支給要件の1つである「被保険者期間が6月以上」について、2以上の種別の被保険者であった期間を有する者については、その者の2以上の被保険者の種別に係る被保険者であった期間に係る被保険者期間を合算し、一の期間に係る被保険者期間のみを有する者に係るものとみなしてこれを判定する。",a:true,exp:"設問の通り正しい。",src:"法附則30条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問8",opt:"D",q:"脱退一時金の支給を受けたときは、支給を受けた者は、その額の計算の基礎となった被保険者であった期間は、被保険者でなかったものとみなす。",a:true,exp:"設問の通り正しい。",src:"法附則29条5項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問8",opt:"E",q:"一度脱退一時金の支給を受けた者であっても、その後、再び脱退一時金の支給要件を満たしたときは、その支給を請求することができる。",a:true,exp:"設問の通り正しい。脱退一時金の支給について回数の制限はないため、支給を受けた者が再び支給要件を満たした場合には、その支給を請求することができる。",src:"法附則29条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問9",opt:"ア",q:"令和8年度から、次期財政検証作成年度の翌年度までの間の、新規裁定者に係る調整期間における再評価率の改定については、原則として、名目手取り賃金変動率に、調整率に1から調整率を控除して得た率に3分の2を乗じて得た率を加えて得た率（「経過的軽減調整率」という。）に当該年度の前年度の特別調整率を乗じて得た率を乗じて得た率（当該率が1を下回るときは、1）を基準とする。",a:true,exp:"設問の通り正しい。仮に調整率が0.998（▲0.2％）であった場合、経過的軽減調整率は0.999（▲0.1％）〔≒0.998＋（1－0.998）×2/3〕となる。",src:"(令和7)法附則3条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問9",opt:"イ",q:"保険給付の受給権者が死亡した場合において、当該受給権者の死亡の当時その者と生計を同じくしていた者が、21歳の子と62歳の母であったときは、当該母が当該未支給の保険給付の支給を請求することができる。",a:false,exp:"設問の場合、未支給の保険給付の支給を請求することができるのは「子」である（子が母より先順位）。",src:"法37条4項・令3条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問9",opt:"ウ",q:"保険料を徴収する権利が時効によって消滅したときは、当該保険料に係る被保険者であった期間に基づく保険給付は、行わない。ただし、当該被保険者であった期間に係る被保険者の資格の取得について、被保険者等からの確認の請求があった後に、保険料を徴収する権利が時効によって消滅したものであるときは、この限りでない。",a:true,exp:"設問の通り正しい。",src:"法75条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問9",opt:"エ",q:"受給権者が、正当な理由がなくて、現況届等の届出をせず、又は書類その他の物件を提出しないときは、保険給付の額の全部又は一部につき、その支給を停止することができる。",a:false,exp:"設問の場合は、保険給付の支払を「一時差し止める」ことができるとされている（全部又は一部の支給停止ではない）。",src:"法78条",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問9",opt:"オ",q:"日本年金機構は、滞納処分等を行う場合には、あらかじめ、財務大臣の認可を受けるとともに、厚生年金保険法第100条の7第1項に規定する滞納処分等実施規程に従い、徴収職員に行わせなければならない。",a:false,exp:"日本年金機構は、滞納処分等を行う場合には、あらかじめ「厚生労働大臣」の認可を受けなければならない（財務大臣ではない）。なお、滞納処分等をしたときは、速やかにその結果を厚生労働大臣に報告しなければならない。",src:"法100条の6第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問10",opt:"A",q:"厚生労働大臣は、会計法第7条第1項の規定にかかわらず、政令で定める場合における保険料その他厚生年金保険法の規定による徴収金、年金たる保険給付の過誤払による返還金その他の厚生労働省令で定めるものの収納を、政令で定めるところにより、日本年金機構に行わせることができる。",a:true,exp:"設問の通り正しい。会計法7条1項では歳入は出納官吏でなければ収納できないとされるが、当該規定にかかわらず、厚生労働大臣は、政令で定める場合の保険料その他の徴収金、保険給付の過誤払による返還金等の収納を日本年金機構に行わせることができる。なお、機構は収納をしたときは遅滞なくこれを日本銀行に送付しなければならない。",src:"法100条の11第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問10",opt:"B",q:"厚生年金保険法施行規則第40条の2第1項によれば、老齢厚生年金（厚生労働大臣が支給するものに限る。）の受給権者の属する世帯の世帯主その他その世帯に属する者は、当該受給権者の所在が1年以上明らかでないときは、速やかに、所定の事項を記載した届書を日本年金機構に提出しなければならないとされている。",a:false,exp:"設問の「1年以上」を「1月以上」に置き換えると正しい記述となる。",src:"則40条の2第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問10",opt:"C",q:"被保険者であった夫の死亡により遺族基礎年金及び遺族厚生年金の受給権者となった妻が、遺族厚生年金について厚生年金保険法第38条の2第1項（受給権者の申出による支給停止）の申出を行う場合には、同時に、遺族基礎年金についても国民年金法第20条の2第1項（受給権者の申出による支給停止）の申出を行わなければならない。",a:false,exp:"遺族基礎年金及び遺族厚生年金について、同時に設問の支給停止の申出を行う必要はない。なお、設問の支給停止の申出は、いつでも、将来に向かって撤回することができる。",src:"法38条の2第1項・国年法20条の2第1項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問10",opt:"D",q:"被保険者の資格又は標準報酬に関する処分が確定した場合であっても、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることができる。",a:false,exp:"被保険者の資格又は標準報酬に関する処分が確定したときは、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることが「できない」。",src:"法90条5項",cat:"択一式（TAC中間模試）"},
{no:"TAC社06-問10",opt:"E",q:"事業主が、正当な理由がなくて厚生年金保険法第27条の規定に違反して、被保険者の資格の取得及び喪失並びに報酬月額及び賞与額等に関する届出をせず、又は虚偽の届出をしたときは、10万円以下の過料に処せられる。",a:false,exp:"設問の場合、事業主は「6月以下の拘禁刑又は50万円以下の罰金」に処せられる。なお、法98条1項違反で事業主が届出（資格の取得・喪失等の届出以外）をせず又は虚偽の届出をしたときは、10万円以下の過料に処せられる。",src:"法102条1項1号",cat:"択一式（TAC中間模試）"},
{no:"LEC第2回-問1",opt:"A",q:"死亡した被保険者の子2人が遺族厚生年金の受給権者である場合において、1人の子が死亡したことによりその子の遺族厚生年金の受給権が消滅した場合、他方の子に対する遺族厚生年金の額は、その死亡した日の属する月から改定される。",a:false,exp:"配偶者以外の者に遺族厚生年金を支給する場合に受給権者の数に増減を生じたときは、増減を生じた月の「翌月」から遺族厚生年金の額が改定される。したがって子が死亡した日の属する月の「翌月」から他方の子の遺族厚生年金の額が改定される。",src:"法61条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"B",q:"厚生年金保険法第47条の3の規定による基準障害による障害厚生年金は、所定の支給要件を満たしていれば、その裁定請求は、65歳に達する日以後であっても、行うことができる。",a:true,exp:"設問の通り正しい。なお、事後重症による障害厚生年金は、65歳に達する日の前日までに請求しなければ支給されない（基準障害による障害厚生年金とは異なる）。",src:"法47条の3第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"C",q:"厚生労働大臣による脱退一時金に関する処分の取消しの訴えは、当該処分についての審査請求に対する社会保険審査会の裁決を経ずとも、提起することができる。",a:false,exp:"脱退一時金に関する処分の取消しの訴えは、当該処分についての審査請求に対する「社会保険審査会の裁決を経た後でなければ、提起することができない」。",src:"法附則29条8項・令13条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"D",q:"被保険者である男性の死亡の当時当該男性によって生計を維持していた者が、当該男性と婚姻の届出をしていないが事実上婚姻関係と同様の事情にある女性のみであった場合、他の遺族厚生年金の支給要件を満たしていたとしても、その女性に対しては遺族厚生年金は支給されない。",a:false,exp:"厚生年金保険法において「妻」には、婚姻の届出をしていないが事実上婚姻関係と同様の事情にある者を含む。したがって本肢の女性は生計を維持していた妻に該当するため、遺族厚生年金が支給される。",src:"法3条2項・法59条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"E",q:"適用事業所に使用される高齢任意加入被保険者は、保険料（初めて納付すべき保険料を除く。）を滞納し、督促状に記載された指定の期限までに、その保険料を納付しないとき（厚生年金保険法附則第4条の3第7項ただし書に規定する保険料の半額負担及び納付義務に関する事業主の同意があるときを除く。）は、当該保険料の納期限の属する月の翌月末日に、被保険者の資格を喪失する。",a:false,exp:"高齢任意加入被保険者が保険料を滞納し指定期限までに納付しないとき（事業主同意がある場合を除く）は、当該保険料の納期限の属する月の「前月」の末日に、被保険者の資格を喪失する。",src:"法附則4条の3第6項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"A",q:"老齢厚生年金の受給権者である被保険者（満66歳）が令和8年7月31日に適用事業所に使用されなくなったため、その翌日に被保険者の資格を喪失し、その後被保険者となることなく1月が経過した。この場合、厚生年金保険法第43条第3項の退職時改定の規定により、令和8年8月分の老齢厚生年金からその額が改定される。",a:true,exp:"設問の通り正しい。適用事業所に使用されなくなった日から起算して1月を経過した日（令和8年8月31日）の属する月である令和8年8月分から老齢厚生年金の額が改定される。",src:"法43条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"B",q:"65歳未満の配偶者があることにより老齢厚生年金に配偶者加給年金額が加算される場合には、当該配偶者加給年金額については、配偶者の生年月日に応じた特別加算が行われる。",a:false,exp:"当該「老齢厚生年金の受給権者が昭和9年4月2日以後生まれであるとき」は、当該「受給権者の生年月日」に応じた特別加算が行われる（配偶者の生年月日ではない）。",src:"法44条1項・昭60法附則60条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"C",q:"老齢厚生年金の支給繰下げの申出をすることができる者が、その受給権を取得した日から起算して5年を経過した日後に当該老齢厚生年金を請求し、かつ、当該請求の際に支給繰下げの申出をしないときは、当該請求をした日の5年前の日に支給繰下げの申出があったものとみなされる。ただし、当該老齢厚生年金の受給権を取得した日から起算して10年を経過した日以後にあるときは、この限りでない。",a:false,exp:"老齢厚生年金の受給権を取得した日から起算して「15年」を経過した日以後にあるときは、本肢の特例的な繰下げみなし制度は適用されない。本肢前段の記述は正しい。",src:"法44条の3第5項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"D",q:"昭和36年4月1日生まれの男子（特定警察職員等には該当しないものとする。）に対しては、障害者の特例等一定の特例に該当する場合を除き、60歳台前半の老齢厚生年金は支給されない。",a:false,exp:"昭和36年4月1日生まれの男子（特定警察職員等には該当しない）に対しては、所定の要件を満たせば、「64歳から60歳台前半の老齢厚生年金が支給される」。",src:"法附則8条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"E",q:"厚生年金保険法第43条第1項によれば、老齢厚生年金（報酬比例部分）の額は、被保険者であった全期間の平均標準報酬額の1,000分の5.481に相当する額に被保険者期間の月数を乗じて得た額であるが、この「被保険者期間の月数」には、生年月日に応じた上限が設けられている。",a:false,exp:"報酬比例部分の額には生年月日に応じた上限は「設けられていない」。",src:"法43条1項ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"A",q:"雇用保険法の規定による基本手当の受給資格を有する60歳台前半の老齢厚生年金の受給権者が当該基本手当に係る求職の申込みをした場合であっても、当該受給権者が基本手当の支給を受けた日とみなされる日及びこれに準ずる日として政令で定める日がない月については、基本手当との調整による60歳台前半の老齢厚生年金の支給停止は行われない。",a:true,exp:"設問の通り正しい。",src:"法附則11条の5",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"B",q:"障害の程度を定めるべき日において障害手当金に該当する程度の障害の状態になった者が老齢厚生年金の受給権者であっても、当該老齢厚生年金が在職老齢年金の規定によりその全額の支給が停止されている場合は、他の要件を満たす限り、その者に対して障害手当金が支給される。",a:false,exp:"原則として、障害の程度を定めるべき日において「年金たる保険給付の受給権者であるものに対しては障害手当金は支給されない」。在職老齢年金により老齢厚生年金が全額支給停止されている場合であっても、年金たる保険給付の受給権者には該当するため、障害手当金は支給されない。",src:"法56条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"C",q:"特定被保険者の被扶養配偶者が実施機関に対し3号分割標準報酬改定請求をするための要件の1つとして、「特定被保険者と離婚又は婚姻の取消しをしたときその他これに準ずるものとして厚生労働省令で定めるとき」があるが、この「厚生労働省令で定めるとき」には、3号分割標準報酬改定請求のあった日に、離婚の届出をしていないが夫婦としての共同生活が営まれておらず事実上離婚したと同様の事情にあると認められる場合であって、3号分割標準報酬改定請求をすることにつき特定被保険者及び被扶養配偶者がともに当該事情にあると認めており、かつ、特定被保険者の被扶養配偶者が当該特定被保険者の配偶者としての国民年金の第3号被保険者の資格を喪失している場合が含まれる。",a:true,exp:"設問の通り正しい。",src:"法78条の14第1項・則78条の14",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"D",q:"被保険者（厚生年金保険法第58条第1項第4号に規定するいわゆる長期要件には該当しないものとする。）が死亡し、その者が2以上の被保険者の種別に係る被保険者であった期間を有していた場合、当該被保険者の所定の遺族に対して支給される遺族厚生年金の額は、その死亡した者に係る2以上の被保険者の種別に係る被保険者であった期間を合算し、一の期間に係る被保険者期間のみを有するものとみなして計算される。",a:true,exp:"設問の通り正しい。なお、長期要件に係る遺族厚生年金の額は、各号の厚生年金被保険者期間に係る被保険者期間ごとに支給するものとされている。",src:"法78条の32第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"E",q:"第1号厚生年金被保険者に係る保険料は、納付義務者が破産手続開始の決定を受けたときは、納期前であっても、すべて徴収することができる。",a:true,exp:"設問の通り正しい。",src:"法85条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"ア",q:"期間を定めて支給を停止されている障害厚生年金（その権利を取得した当時から引き続き障害等級の1級又は2級に該当しない程度の障害の状態にある受給権者に係るものを除く。以下本問において同じ。）の受給権者に対して更に障害厚生年金を支給すべき事由が生じたときは、併合認定の規定により支給する前後の障害を併合した障害の程度による障害厚生年金は、従前の障害厚生年金の支給を停止すべきであった期間、その支給が停止され、その間、その者に従前の障害を併合しない障害の程度による障害厚生年金が支給される。",a:true,exp:"設問の通り正しい。",src:"法49条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"イ",q:"被保険者が死亡し、当該被保険者の死亡の当時当該被保険者によって生計を維持していた遺族が50歳の夫のみである場合、夫は遺族厚生年金の受給権を取得するが、夫が55歳に達するまでは遺族厚生年金の支給は停止される。",a:false,exp:"夫、父母又は祖父母については、原則として、被保険者又は被保険者であった者の死亡の当時「55歳以上」でなければ、遺族厚生年金は支給されない。本肢の夫は死亡当時50歳であり、そもそも受給権を取得しない。",src:"法59条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"ウ",q:"厚生労働大臣が支給する年金たる保険給付の受給権者が、正当な理由がなくて、厚生年金保険法第98条第3項の規定による届出をせず、又は書類その他の物件を提出しないときは、保険給付の全部又は一部を行わないことができる。",a:false,exp:"設問の場合、保険給付の支払を「一時差し止める」ことができる（全部又は一部を行わないのではない）。",src:"法78条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"エ",q:"実施機関は、厚生年金保険法第78条の2の規定によるいわゆる合意分割に係る標準報酬改定請求があった場合において、第1号改定者が標準報酬月額を有する対象期間に係る被保険者期間の各月ごとに、第1号改定者の標準報酬月額を、改定前の標準報酬月額（同法第26条第1項の規定により同項に規定する従前標準報酬月額が当該月の標準報酬月額とみなされた月にあっては、従前標準報酬月額）に1から改定割合を控除して得た率を乗じて得た額に改定することができる。",a:true,exp:"設問の通り正しい。",src:"法78条の6第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"オ",q:"実施機関は、被保険者が賞与を受けた月において、その月に当該被保険者が受けた賞与額に基づき、これに1,000円未満の端数を生じたときはこれを切り捨てて、その月における標準賞与額を決定する。ただし、その月に当該被保険者が受けた賞与によりその年度における標準賞与額の累計額が150万円（厚生年金保険法第20条第2項の規定による標準報酬月額の等級区分の改定が行われたときは、政令で定める額。以下本問において同じ。）を超えることとなる場合には、当該累計額が150万円となるようその月の標準賞与額を決定し、その年度においてその月の翌月以降に受ける賞与の標準賞与額は零となる。",a:false,exp:"賞与額に1,000円未満の端数を切り捨てて標準賞与額を決定する場合において、「当該標準賞与額が150万円（…）を超えるときは、これを150万円とする」。設問のように翌月以降の標準賞与額が零となるのではない。",src:"法24条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"A",q:"第1号厚生年金被保険者（船舶所有者に使用される者を除く。）の資格喪失の届出は、原則として、当該事実があった日から5日以内に、厚生年金保険被保険者資格喪失届・70歳以上被用者不該当届又は当該届書に記載すべき事項を記録した光ディスクを日本年金機構に提出することによって行う。",a:true,exp:"設問の通り正しい。",src:"則22条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"B",q:"日本年金機構において国の毎会計年度所属の保険料等を収納するのは、翌年度の4月30日限りとされている。",a:true,exp:"設問の通り正しい。",src:"令4条の7",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"C",q:"各支払期月における年金の支払額に1円未満の端数が生じたときは、これを切り捨てるものとされ、毎年3月から翌年2月までの間においてこの切り捨てられた金額の合計額（1円未満の端数が生じたときは、これを切り捨てた額）については、これを当該2月の支払期月の年金額に加算するものとされている。",a:true,exp:"設問の通り正しい。",src:"法36条の2",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"D",q:"第1号厚生年金被保険者に係る事業主は、その厚生年金保険に関する書類を、その完結の日から2年間、保存しなければならない。",a:true,exp:"設問の通り正しい。",src:"則28条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"E",q:"被保険者が死亡し、当該被保険者の配偶者と子のそれぞれが遺族基礎年金及び遺族厚生年金の受給権を取得した場合、子に対する遺族厚生年金が子の所在不明により支給停止されていない限り、子が遺族基礎年金の受給権を有する間、配偶者に対する遺族厚生年金の支給が停止される。",a:false,exp:"配偶者に対する遺族厚生年金は、「配偶者が遺族基礎年金の受給権を有しない場合」であって子が当該遺族基礎年金の受給権を有するときに、その間支給が停止される。本肢の配偶者は遺族基礎年金の受給権を取得しているため、配偶者に対する遺族厚生年金の支給は「停止されない」。",src:"法66条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"A",q:"【延滞金が徴収される場合として正しいか】督促された保険料額が1,000円未満である場合。",a:false,exp:"本肢の場合には延滞金は徴収されない。",src:"法87条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"B",q:"【延滞金が徴収される場合として正しいか】納付義務者の住所若しくは居所が国内にないため、又はその住所及び居所がともに明らかでないため、公示送達の方法によって督促した場合。",a:false,exp:"本肢の場合には延滞金は徴収されない。",src:"法87条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"C",q:"【延滞金が徴収される場合として正しいか】保険料の納期が繰り上げられて徴収される場合。",a:false,exp:"本肢の場合には延滞金は徴収されない。",src:"法87条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"D",q:"【延滞金が徴収される場合として正しいか】督促状に指定された期限の翌日から3月を経過する日までの間に保険料を完納した場合。",a:true,exp:"督促状に指定した期限までに保険料を完納した場合には延滞金は徴収されないが、本肢の場合は督促状に指定した期限よりも後に納付をしているため、延滞金が徴収される。",src:"法87条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"E",q:"【延滞金が徴収される場合として正しいか】保険料の滞納につきやむを得ない事情があると認められる場合。",a:false,exp:"本肢の場合には延滞金は徴収されない。",src:"法87条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"A",q:"老齢厚生年金の受給権者が令和8年8月31日に死亡した場合、当該老齢厚生年金は同年9月分まで支給される。",a:false,exp:"老齢厚生年金の受給権は受給権者が死亡したときは消滅し、年金の支給は権利が消滅した月で終わる。本肢では死亡日である令和8年8月31日に受給権が消滅するため、老齢厚生年金は「令和8年8月分」まで支給される。",src:"法36条1項・法45条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"B",q:"障害厚生年金の給付事由となった障害について障害基礎年金を受けることができない場合において、障害厚生年金の額が国民年金法第33条第1項に規定する障害基礎年金の額に3分の2を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）に満たないときは、当該額が障害厚生年金の額となる。",a:false,exp:"障害厚生年金の額が障害等級2級の障害基礎年金の額（子の加算額を除く）に「4分の3」を乗じて得た額（100円未満四捨五入）に満たないときは、当該額が障害厚生年金の額となる。",src:"法50条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"C",q:"加給年金額の対象者がある障害厚生年金の受給権者は、当該障害厚生年金の額の全部につき支給が停止されている場合を除き、毎年、指定日までに、加給年金額の対象者の氏名及び生年月日並びにその者が受給権者によって生計を維持している旨その他一定の事項を記載した届書を、日本年金機構に提出しなければならないが、当該障害厚生年金の裁定が行われた日以後1年以内に指定日が到来する年には、当該届書を提出することを要しない。",a:true,exp:"設問の通り正しい。なお、本肢の「指定日」とは、受給権者の誕生日の属する月の末日をいう。",src:"則51条の3",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"D",q:"個人で常時5人以上の小売業を営んでいた適用事業所の事業主が、その業種を変更し、飲食店業を営むこととなった場合、その変更した日から当該事業所は適用事業所でなくなる。",a:false,exp:"強制適用事業所（船舶を除く）が事業内容の変更又は従業員の減少により強制適用事業所に該当しなくなったときは、その事業所について「任意適用の認可があったものとみなされる」。したがって本肢の事業所は「引き続き適用事業所に該当する」。",src:"法6条・法7条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"E",q:"被保険者期間を25年以上有しているが、当該被保険者期間がすべて離婚時みなし被保険者期間である者が死亡した場合、その者の遺族に遺族厚生年金は支給されない。",a:false,exp:"いわゆる長期要件に該当する場合の「被保険者であった者」には、離婚時みなし被保険者期間を有する者が含まれる。したがって本肢の場合は、その者の所定の遺族に遺族厚生年金が「支給される」。",src:"法58条1項・法78条の11",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"ア",q:"年金たる保険給付（厚生年金保険法の他の規定又は他の法令の規定によりその全額につき支給を停止されている年金たる保険給付を除く。）は、その受給権者の申出により、その全部又は一部の支給が停止されるが、その停止する金額は受給権者が任意に決定することができる。",a:false,exp:"年金たる保険給付は、その受給権者の申出により、原則として、その「全額」の支給が停止される。したがって「受給権者が支給停止額を任意に決定することができるものではない」。",src:"法38条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"イ",q:"厚生労働大臣が支給する老齢厚生年金の受給権者（厚生労働大臣が住民基本台帳法第30条の9の規定により機構保存本人確認情報の提供を受けることができる者を除く。）は、その住所を変更したときは、10日以内に、所定の事項を記載した届書を、日本年金機構に提出しなければならない。",a:true,exp:"設問の通り正しい。",src:"則38条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"ウ",q:"政府は、財政の現況及び見通しを作成するに当たり、厚生年金保険事業の財政が、財政均衡期間の終了時に保険給付の支給に支障が生じないようにするために必要な積立金を政府等が保有しつつ当該財政均衡期間にわたってその均衡を保つことができないと見込まれる場合には、保険給付の額を調整するものとし、政令で、保険給付の額を調整する期間の開始年度を定めるものとされている。",a:true,exp:"設問の通り正しい。なお、財政の現況及び見通しにおいて調整を行う必要がなくなったと認められるときは、政令で、調整期間の終了年度を定めるものとされている。",src:"法34条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"エ",q:"2以上の種別の被保険者であった期間を有する者に係る老齢厚生年金の加給年金額の加算は、各号の厚生年金被保険者期間のうち一の期間に基づく老齢厚生年金のうち最も早い日において受給権を取得したもの（60歳台前半の老齢厚生年金（65歳に達する日の前日において加給年金額が加算されていたものに限る。）の受給権者であった者が65歳に達したときに支給する老齢厚生年金については、当該60歳台前半の老齢厚生年金の額の計算の基礎となる被保険者期間に係る被保険者の種別に係る被保険者期間を計算の基礎とする老齢厚生年金）について行われる。この場合において、当該最も早い日において受給権を取得した老齢厚生年金が2以上あるときは、原則として、各号の厚生年金被保険者期間のうち最も長い一の期間に基づく老齢厚生年金について加給年金額が加算される。",a:true,exp:"設問の通り正しい。",src:"法78条の27・令3条の13第2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"オ",q:"2以上の適用事業所（船舶を除く。）の事業主が同一である場合には、当該事業主は、厚生労働大臣の承認を受けて、当該2以上の事業所を一の適用事業所とすることができる。",a:true,exp:"設問の通り正しい。",src:"法8条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"A",q:"厚生労働大臣が支給する老齢厚生年金の受給権が裁定された場合において、その受給権者が老齢基礎年金の年金証書の交付を受けている場合、当該老齢厚生年金に係る年金証書は交付されない。この場合、当該老齢基礎年金の年金証書は当該老齢厚生年金の年金証書とみなされる。",a:true,exp:"設問の通り正しい。",src:"則82条2項・3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"B",q:"当分の間、特定適用事業所以外の適用事業所（国又は地方公共団体の適用事業所を除く。）に使用される特定4分の3未満短時間労働者については、原則として、被保険者とされない。",a:true,exp:"設問の通り正しい。",src:"平24法附則17条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"C",q:"定年後の再雇用期間が終了したため、65歳の誕生日の属する月である令和8年3月に適用事業所を退職した老齢厚生年金の受給権者が、同年8月1日に他の適用事業所に就職して再び被保険者の資格を取得した。この場合において、その者の総報酬月額相当額と基本月額との合計額が支給停止調整額を超える場合、在職老齢年金の規定による支給停止は令和8年8月分から行われる。",a:false,exp:"在職老齢年金による支給停止は、老齢厚生年金の受給権者が被保険者（「前月以前の月に属する日から引き続き当該被保険者の資格を有する者に限る」）である日が属する月において行われる。本肢の者は同年7月は被保険者でなかったため、令和8年8月においては該当せず、「令和8年8月分の老齢厚生年金について在職老齢年金の規定による支給停止は行われない」。",src:"法46条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"D",q:"障害等級3級の障害厚生年金の受給権者（当該障害厚生年金の受給権を取得した当時から引き続き障害等級1級又は2級に該当したことはなかったものとする。）が、66歳の時に障害の程度が増進し、障害等級2級に該当する程度の障害の状態に至った場合、障害の程度が増進したことによる障害厚生年金の額の改定を請求することはできない。",a:true,exp:"設問の通り正しい。障害の程度が増進したことによる障害厚生年金の額の改定請求の規定は、65歳以上の障害厚生年金の受給権者（当該障害厚生年金と同一の支給事由に基づく障害基礎年金の受給権を有しないものに限る）については、適用されない。",src:"法52条7項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"E",q:"日本国内に住所を有していない障害等級2級の50歳の障害厚生年金の受給権者が死亡し、その者の唯一の遺族である10歳の子が遺族厚生年金の受給権を取得したが、死亡した者がその死亡の当時、国民年金の被保険者でなく、かつ、保険料納付済期間、保険料免除期間及び合算対象期間を合算した期間が25年未満であったために、子は遺族基礎年金の受給権は取得しなかった。この場合、その子に支給される遺族厚生年金の額に遺族基礎年金の額に相当する額が加算される。",a:true,exp:"設問の通り正しい。",src:"昭60法附則74条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"A",q:"実施機関積立金の運用は、厚生年金保険法第79条の2に規定する積立金の運用目的に沿って、実施機関が行うものとされている。ただし、実施機関積立金の一部については、政令で定めるところにより、国家公務員共済組合法、地方公務員等共済組合法又は私立学校教職員共済法の目的に沿って運用することができるものとされている。",a:true,exp:"設問の通り正しい。",src:"法79条の3第3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"B",q:"主務大臣は、毎年度、積立金の資産の額、その構成割合、運用収入の額、積立金の運用の状況の評価その他の積立金の管理及び運用に関する事項を記載した報告書を作成し、これを公表するものとされているが、当該報告書を作成しようとするときは、厚生労働大臣は、あらかじめ、その案を作成し、財務大臣、総務大臣及び文部科学大臣に協議するものとされている。",a:true,exp:"設問の通り正しい。",src:"法79条の9第1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"C",q:"管理運用主体は、積立金の管理及び運用が長期的な観点から安全かつ効率的に行われるようにするための基本的な指針である積立金基本指針を定めるものとされている。",a:false,exp:"積立金基本指針を定めるものとされているのは「主務大臣」である（管理運用主体ではない）。なお主務大臣とは、厚生労働大臣、財務大臣、総務大臣及び文部科学大臣をいう。",src:"法79条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"D",q:"管理運用主体は、積立金基本指針に適合するよう、共同して、管理運用の方針において「管理積立金の管理及び運用における長期的な観点からの資産の構成に関する事項」を定めるに当たって参酌すべき積立金の資産の構成の目標を定めなければならない。",a:true,exp:"設問の通り正しい。",src:"法79条の5第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"E",q:"管理運用主体は、各事業年度の決算完結後（年金積立金管理運用独立行政法人については、独立行政法人通則法第38条第1項の規定による同項に規定する財務諸表の提出後）、遅滞なく、当該事業年度における管理積立金の資産の額、その構成割合、運用収入の額その他の主務省令で定める事項を記載した業務概況書を作成し、これを公表するとともに、所管大臣に送付しなければならない。",a:true,exp:"設問の通り正しい。",src:"法79条の8第1項・4項",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄A",context:"30歳の甲（船舶所有者に使用される船員には該当しない。）は、令和8年7月1日から同年8月31日までの2か月間の労働契約を締結して適用事業所Xに使用された。当初の労働契約では労働契約を更新しないことについて合意していたが、令和8年8月1日に事業主と甲が協議の上で労働契約を更新しないことについての合意を撤回したため、同日に甲は契約の更新が見込まれるに至った。この場合、甲は、【A】。",choices:["令和8年8月1日に被保険者資格を取得する", "令和8年7月1日に被保険者資格を取得する", "令和8年9月1日に被保険者資格を取得する", "被保険者資格を取得しない"],answer:"令和8年8月1日に被保険者資格を取得する",exp:"2月以内の期間を定めて使用される者で、当初の雇用契約期間を超えて使用しないことを労使双方で合意していたため使用開始時に被保険者資格を取得しなかった者について、契約期間中に当該合意を撤回し最初の雇用契約の期間を超えて使用される見込みが生じた場合は、「契約の更新が見込まれるに至った日」に被保険者資格を取得する。本問では合意を撤回し更新が見込まれるに至った令和8年8月1日に取得する。",src:"法12条・令4.9.9事務連絡",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択2",opt:"空欄B",context:"第1号厚生年金被保険者である乙は、妻が出産したため、令和8年7月6日から同月26日まで育児休業を取得した。また、令和8年7月10日に乙に対して賞与が支給された。この場合において、事業主が実施機関に厚生年金保険法第81条の2第1項の規定による育児休業等期間中の保険料免除に関する申出をしたときは、令和8年7月の標準報酬月額に係る保険料は【B】。",choices:["免除されるが、同月10日支給の賞与に係る標準賞与額についての保険料は免除されない", "免除され、同月10日支給の賞与に係る標準賞与額についての保険料も免除される", "免除されず、同月10日支給の賞与に係る標準賞与額についての保険料も免除されない", "免除されないが、同月10日支給の賞与に係る標準賞与額についての保険料は免除される"],answer:"免除されるが、同月10日支給の賞与に係る標準賞与額についての保険料は免除されない",exp:"育児休業等を開始した日の属する月と終了する日の翌日が属する月とが同一であり、かつ当該月の育児休業等の日数が「14日以上」であるときは、その月の標準報酬月額に係る保険料が免除される。本問は同一月内かつ日数14日以上のため標準報酬月額に係る保険料は免除されるが、育児休業等の期間が1月以下であるため標準賞与額に係る保険料は免除されない。",src:"法81条の2第1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択3",opt:"空欄C",context:"厚生年金保険法第25条の規定によると、報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合においては、その価額は、その地方の時価によって、【C】が定めるものとされている。",choices:["厚生労働大臣", "財務大臣", "実施機関", "適用事業所の事業主"],answer:"厚生労働大臣",exp:"報酬又は賞与の全部又は一部が通貨以外のもの（現物給与）で支払われる場合、その価額は、その地方の時価によって「厚生労働大臣」が定める。",src:"法25条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択4",opt:"空欄D",context:"厚生年金保険法第76条第1項の規定によると、遺族厚生年金は、被保険者又は被保険者であった者を【D】死亡させた者には、支給しないものとされている。",choices:["故意に", "故意又は重大な過失により", "自己の故意の犯罪行為又は重大な過失により", "不法行為又は過失により"],answer:"故意に",exp:"遺族厚生年金は、被保険者又は被保険者であった者を「故意に」死亡させた者には、支給しない。",src:"法76条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択5",opt:"空欄E",context:"積立金の運用に係る行政事務に従事する厚生労働省、財務省、総務省及び文部科学省の職員（政令で定める者に限る。）は、積立金の運用の目的に沿って、【E】、全力を挙げてその職務を遂行しなければならない。",choices:["慎重かつ細心の注意を払い", "自己の財産に対するのと同一の注意をもって", "善良な管理者の注意をもって", "誠実かつ熱心に"],answer:"慎重かつ細心の注意を払い",exp:"運用職員は、積立金の運用の目的に沿って、「慎重かつ細心の注意を払い」、全力を挙げてその職務を遂行しなければならない。",src:"法79条の10",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択6",opt:"空欄A",context:"政府は、少なくとも5年ごとに、保険料及び国庫負担の額並びにこの法律による保険給付に要する費用の額その他の厚生年金保険事業の財政に係る収支についてその現況及び財政均衡期間における見通し（以下本問において「財政の現況及び見通し」とする。）を作成しなければならないとされており、政府は、当該財政の現況及び見通しを作成したときは、【A】。",choices:["遅滞なく、これを公表しなければならない", "速やかに、これを公表しなければならない", "速やかに、これを公表するよう努めなければならない", "遅滞なく、これを公表するよう努めなければならない"],answer:"遅滞なく、これを公表しなければならない",exp:"政府は、財政の現況及び見通しを作成したときは、「遅滞なく、これを公表しなければならない」。",src:"法2条の4第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択7",opt:"空欄B",context:"厚生年金保険法の標準報酬月額は、被保険者の報酬月額に基づき、同法第20条第1項に規定される等級区分（同条第2項の規定により等級区分の改定が行われたときは、改定後の等級区分）によって定めるものとされている。当該標準報酬月額は、現在のところ、【B】となっている。",choices:["最低88,000円（第1級）から最高650,000円（第32級）", "最低58,000円（第1級）から最高650,000円（第32級）", "最低58,000円（第1級）から最高1,390,000円（第50級）", "最低88,000円（第1級）から最高1,390,000円（第50級）"],answer:"最低88,000円（第1級）から最高650,000円（第32級）",exp:"厚生年金保険の標準報酬月額は、現在のところ「最低88,000円（第1級）から最高650,000円（第32級）」の32等級となっている。",src:"法20条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択8",opt:"空欄C",context:"令和8年4月から令和9年3月までの月分に係る第4号厚生年金被保険者に係る保険料率は、【C】である。",choices:["1,000分の182.48", "1,000分の175.40", "1,000分の178.94", "1,000分の183"],answer:"1,000分の182.48",exp:"第4号厚生年金被保険者（私学共済）に係る保険料率は段階的に引き上げられており、令和8年4月から令和9年3月までの月分は「1,000分の182.48」である（第1号〜第3号は1,000分の183.00で固定）。",src:"平24一元化法附則",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択9",opt:"空欄D",context:"毎月の保険料は、【D】までに、納付しなければならない。",choices:["翌月末日", "その月の10日", "その月の月末", "翌月の10日"],answer:"翌月末日",exp:"毎月の保険料は、「翌月末日」までに納付しなければならない。",src:"法83条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択10",opt:"空欄E",context:"厚生労働大臣は、納入の告知をした保険料額が当該納付義務者が納付すべき保険料額をこえていることを知ったとき、又は納付した保険料額が当該納付義務者が納付すべき保険料額をこえていることを知ったときは、そのこえている部分に関する納入の告知又は納付を、その納入の告知又は納付の日の翌日から【E】以内の期日に納付されるべき保険料について納期を繰り上げてしたものとみなすことができる。",choices:["6箇月", "3箇月", "1年", "2年"],answer:"6箇月",exp:"過誤納（こえている部分）に関する納入の告知又は納付は、その告知又は納付の日の翌日から「6箇月」以内の期日に納付されるべき保険料について納期を繰り上げてしたものとみなすことができる。",src:"法83条の2",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択11",opt:"空欄A",context:"厚生年金保険法第68条第1項において、「配偶者以外の者に対する遺族厚生年金の受給権者が2人以上ある場合において、受給権者のうち1人以上の者の所在が【A】以上明らかでないときは、その者に対する遺族厚生年金は、他の受給権者の申請によって、その所在が明らかでなくなった時にさかのぼって、その支給が停止する。」と規定されている。",choices:["1年", "2年", "3月", "5年"],answer:"1年",exp:"配偶者以外の者に対する遺族厚生年金の受給権者が2人以上ある場合において、受給権者のうち1人以上の者の所在が「1年」以上明らかでないときは、他の受給権者の申請によって、その所在が明らかでなくなった時にさかのぼって支給が停止される。",src:"法68条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択12",opt:"空欄B",context:"厚生年金保険法第68条第1項により所在不明を理由として遺族厚生年金の支給を停止された者は、【B】、その支給の停止の解除を申請することができる。",choices:["いつでも", "その事実が生じたときから2年以内に", "その事実を知ったときから1年以内に", "その事実を知ったときから2年以内に"],answer:"いつでも",exp:"所在不明を理由として支給を停止された者は、「いつでも」、その支給の停止の解除を申請することができる。",src:"法68条2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択13",opt:"空欄C",context:"厚生年金保険法第90条第1項の審査請求をした日【C】以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。",choices:["から2月", "から6月", "の翌日から2月", "の翌日から6月"],answer:"から2月",exp:"審査請求をした日「から2月」以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。",src:"法90条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択14",opt:"空欄D",context:"厚生年金保険法第100条の2第4項において、「実施機関は、年金たる保険給付に関する処分に関し必要があると認めるときは、【D】に対し、必要な資料の提供を求めることができる。」と規定されている。",choices:["衆議院議長、参議院議長又は地方公共団体の議会の議長", "社会保障審議会", "社会保険審査会", "日本年金機構"],answer:"衆議院議長、参議院議長又は地方公共団体の議会の議長",exp:"実施機関は、年金たる保険給付に関する処分に関し必要があると認めるときは、「衆議院議長、参議院議長又は地方公共団体の議会の議長」に対し、必要な資料の提供を求めることができる。",src:"法100条の2第4項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択15",opt:"空欄E",context:"厚生年金保険法施行規則第28条において、「事業主は、その厚生年金保険に関する書類を、その完結の日より【E】年間、保存しなければならない。」と規定されている。",choices:["2", "4", "3", "6"],answer:"2",exp:"事業主は、その厚生年金保険に関する書類を、その完結の日より「2年間」、保存しなければならない。",src:"則28条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択16",opt:"空欄A",context:"厚生年金保険法第58条第1項の遺族厚生年金の支給要件において、「ただし、第一号又は第二号に該当する場合にあっては、死亡した者につき、【A】までに国民年金の被保険者期間があり、かつ、当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の3分の2に満たないときは、この限りでない。」と規定されている。",choices:["死亡日の前日において、死亡日の属する月の前々月", "死亡日において、死亡日の属する月の前月", "死亡日において、死亡日の属する月の前々月", "死亡日の前日において、死亡日の属する月の前月"],answer:"死亡日の前日において、死亡日の属する月の前々月",exp:"短期要件（第一号・第二号）の保険料納付要件は、死亡した者につき「死亡日の前日において、死亡日の属する月の前々月」までに国民年金の被保険者期間があり、当該期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の3分の2に満たないときは支給されない。",src:"法58条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択17",opt:"空欄B",context:"厚生年金保険法第58条第1項のただし書において、死亡した者につき、死亡日の前日において死亡日の属する月の前々月までに国民年金の被保険者期間があり、かつ、当該被保険者期間に係る保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の【B】ときは、遺族厚生年金は支給されない（保険料納付要件）。",choices:["3分の2に満たない", "3分の2以下である", "4分の3以下である", "4分の3に満たない"],answer:"3分の2に満たない",exp:"保険料納付済期間と保険料免除期間とを合算した期間が当該被保険者期間の「3分の2に満たない」ときは、保険料納付要件を満たさず遺族厚生年金は支給されない。",src:"法58条1項ただし書",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択18",opt:"空欄C",context:"厚生年金保険法第58条第1項第一号の遺族厚生年金の支給要件として、「被保険者（【C】被保険者であった者であって、行方不明となった当時被保険者であったものを含む。）が、死亡したとき。」がある。",choices:["失踪の宣告を受けた", "日本国籍を有しない", "日本国内に生活の基礎があった", "保険料に係る滞納処分を受けた"],answer:"失踪の宣告を受けた",exp:"第一号の被保険者には、「失踪の宣告を受けた」被保険者であった者であって、行方不明となった当時被保険者であったものを含む。",src:"法58条1項1号",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択19",opt:"空欄D",context:"厚生年金保険法第58条第1項第三号の遺族厚生年金の支給要件として、「障害等級の【D】に該当する障害の状態にある障害厚生年金の受給権者が、死亡したとき。」がある。",choices:["1級又は2級", "1級", "1級、2級又は3級", "3級"],answer:"1級又は2級",exp:"第三号は、障害等級の「1級又は2級」に該当する障害の状態にある障害厚生年金の受給権者が死亡したとき（短期要件）である。",src:"法58条1項3号",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択20",opt:"空欄E",context:"厚生年金保険法第58条第1項第四号の遺族厚生年金の支給要件（長期要件）として、「保険料納付済期間と保険料免除期間とを合算した期間が【E】年以上である者が、死亡したとき。」がある。",choices:["25", "10", "15", "20"],answer:"25",exp:"第四号（長期要件）は、保険料納付済期間と保険料免除期間とを合算した期間が「25年以上」である者が死亡したときである。",src:"法58条1項4号",cat:"選択式（LEC公開模試）"},
{no:"TAC全国中間-問1",opt:"A",q:"常時5人以上の従業員を使用する個人経営の宿泊業を営む事業所は、強制適用事業所となる。",a:false,exp:"法6条1項。宿泊業は非適用業種であるため、常時使用する従業員の数にかかわらず、強制適用事業所とされない。",src:"法6条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問1",opt:"B",q:"被保険者であった70歳以上の者が、日々雇い入れられる者として船舶以外の適用事業所に臨時に使用されている場合、その者は、厚生年金保険法第27条に規定する「70歳以上の使用される者」には該当しない。なお、この者は、1月を超えて引き続き使用されるに至っていないものとする。",a:true,exp:"法12条1号イ、法27条、則10条の4。設問の通り正しい。「70歳以上の使用される者」とは、被保険者であった70歳以上の者であって、適用事業所に使用され、かつ、法12条各号（適用除外）に定める者に該当しないものをいう。",src:"法12条1号イ・法27条・則10条の4",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問1",opt:"C",q:"2以上の船舶の船舶所有者が同一である場合には、当該2以上の船舶は、1の適用事業所とする。この場合において、当該2以上の船舶は、厚生年金保険法第6条の適用事業所でないものとみなす。",a:true,exp:"法8条の3。設問の通り正しい。2以上の船舶の船舶所有者が同一である場合には、当該2以上の船舶は、法律上当然に1の適用事業所とされる。また、この場合において、当該2以上の船舶は、適用事業所でないものとみなされる。",src:"法8条の3",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問1",opt:"D",q:"第2号厚生年金被保険者に係る厚生年金保険法第84条の5第1項の規定による拠出金の納付に関する事務は、国家公務員共済組合連合会が行う。",a:true,exp:"法2条の5第2項。設問の通り正しい。",src:"法2条の5第2項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問1",opt:"E",q:"厚生年金保険の短時間労働者への適用に係る経過措置における特定適用事業所とは、事業主が同一である1又は2以上の適用事業所（国又は地方公共団体の適用事業所を除く。以下本肢において同じ。）であって、当該1又は2以上の適用事業所に使用される特定労働者の総数が常時50人を超えるものの各適用事業所をいう。",a:true,exp:"（24）法附則17条12項。設問の通り正しい。なお、設問の特定労働者とは、70歳未満の者のうち、法12条各号（適用除外）のいずれにも該当しないものであって、特定4分の3未満短時間労働者以外のものをいう。",src:"（24）法附則17条12項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問2",opt:"ア",q:"第1号厚生年金被保険者であった期間を有する男性（昭和41年4月10日生まれ）が60歳から老齢基礎年金及び老齢厚生年金の繰上げ支給を受けた。この場合、この者が支給繰上げの請求日以後において第1号厚生年金被保険者としての被保険者期間を有したとしても、65歳に達するまでの間は、在職定時改定は行われず、また、退職した場合であっても退職改定は行われない。なお、この者は第1号厚生年金被保険者期間以外に被保険者期間を有さず、また、坑内員及び船員であったことはないものとする。",a:true,exp:"法附則15条の2。設問の通り正しい。",src:"法附則15条の2",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問2",opt:"イ",q:"厚生年金保険法附則第7条の3第3項の規定によれば、同条第1項（老齢厚生年金の支給の繰上げ）の請求があったときは、同法第42条の規定にかかわらず、その請求があった日の属する月から、その者に老齢厚生年金を支給するとされている。",a:true,exp:"法附則7条の3第3項。設問の通り正しい。なお、設問の「請求があった日の属する月から、その者に繰上げ支給の老齢厚生年金を支給する」とは、請求があった日の属する月に受給権が発生するという意味であり、実際に支給が開始されるのは、請求があった日の属する月の翌月からである。",src:"法附則7条の3第3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問2",opt:"ウ",q:"老齢厚生年金の支給繰上げの際に減じる額は、請求日の属する月までの被保険者期間を基礎として計算した老齢厚生年金の額に減額率を乗じて得た額とする。",a:false,exp:"令6条の3。設問の「属する月まで」を「属する月の前月まで」に置き換えると正しい記述となる。",src:"令6条の3",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問2",opt:"エ",q:"65歳に達した日に老齢厚生年金の受給権を取得した者が、同日において、障害基礎年金の受給権を有していたときは、老齢厚生年金の支給繰下げの申出を行うことはできない。",a:false,exp:"法44条の3第1項。65歳に達し老齢厚生年金の受給権を取得したときに、障害基礎年金の受給権を有する者であっても、他の要件を満たす限り、老齢厚生年金の支給繰下げの申出を行うことができる。",src:"法44条の3第1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問2",opt:"オ",q:"2以上の種別の被保険者であった期間を有する者に係る老齢厚生年金について、一の種別の厚生年金被保険者期間に基づく老齢厚生年金についての支給繰下げの申出は、他の種別の厚生年金被保険者期間に基づく老齢厚生年金についての当該申出と同時に行う必要はない。",a:false,exp:"法78条の28第2項。設問の支給繰下げの申出は、他の種別の厚生年金被保険者期間に基づく老齢厚生年金についての当該申出と同時に行わなければならない。",src:"法78条の28第2項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問3",opt:"A",q:"被保険者は、同時に2以上の事業所に使用されるに至ったとき（当該2以上の事業所に係る日本年金機構（以下「機構」という。）の業務が2以上の年金事務所に分掌されている場合に限る。）は、その者に係る機構の業務を分掌する年金事務所を選択しなければならないが、この選択は、2以上の事業所に使用されるに至った日から5日以内に、所定の事項を記載した届書を、機構に提出することによって行うものとする。",a:false,exp:"則1条1項、2項。設問の「5日以内」を「10日以内」に置き換えると正しい記述となる。",src:"則1条1項・2項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問3",opt:"B",q:"事業主は、その厚生年金保険に関する書類を、その完結の日から2年間、保存しなければならない。",a:true,exp:"則28条。設問の通り正しい。",src:"則28条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問3",opt:"C",q:"老齢厚生年金の受給権者の属する世帯の世帯主その他その世帯に属する者は、当該受給権者の所在が1月以上明らかでないときは、速やかに、所定の事項を記載した届書を機構に提出しなければならない。なお、厚生労働大臣は、当該届書が提出されたときであって、必要と認めるときには、当該受給権者に対し、当該受給権者の生存の事実について確認できる書類の提出を求めることができる。",a:true,exp:"則40条の2第1項、3項。設問の通り正しい。設問の所在不明の届書が提出された場合、厚生労働大臣は、当該受給権者の生存の事実を確認するため、当該受給権者に対し当該受給権者の生存の事実を確認できる書類の提出を求めることができ、また、受給権者が正当な理由がなくて、当該書類を提出しないときは、一時差止めを行うこととされている。",src:"則40条の2第1項・3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問3",opt:"D",q:"障害等級の1級又は2級に該当する障害の状態にあることにより遺族厚生年金の受給権を有する子について、当該子が19歳に達した日にその事情がやんだときは、当該子は、10日以内に、所定の事項を記載した届書を、機構に提出しなければならない。",a:true,exp:"則63条1項。設問の通り正しい。遺族厚生年金の受給権者が、設問の事情により失権したときは、10日以内に設問の失権の届出を行わなければならない。",src:"則63条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問3",opt:"E",q:"厚生年金保険法第98条第4項本文の規定によれば、受給権者が死亡したときは、戸籍法の規定による死亡の届出義務者は、10日以内に、その旨を厚生労働大臣に届け出なければならないとされている。",a:true,exp:"法98条4項。設問の通り正しい。なお、厚生労働大臣が住民基本台帳法の規定により当該受給権者に係る機構保存本人確認情報の提供を受けることができる受給権者の死亡について、その死亡の日から7日以内に戸籍法の規定による死亡の届出をした場合には、設問の死亡の届出を行うことを要しない。",src:"法98条4項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問4",opt:"ア",q:"受給権者が65歳に達していない場合において、繰上げ支給の老齢基礎年金と遺族厚生年金は、併給することができる。",a:false,exp:"法38条1項、法附則17条。老齢基礎年金と遺族厚生年金は、受給権者が65歳に達している場合に限り、併給される。",src:"法38条1項・法附則17条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問4",opt:"イ",q:"受給権者が65歳に達している場合において、障害厚生年金と老齢基礎年金は、併給することができる。",a:false,exp:"法38条1項、法附則17条。受給権者が65歳に達している場合であっても、障害厚生年金と老齢基礎年金は、併給することができない。",src:"法38条1項・法附則17条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問4",opt:"ウ",q:"同一の支給事由に基づいて支給される遺族基礎年金と遺族厚生年金は、併給することができる。",a:true,exp:"法38条1項。設問の通り正しい。",src:"法38条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問4",opt:"エ",q:"同一の支給事由に基づいて支給される寡婦年金と遺族厚生年金は、併給することができない。",a:true,exp:"法38条1項。設問の通り正しい。同一の支給事由に基づいて支給されるものであっても、寡婦年金と遺族厚生年金は、併給することができない。",src:"法38条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問4",opt:"オ",q:"受給権者が65歳に達している場合において、旧国民年金法の障害年金と遺族厚生年金は、併給することができる。",a:true,exp:"法38条1項、法附則17条。設問の通り正しい。受給権者が65歳に達している場合であれば、旧国民年金法の障害年金と遺族厚生年金は、併給することができる。",src:"法38条1項・法附則17条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問5",opt:"A",q:"令和8年6月1日から同年同月20日までの間、育児休業を取得した被保険者については、当該6月分の標準報酬月額に係る保険料は免除されるが、当該6月分の標準賞与額に係る保険料は免除されない。なお、賞与は令和8年6月15日に支給されたものとする。",a:true,exp:"法81条の2第1項2号。設問の通り正しい。設問のように、その育児休業を開始した日の属する月とその育児休業が終了する日の翌日が属する月とが同一であり、かつ、当該月における育児休業の日数が14日以上である場合、当該月の標準報酬月額に係る保険料は免除される。一方、標準賞与額に係る保険料は、育児休業の期間が1月以下である場合は免除されないため、令和8年6月15日に支給された賞与に係る保険料は免除されない。",src:"法81条の2第1項2号",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問5",opt:"B",q:"任意単独被保険者及び高齢任意加入被保険者は、育児休業等期間中の保険料免除の対象となる。",a:true,exp:"法81条の2第1項。設問の通り正しい。任意単独被保険者及び高齢任意加入被保険者は、いずれも育児休業等期間中の保険料の免除の規定の対象となる。",src:"法81条の2第1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問5",opt:"C",q:"法人たる納付義務者の代表者が死亡したときは、厚生年金保険法第85条の規定により、第1号厚生年金被保険者に係る保険料は、納期前であっても、すべて徴収することができる。",a:false,exp:"法85条。「法人たる納付義務者の代表者が死亡したとき」は、法85条の繰上徴収の事由には該当しない。",src:"法85条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問5",opt:"D",q:"第1号厚生年金被保険者に係る保険料その他厚生年金保険法の規定による徴収金の先取特権の順位は、国税及び地方税に次ぐものとする。",a:true,exp:"法88条。設問の通り正しい。",src:"法88条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問5",opt:"E",q:"事業主は、第1号厚生年金被保険者に対して通貨をもって賞与を支払う場合においては、第1号厚生年金被保険者の負担すべき標準賞与額に係る保険料に相当する額を当該賞与から控除することができる。",a:true,exp:"法84条2項、法84条の2。設問の通り正しい。なお、事業主は、設問の規定によって保険料を控除したときは、保険料の控除に関する計算書を作成し、その控除額を第1号厚生年金被保険者に通知しなければならない。",src:"法84条2項・法84条の2",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問6",opt:"A",q:"厚生年金保険法第43条第1項に規定する老齢厚生年金の額は、被保険者であった全期間の平均標準報酬額の1000分の5.481に相当する額に被保険者期間の月数を乗じて得た額とされているが、この1000分の5.481は、老齢厚生年金の受給権者が昭和41年4月1日以前に生まれた者である場合については、1000分の7.308から1000分の5.562の範囲で読み替えられることとなる。",a:false,exp:"法43条1項、（60）法附則59条1項、同法附則別表7。設問の「昭和41年4月1日」を「昭和21年4月1日」に置き換えると正しい記述となる。",src:"法43条1項・（60）法附則59条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問6",opt:"B",q:"当分の間、適用事業所以外の事業所に使用される特定4分の3未満短時間労働者については、厚生年金保険法第10条第1項（任意単独被保険者）及び同法附則第4条の5第1項（適用事業所以外の事業所に使用される高齢任意加入被保険者）の規定にかかわらず、厚生年金保険の被保険者としない。",a:true,exp:"（24）法附則17条の3。設問の通り正しい。",src:"（24）法附則17条の3",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問6",opt:"C",q:"令和8年度に65歳に達する甲と乙について、甲は20歳に達した日の属する月から60歳に達した日の属する月の前月まで厚生年金保険の被保険者であり、乙は20歳に達した日の属する月から65歳に達した日の属する月の前月まで厚生年金保険の被保険者であった。この場合、老齢厚生年金の経過的加算額は、甲と乙で異なるものとなる。",a:false,exp:"（60）法附則59条2項。設問の場合、甲と乙の経過的加算額は、同額となる。",src:"（60）法附則59条2項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問6",opt:"D",q:"令和8年4月において、総報酬月額相当額が580,000円の66歳の被保険者（第1号厚生年金被保険者期間のみを有し、前月以前の月に属する日から引き続き当該被保険者の資格を有する者とする。）が、基本月額が100,000円の老齢厚生年金を受給することができる場合、在職老齢年金の仕組みにより月額85,000円の老齢厚生年金が支給停止される。",a:false,exp:"法46条1項、4項、改定率改定令5条。設問の場合、在職老齢年金の仕組みにより月額「15,000円」の老齢厚生年金が支給停止されることとなる（（580,000円＋100,000円－650,000円）×1/2＝15,000円）。",src:"法46条1項・4項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問6",opt:"E",q:"地方公共団体の議会の議員が老齢厚生年金の受給権者である場合であっても、その者が厚生年金保険の被保険者でないときは、在職老齢年金の仕組みは適用されない。",a:false,exp:"法46条1項。地方公共団体の議会の議員が老齢厚生年金の受給権者であるときは、当該議員が厚生年金保険の被保険者でないときであっても、議員報酬の月額及び期末手当の額と老齢厚生年金の額に応じて、在職老齢年金の仕組みが適用される。",src:"法46条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問7",opt:"A",q:"障害厚生年金の支給に係る初診日は、原則として初めて治療目的で医療機関を受診した日とし、健康診断を受けた日（以下「健診日」という。）は初診日として取り扱わないこととされている。ただし、初めて治療目的で医療機関を受診した日の医証が得られない場合であって、医学的見地からただちに治療が必要と認められる健診結果である場合については、請求者から健診日を初診日とするよう申立てがあれば、健診日を初診日とし、健診日を証明する資料（人間ドックの結果など）を求めた上で、初診日を認めることができることとされている。",a:true,exp:"平成27.9.28年管管発0928第6号。設問の通り正しい。",src:"平成27.9.28年管管発0928第6号",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問7",opt:"B",q:"障害厚生年金の給付事由となった障害について国民年金法による障害基礎年金を受けることができない場合において、障害厚生年金の額が国民年金法第33条第1項に規定する障害基礎年金の額に4分の3を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）に満たないときは、厚生年金保険法第50条第1項及び第2項（障害厚生年金の額）の規定にかかわらず、当該額をこれらの項に定める額とする。",a:true,exp:"法50条3項。設問の通り正しい。障害等級3級の障害厚生年金の受給権者には、同一の支給事由による障害基礎年金は支給されない。また、65歳以上の厚生年金保険の被保険者であって老齢厚生年金等の受給権を有しているものは、国民年金の被保険者ではないため、その期間中に初診日のある傷病により障害等級の1級又は2級の障害厚生年金を支給すべき事由が生じた場合であっても、同一の支給事由による障害基礎年金は支給されない。このような場合においては、設問の額が最低保障される。",src:"法50条3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問7",opt:"C",q:"厚生年金保険法第48条第1項（併合認定）の規定による障害厚生年金の額は、その額が同条第2項の規定により消滅した障害厚生年金の額より低額であるときは、同法第50条第1項及び第2項（障害厚生年金の額）の規定にかかわらず、従前の障害厚生年金の額に相当する額とする。",a:true,exp:"法50条4項。設問の通り正しい。障害厚生年金は平均標準報酬額を基に計算されるため、平均標準報酬額の高さの違いにより、併合認定により発生した障害厚生年金よりも、消滅した従前の障害厚生年金の方が高額であることがあり得る。このような場合には、消滅した従前の障害厚生年金の額に相当する額を保障することとされている。",src:"法50条4項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問7",opt:"D",q:"障害厚生年金の受給権者であって、当該障害に係る障害認定日において2以上の種別の被保険者であった期間を有する者に係る当該障害厚生年金の支給に関する事務は、当該障害に係る初診日における被保険者の種別に応じた実施機関が行う。",a:true,exp:"法78条の33第1項。設問の通り正しい。",src:"法78条の33第1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問7",opt:"E",q:"障害厚生年金の額については、当該障害厚生年金の支給事由となった障害に係る障害認定日の属する月以後における被保険者であった期間は、その計算の基礎としない。",a:false,exp:"法51条。設問の「属する月以後」を「属する月後」に置き換えると正しい記述となる。",src:"法51条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問8",opt:"A",q:"保険料納付要件を満たした被保険者が令和8年3月31日に死亡したときは、他の要件を満たす限り、令和8年5月から遺族厚生年金の支給が始まる。",a:false,exp:"法36条1項、法58条1項。保険料納付要件を満たした被保険者が令和8年3月31日に死亡したときは、他の要件を満たす限り、死亡した日の属する月の翌月である令和8年「4月」から遺族厚生年金の支給が始まる。",src:"法36条1項・法58条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問8",opt:"B",q:"被保険者であった者が、被保険者の資格を喪失した後に、被保険者であった間に初診日がある傷病により当該被保険者の資格を喪失した日から起算して5年を経過する日前に死亡したときは、保険料納付要件を満たす限り、所定の遺族に遺族厚生年金が支給される。",a:false,exp:"法58条1項2号。設問の「被保険者の資格を喪失した日から」を「初診日から」に置き換えると正しい記述となる。",src:"法58条1項2号",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問8",opt:"C",q:"2以上の種別の被保険者であった期間を有する者が障害等級1級の障害厚生年金の受給権者であり、当該障害厚生年金の受給権者が死亡したことにより支給される遺族厚生年金の支給の事務については、当該障害厚生年金の支給事由となった傷病に係る障害認定日に係る実施機関が行うものとする。",a:false,exp:"法78条の33第2項、令3条の13の10第3項。設問の遺族厚生年金の支給に関する事務については、当該障害厚生年金の支給事由となった傷病に係る「初診日」における実施機関が行うものとする。",src:"法78条の33第2項・令3条の13の10第3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問8",opt:"D",q:"国外に居住する障害等級2級の障害厚生年金の受給権者（61歳）が死亡し、5歳の子1人が死亡した者の死亡の当時その者によって生計を維持していた遺族として残された。死亡した者は、死亡の当時、国民年金の被保険者ではなく、保険料納付済期間、保険料免除期間及び合算対象期間を合算した期間は25年に満たなかった。この場合、当該子には遺族基礎年金は支給されないが、当該子に支給される遺族厚生年金の額には、遺族基礎年金の額に相当する額が加算される。",a:true,exp:"（60）法附則74条2項。設問の通り正しい。",src:"（60）法附則74条2項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問8",opt:"E",q:"遺族厚生年金を受けることができる遺族は、被保険者又は被保険者であった者の配偶者、子、父母、孫、祖父母又は兄弟姉妹であって、被保険者又は被保険者であった者の死亡の当時その者によって生計を維持したものとする。",a:false,exp:"法59条1項。遺族厚生年金を受けることができる遺族は、被保険者又は被保険者であった者の配偶者、子、父母、孫又は祖父母であって、被保険者又は被保険者であった者の死亡の当時その者によって生計を維持したものとされる（兄弟姉妹は、遺族厚生年金を受けることができる遺族の範囲に含まれない。）。なお、妻以外の者が、遺族厚生年金を受けることができる遺族となるためには、一定の年齢要件や障害要件に該当しなければならない。",src:"法59条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問9",opt:"A",q:"離婚が成立した日等の翌日から起算して5年を経過した場合は、原則として、3号分割標準報酬改定請求をすることはできない。",a:true,exp:"設問の通り正しい。離婚が成立した日等の翌日から起算して5年を経過した場合は、原則として、3号分割標準報酬改定請求をすることはできない。",src:"法78条の14",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問9",opt:"B",q:"離婚等をした場合における標準報酬の改定の特例に係る標準報酬改定請求があったことにより改定され、又は決定された標準報酬は、当該標準報酬改定請求のあった日から将来に向かってのみその効力を有する。",a:true,exp:"法78条の6第4項。設問の通り正しい。設問の通り、いわゆる合意分割の規定により改定され、又は決定された標準報酬は、標準報酬改定請求のあった日から将来に向かってのみその効力を有する。したがって、過去に遡及して保険給付の受給権が発生したり、年金額が改定されたりすることはない。",src:"法78条の6第4項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問9",opt:"C",q:"同一人に対して国民年金法による年金たる給付の支給を停止して年金たる保険給付（厚生労働大臣が支給するものに限る。以下本肢において同じ。）を支給すべき場合において、年金たる保険給付を支給すべき事由が生じた月の翌月以後の分として同法による年金たる給付の支払が行われたときは、その支払われた同法による年金たる給付は、年金たる保険給付の内払とみなすことができる。",a:true,exp:"法39条3項。設問の通り正しい。なお、厚生労働大臣以外の実施機関が支給する年金たる保険給付と国民年金法による年金たる給付との間では、内払調整は行われない。",src:"法39条3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問9",opt:"D",q:"政府及び実施機関（厚生労働大臣を除く。）は、事故が第三者の行為によって生じた場合において、保険給付をしたときは、その給付の価額の限度で、受給権者が第三者に対して有する損害賠償の請求権を取得する。",a:true,exp:"法40条1項。設問の通り正しい。なお、事故が第三者の行為によって生じた場合において、受給権者が、当該第三者から同一の事由について損害賠償を受けたときは、政府等は、その価額の限度で、保険給付をしないことができる。",src:"法40条1項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問9",opt:"E",q:"厚生年金保険法第95条では、「市町村長は、実施機関又は受給権者に対して、当該市町村の条例の定めるところにより、被保険者、被保険者であつた者又は受給権者の戸籍に関し、無料で証明を行わなければならない。」と規定している。",a:false,exp:"法95条。法95条では、「市町村長は、実施機関又は受給権者に対して、当該市町村の条例の定めるところにより、被保険者、被保険者であつた者又は受給権者の戸籍に関し、無料で証明を行うことができる。」と規定している。",src:"法95条",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問10",opt:"A",q:"被保険者の資格、標準報酬に関する処分が確定したときであっても、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることができる。",a:false,exp:"法90条5項。被保険者の資格、標準報酬に関する処分が確定したときは、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることができない。",src:"法90条5項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問10",opt:"B",q:"厚生労働大臣による脱退一時金に関する処分に不服がある者は、社会保険審査官に対して審査請求をすることができるが、当該審査請求は、原則として、その処分があったことを知った日の翌日から起算して3月を経過したときは、することができない。",a:false,exp:"法附則29条6項、社審法附則14項。設問の「社会保険審査官」を「社会保険審査会」に置き換えると正しい記述となる。",src:"法附則29条6項・社審法附則14項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問10",opt:"C",q:"厚生年金保険法第90条第3項の規定によれば、同条第1項の審査請求をした日から3月以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができるとされている。",a:false,exp:"法90条3項。設問の「3月以内」を「2月以内」に置き換えると正しい記述となる。",src:"法90条3項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問10",opt:"D",q:"厚生年金保険法第92条第1項に規定する保険給付を受ける権利又は当該権利に基づき支払期月ごとに支払うものとされる保険給付の支給を受ける権利については、会計法第31条の規定を適用しない。",a:true,exp:"法92条5項。設問の通り正しい。",src:"法92条5項",cat:"択一式（TAC全国中間模試）"},
{no:"TAC全国中間-問10",opt:"E",q:"事業主が、正当な理由がなくて厚生年金保険法第27条の規定に違反して、被保険者の資格の取得及び喪失並びに報酬月額及び賞与額等に関する届出をせず、又は虚偽の届出をしたときは、10万円以下の過料に処せられる。",a:false,exp:"法102条1項1号。設問の場合、事業主は、「6月以下の拘禁刑又は50万円以下の罰金」に処せられる。",src:"法102条1項1号",cat:"択一式（TAC全国中間模試）"},
{type:"select",no:"TAC全国中間-選択7",opt:"空欄A",context:"厚生年金保険の調整期間は令和8年度に終了する見込みであったところ、令和6年における国民年金法第4条の3第1項に規定する財政の現況及び見通し及び厚生年金保険法第2条の4第1項に規定する財政の現況及び見通しを踏まえ、令和8年度から、【A】までの間は、同法第34条第1項及び第2項の規定にかかわらず、同条第1項に規定する調整期間とされる。この場合において、当該調整期間における再評価率の改定については、調整率ではなく、経過的軽減調整率（調整率に1から調整率を控除して得た率に3分の2を乗じて得た率を加えて得た率）を用いて調整を行うこととされる。",choices:["次期財政検証作成年度の翌年度", "次期財政検証作成年度", "次期財政検証作成年度の前年度", "次期財政検証作成年度の翌々年度"],answer:"次期財政検証作成年度の翌年度",exp:"（令和7）法附則3条1項。厚生年金保険の調整期間が令和8年度に終了見込みであったところ、令和8年度から、「次期財政検証作成年度の翌年度」（令和12年度）までの間は、調整期間を継続することとされた。",src:"（令和7）法附則3条1項",cat:"選択式（TAC全国中間模試）"},
{type:"select",no:"TAC全国中間-選択7",opt:"空欄B",context:"厚生年金保険の調整期間は令和8年度に終了する見込みであったところ、令和6年における国民年金法第4条の3第1項に規定する財政の現況及び見通し及び厚生年金保険法第2条の4第1項に規定する財政の現況及び見通しを踏まえ、令和8年度から、次期財政検証作成年度の翌年度までの間は、同法第34条第1項及び第2項の規定にかかわらず、同条第1項に規定する調整期間とされる。この場合において、当該調整期間における再評価率の改定については、調整率ではなく、経過的軽減調整率（調整率に1から調整率を控除して得た率に【B】を乗じて得た率を加えて得た率）を用いて調整を行うこととされる。",choices:["3分の2", "2分の1", "3分の1", "4分の1"],answer:"3分の2",exp:"（令和7）法附則3条1項。経過的軽減調整率は、調整率に「1から調整率を控除して得た率に3分の2を乗じて得た率」を加えて得た率である。つまり、調整に係る率は、本来の率の3分の1に軽減される。",src:"（令和7）法附則3条1項",cat:"選択式（TAC全国中間模試）"},
{type:"select",no:"TAC全国中間-選択7",opt:"空欄C",context:"障害厚生年金の受給権者が死亡し未支給の保険給付が発生した場合において、その者が死亡した当時その者【C】ものが、その者の68歳の母、21歳の子及び90歳の祖母であったときは、当該子が、当該未支給の保険給付の支給を請求することができる。",choices:["と生計を同じくしていた", "と血縁関係にあった", "と親族関係にあった", "によって生計を維持していた"],answer:"と生計を同じくしていた",exp:"法37条1項。未支給の保険給付を受けることができる者は、死亡した者と「生計を同じくしていた」配偶者、子、父母、孫、祖父母、兄弟姉妹又はこれらの者以外の三親等内の親族である。",src:"法37条1項",cat:"選択式（TAC全国中間模試）"},
{type:"select",no:"TAC全国中間-選択7",opt:"空欄D",context:"障害厚生年金の受給権者が死亡し未支給の保険給付が発生した場合において、その者が死亡した当時その者と生計を同じくしていたものが、その者の68歳の母、21歳の子及び90歳の祖母であったときは、当該【D】が、当該未支給の保険給付の支給を請求することができる。",choices:["子", "子及び母", "母", "祖母"],answer:"子",exp:"法37条1項、4項。未支給の保険給付を受けるべき者の順位は、原則として、死亡した者の配偶者、子、父母、孫、祖父母、兄弟姉妹及びこれらの者以外の三親等内の親族の順序とされる。設問の遺族の中で、最先順位であるのは、21歳の子である。",src:"法37条1項・4項",cat:"選択式（TAC全国中間模試）"},
{type:"select",no:"TAC全国中間-選択7",opt:"空欄E",context:"厚生年金保険法第96条第1項の規定によると、実施機関は、必要があると認めるときは、年金たる保険給付の受給権者に対して、その者の【E】その他受給権の消滅、年金額の改定若しくは支給の停止に係る事項に関する書類その他の物件の提出を命じ、又は当該職員をしてこれらの事項に関し受給権者に質問させることができるとされている。",choices:["身分関係、障害の状態", "勤務又は収入の状況", "個人番号、資格の取得及び喪失の年月日", "保険給付の支給の状況"],answer:"身分関係、障害の状態",exp:"法96条1項。例えば、遺族厚生年金の受給権者である子が、離縁により死亡した被保険者等の子の身分を有さなくなった場合、その受給権は消滅する。また、障害等級が低くなる場合、障害厚生年金の額は改定され、又はその支給を停止されることとなる。法96条1項は、このような受給権者の身分関係、障害の状態といった受給権の消滅、年金額の改定若しくは支給の停止に係る事項についての調査権を実施機関に付与するものである。",src:"法96条1項",cat:"選択式（TAC全国中間模試）"},
{no:"TAC全国公開-問1",opt:"A",q:"厚生労働大臣は、厚生年金保険法第10条第1項の規定による任意単独被保険者の資格取得の認可を行ったときは、その旨を当該被保険者に通知しなければならない。",a:false,exp:"法29条1項。厚生労働大臣は、厚生年金保険法10条1項の規定による任意単独被保険者の資格取得の認可を行ったときは、その旨を「事業主（同条2項の同意をした事業主）」に通知しなければならない。なお、事業主は、当該通知があったときは、すみやかに、これを被保険者に通知しなければならない。",src:"法29条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問1",opt:"B",q:"保険料を徴収する権利が時効によって消滅したときは、当該保険料に係る被保険者であった期間に基づく保険給付は、行わない。ただし、当該被保険者であった期間に係る被保険者の資格の取得について、事業主の届出があった後に、保険料を徴収する権利が時効によって消滅したものであるときは、この限りでない。",a:true,exp:"法75条。設問の通り正しい。保険料を徴収する権利が時効によって消滅したときは、当該保険料に係る被保険者であった期間に基づく保険給付は、行わないが、当該被保険者であった期間に係る被保険者の資格の取得について事業主の届出若しくは被保険者等からの確認の請求又は厚生年金保険原簿の訂正の請求があった後に、保険料を徴収する権利が時効によって消滅したものであるときは、上記の保険給付の制限は行わない。",src:"法75条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問1",opt:"C",q:"実施機関は、被保険者の資格を取得した者があるときにおいて、その者について、月、週その他一定期間によって報酬が定められる場合には、被保険者の資格を取得した日の現在の報酬の額をその期間の総日数で除して得た額の30倍に相当する額を報酬月額として、標準報酬月額を決定する。",a:true,exp:"法22条1項1号。設問の通り正しい。なお、設問の規定によって決定された標準報酬月額は、被保険者の資格を取得した月からその年の8月（6月1日から12月31日までの間に被保険者の資格を取得した者については、翌年の8月）までの各月の標準報酬月額とする。",src:"法22条1項1号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問1",opt:"D",q:"遺族厚生年金は、被保険者又は被保険者であった者を故意に死亡させた者には、支給しない。被保険者又は被保険者であった者の死亡前に、その者の死亡によって遺族厚生年金の受給権者となるべき者を故意に死亡させた者についても、同様とする。",a:true,exp:"法76条1項。設問の通り正しい。なお、遺族厚生年金の受給権は、受給権者が他の受給権者を故意に死亡させたときは、消滅する。",src:"法76条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問1",opt:"E",q:"延滞金を計算するにあたり、保険料額に1,000円未満の端数があるときは、その端数は、切り捨てる。",a:true,exp:"法87条3項。設問の通り正しい。なお、保険料額が1,000円未満であるときは、延滞金は徴収されない。延滞金を徴収しない場合は、保険料額が1,000円未満であるとき、納期を繰り上げて徴収するとき、公示送達の方法によって督促したとき、督促状の指定の期限までに保険料を完納したとき、延滞金の金額が100円未満であるとき、滞納につきやむを得ない事情があると認められるときである。",src:"法87条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問2",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】適用事業所に使用される高齢任意加入被保険者（保険料の半額負担及び保険料の納付義務を負うことについての事業主の同意はないものとする。）は、将来の一定期間の保険料を前納することができる。",a:false,exp:"法83条1項他。設問の高齢任意加入被保険者について、前納の規定は設けられていない。",src:"法83条1項他",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問2",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】政府は、厚生年金保険法第79条第1項第3号に規定する事業（被保険者、受給権者その他の関係者（以下本肢において「被保険者等」という。）に対し、被保険者等が行う手続に関する情報その他の被保険者等の利便の向上に資する情報を提供すること。）を、日本年金機構に行わせることはできない。",a:false,exp:"法79条3項。政府は、設問の事業の全部又は一部を日本年金機構に行わせることができる。政府等は、厚生年金保険事業の円滑な実施を図るため、教育及び広報を行うこと、被保険者等に対し相談その他の援助を行うこと、被保険者等に対し手続に関する情報等を提供することができる。",src:"法79条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問2",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法第26条第1項に規定する3歳に満たない子を養育する被保険者又は被保険者であった者（以下本問において「被保険者等」という。）の標準報酬月額の特例に係る従前標準報酬月額とは、当該子を養育することとなった日の属する月の前月（当該月において被保険者でない場合にあっては、当該月前1年以内における被保険者であった月のうち直近の月。以下本肢において「基準月」という。）の標準報酬月額（同項の規定により当該子以外の子に係る基準月の標準報酬月額が標準報酬月額とみなされている場合にあっては、当該みなされた基準月の標準報酬月額）をいう。",a:true,exp:"法26条1項。設問の通り正しい。",src:"法26条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問2",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】第1子の育児休業終了による職場復帰後に厚生年金保険法第26条に規定する3歳に満たない子を養育する被保険者等の標準報酬月額の特例が適用された被保険者の従前標準報酬月額は36万円であったが、育児休業等終了時改定に該当し標準報酬月額は32万円に改定された。その後、当該被保険者は第2子の出産のため出産の日以前42日から同法第81条の2の2第1項の適用を受ける産前産後休業を取得し、第2子を出産し産後休業終了後に職場復帰したため、第2子の養育に係る同法第26条に規定する3歳に満たない子を養育する被保険者等の標準報酬月額の特例の申出を行い当該特例が適用された。この場合、当該被保険者の従前標準報酬月額は36万円とされる。",a:true,exp:"法26条1項6号、3項。設問の通り正しい。産前産後休業は出産の日以前42日から始まるため、第2子を養育することとなった月の前月には、第1子に係る従前標準報酬月額の特例は終了するが、このような場合であっても、法26条3項の読替え規定により、第2子に係る従前標準報酬月額については、第1子に係る従前標準報酬月額を適用することとされている。",src:"法26条1項6号・3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問2",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法第26条に規定する3歳に満たない子を養育する被保険者等の標準報酬月額の特例が適用される場合、年金額の計算及び保険料額の計算のいずれについても、従前標準報酬月額を用いて計算する。",a:false,exp:"法26条1項。従前標準報酬月額については、保険料額の計算の基礎となる標準報酬月額とはみなさない。この特例は、子の養育によって標準報酬月額が低下した被保険者の年金給付額が減少しないようにするために設けられた措置である。したがって、年金額は、従前標準報酬月額を用いて計算するが、保険料の額は、低下した標準報酬月額（実際に受ける報酬の額に対応する標準報酬月額）を用いて計算することとなる。",src:"法26条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問3",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】適用事業所に使用される高齢任意加入被保険者（保険料の半額負担及び保険料の納付義務を負うことについての事業主の同意はないものとする。）が保険料（初めて納付すべき保険料を除く。）を滞納し、督促状の指定の期限までに当該保険料を納付しないときは、当該督促状の指定期限の翌日に、被保険者の資格を喪失する。",a:false,exp:"法附則4条の3,6項。設問の場合、高齢任意加入被保険者は、当該保険料の「納期限の属する月の前月末日」にその資格を喪失する。なお、適用事業所に使用される高齢任意加入被保険者が、初めて納付すべき保険料を滞納し、督促状の指定の期限までに、その保険料を納付しないときは、高齢任意加入被保険者とならなかったものとみなす（保険料の半額負担及び保険料の納付義務を負うことについての事業主の同意がある場合を除く。）。",src:"法附則4条の3・6項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問3",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】第1号厚生年金被保険者期間を130月、第2号厚生年金被保険者期間を170月有する男性（昭和36年4月2日生まれ）が65歳に達し老齢厚生年金の受給権を取得した際、その者によって生計を維持していたその者の65歳未満の配偶者がいた場合、第1号厚生年金被保険者期間に基づく老齢厚生年金に加給年金額の加算が行われることとなる。",a:false,exp:"法78条の27、令3条の13,1項、2項。2以上の種別の被保険者であった期間を有する者に係る老齢厚生年金の額について、加給年金額の加算要件である「老齢厚生年金の額の計算の基礎となる被保険者期間の月数が240以上であること。」の判定については、その者の2以上の種別の被保険者であった期間に係る被保険者期間を合算して行うため、設問の男性の老齢厚生年金に加給年金額の加算は行われ、各号の厚生年金被保険者期間のうち一の被保険者の種別に係る被保険者であった期間（以下「一の期間」という。）に基づく老齢厚生年金について加給年金額を加算することとなる。この場合、各号の厚生年金被保険者期間に基づく老齢厚生年金の受給権を取得した時期が同じであるときは、各号の厚生年金被保険者期間のうち最も長い一の期間に基づく老齢厚生年金に加給年金額が加算される。設問の男性の場合、第1号厚生年金被保険者期間よりも、第2号厚生年金被保険者期間の方が長いため、第2号厚生年金被保険者期間に基づく老齢厚生年金に加給年金額の加算が行われることとなる。",src:"法78条の27・令3条の13",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問3",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】保険給付の受給権者が死亡し、その死亡した者に支給すべき保険給付でまだその者に支給しなかったものがある場合において、当該受給権者の死亡の当時その者と生計を同じくしていた者が、22歳の子と63歳の父であったときは、当該子が当該未支給の保険給付の支給を請求することができる。",a:true,exp:"法37条4項、令3条の2。設問の通り正しい。",src:"法37条4項・令3条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問3",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】第1号厚生年金被保険者に係る適用事業所の事業主は、被保険者が70歳に到達し、引き続き当該事業所に使用されることにより70歳以上の使用される者の要件（厚生年金保険法施行規則第10条の4の要件をいう。）に該当する場合であって、当該者の標準報酬月額に相当する額が70歳到達日の前日における標準報酬月額と同額である場合は、70歳以上の使用される者の該当の届出及び被保険者の資格喪失の届出を行うことを要しない。",a:true,exp:"則15条の2,1項ただし書、則22条1項ただし書。設問の通り正しい。",src:"則15条の2・則22条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問3",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】社会保険労務士が法令の規定に基づき行うこととされている法律に係る業務を行う事業の個人事業所であって、常時8人の従業員を使用するものの事業主は、厚生労働大臣の認可を受けて、当該事業所を適用事業所とすることができる。",a:false,exp:"法6条1項1号レ、令1条の2,7号。社会保険労務士が法令の規定に基づき行うこととされている法律に係る業務を行う事業は適用業種であるため、当該事業の個人事業所については、常時5人以上の従業員を使用する場合には、「強制適用事業所」とされる。",src:"法6条1項1号レ・令1条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問4",opt:"A",q:"高齢任意加入被保険者に係る保険料の半額負担及び保険料の納付義務を負うことについて同意をした適用事業所の事業主は、厚生労働大臣の承認を受けることにより、将来に向かって、当該同意を撤回することができる。",a:false,exp:"法附則4条の3,8項。「厚生労働大臣の承認を受けることにより」を「被保険者の同意を得て」に置き換えると正しい文章となる。",src:"法附則4条の3・8項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問4",opt:"B",q:"第1号厚生年金被保険者が、適用事業所である事業所及び船舶に同時に使用される場合においては、船舶の船舶所有者のみが当該被保険者に係る保険料の半額を負担し、当該保険料及び当該被保険者の負担する保険料を納付する義務を負う。",a:true,exp:"令4条4項。設問の通り正しい。設問の場合、事業所の事業主は、保険料の負担及び納付する義務を負わないものとする。",src:"令4条4項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問4",opt:"C",q:"毎年3月31日における標準報酬月額等級の最高等級に該当する被保険者数の被保険者総数に占める割合が100分の1.5を超える場合において、その状態が継続すると認められるときは、その年の9月1日から、政令で、当該最高等級の上に更に等級を加える標準報酬月額の等級区分の改定を行うことができる。ただし、その年の3月31日において、改定後の標準報酬月額等級の最高等級に該当する被保険者数の同日における被保険者総数に占める割合が100分の0.5を下回ってはならない。",a:false,exp:"法20条2項。毎年3月31日における全被保険者の標準報酬月額を平均した額の100分の200に相当する額が標準報酬月額等級の最高等級の標準報酬月額を超える場合において、その状態が継続すると認められるときは、その年の9月1日から、健康保険法40条1項に規定する標準報酬月額の等級区分を参酌して、政令で、当該最高等級の上に更に等級を加える標準報酬月額の等級区分の改定を行うことができる。なお、設問文は、健康保険法における標準報酬月額の等級区分の改定に関するものである。",src:"法20条2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問4",opt:"D",q:"令和8年度の再評価率及び基準年度以後再評価率は、名目手取り賃金変動率が1.021（＋2.1％）、物価変動率が1.032（＋3.2％）であったことから、いずれも名目手取り賃金変動率を用いて改定されることとなり、また、同年度における調整率が0.998（－0.2％）とされたことから、再評価率及び基準年度以後再評価率は、ともに1.9％のプラス改定となった。",a:false,exp:"法43条の4,1項、法43条の5,1項、（令和7）法附則3条。令和8年度の再評価率及び基準年度以後再評価率は、「調整率」ではなく、「経過的軽減調整率」を用いて改定することとされている。令和8年度の再評価率及び基準年度以後再評価率は、いずれも名目手取り賃金変動率（1.021）を用いて改定されることとなるが、経過的軽減調整率が0.999［≒0.998＋（1－0.998）×2/3］とされたことから、再評価率及び基準年度以後再評価率は、いずれも「2.0％」のプラス改定となった（1.021×0.999≒1.020）。",src:"法43条の4・法43条の5・（令和7）法附則3条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問4",opt:"E",q:"子に係る加算額が加算されている障害基礎年金の受給権者が、65歳に達して老齢厚生年金（その年金額の計算の基礎となる被保険者期間の月数が240以上であるものとする。）の受給権を取得し、これらの年金給付が併給されることとなった場合、当該障害基礎年金について、当該子に係る加算額に相当する部分の支給が停止される。",a:false,exp:"法44条1項ただし書。設問の場合、「老齢厚生年金」について、当該子に係る加給年金額に相当する部分の支給が停止される。",src:"法44条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問5",opt:"A",q:"令和8年4月10日時点における第1号厚生年金被保険者、第2号厚生年金被保険者及び第3号厚生年金被保険者に係る保険料率は、いずれも1000分の183.00である。",a:true,exp:"法81条4項、(24)法附則85条1項、2項。設問の通り正しい。なお、令和8年4月10日時点における第4号厚生年金被保険者に係る保険料率は1000分の170.97（1000分の182.48－1000分の11.51）となっており、他の種別の厚生年金被保険者に係る保険料率と異なる。",src:"法81条4項・(24)法附則85条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問5",opt:"B",q:"厚生労働大臣は、会計法第7条第1項の規定にかかわらず、政令で定める場合における保険料その他厚生年金保険法の規定による徴収金、年金たる保険給付の過誤払による返還金その他の厚生労働省令で定めるものの収納を、日本年金機構に行わせることができる。なお、日本年金機構は、当該保険料等の収納をしたときは、遅滞なく、これを日本銀行に送付しなければならない。",a:true,exp:"法100条の11,1項。設問の通り正しい。",src:"法100条の11・1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問5",opt:"C",q:"日本国籍を有しない40歳の甲は、国民年金の第1号被保険者としての被保険者期間に係る保険料納付済期間を5年、厚生年金保険の被保険者期間を5年有している。甲は、母国へ帰国した場合であっても、脱退一時金の支給を請求することはできない。",a:true,exp:"法附則29条1項。設問の通り正しい。設問の者は、老齢厚生年金の受給資格期間を満たしているため、脱退一時金の支給を請求することはできない。",src:"法附則29条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問5",opt:"D",q:"障害厚生年金の受給権者が、正当な理由がなくて療養に関する指示に従わないことにより、その障害の程度を増進させたときは、厚生年金保険法第52条第1項（実施機関による障害厚生年金の額の改定）の規定による改定を行わないことができる。",a:true,exp:"法74条。設問の通り正しい。障害厚生年金の受給権者が、故意若しくは重大な過失により、又は正当な理由がなくて療養に関する指示に従わないことにより、その障害の程度を増進させ、又はその回復を妨げたときは、障害厚生年金の額の改定を行わず、又はその者の障害の程度が現に該当する障害等級以下の障害等級に該当するものとして、障害厚生年金の額の改定を行うことができる。",src:"法74条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問5",opt:"E",q:"夫に支給される老齢厚生年金に加算されている加給年金額の対象者である妻が、特別支給の老齢厚生年金の受給権を有している場合であっても、当該妻の老齢厚生年金が、在職老齢年金の仕組みにより、その全額につき支給が停止されているときは、夫の老齢厚生年金について、加給年金額に相当する部分の支給は停止されない。",a:false,exp:"法46条6項。設問の妻の老齢厚生年金が、在職老齢年金の仕組みにより、その全額につき支給が停止されているときであっても、夫の老齢厚生年金について、加給年金額に相当する部分の支給は停止される。なお、老齢厚生年金に加算されている加給年金額の対象者である配偶者が、障害厚生年金又は障害基礎年金の受給権を有している場合であっても、当該障害厚生年金又は障害基礎年金が、障害等級に該当しないことにより、その全額につき支給が停止されているときは、夫の老齢厚生年金について、加給年金額に相当する部分の支給は停止されない。",src:"法46条6項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問6",opt:"ア",q:"【離婚時の年金分割に関する記述として正しいか】離婚の届出をしていないが、夫婦としての共同生活が営まれておらず、事実上離婚したと同様の事情にあると認められる場合であって、両当事者がともに当該事情にあると認めているときは、いわゆる合意分割の請求（以下「標準報酬改定請求」という。）をすることができる。",a:false,exp:"法78条の2,1項、則78条他。設問の場合には、いわゆる合意分割の請求はできない。合意分割は離婚、婚姻の取消しその他厚生労働省令で定める事由があった場合に請求できるものである。",src:"法78条の2・則78条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問6",opt:"イ",q:"【離婚時の年金分割に関する記述として正しいか】離婚が成立した日等の翌日から起算して2年を経過した場合は、標準報酬改定請求をすることができない。",a:false,exp:"法78条の2,1項ただし書。設問の「2年」を「5年」に置き換えると正しい内容となる。",src:"法78条の2・1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問6",opt:"ウ",q:"【離婚時の年金分割に関する記述として正しいか】標準報酬改定請求について、当事者の合意のための協議が調わないとき、又は協議をすることができないときは、当事者の一方の申立てにより、家庭裁判所は、当該対象期間における保険料納付に対する当事者の寄与の程度その他一切の事情を考慮して、請求すべき按分割合を定めることができる。",a:true,exp:"法78条の2,2項。設問の通り正しい。",src:"法78条の2・2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問6",opt:"エ",q:"【離婚時の年金分割に関する記述として正しいか】離婚の届出をしていないが、厚生年金保険法第78条の14第1項の規定による標準報酬の改定及び決定の請求（以下「3号分割標準報酬改定請求」という。）のあった日に、特定被保険者が行方不明となって3年が経過していると認められる場合であって、かつ、特定被保険者の被扶養配偶者が第3号被保険者としての国民年金の被保険者の資格（当該特定被保険者の配偶者としての当該資格に限る。）を喪失しているときは、当該特定被保険者の被扶養配偶者は、3号分割標準報酬改定請求をすることができる。",a:true,exp:"則78条の14,2号イ。設問の通り正しい。",src:"則78条の14・2号イ",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問6",opt:"オ",q:"【離婚時の年金分割に関する記述として正しいか】当事者の一方が死亡した日から起算して1月以内に、当事者が標準報酬改定請求をすること及び請求すべき按分割合について合意している旨が記載された公正証書の謄本等の添付をする方法により、当事者の他方による標準報酬改定請求があったときは、当事者の一方が死亡した日に標準報酬改定請求があったものとみなす。",a:false,exp:"法78条の2,3項、令3条の12の7、則78条の4,1項1号イ他。設問の「死亡した日」を「死亡した日の前日」に置き換えると正しい内容となる。",src:"法78条の2・3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問7",opt:"A",q:"障害厚生年金の受給権者（障害の程度が障害等級の2級に該当する者とする。）によって生計を維持しているその者の2人の子（16歳、13歳）があるときは、当該子に係る加給年金額が加算されることとなるが、この場合における加給年金額の対象となる子1人当たりの額は、224,700円に改定率を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）となる。",a:false,exp:"法50条の2,1項。子は、障害厚生年金の加給年金額の対象とならない。なお、障害の程度が障害等級の1級又は2級に該当する者に支給する障害厚生年金の額は、受給権者によって生計を維持しているその者の65歳未満の配偶者があるときは、加給年金額（224,700円×改定率）を加算した額とする。",src:"法50条の2・1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問7",opt:"B",q:"障害手当金の額は、厚生年金保険法第50条第1項（障害厚生年金の額）の規定の例により計算した額の100分の200に相当する額とする。ただし、その額が障害等級2級の障害基礎年金の額に4分の3を乗じて得た額（その額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。）に2を乗じて得た額に満たないときは、当該額が障害手当金の額とされる。",a:true,exp:"法57条。設問の通り正しい。",src:"法57条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問7",opt:"C",q:"障害等級2級の障害厚生年金の受給権者が更に障害等級2級の障害厚生年金の受給権を取得した場合において、新たに取得した障害厚生年金が労働基準法の規定による障害補償を受ける権利を取得したことによりその支給を停止すべきものであるときは、その停止すべき期間、その者に対して従前の障害厚生年金を支給する。",a:true,exp:"法49条2項。設問の通り正しい。障害厚生年金（その権利を取得した当時から引き続き障害等級の1級又は2級に該当しない程度の障害の状態にある受給権者に係るものを除く。）の受給権者が法48条1項の併合認定の規定により前後の障害を併合した障害の程度による障害厚生年金の受給権を取得したときは、従前の障害厚生年金の受給権は、消滅することとされているが、設問の場合には、労働基準法の規定による障害補償との調整により支給停止すべき期間、従前の障害厚生年金を支給する。",src:"法49条2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問7",opt:"D",q:"63歳の時に厚生年金保険法第47条の3第1項及び第2項に規定するいわゆる基準傷病に基づく障害による障害厚生年金の支給要件を満たした者が、67歳の時に当該障害厚生年金の請求をした。この場合、当該障害厚生年金の支給は、その請求があった月の翌月から始めるものとする。",a:true,exp:"法47条の3,3項。設問の通り正しい。基準傷病に基づく障害による障害厚生年金の受給権は、所定の支給要件を満たしたときに発生するが、その支給は、厚生年金保険法36条1項（年金の支給期間）の規定にかかわらず、当該障害厚生年金の請求があった月の翌月から始めるものとされている。",src:"法47条の3・3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問7",opt:"E",q:"平成6年11月9日前に障害厚生年金の受給権を有していたことがある者（同日において当該障害厚生年金の受給権を有する者を除く。）が、当該障害厚生年金の支給事由となった傷病により、平成6年11月10日から65歳に達する日の前日までの間において、障害等級に該当する程度の障害の状態に該当するに至ったときは、その者は、障害等級に該当する程度の障害の状態に該当するに至ったときから65歳に達する日の前日までの間に、厚生年金保険法第47条第1項の障害厚生年金の支給を請求することができる。",a:true,exp:"(6)法附則14条1項。設問の通り正しい。なお、平成6年11月9日前に障害厚生年金の受給権を有していたことがある者（同日において当該障害厚生年金の受給権を有する者を除く。）が、当該障害厚生年金の支給事由となった傷病により、平成6年11月9日において障害等級に該当する程度の障害の状態にあるときもその者は、同日から65歳に達する日の前日までの間に、障害厚生年金の支給を請求することができる。",src:"(6)法附則14条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問8",opt:"A",q:"妻が昭和31年4月1日以前に生まれた者であっても、当該妻が65歳に到達した日以後に夫の死亡により遺族厚生年金の受給権を取得した場合、妻の遺族厚生年金に経過的寡婦加算は行われない。",a:false,exp:"(60)法附則73条1項、(60)法附則別表第9。他の要件を満たす限り、設問の妻の遺族厚生年金には、経過的寡婦加算が行われる。経過的寡婦加算は、中高齢の寡婦加算を受けていた妻に限らず、65歳に達した日以後遺族厚生年金の受給権を取得した妻についても、一定の要件を満たすときは、その加算が行われる。",src:"(60)法附則73条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問8",opt:"B",q:"遺族厚生年金（その受給権者が65歳に達しているものに限る。）は、その受給権者が老齢厚生年金の受給権を有するときは、当該老齢厚生年金の額（厚生年金保険法第44条第1項の規定により加給年金額が加算された老齢厚生年金にあっては、同項の規定を適用しない額とする。）に相当する部分の支給を停止する。",a:true,exp:"法60条1項2号ロ,カッコ書、法64条の2。設問の通り正しい。",src:"法60条1項2号ロ・法64条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問8",opt:"C",q:"16歳の子（障害の状態にはないものとする。）と生計を同じくする夫が妻の死亡により56歳のときに遺族基礎年金及び遺族厚生年金の受給権を取得した。この場合、子が18歳に達した日以後の最初の3月31日が終了するまでの間は、夫は遺族基礎年金と遺族厚生年金の両方を併せて受給することができるが、子について18歳に達した日以後の最初の3月31日が終了したときは、夫の有する遺族基礎年金及び遺族厚生年金の受給権は消滅する。",a:false,exp:"法59条1項、法63条、法65条の2、国年法40条1項、2項他。子について18歳に達した日以後の最初の3月31日が終了したときは、夫の有する遺族基礎年金の受給権は消滅するが、遺族厚生年金の受給権は消滅せず、夫が60歳に達するまでの間は、支給停止されることとなる。",src:"法59条・法63条・法65条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問8",opt:"D",q:"厚生年金保険法第58条第1項の規定により遺族厚生年金が支給される場合において、死亡した被保険者又は被保険者であった者が同項第1号から第3号まで（いわゆる短期要件）のいずれかに該当し、かつ、同項第4号（いわゆる長期要件）にも該当するときは、その遺族が遺族厚生年金を請求したときに別段の申出をした場合を除き、同項第4号に該当し、同項第1号から第3号までには該当しないものとみなす。",a:false,exp:"法58条2項。設問の場合、その遺族が遺族厚生年金を請求したときに別段の申出をした場合を除き、法58条1項1号から3号まで（いわゆる短期要件）のいずれかのみに該当し、同項4号（いわゆる長期要件）には該当しないものとみなす。",src:"法58条2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問8",opt:"E",q:"子に対する遺族厚生年金は、配偶者が遺族厚生年金の受給権を有する期間、その支給を停止する。ただし、配偶者に対する遺族厚生年金が当該配偶者の申出によりその全額の支給を停止されているときは、子に対する遺族厚生年金は、その支給を停止しない。",a:false,exp:"法66条1項。子に対する遺族厚生年金は、配偶者が遺族厚生年金の受給権を有する期間、その支給を停止することとされており、配偶者に対する遺族厚生年金が当該配偶者の申出によりその全額の支給を停止されているときであっても、子に対する遺族厚生年金の支給停止は解除されない。なお、配偶者に対する遺族厚生年金が法65条の2本文（60歳に達するまでの間の支給停止）、法66条2項本文又は法67条（所在不明による支給停止）の規定によりその支給を停止されている間は、この限りでない。",src:"法66条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問9",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】実施機関は、必要があると認めるときは、障害等級に該当する程度の障害の状態にあることにより、年金たる保険給付の受給権を有し、又は厚生年金保険法第44条第1項の規定によりその者について加算が行われている子に対して、その指定する医師の診断を受けるべきことを命じ、又は当該職員をしてこれらの者の障害の状態を診断させることができる。",a:true,exp:"法97条1項。設問の通り正しい。なお、障害等級に該当する程度の障害の状態にあることにより、年金たる保険給付の受給権を有し、又は法44条1項（老齢厚生年金の加給年金額）の規定によりその者について加算が行われている子が、正当な理由がなくて、設問の規定による命令に従わず、又は診断を拒んだときは、年金たる保険給付の額の全部又は一部につき、その支給を停止することができるとされている。",src:"法97条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問9",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】2以上の種別の被保険者であった期間を有する者の脱退一時金を支給する実施機関は、厚生労働大臣とされる。",a:false,exp:"令16条3項。2以上の種別の被保険者であった期間を有する者の脱退一時金を支給する実施機関については、原則として、「最終月に係る被保険者の種別」に応じて決定するものとされる。なお、国民年金法の規定による脱退一時金が同時に請求される場合については、厚生労働大臣が2以上期間者に係る脱退一時金の支給の事務を行う。",src:"令16条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問9",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか（第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者に関するものは考慮しない）】厚生年金保険法第100条第1項の規定によれば、厚生労働大臣は、被保険者の資格、標準報酬、保険料又は保険給付に関する決定に関し、必要があると認めるときは、適用事業所若しくは適用事業所であると認められる事業所の事業主又は同法第10条第2項の同意をした事業主（以下本問において「適用事業所等の事業主」という。）に対して、文書その他の物件を提出すべきことを命じ、又は当該職員をして事業所に立ち入って関係者に質問し、若しくは帳簿、書類その他の物件を検査させることができるとされている。また、当該厚生労働大臣の権限に係る事務は、日本年金機構に行わせるものとされている。",a:true,exp:"法100条1項、法100条の4,1項36号。設問の通り正しい。なお、設問の権限は、厚生労働大臣が自ら行うことを妨げない。",src:"法100条1項・法100条の4",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問9",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか（第2号厚生年金被保険者、第3号厚生年金被保険者又は第4号厚生年金被保険者に関するものは考慮しない）】適用事業所等の事業主が、正当な理由がなくて、厚生年金保険法第100条第1項の規定に違反して、文書その他の物件を提出せず、又は当該職員の質問に対して答弁せず、若しくは虚偽の陳述をし、若しくは検査を拒み、妨げ、若しくは忌避したときは、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:false,exp:"法102条2項。設問の場合、事業主は、6月以下の拘禁刑又は「50万円」以下の罰金に処せられる。",src:"法102条2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問9",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法第100条の2第6項の規定によれば、厚生労働大臣は、第1号厚生年金被保険者の資格、標準報酬又は保険料に関し必要があると認めるときは、銀行、信託会社その他の機関に対し、第1号厚生年金被保険者又は第1号厚生年金被保険者であると認められる者の収入の状況その他の事項につき、報告を求めることができるとされている。また、当該厚生労働大臣の権限に係る事務は、日本年金機構に行わせるものとされている。",a:true,exp:"法100条の2,6項、法100条の4,1項37号。設問の通り正しい。なお、設問の権限は、厚生労働大臣が自ら行うことを妨げない。",src:"法100条の2・法100条の4",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問10",opt:"A",q:"厚生年金保険法第28条の4第1項又は第2項（訂正請求に対する措置）の規定による決定に不服がある者は、社会保険審査官に対して審査請求をし、その決定に不服がある者は、社会保険審査会に対して再審査請求をすることができる。",a:false,exp:"法90条1項ただし書。法28条の4,1項又は2項（訂正請求に対する措置）の規定による決定については、社会保険審査官及び社会保険審査会による審査請求及び再審査請求の対象とはされない。当該決定に不服がある場合は、行政不服審査法に基づく審査請求又は処分取消しの訴えのいずれかを行うこととなる。",src:"法90条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問10",opt:"B",q:"厚生年金保険法第100条の3第3項によれば、実施機関は、厚生労働省令で定めるところにより、当該実施機関を所管する大臣を経由して、厚生年金保険に関する事業状況を把握するために必要な事項として厚生労働省令で定める事項について厚生労働大臣に報告を行うものとするとされている。",a:true,exp:"法100条の3,3項。設問の通り正しい。なお、設問の規定による報告は、厚生労働大臣及び実施機関を所管する大臣が適当と認める場合には、実施機関を所管する大臣を経由しないで行うことができる。",src:"法100条の3・3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問10",opt:"C",q:"第1号厚生年金被保険者に係る事業主は、産前産後休業期間中又は育児休業期間中における保険料の免除が適用されている被保険者に対して、当該休業期間中に賞与を支給した場合、賞与額の届出を行うことを要しない。",a:false,exp:"則19条の5,1項。産前産後休業期間中又は育児休業期間中における保険料の免除が適用されている被保険者に対して、当該休業期間中に賞与を支給した場合であっても、賞与額の届出は行わなければならない。",src:"則19条の5・1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問10",opt:"D",q:"年金は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれその月分までを支払う。ただし、前支払期月に支払うべきであった年金又は権利が消滅した場合若しくは年金の支給を停止した場合におけるその期の年金は、支払期月でない月であっても、支払うものとする。",a:false,exp:"法36条3項。年金は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれその「前月分」までを支払う。",src:"法36条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC全国公開-問10",opt:"E",q:"保険給付を受ける権利を裁定する場合において、保険給付の額に50円未満の端数が生じたときは、これを切り捨て、50円以上100円未満の端数が生じたときは、これを100円に切り上げるものとする。",a:false,exp:"法35条1項。保険給付を受ける権利を裁定する場合において、保険給付の額に「50銭」未満の端数が生じたときは、これを切り捨て、「50銭」以上「1円」未満の端数が生じたときは、これを「1円」に切り上げるものとする。",src:"法35条1項",cat:"択一式（TAC全国公開模試）"},
{type:"select",no:"TAC全国公開-選択7",opt:"空欄A",context:"第1号厚生年金被保険者期間のみを有する昭和38年4月2日生まれの女性（船員であったことはないものとする。）が、特別支給の老齢厚生年金の受給資格要件を満たす場合、当該老齢厚生年金の支給開始年齢は【A】である。",choices:["63歳", "61歳", "62歳", "64歳"],answer:"63歳",exp:"法附則8条の2,2項。第1号厚生年金被保険者期間のみを有する昭和37年4月2日から昭和39年4月1日までに生まれた女性（船員であったことはないものとする。）が、特別支給の老齢厚生年金の受給資格要件を満たす場合、当該老齢厚生年金の支給開始年齢は「63歳」である。",src:"法附則8条の2・2項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC全国公開-選択7",opt:"空欄B",context:"65歳に達し、第1号厚生年金被保険者期間に係る老齢厚生年金の受給権を取得した第1号厚生年金被保険者（昭和36年4月10日生まれとする。）が、令和8年8月15日に退職した後、同年9月15日に就職をし、同日に改めて第1号厚生年金被保険者の資格を取得した。この場合、当該老齢厚生年金の額は、同年【B】から改定される。なお、この者は、第1号厚生年金被保険者期間のみを有するものとする。",choices:["10月", "8月", "9月", "11月"],answer:"10月",exp:"法43条2項ただし書。受給権者が基準日（9月1日）において被保険者でない場合であっても、基準日が被保険者の資格を喪失した日から再び被保険者の資格を取得した日までの間に到来し、かつ、当該被保険者の資格を喪失した日から再び被保険者の資格を取得した日までの期間が1月以内である場合は、在職定時改定の対象となり、基準日の属する月前の被保険者であった期間を老齢厚生年金の額の計算の基礎とし、基準日の属する月の翌月から、年金の額を改定する。設問の者は、令和8年8月16日に被保険者の資格を喪失し、同年9月15日に被保険者の資格を再取得しているため、在職定時改定の対象となり、基準日の属する月の翌月である「10月」から、老齢厚生年金の額が改定される。",src:"法43条2項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC全国公開-選択7",opt:"空欄C",context:"厚生年金保険法附則第7条の3第3項（老齢厚生年金の支給の繰上げ）の規定による老齢厚生年金は、その受給権者（雇用保険法に規定する受給資格を有する者であって65歳未満であるものに限る。）が同法第15条第2項の規定による求職の申込みをしたときは、当該求職の申込みがあった【C】から次の(1)又は(2)のいずれかに該当するに至った月までの各月において、その支給を停止する。(1) 当該受給資格に係る雇用保険法に規定する受給期間が経過したとき。(2) 当該受給権者が当該受給資格に係る雇用保険法に規定する所定給付日数に相当する日数分の基本手当（同法の規定による基本手当をいう。）の支給を受け終わったとき（同法に規定する延長給付を受ける者にあっては、当該延長給付が終わったとき。）。",choices:["月の翌月", "月", "月の前月", "月の翌々月"],answer:"月の翌月",exp:"法附則7条の4,1項。繰上げ支給の老齢厚生年金の受給権者（65歳未満であるものに限る。）であって雇用保険法の規定による基本手当の受給資格を有する者が、求職の申込みをしたときは、当該求職の申込みがあった「月の翌月」から所定の事由に該当するに至った月までの各月において、当該老齢厚生年金の支給を停止する。",src:"法附則7条の4・1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC全国公開-選択7",opt:"空欄D",context:"厚生年金保険法附則第7条の3第3項（老齢厚生年金の支給の繰上げ）の規定による老齢厚生年金は、その受給権者（雇用保険法に規定する受給資格を有する者であって65歳未満であるものに限る。）が同法第15条第2項の規定による求職の申込みをしたときは、当該求職の申込みがあった月の翌月から次の(1)又は(2)のいずれかに該当するに【D】までの各月において、その支給を停止する。(1) 当該受給資格に係る雇用保険法に規定する受給期間が経過したとき。(2) 当該受給権者が当該受給資格に係る雇用保険法に規定する所定給付日数に相当する日数分の基本手当（同法の規定による基本手当をいう。）の支給を受け終わったとき（同法に規定する延長給付を受ける者にあっては、当該延長給付が終わったとき。）。",choices:["至った月", "至った月の前月", "至った月の翌月", "至った月の翌々月"],answer:"至った月",exp:"法附則7条の4,1項。求職の申込みがあった月の翌月から「基本手当の受給期間が経過したとき。」又は「所定給付日数に相当する日数分の基本手当の支給を受け終わったとき（雇用保険法に規定する延長給付を受ける者にあっては、当該延長給付が終わったとき。）。」のいずれかに該当するに「至った月」までの各月において、当該老齢厚生年金の支給を停止する。",src:"法附則7条の4・1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC全国公開-選択7",opt:"空欄E",context:"厚生年金保険法附則第7条の3第3項（老齢厚生年金の支給の繰上げ）の規定による老齢厚生年金は、その受給権者（雇用保険法に規定する受給資格を有する者であって65歳未満であるものに限る。）が同法第15条第2項の規定による求職の申込みをしたときは、当該求職の申込みがあった月の翌月から次の(1)又は(2)のいずれかに該当するに至った月までの各月において、その支給を停止する。(1) 当該受給資格に係る雇用保険法に規定する【E】とき。(2) 当該受給権者が当該受給資格に係る雇用保険法に規定する所定給付日数に相当する日数分の基本手当（同法の規定による基本手当をいう。）の支給を受け終わったとき（同法に規定する延長給付を受ける者にあっては、当該延長給付が終わったとき。）。",choices:["受給期間が経過した", "給付制限が解除された", "給付制限期間が終了した", "待期期間が経過した"],answer:"受給期間が経過した",exp:"法附則7条の4,1項。支給停止が終了する事由の一つは、当該受給資格に係る雇用保険法に規定する「受給期間が経過した」ときである。もう一つの事由は、所定給付日数に相当する日数分の基本手当の支給を受け終わったとき（延長給付を受ける者にあっては、当該延長給付が終わったとき。）である。",src:"法附則7条の4・1項",cat:"選択式（TAC全国公開模試）"},
{no:"LEC第3回-問1",opt:"A",q:"障害等級1級又は障害等級2級に該当したことがない障害等級3級の障害厚生年金の受給権者が、厚生年金保険法の適用事業所を退職した後、国民年金の第1号被保険者である期間中に初診日がある別の障害によって、障害等級2級の障害基礎年金の受給権を有するに至った場合、当該障害厚生年金の支給事由となった障害と当該障害基礎年金の支給事由となった障害とを併合した障害の程度に応じて、当該障害厚生年金の額が改定される。",a:false,exp:"法52条の2第1項。障害厚生年金（「その権利を取得した当時から引き続き障害等級1級又は2級に該当しない程度の障害の状態にある受給権者に係るものを除く」）の受給権者が、障害基礎年金（当該障害厚生年金と同一の支給事由に基づいて支給されるものを除く）の受給権を有するに至ったときは、当該障害厚生年金の支給事由となった障害と当該障害基礎年金の支給事由となった障害とを併合した障害の程度に応じて、当該障害厚生年金の額が改定される。本肢の受給権者は、障害等級1級又は2級に該当したことがない障害等級3級の障害厚生年金の受給権者であるため、本肢の障害厚生年金の額の改定の規定は「適用されない」。",src:"法52条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"B",q:"令和2年4月1日に20歳に達して国民年金の第1号被保険者となった者が5年間引き続き第1号被保険者であったが国民年金の保険料をすべて滞納していた。その後、令和7年4月1日に就職をして厚生年金保険の被保険者となり、引き続き当該厚生年金保険の被保険者であった令和8年8月1日を初診日とする障害により障害等級2級の障害に該当するに至った。この場合、この者に対して障害厚生年金が支給される。",a:true,exp:"法47条1項、昭60法附則64条1項。本肢のとおりである。本肢の者は原則の保険料納付要件は満たしていないが、初診日が令和18年4月1日前であり、かつ、初診日の前日において、初診日の属する月の前々月までの1年間（令和7年7月から令和8年6月までの1年間）は、すべて保険料納付済期間（国民年金第2号被保険者としての被保険者期間）である。さらに、本肢の者は初診日において65歳未満であるため、保険料納付要件の特例が適用できる。したがって、初診日において被保険者である者が初診日の前日における保険料納付要件を満たし、障害等級に該当しているため、障害厚生年金が支給される。",src:"法47条1項・昭60法附則64条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"C",q:"障害等級2級の障害厚生年金の額は、老齢厚生年金の報酬比例部分の額の計算の例により計算した額である。また、その額の計算の基礎となる被保険者期間については、障害認定日の属する月までの被保険者期間が計算の基礎となり、その月数が300に満たないときは、これを300として障害厚生年金の額を計算する。",a:true,exp:"法50条1項、法51条。本肢のとおりである。",src:"法50条1項・法51条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"D",q:"基準障害による障害厚生年金に係る保険料納付要件は、基準傷病以外の傷病に係る初診日の前日における保険料納付要件は問われず、基準傷病に係る初診日の前日における保険料納付要件が問われる。",a:true,exp:"法47条の3第1項・2項。本肢のとおりである。",src:"法47条の3第1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"E",q:"障害等級2級の障害厚生年金の受給権者が、更に障害等級2級の障害厚生年金を支給すべき事由が生じたことにより、厚生年金保険法第48条第1項の併合認定の規定により前後の障害を併合した障害の程度による障害厚生年金の受給権を取得したときは、従前の障害厚生年金の受給権は消滅する。なお、本肢の前後の障害に係る障害厚生年金については、それぞれその支給を停止すべき事由は生じていないものとする。",a:true,exp:"法48条2項。本肢のとおりである。障害厚生年金（その権利を取得した当時から引き続き障害等級の1級又は2級に該当しない程度の障害の状態にある受給権者に係るものを除く）の受給権者に対して更に障害厚生年金（障害等級1級又は2級に限る）を支給すべき事由が生じたときは、前後の障害を併合した障害の程度による障害厚生年金を支給する。",src:"法48条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問2",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法第78条の2の規定によるいわゆる合意分割による標準報酬改定請求に基づいて改定され、又は決定された標準報酬は、離婚等をした日から将来に向かってのみその効力を有する。",a:false,exp:"法78条の6第4項。いわゆる合意分割による標準報酬改定請求に基づいて改定され、又は決定された標準報酬は、「当該標準報酬改定請求のあった日」から将来に向かってのみその効力を有する。",src:"法78条の6第4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問2",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】適用事業所以外の事業所に使用される70歳未満の者で厚生労働大臣の認可を受けて被保険者となったいわゆる任意単独被保険者は、自身についての保険料の納付義務を負うものとされている。",a:false,exp:"法82条2項。「事業主」は、その使用する任意単独被保険者及び自己の負担する保険料を納付する義務を負う。「任意単独被保険者は保険料の納付義務を負わない」。",src:"法82条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問2",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】遺族厚生年金に加算される経過的寡婦加算の額は、中高齢寡婦加算の額に当該遺族厚生年金の受給権者の生年月日に応じて定められた数を乗じて得た額である。",a:false,exp:"昭60法附則73条1項、昭60法附則別表9。遺族厚生年金に加算される経過的寡婦加算の額は、「中高齢寡婦加算の額から老齢基礎年金の満額に当該遺族厚生年金の受給権者の生年月日に応じて定められた数を乗じて得た額を控除して得た額」である。",src:"昭60法附則73条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問2",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】適用事業所に使用される高齢任意加入被保険者は、いつでも、厚生労働大臣の認可を受けて、当該被保険者の資格を喪失することができる。",a:false,exp:"法附則4条の3第4項。適用事業所に使用される高齢任意加入被保険者は、いつでも、「実施機関に申し出て」、当該被保険者の資格を喪失することができる。",src:"法附則4条の3第4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問2",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】保険料を徴収する権利が時効によって消滅したときは、当該保険料に係る被保険者であった期間に基づく保険給付は行われない。ただし、当該被保険者であった期間に係る被保険者の資格の取得について厚生年金保険法第27条の規定による事業主からの届出若しくは同法第31条第1項の規定による被保険者資格の得喪の確認の請求又は同法第28条の2第1項（同条第2項及び第3項において準用する場合を含む。）の規定による厚生年金保険原簿の訂正の請求があった後に、保険料を徴収する権利が時効によって消滅したものであるときは、この限りでない。",a:true,exp:"法75条。本肢のとおりである。",src:"法75条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問3",opt:"A",q:"生計維持認定対象者及び生計同一認定対象者が配偶者又は子である場合において、単身赴任、就学又は病気療養等の止むを得ない事情により住所が住民票上異なっているが、生活費、療養費等の経済的な援助が行われ、かつ、定期的に音信、訪問が行われている事実が認められ、その事情が消滅したときは、起居を共にし、消費生活上の家計を一つにすると認められるときは、生計同一に関する認定要件を満たすものとされている。",a:true,exp:"平23.3.23年発0323第1号。本肢のとおりである。",src:"平23.3.23年発0323第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問3",opt:"B",q:"当事者間に婚姻の届出がなされていないが、当事者間に、社会通念上、夫婦の共同生活と認められる事実関係を成立させようとする合意があり、かつ、当事者間に、社会通念上、夫婦の共同生活と認められる事実関係が存在する場合、事実婚関係にあるものと認定される。",a:true,exp:"平23.3.23年発0323第1号。本肢のとおりである。",src:"平23.3.23年発0323第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問3",opt:"C",q:"収入に関する認定については、受給権者からの申出及び生計維持認定対象者の状況に応じ、原則として、所定の書類の提出を求め行うものとされているが、父母が認定対象者である場合において、父母が健康保険の被扶養者に該当する場合、当該書類として資格確認書の写し等が該当する。なお、「資格確認書の写し等」には、有効である健康保険被保険者証の写しが含まれるが、資格情報のお知らせは含まれない。",a:true,exp:"平23.3.23年発0323第1号。本肢のとおりである。",src:"平23.3.23年発0323第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問3",opt:"D",q:"届出による婚姻関係にある者が重ねて他の者と内縁関係にある場合の取扱いについては、届出による婚姻関係がその実体を全く失ったものとなっているときに限り、内縁関係にある者を事実婚関係にある者として認定するものとされているが、一方の悪意の遺棄によって夫婦としての共同生活が行われていない場合であって、その状態が長期間（おおむね10年程度以上）継続し、当事者双方の生活関係がそのまま固定していると認められるときは、「届出による婚姻関係がその実体を全く失ったものとなっているとき」に該当する。",a:true,exp:"平23.3.23年発0323第1号。本肢のとおりである。「夫婦としての共同生活の状態にない」といい得るためには、次に掲げるすべての要件に該当することを要するものとされている。①当事者が住居を異にすること。②当事者間に経済的な依存関係が反復して存在していないこと。③当事者間の意思の疎通をあらわす音信又は訪問等の事実が反復して存在していないこと。",src:"平23.3.23年発0323第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問3",opt:"E",q:"障害厚生年金の生計維持認定対象者に係る収入に関する認定に当たって、一時的な所得を除いても、前年の収入（前年の収入が確定しない場合にあっては、前々年の収入）が年額850万円以上であり、かつ、前年の所得（前年の所得が確定しない場合にあっては、前々年の所得）が年額655.5万円以上である場合であっても、定年退職等の事情により近い将来（おおむね5年以内に）収入が年額850万円未満又は所得が年額655.5万円未満となると認められるときは、当該生計維持認定対象者は、厚生年金保険法施行令第3条の5第4項に規定する厚生労働大臣の定める金額以上の収入を有すると認められる者以外の者に該当するものとされている。",a:false,exp:"平23.3.23年発0323第1号。障害厚生年金の生計維持認定対象者に係る収入に関する認定に当たって、一時的な所得を除いても、前年の収入が年額850万円以上であり、かつ、前年の所得が年額655.5万円以上である場合であっても、定年退職等の事情により「現に」収入が年額850万円未満又は所得が年額655.5万円未満となると認められるときは、当該生計維持認定対象者は、厚生労働大臣の定める金額以上の収入を有すると認められる者以外の者に該当するものとされている。",src:"平23.3.23年発0323第1号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問4",opt:"A",q:"被保険者となったことがない者であって、その有する被保険者期間がすべて離婚時みなし被保険者期間である者が65歳に達しても、その者に対して老齢厚生年金は支給されない。",a:false,exp:"法42条、法78条の11。65歳以後の老齢厚生年金は、被保険者期間を有する者が、65歳以上であり、かつ、受給資格期間を満たしていれば、支給されるものであるが、離婚時みなし被保険者期間はこの「被保険者期間」から除かれていないため、被保険者期間のすべてが離婚時みなし被保険者期間である者であっても、その他の要件を満たしていれば、65歳以後の老齢厚生年金は「支給される」。",src:"法42条・法78条の11",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問4",opt:"B",q:"厚生年金保険法施行規則第22条の2第1項の規定による70歳以上の使用される者（船員たる70歳以上の使用される者を除く。）の不該当の届出は、当該事実があった日から10日以内に行わなければならない。",a:false,exp:"則22条の2第1項。70歳以上の使用される者（船員たる70歳以上の使用される者を除く）の不該当の届出は、当該事実があった日から「5日以内」に行わなければならない。",src:"則22条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問4",opt:"C",q:"保険給付を受ける権利は、その権利を有する者の請求に基づいて実施機関が裁定するものとされているが、厚生労働大臣の当該裁定に係る権限は、地方厚生局長又は地方厚生支局長に委任されている。",a:false,exp:"法33条、法100条の9第1項・2項、則108条。厚生労働大臣の保険給付の裁定に関する権限は、「地方厚生局長等に委任されていない」。本肢前段の記述は正しい。",src:"法33条・法100条の9",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問4",opt:"D",q:"老齢厚生年金の支給繰上げの請求をした場合において、当該老齢厚生年金に経過的加算が加算されるべきときは、経過的加算額を除いた老齢厚生年金の額が支給繰上げによる減額の対象となる。",a:false,exp:"令6条の3。支給繰上げの請求を行い、老齢厚生年金の額が減額される場合には、「経過的加算額も含めて減額される」。",src:"令6条の3",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問4",opt:"E",q:"国庫は、毎年度、厚生年金保険の実施者たる政府が負担する基礎年金拠出金の額の2分の1に相当する額を負担するものとされている。",a:true,exp:"法80条1項。本肢のとおりである。",src:"法80条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問5",opt:"A",q:"申出により特定適用事業所となった事業主は、所定の要件を満たすことにより、任意特定適用事業所の取消の申出をすることができるが、当該申出があったときは、特定4分の3未満短時間労働者（被保険者の資格を有する者に限る。）は、当該申出が受理された日に、当該被保険者の資格を喪失する。",a:false,exp:"平24法附則17条8項・10項。本肢の場合、申出が受理された日の「翌日」に、被保険者の資格を喪失する。本肢前段の記述は正しい。",src:"平24法附則17条8項・10項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問5",opt:"B",q:"65歳以上の老齢厚生年金の受給権者である被保険者が令和8年8月23日に被保険者の資格を喪失し、同年9月16日に再び被保険者の資格を取得した場合、同年8月以前の被保険者であった期間が老齢厚生年金の額の計算の基礎とされ、同年10月から、老齢厚生年金の額が改定される。",a:true,exp:"法43条2項。本肢のとおりである。65歳以上の老齢厚生年金の受給権者について、毎年9月1日（基準日）において被保険者である者以外にも、基準日が被保険者の資格を喪失した日から再び被保険者の資格を取得した日までの間に到来し、かつ、当該被保険者の資格を喪失した日から再び被保険者の資格を取得した日までの期間が1月以内である場合は、在職定時改定が行われ、基準日の属する月の翌月（10月）から老齢厚生年金の額が改定される。",src:"法43条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問5",opt:"C",q:"厚生年金保険法第26条の3歳に満たない子を養育する被保険者等の標準報酬月額の特例が適用される場合において、当該特例の申出が行われた日の属する月前の月にあっては、当該申出が行われた日の属する月の前月までの1年間のうちにあるものに限って、当該特例の対象とされる。",a:false,exp:"法26条1項。本肢の場合、当該特例の申出が行われた日の属する月前の月にあっては、当該申出が行われた日の属する月の前月までの「2年間」のうちにあるものに限って、当該特例の対象とされる。",src:"法26条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問5",opt:"D",q:"被保険者期間の月数が240月ある者が65歳に達して老齢厚生年金の受給権を取得した当時、その者によって生計を維持していた18歳に達する日以後の最初の3月31日までの間にある子がある場合において、当該被保険者期間のうち、半分が離婚時みなし被保険者期間であるときは、当該老齢厚生年金に加給年金額が加算される。",a:false,exp:"法44条1項、法78条の11。加給年金額の加算要件である「被保険者期間の月数が240以上」には、離婚時みなし被保険者期間は「含まれない」。したがって、本肢の者の被保険者期間の月数から離婚時みなし被保険者期間の月数を除いた月数は120月であり、240月に満たないため、本肢の者の老齢厚生年金には「加給年金額は加算されない」。",src:"法44条1項・法78条の11",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問5",opt:"E",q:"厚生労働大臣から財務大臣への滞納処分等その他の処分の権限の委任に関し、財務大臣にその権限を委任する場合の要件の1つとして、「納付義務者が滞納している保険料その他厚生年金保険法の規定による徴収金の額が1,000万円以上であること。」がある。",a:false,exp:"法100条の5第1項、令4条の2の16、則101条。厚生労働大臣から財務大臣への滞納処分等その他の処分の権限の委任に関し、財務大臣にその権限を委任する場合の要件の1つとして、「納付義務者が滞納している保険料その他厚生年金保険法の規定による徴収金の額が『5,000万円以上』であること。」がある。",src:"法100条の5第1項・令4条の2の16・則101条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問6",opt:"A",q:"被保険者の資格又は標準報酬に関する処分が確定した場合、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることができる。",a:false,exp:"法90条5項。被保険者の資格又は標準報酬に関する処分が確定したときは、その処分についての不服を当該処分に基づく保険給付に関する処分についての不服の理由とすることが「できない」。",src:"法90条5項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問6",opt:"B",q:"国民年金法による年金たる給付及び厚生年金保険法による年金たる保険給付については、標準的な年金（モデル年金）の所得代替率が100分の100を上回ることとなるような給付水準を将来にわたり確保するものとされている。",a:false,exp:"平16法附則2条1項。国民年金法による年金たる給付及び厚生年金保険法による年金たる保険給付については、標準的な年金（モデル年金）の所得代替率が「100分の50」を上回ることとなるような給付水準を将来にわたり確保するものとされている。",src:"平16法附則2条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問6",opt:"C",q:"60歳台前半の老齢厚生年金の受給権者である雇用保険の基本手当の受給資格者が求職の申込みをしたため、当該60歳台前半の老齢厚生年金が5か月支給停止された場合において、その者の基本手当の支給を受けた日とみなされる日数が100日であったときは、2か月分の60歳台前半の老齢厚生年金の支給停止が解除される。",a:false,exp:"法附則11条の5。基本手当との調整により60歳台前半の老齢厚生年金が支給停止された各月のうち、年金停止月数から基本手当の支給を受けた日とみなされる日の数を30で除して得た数（「1未満の端数が生じたときは、これを1に切り上げるものとする」）を控除して得た数が1以上であるときは、年金停止月のうち、当該控除して得た数に相当する月数分の直近の各月については、支給停止が行われなかったものとみなされ、直近の年金から順次前にさかのぼって支給停止が解除される。したがって、本肢の場合、100日÷30日＝3.333…→4か月となるため、5か月－4か月＝「1か月分の支給停止が解除される」。",src:"法附則11条の5",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問6",opt:"D",q:"被保険者が死亡し、老齢厚生年金の受給権を有する配偶者に対していわゆる短期要件の遺族厚生年金が支給される場合、死亡した被保険者又は被保険者であった者の被保険者期間を基礎として計算した老齢厚生年金（報酬比例部分）の額（その額の計算の基礎となる被保険者期間の月数が300に満たないときは、これを300として計算した額）の4分の3に相当する額と、当該額に3分の2を乗じて得た額と当該遺族厚生年金の受給権者の老齢厚生年金の額（加給年金額を除く。）に2分の1を乗じて得た額との合算額のうち、いずれか多い額が当該遺族厚生年金の額となる。",a:true,exp:"法60条1項。本肢のとおりである。",src:"法60条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問6",opt:"E",q:"適用事業所に使用される第1号厚生年金被保険者である高齢任意加入被保険者であって、保険料の負担及び納付について事業主の同意を得ていないものが、初めて納付すべき保険料を滞納し、督促状に指定された期限までにその保険料を納付しないときは、当該保険料の納期限の日に、被保険者の資格を喪失する。",a:false,exp:"法附則4条の3第3項。適用事業所に使用される第1号厚生年金被保険者である高齢任意加入被保険者であって、保険料の負担及び納付について事業主の同意を得ていないものが、初めて納付すべき保険料を滞納し、督促状に指定された期限までにその保険料を納付しないときは、「被保険者とならなかったものとみなされる」。",src:"法附則4条の3第3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問7",opt:"A",q:"厚生年金保険法第78条の2のいわゆる合意分割に係る標準報酬改定請求を行うために必要な情報の提供の請求は、既に当該情報の提供を受けている場合において、当該情報の提供を受けた日の翌日から起算して3月を経過していないときは、原則としてすることができない。ただし、当事者について国民年金法に規定する被保険者の種別の変更があった等の一定の場合は、この限りでない。",a:true,exp:"法78条の4第1項、則78条の7。本肢のとおりである。",src:"法78条の4第1項・則78条の7",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問7",opt:"B",q:"第1号厚生年金被保険者（適用事業所に使用される高齢任意加入被保険者等を除き、厚生労働大臣が住民基本台帳法第30条の9の規定により機構保存本人確認情報の提供を受けることができない者に限る。）は、その住所を変更したときは、速やかに、変更後の住所及び変更の年月日を事業主に申し出なければならない。",a:true,exp:"則6条の2。本肢のとおりである。",src:"則6条の2",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問7",opt:"C",q:"令和8年6月30日を産前産後休業終了日とする被保険者について、厚生年金保険法第23条の3の産前産後休業を終了した際の標準報酬月額の改定が行われた場合、当該改定による改定後の標準報酬月額は、他の標準報酬月額の改定事由がない限り、同年10月から令和9年8月までの標準報酬月額とされる。",a:true,exp:"法23条の3第2項。本肢のとおりである。産前産後休業終了時改定の規定により改定された標準報酬月額は、産前産後休業終了日の翌日から起算して2月を経過した日の属する月の翌月からその年の8月（当該翌月が7月から12月までのいずれかの月である場合は、翌年の8月）までの各月の標準報酬月額とされる。産前産後休業終了日が令和8年6月30日である場合の当該改定後の標準報酬月額は、同年10月から令和9年8月までの標準報酬月額とされる。",src:"法23条の3第2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問7",opt:"D",q:"昭和61年7月1日に第3種被保険者としての被保険者資格を取得した者が、昭和64年1月5日に当該被保険者資格を喪失した。この場合、この期間における被保険者期間は、40月として計算される。",a:false,exp:"昭60法附則47条4項。昭和61年4月1日から平成3年3月31日までの第3種被保険者であった期間について被保険者期間を計算する場合、その期間に「5分の6」を乗じて得た期間をもって、被保険者期間とされる。本肢の被保険者期間の実月数は30月であるため、30月×6/5＝「36月が被保険者期間の月数となる」。",src:"昭60法附則47条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問7",opt:"E",q:"令和8年4月現在、厚生年金保険の標準報酬月額等級は第1級から第32級までの32等級に区分されている。",a:true,exp:"法20条1項ほか。本肢のとおりである。",src:"法20条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問8",opt:"A",q:"日本年金機構は、厚生年金保険法第100条の11第1項の規定により保険料等の収納をしたときは、遅滞なく、これを厚生労働大臣に送付しなければならないものとされている。",a:false,exp:"法100条の11第3項。日本年金機構は、保険料等の収納をしたときは、遅滞なく、これを「日本銀行」に送付しなければならない。",src:"法100条の11第3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問8",opt:"B",q:"厚生年金保険法第78条の2のいわゆる合意分割に係る標準報酬改定請求は、離婚等をしたときから2年を経過したときその他の厚生労働省令で定める場合に該当するときは、することができない。",a:false,exp:"法78条の2第1項。いわゆる合意分割に係る標準報酬改定請求は、離婚等をしたときから「5年」を経過したときその他の厚生労働省令で定める場合に該当するときは、することができない。",src:"法78条の2第1項",cat:"択一式（LEC公開模試）"},
