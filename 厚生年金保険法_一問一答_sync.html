{no:"LEC第3回-問8",opt:"C",q:"遺族厚生年金の受給権者が直系血族又は直系姻族である者の養子となった場合は、当該遺族厚生年金の受給権は消滅する。",a:false,exp:"法63条1項。遺族厚生年金の受給権は、直系血族及び直系姻族「以外」の者の養子（届出をしていないが、事実上養子縁組関係と同様の事情にある者を含む）となったときは消滅する。したがって、本肢の場合は遺族厚生年金の受給権は「消滅しない」。",src:"法63条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問8",opt:"D",q:"65歳以後の在職老齢年金による支給停止基準額が、加給年金額、繰下げ加算額及び経過的加算額を除いた老齢厚生年金の額以上である場合、加給年金額及び老齢厚生年金の額（報酬比例部分の額）は支給停止の対象となるが、繰下げ加算額及び経過的加算額は支給停止の対象とされない。",a:true,exp:"法46条1項、昭60法附則62条1項。本肢のとおりである。",src:"法46条1項・昭60法附則62条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問8",opt:"E",q:"国民年金の任意加入被保険者である者であっても、要件を満たす限り、老齢厚生年金の支給繰上げの請求をすることはできる。",a:false,exp:"法附則7条の3第1項。国民年金の任意加入被保険者は、「老齢厚生年金の支給繰上げの請求をすることができない」。なお、国民年金の任意加入被保険者は、老齢基礎年金の支給繰上げの請求をすることもできない（国民年金法附則9条の2第1項）。",src:"法附則7条の3第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問9",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】日本年金機構は、滞納処分等実施規程を定め、厚生労働大臣の認可を受けなければならないものとされているが、滞納処分等実施規程には、差押えを行う時期、差押えに係る財産の選定方法その他の滞納処分等の公正かつ確実な実施を確保するために必要なものとして厚生労働省令で定める事項を記載しなければならない。",a:true,exp:"法100条の7第1項・2項。本肢のとおりである。",src:"法100条の7第1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問9",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】厚生労働大臣が支給する障害厚生年金であって、配偶者加給年金額が加算されているものの受給権者について、その配偶者が65歳に達したために当該配偶者加給年金額が加算されなくなるに至った場合、その至った日の翌日から起算して10日以内に、配偶者加給年金額の対象者の氏名及び生年月日その他一定の事項を記載した届書を日本年金機構に提出しなければならない。",a:false,exp:"則46条。配偶者加給年金額が加算されなくなった理由が配偶者の年齢到達による場合は、本肢の「届出を行う必要はない」。",src:"則46条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問9",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】同一人に対して遺族基礎年金の支給を停止して障害厚生年金（厚生労働大臣が支給するものに限る。以下本肢において同じ。）を支給すべき場合において、当該障害厚生年金を支給すべき事由が生じた月の翌月以後の分として当該遺族基礎年金の支払が行われたときは、その支払われた遺族基礎年金は、障害厚生年金の内払とみなすことができる。",a:true,exp:"法39条3項。本肢のとおりである。",src:"法39条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問9",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】厚生労働大臣が督促をする場合の督促状により指定する期限は、厚生年金保険法第85条の繰上徴収事由のいずれかに該当する場合を除き、督促状を発する日から起算して14日以上を経過した日でなければならない。",a:false,exp:"法86条4項。厚生労働大臣が督促をする場合の督促状により指定する期限は、保険料の繰上徴収事由のいずれかに該当する場合を除き、督促状を発する日から起算して「10日以上」を経過した日でなければならない。",src:"法86条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問9",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】保険給付の返還を受ける権利は、これを行使することができる時から2年を経過したときは、時効によって、消滅する。",a:false,exp:"法92条1項。保険給付の返還を受ける権利は、これを行使することができる時から「5年」を経過したときは、時効によって、消滅する。",src:"法92条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問10",opt:"A",q:"実施機関は、3号分割標準報酬改定請求があった場合は、当該特定被保険者が標準賞与額を有する特定期間に係る被保険者期間の各月ごとに、当該特定被保険者及び被扶養配偶者の標準賞与額を当該特定被保険者の標準賞与額に2分の1を乗じて得た額にそれぞれ改定し、及び決定することができる。",a:true,exp:"法78条の14第3項。本肢のとおりである。",src:"法78条の14第3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問10",opt:"B",q:"厚生労働大臣は、被保険者及び被保険者であった者に対し、必要に応じ、年金たる保険給付を受ける権利の裁定の請求に係る手続に関する情報を提供するとともに、当該裁定を請求することの勧奨を行うものとされている。",a:true,exp:"則128条1項。本肢のとおりである。厚生労働大臣は、本肢の情報の提供及び勧奨を適切に行うため、被保険者であった者その他の関係者及び関係機関に対し、被保険者であった者に係る氏名、住所その他の事項について情報の提供を求めることができる（同条2項）。",src:"則128条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問10",opt:"C",q:"船舶所有者に使用される船員が季節的業務に使用される場合、その者は被保険者とならない。ただし、継続して4月を超えて使用されるべき場合は、この限りでない。",a:false,exp:"法12条。季節的業務に使用される者（「船舶所有者に使用される船員を除く」）は、被保険者とならない。ただし、継続して4月を超えて使用されるべき場合は、この限りでない。したがって、船舶所有者に使用される船員である本肢の者は、他の適用除外事由に該当しない限り、「被保険者となる」。",src:"法12条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問10",opt:"D",q:"遺族厚生年金と当該遺族厚生年金と同一の支給事由に基づく遺族基礎年金の受給権を有する妻が30歳に到達する日前に当該遺族基礎年金の受給権が消滅した場合において、当該遺族基礎年金の受給権が消滅した日から起算して5年を経過したときは、当該遺族厚生年金の受給権は消滅する。",a:true,exp:"法63条1項。本肢のとおりである。",src:"法63条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問10",opt:"E",q:"未支給の保険給付を受けるべき同順位者が2人以上あるときは、その1人のした請求は、全員のためその全額につきしたものとみなされ、その1人に対してした支給は、全員に対してしたものとみなされる。",a:true,exp:"法37条5項。本肢のとおりである。",src:"法37条5項",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LEC第3回-選択7",opt:"空欄A",context:"厚生年金保険法第78条の14第2項の規定によると、実施機関は、同条第1項の3号分割標準報酬改定請求があった場合において、【A】期間に係る被保険者期間の各月ごとに、当該【A】被保険者及び被扶養配偶者の標準報酬月額を当該【A】被保険者の標準報酬月額（同法第26条第1項の規定により同項に規定する従前標準報酬月額が当該月の標準報酬月額とみなされた月にあっては、従前標準報酬月額）に2分の1を乗じて得た額にそれぞれ改定し、及び決定することができるものとされている。",choices:["特定", "指定", "対象", "特例"],answer:"特定",exp:"法78条の14第2項。実施機関は、3号分割標準報酬改定請求があった場合において、「特定」期間に係る被保険者期間の各月ごとに、当該「特定」被保険者及び被扶養配偶者の標準報酬月額を当該「特定」被保険者の標準報酬月額（従前標準報酬月額が当該月の標準報酬月額とみなされた月にあっては、従前標準報酬月額）に2分の1を乗じて得た額にそれぞれ改定し、及び決定することができる。",src:"法78条の14第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第3回-選択7",opt:"空欄B",context:"厚生年金保険法第78条の14第2項の規定によると、実施機関は、同条第1項の3号分割標準報酬改定請求があった場合において、特定期間に係る被保険者期間の各月ごとに、当該特定被保険者及び被扶養配偶者の標準報酬月額を当該特定被保険者の標準報酬月額（同法第26条第1項の規定により同項に規定する従前標準報酬月額が当該月の標準報酬月額とみなされた月にあっては、従前標準報酬月額）に【B】を乗じて得た額にそれぞれ改定し、及び決定することができるものとされている。",choices:["2分の1", "按分割合", "改定割合", "指定割合"],answer:"2分の1",exp:"法78条の14第2項。標準報酬月額に「2分の1」を乗じて得た額にそれぞれ改定し、及び決定することができる。3号分割は、特定被保険者及び被扶養配偶者の標準報酬月額の合計額を2等分する仕組みである。",src:"法78条の14第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第3回-選択7",opt:"空欄C",context:"厚生年金保険の被保険者である甲は、40歳の時に精神障害により障害等級2級の障害基礎年金及び障害厚生年金の受給権を取得したが、引き続き被保険者であった55歳の時に障害の程度が軽快したため、障害厚生年金については障害等級3級へとその額が改定され、障害基礎年金については支給停止となった。その後、67歳の時に交通事故によりその他障害の状態となり、当該精神障害とその他障害とを併合すると障害等級2級の障害の程度に該当するに至った。甲が当該交通事故に係る初診日においても引き続き被保険者であった場合、甲は、【C】。なお、交通事故に係る初診日の前日における保険料納付要件は満たされているものとする。",choices:["障害厚生年金の額の改定を請求することはできず、障害基礎年金の支給停止も解除されない", "障害厚生年金の額の改定を請求することができ、障害基礎年金の支給停止も解除される", "障害厚生年金の額の改定を請求することはできないが、障害基礎年金の支給停止は解除される", "障害厚生年金の額の改定を請求することはできるが、障害基礎年金の支給停止は解除されない"],answer:"障害厚生年金の額の改定を請求することはできず、障害基礎年金の支給停止も解除されない",exp:"法52条4項、国年法36条2項。その他障害による障害厚生年金の額の改定は、障害認定日以後65歳に達する日の前日までの間に、当該障害厚生年金の支給事由となった障害とその他障害とを併合した障害の程度が従前より増進したときに請求できる。本問の者は、「65歳に達する日以後」に従前の障害（精神障害）とその他障害とを併合して障害等級2級に該当するに至っているため、その他障害との併合による障害厚生年金の額の改定の要件を満たさないほか、その他障害との併合による障害基礎年金の支給停止の解除の要件も満たしていないため、障害厚生年金の額の改定を請求することはできず、障害基礎年金の支給停止も解除されない。",src:"法52条4項・国年法36条2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第3回-選択7",opt:"空欄D",context:"厚生年金保険法第39条第1項の規定によると、乙年金の受給権者が甲年金の受給権を取得したため乙年金の受給権が消滅し、又は同一人に対して乙年金の支給を停止して甲年金を支給すべき場合において、乙年金の受給権が消滅し、又は乙年金の支給を停止すべき事由が生じた月の翌月以後の分として、乙年金の支払が行われたときは、【D】こととされている。",choices:["その支払われた乙年金は、甲年金の内払とみなす", "その支払われた乙年金は、甲年金の仮払とみなす", "その乙年金の支払金の金額を、甲年金の支払金の金額に充当することができる", "その乙年金の支払金の金額を、甲年金の支払金の金額に補填することができる"],answer:"その支払われた乙年金は、甲年金の内払とみなす",exp:"法39条1項。乙年金の受給権者が甲年金の受給権を取得したため乙年金の受給権が消滅し、又は同一人に対して乙年金の支給を停止して甲年金を支給すべき場合において、乙年金の受給権が消滅し、又は乙年金の支給を停止すべき事由が生じた月の翌月以後の分として、乙年金の支払が行われたときは、「その支払われた乙年金は、甲年金の内払とみなす」。",src:"法39条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第3回-選択7",opt:"空欄E",context:"厚生年金保険法第92条第2項の規定によると、保険料その他同法の規定による徴収金を徴収し、若しくはその還付を受ける権利又は保険給付の返還を受ける権利の時効については、その援用を要せず、また、【E】ものとされている。",choices:["その利益を放棄することができない", "その進行は停止しない", "その完成を猶予することができない", "その更新をすることができない"],answer:"その利益を放棄することができない",exp:"法92条2項。保険料その他同法の規定による徴収金を徴収し、若しくはその還付を受ける権利又は保険給付の返還を受ける権利の時効については、その援用を要せず、また、「その利益を放棄することができない」ものとされている。",src:"法92条2項",cat:"選択式（LEC公開模試）"},
{no:"LECファイナル-問1",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】障害手当金は、初診日から起算して5年を経過する日までの間に傷病が治っておらず、いまだその治療が継続中の場合であっても、初診日から起算して5年を経過する日においてその傷病により政令で定める程度の障害の状態にあれば、支給される。",a:false,exp:"法55条1項。障害手当金は、疾病にかかり、又は負傷し、その傷病に係る初診日において被保険者であった者が、当該初診日から起算して5年を経過する日までの間におけるその傷病の「治った日」において、その傷病により政令で定める程度の障害の状態にある場合において、初診日の前日における保険料納付要件を満たしているときに、その者に支給する。したがって、初診日から起算して5年を経過する日までに傷病が治っていなければ、障害手当金は支給されない。",src:"法55条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問1",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】60歳台前半の老齢厚生年金の支給を受けていた者が65歳に達し、当該60歳台前半の老齢厚生年金が消滅して、新たに65歳以後の老齢厚生年金の支給を受ける場合には、当該65歳以後の老齢厚生年金については裁定請求をする必要はない。",a:false,exp:"則30条の2第1項。60歳台前半の老齢厚生年金の受給権者であっても、65歳以後の老齢厚生年金について「裁定請求は必要である」。",src:"則30条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問1",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法第78条の2の規定によるいわゆる合意分割に係る標準報酬改定請求があった場合、実施機関は、第1号改定者が標準賞与額を有する対象期間に係る被保険者期間の各月ごとに、第2号改定者の標準賞与額を、第2号改定者の改定前の標準賞与額（標準賞与額を有しない月にあっては、零）に、第1号改定者の改定前の標準賞与額に改定割合を乗じて得た額を加えて得た額に改定し、又は決定することができる。",a:true,exp:"法78条の6第2項。本肢のとおりである。",src:"法78条の6第2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問1",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】障害等級1級の障害厚生年金の受給権者によって生計を維持しているその者の子であって、18歳に達する日以後の最初の3月31日までの間にあるものがある場合であっても、当該障害厚生年金に加給年金額は加算されない。",a:true,exp:"法50条の2第1項。本肢のとおりである。障害厚生年金に子の加給年金額の加算はない。",src:"法50条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問1",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】厚生労働大臣が支給する老齢厚生年金の受給権者が死亡したときは、戸籍法の規定による死亡の届出義務者は、14日以内に、その旨を厚生労働大臣に届け出なければならない。ただし、当該受給権者が、厚生労働大臣が住民基本台帳法第30条の9の規定により当該受給権者に係る機構保存本人確認情報の提供を受けることができる受給権者に該当し、かつ、その死亡の日から7日以内に当該受給権者に係る戸籍法の規定による死亡の届出が行われている場合は、この限りでない。",a:false,exp:"法98条4項、則41条5項・6項。厚生労働大臣が支給する老齢厚生年金の受給権者が死亡したときは、戸籍法の規定による死亡の届出義務者は、「10日以内」に、その旨を厚生労働大臣に届け出なければならない。本肢ただし書の記述は正しい。",src:"法98条4項・則41条",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問2",opt:"A",q:"【2以上の種別の被保険者であった期間を有する者の特例に関する記述として正しいか】第1号厚生年金被保険者期間と第2号厚生年金被保険者期間を有する者が、第1号厚生年金被保険者期間に基づく乙年金の受給権を取得した後、第1号厚生年金被保険者期間に基づく甲年金の受給権を取得したため、乙年金の支給が停止されて甲年金が支給されるべき場合において、乙年金の支給が停止されるべき事由が生じた月の翌月以後の分として、乙年金の支払が行われたときは、その支払われた乙年金は、甲年金の内払とみなされる。",a:true,exp:"法78条の24。本肢のとおりである。2以上の種別の被保険者であった期間を有する者については、一の期間に基づく年金たる保険給付間についてのみ内払調整が行われる。",src:"法78条の24",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問2",opt:"B",q:"【2以上の種別の被保険者であった期間を有する者の特例に関する記述として正しいか】第1号厚生年金被保険者期間に基づく報酬比例部分のみの60歳台前半の老齢厚生年金と第4号厚生年金被保険者期間に基づく報酬比例部分のみの60歳台前半の老齢厚生年金の受給権を有している者の被保険者期間が、第1号厚生年金被保険者期間が4年、第4号厚生年金被保険者期間が40年である場合において、その者が被保険者でないときは、厚生年金保険法附則第9条の3第1項の長期加入者の特例により、これらの60歳台前半の老齢厚生年金の額は、定額部分と報酬比例部分とを合算した額とされる。",a:false,exp:"法附則20条2項。長期加入者の特例は、「各号の厚生年金被保険者期間ごと」に適用される。したがって、1つの種別の厚生年金被保険者期間単独で44年以上となっていなければ、長期加入者の特例は適用されない。本肢の者の第1号厚生年金被保険者期間と第4号厚生年金被保険者期間はそれぞれ44年未満であるため、本肢の者に対しては「長期加入者の特例は適用されず、60歳台前半の老齢厚生年金の額は報酬比例部分のみの額となる」。",src:"法附則20条2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問2",opt:"C",q:"【2以上の種別の被保険者であった期間を有する者の特例に関する記述として正しいか】日本国籍を有していない者が第1号厚生年金被保険者期間を4か月有し、第4号厚生年金被保険者期間を2か月有した後に出国した場合、その者は、所定の要件を満たしている限り、脱退一時金の支給を請求することができる。",a:true,exp:"法附則30条。本肢のとおりである。脱退一時金については、2以上の被保険者の種別に係る被保険者であった期間を合算し、一の期間に係る被保険者期間のみを有するものとみなして、脱退一時金の支給要件を満たしているか否かを判断する。したがって、本肢の者の被保険者期間は、4か月＋2か月＝6か月となるため、他の要件を満たす限り、脱退一時金の支給を請求することができる。",src:"法附則30条",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問2",opt:"D",q:"【2以上の種別の被保険者であった期間を有する者の特例に関する記述として正しいか】第1号厚生年金被保険者期間と第3号厚生年金被保険者期間を有している老齢厚生年金の受給権者が、第1号厚生年金被保険者期間に基づく老齢厚生年金について支給繰下げの申出をする場合は、同時に第3号厚生年金被保険者期間に基づく老齢厚生年金についても支給繰下げの申出をしなければならない。",a:true,exp:"法78条の28第2項。本肢のとおりである。",src:"法78条の28第2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問2",opt:"E",q:"【2以上の種別の被保険者であった期間を有する者の特例に関する記述として正しいか】第1号厚生年金被保険者期間を2か月有し、第3号厚生年金被保険者期間を10か月有しているものが、60歳台前半の老齢厚生年金の支給開始年齢に達し、かつ、受給資格期間を満たしている場合、その者に対して60歳台前半の老齢厚生年金が支給される。",a:true,exp:"法附則20条1項。本肢のとおりである。60歳台前半の老齢厚生年金の支給要件の1つである「1年以上の被保険者期間を有すること」の要件を満たしているか否かについては、2以上の種別の被保険者であった期間を合算し、一の期間に係る被保険者期間のみを有するものとみなして判断する。したがって、本肢の場合、2か月＋10か月＝1年の被保険者期間を有している者となるため、60歳台前半の老齢厚生年金が支給される。",src:"法附則20条1項",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LECファイナル-問3",opt:"正しい組合せ",context:"65歳以上の受給権者が受ける次に掲げる年金の組合せのうち、そのいずれについても支給が停止されずに併給ができるものとして正しいものは【　】である。",choices:["老齢基礎年金と遺族厚生年金", "遺族基礎年金と障害厚生年金", "障害厚生年金と老齢厚生年金", "障害基礎年金と障害厚生年金と遺族厚生年金", "障害基礎年金と老齢厚生年金と遺族厚生年金"],answer:"老齢基礎年金と遺族厚生年金",exp:"法38条1項、法64条の2、法附則17条。65歳以上の受給権者について、「老齢基礎年金と遺族厚生年金」は全額併給可能である。遺族基礎年金と障害厚生年金・障害厚生年金と老齢厚生年金・障害厚生年金と遺族厚生年金はいずれも併給することができない。障害基礎年金と老齢厚生年金と遺族厚生年金はすべて併給可能であるが、遺族厚生年金は老齢厚生年金の額相当額が支給停止されるため、そのいずれについても支給が停止されずに併給ができるとはいえない。",src:"法38条1項・法64条の2・法附則17条",cat:"選択式（LEC公開模試）"},
{no:"LECファイナル-問4",opt:"A",q:"厚生労働大臣は、標準報酬平均額その他これに関連する事項で厚生労働省令で定めるものについて、実施機関（厚生労働大臣を除く。）を所管する大臣に報告を行うものとされている。",a:true,exp:"法100条の3第2項。本肢のとおりである。",src:"法100条の3第2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問4",opt:"B",q:"令和8年7月1日において使用されている被保険者であっても、その者が同年4月から同年6月までのいずれかの月において随時改定の規定により標準報酬月額が改定された者であるときは、その者については同年に限り、定時決定は行われない。",a:false,exp:"法21条3項。随時改定等の規定により「7月から9月まで」のいずれかの月から標準報酬月額を改定され、又は改定されるべき被保険者については、その年に限り、定時決定は行われない。",src:"法21条3項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問4",opt:"C",q:"適用事業所以外の事業所に使用される70歳以上の者であって、老齢厚生年金、国民年金法による老齢基礎年金その他の老齢又は退職を支給事由とする年金たる給付であって政令で定める給付の受給権を有しないもの（厚生年金保険法第12条各号の適用除外に該当する者を除く。）は、厚生労働大臣に申し出て、高齢任意加入被保険者となることができる。",a:false,exp:"法附則4条の5第1項。適用事業所以外の事業所に使用される70歳以上の者であって、老齢又は退職を支給事由とする年金たる給付であって政令で定める給付の受給権を有しないもの（適用除外に該当する者を除く）は、「厚生労働大臣の認可を受けて」、高齢任意加入被保険者となることができる。",src:"法附則4条の5第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問4",opt:"D",q:"厚生労働大臣による保険給付に関する処分の取消しの訴えは、当該処分についての審査請求に対する社会保険審査官の決定を経ずに、提起することができる。",a:false,exp:"法91条の3。厚生労働大臣による保険給付に関する処分の取消しの訴えは、「当該処分についての審査請求に対する社会保険審査官の決定を経た後でなければ、提起することができない」。",src:"法91条の3",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問4",opt:"E",q:"実施機関は、被保険者の資格、標準報酬、保険料又は保険給付に関し必要があると認めるときは、官公署（実施機関を除く。）に対し、事業所の名称、所在地その他の事項につき、必要な資料の提供を求めることができるとされている。",a:false,exp:"法100条の2第2項。実施機関は、「被保険者の資格、標準報酬又は保険料」に関し必要があると認めるときは、官公署（実施機関を除く）に対し、事業所の名称、所在地その他の事項につき、必要な資料の提供を求めることができるとされている。",src:"法100条の2第2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問5",opt:"A",q:"老齢厚生年金の受給権者がその権利を取得した当時胎児であった子が出生したときは、その子は当該受給権者がその権利を取得した当時その者によって生計を維持していた子とみなされ、その出生した月から、老齢厚生年金の額が改定される。",a:false,exp:"法44条3項。老齢厚生年金の受給権者がその権利を取得した当時胎児であった子が出生したときは、その子は当該受給権者がその権利を取得した当時その者によって生計を維持していた子とみなされ、その出生の月の「翌月」から、老齢厚生年金の額が改定される。",src:"法44条3項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問5",opt:"B",q:"第1号厚生年金被保険者が同時に2以上の事業所に使用されるに至った場合において、当該2以上の事業所に係る日本年金機構の業務が同一の年金事務所において行われるときは、当該第1号厚生年金被保険者は、厚生年金保険法施行規則第2条第1項の規定による2以上の事業所勤務の届出を、5日以内に行わなければならない。",a:false,exp:"則2条1項。本肢の場合、第1号厚生年金被保険者は、2以上の事業所勤務の届出を「10日以内」に行わなければならない。",src:"則2条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問5",opt:"C",q:"60歳台前半の老齢厚生年金の定額部分に相当する額と昭和36年4月1日以後の20歳以上65歳未満の厚生年金保険の被保険者期間に係る老齢基礎年金相当額に差額が生じているときは、当該差額が経過的加算として老齢厚生年金に加算される。",a:false,exp:"昭60法附則59条2項。60歳台前半の老齢厚生年金の定額部分に相当する額と昭和36年4月1日以後の20歳以上「60歳未満」の厚生年金保険の被保険者期間に係る老齢基礎年金相当額に差額が生じているときは、当該差額が経過的加算として老齢厚生年金に加算される。",src:"昭60法附則59条2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問5",opt:"D",q:"遺族厚生年金に加算される中高齢寡婦加算の額は、遺族基礎年金の額に相当する金額である。",a:false,exp:"法62条1項。遺族厚生年金に加算される中高齢寡婦加算の額は、遺族基礎年金の額に「4分の3」を乗じて得た額である。",src:"法62条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問5",opt:"E",q:"適用事業所以外の事業所に使用される高齢任意加入被保険者が老齢厚生年金、老齢基礎年金その他の老齢又は退職を支給事由とする年金たる給付であって政令で定める給付の受給権を取得したために当該被保険者の資格を喪失した場合、事業主は、厚生年金保険被保険者資格喪失届を提出する必要はない。",a:true,exp:"則22条1項。本肢のとおりである。",src:"則22条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問6",opt:"A",q:"【厚生労働大臣の権限に係る事務の委任に関する記述として正しいか】適用事業所以外の事業所を適用事業所とする認可に関する厚生労働大臣の権限に係る事務は、日本年金機構に委任されている。",a:true,exp:"法100条の4第1項。本肢のとおりである。適用事業所を適用事業所でなくする認可に関する厚生労働大臣の権限に係る事務についても、日本年金機構に委任されている。",src:"法100条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問6",opt:"B",q:"【厚生労働大臣の権限に係る事務の委任に関する記述として正しいか】脱退一時金の支給の請求の受理に関する厚生労働大臣の権限に係る事務は、日本年金機構に委任されている。",a:true,exp:"法100条の4第1項。本肢のとおりである。",src:"法100条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問6",opt:"C",q:"【厚生労働大臣の権限に係る事務の委任に関する記述として正しいか】厚生年金保険原簿の訂正請求があった場合において、その訂正をする旨の決定に関する厚生労働大臣の権限に係る事務は、日本年金機構に委任されている。",a:false,exp:"法100条の4第1項。本肢の権限に係る事務は、日本年金機構に「委任されていない」。",src:"法100条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問6",opt:"D",q:"【厚生労働大臣の権限に係る事務の委任に関する記述として正しいか】被保険者に対して賞与が支払われた場合の標準賞与額の決定に関する厚生労働大臣の権限に係る事務は、日本年金機構に委任されている。",a:true,exp:"法100条の4第1項。本肢のとおりである。",src:"法100条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問6",opt:"E",q:"【厚生労働大臣の権限に係る事務の委任に関する記述として正しいか】老齢厚生年金の加給年金額の加算について、老齢厚生年金の受給権者によって生計を維持していることの認定に関する厚生労働大臣の権限に係る事務は、日本年金機構に委任されている。",a:true,exp:"法100条の4第1項。本肢のとおりである。",src:"法100条の4第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問7",opt:"ア",q:"【厚生年金保険法に関する記述として正しいか】障害手当金の額は、被保険者であった全期間の平均標準報酬額の1,000分の5.481に相当する額に被保険者期間の月数（300に満たないときは、300とする。）を乗じて得た額の100分の200に相当する額とする。ただし、その額が国民年金法第33条第1項に規定する障害等級2級の障害基礎年金の額に4分の3を乗じて得た額に2を乗じて得た額に満たないときは、当該額とする。",a:true,exp:"法57条。本肢のとおりである。",src:"法57条",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問7",opt:"イ",q:"【厚生年金保険法に関する記述として正しいか】国庫は、毎年度、予算の範囲内で、厚生年金保険事業の事務（基礎年金拠出金の負担に関する事務を含む。）の執行（実施機関（厚生労働大臣を除く。）によるものを除く。）に要する費用を負担する。",a:true,exp:"法80条2項。本肢のとおりである。",src:"法80条2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問7",opt:"ウ",q:"【厚生年金保険法に関する記述として正しいか】被保険者が死亡したために遺族厚生年金の受給権を取得した子が、当該受給権を取得した当時から引き続き障害等級1級に該当している場合、その子が20歳に達した場合であっても、当該遺族厚生年金の受給権は消滅しない。",a:false,exp:"法63条2項。遺族厚生年金の受給権者である子が20歳に達したときは、子の障害の状態にかかわらず、当該遺族厚生年金の受給権は「消滅する」。",src:"法63条2項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問7",opt:"エ",q:"【厚生年金保険法に関する記述として正しいか】厚生年金保険法において、「保険料納付済期間」とは、被保険者期間のうち、保険料が納付された期間（滞納処分によって保険料が徴収された期間を含む。）をいう。",a:false,exp:"法3条1項。厚生年金保険法において、「保険料納付済期間」とは、「国民年金法5条1項に規定する保険料納付済期間」をいう。第2号被保険者としての被保険者期間並びに第3号被保険者としての被保険者期間を合算した期間等を含む概念であり、本肢の定義は誤りである。",src:"法3条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問7",opt:"オ",q:"【厚生年金保険法に関する記述として正しいか】昭和60年4月に旧厚生年金保険法による障害年金であって障害基礎年金に相当するものとして政令で定めるものの支給を受けることができる者が、令和8年4月に更に障害等級2級の障害厚生年金を支給すべき事由が生じた場合、前後の障害を併合した障害の程度による障害厚生年金が支給され、当該障害年金の受給権は消滅する。",a:false,exp:"昭60法附則69条1項。本肢の場合、併合認定により、前後の障害を併合した障害の程度による障害厚生年金が支給されるが、この併合認定が行われた場合であっても、旧厚生年金保険法の「障害年金の受給権は消滅しない」。この場合、障害年金と併合認定後の障害厚生年金のいずれかを選択受給する。",src:"昭60法附則69条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問8",opt:"A",q:"【特定適用事業所に使用される短時間労働者（週20時間未満・報酬月額88,000円未満・学生等は被保険者とならない）の適用除外の取扱いとして正しいか】就業規則や雇用契約書等で定められた1週間の所定労働時間が20時間未満であったために被保険者とならなかった短時間労働者について、その労働時間が連続する2月において1週間当たり20時間以上となった場合で、引き続き同様の状態が続いている又は続くことが見込まれる場合は、実際の労働時間が初めて1週間当たり20時間以上となった最初の月の初日にさかのぼって被保険者の資格を取得する。",a:false,exp:"令6.1.17事務連絡。就業規則や雇用契約書等で定められた1週間の所定労働時間が20時間未満であったために被保険者とならなかった短時間労働者について、その労働時間が連続する2月において1週間当たり20時間以上となった場合で、引き続き同様の状態が続いている又は続くことが見込まれる場合は、実際の労働時間が1週間当たり20時間以上となった月の「3月目の初日」に被保険者の資格を取得する。",src:"令6.1.17事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問8",opt:"B",q:"【特定適用事業所に使用される短時間労働者（週20時間未満・報酬月額88,000円未満・学生等は被保険者とならない）の適用除外の取扱いとして正しいか】所定労働時間が1年単位で定められている場合には、当該1年間の所定労働時間を52で除して得た時間をもって、1週間の所定労働時間とする。",a:true,exp:"令6.1.17事務連絡。本肢のとおりである。なお、所定労働時間が1か月単位で定められている場合は、1か月の所定労働時間を12分の52で除して1週間の所定労働時間を算出する。",src:"令6.1.17事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問8",opt:"C",q:"【特定適用事業所に使用される短時間労働者（週20時間未満・報酬月額88,000円未満・学生等は被保険者とならない）の適用除外の取扱いとして正しいか】4週5休制等のため、1週間の所定労働時間が短期的かつ周期的に変動し、一定ではない場合等は、当該周期における1週間の所定労働時間を平均して1週間の所定労働時間を算出する。",a:true,exp:"令6.1.17事務連絡。本肢のとおりである。",src:"令6.1.17事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問8",opt:"D",q:"【特定適用事業所に使用される短時間労働者（週20時間未満・報酬月額88,000円未満・学生等は被保険者とならない）の適用除外の取扱いとして正しいか】通信制課程に在学する者は、「学校教育法第50条に規定する高等学校の生徒、同法第83条に規定する大学の学生その他の厚生労働省令で定める者」に該当しない。",a:true,exp:"令6.1.17事務連絡。本肢のとおりである。",src:"令6.1.17事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問8",opt:"E",q:"【特定適用事業所に使用される短時間労働者（週20時間未満・報酬月額88,000円未満・学生等は被保険者とならない）の適用除外の取扱いとして正しいか】報酬が月額88,000円未満であったために被保険者資格を取得していなかった者について、令和8年6月20日に給与の増額改定が決定され、その改定された給与規程が同年7月1日から施行されることとなり、また、同年4月1日から同年6月30日までの給与に対する差額分は同年7月20日に支給されることとなった。この改定により、この者の報酬が月額88,000円以上となるために被保険者資格を取得することとなった場合、この者は令和8年7月1日に被保険者資格を取得する。",a:true,exp:"令6.1.17事務連絡。本肢のとおりである。本肢の場合、報酬が月額88,000円以上に該当することとなった給与改定の施行日に被保険者資格を取得する。",src:"令6.1.17事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問9",opt:"A",q:"報酬比例部分のみの60歳台前半の老齢厚生年金の受給権者が被保険者でなく、かつ、所定の障害状態にある場合は、定額部分と報酬比例部分とを合算した額の60歳台前半の老齢厚生年金を請求することができるが、障害等級3級に該当する程度の障害の状態は、この障害状態に含まれない。",a:false,exp:"法附則9条の2第1項。報酬比例部分のみの60歳台前半の老齢厚生年金の受給権者が被保険者でなく、かつ、障害等級1級から「3級」までの障害状態にある場合は、定額部分と報酬比例部分とを合算した額の60歳台前半の老齢厚生年金を請求することができる。",src:"法附則9条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問9",opt:"B",q:"繰下げ支給の老齢厚生年金の受給権者に対して在職老齢年金の規定による支給停止が適用される場合において、当該老齢厚生年金に加給年金額、経過的加算額及び繰下げ加算額が加算されているときは、在職老齢年金の規定の適用に当たっては、繰下げ加算額のみを除いた老齢厚生年金の額を12で除して得た額が基本月額となる。",a:false,exp:"法46条1項、昭60法附則62条1項。繰下げ支給の老齢厚生年金の受給権者に対して在職老齢年金の規定による支給停止が適用される場合において、当該老齢厚生年金に加給年金額、経過的加算額及び繰下げ加算額が加算されているときは、在職老齢年金の規定の適用に当たっては、「それらすべて（加給年金額、経過的加算額及び繰下げ加算額）を除いた」老齢厚生年金の額を12で除して得た額が基本月額となる。",src:"法46条1項・昭60法附則62条1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問9",opt:"C",q:"脱退一時金の支給回数には制限がないため、すでに脱退一時金の支給を受けた者であっても、支給要件を満たす度に脱退一時金の支給を請求することができる。",a:true,exp:"法附則29条。本肢のとおりである。",src:"法附則29条",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問9",opt:"D",q:"令和7年の年金制度改正により、令和8年度以後、厚生年金における調整率と国民年金における調整率は一致させることとされた。",a:false,exp:"令7法附則3条ほか。令和7年の年金制度改正により、令和8年度以後、厚生年金の調整期間を延長させることにより生じた財源を活用し、国民年金の調整期間の短縮を図ることとされ、この調整期間の延長による厚生年金財政への影響を軽減させるため、厚生年金における調整率は国民年金における調整率よりも「軽減させる」こととされた。したがって、厚生年金における調整率と国民年金における調整率は「一致していない」。",src:"令7法附則3条",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問9",opt:"E",q:"適用事業所以外の事業所の事業主は、厚生労働大臣の認可を受けて、当該事業所を適用事業所とすることができるが、当該認可を受けようとするときは、当該事業所の事業主は、当該事業所に使用される者（厚生年金保険法第12条の適用除外に該当する者等を除く。）全員の同意を得て、厚生労働大臣に申請しなければならない。",a:false,exp:"法6条3項・4項。本肢の認可を受けようとするときは、当該事業所の事業主は、当該事業所に使用される者（適用除外に該当する者等を除く）の「2分の1以上」の同意を得て、厚生労働大臣に申請しなければならない。本肢前段の記述は正しい。",src:"法6条3項・4項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問10",opt:"A",q:"適用事業所に使用される高齢任意加入被保険者は、その個人番号を変更したときは、5日以内に、氏名、生年月日及び住所、変更前及び変更後の個人番号並びに個人番号の変更年月日を記載した届書を日本年金機構に提出しなければならない。",a:false,exp:"則5条の6。適用事業所に使用される高齢任意加入被保険者は、その個人番号を変更したときは、「速やかに」、氏名、生年月日及び住所、変更前及び変更後の個人番号並びに個人番号の変更年月日を記載した届書を日本年金機構に提出しなければならない。",src:"則5条の6",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問10",opt:"B",q:"年金は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれその月分までが支払われる。ただし、前支払期月に支払うべきであった年金又は権利が消滅した場合若しくは年金の支給を停止した場合におけるその期の年金は、支払期月でない月であっても、支払われる。",a:false,exp:"法36条3項。年金は、毎年2月、4月、6月、8月、10月及び12月の6期に、それぞれその「前月分」までが支払われる。本肢ただし書の記述は正しい。",src:"法36条3項",cat:"択一式（LEC公開模試）"},

{no:"LECファイナル-問10",opt:"D",q:"65歳に達して老齢厚生年金の受給権を取得した者が、その受給権取得日から起算して1年を経過した日までに障害基礎年金の受給権を取得していても、この者は、他の要件を満たしていれば、当該老齢厚生年金について支給繰下げの申出をすることができる。",a:true,exp:"法44条の3第1項。本肢のとおりである。老齢厚生年金の受給権を取得した日から1年を経過した日までの間において他の年金たる給付の受給権者となった場合には、支給繰下げの申出をすることができないが、この「他の年金たる給付」とは、厚生年金保険法による他の年金たる保険給付又は国民年金法による年金たる給付（老齢基礎年金及び付加年金並びに障害基礎年金を除く）をいうため、障害基礎年金の受給権者となった場合であっても、所定の要件を満たす限り、支給繰下げの申出をすることができる。",src:"法44条の3第1項",cat:"択一式（LEC公開模試）"},
{no:"LECファイナル-問10",opt:"E",q:"第1号厚生年金被保険者及び当該第1号厚生年金被保険者を使用する事業主は、それぞれ保険料の半額を負担するのが原則であるが、当該事業主は、あらかじめ、厚生労働大臣の認可を受けることにより、自己の保険料の負担割合を増加させることができる。",a:false,exp:"法82条1項。本肢後段にあるような保険料負担割合の増加の規定はない。第1号厚生年金被保険者及び当該第1号厚生年金被保険者を使用する事業主は、それぞれ保険料の半額を負担する。",src:"法82条1項",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LECファイナル-選択7",opt:"空欄A",context:"厚生年金保険法第2条の2の規定によると、同法による年金たる保険給付の額は、国民の生活水準、賃金その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、【A】が講ぜられなければならないとされている。",choices:["速やかに改定の措置", "即時に変更の措置", "直ちに更新の措置", "遅滞なく是正の措置"],answer:"速やかに改定の措置",exp:"法2条の2。厚生年金保険法による年金たる保険給付の額は、国民の生活水準、賃金その他の諸事情に著しい変動が生じた場合には、変動後の諸事情に応ずるため、「速やかに改定の措置」が講ぜられなければならない。",src:"法2条の2",cat:"選択式（LEC公開模試）"},

// ============================================================
//  GOOGLE DRIVE SYNC
// ============================================================
const CLIENT_ID    = APP_CONFIG.clientId;
const SCOPES       = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = APP_CONFIG.driveFileName;
let tokenClient = null, gapiInited = false, gisInited = false;
let accessToken = null, driveFileId = null, isSyncing = false;
let autoSaveTimer = null;
let tokenRefreshTimer = null; // トークン自動更新タイマー

window.addEventListener('load', () => {
  // ログイン済みの場合は「再接続中」表示
  if (getSavedAuth()) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncStatusText');
    if (dot) dot.className = 'sync-dot syncing';
    if (txt) txt.textContent = '再接続中…';
  }
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
    maybeEnableSync();
  });
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) {
          if (getSavedAuth()) {
            updateSyncUI(false);
            showToast('再接続できませんでした。再度ログインしてください', 'warn');
          }
          return;
        }
        accessToken = resp.access_token;
        gapi.client.setToken({ access_token: accessToken });
        onSignedIn();
        // 55分後にトークンを自動更新（アクセストークンは1時間で失効）
        if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
        tokenRefreshTimer = setTimeout(() => {
          if (getSavedAuth()) tokenClient.requestAccessToken({ prompt: '' });
        }, 55 * 60 * 1000);
      }
    });
    gisInited = true;
    maybeEnableSync();
  };
  document.head.appendChild(s);
});

function maybeEnableSync() {
  if (gapiInited && gisInited && getSavedAuth()) {
    tokenClient.requestAccessToken({ prompt: '' });
  }
}
function signIn() {
  if (!gapiInited || !gisInited) { showToast('初期化中です、少々お待ちください', 'error'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null; driveFileId = null;
  if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }
  clearSavedAuth(); updateSyncUI(false);
  showToast('ログアウトしました');
}
function onSignedIn() {
  updateSyncUI(true); saveAuthHint();
  showToast('ログイン成功、データを読み込んでいます…', 'success');
  loadFromDrive();
}
function updateSyncUI(loggedIn) {
  document.getElementById('syncDot').className = 'sync-dot' + (loggedIn ? ' connected' : '');
  document.getElementById('syncStatusText').textContent = loggedIn ? 'Googleドライブに同期中' : 'Googleアカウントで同期';
  document.getElementById('syncUser').style.display = 'none';
  document.getElementById('btnSignIn').style.display    = loggedIn ? 'none'  : 'flex';
  document.getElementById('btnManualSync').style.display = loggedIn ? 'block' : 'none';
  document.getElementById('btnManualSync').disabled = !loggedIn;
  document.getElementById('btnSignOut').style.display   = loggedIn ? 'block' : 'none';
}
function setSyncing(v) {
  isSyncing = v;
  const dot = document.getElementById('syncDot');
  const btn = document.getElementById('btnManualSync');
  if (v) { dot.className = 'sync-dot syncing'; if (btn) { btn.disabled = true; btn.textContent = '同期中…'; } }
  else   { dot.className = 'sync-dot connected'; if (btn) { btn.disabled = false; btn.textContent = '↑↓ 同期'; } }
}
async function loadFromDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const tokenInfo = await fetch('https://www.googleapis.com/oauth2/v1/tokeninfo?access_token=' + accessToken);
    if (!tokenInfo.ok) {
      accessToken = null; clearSavedAuth(); updateSyncUI(false);
      showToast('セッション切れ：再度ログインしてください', 'warn');
      setSyncing(false); return;
    }
    const params = new URLSearchParams({ spaces: 'appDataFolder', q: `name='${DRIVE_FILE_NAME}'`, fields: 'files(id,name)' });
    const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?${params}`, { headers: { 'Authorization': 'Bearer ' + accessToken } });
    if (!listRes.ok) { const eb = await listRes.text(); throw new Error(`list:${listRes.status} ${eb.substring(0,100)}`); }
    const listData = await listRes.json();
    const files = listData.files || [];
    if (files.length > 0) {
      driveFileId = files[0].id;
      const fileRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, { headers: { 'Authorization': 'Bearer ' + accessToken } });
      if (!fileRes.ok) throw new Error(`read:${fileRes.status}`);
      const data = await fileRes.json();
      mergeCloudData(data);
      showToast('クラウドから読み込みました', 'success');
    } else {
      showToast('クラウドにデータがありません（初回）');
      await saveToDrive();
    }
  } catch (e) {
    console.error('Drive load error:', e);
    const msg = (e instanceof Error && e.message) ? e.message : (typeof e === 'object' ? JSON.stringify(e).substring(0,100) : String(e)) || '通信エラー';
    showToast('読み込み失敗: ' + msg, 'error');
  }
  setSyncing(false);
}
async function saveToDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const body = JSON.stringify(buildSavePayload());
    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body
      });
    } else {
      const meta = JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&spaces=appDataFolder', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken }, body: form
      });
      driveFileId = (await res.json()).id;
    }
    showToast('クラウドに保存しました', 'success');
  } catch (e) {
    console.error(e);
    showToast('保存失敗: ' + (e?.message || '通信エラー'), 'error');
  }
  setSyncing(false);
}
async function manualSync() {
  if (!accessToken) { showToast('先にログインしてください', 'error'); return; }
  await loadFromDrive();
}
function scheduleAutoSave() {
  if (!accessToken) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveToDrive(), 3000);
}
// ページが非表示になる瞬間（タブ切替・閉じる直前）に即時保存
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && accessToken) {
    if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
    saveToDrive();
  }
});

// ============================================================
//  SAVE / LOAD PAYLOAD
//  ★ v2: stats（正答率）と session（中断データ）を両方保存
// ============================================================
function buildSavePayload() {
  // 現在進行中のセッション or 中断済みの pendingResume を保存
  let sessionData = null;
  // ★ 中断セッション（pendingResume）を最優先で保存。別モードを実行中でも中断点を失わない。
  //    pendingResume が無いときのみ、進行中セッションを保存（タブを閉じた際の自動復帰用）。
  if (pendingResume) {
    sessionData = pendingResume;
  } else if (currentSession && questions.length > 0) {
    sessionData = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
  }
  return {
    version: 2,
    bookmarks: [...bookmarks],          // ★ 栞 → Drive同期で他デバイスにも反映
    stats: JSON.parse(JSON.stringify(questionStats)), // ★ 正答率データ
    session: sessionData,               // ★ 中断セーブ
    savedAt: new Date().toISOString()
  };
}
function mergeCloudData(data) {
  if (!data) return;
  // 栞
  if (data.bookmarks) bookmarks = new Set(data.bookmarks);
  // ★ 正答率データを復元
  if (data.stats) {
    Object.entries(data.stats).forEach(([k, v]) => { questionStats[k] = v; });
  }
  // ★ 中断セッションを復元（1問以上回答済みの場合のみ）
  if (data.session && data.session.questionIndices && data.session.answers) {
    const answered = data.session.answers.filter(a => a !== null).length;
    if (answered > 0) pendingResume = data.session;
  }
  localSave();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateRecentWrongBtn();

// ============================================================
//  STATS
// ============================================================
let questionStats = {}; // { origIdx: {correct:N, total:N} }

function recordStat(origIdx, isCorrect) {
  if (!questionStats[origIdx]) questionStats[origIdx] = {correct:0, total:0};
  // ★ lw = last wrong（最後に間違えた時刻）。1問1個・上書き。復習モードでも必ず更新する。
  //    （更新しないと、復習で間違え続けても日数窓から外れてしまうため）
  if (!isCorrect) questionStats[origIdx].lw = Date.now();
  // ★ 復習モード（noStats）では correct/total を更新しない
  //    ＝「正答率50%以下」「挑戦回数が少ない」モードの純度を保つ
  if (!(currentSession && currentSession.noStats)) {
    questionStats[origIdx].total++;
    if (isCorrect) questionStats[origIdx].correct++;
  }
  localSave(); scheduleAutoSave(); updateWeakBtn(); updateLeastTriedBtn(); updateRecentWrongBtn();
}

// ============================================================
//  RECENT WRONG（直近X日間に間違えた問題）
// ============================================================
function getRecentWrongDays() {
  const el = document.getElementById('recentWrongInput');
  const v = el ? parseInt(el.value) : 7;
  return (!v || v < 1) ? 7 : Math.min(v, 90);
}
function getRecentWrongPool(days) {
  const limit = Date.now() - days * 24 * 60 * 60 * 1000;
  return ALL_QUESTIONS.map((q, i) => ({ q, i }))
    .filter(x => {
      const s = questionStats[x.i];
      return s && s.lw && s.lw >= limit;
    })
    .map(x => ({ ...x.q, _origIdx: x.i }));
}
function updateRecentWrongBtn() {
  const wrap = document.getElementById('recentWrongMode');
  const btn  = document.getElementById('btnRecentWrongStart');
  if (!wrap || !btn) return;
  // 過去90日以内に1問でも間違い記録があるときのみモード自体を表示
  const anyLog = Object.keys(questionStats).some(k => {
    const s = questionStats[k];
    return s && s.lw && s.lw >= Date.now() - 90 * 24 * 60 * 60 * 1000;
  });
  wrap.style.display = anyLog ? 'block' : 'none';
  if (!anyLog) return;
  const d = getRecentWrongDays();
  const n = getRecentWrongPool(d).length;
  btn.textContent = `直近${d}日間で間違えた問題を出題（${n}問）`;
  btn.disabled = (n === 0);
  btn.style.opacity = n === 0 ? '.45' : '1';
}
function startRecentWrong() {
  const d = getRecentWrongDays();
  startSession({ useRecentWrong: true, days: d });
}
function getAccuracyInfo(origIdx) {
  const s = questionStats[origIdx];
  if (!s || s.total === 0) return null;
  const pct = Math.round((s.correct / s.total) * 100);
  return {
    total: s.total, pct,
    cls: pct >= 80 ? 'high' : (pct >= 50 ? 'mid' : 'low')
  };
}

// ============================================================
//  WEAK QUESTIONS
// ============================================================
function updateWeakBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return s && s.total > 0 && (s.correct / s.total) <= 0.5;
  });
  const btn = document.getElementById('btnWeakStart');
  btn.style.display = pool.length > 0 ? 'block' : 'none';
  if (pool.length === 0) btn.textContent = 'まだ回答データがありません';
  else btn.textContent = `正答率50%以下の問題を出題（${pool.length}問）`;
}
function startWeak() {
  const s = { useWeak: true };
  startSession(s);
}
function updateLeastTriedBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return !s || s.total === 0 || s.total < 3; // 3回未満
  });
  const btn = document.getElementById('btnLeastTried');
  if (!btn) return;
  if (pool.length > 0) {
    btn.style.display = 'block';
    btn.textContent = `挑戦回数が少ない問題を出題（${pool.length}問）`;
  } else {
    btn.style.display = 'none';
  }
}
function startLeastTried() {
  // 挑戦回数でソート（少ない順）→上位20問を出題
  const indexed = ALL_QUESTIONS.map((q,i) => ({q, i, tries: (questionStats[i]||{total:0}).total}));
  indexed.sort((a,b) => a.tries - b.tries);
  const maxTries = indexed[Math.min(19, indexed.length-1)].tries;
  const pool = indexed.filter(x => x.tries <= maxTries).map(x => ({...x.q, _origIdx: x.i}));
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  const take = pool.slice(0, 20);
  questions = take; answers = Array(take.length).fill(null); current = 0;
  currentSession = { questionIndices: take.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`挑戦回数の少ない${take.length}問を出題`, 'success');
}

  if (pool.length === 0) { clearResume(); return; }

const FILTERS = [
  { key: 'ox',     label: '択一式' },
  { key: 'select', label: '選択式' },
];
function filterMatch(q, key) {
  if (key === 'all')    return true;
  if (key === 'select') return q.type === 'select';
  return q.type !== 'select';   // ox（択一式）
}

// ============================================================
//  FILTER
// ============================================================
function initFilters() {
  const btns = document.getElementById('filterBtns');

  if (allBtn) allBtn.onclick = () => selectFilter('all', allBtn);

    btn.onclick = () => selectFilter(f.key, btn);
    btns.appendChild(btn);

}
function selectFilter(cat, btn) {
  document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  const p = ALL_QUESTIONS.filter(q => filterMatch(q, cat));

  input.max = p.length; 
  if (parseInt(input.value) > p.length) input.value = p.length;
  updateRandomBtn();
}
function getFilteredPool() {
  const active = document.querySelector('.btn-filter.active');
  if (!active) return ALL_QUESTIONS;
  return ALL_QUESTIONS.filter(q => filterMatch(q, active.dataset.cat));
}

function updateRandomBtn() {
  const input = document.getElementById('randomInput');
  const btn = document.getElementById('btnRandomStart');
  btn.textContent = `${input.value}問ランダムで出題`;
}
function startRandom() {
  const num = parseInt(document.getElementById('randomInput').value) || 10;
  let pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  if (num >= pool.length) pool = pool;
  else {
    pool = shuffleArray(pool).slice(0, num);
  }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };

}

// ============================================================
//  SHUFFLE
// ============================================================
// Fisher–Yates（一様シャッフル）。sort(()=>Math.random()-0.5) は分布が偏るため使わない
function shuffleArray(arr) {
  const r = arr.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

// ============================================================
//  START MODES
// ============================================================
function start() {
  const s = {};
  startSession(s);
}
function startBookmarks() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const s = { useBookmarks: true };
  startSession(s);
}
function startSession(s) {
  let pool = [];
  
  if (s.useBookmarks) {
    pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  } else if (s.useRecentWrong) {
    pool = getRecentWrongPool(s.days || 7);
  } else if (s.useWeak) {
    let p = ALL_QUESTIONS.map((q, i) => ({ ...q, _origIdx: i }));
    pool = p.filter(q => {
      const stat = questionStats[q._origIdx];
      return stat && stat.total > 0 && (stat.correct / stat.total) <= 0.5;
    });
  } else {
    pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  }

  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  // ★ noStats: 復習モードでは正答率・挑戦回数に反映しない
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers], noStats: !!s.useRecentWrong };
  showQuestionScreen(); updateQuestion();
  if (s.useRecentWrong) showToast(`直近${s.days || 7}日間の誤答${pool.length}問を復習（記録に反映されません）`, 'success');
}

function getOrigIdx(q) { return q._origIdx !== undefined ? q._origIdx : ALL_QUESTIONS.indexOf(q); }

// ============================================================
//  UPDATE QUESTION
// ============================================================
function updateQuestion() {
  if (questions.length === 0 || current >= questions.length) return;
  
  const q = questions[current];
  const currentQIndex = getOrigIdx(q);
  
  // プログレスバー
  const progressInfo = `${current + 1} / ${questions.length}`;
  const correctCount = answers.filter(a => a && a.correct).length;
  document.getElementById('progressNum').textContent = progressInfo;
  document.getElementById('progressScore').textContent = `正解: ${correctCount}問`;
  document.getElementById('progressFill').style.width = `${((current + 1) / questions.length) * 100}%`;
  
  // 問題カード
  document.getElementById('qTag').textContent = q.cat;
  document.getElementById('qTag').textContent = q.cat;
  document.getElementById('qNum').textContent = q.no + (q.opt ? '-' + q.opt : '');
  if (q.type === 'select') {
    document.getElementById('qText').innerHTML = q.context;
    // 空欄を強調
    const regex = /【[A-Z]】/g;
    document.getElementById('qText').innerHTML = document.getElementById('qText').innerHTML.replace(
      regex, '<span class="q-blank">$&</span>'
    );
  } else {
    document.getElementById('qText').textContent = q.q;
  }
  
  // タイプバッジ
  const typeBadge = document.getElementById('qTypeBadge');
  if (q.type === 'select') {
    typeBadge.textContent = '選択式';
    typeBadge.className = 'q-type-badge sel';
    typeBadge.style.display = 'inline-block';
  } else {
    typeBadge.textContent = '○×';
    typeBadge.className = 'q-type-badge ox';
    typeBadge.style.display = 'inline-block';
  }

  // ★ 正答率バッジ・挑戦回数バッジ・栞ボタン（回答後のみ表示）
  const accEl  = document.getElementById('qAcc');
  const triesEl = document.getElementById('qTries');
  const bBtn = document.getElementById('btnBookmark');

  // ★ 復習モード（記録非反映）バッジ
  const revEl = document.getElementById('qReview');
  if (revEl) revEl.style.display = (currentSession && currentSession.noStats) ? 'inline-block' : 'none';

  const ans    = answers[current];
  const panel  = document.getElementById('resultPanel');
  const nextBtn = document.getElementById('btnNext');
  const isSelect = (q.type === 'select');

  if (ans) {
    // 回答後：バッジ・栞を表示
    const accInfo = getAccuracyInfo(currentQIndex);
    if (accInfo) {
      accEl.textContent = `過去${accInfo.total}回: ${accInfo.pct}%正解`;
      accEl.className   = `q-acc ${accInfo.cls}`;
      accEl.style.display = 'inline-block';
    } else {
      accEl.style.display = 'none';
    }
    const s = questionStats[currentQIndex];
    const tries = s ? s.total : 0;
    triesEl.textContent = `挑戦${tries}回`;
    triesEl.style.display = 'inline-block';
    bBtn.textContent = bookmarks.has(currentQIndex) ? '★' : '☆';
    bBtn.classList.toggle('active', bookmarks.has(currentQIndex));
    bBtn.style.visibility = 'visible';
  } else {
    // 回答前：バッジ・栞を非表示
    accEl.style.display = 'none';
    triesEl.style.display = 'none';
    bBtn.textContent = '☆';
    bBtn.classList.remove('active');
    bBtn.style.visibility = 'hidden';
  }

  // ボタン群の表示切替
  document.getElementById('oxRow').style.display       = isSelect ? 'none' : 'grid';
  document.getElementById('choicesGrid').style.display = isSelect ? 'grid' : 'none';
  if (ans) {
    if (isSelect) renderChoices(q, ans.userChoice, true);
    else          renderOxButtons(q, ans.userChoice, true);
    showResultPanel(q, ans.correct);
    nextBtn.style.display = 'block';
  } else {
    if (isSelect) renderChoices(q, null, false);
    else          renderOxButtons(q, null, false);
    panel.style.display = 'none'; panel.className = 'result-panel';
    nextBtn.style.display = 'none';
  }
  document.getElementById('btnBack').disabled = (current === 0);
  document.getElementById('btnSkip').style.display = ans ? 'none' : 'block';
}

function renderOxButtons(q, userChoice, isAnswered) {
  const bm = document.getElementById('btnMaru');
  const bb = document.getElementById('btnBatsu');
  // ラベルをリセット
  bm.innerHTML = '<div>○</div><div class="btn-label">正しい</div>';
  bb.innerHTML = '<div>×</div><div class="btn-label">誤り</div>';
  bm.className = 'btn-answer btn-maru'; bb.className = 'btn-answer btn-batsu';
  bm.disabled = false; bb.disabled = false;
  if (isAnswered) {
    bm.disabled = true; bb.disabled = true;
    if (userChoice === true) {
      bm.className = q.a === true  ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== true)  bb.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bm.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      bb.className = q.a === false ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== false) bm.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bb.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    }
  }
}

// 選択式問題の描画（選択式を含む科目でオーバーライドして使用）
function renderChoices(q, userChoice, isAnswered) {
  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  // 選択肢を問題ごとに1回だけシャッフルしてキャッシュ（回答後の再描画でも順序を固定）
  if (!q._shuffledChoices) {
    const arr = [...q.choices];
    for (let i = arr.length - 1; i > 0; i--) {
      const jj = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[jj]] = [arr[jj], arr[i]];
    }
    q._shuffledChoices = arr;
  }
  q._shuffledChoices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice'; btn.textContent = c;
    if (isAnswered) {
      btn.disabled = true;
      if (c === q.answer)   btn.className = c === userChoice ? 'btn-choice correct-chosen' : 'btn-choice reveal-correct';
      if (c === userChoice && c !== q.answer) btn.className = 'btn-choice wrong-chosen';
      if (c === userChoice) btn.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      btn.onclick = () => answerSelect(c);
    }
    grid.appendChild(btn);
  });
}

function showResultPanel(q, isCorrect) {
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  panel.className     = isCorrect ? 'result-panel correct' : 'result-panel wrong';
  document.getElementById('resultHeader').textContent = isCorrect ? '✓ 正解！' : '✗ 不正解';
  document.getElementById('resultExp').innerHTML = (q.exp || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/「([^」]*)」/g, '「<b>$1</b>」');
  document.getElementById('resultSource').textContent = '根拠：' + q.src;
}

// ============================================================
//  ANSWER
// ============================================================
function answerOx(userAnswer) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userAnswer === q.a;
  answers[current] = { correct: isCorrect, userChoice: userAnswer };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}
function answerSelect(userChoice) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userChoice === q.answer;
  answers[current] = { correct: isCorrect, userChoice };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}

// ============================================================
//  NAVIGATION
// ============================================================
function nextQuestion() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function prevQuestion() {
  if (current > 0) { current--; updateQuestion(); }
  currentSession.current = current; localSave();
}
function skip() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function suspend() {
  // 中断時にセッションデータをpendingResumeに移す
  if (currentSession) {
    pendingResume = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
    currentSession = null;
    localSave(); scheduleAutoSave();
  }
  
  questions = []; answers = []; current = 0;
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  updateResumeBtn();
  showToast('セッションを中断しました', 'warn');
}

// ============================================================
//  FINISH & RESULTS
// ============================================================
function finishSession() {
  // ★ 完了時は現在のセッションのみクリア。中断中の pendingResume は消さない
  //    （中断→別モード実行→そのモードを完了、で中断点が消える不具合の修正）
  currentSession = null;
  localSave(); scheduleAutoSave();
  showResultScreen();
}
function renderResults() {
  const correct = answers.filter(a => a && a.correct).length;
  const wrong   = answers.filter(a => a && !a.correct).length;
  const skipped = answers.filter(a => !a).length;
  const total   = questions.length;
  const rate    = total > 0 ? Math.round((correct / total) * 100) : 0;

  document.getElementById('resultScoreText').textContent = `${correct} / ${total}`;
  document.getElementById('correctCount').textContent   = correct;
  document.getElementById('wrongCount').textContent     = wrong;
  document.getElementById('skippedCount').textContent   = skipped;
  
  let msg = `正解率: ${rate}%\n`;
  if (rate >= 80) msg += '素晴らしい結果です！';
  else if (rate >= 60) msg += '良い成績です！';
  else if (rate >= 40) msg += 'もう少し頑張りましょう。';
  else msg += '復習をお勧めします。';
  
  document.getElementById('resultMessage').textContent = msg;
  
  // 再挑戦ボタンの表示制御
  document.getElementById('btnRetryWrong').style.display = wrong > 0 ? 'inline-block' : 'none';
  document.getElementById('btnRetrySkipped').style.display = skipped > 0 ? 'inline-block' : 'none';
}

// ============================================================
//  RETRY
// ============================================================
function retryWrong() {
  const wrongIndices = [];
  answers.forEach((a, i) => { if (a && !a.correct) wrongIndices.push(i); });
  if (wrongIndices.length === 0) return;
  
  const pool = wrongIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function retrySkipped() {
  const skippedIndices = [];
  answers.forEach((a, i) => { if (!a) skippedIndices.push(i); });
  if (skippedIndices.length === 0) return;
  
  const pool = skippedIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function restart() {
  questions = []; answers = []; current = 0;
  currentSession = null;   // ★ pendingResume（中断セッション）は保持する
  localSave();
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  updateResumeBtn();   // ★ 中断セッションがあれば「続きから開始」を再表示
}

// ============================================================
//  BOOKMARKS
// ============================================================
function renderBookmarks() {
  const container = document.getElementById('bookmarkItems');
  const empty = document.getElementById('emptyBookmarks');
  
  if (bookmarks.size === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  container.innerHTML = '';
  
  [...bookmarks].sort((a, b) => a - b).forEach(idx => {
    const q = ALL_QUESTIONS[idx];
    if (!q) return;
    
    const item = document.createElement('div');
    item.className = 'bm-item';
    item.onclick = () => startFromBookmark(idx);
    
    const star = document.createElement('div');
    star.className = 'bm-star'; star.textContent = '★';
    
    const tag = document.createElement('div');
    tag.className = 'bm-tag'; tag.textContent = q.cat;
    
    const acc = document.createElement('div');
    const accInfo = getAccuracyInfo(idx);
    if (accInfo) {
      acc.className = `bm-acc ${accInfo.cls}`;
      acc.textContent = `${accInfo.pct}%`;
    }
    
    const text = document.createElement('div');
    text.className = 'bm-text';
    if (q.type === 'select') {
      text.textContent = `【${q.opt}】${q.context.slice(0, 80)}...`;
    } else {
      text.textContent = `${q.no}-${q.opt}: ${q.q.slice(0, 80)}...`;
    }
    
    item.appendChild(star);
    item.appendChild(tag);
    if (accInfo) item.appendChild(acc);
    item.appendChild(text);
    container.appendChild(item);
  });
}

function startFromBookmark(startIdx) {
  const pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i }))
    .filter(Boolean).sort((a, b) => a._origIdx - b._origIdx);
  const startPos = pool.findIndex(q => q._origIdx === startIdx);
  
  questions = pool; answers = Array(pool.length).fill(null); 
  current = Math.max(0, startPos);
  currentSession = { questionIndices: pool.map(q => q._origIdx), current, answers: [...answers] };
  showMain(); showQuestionScreen(); updateQuestion();
}

// ============================================================
//  TOAST
// ============================================================
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast${type ? ' ' + type : ''}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  localLoad();
  initFilters();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateRecentWrongBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
});

// アプリ情報の表示
document.getElementById('appTitle').textContent    = APP_CONFIG.title;
document.getElementById('appSubtitle').textContent = APP_CONFIG.subtitle;

// 栞ボタンの表示制御
function checkBookmarkButton() {
  const btn = document.getElementById('btnBookmarkStart');
  btn.style.display = bookmarks.size > 0 ? 'block' : 'none';
  // 栞ランダムモードの表示制御
  const bmRandom = document.getElementById('bookmarkRandomMode');
  if (bmRandom) {
    bmRandom.style.display = bookmarks.size > 0 ? 'block' : 'none';
    const input = document.getElementById('bookmarkRandomInput');
    if (input) {
      input.max = bookmarks.size;
      if (parseInt(input.value) > bookmarks.size) input.value = bookmarks.size;
      updateBookmarkRandomBtn();
    }
  }
}

// 初期化時に栞ボタンをチェック
document.addEventListener('DOMContentLoaded', () => {
  checkBookmarkButton();
});

// 栞の更新時に栞ボタンもチェック
function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if (bookmarks.size > 0) {
    badge.textContent = bookmarks.size;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
  checkBookmarkButton(); // 栞ボタンの表示も更新
}
