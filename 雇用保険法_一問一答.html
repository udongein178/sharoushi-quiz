<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雇用保険法 一問一答</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: #0f1923;
    color: #e8e0d0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 640px; }

  .header {
    text-align: center;
    padding: 24px 0 20px;
  }
  .header h1 {
    font-size: 13px;
    letter-spacing: 0.15em;
    color: #8a9bb0;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header .title {
    font-size: 22px;
    font-weight: 700;
    color: #e8e0d0;
    letter-spacing: 0.04em;
  }
  .header .subtitle {
    font-size: 12px;
    color: #556070;
    margin-top: 6px;
    letter-spacing: 0.05em;
  }

  .progress-wrap { margin-bottom: 20px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .progress-num { font-size: 12px; color: #8a9bb0; letter-spacing: 0.05em; }
  .progress-score { font-size: 12px; color: #8a9bb0; }
  .progress-bar-bg {
    width: 100%; height: 3px;
    background: #1e2d3d; border-radius: 2px;
  }
  .progress-bar-fill {
    height: 3px;
    background: linear-gradient(90deg, #4a9eca, #7ac8f0);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .card {
    background: #1a2634;
    border: 1px solid #2a3a4a;
    border-radius: 12px;
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .q-meta {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }
  .q-tag {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: #4a9eca;
    background: rgba(74,158,202,0.12);
    border: 1px solid rgba(74,158,202,0.25);
    border-radius: 4px;
    padding: 2px 8px;
    font-weight: 600;
  }
  .q-num { font-size: 11px; color: #556070; letter-spacing: 0.05em; }
  .q-text {
    font-size: 15px;
    line-height: 1.75;
    color: #d8d0c0;
    word-break: break-all;
    padding-right: 36px;
  }

  /* Bookmark button */
  .btn-bookmark {
    position: absolute;
    top: 20px;
    right: 16px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
    padding: 4px;
    color: #556070;
    transition: color 0.15s, transform 0.1s;
  }
  .btn-bookmark:hover { color: #e8c97a; transform: scale(1.1); }
  .btn-bookmark.active { color: #e8c97a; }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .btn-answer {
    border: none;
    border-radius: 10px;
    padding: 18px 12px;
    font-size: 28px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s, background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .btn-answer:active { transform: scale(0.96); }
  .btn-maru {
    background: #1c3040;
    border: 1.5px solid #2a4a60;
    color: #5bb8e0;
  }
  .btn-maru:hover { background: #1e3a50; border-color: #5bb8e0; }
  .btn-batsu {
    background: #301c1c;
    border: 1.5px solid #50282a;
    color: #e07060;
  }
  .btn-batsu:hover { background: #3a2020; border-color: #e07060; }
  .btn-label { font-size: 10px; letter-spacing: 0.1em; opacity: 0.7; }
  .btn-answer.correct-chosen { background: #163328; border-color: #3dbe82; color: #3dbe82; }
  .btn-answer.wrong-chosen { background: #331616; border-color: #e05050; color: #e05050; }
  .btn-answer.reveal-correct { background: #163328; border-color: #3dbe82; color: #3dbe82; }
  .btn-answer:disabled { cursor: default; }

  .result-panel {
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: none;
    animation: fadeUp 0.2s ease;
  }
  .result-panel.correct { background: #0d2a1e; border: 1px solid #2a6044; }
  .result-panel.wrong { background: #2a0d0d; border: 1px solid #6a2020; }
  .result-header { font-size: 14px; font-weight: 700; margin-bottom: 8px; letter-spacing: 0.05em; }
  .result-panel.correct .result-header { color: #3dbe82; }
  .result-panel.wrong .result-header { color: #e05050; }
  .result-exp { font-size: 13px; line-height: 1.7; color: #a0b0c0; }
  .result-source { font-size: 11px; color: #556070; margin-top: 8px; letter-spacing: 0.05em; }

  .btn-next {
    width: 100%;
    background: #4a9eca;
    color: #071520;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: background 0.15s, transform 0.1s;
    display: none;
  }
  .btn-next:hover { background: #7ac8f0; }
  .btn-next:active { transform: scale(0.98); }

  /* Result screen */
  .result-screen { display: none; text-align: center; padding: 32px 16px; }
  .result-screen.show { display: block; }
  .score-circle {
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 3px solid #4a9eca;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 24px;
  }
  .score-big { font-size: 48px; font-weight: 700; color: #7ac8f0; line-height: 1; }
  .score-denom { font-size: 14px; color: #8a9bb0; margin-top: 4px; }
  .score-pct { font-size: 18px; font-weight: 600; color: #4a9eca; margin-bottom: 8px; }
  .score-msg { font-size: 14px; color: #8a9bb0; margin-bottom: 28px; line-height: 1.6; white-space: pre-line; }
  .breakdown {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 24px;
  }
  .breakdown-item {
    background: #1a2634; border: 1px solid #2a3a4a;
    border-radius: 10px; padding: 14px; text-align: center;
  }
  .breakdown-num { font-size: 28px; font-weight: 700; }
  .breakdown-num.ok { color: #3dbe82; }
  .breakdown-num.ng { color: #e05050; }
  .breakdown-num.bm { color: #e8c97a; }
  .breakdown-label { font-size: 12px; color: #8a9bb0; margin-top: 4px; }
  .btn-retry {
    background: transparent;
    border: 1.5px solid #4a9eca;
    color: #4a9eca;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px;
    transition: background 0.15s;
    letter-spacing: 0.05em;
  }
  .btn-retry:hover { background: rgba(74,158,202,0.12); }
  .btn-retry.gold {
    border-color: #e8c97a;
    color: #e8c97a;
  }
  .btn-retry.gold:hover { background: rgba(232,201,122,0.1); }
  .btns-wrap { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .btn-ctrl {
    font-size: 12px; padding: 5px 14px;
    border-radius: 6px; border: 1px solid #2a3a4a;
    background: transparent; color: #8a9bb0;
    cursor: pointer; letter-spacing: 0.05em;
    transition: all 0.15s;
  }
  .btn-ctrl.active { border-color: #4a9eca; color: #4a9eca; background: rgba(74,158,202,0.1); }
  .btn-ctrl.gold-active { border-color: #e8c97a; color: #e8c97a; background: rgba(232,201,122,0.1); }
  .btn-ctrl:hover { border-color: #8a9bb0; }

  .start-screen { text-align: center; padding: 32px 16px; }
  .start-count { font-size: 48px; font-weight: 700; color: #4a9eca; display: block; margin-bottom: 6px; }
  .start-unit { font-size: 14px; color: #8a9bb0; margin-bottom: 28px; display: block; }
  .start-desc { font-size: 14px; color: #8a9bb0; line-height: 1.7; margin-bottom: 28px; }
  .btn-start {
    background: #4a9eca; color: #071520;
    border: none; border-radius: 10px;
    padding: 14px 40px;
    font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.1em;
    transition: background 0.15s;
    display: block; width: 100%; max-width: 280px;
    margin: 0 auto 12px;
  }
  .btn-start:hover { background: #7ac8f0; }
  .btn-start.secondary {
    background: transparent;
    border: 1.5px solid #e8c97a;
    color: #e8c97a;
    font-size: 14px;
  }
  .btn-start.secondary:hover { background: rgba(232,201,122,0.1); }
  .btn-start:disabled { opacity: 0.35; cursor: not-allowed; }

  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .filter-btn {
    font-size: 12px; padding: 5px 12px;
    border-radius: 6px; border: 1px solid #2a3a4a;
    background: transparent; color: #8a9bb0;
    cursor: pointer; transition: all 0.15s;
  }
  .filter-btn.active { border-color: #4a9eca; color: #4a9eca; background: rgba(74,158,202,0.1); }

  /* Bookmark list view */
  .bookmark-list { display: none; }
  .bookmark-list.show { display: block; }
  .bm-item {
    background: #1a2634;
    border: 1px solid #2a3a4a;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .bm-item:hover { border-color: #4a9eca; }
  .bm-tag {
    font-size: 10px; letter-spacing: 0.08em;
    color: #4a9eca;
    background: rgba(74,158,202,0.12);
    border: 1px solid rgba(74,158,202,0.25);
    border-radius: 4px;
    padding: 2px 6px;
    white-space: nowrap;
    flex-shrink: 0;
    font-weight: 600;
  }
  .bm-text { font-size: 13px; line-height: 1.6; color: #a0b0c0; }
  .bm-star { font-size: 16px; color: #e8c97a; flex-shrink: 0; }
  .empty-bm { text-align: center; padding: 40px 20px; color: #556070; font-size: 14px; line-height: 1.7; }

  .nav-tabs {
    display: flex;
    gap: 4px;
    background: #131e28;
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
  }
  .nav-tab {
    flex: 1; padding: 8px; border: none;
    border-radius: 8px; background: transparent;
    color: #556070; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
    letter-spacing: 0.03em;
  }
  .nav-tab.active { background: #1a2634; color: #e8e0d0; }
  .bm-badge {
    display: inline-block;
    background: rgba(232,201,122,0.2);
    color: #e8c97a;
    border-radius: 4px;
    font-size: 10px;
    padding: 1px 5px;
    margin-left: 4px;
    font-weight: 700;
  }

  .section-title {
    font-size: 12px;
    color: #556070;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    text-align: center;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>社会保険労務士 試験対策</h1>
    <div class="title">雇用保険法 一問一答</div>
    <div class="subtitle">TAC 択一式問題 全60問</div>
  </div>

  <!-- Nav tabs (start / bookmark) -->
  <div class="nav-tabs" id="navTabs">
    <button class="nav-tab active" onclick="switchTab('start')">問題</button>
    <button class="nav-tab" onclick="switchTab('bookmark')" id="tabBm">★ 栞 <span class="bm-badge" id="bmBadge" style="display:none"></span></button>
  </div>

  <!-- Start Screen -->
  <div id="startScreen">
    <span class="start-count" id="startCount">60</span>
    <span class="start-unit">問（問1〜問12 各5肢）</span>
    <div class="start-desc">各肢について○か×かを判断してください。<br>出題範囲を絞ることも可能です。</div>
    <div style="margin-bottom:16px;">
      <div style="font-size:12px;color:#8a9bb0;margin-bottom:8px;letter-spacing:0.05em;">出題範囲</div>
      <div class="filter-row" id="filterRow"></div>
    </div>
    <div class="controls">
      <button class="btn-ctrl" id="btnShuffle" onclick="toggleShuffle()">シャッフル</button>
    </div>
    <button class="btn-start" onclick="startQuiz()">スタート →</button>
    <button class="btn-start secondary" onclick="startBookmarked()" id="btnStartBm" style="display:none">★ 栞の問題のみ</button>
  </div>

  <!-- Bookmark list -->
  <div class="bookmark-list" id="bookmarkList">
    <div class="section-title">栞をつけた問題</div>
    <div id="bmItems"></div>
    <div style="margin-top:16px;text-align:center;" id="bmActions"></div>
  </div>

  <!-- Quiz Screen -->
  <div id="quizScreen" style="display:none;">
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-num" id="progressNum">1 / 60</span>
        <span class="progress-score" id="progressScore">正解 0 問</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <div class="card">
      <div class="q-meta">
        <span class="q-tag" id="qTag">問1</span>
        <span class="q-num" id="qNum">A</span>
      </div>
      <p class="q-text" id="qText"></p>
      <button class="btn-bookmark" id="btnBookmark" onclick="toggleBookmark()" title="栞をつける">☆</button>
    </div>

    <div class="btn-row">
      <button class="btn-answer btn-maru" id="btnMaru" onclick="answer(true)">
        ○<span class="btn-label">CORRECT</span>
      </button>
      <button class="btn-answer btn-batsu" id="btnBatsu" onclick="answer(false)">
        ×<span class="btn-label">WRONG</span>
      </button>
    </div>

    <div class="result-panel" id="resultPanel">
      <div class="result-header" id="resultHeader"></div>
      <div class="result-exp" id="resultExp"></div>
      <div class="result-source" id="resultSource"></div>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">次の問題 →</button>
  </div>

  <!-- Result Screen -->
  <div class="result-screen" id="resultScreen">
    <div class="score-circle">
      <span class="score-big" id="finalScore">0</span>
      <span class="score-denom" id="finalDenom">/ 60</span>
    </div>
    <div class="score-pct" id="finalPct"></div>
    <div class="breakdown">
      <div class="breakdown-item">
        <div class="breakdown-num ok" id="okCount">0</div>
        <div class="breakdown-label">正解</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-num ng" id="ngCount">0</div>
        <div class="breakdown-label">不正解</div>
      </div>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="btns-wrap">
      <button class="btn-retry" onclick="resetToStart()">最初から</button>
      <button class="btn-retry" onclick="retryWrong()" id="btnRetryWrong">間違えた問題のみ</button>
    </div>
  </div>
</div>

<script>
const ALL_QUESTIONS = [
  // 問1
  {no:"問1",opt:"A",q:"常時５人未満の労働者を雇用する個人経営の水産の事業は、すべて雇用保険暫定任意適用事業である。",a:false,exp:"設問の事業であっても、船員が雇用される事業は雇用保険の強制適用事業となる。すべてが暫定任意適用事業となるわけではない。",src:"法附則2条1項2号、令附則2条"},
  {no:"問1",opt:"B",q:"国又は行政執行法人の事業に雇用される者のうち、離職した場合に国家公務員退職手当法に基づく諸給与の内容が求職者給付等の内容を超えると認められる者は、被保険者とならない。",a:true,exp:"国家公務員退職手当法による給付が求職者給付・就職促進給付を超える場合、当該者は雇用保険の被保険者とならない。",src:"法6条6号、則4条1項1号"},
  {no:"問1",opt:"C",q:"日雇労働者であって適用区域内にある適用事業に雇用されるものであっても、適用区域外の地域に居住している場合には、公共職業安定所長の認可を受けたときに限り日雇労働被保険者となることができる。",a:false,exp:"適用区域内の適用事業に雇用される日雇労働者については、居住地が区域外であっても法律上当然に日雇労働被保険者とされる。公共職業安定所長の認可は不要。",src:"法43条1項"},
  {no:"問1",opt:"D",q:"同時に２以上の雇用関係にある労働者については、原則として、当該２以上の雇用関係のうちその者の選択する一の雇用関係についてのみ被保険者となる。",a:false,exp:"「選択する」ではなく「生計を維持するに必要な主たる賃金を受ける」一の雇用関係についてのみ被保険者となる。",src:"法4条1項、行政手引20352"},
  {no:"問1",opt:"E",q:"適用事業に雇用される労働者が、日本国外にある当該事業主の支店に転勤した場合には、被保険者の資格を喪失する。",a:false,exp:"日本国外の支店に転勤した場合でも、被保険者の資格は喪失しない。日本国外への出張も同様に被保険者のまま。",src:"法4条1項、行政手引20352"},

  // 問2
  {no:"問2",opt:"ア",q:"事業主は、代理人を選任したときは、代理人の職名・氏名・生年月日・代理事項等を記載した届書を、当該代理人の選任に係る事業所の所在地を管轄する公共職業安定所の長に提出しなければならない。",a:true,exp:"事業主が代理人を選任したときは、所定事項を記載した届書を管轄公共職業安定所長に提出する義務がある。",src:"則145条2項"},
  {no:"問2",opt:"イ",q:"事業主が提出しなければならない雇用保険被保険者資格喪失届は、年金事務所又は所轄労働基準監督署長を経由して提出することができる。",a:false,exp:"雇用保険被保険者資格喪失届の経由先は年金事務所のみである。所轄労働基準監督署長を経由して提出することはできない。",src:"則7条2項"},
  {no:"問2",opt:"ウ",q:"転勤前の事業所と転勤後の事業所とが同一の公共職業安定所の管轄内にあるときは、雇用保険被保険者転勤届の提出は要しない。",a:false,exp:"転勤前後の事業所が同一の公共職業安定所の管轄内にあるときであっても、雇用保険被保険者転勤届の提出は必要である。",src:"則13条1項、行政手引21752"},
  {no:"問2",opt:"エ",q:"対象家族を介護するため所定労働時間の短縮を行っていた被保険者が離職し、特定理由離職者として受給資格の決定を受けるとき、事業主は雇用保険被保険者休業開始時賃金月額証明書・所定労働時間短縮開始時賃金証明書を提出しなければならない。",a:true,exp:"所定の場合に事業主は雇用保険被保険者休業開始時賃金月額証明書・所定労働時間短縮開始時賃金証明書を管轄公共職業安定所の長に提出しなければならない。",src:"則14条の4、1項"},
  {no:"問2",opt:"オ",q:"被保険者又は被保険者であった者からの被保険者資格の確認の請求は文書で行わなければならない。",a:false,exp:"被保険者資格の確認の請求は、口頭でも行うことができる。文書に限定されていない。",src:"法8条、則8条1項"},

  // 問3
  {no:"問3",opt:"A",q:"就職困難者に該当する者が離職し失業している場合は、原則として離職の日以前１年間に被保険者期間が通算して６箇月以上あれば基本手当の受給資格を満たす。",a:false,exp:"受給要件の特例（1年間6箇月以上）は特定理由離職者または倒産・解雇等離職者に適用される。就職困難者はこの特例の対象外であり、原則として離職の日以前2年間に12箇月以上必要。",src:"法13条、則19条の2"},
  {no:"問3",opt:"B",q:"私傷病による休業のため引き続き30日以上賃金の支払を受けることができなかった期間がある場合であっても、算定対象期間の延長は認められない。",a:false,exp:"疾病または負傷（業務上・業務外を問わない）による休業のため引き続き30日以上賃金の支払を受けられなかった期間がある場合、算定対象期間の延長（最大4年間）が認められる。",src:"法13条1項カッコ書、行政手引50152"},
  {no:"問3",opt:"C",q:"離職の日の属する月の前６月のいずれかの月において１月当たり100時間以上、時間外労働及び休日労働が行われたことにより離職した者は、就職困難者に該当する場合を除き、特定受給資格者となり得る。",a:true,exp:"月100時間以上の時間外・休日労働が行われたことによる離職は、特定受給資格者に該当する理由の一つ（就職困難者に該当する場合を除く）。",src:"法23条2項2号、則36条5号ロ"},
  {no:"問3",opt:"D",q:"基本手当は、失業している日が通算して７日に満たない間は支給されないが、その間に疾病または負傷のため職業に就くことができない日がある場合には、その期間が最長21日まで延長される。",a:false,exp:"待期期間を延長する規定はない。待期の７日には「疾病または負傷のため職業に就くことができない日」も含まれる。",src:"法21条"},
  {no:"問3",opt:"E",q:"離職の日において60歳の受給資格者について最高限度額の規定が適用される場合、基本手当の日額は最高限度額に100分の50を乗じて得た額である。",a:false,exp:"60歳以上65歳未満の受給資格者の基本手当の日額は賃金日額に100分の80から100分の45の範囲の率を乗じた額。最高限度額適用の場合の率は「100分の45」。100分の50ではない。",src:"法16条2項、法17条4項2号イ"},

  // 問4
  {no:"問4",opt:"A",q:"基準日において45歳以上65歳未満であって算定基礎期間が１年以上の就職困難者である受給資格者の受給期間は、原則として基準日の翌日から起算して１年に60日を加えた期間である。",a:true,exp:"就職困難者の受給期間は原則1年だが、45歳以上65歳未満かつ算定基礎期間1年以上の者については「1年に60日を加えた期間」とされる。",src:"法20条1項2号"},
  {no:"問4",opt:"B",q:"妊娠・出産等により引き続き30日以上就業不能となった受給期間延長措置を受けようとする者は、原則として、当該理由により30日以上就業不能となった日の翌日から起算して１か月以内に申請書を提出しなければならない。",a:false,exp:"申請書の提出は「30日以上就業不能となった日の翌日から、基準日の翌日から4年を経過する日まで」の間に行えばよい。「1か月以内」という制限はない。",src:"法20条1項カッコ書、則31条1項・3項、行政手引50273"},
  {no:"問4",opt:"C",q:"60歳以上の定年退職により離職した受給資格者は、求職の申込みをしないことを希望する旨を申し出ることで受給期間を延長できるが、申込みをしない期間は１年が限度とされている。",a:true,exp:"定年退職者の受給期間延長は、求職申込みをしない期間として最長１年まで認められる。",src:"法20条2項、則31条の2、1項"},
  {no:"問4",opt:"D",q:"算定基礎期間が20年である特定受給資格者の場合、基準日において50歳である者の所定給付日数は、60歳である者の所定給付日数より多い。",a:true,exp:"算定基礎期間20年の特定受給資格者：50歳（45歳以上60歳未満）は330日、60歳（60歳以上65歳未満）は240日。50歳の方が多い。",src:"法23条1項1号イ・2号イ"},
  {no:"問4",opt:"E",q:"算定基礎期間は、被保険者となった日が確認のあった日の２年前の日より前であるときは、原則として当該確認のあった日の２年前の日に被保険者となったものとみなして算定される。",a:true,exp:"不正防止のため、確認のあった日の2年前より前に遡って算定基礎期間を算定することはできない（2年前の日を起算点とするみなし規定）。",src:"法22条4項"},

  // 問5
  {no:"問5",opt:"A",q:"正当な理由のある自己都合により離職した特定理由離職者である受給資格者（就職困難者に非該当）は、地域延長給付の対象となる。",a:false,exp:"地域延長給付の対象となる特定理由離職者は「希望に反して契約更新がなかったことにより離職した者」に限られる。正当な理由のある自己都合離職者は地域延長給付の対象外。",src:"法附則5条1項、則附則19条"},
  {no:"問5",opt:"B",q:"個別延長給付を受けている受給資格者が、正当な理由なく公共職業安定所長の指示した訓練等を拒んだときは、その拒んだ日から起算して１か月間に限り基本手当は支給されない。",a:false,exp:"「その拒んだ日から１か月間に限り」ではなく、「その拒んだ日以後」原則として基本手当は支給されない（より厳しい制限）。",src:"法29条1項"},
  {no:"問5",opt:"C",q:"傷病手当は、疾病または負傷のため職業に就くことができない状態が離職後公共職業安定所に出頭して求職の申込みを行う前に生じたものであっても、支給される場合がある。",a:false,exp:"傷病手当は、①求職申込みをしていること、②継続15日以上就業不能であること、③②の状態が①の後に生じたものであることの要件をすべて満たす場合に支給される。求職申込み前に状態が生じた場合は不支給。",src:"法37条1項、行政手引53002"},
  {no:"問5",opt:"D",q:"全国延長給付に係る基本手当を受けている受給資格者は、疾病または負傷のため継続して15日以上就業不能となった場合でも、傷病手当は支給されない。",a:true,exp:"傷病手当の支給日数は所定給付日数（延長給付による日数を含まない）から既支給日数を差し引いた日数。延長給付の基本手当を受けている者には傷病手当は支給されない。",src:"法37条4項、行政手引53004"},
  {no:"問5",opt:"E",q:"寄宿手当は、公共職業安定所長の指示した訓練等を受けるため同居親族と別居して寄宿する日について、40日分を限度として日額500円が支給される。",a:false,exp:"寄宿手当は「寄宿する期間」に月額10,700円（一定の場合は日割減額）が支給される。日額500円や40日分という規定ではない。",src:"法24条1項カッコ書、法36条2項、令4条1項、則60条"},

  // 問6（全て誤り）
  {no:"問6",opt:"ア",q:"高年齢求職者給付金の額は、基本手当の日額に相当する額の30日分（当分の間は50日分）を原則とする。",a:false,exp:"高年齢求職者給付金は算定基礎期間1年未満は30日分、1年以上は50日分（固定）。「当分の間50日分」という措置は設けられていない。",src:"法37条の4、1項"},
  {no:"問6",opt:"イ",q:"高年齢求職者給付金及び特例一時金は、失業の認定日において失業の状態にあれば、待期の通算が7日に満たない場合でも支給される。",a:false,exp:"高年齢求職者給付金も特例一時金も、７日間の待期期間が満了しなければ支給されない。",src:"法37条の4、6項、法40条4項"},
  {no:"問6",opt:"ウ",q:"特例一時金の支給を受けようとする特例受給資格者は、離職の日の翌日から起算して１年を経過する日までに管轄公共職業安定所に出頭し認定を受けなければならない。",a:false,exp:"特例一時金の申請期限は「離職の日の翌日から起算して６箇月」を経過する日まで。1年ではない。",src:"法40条3項、則1条5項1号"},
  {no:"問6",opt:"エ",q:"日雇労働求職者給付金の特例給付の支給に係る失業の認定を受けようとする者は、管轄公共職業安定所に出頭し、雇用保険被保険者証を提出しなければならない。",a:false,exp:"特例給付の失業認定の際に提出するのは「日雇労働被保険者手帳」であり、雇用保険被保険者証ではない。",src:"則79条3項"},
  {no:"問6",opt:"オ",q:"日雇労働求職者給付金の普通給付が13日分を限度として支給される月において、当該被保険者が継続して13日間失業しているときは、その失業日すべてについて支給を受けることができる。",a:false,exp:"日雇労働求職者給付金は各週において職業に就かなかった最初の日は支給されない。継続13日間失業しても「すべての日」について支給されるわけではない。",src:"法50条2項"},

  // 問7
  {no:"問7",opt:"A",q:"再就職手当は、受給資格者が安定した職業に就いた日の前日における基本手当の支給残日数が所定給付日数の３分の１以上かつ45日以上でなければ支給されない。",a:false,exp:"再就職手当の要件は「所定給付日数の3分の1以上」のみ。「かつ45日以上」という要件は設けられていない。",src:"法56条の3、1項1号"},
  {no:"問7",opt:"B",q:"常用就職支度手当は、受給資格者等が公共職業安定所または職業紹介事業者等の紹介により１年以上引き続き雇用されることが確実と認められる職業に就いた場合でなければ支給されない。",a:true,exp:"常用就職支度手当は、1年以上引き続き雇用されることが確実と認められる職業に就いた場合（就職困難者等が対象）に支給される。",src:"法56条の3、1項2号、則82条2項1号、則82条の3、1項"},
  {no:"問7",opt:"C",q:"移転費は、受給資格者等が特定地方公共団体の指示した公共職業訓練等を受けるため、その住所又は居所を変更する場合においても支給されることがある。",a:false,exp:"訓練受講のための移転費が支給されるのは「公共職業安定所長の指示した」公共職業訓練等の場合。特定地方公共団体の指示した訓練は該当しない。",src:"法58条1項、則86条"},
  {no:"問7",opt:"D",q:"広域求職活動費は、受給資格者等が離職理由による給付制限の期間中に広域求職活動を開始した場合には支給されない。",a:false,exp:"広域求職活動費は、給付制限期間中に広域求職活動を開始した場合であっても支給され得る。給付制限期間は支給の妨げとならない。",src:"則96条1号"},
  {no:"問7",opt:"E",q:"求職活動関係役務利用費は、待期期間及び給付制限期間が経過した後に保育等サービスを利用する場合に限り支給される。",a:false,exp:"支給対象は「待期期間が経過した後」に利用するものに限られる。給付制限期間は経過していなくてもよい（待期期間さえ経過すれば足りる）。",src:"則100条の6"},

  // 問8
  {no:"問8",opt:"ア",q:"所定給付日数が270日以上である受給資格者に係る常用就職支度手当の額は、基本手当日額の36日分に相当する額である。",a:true,exp:"所定給付日数270日以上の受給資格者の常用就職支度手当は基本手当日額×（90×10分の4）＝36日分。",src:"法56条の3、3項2号、則83条の6"},
  {no:"問8",opt:"イ",q:"移転費は、鉄道賃、船賃、航空賃、車賃、移転料及び着後手当とする。",a:true,exp:"移転費の内訳は鉄道賃・船賃・航空賃・車賃・移転料・着後手当の6種類とされている。",src:"則87条1項"},
  {no:"問8",opt:"ウ",q:"短期訓練受講費の額として算定された額が4,000円を超えないときは、短期訓練受講費は支給されない。",a:false,exp:"短期訓練受講費に下限額の規定はない。支払費用（入学料・受講料）×20%（上限10万円）が支給される。4,000円以下でも支給される。",src:"則100条の3"},
  {no:"問8",opt:"エ",q:"基準日において一般被保険者でない者についても、教育訓練給付金支給対象者となり得る。",a:true,exp:"基準日が「直前の一般被保険者等でなくなった日から1年以内」にある者も支給対象者となり得る（離職後1年以内であれば非被保険者でも対象）。",src:"法60条の2、1項"},
  {no:"問8",opt:"オ",q:"基準日前に教育訓練給付金の支給を受けたことがない者については、当分の間、一般教育訓練の支給要件期間が１年以上、特定一般教育訓練は２年以上あればよい。",a:false,exp:"初めて教育訓練給付金を受ける者については、一般教育訓練も特定一般教育訓練もともに「1年以上」あればよい。特定一般教育訓練を2年以上とするのは誤り。",src:"法60条の2、1項、法附則11条、則附則24条"},

  // 問9
  {no:"問9",opt:"A",q:"一般教育訓練の受講のために支払った費用が２万円の場合、教育訓練給付金は支給されない。",a:true,exp:"一般教育訓練の給付金は支払費用×20%が4,000円を超えないと支給されない。2万円×20%＝4,000円は「超えない」ため不支給。",src:"法60条の2、4項・5項、則101条の2の7、1号、則101条の2の9"},
  {no:"問9",opt:"B",q:"支給要件期間３年以上の者が専門実践教育訓練を受講・修了し、資格取得等をし、修了日翌日から１年以内に一般被保険者として雇用された場合の支給率は100分の60とされている。",a:false,exp:"当該要件を満たす場合の支給率は「100分の70」。100分の60ではない。",src:"法60条の2、4項、則101条の2の7、5号"},
  {no:"問9",opt:"C",q:"教育訓練支援給付金は、訓練が修了してもなお失業している場合は、その失業している日について支給される。",a:false,exp:"教育訓練支援給付金は訓練を受けている日のうち失業している日に支給されるもの。訓練修了後には支給されない。",src:"法附則11条の2、1項、則附則25条"},
  {no:"問9",opt:"D",q:"教育訓練休暇給付金の支給を受けるためには、算定基礎期間に相当する期間が3年以上であることが必要とされている。",a:false,exp:"教育訓練休暇給付金の支給要件となる算定基礎期間相当期間は「5年以上」。3年以上では不足。",src:"法60条の3、1項"},
  {no:"問9",opt:"E",q:"教育訓練休暇給付金の日額は、基本手当の日額に100分の80を乗じて得た額とされている。",a:false,exp:"教育訓練休暇給付金の日額は「基本手当の日額に相当する額」そのもの。100分の80を乗じるのは誤り。",src:"法60条の3、5項"},

  // 問10
  {no:"問10",opt:"A",q:"高年齢雇用継続基本給付金の支給要件判定において、非行により支払を受けることができなかった賃金がある場合には、その支払を受けたものとみなして賃金額を算定する。",a:true,exp:"非行・疾病・負傷・事業所休業等により支払を受けられなかった賃金は、支払を受けたものとみなして賃金額を算定する。",src:"法61条1項、則101条の3、1号"},
  {no:"問10",opt:"B",q:"被保険者が月初から月末まで引き続いて教育訓練休暇給付金の支給を受けることができる休暇を取得した月は支給対象月とされず、高年齢雇用継続基本給付金は支給されない。",a:true,exp:"月初から末日まで引き続いて育児・介護休業給付・教育訓練休暇給付等の支給を受けられる休業等を取得した月は支給対象月とならない。",src:"法61条2項"},
  {no:"問10",opt:"C",q:"高年齢再就職給付金の支給期間は、再就職前日における支給残日数が150日である場合、就職日の属する月から就職日翌日から1年経過日の属する月まで（65歳に達する場合を除く）である。",a:true,exp:"支給残日数100日以上200日未満（150日はこの範囲）の場合、支給期間は就職翌日から1年経過日の属する月まで。",src:"法61条の2、2項"},
  {no:"問10",opt:"D",q:"事業主は、被保険者が60歳に達したときは、原則として、当該事実のあった日の翌日から起算して10日以内に、雇用保険被保険者六十歳到達時等賃金証明書を管轄公共職業安定所の長に提出しなければならない。",a:false,exp:"60歳到達時に事業主が自動的に賃金証明書を10日以内に提出する義務は規定されていない。初めて高年齢雇用継続給付の支給申請をする際に提出するもの。",src:"則101条の5"},
  {no:"問10",opt:"E",q:"一支給単位期間について事業主から支払われた賃金の額が、休業開始時賃金日額×支給日数×100分の80以上である場合、当該期間については介護休業給付金は支給されない。",a:true,exp:"賃金の額が休業開始時賃金日額×支給日数×80%以上の場合、介護休業給付金は支給されない。",src:"法61条の4、5項"},

  // 問11
  {no:"問11",opt:"A",q:"支給単位期間において公共職業安定所長が就業をしていると認める日数が10日以下でなければ、当該期間について育児休業給付金は支給されない。",a:false,exp:"就業日数が10日を超える場合でも、就業時間が80時間以下であれば育児休業給付金が支給され得る。日数10日超でも時間で救済される。",src:"法61条の7、1項、則101条の22"},
  {no:"問11",opt:"B",q:"配偶者が子の１歳に達する日以前のいずれかの日において養育休業をしている場合、被保険者は１年２か月分を限度として育児休業給付金の支給を受けることができる。",a:false,exp:"「1年2か月分を限度」ではなく「子が1歳2か月に達する日の前日までの期間のうち最大1年間」の育児休業給付金が支給される。",src:"法61条の7、1項・8項、則101条の27"},
  {no:"問11",opt:"C",q:"被保険者が出生時育児休業給付金の支給を受けたことがある場合、同一の子について出生時育児休業の通算日数が28日に達した日後の出生時育児休業をしたときは、出生時育児休業給付金は支給されない。",a:true,exp:"出生時育児休業給付金は同一の子について通算28日を限度。28日に達した日後の出生時育児休業には支給されない。",src:"法61条の8、2項2号"},
  {no:"問11",opt:"D",q:"出生後休業支援給付金の支給を受けるためには、対象期間内にした出生後休業の日数が通算して14日未満でなければならない。",a:false,exp:"出生後休業支援給付金の要件は出生後休業の日数が「通算して14日以上」であること。14日未満ではなく、14日以上が要件。",src:"法61条の10、1項2号"},
  {no:"問11",opt:"E",q:"出生後休業支援給付金の額は、賃金日額×対象期間内の出生後休業日数（最大28日）×100分の10の額とされている。",a:false,exp:"出生後休業支援給付金の額は「100分の13」。100分の10ではない。",src:"法61条の10、6項"},

  // 問12
  {no:"問12",opt:"A",q:"失業等給付を受ける権利は譲渡・担保・差押えができないが、独立行政法人高齢・障害・求職者雇用支援機構に担保に供する場合は例外として認められている。",a:false,exp:"失業等給付を受ける権利は、いかなる場合も譲渡・担保・差押えができない。独立行政法人高齢・障害・求職者雇用支援機構への担保提供という例外規定は存在しない。",src:"法11条"},
  {no:"問12",opt:"B",q:"不正受給者に対し、政府は支給した失業等給付の全部または一部の返還を命じることができ、また不正受給額の２倍以下の金額を納付することを命ずることができる。",a:true,exp:"不正受給の場合、①支給額の返還命令、②不正受給額の2倍以下の金額の納付命令、の双方が可能。",src:"法10条の4、1項"},
  {no:"問12",opt:"C",q:"雇用調整助成金の支給は、国・地方公共団体・行政執行法人・特定地方独立行政法人に対しては行われない。",a:true,exp:"雇用安定事業として支給される助成金・給付金等は、国・地方公共団体・行政執行法人・特定地方独立行政法人には支給されない。",src:"法62条1項1号、則102条の2、則120条"},
  {no:"問12",opt:"D",q:"事業主が被保険者資格の届出をしない場合、労働者は自ら公共職業安定所長に確認の請求ができ、その処分に不服があれば雇用保険審査官に審査請求ができる。",a:true,exp:"被保険者資格の確認請求→安定所長の処分→不服の場合は雇用保険審査官への審査請求、という手続きが規定されている。",src:"法8条、法9条1項、法69条1項、法81条、則1条1項・2項"},
  {no:"問12",opt:"E",q:"事業主または労働保険事務組合が被保険者に関する届出規定に違反して届出をせず、または偽りの届出をした場合には、６月以下の拘禁刑または30万円以下の罰金に処せられる。",a:true,exp:"届出違反（未届け・虚偽届出）に対する罰則は「6月以下の拘禁刑または30万円以下の罰金」とされている。",src:"法83条1号、法84条1号"},
];

let questions = [];
let current = 0;
let correct = 0;
let answered = false;
let wrongIndices = [];
let shuffle = false;
let selectedGroups = new Set();
let bookmarks = new Set();
let currentTab = 'start';
let currentQIndex = -1; // index in ALL_QUESTIONS for current question

const groups = [...new Set(ALL_QUESTIONS.map(q=>q.no))];

// LocalStorage
function loadBookmarks() {
  try {
    const saved = localStorage.getItem('koyo_bookmarks');
    if (saved) bookmarks = new Set(JSON.parse(saved));
  } catch(e) {}
}
function saveBookmarks() {
  try {
    localStorage.setItem('koyo_bookmarks', JSON.stringify([...bookmarks]));
  } catch(e) {}
}

function initFilters() {
  const row = document.getElementById('filterRow');
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn active';
  allBtn.textContent = 'すべて';
  allBtn.dataset.val = 'all';
  allBtn.onclick = () => {
    selectedGroups.clear();
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.val === 'all');
    });
    updateStartCount();
  };
  row.appendChild(allBtn);
  groups.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.textContent = g;
    btn.dataset.val = g;
    btn.onclick = () => {
      document.querySelector('.filter-btn[data-val="all"]').classList.remove('active');
      btn.classList.toggle('active');
      if (selectedGroups.has(g)) selectedGroups.delete(g);
      else selectedGroups.add(g);
      if (selectedGroups.size === 0) {
        document.querySelector('.filter-btn[data-val="all"]').classList.add('active');
      }
      updateStartCount();
    };
    row.appendChild(btn);
  });
}

function updateStartCount() {
  let pool = ALL_QUESTIONS;
  if (selectedGroups.size > 0) pool = ALL_QUESTIONS.filter(q => selectedGroups.has(q.no));
  document.getElementById('startCount').textContent = pool.length;
}

function updateBmBadge() {
  const cnt = bookmarks.size;
  const badge = document.getElementById('bmBadge');
  badge.style.display = cnt > 0 ? 'inline-block' : 'none';
  badge.textContent = cnt;
  const btnBm = document.getElementById('btnStartBm');
  if (btnBm) btnBm.style.display = cnt > 0 ? 'block' : 'none';
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'start') || (i === 1 && tab === 'bookmark'));
  });
  if (tab === 'start') {
    document.getElementById('startScreen').style.display = '';
    document.getElementById('bookmarkList').classList.remove('show');
  } else {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('bookmarkList').classList.add('show');
    renderBookmarkList();
  }
}

function renderBookmarkList() {
  const container = document.getElementById('bmItems');
  const actions = document.getElementById('bmActions');
  if (bookmarks.size === 0) {
    container.innerHTML = '<div class="empty-bm">栞がついている問題はありません。<br>問題を解きながら ☆ ボタンで栞をつけられます。</div>';
    actions.innerHTML = '';
    return;
  }
  container.innerHTML = '';
  [...bookmarks].forEach(idx => {
    const q = ALL_QUESTIONS[idx];
    if (!q) return;
    const div = document.createElement('div');
    div.className = 'bm-item';
    div.innerHTML = `<span class="bm-star">★</span><span class="bm-tag">${q.no} ${q.opt}</span><span class="bm-text">${q.q}</span>`;
    div.onclick = () => {
      startFromBookmarkItem(idx);
    };
    container.appendChild(div);
  });
  actions.innerHTML = `
    <button class="btn-retry gold" onclick="startBookmarked()">★ 栞の問題を解く</button>
    <button class="btn-retry" style="border-color:#e05050;color:#e05050;" onclick="clearBookmarks()">すべて削除</button>
  `;
}

function clearBookmarks() {
  if (!confirm('すべての栞を削除しますか？')) return;
  bookmarks.clear();
  saveBookmarks();
  updateBmBadge();
  renderBookmarkList();
}

function toggleShuffle() {
  shuffle = !shuffle;
  document.getElementById('btnShuffle').classList.toggle('active', shuffle);
}

function startQuiz(fromWrong, fromBookmark, startIdx) {
  let pool;
  if (fromBookmark) {
    pool = [...bookmarks].map(i => ALL_QUESTIONS[i]).filter(Boolean);
  } else if (fromWrong) {
    pool = wrongIndices.map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i }));
  } else {
    pool = ALL_QUESTIONS.map((q,i) => ({...q, _origIdx: i}));
    if (selectedGroups.size > 0) pool = pool.filter(q => selectedGroups.has(q.no));
    if (shuffle) {
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
  }
  questions = pool;
  current = 0;
  correct = 0;
  wrongIndices = [];
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('bookmarkList').classList.remove('show');
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('navTabs').style.display = 'none';
  loadQuestion();
}

function startBookmarked() { startQuiz(false, true); }
function startFromBookmarkItem(idx) { startQuiz(false, true); }

function getOrigIdx(q) {
  if (q._origIdx !== undefined) return q._origIdx;
  return ALL_QUESTIONS.indexOf(q);
}

function loadQuestion() {
  if (current >= questions.length) { showResult(); return; }
  answered = false;
  const q = questions[current];
  currentQIndex = getOrigIdx(q);
  document.getElementById('qTag').textContent = q.no;
  document.getElementById('qNum').textContent = q.opt + '肢';
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressNum').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('progressScore').textContent = `正解 ${correct} 問`;
  document.getElementById('progressFill').style.width = `${(current/questions.length)*100}%`;
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'none';
  panel.className = 'result-panel';
  document.getElementById('btnNext').style.display = 'none';
  const bm = document.getElementById('btnMaru');
  const bb = document.getElementById('btnBatsu');
  bm.disabled = false; bb.disabled = false;
  bm.className = 'btn-answer btn-maru';
  bb.className = 'btn-answer btn-batsu';
  // Update bookmark button
  const btnBm = document.getElementById('btnBookmark');
  btnBm.textContent = bookmarks.has(currentQIndex) ? '★' : '☆';
  btnBm.classList.toggle('active', bookmarks.has(currentQIndex));
}

function toggleBookmark() {
  if (currentQIndex < 0) return;
  if (bookmarks.has(currentQIndex)) bookmarks.delete(currentQIndex);
  else bookmarks.add(currentQIndex);
  saveBookmarks();
  updateBmBadge();
  const btnBm = document.getElementById('btnBookmark');
  btnBm.textContent = bookmarks.has(currentQIndex) ? '★' : '☆';
  btnBm.classList.toggle('active', bookmarks.has(currentQIndex));
}

function answer(userAnswer) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const isCorrect = userAnswer === q.a;
  if (isCorrect) correct++;
  else wrongIndices.push(getOrigIdx(q));
  const bm = document.getElementById('btnMaru');
  const bb = document.getElementById('btnBatsu');
  bm.disabled = true; bb.disabled = true;
  if (userAnswer === true) {
    bm.className = isCorrect ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
    if (!isCorrect) bb.className = 'btn-answer reveal-correct';
  } else {
    bb.className = isCorrect ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
    if (!isCorrect) bm.className = 'btn-answer reveal-correct';
  }
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  panel.className = isCorrect ? 'result-panel correct' : 'result-panel wrong';
  document.getElementById('resultHeader').textContent = isCorrect ? '✓ 正解！' : '✗ 不正解';
  document.getElementById('resultExp').textContent = q.exp;
  document.getElementById('resultSource').textContent = '根拠：' + q.src;
  document.getElementById('btnNext').style.display = 'block';
  document.getElementById('progressScore').textContent = `正解 ${correct} 問`;
}

function nextQuestion() {
  current++;
  loadQuestion();
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('navTabs').style.display = 'flex';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('show');
  const total = questions.length;
  const pct = Math.round((correct/total)*100);
  document.getElementById('finalScore').textContent = correct;
  document.getElementById('finalDenom').textContent = `/ ${total}`;
  document.getElementById('finalPct').textContent = `正解率 ${pct}%`;
  document.getElementById('okCount').textContent = correct;
  document.getElementById('ngCount').textContent = total - correct;
  let msg = '';
  if (pct >= 80) msg = '素晴らしい！本試験レベルの高得点です。\n引き続き精度を高めましょう。';
  else if (pct >= 60) msg = '合格ラインに近い水準です。\n間違えた問題を重点的に復習しましょう。';
  else msg = '基礎からの確認が必要です。\n間違えた問題を繰り返し解いて定着させましょう。';
  document.getElementById('scoreMsg').textContent = msg;
  document.getElementById('btnRetryWrong').style.display = wrongIndices.length > 0 ? 'inline-block' : 'none';
}

function resetToStart() {
  document.getElementById('resultScreen').classList.remove('show');
  document.getElementById('startScreen').style.display = '';
  switchTab('start');
}

function retryWrong() { startQuiz(true); }

// Init
loadBookmarks();
initFilters();
updateBmBadge();
updateStartCount();
</script>
</body>
</html>
