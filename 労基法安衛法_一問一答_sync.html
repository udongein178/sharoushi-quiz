{no:"TAC全国模試-問9",opt:"オ",q:"建築物貸与者は、共用部分（貸与を受けた2以上の事業を行う者に専ら使用させる部分以外の部分をいう。）の通路には、正常の通行を妨げない程度に、採光又は照明の方法を講じなければならない。ただし、事業を行う者に対し、事業を行う者の労働者が常時通行の用に供しない地下室等で通行する場合、適当な照明具を所持する必要がある旨を周知したときは、この限りでない。",a:true,exp:"則682条。設問の通り正しい。建築物貸与者は、貸与する建築物の共用部分における通路については、「用途に応じた幅を有すること」「通路面は、つまずき、すべり、踏抜等の危険のない状態に保持すること」「通路面から高さ1.8メートル以内に障害物を置かないこと」に定めるところによらなければならない。",src:"安衛則682条",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問10",opt:"A",q:"建設業に属する事業の事業者は、ダイオキシン類対策特別措置法施行令別表第1第5号に掲げる廃棄物焼却炉（一定以上の焼却能力のもの等に限る。）を有する廃棄物の焼却施設に設置された廃棄物焼却炉、集じん機等の設備の解体等の仕事を開始しようとするときは、その計画を当該仕事の開始の日の14日前までに、所轄労働基準監督署長に届け出なければならない。",a:true,exp:"法88条3項、則90条5号の4、則91条2項。設問の通り正しい。法88条3項（一定建設業等の仕事の届出）は、「仕事開始日の14日前まで」に「労働基準監督署長」に届け出る。",src:"安衛法88条3項・則90条5号の4",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問10",opt:"B",q:"都道府県労働局長は、がんその他の重度の健康障害を生ずるおそれのある業務で、政令で定めるものに従事していた者のうち、厚生労働省令で定める要件に該当する者に対し、離職の際に又は離職の後に、当該業務に係る健康管理手帳を交付するものとする。ただし、現に当該業務に係る健康管理手帳を所持している者については、この限りでない。",a:true,exp:"法67条1項。設問の通り正しい。健康管理手帳の交付は、「離職の際又は離職の後」に、その従事した業務に応じて定められた要件に該当する者の申請に基づいて、所轄都道府県労働局長（離職の後に当該要件に該当する者にあっては、その者の住所を管轄する都道府県労働局長）が行うものとする。",src:"安衛法67条1項",cat:"択一式（安全衛生法）"},

// ============================================================
//  GOOGLE DRIVE SYNC
// ============================================================
const CLIENT_ID    = APP_CONFIG.clientId;
const SCOPES       = 'https://www.googleapis.com/auth/drive.appdata';
const DRIVE_FILE_NAME = APP_CONFIG.driveFileName;
let tokenClient = null, gapiInited = false, gisInited = false;
let accessToken = null, driveFileId = null, isSyncing = false;
let autoSaveTimer = null;
let tokenRefreshTimer = null; // トークン自動更新タイマー

window.addEventListener('load', () => {
  // ログイン済みの場合は「再接続中」表示
  if (getSavedAuth()) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncStatusText');
    if (dot) dot.className = 'sync-dot syncing';
    if (txt) txt.textContent = '再接続中…';
  }
  gapi.load('client', async () => {
    await gapi.client.init({});
    gapiInited = true;
    maybeEnableSync();
  });
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = () => {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID, scope: SCOPES,
      callback: async (resp) => {
        if (resp.error) {
          if (getSavedAuth()) {
            updateSyncUI(false);
            showToast('再接続できませんでした。再度ログインしてください', 'warn');
          }
          return;
        }
        accessToken = resp.access_token;
        gapi.client.setToken({ access_token: accessToken });
        onSignedIn();
        // 55分後にトークンを自動更新（アクセストークンは1時間で失効）
        if (tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
        tokenRefreshTimer = setTimeout(() => {
          if (getSavedAuth()) tokenClient.requestAccessToken({ prompt: '' });
        }, 55 * 60 * 1000);
      }
    });
    gisInited = true;
    maybeEnableSync();
  };
  document.head.appendChild(s);
});

function maybeEnableSync() {
  if (gapiInited && gisInited && getSavedAuth()) {
    tokenClient.requestAccessToken({ prompt: '' });
  }
}
function signIn() {
  if (!gapiInited || !gisInited) { showToast('初期化中です、少々お待ちください', 'error'); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}
function signOut() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken);
  accessToken = null; driveFileId = null;
  if (tokenRefreshTimer) { clearTimeout(tokenRefreshTimer); tokenRefreshTimer = null; }
  clearSavedAuth(); updateSyncUI(false);
  showToast('ログアウトしました');
}
function onSignedIn() {
  updateSyncUI(true); saveAuthHint();
  showToast('ログイン成功、データを読み込んでいます…', 'success');
  loadFromDrive();
}
function updateSyncUI(loggedIn) {
  document.getElementById('syncDot').className = 'sync-dot' + (loggedIn ? ' connected' : '');
  document.getElementById('syncStatusText').textContent = loggedIn ? 'Googleドライブに同期中' : 'Googleアカウントで同期';
  document.getElementById('syncUser').style.display = 'none';
  document.getElementById('btnSignIn').style.display    = loggedIn ? 'none'  : 'flex';
  document.getElementById('btnManualSync').style.display = loggedIn ? 'block' : 'none';
  document.getElementById('btnManualSync').disabled = !loggedIn;
  document.getElementById('btnSignOut').style.display   = loggedIn ? 'block' : 'none';
}
function setSyncing(v) {
  isSyncing = v;
  const dot = document.getElementById('syncDot');
  const btn = document.getElementById('btnManualSync');
  if (v) { dot.className = 'sync-dot syncing'; if (btn) { btn.disabled = true; btn.textContent = '同期中…'; } }
  else   { dot.className = 'sync-dot connected'; if (btn) { btn.disabled = false; btn.textContent = '↑↓ 同期'; } }
}
async function loadFromDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    // トークン有効性チェック
    const tokenInfo = await fetch(
      'https://www.googleapis.com/oauth2/v1/tokeninfo?access_token=' + accessToken
    );
    if (!tokenInfo.ok) {
      accessToken = null;
      clearSavedAuth();
      updateSyncUI(false);
      showToast('セッション切れ：再度ログインしてください', 'warn');
      setSyncing(false);
      return;
    }

    // Drive ファイル一覧取得
    const params = new URLSearchParams({
      spaces: 'appDataFolder',
      q: `name='${DRIVE_FILE_NAME}'`,
      fields: 'files(id,name)'
    });
    const listRes = await fetch(
      `https://www.googleapis.com/drive/v3/files?${params}`,
      { headers: { 'Authorization': 'Bearer ' + accessToken } }
    );
    if (!listRes.ok) {
      const errBody = await listRes.text();
      throw new Error(`list:${listRes.status} ${errBody.substring(0, 100)}`);
    }
    const listData = await listRes.json();
    const files = listData.files || [];
    if (files.length > 0) {
      driveFileId = files[0].id;
      const fileRes = await fetch(
        `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
        { headers: { 'Authorization': 'Bearer ' + accessToken } }
      );
      if (!fileRes.ok) {
        const errBody = await fileRes.text();
        throw new Error(`read:${fileRes.status} ${errBody.substring(0, 100)}`);
      }
      const data = await fileRes.json();
      mergeCloudData(data);
      showToast('クラウドから読み込みました', 'success');
    } else {
      showToast('クラウドにデータがありません（初回）');
      await saveToDrive();
    }
  } catch (e) {
    console.error('Drive load error:', e);
    let msg = '通信エラー';
    if (e instanceof Error && e.message) msg = e.message;
    else if (e && typeof e === 'object') msg = JSON.stringify(e).substring(0, 100);
    else if (e) msg = String(e);
    showToast('読み込み失敗: ' + msg, 'error');
  }
  setSyncing(false);
}
async function saveToDrive() {
  if (!accessToken) return;
  setSyncing(true);
  try {
    const body = JSON.stringify(buildSavePayload());
    if (driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
        body
      });
    } else {
      const meta = JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&spaces=appDataFolder', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + accessToken }, body: form
      });
      driveFileId = (await res.json()).id;
    }
    showToast('クラウドに保存しました', 'success');
  } catch (e) {
    console.error(e);
    showToast('保存失敗: ' + (e?.message || '通信エラー'), 'error');
  }
  setSyncing(false);
}
async function manualSync() {
  if (!accessToken) { showToast('先にログインしてください', 'error'); return; }
  await loadFromDrive();
}
function scheduleAutoSave() {
  if (!accessToken) return;
  if (autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveToDrive(), 3000);
}
// ページが非表示になる瞬間（タブ切替・閉じる直前）に即時保存
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && accessToken) {
    if (autoSaveTimer) { clearTimeout(autoSaveTimer); autoSaveTimer = null; }
    saveToDrive();
  }
});

// ============================================================
//  SAVE / LOAD PAYLOAD
//  ★ v2: stats（正答率）と session（中断データ）を両方保存
// ============================================================
function buildSavePayload() {
  // 現在進行中のセッション or 中断済みの pendingResume を保存
  let sessionData = null;
  // ★ 中断セッション（pendingResume）を最優先で保存。別モードを実行中でも中断点を失わない。
  //    pendingResume が無いときのみ、進行中セッションを保存（タブを閉じた際の自動復帰用）。
  if (pendingResume) {
    sessionData = pendingResume;
  } else if (currentSession && questions.length > 0) {
    sessionData = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
  }
  return {
    version: 2,
    bookmarks: [...bookmarks],          // ★ 栞 → Drive同期で他デバイスにも反映
    stats: JSON.parse(JSON.stringify(questionStats)), // ★ 正答率データ
    session: sessionData,               // ★ 中断セーブ
    savedAt: new Date().toISOString()
  };
}
function mergeCloudData(data) {
  if (!data) return;
  // 栞
  if (data.bookmarks) bookmarks = new Set(data.bookmarks);
  // ★ 正答率データを復元
  if (data.stats) {
    Object.entries(data.stats).forEach(([k, v]) => { questionStats[k] = v; });
  }
  // ★ 中断セッションを復元（1問以上回答済みの場合のみ）
  if (data.session && data.session.questionIndices && data.session.answers) {
    const answered = data.session.answers.filter(a => a !== null).length;
    if (answered > 0) pendingResume = data.session;
  }
  localSave();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateRecentWrongBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
}

const LS_KEY  = 'sharoushi_' + DRIVE_FILE_NAME;
const LS_AUTH = 'sharoushi_auth_hint';

function localSave() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      bookmarks: [...bookmarks], stats: questionStats, session: pendingResume
    }));
  } catch {}
}
function localLoad() {
  try {
    const data = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    if (data.bookmarks) bookmarks = new Set(data.bookmarks);
    if (data.stats) questionStats = data.stats;
    if (data.session) pendingResume = data.session;
  } catch {}
}
function saveAuthHint()  { try { localStorage.setItem(LS_AUTH, '1'); } catch {} }
function getSavedAuth()  { try { return localStorage.getItem(LS_AUTH) === '1'; } catch { return false; } }
function clearSavedAuth() { try { localStorage.removeItem(LS_AUTH); } catch {} }

// ============================================================
//  BOOKMARK
// ============================================================
let bookmarks = new Set();
function toggleBookmark() {
  const idx = getOrigIdx(questions[current]);
  if (bookmarks.has(idx)) bookmarks.delete(idx);
  else bookmarks.add(idx);
  localSave(); updateQuestion(); updateBmBadge();
  if (accessToken) saveToDrive(); else scheduleAutoSave();
}
function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if (bookmarks.size > 0) {
    badge.textContent = bookmarks.size;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
}

// ============================================================
//  STATS
// ============================================================
let questionStats = {}; // { origIdx: {correct:N, total:N} }

function recordStat(origIdx, isCorrect) {
  if (!questionStats[origIdx]) questionStats[origIdx] = {correct:0, total:0};
  // ★ lw = last wrong（最後に間違えた時刻）。1問1個・上書き。復習モードでも必ず更新する。
  //    （更新しないと、復習で間違え続けても日数窓から外れてしまうため）
  if (!isCorrect) questionStats[origIdx].lw = Date.now();
  // ★ 復習モード（noStats）では correct/total を更新しない
  //    ＝「正答率50%以下」「挑戦回数が少ない」モードの純度を保つ
  if (!(currentSession && currentSession.noStats)) {
    questionStats[origIdx].total++;
    if (isCorrect) questionStats[origIdx].correct++;
  }
  localSave(); scheduleAutoSave(); updateWeakBtn(); updateLeastTriedBtn(); updateRecentWrongBtn();
}

// ============================================================
//  RECENT WRONG（直近X日間に間違えた問題）
// ============================================================
function getRecentWrongDays() {
  const el = document.getElementById('recentWrongInput');
  const v = el ? parseInt(el.value) : 7;
  return (!v || v < 1) ? 7 : Math.min(v, 90);
}
function getRecentWrongPool(days) {
  const limit = Date.now() - days * 24 * 60 * 60 * 1000;
  return ALL_QUESTIONS.map((q, i) => ({ q, i }))
    .filter(x => {
      const s = questionStats[x.i];
      return s && s.lw && s.lw >= limit;
    })
    .map(x => ({ ...x.q, _origIdx: x.i }));
}
function updateRecentWrongBtn() {
  const wrap = document.getElementById('recentWrongMode');
  const btn  = document.getElementById('btnRecentWrongStart');
  if (!wrap || !btn) return;
  // 過去90日以内に1問でも間違い記録があるときのみモード自体を表示
  const anyLog = Object.keys(questionStats).some(k => {
    const s = questionStats[k];
    return s && s.lw && s.lw >= Date.now() - 90 * 24 * 60 * 60 * 1000;
  });
  wrap.style.display = anyLog ? 'block' : 'none';
  if (!anyLog) return;
  const d = getRecentWrongDays();
  const n = getRecentWrongPool(d).length;
  btn.textContent = `直近${d}日間で間違えた問題を出題（${n}問）`;
  btn.disabled = (n === 0);
  btn.style.opacity = n === 0 ? '.45' : '1';
}
function startRecentWrong() {
  const d = getRecentWrongDays();
  startSession({ useRecentWrong: true, days: d });
}
function getAccuracyInfo(origIdx) {
  const s = questionStats[origIdx];
  if (!s || s.total === 0) return null;
  const pct = Math.round((s.correct / s.total) * 100);
  return {
    total: s.total, pct,
    cls: pct >= 80 ? 'high' : (pct >= 50 ? 'mid' : 'low')
  };
}

// ============================================================
//  WEAK QUESTIONS
// ============================================================
function updateWeakBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return s && s.total > 0 && (s.correct / s.total) <= 0.5;
  });
  const btn = document.getElementById('btnWeakStart');
  btn.style.display = pool.length > 0 ? 'block' : 'none';
  if (pool.length === 0) btn.textContent = 'まだ回答データがありません';
  else btn.textContent = `正答率50%以下の問題を出題（${pool.length}問）`;
}
function startWeak() {
  const s = { useWeak: true };
  startSession(s);
}
function updateLeastTriedBtn() {
  const pool = ALL_QUESTIONS.filter((q,i) => {
    const s = questionStats[i];
    return !s || s.total === 0 || s.total < 3; // 3回未満
  });
  const btn = document.getElementById('btnLeastTried');
  if (!btn) return;
  if (pool.length > 0) {
    btn.style.display = 'block';
    btn.textContent = `挑戦回数が少ない問題を出題（${pool.length}問）`;
  } else {
    btn.style.display = 'none';
  }
}
function startLeastTried() {
  // 挑戦回数でソート（少ない順）→上位20問を出題
  const indexed = ALL_QUESTIONS.map((q,i) => ({q, i, tries: (questionStats[i]||{total:0}).total}));
  indexed.sort((a,b) => a.tries - b.tries);
  const maxTries = indexed[Math.min(19, indexed.length-1)].tries;
  const pool = indexed.filter(x => x.tries <= maxTries).map(x => ({...x.q, _origIdx: x.i}));
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  const take = pool.slice(0, 20);
  questions = take; answers = Array(take.length).fill(null); current = 0;
  currentSession = { questionIndices: take.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`挑戦回数の少ない${take.length}問を出題`, 'success');
}

// ============================================================
//  RESUME SESSION
// ============================================================
let pendingResume = null;

function offerResume() {
  // モーダル廃止：スタート画面の「続きから開始」ボタンを表示
  updateResumeBtn();
}
function updateResumeBtn() {
  const btn = document.getElementById('btnResumeStart');
  if (!btn) return;
  if (pendingResume) {
    const done = pendingResume.answers.filter(a => a !== null).length;
    const total = pendingResume.questionIndices.length;
    btn.textContent = `▶ 続きから開始（${done}/${total}問 回答済み）`;
    btn.style.display = 'block';
  } else {
    btn.style.display = 'none';
  }
}
function resumeSession() {
  if (!pendingResume) return;
  const pool = pendingResume.questionIndices.map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  if (pool.length === 0) { clearResume(); return; }
  questions = pool; answers = [...pendingResume.answers]; current = pendingResume.current || 0;
  currentSession = { ...pendingResume }; pendingResume = null;
  localSave(); showQuestionScreen(); updateQuestion();
  showToast('前回の続きから再開しました', 'success');
}
function clearResume() {
  pendingResume = null; localSave();
  updateResumeBtn();
  scheduleAutoSave();
}

// ============================================================
//  MAIN LOGIC
// ============================================================
let questions = [], answers = [], current = 0, currentSession = null;

// フィルターは科目×形式の4カテゴリ（労基/安衛 × 択一/選択）。cat依存の複数選択（トグル）
const FILTERS = [
  { key: '択一式（労働基準法）', label: '労基 択一' },
  { key: '択一式（安全衛生法）', label: '安衛 択一' },
  { key: '選択式（労働基準法）', label: '労基 選択' },
  { key: '選択式（安全衛生法）', label: '安衛 選択' },
];
const ALL_CATS = FILTERS.map(f => f.key);
let selectedCats = new Set(ALL_CATS);   // 初期は全カテゴリ選択

// ============================================================
//  FILTER
// ============================================================
function initFilters() {
  const btns = document.getElementById('filterBtns');
  const allBtn = btns.querySelector('[data-cat="all"]');
  if (allBtn) allBtn.onclick = () => toggleFilter('all', allBtn);
  FILTERS.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'btn-filter'; btn.textContent = f.label; btn.dataset.cat = f.key;
    btn.onclick = () => toggleFilter(f.key, btn);
    btns.appendChild(btn);
  });
  refreshFilterUI();
}
function toggleFilter(cat, btn) {
  if (cat === 'all') {
    selectedCats = new Set(ALL_CATS);            // すべて→全カテゴリ選択
  } else if (selectedCats.has(cat)) {
    if (selectedCats.size > 1) selectedCats.delete(cat);  // 解除（最後の1つは残す）
  } else {
    selectedCats.add(cat);                        // 追加
  }
  refreshFilterUI();
}
function refreshFilterUI() {
  // ボタンのactive状態を selectedCats に同期（すべて＝全カテゴリ選択時に点灯）
  document.querySelectorAll('.btn-filter').forEach(b => {
    const c = b.dataset.cat;
    const on = (c === 'all') ? (selectedCats.size === ALL_CATS.length) : selectedCats.has(c);
    b.classList.toggle('active', on);
  });
  // 件数表示・ランダム入力max を更新
  const p = getFilteredPool();
  document.getElementById('startCount').textContent = p.length;
  const input = document.getElementById('randomInput');
  input.max = p.length;
  if (parseInt(input.value) > p.length) input.value = p.length;
  updateRandomBtn();
}
function getFilteredPool() {
  if (selectedCats.size === 0) return ALL_QUESTIONS;
  return ALL_QUESTIONS.filter(q => selectedCats.has(q.cat));
}

// ============================================================
//  RANDOM MODE
// ============================================================
function updateRandomBtn() {
  const input = document.getElementById('randomInput');
  const btn = document.getElementById('btnRandomStart');
  btn.textContent = `${input.value}問ランダムで出題`;
}
function startRandom() {
  const num = parseInt(document.getElementById('randomInput').value) || 10;
  let pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  if (num >= pool.length) pool = pool;
  else {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問をランダム出題開始`, 'success');
}

// 栞ランダムモード
function updateBookmarkRandomBtn() {
  const input = document.getElementById('bookmarkRandomInput');
  const btn = document.getElementById('btnBookmarkRandomStart');
  btn.textContent = `栞から${input.value}問ランダムで出題`;
}
function startBookmarkRandom() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const num = parseInt(document.getElementById('bookmarkRandomInput').value) || 10;
  let pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(q => q.no);
  if (num < pool.length) {
    pool = pool.sort(() => Math.random() - 0.5).slice(0, num);
  }
  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`栞から${pool.length}問をランダム出題開始`, 'success');
}

// ============================================================
//  SHUFFLE
// ============================================================
function shuffle() {
  const pool = getFilteredPool();
  const indices = Array.from({length: pool.length}, (_, i) => i);
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  ALL_QUESTIONS.length = 0;
  indices.forEach(i => ALL_QUESTIONS.push(pool[i]));
  showToast('問題をシャッフルしました', 'success');
}

// ============================================================
//  START MODES
// ============================================================
function start() {
  const s = {};
  startSession(s);
}
function startBookmarks() {
  if (bookmarks.size === 0) { showToast('栞がありません', 'warn'); return; }
  const s = { useBookmarks: true };
  startSession(s);
}
function startSession(s) {
  let pool = [];
  
  if (s.useBookmarks) {
    pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i })).filter(Boolean);
  } else if (s.useRecentWrong) {
    pool = getRecentWrongPool(s.days || 7);
  } else if (s.useWeak) {
    let p = ALL_QUESTIONS.map((q, i) => ({ ...q, _origIdx: i }));
    pool = p.filter(q => {
      const stat = questionStats[q._origIdx];
      return stat && stat.total > 0 && (stat.correct / stat.total) <= 0.5;
    });
  } else {
    pool = getFilteredPool().map(q => ({ ...q, _origIdx: ALL_QUESTIONS.indexOf(q) }));
  }

  if (pool.length === 0) { showToast('対象問題がありません', 'warn'); return; }
  
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  // ★ noStats: 復習モードでは正答率・挑戦回数に反映しない
  currentSession = { questionIndices: pool.map(q => q._origIdx), current: 0, answers: [...answers], noStats: !!s.useRecentWrong };
  showQuestionScreen(); updateQuestion();
  if (s.useRecentWrong) showToast(`直近${s.days || 7}日間の誤答${pool.length}問を復習（記録に反映されません）`, 'success');
}

function getOrigIdx(q) { return q._origIdx !== undefined ? q._origIdx : ALL_QUESTIONS.indexOf(q); }

// ============================================================
//  SCREENS
// ============================================================
function showMain() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.getElementById('screenMain').classList.add('show');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tabMain').classList.add('active');
  
  // メイン画面表示時に進行中セッションがあれば questionScreen に、なければ startScreen に
  if (questions.length > 0 && current < questions.length) {
    showQuestionScreen(); updateQuestion();
  } else {
    document.getElementById('startScreen').style.display = 'block';
    document.getElementById('questionScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'none';
    document.getElementById('progressWrap').style.display = 'none';
    updateResumeBtn();   // ★ 中断セッションがあれば「続きから開始」を表示
  }
}
function showBookmarks() {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('show'));
  document.getElementById('screenBookmarks').classList.add('show');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tabBookmarks').classList.add('active');
  document.querySelector('.bookmark-list').classList.add('show');
  renderBookmarks();
}

function showQuestionScreen() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('questionScreen').style.display = 'block';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'block';
}
function showResultScreen() {
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('progressWrap').style.display = 'none';
  renderResults();
}

// ============================================================
//  UPDATE QUESTION
// ============================================================
function updateQuestion() {
  if (questions.length === 0 || current >= questions.length) return;
  
  const q = questions[current];
  const currentQIndex = getOrigIdx(q);
  
  // プログレスバー
  const progressInfo = `${current + 1} / ${questions.length}`;
  const correctCount = answers.filter(a => a && a.correct).length;
  document.getElementById('progressNum').textContent = progressInfo;
  document.getElementById('progressScore').textContent = `正解: ${correctCount}問`;
  document.getElementById('progressFill').style.width = `${((current + 1) / questions.length) * 100}%`;
  
  // 問題カード
  document.getElementById('qTag').textContent = q.cat;
  document.getElementById('qNum').textContent = q.no + (q.opt ? '-' + q.opt : '');
  if (q.type === 'select') {
    document.getElementById('qText').innerHTML = q.context;
    // 空欄を強調
    const regex = /【[A-Z]】/g;
    document.getElementById('qText').innerHTML = document.getElementById('qText').innerHTML.replace(
      regex, '<span class="q-blank">$&</span>'
    );
  } else {
    document.getElementById('qText').textContent = q.q;
  }
  
  // タイプバッジ
  const typeBadge = document.getElementById('qTypeBadge');
  if (q.type === 'select') {
    typeBadge.textContent = '選択式';
    typeBadge.className = 'q-type-badge sel';
    typeBadge.style.display = 'inline-block';
  } else {
    typeBadge.textContent = '○×';
    typeBadge.className = 'q-type-badge ox';
    typeBadge.style.display = 'inline-block';
  }

  // ★ 正答率バッジ・挑戦回数バッジ・栞ボタン（回答後のみ表示）
  const accEl  = document.getElementById('qAcc');
  const triesEl = document.getElementById('qTries');
  const bBtn = document.getElementById('btnBookmark');

  // ★ 復習モード（記録非反映）バッジ
  const revEl = document.getElementById('qReview');
  if (revEl) revEl.style.display = (currentSession && currentSession.noStats) ? 'inline-block' : 'none';

  const ans    = answers[current];
  const panel  = document.getElementById('resultPanel');
  const nextBtn = document.getElementById('btnNext');
  const isSelect = (q.type === 'select');

  if (ans) {
    // 回答後：バッジ・栞を表示
    const accInfo = getAccuracyInfo(currentQIndex);
    if (accInfo) {
      accEl.textContent = `過去${accInfo.total}回: ${accInfo.pct}%正解`;
      accEl.className   = `q-acc ${accInfo.cls}`;
      accEl.style.display = 'inline-block';
    } else {
      accEl.style.display = 'none';
    }
    const s = questionStats[currentQIndex];
    const tries = s ? s.total : 0;
    triesEl.textContent = `挑戦${tries}回`;
    triesEl.style.display = 'inline-block';
    bBtn.textContent = bookmarks.has(currentQIndex) ? '★' : '☆';
    bBtn.classList.toggle('active', bookmarks.has(currentQIndex));
    bBtn.style.visibility = 'visible';
  } else {
    // 回答前：バッジ・栞を非表示
    accEl.style.display = 'none';
    triesEl.style.display = 'none';
    bBtn.textContent = '☆';
    bBtn.classList.remove('active');
    bBtn.style.visibility = 'hidden';
  }

  // ボタン群の表示切替
  document.getElementById('oxRow').style.display       = isSelect ? 'none' : 'grid';
  document.getElementById('choicesGrid').style.display = isSelect ? 'grid' : 'none';
  if (ans) {
    if (isSelect) renderChoices(q, ans.userChoice, true);
    else          renderOxButtons(q, ans.userChoice, true);
    showResultPanel(q, ans.correct);
    nextBtn.style.display = 'block';
  } else {
    if (isSelect) renderChoices(q, null, false);
    else          renderOxButtons(q, null, false);
    panel.style.display = 'none'; panel.className = 'result-panel';
    nextBtn.style.display = 'none';
  }
  document.getElementById('btnBack').disabled = (current === 0);
  document.getElementById('btnSkip').style.display = ans ? 'none' : 'block';
}

function renderOxButtons(q, userChoice, isAnswered) {
  const bm = document.getElementById('btnMaru');
  const bb = document.getElementById('btnBatsu');
  // ラベルをリセット
  bm.innerHTML = '<div>○</div><div class="btn-label">正しい</div>';
  bb.innerHTML = '<div>×</div><div class="btn-label">誤り</div>';
  bm.className = 'btn-answer btn-maru'; bb.className = 'btn-answer btn-batsu';
  bm.disabled = false; bb.disabled = false;
  if (isAnswered) {
    bm.disabled = true; bb.disabled = true;
    if (userChoice === true) {
      bm.className = q.a === true  ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== true)  bb.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bm.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      bb.className = q.a === false ? 'btn-answer correct-chosen' : 'btn-answer wrong-chosen';
      if (q.a !== false) bm.className = 'btn-answer reveal-correct';
      // あなたの選択ラベル
      bb.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    }
  }
}

// 選択式問題の描画（選択式を含む科目でオーバーライドして使用）
function renderChoices(q, userChoice, isAnswered) {
  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  // 選択肢を問題ごとに1回だけシャッフルしてキャッシュ（回答後の再描画でも順序を固定）
  if (!q._shuffledChoices) {
    const arr = [...q.choices];
    for (let i = arr.length - 1; i > 0; i--) {
      const jj = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[jj]] = [arr[jj], arr[i]];
    }
    q._shuffledChoices = arr;
  }
  q._shuffledChoices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'btn-choice'; btn.textContent = c;
    if (isAnswered) {
      btn.disabled = true;
      if (c === q.answer)   btn.className = c === userChoice ? 'btn-choice correct-chosen' : 'btn-choice reveal-correct';
      if (c === userChoice && c !== q.answer) btn.className = 'btn-choice wrong-chosen';
      if (c === userChoice) btn.innerHTML += '<div class="your-choice-label">▶ あなたの選択</div>';
    } else {
      btn.onclick = () => answerSelect(c);
    }
    grid.appendChild(btn);
  });
}

function showResultPanel(q, isCorrect) {
  const panel = document.getElementById('resultPanel');
  panel.style.display = 'block';
  panel.className     = isCorrect ? 'result-panel correct' : 'result-panel wrong';
  document.getElementById('resultHeader').textContent = isCorrect ? '✓ 正解！' : '✗ 不正解';
  document.getElementById('resultExp').innerHTML = (q.exp || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/「([^」]*)」/g, '「<b>$1</b>」');
  document.getElementById('resultSource').textContent = '根拠：' + q.src;
}

// ============================================================
//  ANSWER
// ============================================================
function answerOx(userAnswer) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userAnswer === q.a;
  answers[current] = { correct: isCorrect, userChoice: userAnswer };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}
function answerSelect(userChoice) {
  if (answers[current]) return;
  const q         = questions[current];
  const isCorrect = userChoice === q.answer;
  answers[current] = { correct: isCorrect, userChoice };
  recordStat(getOrigIdx(q), isCorrect);
  localSave(); updateQuestion(); scheduleAutoSave();
}

// ============================================================
//  NAVIGATION
// ============================================================
function nextQuestion() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function prevQuestion() {
  if (current > 0) { current--; updateQuestion(); }
  currentSession.current = current; localSave();
}
function skip() {
  if (current < questions.length - 1) { current++; updateQuestion(); }
  else { finishSession(); }
  currentSession.current = current; localSave();
}
function suspend() {
  // 中断時にセッションデータをpendingResumeに移す
  if (currentSession) {
    pendingResume = {
      questionIndices: questions.map(q => getOrigIdx(q)),
      current,
      answers: [...answers]
    };
    currentSession = null;
    localSave(); scheduleAutoSave();
  }
  
  questions = []; answers = []; current = 0;
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  updateResumeBtn();
  showToast('セッションを中断しました', 'warn');
}

// ============================================================
//  FINISH & RESULTS
// ============================================================
function finishSession() {
  // ★ 完了時は現在のセッションのみクリア。中断中の pendingResume は消さない
  //    （中断→別モード実行→そのモードを完了、で中断点が消える不具合の修正）
  currentSession = null;
  localSave(); scheduleAutoSave();
  showResultScreen();
}
function renderResults() {
  const correct = answers.filter(a => a && a.correct).length;
  const wrong   = answers.filter(a => a && !a.correct).length;
  const skipped = answers.filter(a => !a).length;
  const total   = questions.length;
  const rate    = total > 0 ? Math.round((correct / total) * 100) : 0;

  document.getElementById('resultScoreText').textContent = `${correct} / ${total}`;
  document.getElementById('correctCount').textContent   = correct;
  document.getElementById('wrongCount').textContent     = wrong;
  document.getElementById('skippedCount').textContent   = skipped;
  
  let msg = `正解率: ${rate}%\n`;
  if (rate >= 80) msg += '素晴らしい結果です！';
  else if (rate >= 60) msg += '良い成績です！';
  else if (rate >= 40) msg += 'もう少し頑張りましょう。';
  else msg += '復習をお勧めします。';
  
  document.getElementById('resultMessage').textContent = msg;
  
  // 再挑戦ボタンの表示制御
  document.getElementById('btnRetryWrong').style.display = wrong > 0 ? 'inline-block' : 'none';
  document.getElementById('btnRetrySkipped').style.display = skipped > 0 ? 'inline-block' : 'none';
}

// ============================================================
//  RETRY
// ============================================================
function retryWrong() {
  const wrongIndices = [];
  answers.forEach((a, i) => { if (a && !a.correct) wrongIndices.push(i); });
  if (wrongIndices.length === 0) return;
  
  const pool = wrongIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function retrySkipped() {
  const skippedIndices = [];
  answers.forEach((a, i) => { if (!a) skippedIndices.push(i); });
  if (skippedIndices.length === 0) return;
  
  const pool = skippedIndices.map(i => questions[i]);
  questions = pool; answers = Array(pool.length).fill(null); current = 0;
  currentSession = { questionIndices: pool.map(q => getOrigIdx(q)), current: 0, answers: [...answers] };
  showQuestionScreen(); updateQuestion();
  showToast(`${pool.length}問の復習を開始`, 'success');
}
function restart() {
  questions = []; answers = []; current = 0;
  currentSession = null;   // ★ pendingResume（中断セッション）は保持する
  localSave();
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('questionScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('progressWrap').style.display = 'none';
  updateResumeBtn();   // ★ 中断セッションがあれば「続きから開始」を再表示
}

// ============================================================
//  BOOKMARKS
// ============================================================
function renderBookmarks() {
  const container = document.getElementById('bookmarkItems');
  const empty = document.getElementById('emptyBookmarks');
  
  if (bookmarks.size === 0) {
    container.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  
  empty.style.display = 'none';
  container.innerHTML = '';
  
  [...bookmarks].sort((a, b) => a - b).forEach(idx => {
    const q = ALL_QUESTIONS[idx];
    if (!q) return;
    
    const item = document.createElement('div');
    item.className = 'bm-item';
    item.onclick = () => startFromBookmark(idx);
    
    const star = document.createElement('div');
    star.className = 'bm-star'; star.textContent = '★';
    
    const tag = document.createElement('div');
    tag.className = 'bm-tag'; tag.textContent = q.cat;
    
    const acc = document.createElement('div');
    const accInfo = getAccuracyInfo(idx);
    if (accInfo) {
      acc.className = `bm-acc ${accInfo.cls}`;
      acc.textContent = `${accInfo.pct}%`;
    }
    
    const text = document.createElement('div');
    text.className = 'bm-text';
    if (q.type === 'select') {
      text.textContent = `【${q.opt}】${q.context.slice(0, 80)}...`;
    } else {
      text.textContent = `${q.no}-${q.opt}: ${q.q.slice(0, 80)}...`;
    }
    
    item.appendChild(star);
    item.appendChild(tag);
    if (accInfo) item.appendChild(acc);
    item.appendChild(text);
    container.appendChild(item);
  });
}

function startFromBookmark(startIdx) {
  const pool = [...bookmarks].map(i => ({ ...ALL_QUESTIONS[i], _origIdx: i }))
    .filter(Boolean).sort((a, b) => a._origIdx - b._origIdx);
  const startPos = pool.findIndex(q => q._origIdx === startIdx);
  
  questions = pool; answers = Array(pool.length).fill(null); 
  current = Math.max(0, startPos);
  currentSession = { questionIndices: pool.map(q => q._origIdx), current, answers: [...answers] };
  showMain(); showQuestionScreen(); updateQuestion();
}

// ============================================================
//  TOAST
// ============================================================
function showToast(message, type = 'info') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast${type ? ' ' + type : ''}`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  localLoad();
  initFilters();
  updateBmBadge();
  updateWeakBtn();
  updateLeastTriedBtn();
  updateRecentWrongBtn();
  updateResumeBtn();
  if (pendingResume) offerResume();
});

// アプリ情報の表示
document.getElementById('appTitle').textContent    = APP_CONFIG.title;
document.getElementById('appSubtitle').textContent = APP_CONFIG.subtitle;

// 栞ボタンの表示制御
function checkBookmarkButton() {
  const btn = document.getElementById('btnBookmarkStart');
  btn.style.display = bookmarks.size > 0 ? 'block' : 'none';
  // 栞ランダムモードの表示制御
  const bmRandom = document.getElementById('bookmarkRandomMode');
  if (bmRandom) {
    bmRandom.style.display = bookmarks.size > 0 ? 'block' : 'none';
    const input = document.getElementById('bookmarkRandomInput');
    if (input) {
      input.max = bookmarks.size;
      if (parseInt(input.value) > bookmarks.size) input.value = bookmarks.size;
      updateBookmarkRandomBtn();
    }
  }
}

// 初期化時に栞ボタンをチェック
document.addEventListener('DOMContentLoaded', () => {
  checkBookmarkButton();
});

// 栞の更新時に栞ボタンもチェック
function updateBmBadge() {
  const badge = document.getElementById('bmBadge');
  if (bookmarks.size > 0) {
    badge.textContent = bookmarks.size;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }
  checkBookmarkButton(); // 栞ボタンの表示も更新
}
