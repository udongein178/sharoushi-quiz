<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>労働基準法・安全衛生法 一問一答 — 社労士試験対策</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}

/* ===== SYNC BAR ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;background:#1a2434;border:1px solid #283848;border-radius:10px;padding:10px 14px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9bb0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#556070;flex-shrink:0;transition:background .3s}
.sync-dot.connected{background:#3dbe82}
.sync-dot.syncing{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.error{background:#e05050}
.sync-user{font-size:11px;color:#556070;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btns{display:flex;gap:6px;align-items:center}
.btn-gsign{display:flex;align-items:center;gap:6px;background:#fff;color:#3c4043;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-gsign:hover{background:#f1f3f4}
.btn-gsign svg{flex-shrink:0}
.btn-sync{background:transparent;border:1px solid #283848;color:#8a9bb0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sync:hover{border-color:#4a9eca;color:#4a9eca}
.btn-sync:disabled{opacity:.4;cursor:default}
.btn-signout{background:transparent;border:1px solid #283848;color:#556070;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-signout:hover{border-color:#e05050;color:#e05050}

/* ===== HEADER ===== */
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}

/* ===== QUESTION CARD ===== */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:14px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-num{font-size:15px;color:#556070}
/* Accuracy badge on card */
.q-acc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:none}
.q-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.q-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.q-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.q-text{font-size:18px;line-height:1.8;color:#d8d0c0;word-break:break-word;white-space:pre-wrap;padding-right:40px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}

/* ===== OX BUTTONS ===== */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* あなたの選択ラベル */
.your-choice-label{font-size:9px;letter-spacing:.08em;opacity:.85;margin-top:2px;font-weight:700}
/* 挑戦回数バッジ */
.q-tries{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(138,155,176,.12);border:1px solid #283848;color:#8a9bb0;display:none}
/* 復習モード（記録非反映）バッジ */
.q-review{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(232,201,122,.12);border:1px solid rgba(232,201,122,.35);color:#e8c97a;display:none}

/* ===== SELECT CHOICES (選択式用) ===== */
.choices-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-choice{background:#182030;border:1.5px solid #283848;border-radius:8px;padding:12px 10px;font-size:13px;color:#c8c0b0;cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.btn-choice:hover{border-color:#c97a4a;background:#1e2a3a}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice:disabled{cursor:default}
.q-type-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
.q-type-badge.ox{background:rgba(91,184,224,.12);border:1px solid rgba(91,184,224,.25);color:#5bb8e0}
.q-type-badge.sel{background:rgba(130,201,122,.12);border:1px solid rgba(130,201,122,.25);color:#82c97a}
.q-blank{background:rgba(201,122,74,.15);border-bottom:2px solid #c97a4a;color:#e8a87a;padding:0 4px;font-weight:700;border-radius:2px}

/* ===== RESULT PANEL ===== */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:18px;font-weight:700;margin-bottom:8px}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:17px;line-height:1.7;color:#a0b0c0}
.result-exp b{color:#f0c987;font-weight:700}
.result-source{font-size:15px;color:#556070;margin-top:8px}

/* ===== NAV BUTTONS ===== */
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;white-space:nowrap}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:disabled{opacity:.3;cursor:default}
/* ⏸ 中断ボタン */
.btn-suspend{border-color:#4a3a10 !important;color:#e8c97a !important}
.btn-suspend:hover{background:rgba(232,201,122,.1) !important;border-color:#e8c97a !important}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;border:none;background:#c97a4a;color:#1a0800;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}

/* ===== START SCREEN ===== */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filters{margin-bottom:22px}
.filter-label{font-size:12px;color:#8a9bb0;margin-bottom:8px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn-filter{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-filter.active{border-color:#c97a4a;background:rgba(201,122,74,.12);color:#c97a4a}
.btn-filter:hover{border-color:#4a9eca;color:#4a9eca}
.random-mode{margin-bottom:18px}
.random-input-wrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.random-input{background:#1a2434;border:1.5px solid #283848;border-radius:6px;color:#e8e0d0;padding:8px 10px;font-size:14px;width:60px;text-align:center}
.random-input:focus{outline:none;border-color:#c97a4a}
.random-label{font-size:13px;color:#8a9bb0}
.start-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-start{border:1.5px solid #c97a4a;background:transparent;color:#c97a4a;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-start:hover{background:rgba(201,122,74,.12)}
.btn-start.primary{background:#c97a4a;color:#1a0800}
.btn-start.primary:hover{background:#e8a87a}
.btn-shuffle{border:1.5px solid #8a9bb0;background:transparent;color:#8a9bb0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-shuffle:hover{background:rgba(138,155,176,.1)}

/* ===== RESULT SCREEN ===== */
.result-screen{text-align:center;padding:36px 16px}
.result-title{font-size:24px;font-weight:700;color:#e8e0d0;margin-bottom:16px}
.result-score{font-size:36px;font-weight:700;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-retry:hover{background:rgba(201,122,74,.12)}

/* ===== BOOKMARK LIST ===== */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-acc{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:1px}
.bm-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.bm-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.bm-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0;flex:1;min-width:0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2434;border:1px solid #283848;border-radius:8px;padding:10px 18px;font-size:13px;color:#e8e0d0;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#3dbe82;color:#3dbe82}
.toast.error{border-color:#e05050;color:#e05050}
.toast.warn{border-color:#c9a84c;color:#c9a84c}

/* ===== RESUME MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999}
.modal{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:24px;max-width:400px;width:90vw}
.modal-title{font-size:16px;font-weight:700;color:#e8e0d0;margin-bottom:12px}
.modal-desc{font-size:14px;color:#a0b0c0;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-modal{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-modal.primary{border-color:#c97a4a;color:#c97a4a}
.btn-modal:hover{background:rgba(138,155,176,.1)}
.btn-modal.primary:hover{background:rgba(201,122,74,.12)}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .3s ease}
</style>
</head>
<body>
<div class="app">

<!-- ===== GOOGLE DRIVE SYNC BAR ===== -->
<div class="sync-bar">
  <div class="sync-status">
    <div id="syncDot" class="sync-dot"></div>
    <span id="syncStatusText">Googleアカウントで同期</span>
    <div id="syncUser" class="sync-user"></div>
  </div>
  <div class="sync-btns">
    <button id="btnSignIn" class="btn-gsign" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <button id="btnManualSync" class="btn-sync" onclick="manualSync()">↑↓ 同期</button>
    <button id="btnSignOut" class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>社労士試験対策</h1>
  <div id="appTitle" class="title">雇用保険法 一問一答</div>
  <div id="appSubtitle" class="subtitle">TAC・LEC 択一式351問 ＋ 選択式51問　計402問</div>
</div>

<!-- ===== NAV TABS ===== -->
<div class="nav-tabs">
  <button id="tabMain"  class="nav-tab active" onclick="showMain()">学習</button>
  <button id="tabBookmarks" class="nav-tab" onclick="showBookmarks()">栞<span id="bmBadge" class="bm-badge" style="display:none">0</span></button>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="screenMain" class="screen show">

<!-- ===== PROGRESS BAR ===== -->
<div id="progressWrap" class="progress-wrap" style="display:none">
  <div class="progress-info">
    <div id="progressNum" class="progress-num">0 / 0</div>
    <div id="progressScore" class="progress-score">正解: 0問</div>
  </div>
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill" style="width:0%"></div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="startScreen" class="start-screen">
  <span id="startCount" class="start-count">402</span>
  <span class="start-unit">問</span>
  <div class="start-desc">労働基準法・安全衛生法の知識を一問一答で確認しよう。<br>択一式351問・選択式51問（計402問）を収録。</div>
  
  <!-- フィルター -->
  <div class="filters">
    <div class="filter-label">出題範囲</div>
    <div id="filterBtns" class="filter-btns">
      <button class="btn-filter active" data-cat="all">すべて</button>
    </div>
  </div>

  <!-- ランダム出題モード -->
  <div class="random-mode">
    <div class="random-input-wrap">
      <input id="randomInput" class="random-input" type="number" value="10" min="1" max="402" oninput="updateRandomBtn()">
      <span class="random-label">問をランダムで出題</span>
    </div>
    <button id="btnRandomStart" class="btn-start" onclick="startRandom()">10問ランダムで出題</button>
  </div>

  <!-- 直近X日間に間違えた問題モード -->
  <div id="recentWrongMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="recentWrongInput" class="random-input" type="number" value="7" min="1" max="90" oninput="updateRecentWrongBtn()">
      <span class="random-label">日以内に間違えた問題</span>
    </div>
    <button id="btnRecentWrongStart" class="btn-start" onclick="startRecentWrong()">直近7日間で間違えた問題を出題</button>
  </div>

  <!-- 栞ランダム出題モード -->
  <div id="bookmarkRandomMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="bookmarkRandomInput" class="random-input" type="number" value="10" min="1" max="110" oninput="updateBookmarkRandomBtn()">
      <span class="random-label">問を栞からランダムで出題</span>
    </div>
    <button id="btnBookmarkRandomStart" class="btn-start" onclick="startBookmarkRandom()">栞から10問ランダムで出題</button>
  </div>

  <!-- ボタン群 -->
  <div class="start-btns">
    <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
    <button id="btnResumeStart" class="btn-start" onclick="resumeSession()" style="display:none">▶ 続きから開始</button>
    <button id="btnWeakStart" class="btn-start" onclick="startWeak()" style="display:none">正答率50%以下の問題を出題</button>
    <button id="btnLeastTried" class="btn-start" onclick="startLeastTried()" style="display:none">挑戦回数が少ない問題を出題</button>
    <button class="btn-start primary" onclick="start()">学習スタート</button>
    <button id="btnBookmarkStart" class="btn-start" onclick="startBookmarks()" style="display:none">栞の問題のみ</button>
  </div>

const ALL_QUESTIONS = [
{no:"問1",opt:"A",q:"労働基準法第3条では、使用者は、労働者の国籍、信条又は社会的身分を理由として、賃金、労働時間その他の労働条件について、差別的取扱をしてはならないと定めているが、ここにいう「国籍、信条又は社会的身分」は差別の理由を例示したものに過ぎないので、例えば、障害を有することを理由とする差別的取扱も同条により禁止されている。",a:false,exp:"法3条に規定する「国籍、信条又は社会的身分」は限定列挙（制限列挙）であり、これら以外の理由で差別的取扱をすることは、同条で禁止されていない。なお、障害者雇用促進法では、「事業主は、労働者の募集及び採用について、障害者に対して、障害者でない者と均等な機会を与えなければならない（同法34条）」「事業主は、賃金の決定、教育訓練の実施、福利厚生施設の利用その他の待遇について、労働者が障害者であることを理由として、障害者でない者と不当な差別的取扱いをしてはならない（同法35条）」と定めており、障害者に対する差別を禁止している。",src:"法3条",cat:"択一式（労働基準法）"},
{no:"問1",opt:"B",q:"労働基準法第6条では、何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならないと定めているが、「業として利益を得る」とは、営利を目的として、同種の行為を反復継続することをいうので、1回の行為であれば、同条違反となることはない。",a:false,exp:"1回の行為であっても、反復継続して利益を得る意思があれば「業として利益を得る」に該当する（法6条違反となることがある。）。なお、法6条の「利益」とは、手数料、報償金、金銭以外の財物等如何なる名称たるとを問わず、また有形無形なるとを問わない。また、使用者より利益を得る場合のみに限らず、労働者又は第三者より利益を得る場合をも含む。",src:"法6条、昭和23.3.2基発381号",cat:"択一式（労働基準法）"},
{no:"問1",opt:"C",q:"労働基準法第7条では、使用者は、労働者が労働時間中に、選挙権その他公民としての権利を行使し、又は公の職務を執行するために必要な時間を請求した場合においては、拒んではならないと定めており、事業の正常な運営を妨げる場合であっても、原則としてその請求された時刻を変更することはできない。",a:true,exp:"設問の通り正しい。法7条は、民主主義を基調とする憲法の下において、労働者の公的活動を保障するために設けられた規定であり、事業の正常な運営を妨げる場合であっても、原則として、同条の規定により請求された時刻を変更することはできない。ただし、「権利の行使又は公の職務の執行に妨げがない限り」、請求された時刻を変更することができる。",src:"法7条",cat:"択一式（労働基準法）"},
{no:"問1",opt:"D",q:"個人家庭における家事を事業として請け負うものに雇われて、その指揮命令の下に当該家事を行う者は家事使用人に該当するので、労働基準法は適用されない。",a:false,exp:"設問の者は、家事使用人に該当せず、労働基準法が適用される。なお、法人に雇われ、その役職員の家庭において、その家族の指揮命令の下で家事一般に従事している者は、家事使用人に該当し、労働基準法は適用されない。",src:"法116条2項、平成11.3.31基発168号",cat:"択一式（労働基準法）"},
{no:"問1",opt:"E",q:"法令の規定により事業主等に申請等が義務付けられている場合において、事務代理の委任を受けた社会保険労務士がその懈怠により当該申請等を行わなかった場合であっても、当該社会保険労務士は、労働基準法第10条にいう「使用者」に該当するものでないので、当該社会保険労務士を当該申請等の義務違反の行為者として罰則規定に基づきその責任を問うことはできない。",a:false,exp:"法令の規定により事業主等に申請等が義務付けられている場合において、事務代理の委任を受けた社会保険労務士がその懈怠により当該申請等を行わなかった場合には、当該社会保険労務士は、法10条にいう「使用者」に該当するものであるので、当該社会保険労務士を当該申請等の義務違反の行為者として罰則規定に基づきその責任を問い得るものである。",src:"法10条、昭和62.3.26基発169号",cat:"択一式（労働基準法）"},
{no:"問2",opt:"A",q:"派遣元の使用者は、派遣労働者との労働契約の締結に際し、労働者派遣法における労働基準法の適用に関する特例により自己が労働基準法に基づく義務を負わない労働時間、休憩、休日等を含めて、労働基準法第15条による労働条件の明示をする必要がある。",a:true,exp:"設問の通り正しい。",src:"法15条1項、昭和61.6.6基発333号",cat:"択一式（労働基準法）"},
{no:"問2",opt:"B",q:"使用者は、期間の定めのある労働契約（以下「有期労働契約」という。）であって当該労働契約の期間の満了後に当該労働契約を更新する場合があるものの締結の場合には、その締結に際し、有期労働契約を更新する場合の基準に関する事項を明示する必要があり、有期労働契約の更新回数に上限の定めがある場合にはその上限を明示しなければならないが、上限の定めがない場合にはその旨を明示する必要はない。",a:true,exp:"設問の通り正しい。有期労働契約であって当該労働契約の期間の満了後に当該労働契約を更新する場合があるものの締結の場合には、労働条件の明示事項として「有期労働契約を更新する場合の基準に関する事項（通算契約期間又は有期労働契約の更新回数に上限の定めがある場合には当該上限を含む。）」が規定されており、上限の定めがある場合にのみ、その上限の明示が必要とされている（上限の定めがない場合にはその旨の明示は必要ない。）。なお、労働条件の明示事項のうち「労働契約の期間に関する事項」について、労働契約の期間の定めをしない場合においては、期間の定めをしない旨を明示する必要がある。",src:"法15条1項、3項、則5条1項1号の2",cat:"択一式（労働基準法）"},
{no:"問2",opt:"C",q:"労働基準法第15条第1項の規定により明示された労働条件が事実と相違する場合においては、労働者は、即時に労働契約を解除することができる。この場合、就業のために住居を変更した労働者が、契約解除の日から14日以内に帰郷する場合においては、使用者は、必要な旅費を負担しなければならないが、ここにいう旅費は、労働者本人の旅費に限られ、就業のため移転した家族の旅費は含まない。",a:false,exp:"設問の帰郷の旅費は、労働者本人の旅費に限らず、就業のため移転した家族〔生計を維持されている同居の親族（届出をしていないが事実上その者と婚姻関係と同様の事情にある者を含む。）〕の旅費をも含む。なお、「14日以内に帰郷する」とは、14日以内に目的地に向かって現住所を離れることで足り、目的地に到着することは要しない。",src:"法15条2項、昭和22.9.13発基17号",cat:"択一式（労働基準法）"},
{no:"問2",opt:"D",q:"労働基準法第14条第1項の規定により、労働契約の期間の上限が3年とされている労働者について、使用者が当該労働者との間で10年の期間を定めた労働契約を締結した場合には、その労働契約の期間は3年となる。",a:true,exp:"設問の通り正しい。なお、設問のように法14条に違反して3年を超える期間の労働契約を締結した使用者は、30万円以下の罰金に処せられる（同条違反について労働者には罰則の適用はない。）。",src:"法13条、14条1項",cat:"択一式（労働基準法）"},
{no:"問2",opt:"E",q:"使用者が、高度の専門的知識等を有しない50歳の労働者との間で2年の期間を定めた労働契約（一定の事業の完了に必要な期間を定める労働契約ではない。）を締結した。この場合、当該労働者は、その労働契約の期間の初日から1年を経過した日以後においては、その使用者に申し出ることにより、いつでも退職することができる。",a:true,exp:"設問の通り正しい。なお、労働契約の期間の上限が5年とされている労働者〔①高度の専門的知識等を有する労働者（高度の専門的知識等を必要とする業務に就く者に限る）、②満60歳以上の労働者〕については、設問の「労働契約の期間の初日から1年を経過した日以後においては、その使用者に申し出ることにより、いつでも退職することができる」旨の規定は、適用されない。",src:"法附則137条",cat:"択一式（労働基準法）"},
{no:"問3",opt:"ア",q:"【条件：1日の所定労働時間8時間、1週間の所定労働日は月曜日から金曜日、1週間の所定休日は土曜日及び日曜日、平均賃金10,000円、年次有給休暇中の賃金は就業規則において休暇1日につき平均賃金に相当する額と規定している。】労働基準法第26条に規定する「使用者の責に帰すべき事由」により、労働者が金曜日から翌週の月曜日までの間、休業をした。この場合、使用者は当該4日の期間中の休業手当として少なくとも24,000円を支払う必要がある。",a:false,exp:"設問の4日の期間中、所定休日である2日間（土曜日及び日曜日）は休業手当の支払義務が生じないので、設問の場合、休業手当として少なくとも12,000円（金曜日と月曜日の2日分）を支払う必要がある。",src:"法26条、昭和24.3.22基収4077号",cat:"択一式（労働基準法）"},
{no:"問3",opt:"イ",q:"【条件：1日の所定労働時間8時間、1週間の所定労働日は月曜日から金曜日、1週間の所定休日は土曜日及び日曜日、平均賃金10,000円、年次有給休暇中の賃金は就業規則において休暇1日につき平均賃金に相当する額と規定している。】労働基準法第26条に規定する「使用者の責に帰すべき事由」により、労働者が木曜日の午後の時間帯、休業をした。この場合、使用者が木曜日の午前の労働の対価として6,000円の賃金を支払うこととなるときは、その日について、別途休業手当を支払う必要はない。",a:true,exp:"設問の通り正しい。1日の所定労働時間の一部のみ使用者の責に帰すべき事由による休業がなされた場合にも、その日について平均賃金の100分の60に相当する金額を支払わなければならないので、現実に就労した時間に対して支払われる賃金が平均賃金の100分の60に相当する金額に満たない場合には、その差額を支払わなければならないが、設問の場合、午前（現実に就労した時間）の労働に対して平均賃金の100分の60に相当する金額（6,000円）が支払われているため、別途休業手当を支払う必要はない。",src:"法26条、昭和27.8.7基収3445号",cat:"択一式（労働基準法）"},
{no:"問3",opt:"ウ",q:"【条件：1日の所定労働時間8時間、1週間の所定労働日は月曜日から金曜日、1週間の所定休日は土曜日及び日曜日、平均賃金10,000円、年次有給休暇中の賃金は就業規則において休暇1日につき平均賃金に相当する額と規定している。】労働者が業務上負傷し、療養のため労働することができないため木曜日から土曜日までの間、休業をした。この場合、使用者は当該3日の期間中の休業補償として少なくとも18,000円を支払う必要がある。なお、当該労働者は、労災保険法の適用を受ける労働者である。",a:true,exp:"設問の通り正しい。休業手当と異なり、所定休日についても休業補償を支払う必要がある（所定休日であっても、労災保険法の休業補償給付に係る待期期間となることも併せて確認しておこう。）。",src:"法76条1項",cat:"択一式（労働基準法）"},
{no:"問3",opt:"エ",q:"【条件：1日の所定労働時間8時間、1週間の所定労働日は月曜日から金曜日、1週間の所定休日は土曜日及び日曜日、平均賃金10,000円、年次有給休暇中の賃金は就業規則において休暇1日につき平均賃金に相当する額と規定している。】労働者が業務上負傷し、療養のため労働することができないため水曜日の午後の時間帯、休業をした。この場合、使用者が水曜日の午前の労働の対価として6,000円の賃金を支払うこととなるときは、その日について、別途休業補償として2,400円を支払う必要がある。なお、当該労働者は、労災保険法の適用を受ける労働者である。",a:true,exp:"設問の通り正しい。労働者が業務上負傷又は疾病にかかったため、所定労働時間の一部分のみ労働した場合においては、使用者は、平均賃金と当該労働に対して支払われる賃金との差額の100分の60の額を休業補償として支払わなければならない。したがって、設問の場合、平均賃金（10,000円）と一部労働に対して支払われる賃金（6,000円）との差額（4,000円）の100分の60の額（2,400円）を休業補償として支払う必要がある。休業手当の一部労働日（一部休業日）の取扱いと異なること、及び労災保険法の休業補償給付の一部労働日（一部休業日）の取扱いと基本的に同じであることを押さえておきたい。",src:"法76条1項、則38条",cat:"択一式（労働基準法）"},
{no:"問3",opt:"オ",q:"【条件：1日の所定労働時間8時間、1週間の所定労働日は月曜日から金曜日、1週間の所定休日は土曜日及び日曜日、平均賃金10,000円、年次有給休暇中の賃金は就業規則において休暇1日につき平均賃金に相当する額と規定している。】労働者が育児介護休業法の規定に基づき月曜日から金曜日までの間、その申出により育児休業を取得したが、その申出をした後に、当該労働者は年次有給休暇を3労働日残していたことから、育児休業期間中の水曜日から金曜日の3日間について年次有給休暇の請求をした。この場合、使用者は当該休業の3日間について年次有給休暇中の賃金として30,000円を支払う必要がある。",a:false,exp:"年次有給休暇は、労働義務のある日についてのみ請求できるものであり、育児休業申出後には、育児休業期間中の日について年次有給休暇を請求する余地はない。したがって、設問の場合、年次有給休暇の請求は認められず、休業の3日間について年次有給休暇中の賃金を支払う必要はない（当該3日間はあくまで育児休業期間であり、年次有給休暇とはならない。）。なお、育児休業申出前に育児休業期間中の日について時季指定や計画的付与が行われた場合には、当該日には年次有給休暇を取得したものと解され、当該日に係る年次有給休暇中の賃金を支払う必要がある。",src:"法39条、平成3.12.20基発712号",cat:"択一式（労働基準法）"},
{no:"問4",opt:"A",q:"坑内労働については、労働者が坑口に入った時刻から坑口を出た時刻までの時間を、休憩時間を除き労働時間とみなすこととされている。",a:false,exp:"「休憩時間を除き」とする部分が誤りである。坑内労働については、労働者が坑口に入った時刻から坑口を出た時刻までの時間を、休憩時間を含め労働時間とみなすこととされている。なお、この場合においては、休憩の一斉付与及び休憩の自由利用に関する規定は適用されない。",src:"法38条2項",cat:"択一式（労働基準法）"},
{no:"問4",opt:"B",q:"休憩時間は、一斉に与えなければならないとされており、派遣中の労働者については、派遣先の使用者が、当該事業場の自己の労働者と派遣中の労働者とを含めて全体に対して一斉に休憩時間を与える義務を負うこととなる。",a:true,exp:"設問の通り正しい。なお、派遣先の事業場において労使協定を締結した場合及び派遣先の事業について休憩時間の一斉付与の原則が適用除外とされている業種〔①坑内労働、②運輸交通業、③商業、④金融広告業、⑤映画演劇業、⑥通信業、⑦保健衛生業、⑧接客娯楽業、⑨官公署の事業〕の場合は、休憩時間を一斉に付与することを要しない。",src:"法34条2項、派遣法44条2項、平成11.3.31基発168号",cat:"択一式（労働基準法）"},
{no:"問4",opt:"C",q:"4週間を通じ4日以上の休日を与える使用者については、毎週少なくとも1回の休日を与えることを要しないが、この場合には、どの4週間を区切っても4日以上の休日が与えられていなければならない。",a:false,exp:"4週間を通じ4日以上の休日を与えることとした場合、その4週間の起算日を明らかにする必要があり、その起算日からの4週間ごとに4日以上の休日を与えればよい。設問のように「どの4週間を区切っても4日以上の休日が与えられていなければならない」わけではない。",src:"法35条、昭和23.9.20基発1384号",cat:"択一式（労働基準法）"},
{no:"問4",opt:"D",q:"派遣中の労働者を、派遣先の事業場において1年単位の変形労働時間制で労働させる場合、派遣先の使用者は、当該事業場の自己の労働者と派遣中の労働者とを含めて労使協定を締結する必要がある。",a:false,exp:"派遣中の労働者を、派遣先の事業場において1年単位の変形労働時間制で労働させる場合、派遣元事業の使用者が、労使協定を締結する必要がある。なお、派遣中の労働者に係る1か月単位の変形労働時間制・フレックスタイム制に関する労使協定についても、派遣元事業の使用者が締結しなければならない。",src:"法32条の4、1項、派遣法44条2項、平成9.3.25基発195号",cat:"択一式（労働基準法）"},
{no:"問4",opt:"E",q:"労働基準法第36条第1項の時間外及び休日の労働に関する労使協定（以下「三六協定」という。）を締結する場合、対象期間における1日、1か月及び1年のそれぞれの期間について労働時間を延長して労働させることができる時間又は労働させることができる休日の日数を定める必要があり、フレックスタイム制において三六協定を締結する場合であっても、1日、1か月及び1年の全ての期間について定める必要がある。",a:false,exp:"フレックスタイム制において三六協定を締結する場合、1日について延長することができる時間を協定する必要はなく、1か月及び1年について協定すれば足りることとされている。その他の記述は正しい。",src:"法32条の3、36条1項、平成30.12.28基発1228第15号",cat:"択一式（労働基準法）"},
{no:"問5",opt:"ア",q:"労働基準法第12条第3項において、その期間の日数及びその期間中の賃金を平均賃金算定の基礎となる期間及び賃金の総額から控除することとされているのは、「業務上負傷し、又は疾病にかかり療養のために休業した期間」「産前産後の女性が同法第65条の規定によって休業した期間」「使用者の責めに帰すべき事由によって休業した期間」「育児介護休業法の規定により育児休業又は介護休業をした期間」「試みの使用期間」である。",a:true,exp:"設問の通り正しい。なお、試みの使用期間中に平均賃金を算定すべき事由が生じた場合には、試みの使用期間中の日数及び賃金により平均賃金を算定することとされている。",src:"法12条3項",cat:"択一式（労働基準法）"},
{no:"問5",opt:"イ",q:"労働基準法第21条において、同法第20条の解雇の予告を適用しないこととされているのは、「日日雇い入れられる者」「1か月以内の期間を定めて使用される者」「季節的業務に4か月以内の期間を定めて使用される者」「試の使用期間中の者」である。",a:false,exp:"設問の「1か月以内の期間を定めて使用される者」を「2か月以内の期間を定めて使用される者」と読み替えると、正しい記述となる。",src:"法21条",cat:"択一式（労働基準法）"},
{no:"問5",opt:"ウ",q:"労働基準法第37条第5項及び同法施行規則第21条において、割増賃金の基礎となる賃金に算入しないこととされているのは、「家族手当」「通勤手当」「別居手当」「子女教育手当」「住宅手当」「臨時に支払われた賃金」「1か月を超える期間ごとに支払われる賃金」である。",a:true,exp:"設問の通り正しい。",src:"法37条5項、則21条",cat:"択一式（労働基準法）"},
{no:"問5",opt:"エ",q:"労働基準法第39条第10項において、年次有給休暇に係る同条第1項及び第2項の規定の適用について出勤したものとみなすこととされているのは、「業務上負傷し、又は疾病にかかり療養のために休業した期間」「産前産後の女性が同法第65条の規定によって休業した期間」「使用者の責めに帰すべき事由によって休業した期間」「育児介護休業法の規定により育児休業又は介護休業をした期間」である。",a:false,exp:"「使用者の責めに帰すべき事由によって休業した期間」は、出勤したものとみなすこととはされていない。その他の記述は正しい。なお、年次有給休暇を取得した日については、出勤したものとして取り扱うこととされている（通達による取扱い）。",src:"法39条10項",cat:"択一式（労働基準法）"},
{no:"問5",opt:"オ",q:"労働基準法第114条において、裁判所が付加金の支払を命ずることができることとされているのは、「同法第20条（解雇の予告）」「同法第24条（賃金の支払）」「同法第26条（休業手当）」又は「同法第37条（時間外、休日及び深夜の割増賃金）」の規定に違反した使用者である。",a:false,exp:"「法24条（賃金の支払）」に違反した場合は、付加金の対象とされていない。また、「法39条9項（年次有給休暇中の賃金）」の規定による賃金を支払わなかった使用者については、付加金の対象となる。",src:"法114条",cat:"択一式（労働基準法）"},
{no:"問6",opt:"A",q:"旅館、料理店、飲食店、接客業又は娯楽場の事業（接客娯楽業）については、休憩を一斉に与える必要はないものとされているが、当該事業に使用される満18歳に満たない者に対しては、休憩を一斉に与えなければならない。",a:true,exp:"設問の通り正しい。変形労働時間制（法32条の2〜法32条の5）、三六協定による時間外・休日労働（法36条）、労働時間及び休憩の特例（法40条）、高度プロフェッショナル制度（法41条の2）の規定は、満18歳に満たない者については、適用されない。",src:"法40条、60条1項、則31条",cat:"択一式（労働基準法）"},
{no:"問6",opt:"B",q:"交替制によって労働させる事業については、行政官庁の許可を受けて、満18歳に満たない者を午後10時30分まで労働させることができるが、この場合には、深夜（午後10時から午後10時30分）の労働について、割増賃金を支払う必要がある。",a:true,exp:"設問の通り正しい。なお、満15歳以上で満18歳に満たない者については、満18歳に達するまでの間（満15歳に達した日以後の最初の3月31日までの間を除く。）、次の①又は②に定めるところにより、労働させることができるが、①又は②により1日について8時間を超えて労働させた場合であっても、時間外労働に関する割増賃金の支払は必要ない。① 1週間の労働時間が40時間を超えない範囲内において、1週間のうち1日の労働時間を4時間以内に短縮する場合において、他の日の労働時間を10時間まで延長すること。② 1週間について48時間、1日について8時間を超えない範囲内において、1か月単位の変形労働時間制又は1年単位の変形労働時間制の規定の例により労働させること。",src:"法37条4項、61条1項",cat:"択一式（労働基準法）"},
{no:"問6",opt:"C",q:"満18歳に満たない者が解雇の日から14日以内に帰郷する場合においては、使用者は、必要な旅費を負担しなければならないが、満18歳に満たない者がその責めに帰すべき事由に基づいて解雇され、使用者がその事由について所轄労働基準監督署長の認定を受けたときは、この限りでない。",a:true,exp:"設問の通り正しい。なお、満18歳に満たない者の責めに帰すべき事由について、法20条1項ただし書の認定（解雇予告除外認定）を受けた場合においては、設問の認定（帰郷旅費支給除外認定）を受けたものとされるので、改めて設問の認定を受ける必要はない。",src:"法64条、年少則10条1項",cat:"択一式（労働基準法）"},
{no:"問6",opt:"D",q:"使用者は、妊産婦が請求した場合においては、他の軽易な業務に転換させなければならない。",a:false,exp:"設問の「妊産婦」を「妊娠中の女性」と読み替えると、正しい記述となる。なお、妊娠中の女性が請求した場合であっても、他の軽易な業務がない場合には、新たに軽易な業務を創設してまで与える義務はない。",src:"法65条3項",cat:"択一式（労働基準法）"},
{no:"問6",opt:"E",q:"生後満1年に達しない生児を育てる女性は、労働基準法第34条の休憩時間のほか、1日2回各々少なくとも30分、その生児を育てるための時間を請求することができるとされているが、1日の労働時間が4時間以内である場合には、1日1回の育児時間を付与すれば足りる。",a:true,exp:"設問の通り正しい。なお、設問の育児時間は、休憩時間と異なり、労働時間の途中に与えなければならないものではない（女性労働者が勤務時間の始め又は終わりに育児時間の請求をすることも認められる。）。",src:"法67条1項、昭和36.1.9基収8996号",cat:"択一式（労働基準法）"},
{no:"問7",opt:"A",q:"同一事業場において一部の労働者についてのみ適用される別個の就業規則を作成する場合には、当該一部の労働者の過半数で組織する労働組合がある場合においてはその労働組合、当該労働組合がない場合においては当該一部の労働者の過半数を代表する者の意見を聴けばよく、当該事業場の全労働者の過半数で組織する労働組合が別にある場合であっても、当該労働組合の意見を聴くことを要しない。",a:false,exp:"別個の就業規則を定めた場合、2以上の就業規則を合したものが労働基準法上の就業規則となる。したがって、一部の労働者に適用される別個の就業規則も当該事業場の就業規則の一部分であるから、その作成に当たり、当該事業場の全労働者の過半数で組織する労働組合がある場合には、当該労働組合（当該労働組合がない場合には、全労働者の過半数を代表する者）の意見を聴かなければならない。",src:"法90条1項、昭和63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"問7",opt:"B",q:"就業規則には、始業及び終業の時刻を定めなければならないが、労働基準法第41条第3号に規定する監視又は断続的労働に従事する者で、使用者が行政官庁の許可を受けたものについては、労働時間に関する規定は適用されないので、始業及び終業の時刻を定めなくともよい。",a:false,exp:"監視又は断続的労働に従事する者で、使用者が行政官庁の許可を受けたもの等の法41条該当者（労働時間等に関する規定の適用除外者）についても、就業規則には始業及び終業の時刻を定めなければならない。",src:"法41条3号、89条1号、昭和23.12.25基収4281号",cat:"択一式（労働基準法）"},
{no:"問7",opt:"C",q:"就業規則に定める降給の制裁については、例えば、その降給が従来と同一の業務に従事せしめながら賃金額だけを下げるものであっても、労働基準法第91条に規定する減給の制裁には当たらない。",a:false,exp:"設問のように、降給が従前の職務に従事せしめつつ、賃金額のみを減ずる趣旨のものであるときは、法91条の減給の制裁となる。なお、①就業規則に懲戒処分を受けた場合には昇給せしめないという欠格条件を定めること、②就業規則に賃金支払の方法の変更を定めること（例えば、月給者を日給者に格下げする旨の規定を設け、現実に労働した日数が1か月に25日未満の場合に賃金額が減少するような規定を設けること）は、法91条の減給の制裁に該当しない。",src:"法91条、昭和37.9.6基発917号",cat:"択一式（労働基準法）"},
{no:"問7",opt:"D",q:"就業規則に減給の制裁として賞与から減額することを定める場合、その減給は、1回の額が平均賃金の1日分の半額を超えてはならない。",a:true,exp:"設問の通り正しい。減給の制裁として賞与から減額する場合も、1回の額については平均賃金の1日分の半額を超え、また、総額については一賃金支払期における賃金、すなわち賞与額の10分の1を超えてはならない。",src:"法91条、昭和63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"問7",opt:"E",q:"就業規則は、法令又は当該事業場について適用される労働協約に反してはならず、行政官庁は、法令又は労働協約に抵触する就業規則を変更することができる。",a:false,exp:"設問の場合、行政官庁（所轄労働基準監督署長）は、「法令又は労働協約に牴触する就業規則を変更することができる」のではなく、「法令又は労働協約に牴触する就業規則の変更を命ずることができる」とされている。",src:"法92条",cat:"択一式（労働基準法）"},
{no:"問8",opt:"A",q:"事業者は、常時300人の労働者を使用する製造業の事業場においては、総括安全衛生管理者、安全管理者及び2人以上の衛生管理者を選任しなければならない。また、労働基準監督署長は、労働災害を防止するため必要があると認めるときは、事業者に対し、総括安全衛生管理者、安全管理者又は衛生管理者の増員又は解任を命ずることができる。",a:false,exp:"設問の後段が誤りである。労働基準監督署長は、労働災害を防止するため必要があると認めるときは、事業者に対し、安全管理者又は衛生管理者の増員又は解任を命ずることができるが、総括安全衛生管理者の増員又は解任を命ずることができるとはされていない。",src:"法10条1項、11条、12条、令2条2号、3条、4条、則7条1項4号",cat:"択一式（安全衛生法）"},
{no:"問8",opt:"B",q:"衛生管理者は、事業場に専属の者を選任することとされているが、2人以上の衛生管理者を選任する場合において、当該衛生管理者の中に労働衛生コンサルタントがいるときは、労働衛生コンサルタント以外の衛生管理者については、専属の者であることを要しない。",a:false,exp:"2人以上の衛生管理者を選任する場合において、当該衛生管理者の中に労働衛生コンサルタントがいるときに、専属の者であることを要しないのは、「労働衛生コンサルタント以外の衛生管理者」ではなく、「労働衛生コンサルタントのうち1人」である。",src:"法12条1項、則7条1項2号",cat:"択一式（安全衛生法）"},
{no:"問8",opt:"C",q:"事業者は、常時50人以上の労働者を使用する事業場ごとに、産業医を選任しなければならない。この場合、医師であって、労働者の健康管理等を行うのに必要な医学に関する知識について厚生労働省令で定める要件を備えた者であれば、当該事業場においてその事業の実施を統括管理する者を産業医として選任することができる。",a:false,exp:"「事業場においてその事業の実施を統括管理する者」を産業医として選任することはできない。その他の記述は正しい。労働者の健康管理は一定の費用を伴うものであるため、事業者（事業経営の利益の帰属主体）を代表する者や事業場においてその事業の実施を統括管理する者が産業医を兼職した場合、労働者の健康管理よりも事業経営上の利益を優先する観点から、産業医としての職務が適切に遂行されないおそれが考えられる。そのため、産業医は、次に掲げる者（①及び②にあっては、事業場の運営について利害関係を有しない者を除く。）以外の者のうちから選任することとされている。① 事業者が法人の場合にあっては、当該法人の代表者　② 事業者が法人でない場合にあっては、事業を営む個人　③ 事業場においてその事業の実施を統括管理する者",src:"法13条1項、2項、則13条1項2号",cat:"択一式（安全衛生法）"},
{no:"問8",opt:"D",q:"事業者は、安全委員会の委員の半数については、当該事業場に労働者の過半数で組織する労働組合があるときにおいてはその労働組合、労働者の過半数で組織する労働組合がないときにおいては労働者の過半数を代表する者の推薦に基づき指名しなければならない。",a:false,exp:"安全委員会の委員は、次の①〜③の者をもって構成することとされており、事業者は、安全委員会の「①の委員以外の委員の半数」については、当該事業場に労働者の過半数で組織する労働組合があるときにおいてはその労働組合、労働者の過半数で組織する労働組合がないときにおいては労働者の過半数を代表する者の推薦に基づき指名しなければならない。なお、①の委員は1人とし、安全委員会の議長は①の委員がなるものとされている。① 総括安全衛生管理者又は総括安全衛生管理者以外の者で当該事業場においてその事業の実施を統括管理するもの若しくはこれに準ずる者のうちから事業者が指名した者　② 安全管理者のうちから事業者が指名した者　③ 当該事業場の労働者で、安全に関し経験を有するもののうちから事業者が指名した者",src:"法17条4項",cat:"択一式（安全衛生法）"},
{no:"問8",opt:"E",q:"事業者は、高圧室内作業その他の労働災害を防止するための管理を必要とする作業で、政令で定めるものについては、都道府県労働局長の免許を受けた者又は都道府県労働局長の登録を受けた者が行う技能講習を修了した者のうちから、作業主任者を選任しなければならない。また、作業主任者を選任したときは、事業者は、当該作業主任者の氏名及びその者に行わせる事項を作業場の見やすい箇所に掲示する等により関係労働者に周知させなければならない。",a:true,exp:"設問の通り正しい。なお、作業主任者は、当該作業の区分に応じて、選任することとされている。また、一の作業を同一の場所で行う場合において、当該作業に係る作業主任者を2人以上選任したときは、それぞれの作業主任者の職務の分担を定めなければならない。",src:"法14条、則18条",cat:"択一式（安全衛生法）"},
{no:"問9",opt:"A",q:"つり上げ荷重が3トンのクレーンを製造した者は、登録設計審査等機関の検査を受けなければならない。",a:false,exp:"つり上げ荷重が3トンのクレーンは特定機械等に該当するが、設問の登録設計審査等機関の検査（製造時等検査）は、特定機械等のうち「ボイラー、第1種圧力容器、移動式クレーン、ゴンドラ」を対象としており、クレーンはその対象とならない。",src:"法38条1項、法別表1、令12条1項3号",cat:"択一式（安全衛生法）"},
{no:"問9",opt:"B",q:"使用を休止したつり上げ荷重が3トンのクレーンを再び使用しようとするときは、登録性能検査機関が行う性能検査を受けなければならない。",a:false,exp:"使用を休止したつり上げ荷重が3トンのクレーンを再び使用しようとするときは、労働基準監督署長が行う検査（使用再開検査）を受けなければならない。",src:"法38条3項、法別表1、令12条1項3号",cat:"択一式（安全衛生法）"},
{no:"問9",opt:"C",q:"つり上げ荷重が3トンのクレーンの厚生労働省令で定める部分に変更を加えた者は、労働基準監督署長の検査を受けなければならないとされており、労働基準監督署長は当該変更に係る検査に合格した特定機械等について、検査証を再交付する。",a:false,exp:"設問の変更に係る検査（変更検査）に合格した特定機械等については、労働基準監督署長は「検査証を再交付する」のではなく、「検査証に裏書を行う」こととされている。",src:"法38条3項、39条3項、法別表1、令12条1項3号",cat:"択一式（安全衛生法）"},
{no:"問9",opt:"D",q:"事業者は、つり上げ荷重が3トンのクレーンについては、当該事業者（事業者が法人である場合には、その代表者又は役員）で厚生労働省令で定める資格を有するものが自ら実施し、又はその使用する労働者で当該厚生労働省令で定める資格を有するもの若しくは検査業者に、特定自主検査を実施させなければならない。",a:false,exp:"つり上げ荷重が3トンのクレーンは特定機械等に該当するが、特定機械等については、定期自主検査を行う必要はあるものの、特定自主検査の対象とされていない。",src:"法45条2項、法別表1、令12条1項3号、15条2項",cat:"択一式（安全衛生法）"},
{no:"問9",opt:"E",q:"事業者は、つり上げ荷重が3トンのクレーンの運転の業務に労働者を就かせるときは、当該業務に関する安全又は衛生のための特別の教育を行わなければならない。",a:true,exp:"設問の通り正しい。つり上げ荷重が5トン未満のクレーンの運転の業務に就かせるときは、安全又は衛生のための特別の教育（特別教育）を行う必要がある。なお、つり上げ荷重が5トン以上のクレーン（跨線テルハを除く。）の運転の業務は、法61条の就業制限業務とされており、クレーン・デリック運転士免許を受けた者（床上で運転し、かつ、当該運転をする者が荷の移動とともに移動する方式のクレーンの運転の業務にあっては、クレーン・デリック運転士免許を受けた者又は床上操作式クレーン運転技能講習を修了した者）でなければ、当該業務に就かせてはならない。",src:"法59条3項、則36条15号イ",cat:"択一式（安全衛生法）"},
{no:"問10",opt:"A",q:"事業者は、事業に附属する食堂又は炊事場における給食の業務に従事する労働者に対し、その雇入れの際、当該業務への配置替えの際及び当該業務についた後6月以内ごとに1回、定期に、検便による健康診断を行わなければならない。",a:false,exp:"設問の給食従業員の検便による健康診断については、雇入れの際又は当該業務への配置替えの際に行えば足り、当該業務についた後6月以内ごとに1回、定期に行う必要はない。",src:"法66条1項、則47条",cat:"択一式（安全衛生法）"},
{no:"問10",opt:"B",q:"事業者は、労働者を本邦外の地域に6月以上派遣しようとするときは、あらかじめ、当該労働者に対し、定期健康診断の項目及び厚生労働大臣が定める項目のうち医師が必要であると認める項目について、医師による健康診断を行わなければならない。",a:true,exp:"設問の通り正しい。なお、設問の海外派遣前の健康診断は、雇入れ時の健康診断（医師による健康診断を受けた後、3月を経過しない者を雇い入れる場合において、当該健康診断の結果を証明する書面を提出した者を含む。）、定期健康診断、特定業務従事者の健康診断又は有害業務従事中の特殊健康診断を受けた者については、当該健康診断の実施の日から6月間に限り、その者が受けた当該健康診断の項目に相当する項目を省略して行うことができる。",src:"法66条1項、則45条の2、1項",cat:"択一式（安全衛生法）"},
{no:"問10",opt:"C",q:"事業者は、本邦外の地域に6月以上派遣した労働者を本邦の地域内における業務に就かせるとき（一時的に就かせるときを除く。）は、当該労働者に対し、定期健康診断の項目及び厚生労働大臣が定める項目のうち医師が必要であると認める項目について、医師による健康診断を行わなければならない。",a:true,exp:"設問の通り正しい。なお、海外派遣後の健康診断については、B肢解説にあるような一定の健康診断を受けたことによる健康診断の項目の省略は認められていない。",src:"法66条1項、則45条の2、2項",cat:"択一式（安全衛生法）"},
{no:"問10",opt:"D",q:"事業者は、塩酸、硝酸、硫酸、亜硫酸、弗化水素、黄りんその他歯又はその支持組織に有害な物のガス、蒸気又は粉じんを発散する場所における業務に常時従事する労働者に対し、その雇入れの際、当該業務への配置替えの際及び当該業務についた後6月以内ごとに1回、定期に、歯科医師による健康診断を行わなければならない。",a:true,exp:"設問の通り正しい。",src:"法66条3項、令22条3項、則48条",cat:"択一式（安全衛生法）"},
{no:"問10",opt:"E",q:"深夜業に従事する労働者であって、常時使用され、自ら受けた健康診断を受けた日前6月間を平均して1月当たり4回以上深夜業に従事したものは、当該自ら受けた健康診断の結果を証明する書面を事業者に提出することができる。",a:true,exp:"設問の通り正しい。なお、設問の自ら受けた医師による健康診断の結果を証明する書面については、当該健康診断を受けた日から3月を経過したときは、その提出をすることができないものとされている。",src:"法66条の2、則50条の2",cat:"択一式（安全衛生法）"},
{no:"第2-問1",opt:"A",q:"労働基準法第1条第2項では、この法律で定める労働条件の基準は最低のものであるから、労働関係の当事者は、この基準を理由として労働条件を低下させてはならないと定めており、これに違反して労働基準法で定める労働条件の基準を理由として労働条件を低下させた場合には、その低下させた労働条件が同法の基準を下回るものでないとしても、当該労働条件を低下させる行為は無効とされる。",a:false,exp:"労働基準法で定める労働条件の基準を理由として労働条件を低下させた場合には、法1条2項違反となるが、同条違反には罰則の定めはなく、また、法1条は全体として訓示規定と解すべきであるから、低下させた労働条件が同法の基準を下回るものでない限り、その低下行為が無効となるものではないとされている。",src:"法1条2項",cat:"択一式（労働基準法）"},
{no:"第2-問1",opt:"B",q:"使用者が就業規則に労働者が女性であることを理由として、賃金について男性と差別的取扱いをする趣旨の規定を設けた場合には、現実には男女差別待遇の事実がないとしても、当該使用者には労働基準法第4条違反の罰則が適用されることとなる。",a:false,exp:"法4条は、「使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取扱いをしてはならない。」と差別的取扱いをすることを禁止しており、就業規則に法4条違反の規定があるが現実に行われておらず、賃金の男女差別待遇の事実がなければ、その規定は無効ではあるが、法4条違反の罰則の適用はない。",src:"法4条、平成9.9.25基発648号",cat:"択一式（労働基準法）"},
{no:"第2-問1",opt:"C",q:"労働基準法第5条では、使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して労働を強制してはならないと定めているが、暴行があっても、労働の強制の目的がなく、単に「怠けたから」又は「態度が悪いから」殴ったというだけでは、刑法の暴行罪に該当するとしても、労働基準法第5条違反とはならない。",a:true,exp:"設問の通り正しい。「労働の強制」の目的がない場合には、法5条違反とはならない。法5条において禁止されているのは、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって労働者の意思に反して労働を強制することである。つまり、法5条違反となるのは、「暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段」が「労働の強制」の目的と結びついており、かつ、「暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段」によって「労働の強制」に至らしめたものでなければならない。",src:"法5条",cat:"択一式（労働基準法）"},
{no:"第2-問1",opt:"D",q:"使用者が、労働者の債務不履行について損害賠償額を一定の金額として労働契約に定めた場合であっても、現実には債務不履行について損害賠償額として定められた一定の金額を徴収していないときは、当該使用者には労働基準法第16条違反の罰則は適用されないこととなる。",a:false,exp:"法16条は、「使用者は、労働契約の不履行について違約金を定め、又は損害賠償額を予定する契約をしてはならない。」と違約金を定めること、又は損害賠償額を予定する契約を締結することを禁止しており、損害賠償額を一定の金額として労働契約に定めた場合には、現実には債務不履行について損害賠償額として定められた一定の金額を徴収していないときであっても、法16条違反の罰則が適用される。",src:"法16条",cat:"択一式（労働基準法）"},
{no:"第2-問1",opt:"E",q:"労働基準法第17条にいう「前借金」とは、労働契約の締結の際又はその後に、労働することを条件として使用者から借り入れ、将来の賃金により弁済することを約する金銭をいい、使用者が前借金制度を設け、労働者に金銭を貸し付けた場合には、同条違反の罰則が適用されることとなる。",a:false,exp:"法17条は、「使用者は、前借金その他労働することを条件とする前貸の債権と賃金を相殺してはならない。」と賃金と前借金を相殺することを禁止しており、前借金そのものを禁止したものではなく、設問のように前借金制度を設け、労働者に金銭を貸し付けただけでは、法17条違反とならない。なお、前借金制度により、返済完了までは労働すべきことを義務付け、又は労働者が退職を申し出た場合に未返済の前借金を即座に返還しなければこれを承認しないと脅かし、労働を強制することは、法5条（強制労働の禁止）違反となると解されている。",src:"法17条",cat:"択一式（労働基準法）"},
{no:"第2-問2",opt:"A",q:"使用者は、労働契約に附随して貯蓄の契約をさせ、又は貯蓄金を管理する契約をしようとする場合においては、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定をし、これを行政官庁に届け出なければならない。",a:false,exp:"使用者は、労働契約に附随して貯蓄の契約をさせ、又は貯蓄金を管理する契約をしてはならないとされており、設問の強制貯金は労使協定の有無に関係なく、全面的に禁止されている。なお、使用者は、労働者の貯蓄金をその委託を受けて管理しようとする場合においては、当該事業場に、労働者の過半数で組織する労働組合があるときはその労働組合、労働者の過半数で組織する労働組合がないときは労働者の過半数を代表する者との書面による協定をし、これを行政官庁（所轄労働基準監督署長）に届け出なければならないとされており、任意貯蓄については、労使協定の締結及び届出を要件として、認められている。",src:"法18条1項",cat:"択一式（労働基準法）"},
{no:"第2-問2",opt:"B",q:"平均賃金の算定に当たり、3か月を超える期間ごとに支払われる賃金は、その基礎となる賃金の総額に算入しないこととされているが、賃金として6か月定期乗車券を支給している場合、これは各月分の賃金の前払として認められるので、平均賃金の算定の基礎に加えなければならない。",a:true,exp:"設問の通り正しい。なお、3か月を超える期間ごとに支給される賞与であっても、年俸制で毎月払い部分と賞与部分を合計してあらかじめ年俸額が確定している場合の賞与部分は、その賞与部分を含めた年俸額の12分の1を1か月分の賃金として、平均賃金を算定する。",src:"法12条4項、昭和33.2.13基発90号",cat:"択一式（労働基準法）"},
{no:"第2-問2",opt:"C",q:"労働者の収入によって生計を維持する者がやむを得ない事由により1週間以上にわたって帰郷する場合、その費用に充てるために労働者が請求をしたときは、使用者は、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。",a:true,exp:"設問の通り正しい。なお、設問の非常時払の請求があった場合に使用者がこれに応じなければならない賃金は、既往の労働に対する賃金であり、いまだ労務の提供がない期間に対する賃金を支払う義務はない。また、労働者の請求が既往の労働に対する賃金の一部である場合には、請求のあった金額を支払えば足りる。",src:"法25条、則9条3号",cat:"択一式（労働基準法）"},
{no:"第2-問2",opt:"D",q:"出来高払制で使用する労働者が、使用者の責に帰さない事由によって休業をした場合、労働基準法第26条の休業手当を支払う必要はなく、また、同法第27条の出来高払制の保障給を支払う必要もない。",a:true,exp:"設問の通り正しい。休業手当は、「使用者の責に帰すべき事由による休業」の場合に支払義務が生ずるものであり、設問の場合、その支払をする必要はない。また、出来高払制の保障給は、「出来高払制その他の請負制で使用する労働者については、使用者は、労働時間に応じ一定額の賃金の保障をしなければならない（法27条）。」とされているとおり、労働時間に応じて保障を定めるものであり、労働者が労働しない場合には、出来高払制の保障給を支払う必要はない。なお、保障給の金額については、一定の労働については常に一定していることを要するが、法27条の一定額とは、個々の労働者について、その行う労働が同種のものである限りは常に一定の金額を保障すべきであることをいうと解されるので、同種の労働を行っている労働者が多数ある場合に、個々の労働者の技量、経験、年齢等に応じて、その保障給額に差を設け、また同一の労働者に対しても、別種の労働に従事した場合には、異なる金額の保障給を支給することとすることは差し支えない。",src:"法26条、27条、昭和23.11.11基発1639号",cat:"択一式（労働基準法）"},
{no:"第2-問2",opt:"E",q:"扶養家族のある労働者に対して、扶養家族1人につき○○円の家族手当とともに労働者本人分××円の家族手当を支給し、独身者である労働者に対しては労働者本人分のみの××円の家族手当と同額の手当を支給している場合、扶養家族数に関係なく支払われている労働者本人分の××円の家族手当については、割増賃金の基礎となる賃金に算入する必要がある。",a:true,exp:"設問の通り正しい。割増賃金の基礎に算入しないこととされている家族手当とは、「扶養家族数又はこれを基礎とする家族手当額を基準として算出した手当」をいい、設問の扶養家族のある労働者に対して支給される労働者本人分の××円の家族手当及び独身者である労働者に対して支給される労働者本人分と同額の××円の手当は、割増賃金の基礎に算入しないこととされている家族手当に該当しない（割増賃金の基礎に算入する必要がある。）。なお、設問の扶養家族のある労働者に対して扶養家族1人につき○○円の家族手当として支給されるものは、扶養家族数を基準として算出した手当であるから、割増賃金の基礎に算入する必要はない。",src:"法37条5項、昭和22.11.5基発231号",cat:"択一式（労働基準法）"},
{no:"第2-問3",opt:"ア",q:"使用者は、労働者が業務上負傷し、又は疾病にかかり療養のために休業する期間及びその後30日間は、解雇してはならないが、労働者の責に帰すべき事由に基いて解雇する場合においては、この限りでないとされており、この場合には、その事由について行政官庁の認定を受けなければならない。",a:false,exp:"労働者の責に帰すべき事由がある場合であっても、設問の解雇制限が解除されることはない。解雇制限が解除されるのは、使用者が、法81条の規定によって打切補償を支払う場合又は天災事変その他やむを得ない事由のために事業の継続が不可能となった場合である。なお、天災事変その他やむを得ない事由のために事業の継続が不可能となった場合においては、その事由について行政官庁の認定を受けなければならない。",src:"法19条1項",cat:"択一式（労働基準法）"},
{no:"第2-問3",opt:"イ",q:"使用者は、9月30日の終了をもって労働者を解雇しようとする場合において、14日分の平均賃金を支払ったときは、9月14日までに解雇の予告をする必要がある。なお、当該労働者については、9月には所定休日が4日間あり、また、これとは別に9月21日から9月25日まで育児介護休業法に基づく育児休業を取得している。",a:true,exp:"設問の通り正しい。解雇の予告については、解雇の予告の日と、解雇の効力発生の日との間に中30日間の期間を置く必要があり、また、30日間は労働日ではなく暦日で計算されるので、その間に休日又は休業日があっても延長されない。また、育児介護休業法では、事業主は、労働者が育児休業申出等（育児休業申出及び出生時育児休業申出）をし、又は育児休業をしたこと等を理由として、当該労働者に対して解雇その他不利益な取扱いをしてはならないとしているが、これは休業申出をし、又は育児休業をしたこと等を理由とする解雇を制限したものであり、育児休業期間中の解雇を一般的に制限したものではない。なお、解雇予告手当の支払は、単にその限度で解雇の予告義務を免除するにとどまるものであり、解雇予告手当の支払について使用者と労働者との間に債権債務の関係が発生することはなく、また、解雇予告手当について時効の問題は生じない。",src:"法20条1項、2項",cat:"択一式（労働基準法）"},
{no:"第2-問3",opt:"ウ",q:"使用者が解雇の予告をした場合において、その予告期間満了の直前に労働者が業務上負傷し療養のために休業を要するときは、たとえ休業1日の軽度の負傷であっても労働基準法第19条の解雇制限の適用がある。したがって、当該解雇制限の期間の経過後に解雇をしようとする場合には、改めて解雇の予告をする必要がある。",a:false,exp:"設問の後段（「改めて解雇の予告をする必要がある」とする部分）が誤りである。設問の負傷による休業をしたことによって、前の解雇の予告の効力の発生自体は中止されるだけであり、その休業期間が長期にわたり解雇の予告として効力を失うものと認められる場合を除き、治ゆした日に改めて解雇の予告をする必要はない。",src:"法20条1項、昭和26.6.25基収2609号",cat:"択一式（労働基準法）"},
{no:"第2-問3",opt:"エ",q:"使用者が30日前に解雇の予告をしたが、その期限到来後、解雇期日を延期することを労働者に伝達し、そのまま使用した場合、その後に当該労働者を解雇しようとするときは、改めて解雇の予告をする必要がある。",a:true,exp:"設問の通り正しい。解雇の予告期間満了後引き続き使用する場合には、通常同一条件にてさらに労働契約がなされたものと取り扱われる（参考：民法629条1項「雇用の期間が満了した後労働者が引き続きその労働に従事する場合において、使用者がこれを知りながら異議を述べないときは、従前の雇用と同一の条件で更に雇用をしたものと推定する」）ので、その後に解雇しようとする場合には、改めて解雇の予告をする必要がある。",src:"法20条1項、昭和24.6.18基発1926号",cat:"択一式（労働基準法）"},
{no:"第2-問3",opt:"オ",q:"解雇予告手当の算定に当たり、平均賃金を算定すべき事由が発生した日（算定事由発生日）とは、労働者を解雇しようとする日（解雇日）であり、労働者の同意を得て解雇日を変更した場合においても、当初の解雇日が算定事由発生日となる。",a:false,exp:"解雇予告手当の算定に当たり、平均賃金を算定すべき事由が発生した日（算定事由発生日）とは、労働者に解雇を通告した日であり、労働者の同意を得て解雇日を変更した場合においても、当初の解雇を通告した日が算定事由発生日となる。",src:"法12条1項、20条1項、昭和39.6.12 36基発2316号",cat:"択一式（労働基準法）"},
{no:"第2-問4",opt:"A",q:"1か月単位の変形労働時間制を就業規則により採用しようとする場合には、就業規則において変形期間における各日、各週の労働時間を具体的に定める必要があるが、業務の実態から月ごとに勤務割を作成する必要があるときは、就業規則において各直勤務の始業終業時刻、各直勤務の組合せの考え方、勤務割表の作成手続及びその周知方法等を定めておき、それにしたがって各日ごとの勤務割は、変形期間の開始前までに具体的に特定することで足りる。",a:true,exp:"設問の通り正しい。なお、変形期間を平均し、1週間当たりの労働時間が40時間の範囲内となる場合であっても、使用者が業務の都合によって任意に労働時間を変更するような制度は、1か月単位の変形労働時間制に該当しない。また、就業規則の絶対的必要記載事項として始業及び終業の時刻が規定されていることから、1か月単位の変形労働時間制を定める就業規則には、各日の労働時間の長さだけではなく、始業及び終業の時刻も定める必要がある。",src:"法32条の2、1項、昭和63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"第2-問4",opt:"B",q:"最高裁判所の判例では、1か月単位の変形労働時間制の適用による効果は、使用者が、単位期間内の一部の週又は日において法定労働時間を超える労働時間を定めても、ここで定められた所定労働時間の限度で、法定労働時間を超えたものとの取扱いをしないというにすぎないものであり、単位期間内の実際の労働時間が平均して法定労働時間内に納まっていれば、法定時間外労働にならないというものではない、としている。",a:true,exp:"設問の通り正しい。なお、設問の最高裁判所の判例では、設問文に続けて「すなわち、特定の週又は日につき法定労働時間を超える所定労働時間を定めた場合には、法定労働時間を超えた所定労働時間内の労働は時間外労働とならないが、所定労働時間を超えた労働はやはり時間外労働となるのである。」としている。",src:"法32条の2、1項、平成14.2.28大星ビル管理事件",cat:"択一式（労働基準法）"},
{no:"第2-問4",opt:"C",q:"1年単位の変形労働時間制における対象期間は、1か月を超え1年以内の期間に限るものとされており、また、対象期間が3か月を超える場合に限り、対象期間における1日の労働時間は10時間、1週間の労働時間は52時間が限度とされている。",a:false,exp:"「対象期間が3か月を超える場合に限り」とする記述が誤りである。対象期間の長さ（3か月を超えるかどうか）にかかわらず、対象期間における1日の労働時間は10時間、1週間の労働時間は52時間が限度とされている。なお、その他の記述は正しい。",src:"法32条の4、1項、3項、則12条の4、4項",cat:"択一式（労働基準法）"},
{no:"第2-問4",opt:"D",q:"フレックスタイム制の清算期間が1か月を超える場合には、当該清算期間をその開始の日以後1か月ごとに区分した各期間（最後に1か月未満の期間を生じたときは、当該期間。以下同じ。）ごとに当該各期間を平均し1週間当たりの労働時間が50時間を超えないものとする必要がある。",a:true,exp:"設問の通り正しい。なお、清算期間が1か月を超えるフレックスタイム制を採用する場合、労使協定の届出が必要であり、また、労働時間の特例（1週間44時間）は適用されない〔清算期間が1か月以内のフレックスタイム制を採用する場合、労使協定の届出は必要なく、また、労働時間の特例（1週間44時間）の適用がある。〕。",src:"法32条の3、1項、2項",cat:"択一式（労働基準法）"},
{no:"第2-問4",opt:"E",q:"使用者は、1か月単位の変形労働時間制、1年単位の変形労働時間制又は1週間単位の非定型的変形労働時間制の規定により労働者に労働させる場合には、育児を行う者、老人等の介護を行う者、職業訓練又は教育を受ける者その他特別の配慮を要する者については、これらの者が育児等に必要な時間を確保できるような配慮をしなければならない。",a:true,exp:"設問の通り正しい。なお、フレックスタイム制は、設問文の規定（則12条の6）の対象とされていないことに注意。",src:"則12条の6",cat:"択一式（労働基準法）"},
{no:"第2-問5",opt:"ア",q:"労働者が退職に際しみずから賃金に該当する退職金債権を放棄する旨の意思表示をした場合であっても、当該退職金は就業規則においてその支給条件が予め明確に規定され、会社が当然にその支払義務を負うものというべきであるから、その支払については、労働基準法24条1項本文の定めるいわゆる全額払の原則が適用されるものと解するのが相当であり、その意思表示が当該労働者の自由な意思に基づくものであることが明確であるとしても、当該意思表示は無効である、とするのが最高裁判所の判例である。",a:false,exp:"退職金債権を放棄する旨の意思表示は、それが労働者の自由な意思に基づくものであることが明確であれば、有効であるとするのが、最高裁判所の判例である。設問の最高裁判所の判例では、「全額払の原則の趣旨とするところは、使用者が一方的に賃金を控除することを禁止し、もって労働者に賃金の全額を確実に受領させ、労働者の経済生活をおびやかすことのないようにしてその保護をはかろうとするものというべきであるから、本件のように、労働者たる上告人が退職に際しみずから賃金に該当する本件退職金債権を放棄する旨の意思表示をした場合に、右全額払の原則が右意思表示の効力を否定する趣旨のものであるとまで解することはできない。もっとも、右全額払の原則の趣旨とするところなどに鑑みれば、右意思表示の効力を肯定するには、それが上告人の自由な意思に基づくものであることが明確でなければならないものと解すべきである。」としている。",src:"法24条1項、最二小昭和48.1.19シンガー・ソーイング・メシーン事件",cat:"択一式（労働基準法）"},
{no:"第2-問5",opt:"イ",q:"所定労働時間を3時間とするS事業場の労働者が、新たに所定労働時間を4時間とするT事業場と労働契約を締結し、ある日についてS事業場で5時間労働した後に引き続きT事業場で5時間労働した。この場合、その日の法定労働時間（8時間）を超える2時間分の労働について割増賃金の支払が必要となるときは、原則として、S事業場の使用者及びT事業場の使用者がそれぞれ1時間分の割増賃金を支払う必要がある。",a:true,exp:"設問の通り正しい。設問のように、複数の事業場で労働する場合（兼業・副業の場合）の労働時間の通算については、次のように行うこととされている。① まず、労働契約の締結の先後の順に、所定労働時間を通算する。② 次に、所定外労働時間の発生順に、所定外労働時間を通算する。時間外労働の割増賃金は、上記①・②により、それぞれの事業場での所定労働時間・所定外労働時間を通算した労働時間を把握し、そのうち自ら法定労働時間を超える労働をさせた時間分について支払義務が生じる。設問の場合、上記①により所定労働時間を通算すると、S事業場（3時間）＋T事業場（4時間）＝7時間となる（法定労働時間内）。次に上記②により所定外労働時間を通算すると、S事業場（2時間）の通算の段階で所定労働時間と合わせ9時間となるので、S事業場に1時間分の割増賃金の支払い義務が生じ、T事業場（1時間）の1時間分についても割増賃金の支払い義務が生じる。",src:"法37条、38条1項、令和2.9.1基発0901第3号",cat:"択一式（労働基準法）"},
{no:"第2-問5",opt:"ウ",q:"労働者Xが労働者Yとの間にトラブルを起こしたため、XはYに金銭を贈与することを約したが、金銭の調達ができないため賃金債権をYに譲渡し、使用者にその旨の通知をした。この事案につき、最高裁判所の判例では、労働者が賃金の支払を受ける前に賃金債権を他に譲渡した場合であって、当該労働者が債務者たる使用者に適法な債権譲渡通知を行ったという事情の下においては、使用者はその譲渡額を限度として賃金債権の譲受人に対し直接賃金の支払義務を負う、としている。",a:false,exp:"設問の事案につき、最高裁判所の判例では、労働基準法24条1項が「賃金は直接労働者に支払わなければならない。」旨を定めて、使用者たる賃金支払義務者に対し罰則をもってその履行を強制している趣旨に徴すれば、労働者が賃金の支払を受ける前に賃金債権を他に譲渡した場合においても、その支払についてはなお同条が適用され、使用者は直接労働者に対し賃金を支払わなければならず、したがって、右賃金債権の譲受人は自ら使用者に対してその支払を求めることは許されないものと解するのが相当である、としている。",src:"法24条1項、最三小昭和43.3.12小倉電話局事件",cat:"択一式（労働基準法）"},
{no:"第2-問5",opt:"エ",q:"賃金計算における過誤、違算等を精算ないし調整するため、後に支払わるべき賃金から控除すること、すなわち適正な賃金の額を支払うための手段たる相殺は、労働基準法24条1項但書による賃金の一部控除に係る労使協定がない場合であっても、その行使の時期、方法、金額等からみて労働者の経済生活の安定との関係上不当と認められないものであれば、同項の全額払の原則の禁止するところではないと解するのが相当である、とするのが最高裁判所の判例である。",a:true,exp:"設問の通り正しい。なお、設問の最高裁判所の判例では、設問文に続けて「この見地からすれば、許さるべき相殺は、過払のあった時期と賃金の清算調整の実を失わない程度に合理的に接着した時期においてされ、また、あらかじめ労働者にそのことが予告されるとか、その額が多額にわたらないとか、要は労働者の経済生活の安定をおびやかすおそれのない場合でなければならないものと解せられる。」としている。",src:"法24条1項、最一小昭和44.12.18福島県教組事件",cat:"択一式（労働基準法）"},
{no:"第2-問5",opt:"オ",q:"事業場に、当該事業場の労働者の3分の2で組織するP労働組合と当該事業場の労働者の3分の1で組織するQ労働組合がある場合、使用者がP労働組合との間で労働基準法第36条第1項の時間外及び休日に関する労働に関する労使協定（以下「三六協定」という。）を締結し、これを行政官庁に届け出たとしても、Q労働組合の組合員である労働者については、三六協定の効力は及ばず、当該組合員に対し時間外及び休日労働をさせることはできない。",a:false,exp:"設問のように、労働者の過半数で組織する労働組合がある場合には、三六協定は、当該事業場の労働者の過半数で組織する労働組合と協定すれば足り、他の労働組合と協定する必要はない（三六協定の効力は、他の労働組合の組合員や組合員でない者にも及ぶこととなる。）。",src:"法36条1項、昭和23.4.5基発535号",cat:"択一式（労働基準法）"},
{no:"第2-問6",opt:"A",q:"4月1日に労働条件を「1週間の所定労働日数5日・1週間の所定労働時間40時間」「試用期間3か月」として雇い入れられた労働者が、試用期間満了後の7月1日に労働条件を「1週間の所定労働日数3日・1週間の所定労働時間20時間」に変更した。当該労働者がそのまま6か月継続勤務し、全労働日の8割以上出勤したときは、10月1日に付与される年次有給休暇は、労働基準法第39条第3項の規定により比例付与されることとなる。",a:true,exp:"設問の通り正しい。年次有給休暇の権利が発生するのは、基準日〔継続勤務した期間を6か月経過日から1年ごとに区分した各期間（最後に1年未満の期間を生じたときは、当該期間）の初日をいう。〕であり、比例付与の対象となるか否かは、基準日における所定労働日数・所定労働時間で判断される。設問の場合、基準日である10月1日の労働条件が「1週間の所定労働日数3日・1週間の所定労働時間20時間」であるから、年次有給休暇は比例付与されることとなる。",src:"法39条1項、3項",cat:"択一式（労働基準法）"},
{no:"第2-問6",opt:"B",q:"労働基準法第39条第7項の規定により、使用者は、同条第1項から第3項までの規定による年次有給休暇（これらの規定により使用者が与えなければならない年次有給休暇の日数が10労働日以上である労働者に係るものに限る。）の日数のうち5日については、基準日から1年以内の期間に、労働者ごとにその時季を定めることにより与えなければならず、使用者がその時季を定めた場合であっても、労働者が実際に基準日から1年以内に有給休暇を5日取得していないときは、法違反となる。",a:true,exp:"設問の通り正しい。なお、法39条7項の規定により使用者が指定した時季について、労働者が変更することはできないが、使用者が則24条の6（下記参照）に基づく意見聴取の手続を再度行い、その意見を尊重することによって変更することは可能である。【参考：則24条の6】① 使用者は、法39条7項の規定により労働者に有給休暇を時季を定めることにより与えるに当たっては、あらかじめ、当該有給休暇を与えることを当該労働者に明らかにした上で、その時季について当該労働者の意見を聴かなければならない。② 使用者は、上記①の規定により聴取した意見を尊重するよう努めなければならない。",src:"法39条7項、改正労働基準法に関するQ＆A（平成31年4月）",cat:"択一式（労働基準法）"},
{no:"第2-問6",opt:"C",q:"労働基準法第39条第1項から3項までの規定により10労働日以上の年次有給休暇の権利を有する労働者が、自ら5労働日以上の年次有給休暇を取得した場合には、使用者は同条第7項の規定に基づく年次有給休暇を付与することを要しないが、当該労働者の取得した年次有給休暇が同条第4項の規定によるいわゆる時間単位年休に係る労使協定（以下本問において「時間単位年休協定」という。）に基づく時間単位年休だけである場合には、使用者は、同条第7項の規定に基づき年次有給休暇を付与しなければならない。",a:true,exp:"設問の通り正しい。使用者は、労働者の時季指定等又は計画的付与により1日（半日を含む）単位の年次有給休暇を与えた場合においては、当該与えた年次有給休暇の日数（当該日数が5日を超える場合には、5日とする。）分については、法39条7項に基づき時季を定めることにより与えることを要しないとされているが、労働者の取得した年次有給休暇が時間単位年休である場合には、このような取扱い（その取得した日数分について、「法39条7項に基づき時季を定めることにより与えることを要しない」とする取扱い）はされない。",src:"法39条7項、8項、平成30.12.28基発1228第15号",cat:"択一式（労働基準法）"},
{no:"第2-問6",opt:"D",q:"労働基準法第39条第3項の規定により前年度に7労働日の年次有給休暇が付与されたがその取得をせず、今年度に新たに8労働日の年次有給休暇が付与されたため、前年度の繰越分を含め年次有給休暇の日数が15労働日となる労働者については、使用者は、同条第7項の規定に基づき年次有給休暇を付与する必要はない。",a:true,exp:"設問の通り正しい。法39条7項の使用者による時季指定の対象となる「年次有給休暇の日数が10労働日以上である労働者」は、基準日に付与される年次有給休暇の日数が10労働日以上である労働者を規定したものであり、比例付与の対象となる労働者であって、今年度の基準日に付与される年次有給休暇の日数が10労働日未満であるものについては、仮に前年度繰越分の年次有給休暇も合算すれば10労働日以上であったとしても、法39条7項の規定が適用される「年次有給休暇の日数が10労働日以上である労働者」に含まれない。",src:"法39条7項、平成30.12.28基発1228第15号",cat:"択一式（労働基準法）"},
{no:"第2-問6",opt:"E",q:"使用者が労働基準法第39条第7項の規定に基づく年次有給休暇を付与するに当たり、当該事業場において時間単位年休協定が締結されている場合には、時間単位で同項に基づく年次有給休暇を付与することができる。",a:false,exp:"法39条7項の使用者による時季指定は、時間単位で行うことはできない。なお、時間単位年休は、労働者の自主的判断によって時間単位で取得するものであり、計画的付与として時間単位年休を与えることもできない。",src:"法39条7項、平成30.12.28基発1228第15号",cat:"択一式（労働基準法）"},
{no:"第2-問7",opt:"A",q:"使用者は、労働者の死亡又は退職の場合において、権利者の請求があった場合においては、遅滞なく賃金を支払い、積立金、保証金、貯蓄金その他名称の如何を問わず、労働者の権利に属する金品を返還しなければならない。",a:false,exp:"「遅滞なく」とする記述が誤りである。使用者は、労働者の死亡又は退職の場合において、権利者の請求があった場合においては、「7日以内に」賃金を支払い、積立金、保証金、貯蓄金その他名称の如何を問わず、労働者の権利に属する金品を返還しなければならない。なお、賃金について、所定の賃金支払日が7日目の日よりも前に到来する場合には、その賃金支払日までに支払う必要がある。また、退職手当については、あらかじめ就業規則等で定められた時期に支払えば足りる。",src:"法23条1項",cat:"択一式（労働基準法）"},
{no:"第2-問7",opt:"B",q:"使用者は、各事業場ごとに労働者名簿を、各労働者について調製しなければならないが、日々雇い入れられる労働者については、調製することを要しない。",a:true,exp:"設問の通り正しい。なお、賃金台帳については、日々雇い入れられる労働者についても調製する必要があるが、1か月を超えて引き続き使用される者である場合を除き、賃金計算期間を記入することを要しない。また、使用者は、年次有給休暇管理簿、労働者名簿又は賃金台帳をあわせて調製することができるとされている。",src:"法107条1項",cat:"択一式（労働基準法）"},
{no:"第2-問7",opt:"C",q:"使用者は、寄宿舎規則の起床、就寝、外出及び外泊に関する事項に関する規定の作成については、寄宿舎に寄宿する労働者の過半数を代表する者の意見を聴かなければならない。",a:false,exp:"「意見を聴かなければならない」とする記述が誤りである。使用者は、寄宿舎規則の必要的記載事項である次の①〜⑤の事項のうち、①〜④の事項に関する規定の作成又は変更については、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得なければならない（⑤の事項については、寄宿舎規則に定める必要はあるが、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得る必要はない。）。① 起床、就寝、外出及び外泊に関する事項　② 行事に関する事項　③ 食事に関する事項　④ 安全及び衛生に関する事項　⑤ 建設物及び設備の管理に関する事項",src:"法95条2項",cat:"択一式（労働基準法）"},
{no:"第2-問7",opt:"D",q:"使用者は、労働者名簿、賃金台帳及び雇入れ、解雇、災害補償、賃金その他労働関係に関する重要な書類を2年間保存しなければならない。",a:false,exp:"使用者は、労働者名簿、賃金台帳及び雇入れ、解雇、災害補償、賃金その他労働関係に関する重要な書類を「5年間（当分の間、3年間）」保存しなければならない。なお、この規定に違反した者は、30万円以下の罰金に処せられる。【参考：年次有給休暇管理簿】使用者は、有給休暇を与えたときは、年次有給休暇管理簿を作成し、当該有給休暇を与えた期間中及び当該期間の満了後5年間（当分の間、3年間）保存しなければならないが、この規定の違反については、罰則の定めはない。",src:"法109条、法附則143条1項",cat:"択一式（労働基準法）"},
{no:"第2-問7",opt:"E",q:"労働基準法の規定による賃金（退職手当を含む。）の請求権はこれを行使することができる時から5年間（当分の間、3年間）行わない場合においては、時効によって消滅する。",a:false,exp:"労働基準法の規定による賃金（退職手当を除く。）の請求権はこれを行使することができる時から5年間（当分の間、3年間）行わない場合においては、時効によって消滅する（退職手当の請求権の時効は、「当分の間、3年間」とはされていない）。なお、災害補償その他の請求権（賃金の請求権を除く。）はこれを行使することができる時から2年間行わない場合においては、時効によって消滅する。",src:"法115条、法附則143条3項",cat:"択一式（労働基準法）"},
{no:"第2-問8",opt:"A",q:"特定元方事業者は、その労働者である作業従事者（当該労働者である作業従事者のほか、労働者以外の当該特定元方事業者に係る作業従事者がある場合には、当該者を含む。）及び関係請負人に係る作業従事者の作業が同一の場所において行われることによって生ずる労働災害を防止するため、協議組織の設置及び運営を行うことに関する措置等の必要な措置を講じなければならない。",a:true,exp:"設問の通り正しい。設問の「協議組織の設置及び運営を行うことに関する措置等の必要な措置」は、次に掲げる措置である。① 協議組織の設置及び運営を行うこと　② 作業間の連絡及び調整を行うこと　③ 作業場所を巡視すること　④ 関係請負人が行う労働者の安全又は衛生のための教育に対する指導及び援助を行うこと　⑤ 建設業を行う特定元方事業者にあっては、仕事の工程に関する計画及び作業場所における機械、設備等の配置に関する計画を作成するとともに、当該機械、設備等を使用する作業に関し関係請負人が労働安全衛生法又はこれに基づく命令の規定に基づき講ずべき措置についての指導を行うこと　⑥ 上記①〜⑤のほか、当該労働災害を防止するため必要な事項　なお、特定元方事業者は、一の場所において、その労働者である作業従事者及び関係請負人に係る作業従事者が作業を行うときは、これらの作業従事者の作業が同一の場所において行われることによって生ずる労働災害を防止するため、統括安全衛生責任者を選任し、その者に元方安全衛生管理者（造船業の特定元方事業者は選任不要）の指揮をさせるとともに、上記①〜⑥の事項を統括管理させなければならない。ただし、これらの作業従事者の数が政令で定める数未満であるときは、この限りでない。",src:"法30条1項",cat:"択一式（安全衛生法）"},
{no:"第2-問8",opt:"B",q:"建築物貸与者は、原則として、当該建築物の貸与を受けた者の事業に係る当該建築物による労働災害を防止するため必要な措置を講じなければならないが、当該建築物の全部を1の事業者若しくは個人事業者に貸与するとき、又は2以上の事業者のみに貸与するときは、この限りでない。",a:false,exp:"設問の「2以上の事業者」とする記述が誤りである。建築物貸与者は、原則として、当該建築物の貸与を受けた者の事業に係る当該建築物による労働災害を防止するため必要な措置を講じなければならないが、当該建築物の全部を1の事業者若しくは個人事業者に貸与するとき、又は「2以上の個人事業者」のみに貸与するときは、この限りでない。なお、労働安全衛生法において「事業者」とは、「事業を行う者で、労働者を使用するもの」をいい、「個人事業者」とは、「事業を行う者で、労働者を使用しないもの」をいう。",src:"法34条",cat:"択一式（安全衛生法）"},
{no:"第2-問8",opt:"C",q:"通知対象物譲渡者等は、原則として、通知対象物に関する成分等の一定の事項を、譲渡し、又は提供する相手方に通知しなければならないが、その成分（労働者に危険又は健康障害を生ずるおそれの程度を勘案して厚生労働省令で定める化学物質である成分に限る。）の情報が、秘密として管理されている製品の情報である場合には、その旨を相手方にあらかじめ明示した上で、代替化学名等を定め、これを通知することをもって成分の通知に代えることができる。",a:true,exp:"設問の通り正しい。なお、表示対象物に係る表示事項には、成分は含まれていない。",src:"法57条の2、1項、3項",cat:"択一式（安全衛生法）"},
{no:"第2-問8",opt:"D",q:"厚生労働大臣は、新規化学物質に関する届出があった場合には、有害性の調査の結果について学識経験者の意見を聴き、当該届出に係る化学物質による労働者の健康障害を防止するため必要があると認めるときは、届出をした事業者に対し、施設又は設備の設置又は整備、保護具の備付けその他の措置を講ずべきことを勧告することができる。",a:true,exp:"設問の通り正しい。なお、厚生労働大臣は、新規化学物質に関する届出があった場合には、3月以内ごとに1回、定期に、インターネットの利用その他の適切な方法により、当該新規化学物質の名称を公表するものとされている。",src:"法57条の4、4項",cat:"択一式（安全衛生法）"},
{no:"第2-問8",opt:"E",q:"事業者は、暑熱な場所において連続して行われる作業等熱中症を生ずるおそれのある作業を行うときは、あらかじめ、当該作業に従事する作業従事者が熱中症の自覚症状を有する場合又は当該作業に従事する作業従事者に熱中症が生じた疑いがあることを当該作業に従事する他の作業従事者が発見した場合にその旨の報告をさせる体制を整備し、当該作業に従事する作業従事者に対し、当該体制を周知させなければならないが、ここにいう「暑熱な場所」とは、湿球黒球温度（WBGT）が28度以上又は気温が31度以上の場所をいい、必ずしも事業場内外の特定の作業場のみを指すものではなく、作業場所から作業場所への移動時等も含まれる。",a:true,exp:"設問の通り正しい。「暑熱な場所」とは、湿球黒球温度（WBGT）が28度以上又は気温が31度以上の場所をいい、必ずしも事業場内外の特定の作業場のみを指すものではなく、出張先で作業を行う場合、労働者が移動して複数の場所で作業を行う場合や、作業場所から作業場所への移動時等も含む趣旨であることとされている。なお、「暑熱な場所において連続して行われる作業等熱中症を生ずるおそれのある作業」とは、暑熱な場所において、継続して1時間以上又は1日当たり4時間を超えて行われることが見込まれる作業をいう。",src:"則612条の2、1項、令和7.5.20基発0520第6号",cat:"択一式（安全衛生法）"},
{no:"第2-問9",opt:"A",q:"期間の定めのない労働契約により使用される短時間労働者については、1週間の労働時間数が当該事業場において同種の業務に従事する通常の労働者の1週間の所定労働時間数の4分の3以上である場合には、労働安全衛生規則第44条の定期健康診断の対象となる。",a:true,exp:"設問の通り正しい。一般健康診断を実施すべき「常時使用する労働者」（常時使用する短時間労働者）は、次の①及び②のいずれの要件をも満たす者である。なお、心理的な負担の程度を把握するための検査（ストレスチェック）を実施すべき常時使用する労働者についても同様である。① 期間の定めのない労働契約により使用される者〔期間の定めのある労働契約により使用される者であって、当該契約の契約期間が1年（特定業務従事者は6月。以下同じ。）以上である者並びに契約更新により1年以上使用されることが予定されている者及び1年以上引き続き使用されている者を含む。〕であること　② その者の1週間の労働時間数が当該事業場において同種の業務に従事する通常の労働者の1週間の所定労働時間数の4分の3以上であること",src:"法66条1項、則44条1項、平成26.7.24基発0724第2号",cat:"択一式（安全衛生法）"},
{no:"第2-問9",opt:"B",q:"事業者は、労働安全衛生法第66条の8第1項（長時間労働者に対する面接指導）又は同法第66条の8の2第1項（研究開発業務従事者に対する面接指導）の規定による面接指導を実施するため、労働者の労働時間の状況を把握しなければならないが、その対象となる労働者には、労働基準法第41条に規定する管理監督者等は含まれない。",a:false,exp:"労働時間の状況の把握の対象となる労働者には、管理監督者等も含まれる。労働時間の状況の把握は、労働者の健康確保措置を適切に実施するためのものであるから、その対象となる労働者は、労働基準法41条の2第1項に規定する高度プロフェッショナル制度の適用者を除き、同法41条に規定する管理監督者等、研究開発業務従事者、事業場外労働のみなし労働時間制の適用者、裁量労働制の適用者、労働者派遣法に規定する派遣労働者、パートタイム・有期雇用労働法に規定する短時間労働者、労働契約法に規定する有期契約労働者を含めた全ての労働者である。なお、労働時間の状況の把握の対象となる短時間労働者については、一般健康診断・ストレスチェックの対象者と異なり、通常の労働者の1週間の所定労働時間数の4分の3以上というような基準は設けられていない。",src:"法66条の8の3、平成31.3.29基発0329第2号",cat:"択一式（安全衛生法）"},
{no:"第2-問9",opt:"C",q:"派遣労働者について、労働安全衛生法第59条第1項の雇入れ時の安全衛生教育、同条第2項の作業内容変更時の安全衛生教育の実施義務は、派遣元の事業者のみに課せられており、同条第3項の特別教育の実施義務は、派遣先の事業者のみに課せられている。",a:false,exp:"派遣労働者の作業内容変更時の安全衛生教育の実施義務は、派遣元の事業者及び派遣先の事業者の双方に課せられている。その他の記述は正しい。",src:"法59条、派遣法45条1項、3項",cat:"択一式（安全衛生法）"},
{no:"第2-問9",opt:"D",q:"派遣労働者について、労働安全衛生法第66条第1項の一般健康診断、同条第3項の歯科医師による健康診断の実施義務は、派遣元の事業者のみに課せられており、同条第2項の有害な業務に従事する者に対する特殊健康診断の実施義務は、派遣先の事業者のみに課せられている。",a:false,exp:"派遣労働者の歯科医師による健康診断の実施義務は、派遣先の事業者のみに課せられている。その他の記述は正しい。",src:"法66条1項、2項、3項、派遣法45条3項",cat:"択一式（安全衛生法）"},
{no:"第2-問9",opt:"E",q:"派遣労働者が派遣先の事業場において就業中に負傷した場合、所轄労働基準監督署長に対して労働者死傷病報告を行う義務は、派遣先の事業者のみに課せられている。",a:false,exp:"派遣労働者に係る労働者死傷病報告を行う義務は、派遣元の事業者及び派遣先の事業者の双方に課せられている。なお、派遣先の事業者は、派遣労働者について所轄労働基準監督署長に労働者死傷病報告を行ったときは、遅滞なく、その内容を当該派遣労働者を雇用する派遣元の事業者に報告しなければならないとされている（派遣元の事業者は、派遣先の事業者から受けた報告の内容に基づき、労働者死傷病報告を行うこととなる。）。",src:"法100条1項、派遣法45条15項、則97条",cat:"択一式（安全衛生法）"},
{no:"第2-問10",opt:"A",q:"事業者は、高年齢者の労働災害の防止を図るため、高年齢者の特性に配慮した作業環境の改善、作業の管理その他の必要な措置を講ずるように努めなければならない。",a:true,exp:"設問の通り正しい。また、「事業者は、中高年齢者その他労働災害の防止上その就業に当たって特に配慮を必要とする者については、これらの者の心身の条件に応じて適正な配置を行うように努めなければならない（法62条）」とされている。",src:"法62条の2、1項",cat:"択一式（安全衛生法）"},
{no:"第2-問10",opt:"B",q:"事業者は、室内又はこれに準ずる環境における労働者の受動喫煙を防止するため、当該事業者及び事業場の実情に応じ適切な措置を講ずるよう努めるものとする。",a:true,exp:"設問の通り正しい。なお、受動喫煙とは、人が他人の喫煙によりたばこから発生した煙にさらされることをいう。",src:"法68条の2",cat:"択一式（安全衛生法）"},
{no:"第2-問10",opt:"C",q:"事業者は、心臓、腎臓、肺等の疾病で労働のため病勢が著しく増悪するおそれのあるものにかかった者については、その就業を禁止しなければならない。",a:true,exp:"設問の通り正しい。なお、事業者は、就業を禁止しようとするときは、あらかじめ、産業医その他専門の医師の意見をきかなければならない。",src:"法68条、則61条1項2号",cat:"択一式（安全衛生法）"},
{no:"第2-問10",opt:"D",q:"労働基準監督署長は、がんその他の重度の健康障害を生ずるおそれのある業務で、政令で定めるものに従事していた者のうち、厚生労働省令で定める要件に該当する者に対し、離職の際に又は離職の後に、当該業務に係る健康管理手帳を交付するものとする。",a:false,exp:"健康管理手帳を交付するのは、「労働基準監督署長」ではなく、「都道府県労働局長」である。",src:"法67条1項",cat:"択一式（安全衛生法）"},
{no:"第2-問10",opt:"E",q:"作業従事者は、事業場に労働安全衛生法又はこれに基づく命令の規定に違反する事実があるときは、その事実を都道府県労働局長、労働基準監督署長又は労働基準監督官に申告して是正のため適当な措置をとるように求めることができる。",a:true,exp:"設問の通り正しい。なお、「事業者は、設問の申告をしたことを理由として、労働者に対し、解雇その他不利益な取扱いをしてはならない。」とされており、また、「注文者、機械等貸与者その他作業従事者に係る事業を行う者の契約の相手方は、設問の申告をしたことを理由として、当該事業を行う者に対し、取引の停止その他の不利益な取扱いをしてはならない。」とされている。",src:"法97条1項",cat:"択一式（安全衛生法）"},
{type:"select",no:"選択1",opt:"空欄A",context:"労働基準法第１条第２項では、「この法律で定める労働条件の基準は最低のものであるから、【A】は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。」と規定している。",choices:["労働関係の当事者", "労働者及び使用者", "使用者", "事業主又は事業の経営担当者"],answer:"労働関係の当事者",exp:"法1条2項の「労働関係の当事者」には使用者・労働者のほか、使用者団体・労働組合も含まれる。「労働者及び使用者」よりも広い概念である。",src:"法1条2項",cat:"選択式（労働基準法）"},
{type:"select",no:"選択1",opt:"空欄B",context:"労働基準法第33条第２項では、「前項ただし書の規定による届出があった場合において、行政官庁がその労働時間の延長又は休日の労働を不適当と認めるときは、その後にその時間に相当する【B】を与えるべきことを、命ずることができる。」と規定している。",choices:["休憩又は休日", "有給の休暇", "割増賃金", "賃金"],answer:"休憩又は休日",exp:"法33条2項の代休付与命令で与えられるのは「休憩又は休日」。この休業日には休業手当（法26条）の支払義務はない。",src:"法33条2項",cat:"選択式（労働基準法）"},
{type:"select",no:"選択1",opt:"空欄C",context:"最高裁判所（片山組事件）は、「労働者が職種や業務内容を特定せずに労働契約を締結した場合においては、現に就業を命じられた特定の業務について労務の提供が十全にはできないとしても、その能力、経験、地位、当該企業の規模、業種、当該企業における労働者の配置・異動の実情及び難易等に照らして当該【C】他の業務について労務の提供をすることができ、かつ、その提供を申し出ているならば、なお債務の本旨に従った履行の提供があると解するのが相当である。」と判示した。",choices:["労働者が配置される現実的可能性があると認められる", "現に就業を命じられた業務と実質的に同等の価値を有する", "労働者の貢献ないし役割に応じた", "労働者の能力、経験及びその適性を活かすことができる"],answer:"労働者が配置される現実的可能性があると認められる",exp:"片山組事件（最一小平成10.4.9）。職種・業務内容を特定しない労働契約では、他の業務への配置が「現実的可能性がある」と認められれば債務の本旨に従った履行の提供がある。",src:"最一小平成10.4.9片山組事件",cat:"選択式（労働基準法）"},
{type:"select",no:"選択1",opt:"空欄D",context:"事業者は、安全管理者・衛生管理者の選任を要する事業場以外の事業場で常時10人以上50人未満の労働者を使用する事業場ごとに、安全衛生推進者（安全管理者の選任を要する業種以外の業種にあっては衛生推進者）を選任し、総括安全衛生管理者が統括管理することとされている業務（衛生推進者にあっては衛生に係る業務に限る。）を【D】させなければならない。なお、安全衛生推進者又は衛生推進者の選任は、【E】を受けた者が行う講習を修了した者その他当該業務を【D】するため必要な能力を有すると認められる者のうちから行わなければならない。",choices:["担当", "管理", "指揮", "調整"],answer:"担当",exp:"安全衛生推進者等は安全衛生業務を「担当」する者として位置づけられる。安全管理者・衛生管理者が業務を「管理」するのと区別される重要なポイント。",src:"安衛法12条の2、則12条の2",cat:"選択式（安全衛生法）"},
{type:"select",no:"選択1",opt:"空欄E",context:"事業者は、安全管理者・衛生管理者の選任を要する事業場以外の事業場で常時10人以上50人未満の労働者を使用する事業場ごとに、安全衛生推進者を選任し、総括安全衛生管理者が統括管理することとされている業務を担当させなければならない。なお、安全衛生推進者又は衛生推進者の選任は、【E】を受けた者が行う講習を修了した者その他当該業務を担当するため必要な能力を有すると認められる者のうちから行わなければならない。",choices:["都道府県労働局長の登録", "都道府県労働局長の指定", "厚生労働大臣の登録", "厚生労働大臣の指定"],answer:"都道府県労働局長の登録",exp:"安全衛生推進者・衛生推進者の選任は、都道府県労働局長の「登録」を受けた者が行う講習修了者等から行う（則12条の3、1項）。「指定」ではなく「登録」である点に注意。",src:"則12条の3、1項",cat:"選択式（安全衛生法）"},
{type:"select",no:"第2-選択1",opt:"空欄A",context:"労働基準法第38条の３第１項に規定する専門業務型裁量労働制に係る対象業務とは、業務の性質上その遂行の方法を大幅に当該業務に従事する労働者の裁量にゆだねる必要があるため、【A】をいう。",choices:["当該業務の遂行の手段及び時間配分の決定等に関し使用者が具体的な指示をすることが困難なものとして厚生労働省令で定める業務のうち、労働者に就かせることとする業務", "当該業務の遂行の手段及び時間配分の決定等に関し使用者が具体的な指示をしないこととする業務", "その性質上従事した時間と従事して得た成果との関連性が通常高くないと認められるものとして厚生労働省令で定める業務のうち、労働者に就かせることとする業務", "労働時間を算定し難い業務"],answer:"当該業務の遂行の手段及び時間配分の決定等に関し使用者が具体的な指示をすることが困難なものとして厚生労働省令で定める業務のうち、労働者に就かせることとする業務",exp:"専門業務型（法38条の3）は「使用者が具体的な指示をすることが困難なもの」。企画業務型（法38条の4）の「使用者が具体的な指示をしないこととする業務」と区別すること。",src:"法38条の3、1項1号",cat:"選択式（労働基準法）"},
{type:"select",no:"第2-選択1",opt:"空欄B",context:"最高裁判所（三菱重工長崎造船所事件）は、所定の保護具等の装着を義務付けられている場合の装着等の時間について、「労働者が就業を命じられた業務の準備行為等を事業所内において行うことを使用者から義務付けられ、又はこれを余儀なくされたときは、当該行為を所定労働時間外において行うものとされている場合であっても、当該行為は、特段の事情のない限り、【B】と評価することができ、当該行為に要した時間は、それが社会通念上必要と認められるものである限り、労働基準法上の労働時間に該当すると解される。」と判示している。",choices:["使用者の指揮命令下に置かれたもの", "所定労働時間の一部において行われたもの", "労働契約上の労務提供義務が生じたもの", "労務管理上の要請から"],answer:"使用者の指揮命令下に置かれたもの",exp:"最二小昭和56.9.18三菱重工長崎造船所事件。労働時間とは「使用者の指揮命令下に置かれている時間」をいい、この判断は客観的に行われ労働契約等の定めによらない。",src:"最二小昭和56.9.18三菱重工長崎造船所事件",cat:"選択式（労働基準法）"},
{type:"select",no:"第2-選択1",opt:"空欄C",context:"最高裁判所（三菱重工長崎造船所事件）は、ストライキ期間に応じた家族手当削減に関し、「同法37条２項が家族手当を割増賃金算定の基礎から除外すべきものと定めたのは、家族手当が【C】支給される性格の賃金であって、これを割増賃金の基礎となる賃金に算入させることを原則とすることがかえって不適切な結果を生ずるおそれのあることを配慮したものである」と判示した。",choices:["労働者の個人的事情に基づいて", "企業の福利厚生の一環として", "世間相場等を考慮して", "労働の対価としての対価を必要とするもの"],answer:"労働者の個人的事情に基づいて",exp:"最一小平成12.3.9三菱重工長崎造船所事件。家族手当は労働者の個人的事情（扶養家族の有無・人数）に基づいて支給される性格の賃金であるため割増賃金の基礎から除外されている。",src:"最一小平成12.3.9三菱重工長崎造船所事件",cat:"選択式（労働基準法）"},
{type:"select",no:"第2-選択1",opt:"空欄D",context:"労働安全衛生法第40条第１項は、「前条第１項又は第２項の検査証（以下「検査証」という。）を受けていない特定機械等（第38条第３項の規定により部分の変更又は再使用に係る検査を受けなければならない特定機械等で、前条第３項の裏書を受けていないものを含む。）は、【D】してはならない。」と定めている。",choices:["使用", "使用し、又は貸与", "譲渡", "譲渡し、又は貸与"],answer:"使用",exp:"安衛法40条1項。検査証を受けていない特定機械等は「使用」してはならない。なお安衛法40条2項では「譲渡し、又は貸与してはならない」と規定されており、別の行為が禁止されている。",src:"安衛法40条1項",cat:"選択式（安全衛生法）"},
{type:"select",no:"第2-選択1",opt:"空欄E",context:"事業者は、化学物質又は化学物質を含有する製剤を製造し、又は取り扱う業務を行う事業場において、【E】の労働者が同種のがんに罹患したことを把握したときは、当該罹患が業務に起因するかどうかについて、遅滞なく、医師の意見を聴かなければならない。",choices:["1年以内に2人以上", "2年以内に2人以上", "2年以内に3人以上", "3年以内に5人以上"],answer:"1年以内に2人以上",exp:"則97条の2、1項。化学物質取扱事業場で「1年以内に2人以上」の労働者が同種のがんに罹患したことを把握したときに医師の意見聴取が義務付けられる。",src:"則97条の2、1項",cat:"選択式（安全衛生法）"},
{no:"LEC第1回-問1",opt:"ア",q:"【スポットワーク（短時間・単発の就労を内容とする労働契約の下で働くことをいう。）を利用する労働者の労働条件の確保等に関する記述として正しいか。なお、「雇用仲介アプリ」とは、その雇用仲介を行う事業者（スポットワーク仲介事業者）が提供するサービスをいう。】スポットワークでは、雇用仲介アプリを用いて、使用者が掲載した求人に労働者が応募し、面接等を経ることなく、短時間にその求人と応募がマッチングすることが一般的であり、面接等を経ることなく先着順で就労が決定する求人では、別途特段の合意がなければ、使用者が掲載した求人に応募した労働者が予定された就業場所に到着した時点で労使双方の合意があったものとして労働契約が成立するものと一般的には考えられる。",a:false,exp:"スポットワークにおいて、面接等を経ることなく先着順で就労が決定する求人では、別途特段の合意がなければ、使用者が掲載した求人に「労働者が応募した時点」で労使双方の合意があったものとして労働契約が成立するものと一般的には考えられる（令7.7.4基発0704第3号）。",src:"令7.7.4基発0704第3号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問1",opt:"イ",q:"【スポットワーク（短時間・単発の就労を内容とする労働契約の下で働くことをいう。）を利用する労働者の労働条件の確保等に関する記述として正しいか。なお、「雇用仲介アプリ」とは、その雇用仲介を行う事業者（スポットワーク仲介事業者）が提供するサービスをいう。】労働契約成立後に使用者の都合で丸1日の休業又は仕事の早上がりをさせることになった場合は、労働基準法第26条（休業手当）の「使用者の責に帰すべき事由による休業」に該当することから、使用者は、労働者に対し、当該丸1日の休業又は仕事の早上がりをさせることになった日後、速やかに、休業手当を支払う必要があるものとされている。",a:false,exp:"労働基準法26条に規定する「休業手当」は、法11条に規定する「賃金」に該当することから、本肢の場合、使用者は、労働者に対し、「当初の賃金の所定支払日」までに休業手当を支払うことで足りる（令7.7.4基発0704第3号、昭25.4.6基収207号ほか）。",src:"令7.7.4基発0704第3号、昭25.4.6基収207号ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問1",opt:"ウ",q:"【スポットワーク（短時間・単発の就労を内容とする労働契約の下で働くことをいう。）を利用する労働者の労働条件の確保等に関する記述として正しいか。なお、「雇用仲介アプリ」とは、その雇用仲介を行う事業者（スポットワーク仲介事業者）が提供するサービスをいう。】労働者から予定していた労働時間と異なる実際の労働時間による修正の承認申請がなされた場合は、使用者は、賃金は労働者の生活の糧であることを踏まえ、予定された労働時間に基づき勤務した賃金は支払うとともに、予定の労働時間と異なる時間については、速やかに確認し、労働時間を確定させるものとされている。",a:true,exp:"本肢のとおりである（令7.7.4基発0704第3号）。",src:"令7.7.4基発0704第3号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問2",opt:"A",q:"使用者は、労働契約法第18条に規定するいわゆる無期転換ルールに基づき無期労働契約への転換を申し込むことができる権利（無期転換申込権）を行使しない旨を表明している有期契約労働者に対しては、労働基準法施行規則第5条第5項に規定する無期転換申込みに関する事項及び無期転換後の労働条件（所定のものを除く。）を明示することを要しない。",a:false,exp:"使用者は、無期転換申込権を行使しない旨を表明している有期契約労働者に対しても、本肢の無期転換申込みに関する事項及び無期転換後の労働条件（所定のものを除く）を「明示しなければならない」（労働基準法施行規則5条5項、令和5年改正労働基準法施行規則等に係る労働条件明示等に関するQ&Aほか）。",src:"則5条5項ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問2",opt:"B",q:"高度の専門的知識等を有する労働者との間に締結される労働契約については、当該労働者の有する高度の専門的知識等を必要とする業務に就く場合に限って契約期間の上限を5年とする労働契約を締結することが可能となるものであり、当該高度の専門的知識を必要とする業務に就いていない場合の契約期間の上限は、原則として、1年とされている。",a:false,exp:"高度の専門的知識を必要とする業務に就いていない場合の労働契約の期間の上限は、原則として、「3年」とされている（平15.10.22基発1022001号）。",src:"平15.10.22基発1022001号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問2",opt:"C",q:"「使用者が、その事業の執行につきなされた被用者の加害行為により、直接損害を被り又は使用者としての損害賠償責任を負担したことに基づき損害を被った場合には、使用者は、その事業の性格、規模、施設の状況、被用者の業務の内容、労働条件、勤務態度、加害行為の態様、加害行為の予防若しくは損失の分散についての使用者の配慮の程度その他諸般の事情に照らし、損害の公平な分担という見地から信義則上相当と認められる限度において、被用者に対し右損害の賠償又は求償の請求をすることができるものと解すべきである。」とするのが最高裁判所の判例である。",a:true,exp:"本肢のとおりである（最高裁第一小法廷判決 昭51.7.8 茨城石炭商事事件）。",src:"最判昭51.7.8 茨城石炭商事事件",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問2",opt:"D",q:"労働基準法第15条第1項の規定により明示された労働条件が事実と相違するため労働契約を解除した労働者であって、就業のために住居を変更したものが、契約解除の日から14日以内に帰郷する場合においては、使用者は、必要な旅費を負担しなければならないが、当該「14日以内に帰郷する」とは、14日以内に現住所を離れることだけでは足りず、14日以内に帰郷先の目的地に到着していなければならないとされている。",a:false,exp:"法15条3項の「14日以内に帰郷する」とは、14日以内に目的地に向かって現住所を離れることで足り、「目的地に到着することは要しない」ものとされている（法15条2項・3項ほか）。",src:"法15条2項・3項ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問2",opt:"E",q:"労働契約の期間を定めず、雇入れ後1か月間は試用期間として、令和8年4月1日に雇い入れた労働者を、同年4月14日の終業時をもって解雇する場合には、解雇予告手当の支払が必要となる。",a:false,exp:"試の使用期間中の者については、14日「を超えて」引き続き使用されるに至った場合に、解雇の予告又は解雇予告手当の支払が必要となるため、本肢の場合には、解雇予告手当の支払義務は「生じない」（法21条）。",src:"法21条",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問3",opt:"A",q:"労働基準法第25条において、「使用者は、労働者が出産、疾病、災害その他厚生労働省令で定める非常の場合の費用に充てるために請求する場合においては、支払期日前であっても、既往の労働に対する賃金を支払わなければならない。」と規定されており、労働者の当該請求が既往の労働に対する賃金の一部である場合には、当該請求があった金額を支払うことで足りるものとされている。",a:true,exp:"本肢のとおりである（法25条ほか）。",src:"法25条ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問3",opt:"B",q:"「労働者の賃金は、労働者の生活を支える重要な財源で、日常必要とするものであるから、これを労働者に確実に受領させ、その生活に不安のないようにすることは、労働政策の上から極めて必要なことであり、労働基準法24条1項が、賃金は同項但書の場合を除きその全額を直接労働者に支払わねばならない旨を規定しているのも、右にのべた趣旨を、その法意とするものというべきである。しからば同条項は、労働者の賃金債権に対しては、使用者は、使用者が労働者に対して有する債権をもって相殺することを許されないとの趣旨を包含するものと解するのが相当である。ただし、その債権が不法行為を原因としたものである場合は除かれているものと解すべきである。」とするのが、最高裁判所の判例である。",a:false,exp:"最高裁判所の判例によると、「法24条1項は、労働者の賃金債権に対しては、使用者は、使用者が労働者に対して有する債権をもって相殺することを許されないとの趣旨を包含するものと解するのが相当である。このことは、その債権が不法行為を原因としたものであっても『変りはない』」とされている（最高裁大法廷判決 昭36.5.31 日本勧業経済会事件）。",src:"最判昭36.5.31 日本勧業経済会事件",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問3",opt:"C",q:"1か月における時間外労働、休日労働、深夜業の各々の割増賃金の総額に10円未満の端数が生じた場合、5円未満の端数を切り捨て、それ以上を10円に切り上げることは、事務簡便を目的としたものと認められ、労働基準法第24条（賃金）及び労働基準法第37条（割増賃金）違反とならない。",a:false,exp:"本肢の取り扱いは、法24条（賃金）及び法37条（割増賃金）「違反となる」（昭63.3.14基発150号）。1か月における時間外労働、休日労働、深夜業の各々の割増賃金の総額に「1円」未満の端数が生じた場合、「50銭」未満の端数を切り捨て、それ以上を「1円」に切り上げることは、事務簡便を目的としたものと認められ、法24条及び法37条違反とならない。",src:"昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問3",opt:"D",q:"就業規則に定められた賃金の支払日が休日に当たる場合、その支払日を繰り上げて支払うことは、労働基準法第24条第2項に規定するいわゆる一定期日払いの原則に違反しないが、その支払日を繰り下げて支払うことは、労働者保護の観点から当該一定期日払いの原則に違反するものとされている。",a:false,exp:"就業規則に定められた賃金の支払日が休日に当たる場合、その支払日を「繰り上げて又は繰り下げて」支払うことは一定期日払いの原則に「違反しない」（法24条2項ほか）。",src:"法24条2項ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問3",opt:"E",q:"労働組合が争議をしたことにより同一事業場の当該労働組合員以外の労働者の一部が労働を提供し得なくなった場合であって、その程度に応じて当該労働者を休業させたときは、労働基準法第26条（休業手当）に規定する「使用者の責に帰すべき事由による休業」に該当するものとされている。",a:false,exp:"労働組合が争議をしたことにより同一事業場の当該労働組合員以外の労働者の一部が労働を提供し得なくなった場合であって、その程度に応じて当該労働者を休業させたときは、法26条（休業手当）に規定する「使用者の責に帰すべき事由による休業」に「該当しない」（法26条、昭24.12.2基収3281号）。",src:"法26条、昭24.12.2基収3281号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問4",opt:"ア",q:"【労働基準法の総則（第1条〜第12条）等に関する記述として正しいか】雇入れの日に労働基準法第12条に規定する平均賃金を算定すべき事由の発生した場合の平均賃金は、都道府県労働局長の定めるところによるものとされており、当該都道府県労働局長は、当該労働者に対し一定額の賃金が予め定められている場合にはその額により推算し、当該賃金が定められていない場合にはその日に当該事業場において、同一の業務に従事した労働者の1人平均の賃金額により推算して、当該平均賃金を定めることとなる。",a:true,exp:"本肢のとおりである（則4条、昭22.9.13発基17号）。",src:"則4条、昭22.9.13発基17号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問4",opt:"イ",q:"【労働基準法の総則（第1条〜第12条）等に関する記述として正しいか】労働基準法第5条において、「使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して労働させてはならない。」と規定されており、労働者が現実に労働していない場合は、当該規定違反となることはない。",a:false,exp:"法5条において、「使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して『労働を強制』してはならない。」と規定されており、当該「労働者の意思に反して労働を強制」するとは、不当な手段を用いることによって、使用者が労働者の意識ある意思を抑圧し、その自由な発現を妨げて労働を強要することをいうことから、同条の適用にあっては、「必ずしも労働者が現実に労働することを必要としない」（法5条、昭23.3.2基発381号）。",src:"法5条、昭23.3.2基発381号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問4",opt:"ウ",q:"【労働基準法の総則（第1条〜第12条）等に関する記述として正しいか】労働基準法の適用にあたって、一の事業であるか否かは、原則として、主として場所的観念によって決定すべきものであるが、場所的に分散しているものであっても、出張所や支所などであって、その規模が著しく小さく、組織的関連ないし事務能力等を勘案して一の事業という独立性がないものについては、直近上位の機構と一括して一の事業として取り扱うものとされている。",a:true,exp:"本肢のとおりである（平11.3.31基発168号ほか）。",src:"平11.3.31基発168号ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問4",opt:"エ",q:"【労働基準法の総則（第1条〜第12条）等に関する記述として正しいか】労働基準法第6条において、「何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならない。」と規定されており、当該規定における「業として利益を得る」とは、営利を目的として、同種の行為を反復継続することをいうが、1回の行為であっても、反復継続して利益を得る意思があれば当該規定に違反するものとされており、それが主業としてなされる場合と副業としてなされる場合とを問わないものとされている。",a:true,exp:"本肢のとおりである（法6条、昭23.3.2基発381号）。なお、本肢の規定（中間搾取の排除）に違反した者は、1年以下の拘禁刑又は50万円以下の罰金に処せられる（法118条1項）。",src:"法6条、昭23.3.2基発381号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問4",opt:"オ",q:"【労働基準法の総則（第1条〜第12条）等に関する記述として正しいか】法人の重役等で業務執行権又は代表権を持たない者が、工場長、部長の職にあって賃金を受ける場合は、その限りにおいて労働基準法第9条に規定する労働者とされている。",a:true,exp:"本肢のとおりである（昭23.3.17基発461号）。労働基準法における「労働者」とは、職業の種類を問わず、事業又は事務所に使用される者で、賃金を支払われる者をいう（法9条）。",src:"昭23.3.17基発461号、法9条",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問5",opt:"A",q:"労働基準法第39条第4項に規定する時間単位における年次有給休暇を採用しているX事業場において、所定労働時間が8時間であって、年次有給休暇が3日と3時間を保有する労働者Yが新たに年次有給休暇を付与される前に、所定労働時間が8時間から4時間に変更された場合、Yが保有する年次有給休暇は、「3（1日あたりの時間数は8時間）と3時間」から「3（1日あたりの時間数は4時間）と2時間」に変更される。なお、X事業場においては、1時間以外の時間を単位として同項に規定する年次有給休暇を付与していないものとする。",a:true,exp:"本肢のとおりである（法39条4項、平21.10.5基発1005第1号）。1年の途中で所定労働時間が変更された場合、日単位で保有している部分については変更後の所定労働時間により、日単位に満たず時間単位で保有している部分については所定労働時間の変動に比例して時間数が変更される。比例して変更した結果、1時間未満の端数が生じた場合（本肢では1.5時間）は切り上げるため、変更後は「3日（1日あたり4時間）と2時間」となる。",src:"法39条4項、平21.10.5基発1005第1号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問5",opt:"B",q:"X事業場に、同時に採用され、6か月間継続勤務し、労働基準法第39条所定の要件を満たした週の所定労働時間が25時間（勤務形態は1日5時間、週5日勤務）の労働者Yと週の所定労働時間が28時間（勤務形態は1日7時間、週4日勤務）の労働者Zがいる場合、X事業場の使用者は、Yに対して、Zより多くの日数の年次有給休暇を付与しなければならない。",a:true,exp:"本肢のとおりである（法39条3項、則24条の3第3項）。Yは週の所定労働日数が4日以下ではないため比例付与の対象者とならないのに対して、Zは週の所定労働時間が30時間未満であり、かつ、週の所定労働日数が4日以下であるため、比例付与の対象者となる。したがって、使用者はYに対してZより多くの日数を付与しなければならない。",src:"法39条3項、則24条の3第3項",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問5",opt:"C",q:"年次有給休暇の権利は、法定要件が充足されることによって法律上当然に労働者に生ずる権利であって、労働者の請求をまってはじめて生ずるものではないとするのが、最高裁判所の判例である。",a:true,exp:"本肢のとおりである（最高裁第二小法廷判決 昭48.3.2 白石営林署事件）。",src:"最判昭48.3.2 白石営林署事件",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問5",opt:"D",q:"労働基準法第39条第1項において、「使用者は、その雇入れの日から起算して6箇月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。」と規定されており、定年退職による退職者を引き続き嘱託等として再採用している場合の期間は、当該定年退職と再採用との間に相当の期間があるか否かにかかわらず、当該「継続勤務」に含まれる。",a:false,exp:"定年退職による退職者を引き続き嘱託等として再採用している場合の期間は、当該定年退職と再採用との間に「相当の期間が存在しない場合であれば」、法39条1項に規定する「継続勤務」に含まれる（法39条1項、昭63.3.14基発150号）。",src:"法39条1項、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問5",opt:"E",q:"使用者が労働基準法第39条第7項に規定する使用者による年次有給休暇の時季指定付与に係る労働者への意見聴取をした際に当該労働者が半日単位での年次有給休暇の取得を希望した場合、使用者は同項の使用者による年次有給休暇の時季指定を半日単位で行うことができる。",a:true,exp:"本肢のとおりである（法39条7項、平30.12.28基発1228第15号）。",src:"法39条7項、平30.12.28基発1228第15号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問6",opt:"A",q:"「右ビラの内容が大部分事実に基づかず、又は事実を誇張歪曲して被上告会社を非難攻撃し、全体としてこれを中傷誹謗するものであり、右ビラの配布により労働者の会社に対する不信感を醸成して企業秩序を乱し、又はそのおそれがあったものとした原審の認定判断は、原判決挙示の証拠関係に照らし、是認することができないではなく、その過程に所論の違法があるものとすることはできない。そして、〔…（略）…〕上告人による本件ビラの配布は、就業時間外に職場外である被上告会社の従業員社宅において職務遂行に関係なく行われたものではあるが、本件の就業規則所定の懲戒事由にあたると解することができ、これを理由として上告人に対して懲戒として譴責を課したことは懲戒権者に認められる裁量権の範囲を超えるものとは認められないというべきであり、これと同旨の原審の判断は正当である。」とするのが、最高裁判所の判例である。",a:true,exp:"本肢のとおりである（最高裁第一小法廷判決 昭58.9.8 関西電力事件）。",src:"最判昭58.9.8 関西電力事件",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問6",opt:"B",q:"運転手である労働者が交通事故を起こしたため、使用者は、当該交通事故を起こしたことが運転手として不適格であるとして、当該労働者を助手へと格下げした。運転手としての職務に係る所定の通常賃金よりも助手としての職務に係る所定の通常賃金の方が低かったため、当該労働者の賃金が低下した。当該賃金の低下は、交通事故を引き起こしたことに対する制裁として、労働基準法第91条の減給の制裁の制限規定の適用を受けるものとされている。",a:false,exp:"本肢の賃金の低下は、その労働者の職務の変更に伴う当然の結果であるから、「法91条（制裁規定の制限）の規定に抵触するものではない」（昭26.3.14基収518号）。",src:"昭26.3.14基収518号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問6",opt:"C",q:"減給の制裁規定の制限を定めた労働基準法第91条にいう「就業規則」には、労働基準法上の就業規則の作成義務が課されていない常時10人未満の労働者を使用する使用者が作成した就業規則も含まれる。",a:true,exp:"本肢のとおりである（法91条ほか）。就業規則で、労働者に対して減給の制裁を定める場合においては、その減給は、1回の額が平均賃金の1日分の半額を超え、総額が1賃金支払期における賃金の総額の10分の1を超えてはならない。",src:"法91条ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問6",opt:"D",q:"労働基準法第89条第1項に規定する就業規則に係るいわゆる絶対的必要記載事項の1つである「退職に関する事項（解雇の事由を含む。）」とは、任意退職、解雇、定年制及び契約期間の満了による退職などの労働者がその身分を失うすべての場合に関する事項をいうものとされている。",a:true,exp:"本肢のとおりである（法89条ほか）。本肢の「解雇の事由」については、少なくともどのような事実がある場合に解雇されることとなるのかが明確になっている必要がある。",src:"法89条ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問6",opt:"E",q:"労働基準法第92条第2項において、「行政官庁は、法令又は労働協約に牴触する就業規則の変更を命ずることができる。」と規定されており、当該変更命令は、就業規則を変更すべき義務を使用者に課するにとどまるものであることから、行政官庁から当該変更命令が出されたとしても、それだけで就業規則が変更されたこととなるものではなく、使用者によって所要の変更手続がとられて初めて変更されたことになる。",a:true,exp:"本肢のとおりである（法92条2項ほか）。就業規則は、法令又は当該事業場について適用される労働協約に反してはならない。",src:"法92条2項ほか",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問7",opt:"A",q:"（本問において「36協定」とは、労働基準法第36条の規定による時間外労働及び休日労働に関する労使協定をいう。）36協定の対象期間の初日が令和8年4月1日である場合において、労働者の対象期間の初日から1箇月ごとに区分した各期間における時間外労働時間及び休日労働時間の合計が次に掲げるとおり（①令和8年4月…10時間、②令和8年5月…20時間、③令和8年6月…20時間、④令和8年7月…40時間、⑤令和8年8月…70時間）であった場合、使用者は、同年9月における当該労働者の時間外労働時間及び休日労働時間の合計は、90時間以下としなければならない。",a:true,exp:"本肢のとおりである（法36条6項）。36協定により時間外・休日労働をさせる場合、対象期間の初日から1箇月ごとに区分した各期間に当該各期間の直前の1箇月、2箇月、3箇月、4箇月及び5箇月の期間を加えたそれぞれの期間における時間外・休日労働時間の1箇月当たりの平均時間は80時間を超えてはならない。本肢の場合、令和8年8月の時間外・休日労働時間は「70時間」であることから、同年9月の時間外・休日労働時間との合計は「90時間以下（（70時間＋90時間）÷2＝80時間）」としなければならない。",src:"法36条6項",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問7",opt:"B",q:"事業の附属寄宿舎に労働者を寄宿させる場合において、使用者は、建設物及び設備の管理に関する事項に係る規定の作成又は変更について、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得なければならない。",a:false,exp:"建設物及び設備の管理に関する事項に係る規定の作成又は変更については、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得ることを「要しない」（法95条1項・2項）。事業の附属寄宿舎に労働者を寄宿させる場合において、使用者は、起床、就寝、外出及び外泊に関する事項、行事に関する事項、食事に関する事項及び安全及び衛生に関する事項に係る規定の作成又は変更については、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得なければならない。",src:"法95条1項・2項",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問7",opt:"C",q:"労働組合のない事業場において36協定を締結する場合において、労働者側の締結当事者たる「労働者の過半数を代表する者」を選出するときの当該事業場の労働者数の算定に当たっては、当該事業場に派遣されて現に指揮命令を受けて働いている派遣労働者を含めることを要しない。",a:true,exp:"本肢のとおりである（労働者派遣法44条2項、昭61.6.6基発333号）。派遣元において36協定を締結する場合に、「労働者の過半数を代表する者」を選出するときの当該事業場の労働者数の算定に当たっての労働者は、当該派遣元の事業場のすべての労働者であり、派遣中の労働者とそれ以外の労働者の両方を含む。",src:"労働者派遣法44条2項、昭61.6.6基発333号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問7",opt:"D",q:"同居の親族であっても、常時同居の親族以外の労働者を使用する事業において一般事務又は現場作業等に従事し、かつ、作業に関する指揮命令に従っていることが明らかであり、労働時間等の管理、賃金の決定・支払等からみて、当該事業場の他の労働者と同様の就労の実態を有し、賃金もこれに応じて支払われている場合には、当該同居の親族は、労働基準法上の労働者と解することができる。",a:true,exp:"本肢のとおりである（昭54.4.2基発153号）。",src:"昭54.4.2基発153号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問7",opt:"E",q:"36協定の効力は、その協定に定めるところによって労働させても労働基準法に違反しないという免罰効果をもつものであり、労働者の民事上の義務は、当該協定から直接生じるものではなく、労働協約、就業規則等の根拠が必要とされている。",a:true,exp:"本肢のとおりである（昭63.1.1基発1号）。",src:"昭63.1.1基発1号",cat:"択一式（労働基準法）"},
{no:"LEC第1回-問8",opt:"A",q:"【次に示す業態をとる株式会社についての安全衛生管理に関する記述として正しいか。〔前提：①甲市に本社を置き、営業活動のほか、人事や総務等の管理業務を行っている。常時使用する労働者等数50人（このうち、派遣先事業者として、派遣労働者3人を受け入れている。）。②乙市に工場を置き、魚介類を主原料とする食品を製造している。なお、当該工場における業務には、労働基準法施行規則第18条各号に掲げる健康上特に有害な業務は含まれていない。常時使用する労働者数500人（このうち、深夜業を含む業務に従事している労働者が300人いる。）。③丙市に小売店舗を置き、乙市の工場で製造した食品のみの販売を行っている。常時使用する労働者数20人。なお、衛生管理者及び産業医については、選任の特例（労働安全衛生規則第8条及び同規則第13条第3項）を考えないものとする。〕】甲市の本社、乙市の工場及び丙市の小売店舗においては、それぞれ総括安全衛生管理者を選任しなければならない。",a:false,exp:"甲市の本社及び丙市の小売店舗においては、総括安全衛生管理者を選任することを「要しない」（労働安全衛生法施行令2条）。",src:"令2条",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問8",opt:"B",q:"【次に示す業態をとる株式会社についての安全衛生管理に関する記述として正しいか。〔前提：①甲市に本社を置き、営業活動のほか、人事や総務等の管理業務を行っている。常時使用する労働者等数50人（このうち、派遣先事業者として、派遣労働者3人を受け入れている。）。②乙市に工場を置き、魚介類を主原料とする食品を製造している。なお、当該工場における業務には、労働基準法施行規則第18条各号に掲げる健康上特に有害な業務は含まれていない。常時使用する労働者数500人（このうち、深夜業を含む業務に従事している労働者が300人いる。）。③丙市に小売店舗を置き、乙市の工場で製造した食品のみの販売を行っている。常時使用する労働者数20人。なお、衛生管理者及び産業医については、選任の特例（労働安全衛生規則第8条及び同規則第13条第3項）を考えないものとする。〕】乙市の工場において、過去3年間の労働災害による休業1日以上の死傷者数の合計が10人を超えたときは、安全管理者のうち少なくとも1人を専任の安全管理者としなければならない。",a:false,exp:"乙市の工場においては、安全管理者を専任のものとすることを「要しない」（労働安全衛生規則4条1項4号）。本肢のような製造業（物の加工業を含む）の場合、常時「2,000人以上」の労働者を使用する事業場であって、かつ、過去3年間の労働災害による休業1日以上の死傷者数の合計が「100人を超える」事業場は、安全管理者のうち少なくとも1人を専任の安全管理者としなければならない。",src:"則4条1項4号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問8",opt:"C",q:"【次に示す業態をとる株式会社についての安全衛生管理に関する記述として正しいか。〔前提：①甲市に本社を置き、営業活動のほか、人事や総務等の管理業務を行っている。常時使用する労働者等数50人（このうち、派遣先事業者として、派遣労働者3人を受け入れている。）。②乙市に工場を置き、魚介類を主原料とする食品を製造している。なお、当該工場における業務には、労働基準法施行規則第18条各号に掲げる健康上特に有害な業務は含まれていない。常時使用する労働者数500人（このうち、深夜業を含む業務に従事している労働者が300人いる。）。③丙市に小売店舗を置き、乙市の工場で製造した食品のみの販売を行っている。常時使用する労働者数20人。なお、衛生管理者及び産業医については、選任の特例（労働安全衛生規則第8条及び同規則第13条第3項）を考えないものとする。〕】甲市の本社において、危険有害要因が少なく、派遣中の労働者であっても衛生管理に関して適切な措置を講じることができる場合は、所定の資格を有する派遣労働者であって、労働者派遣契約において当該本社に専ら常駐し、かつ、その者が一定期間継続して職務に当たることが明らかにされている場合には、当該派遣労働者を衛生管理者として選任することができる。",a:true,exp:"本肢のとおりである（平18.3.31基発0331004号）。なお、派遣先事業者は、派遣労働者を含めて常時使用する労働者数を算出し、それにより算定した事業場の規模等に応じて、衛生管理者等を選任する（平21.3.31基発第0331010号）。",src:"平18.3.31基発0331004号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問8",opt:"D",q:"【次に示す業態をとる株式会社についての安全衛生管理に関する記述として正しいか。〔前提：①甲市に本社を置き、営業活動のほか、人事や総務等の管理業務を行っている。常時使用する労働者等数50人（このうち、派遣先事業者として、派遣労働者3人を受け入れている。）。②乙市に工場を置き、魚介類を主原料とする食品を製造している。なお、当該工場における業務には、労働基準法施行規則第18条各号に掲げる健康上特に有害な業務は含まれていない。常時使用する労働者数500人（このうち、深夜業を含む業務に従事している労働者が300人いる。）。③丙市に小売店舗を置き、乙市の工場で製造した食品のみの販売を行っている。常時使用する労働者数20人。なお、衛生管理者及び産業医については、選任の特例（労働安全衛生規則第8条及び同規則第13条第3項）を考えないものとする。〕】乙市の工場においては、当該工場の専属である者から産業医を選任しなければならない。",a:false,exp:"乙市の工場においては、「専属の産業医を選任することを要しない」（則13条1項3号）。次のいずれかの事業場にあっては、専属の者を産業医として選任しなければならない。①常時1,000人以上の労働者を使用する事業場、②所定の有害な業務（深夜業を含む業務を含む）に常時500人以上の労働者を従事させる事業場。本肢の乙市の工場はいずれにも該当しない。",src:"則13条1項3号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問8",opt:"E",q:"【次に示す業態をとる株式会社についての安全衛生管理に関する記述として正しいか。〔前提：①甲市に本社を置き、営業活動のほか、人事や総務等の管理業務を行っている。常時使用する労働者等数50人（このうち、派遣先事業者として、派遣労働者3人を受け入れている。）。②乙市に工場を置き、魚介類を主原料とする食品を製造している。なお、当該工場における業務には、労働基準法施行規則第18条各号に掲げる健康上特に有害な業務は含まれていない。常時使用する労働者数500人（このうち、深夜業を含む業務に従事している労働者が300人いる。）。③丙市に小売店舗を置き、乙市の工場で製造した食品のみの販売を行っている。常時使用する労働者数20人。なお、衛生管理者及び産業医については、選任の特例（労働安全衛生規則第8条及び同規則第13条第3項）を考えないものとする。〕】丙市に小売店舗においては、労働衛生コンサルタントその他厚生労働大臣が定める者であって、かつ、当該小売店舗の専属であるものから衛生推進者を選任しなければならない。",a:false,exp:"丙市に小売店舗において、労働衛生コンサルタントその他厚生労働大臣が定める者から衛生推進者を選任する場合は、当該小売店舗の「専属であることを要しない」（則12条の3第1項2号）。",src:"則12条の3第1項2号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問9",opt:"A",q:"【労働安全衛生法第45条第2項に規定する「特定自主検査」（同条第1項に規定する定期自主検査のうち厚生労働省令で定める自主検査をいう。）の対象となる機械等に該当するものとして正しいか】ブル・ドーザー（動力を用い、かつ、不特定の場所に自走することができるものに限る。）",a:true,exp:"本肢の機械等は、労働安全衛生法45条2項の規定による特定自主検査の対象となる機械等に該当する（法45条2項、令15条2項、令別表7）。なお、特定自主検査の対象とされている機械等は、①フォークリフト、②令別表7に掲げる建設機械で、動力を用い、かつ、不特定の場所に自走することができるもの、③不整地運搬車、④作業床の高さが2メートル以上の高所作業車、⑤動力により駆動されるプレス機械である。",src:"法45条2項、令15条2項、令別表7",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問9",opt:"B",q:"【労働安全衛生法第45条第2項に規定する「特定自主検査」（同条第1項に規定する定期自主検査のうち厚生労働省令で定める自主検査をいう。）の対象となる機械等に該当するものとして正しいか】動力により駆動されるシャー",a:false,exp:"本肢の機械等は、法45条2項の規定による特定自主検査の対象となる機械等に「該当しない」（法45条2項、令15条1項3号、同条2項）。",src:"法45条2項、令15条1項3号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問9",opt:"C",q:"【労働安全衛生法第45条第2項に規定する「特定自主検査」（同条第1項に規定する定期自主検査のうち厚生労働省令で定める自主検査をいう。）の対象となる機械等に該当するものとして正しいか】アセチレン溶接装置及びガス集合溶接装置（これらの装置の配管のうち、地下に埋設された部分を除く。）",a:false,exp:"本肢の機械等は、法45条2項の規定による特定自主検査の対象となる機械等に「該当しない」（法45条2項、令15条1項6号、同条2項）。",src:"法45条2項、令15条1項6号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問9",opt:"D",q:"【労働安全衛生法第45条第2項に規定する「特定自主検査」（同条第1項に規定する定期自主検査のうち厚生労働省令で定める自主検査をいう。）の対象となる機械等に該当するものとして正しいか】積載荷重が0.25トン以上1トン未満のエレベーター",a:false,exp:"本肢の機械等は、法45条2項の規定による特定自主検査の対象となる機械等に「該当しない」（法45条2項、令13条3項17号、令15条2項）。",src:"法45条2項、令13条3項17号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問9",opt:"E",q:"【労働安全衛生法第45条第2項に規定する「特定自主検査」（同条第1項に規定する定期自主検査のうち厚生労働省令で定める自主検査をいう。）の対象となる機械等に該当するものとして正しいか】チェーンソー（内燃機関を内蔵するものであって、排気量が40立方センチメートル以上のものに限る。）",a:false,exp:"本肢の機械等は、法45条2項の規定による特定自主検査の対象となる機械等に「該当しない」（法45条2項、令13条3項29号、令15条2項）。",src:"法45条2項、令13条3項29号",cat:"択一式（安全衛生法）"},
