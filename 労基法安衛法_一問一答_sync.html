{no:"LEC第1回-問10",opt:"ア",q:"【労働安全衛生法の健康の保持増進のための措置に関する記述として正しいか。なお、「ストレスチェック」とは、労働安全衛生法第66条の10に規定する心理的な負担の程度を把握するための検査をいう。】事業者は、常時使用する労働者を雇い入れるときは、原則として、当該労働者に対し、労働安全衛生規則第43条各号に規定する項目について医師による健康診断を行わなければならないとされており、当該常時使用する労働者とは、期間の定めのない労働契約により使用されるものに限られている。",a:false,exp:"期間の定めのある労働契約により使用される者であっても、所定の要件を満たしている場合、事業者は、当該者に対し、則43条に規定するいわゆる雇入れ時の健康診断を「行わなければならない」（則43条、平31.1.30基発0130第1号）。",src:"則43条、平31.1.30基発0130第1号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問10",opt:"イ",q:"【労働安全衛生法の健康の保持増進のための措置に関する記述として正しいか。なお、「ストレスチェック」とは、労働安全衛生法第66条の10に規定する心理的な負担の程度を把握するための検査をいう。】事業者は、塩酸、硝酸、硫酸、亜硫酸、弗化水素、黄りんその他歯又はその支持組織に有害な物のガス、蒸気又は粉じんを発散する場所における業務に常時従事する労働者に対し、その雇入れの際、当該業務への配置替えの際及び当該業務についた後1年以内ごとに1回、定期に、歯科医師による健康診断を行なわなければならない。",a:false,exp:"事業者は、本肢の業務に常時従事する労働者に対し、その雇入れの際、当該業務への配置替えの際及び当該業務についた後「6月以内」ごとに1回、定期に、歯科医師による健康診断を行なわなければならない（令22条3項、則48条）。",src:"令22条3項、則48条",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問10",opt:"ウ",q:"【労働安全衛生法の健康の保持増進のための措置に関する記述として正しいか。なお、「ストレスチェック」とは、労働安全衛生法第66条の10に規定する心理的な負担の程度を把握するための検査をいう。】事業者は、労働安全衛生法第66条の8第4項の規定によるいわゆる長時間にわたる労働に関する面接指導の結果に係る医師の意見を勘案し、その必要があると認めるときは、当該労働者の実情を考慮して、就業場所の変更、作業の転換、労働時間の短縮、深夜業の回数の減少等の措置を講ずるほか、当該医師の意見の所轄労働基準監督署長への報告その他の適切な措置を講じなければならない。",a:false,exp:"事業者は、いわゆる長時間にわたる労働に関する面接指導の結果に係る医師の意見を勘案し、その必要があると認めるときは、当該労働者の実情を考慮して、就業場所の変更、作業の転換、労働時間の短縮、深夜業の回数の減少等の措置を講ずるほか、当該医師の意見の「衛生委員会若しくは安全衛生委員会又は労働時間等設定改善委員会」への報告その他の適切な措置を講じなければならない（法66条の8第5項）。",src:"法66条の8第5項",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問10",opt:"エ",q:"【労働安全衛生法の健康の保持増進のための措置に関する記述として正しいか。なお、「ストレスチェック」とは、労働安全衛生法第66条の10に規定する心理的な負担の程度を把握するための検査をいう。】就業規則においてストレスチェックの受検を義務付け、受検しない労働者に対して懲戒処分を行うことは、当該懲戒処分の内容が社会通念上許容される範囲を超えない限り、労働安全衛生法の趣旨に照らしても有効とされている。",a:false,exp:"就業規則においてストレスチェックの受検を義務付け、受検しない労働者に対して懲戒処分を行うことは、労働者に当該受検を義務付けていない労働安全衛生法の趣旨に照らして「行ってはならない」（法66条の10第3項、平27.5.1基発0501第7号）。",src:"法66条の10第3項、平27.5.1基発0501第7号",cat:"択一式（安全衛生法）"},
{no:"LEC第1回-問10",opt:"オ",q:"【労働安全衛生法の健康の保持増進のための措置に関する記述として正しいか。なお、「ストレスチェック」とは、労働安全衛生法第66条の10に規定する心理的な負担の程度を把握するための検査をいう。】事業者は、心臓、腎臓、肺等の疾病で労働のため病勢が著しく増悪するおそれのあるものにかかった者について、その就業を禁止しなければならず、その就業を禁止しようとするときは、あらかじめ、衛生管理者その他衛生に関する技術的事項を管理する者の意見をきかなければならない。",a:false,exp:"事業者は、心臓、腎臓、肺等の疾病で労働のため病勢が著しく増悪するおそれのあるものにかかった者の就業を禁止しようとするときは、あらかじめ、「産業医その他専門の医師」の意見をきかなければならない（法68条、則61条）。",src:"法68条、則61条",cat:"択一式（安全衛生法）"},
{type:"select",no:"LEC選択1",opt:"空欄A",context:"最高裁判所は、女性労働者の生理休暇に係る請求に関する事件において、労働基準法68条（旧67条）は所定の要件を備えた女子労働者が生理休暇を請求したときはその者を就業させてはならない旨規定しているが、その趣旨は、当該労働者が生理休暇の請求をすることによりその間の就労義務を免れ、その労務の不提供につき【A】ことを定めたにとどまり、生理休暇が有給であることまでをも保障したものではないと解するのが相当である、と判示した。",choices:["労働契約上債務不履行の責めを負うことのない", "不法行為の責めを負うことのない", "生じた損害の賠償請求をされることがない", "生じた損害は使用者が負う"],answer:"労働契約上債務不履行の責めを負うことのない",exp:"最高裁第三小法廷判決 昭60.7.16 エヌ・ビー・シー工業事件。生理休暇の請求により就労義務を免れ、その労務の不提供につき労働契約上債務不履行の責めを負うことのないことを定めたにとどまる。",src:"労基法68条、最判昭60.7.16 エヌ・ビー・シー工業事件",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択1",opt:"空欄B",context:"最高裁判所は、女性労働者の生理休暇に係る請求に関する事件において、労働基準法68条（旧67条）の趣旨は、当該労働者が生理休暇の請求をすることによりその間の就労義務を免れ、その労務の不提供につき労働契約上債務不履行の責めを負うことのないことを定めたにとどまり、【B】と解するのが相当である、と判示した。",choices:["生理休暇が有給であることまでをも保障したものではない", "使用者は、生理休暇の期間について、同法26条に規定する休業手当を支払わなければならない", "生理休暇の日数を限定することは、同法に違反するものではない", "生理であるという事由をもって生理休暇を請求できる"],answer:"生理休暇が有給であることまでをも保障したものではない",exp:"最高裁第三小法廷判決 昭60.7.16 エヌ・ビー・シー工業事件。年次有給休暇と異なり生理休暇には賃金支払の規定が置かれていないことから、生理休暇が有給であることまでをも保障したものではない。",src:"労基法68条、最判昭60.7.16 エヌ・ビー・シー工業事件",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択1",opt:"空欄C",context:"労働基準法第4章、第6章及び第6章の2で定める労働時間、休憩及び休日に関する規定は、事業の種類にかかわらず監督若しくは管理の地位にある者又は機密の事務を取り扱う者については適用しないものとされており、当該「機密の事務を取り扱う者」とは、秘書その他職務が経営者又は監督若しくは管理の地位に在る者の活動と一体不可分であって、【C】をいうものとされている。",choices:["厳格な労働時間管理になじまない者", "厳密な労働時間算定が困難な者", "常態として身体の疲労及び精神的緊張が相当に生ずる業務に従事する者", "常態として相当の手持時間が保障されている者"],answer:"厳格な労働時間管理になじまない者",exp:"労働基準法41条（労働時間等の適用除外）、昭22.9.13発基17号。「機密の事務を取り扱う者」とは、職務が経営者等の活動と一体不可分であって、厳格な労働時間管理になじまない者をいう。",src:"労基法41条、昭22.9.13発基17号",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択1",opt:"空欄D",context:"労働安全衛生規則第612条の2第1項にいう「暑熱な場所」とは、湿球黒球温度（WBGT）が【D】の場所をいい、必ずしも事業場内外の特定の作業場のみを指すものではなく、出張先で作業を行う場合、作業従事者が移動して複数の場所で作業を行う場合や、作業場所から作業場所への移動時等も含む趣旨であるとされている。",choices:["28度以上又は気温が31度以上", "30度以上", "32度以上又は気温が35度以上", "35度以上"],answer:"28度以上又は気温が31度以上",exp:"労働安全衛生規則612条の2第1項、令7.5.20基発0520第6号（熱中症による健康障害の防止措置）。「暑熱な場所」とはWBGTが28度以上又は気温が31度以上の場所をいう。",src:"安衛則612条の2第1項、令7.5.20基発0520第6号",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択1",opt:"空欄E",context:"労働安全衛生規則第612条の2第1項にいう「暑熱な場所において連続して行われる作業等熱中症を生ずるおそれのある作業」とは、当該「暑熱な場所」において、継続して【E】行われることが見込まれる作業をいうこととされている。",choices:["1時間以上又は1日当たり4時間を超えて", "2時間以上", "3時間以上又は1日当たり6時間を超えて", "4時間以上"],answer:"1時間以上又は1日当たり4時間を超えて",exp:"労働安全衛生規則612条の2第1項、令7.5.20基発0520第6号。当該作業とは、暑熱な場所において継続して1時間以上又は1日当たり4時間を超えて行われることが見込まれる作業をいう。",src:"安衛則612条の2第1項、令7.5.20基発0520第6号",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択2",opt:"空欄A",context:"最高裁判所は、企業の採用の自由に関して問題となった事件において、「労働基準法3条は労働者の【A】によって賃金その他の労働条件につき差別することを禁じているが、これは、雇入れ後における労働条件についての制限であって、雇入れそのものを制約する規定ではない。」と判示した。",choices:["信条", "性別", "年齢", "職務、能率又は技能による差異"],answer:"信条",exp:"労働基準法3条（均等待遇）。同条は労働者の信条等によって賃金その他の労働条件につき差別することを禁じているが、これは雇入れ後における労働条件についての制限であって、雇入れそのものを制約する規定ではない、とするのが最高裁判所の判例である。",src:"労基法3条",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択2",opt:"空欄B",context:"労働基準法第39条第1項において、「使用者は、その雇入れの日から起算して【B】以上出勤した労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。」と規定している。",choices:["6箇月間継続勤務し全労働日の8割", "6箇月間継続勤務し全労働日の6割", "1年間継続勤務し全労働日の8割", "1年間継続勤務し全労働日の6割"],answer:"6箇月間継続勤務し全労働日の8割",exp:"労働基準法39条1項（年次有給休暇）。雇入れの日から起算して6箇月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。",src:"労基法39条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択2",opt:"空欄C",context:"労働基準法第39条第1項において、「使用者は、その雇入れの日から起算して6箇月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、又は分割した【C】労働日の有給休暇を与えなければならない。」と規定している。",choices:["10", "5", "15", "20"],answer:"10",exp:"労働基準法39条1項（年次有給休暇）。所定の要件を満たした労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。",src:"労基法39条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択2",opt:"空欄D",context:"労働安全衛生規則第13条第1項第4号において、「常時【D】労働者を使用する事業場にあっては、2人以上の産業医を選任すること。」と規定されている。",choices:["3,000人をこえる", "3,000人以上の", "1,000人をこえる", "1,000人以上の"],answer:"3,000人をこえる",exp:"労働安全衛生規則13条1項4号。常時3,000人をこえる労働者を使用する事業場にあっては、2人以上の産業医を選任しなければならない。",src:"安衛則13条1項4号",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択2",opt:"空欄E",context:"労働安全衛生法第31条の3によると、【E】に属する事業の仕事を行う2以上の事業者又は個人事業者に係る作業従事者が一の場所において機械で厚生労働省令で定めるものに係る作業（特定作業）を行う場合において、特定作業に係る仕事を自ら行う発注者又は当該仕事の全部を請け負った者で、当該場所において当該仕事の一部を請け負わせているものは、厚生労働省令で定めるところにより、当該場所において特定作業に従事する全ての労働者の労働災害を防止するため必要な措置を講じなければならないとされている。",choices:["建設業", "製造業", "造船業", "土石採取業"],answer:"建設業",exp:"労働安全衛生法31条の3（特定作業に係る発注者等の措置）。建設業に属する事業の仕事を行う2以上の事業者等に係る作業従事者が一の場所で特定作業を行う場合の措置義務に関する規定である。",src:"安衛法31条の3",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択3",opt:"空欄A",context:"労働基準法第1条第1項において、「労働条件は、労働者が【A】を営むための必要を充たすべきものでなければならない。」と規定されている。",choices:["人たるに値する生活", "健康で充実した生活", "自立した日常生活", "希望した職業生活"],answer:"人たるに値する生活",exp:"労働基準法1条1項（労働条件の原則）。労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。",src:"労基法1条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択3",opt:"空欄B",context:"労働基準法第1条第2項において、「この法律で定める労働条件の基準は最低のものであるから、【B】は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。」と規定されている。",choices:["労働関係の当事者", "使用者及び労働者", "事業主", "政府"],answer:"労働関係の当事者",exp:"労働基準法1条2項（労働条件の決定）。労働関係の当事者は、この基準を理由として労働条件を低下させてはならないことはもとより、その向上を図るように努めなければならない。",src:"労基法1条2項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択3",opt:"空欄C",context:"労働基準法における平均賃金とは、原則として、これを算定すべき事由の発生した日以前【C】で除した金額をいう。",choices:["3箇月間にその労働者に対し支払われた賃金の総額を、その期間の総日数", "3箇月間にその労働者に対し支払われた賃金の総額を、その期間中に労働した日数", "6箇月間にその労働者に対し支払われた賃金の総額を、その期間の総日数", "6箇月間にその労働者に対し支払われた賃金の総額を、その期間中に労働した日数"],answer:"3箇月間にその労働者に対し支払われた賃金の総額を、その期間の総日数",exp:"労働基準法12条1項（平均賃金）。平均賃金とは、原則として、算定事由発生日以前3箇月間にその労働者に対し支払われた賃金の総額を、その期間の総日数で除した金額をいう。",src:"労基法12条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択3",opt:"空欄D",context:"労働安全衛生規則第97条第1項によると、事業者は、労働者が就業中等の負傷、窒息又は急性中毒（労働災害等）により死亡し、又は休業したときは、遅滞なく、所定の事項を所轄労働基準監督署長に報告しなければならないが、当該休業の日数が【D】ときは、事業者は、同項の規定にかかわらず、1月から3月まで、4月から6月まで、7月から9月まで及び10月から12月までの期間における当該事実について、それぞれの期間における最後の月の翌月末日までに、電子情報処理組織を使用して、所定の事項及び休業日数を所轄労働基準監督署長に報告しなければならない。",choices:["4日に満たない", "4日を超える", "3日に満たない", "3日を超える"],answer:"4日に満たない",exp:"労働安全衛生規則97条（労働者死傷病報告）。休業の日数が4日に満たないときは、四半期ごとにまとめて、各期間における最後の月の翌月末日までに報告する。",src:"安衛則97条",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択3",opt:"空欄E",context:"労働安全衛生規則第97条第1項によると、休業の日数が4日に満たないときは、事業者は、1月から3月まで、4月から6月まで、7月から9月まで及び10月から12月までの期間における当該事実について、それぞれの期間における最後の月の【E】までに、電子情報処理組織を使用して、所定の事項及び休業日数を所轄労働基準監督署長に報告しなければならない。",choices:["翌月末日", "翌月10日", "翌月から起算して2月を経過する", "翌月から起算して3月を経過する"],answer:"翌月末日",exp:"労働安全衛生規則97条（労働者死傷病報告）。休業日数が4日に満たない場合は四半期ごとに、各期間における最後の月の翌月末日までに報告する。",src:"安衛則97条",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択4",opt:"空欄A",context:"労働基準法第4条において、「使用者は、労働者が女性であることを理由として、【A】について、男性と差別的取扱いをしてはならない。」と規定されている。",choices:["賃金", "昇進及び降格", "教育訓練の機会", "労働条件"],answer:"賃金",exp:"労働基準法4条（男女同一賃金の原則）。使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取扱いをしてはならない。",src:"労基法4条",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択4",opt:"空欄B",context:"常時【B】人以上の労働者を使用する使用者は、労働基準法第89条に掲げる事項について就業規則を作成し、行政官庁に届け出なければならない。当該事項を変更した場合においても、同様とする。",choices:["10", "5", "30", "50"],answer:"10",exp:"労働基準法89条（作成及び届出の義務）。常時10人以上の労働者を使用する使用者は、所定の事項について就業規則を作成し、行政官庁に届け出なければならない。",src:"労基法89条",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択4",opt:"空欄C",context:"労働基準法第91条によれば、「就業規則で、労働者に対して減給の制裁を定める場合においては、その減給は、1回の額が平均賃金の1日分の【C】、総額が1賃金支払期における賃金の総額の10分の1を超えてはならない。」と規定している。",choices:["半額を超え", "3分の1を超え", "3分の2を超え", "4分の3を超え"],answer:"半額を超え",exp:"労働基準法91条（制裁規定の制限）。減給の制裁は、1回の額が平均賃金の1日分の半額を超え、総額が1賃金支払期における賃金の総額の10分の1を超えてはならない。",src:"労基法91条",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択4",opt:"空欄D",context:"労働安全衛生法第44条第1項によると、同法第42条に規定するいわゆる特定機械等以外の機械等（同法44条の2第1項に規定するいわゆる型式検定を受けるべき機械等を除く。）のうち、別表第3に掲げる機械等で政令で定めるものを製造し、又は輸入した者は、厚生労働省令で定めるところにより、厚生労働大臣の登録を受けた者が個々に行う当該機械等についての検定を受けなければならないとされており、当該検定を受けなければならない当該機械等には、【D】がある。",choices:["小型ボイラー", "プレス機械又はシャーの安全装置", "防毒マスク", "保護帽"],answer:"小型ボイラー",exp:"労働安全衛生法44条（個別検定）、別表第3。個別検定を受けなければならない機械等として小型ボイラー等がある。",src:"安衛法44条、別表第3",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択4",opt:"空欄E",context:"労働安全衛生規則第12条の6第1項によると、化学物質管理者を選任した事業者は、【E】の結果に基づく措置として、労働者に保護具を使用させるときは、保護具着用管理責任者を選任し、同項各号に掲げる事項を管理させなければならないとされている。",choices:["リスクアセスメント", "作業環境測定", "定期健康診断", "ストレスチェック"],answer:"リスクアセスメント",exp:"労働安全衛生規則12条の6第1項。化学物質管理者を選任した事業者は、リスクアセスメントの結果に基づく措置として労働者に保護具を使用させるときは、保護具着用管理責任者を選任しなければならない。",src:"安衛則12条の6第1項",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択5",opt:"空欄A",context:"労働基準法第34条第1項において、「使用者は、労働時間が【A】時間を超える場合においては少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。」と規定されている。",choices:["6時間を超える場合においては少なくとも45分、8", "4時間を超える場合においては少なくとも30分、6", "4時間を超える場合においては少なくとも45分、6", "6時間を超える場合においては少なくとも30分、8"],answer:"6時間を超える場合においては少なくとも45分、8",exp:"労働基準法34条1項（休憩）。使用者は、労働時間が6時間を超える場合は少なくとも45分、8時間を超える場合は少なくとも1時間の休憩時間を労働時間の途中に与えなければならない。",src:"労基法34条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択5",opt:"空欄B",context:"労働基準法第34条第1項に規定する休憩時間は、【B】。ただし、当該事業場に、労働者の過半数で組織する労働組合がある場合においてはその労働組合、労働者の過半数で組織する労働組合がない場合においては労働者の過半数を代表する者との書面による協定があるときは、この限りでない。",choices:["一斉に与えなければならない", "自由に利用させなければならない", "最低限の賃金が保障されたものでなければならない", "労働から解放されたものでなければならない"],answer:"一斉に与えなければならない",exp:"労働基準法34条2項（休憩の一斉付与の原則）。休憩時間は一斉に与えなければならないが、労使協定があるときはこの限りでない。",src:"労基法34条2項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択5",opt:"空欄C",context:"使用者が、労働基準法第33条又は同法第36条第1項の規定により労働時間を延長し、又は休日に労働させた場合においては、その時間又はその日の労働については、通常の労働時間又は労働日の賃金の計算額の2割5分以上【C】以下の範囲内でそれぞれ政令で定める率以上の率で計算した割増賃金を支払わなければならない。ただし、当該延長して労働させた時間が1箇月について60時間を超えた場合においては、その超えた時間の労働については、通常の労働時間の賃金の計算額の【C】以上の率で計算した割増賃金を支払わなければならない。",choices:["5割", "3割", "4割", "6割"],answer:"5割",exp:"労働基準法37条（割増賃金）。時間外・休日労働の割増賃金は通常の賃金の計算額の2割5分以上5割以下の範囲で政令で定める率以上。1箇月60時間を超える時間外労働については5割以上の率で計算する。",src:"労基法37条",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC選択5",opt:"空欄D",context:"労働安全衛生規則第151条の17によると、事業者は、原則として、フォークリフトについては、同条各号に定めるところに適合する【D】を備えたものでなければ使用してはならないとされている。",choices:["ヘッドガード", "バックレスト", "バランスウエイト", "リフトシリンダー"],answer:"ヘッドガード",exp:"労働安全衛生規則151条の17（ヘッドガード）。事業者は、原則として、所定の要件に適合するヘッドガードを備えたものでなければフォークリフトを使用してはならない。",src:"安衛則151条の17",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC選択5",opt:"空欄E",context:"労働安全衛生規則第151条の17各号に定めるフォークリフトのヘッドガードの要件として、「強度は、フォークリフトの最大荷重の2倍の値（その値が【E】トンを超えるものにあっては、【E】トン）の等分布静荷重に耐えるものであること。」が含まれている。",choices:["4", "1", "2", "3"],answer:"4",exp:"労働安全衛生規則151条の17。ヘッドガードの強度は、フォークリフトの最大荷重の2倍の値（その値が4トンを超えるものにあっては、4トン）の等分布静荷重に耐えるものであること。",src:"安衛則151条の17",cat:"選択式（安全衛生法）"},
{no:"TAC社06-問1",opt:"A",q:"労働基準法第5条は「使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して労働を強制してはならない。」と定めているが、同条に掲げられている「暴行」、「脅迫」、「監禁」以外の手段で「精神又は身体の自由を不当に拘束する手段」としては、長期労働契約、賠償額予定契約、前借金契約、強制貯金等が該当する。",a:true,exp:"設問の通り正しい。法5条は「精神又は身体の自由を不当に拘束する手段」による強制労働を禁止しており、必ずしも「不法」な手段に限られない。",src:"労基法5条、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問1",opt:"B",q:"労働基準法第6条は「何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならない。」と定めているが、同条は、使用者から利益を得る場合に限って禁止する趣旨であり、労働者又は第三者から利益を得ることを禁止するものではない。",a:false,exp:"労働者又は第三者から利益を得ることも、法6条（中間搾取の排除）により禁止される。法6条にいう「利益」は手数料・報償金・金銭以外の財物等その名称・有形無形を問わない。",src:"労基法6条、昭23.3.2基発381号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問1",opt:"C",q:"労働基準法第1条第1項は「労働条件は、労働者が人たるに値する生活を営むための必要を充たすべきものでなければならない。」と定めているが、同項の「人たるに値する生活」を営むためには、労働者本人のみでなく、その標準家族の生活をも含めて考えるべきものとされている。",a:true,exp:"設問の通り正しい。「人たるに値する生活」とは憲法25条1項の「健康で文化的」な生活を内容とするもので、標準家族の生活も含めて考えるべきものとされている。",src:"労基法1条、昭22.9.13発基17号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問1",opt:"D",q:"共同経営事業の出資者であっても、組合又は法人との間に使用従属関係があり賃金を受けて働いている場合には、労働基準法第9条の労働者である。",a:true,exp:"設問の通り正しい。共同経営事業の出資者であっても、組合又は法人との間に使用従属関係があり賃金を受けて働いている場合は、法9条の労働者に該当する。",src:"労基法9条、昭23.3.24基発498号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問1",opt:"E",q:"旅館の従業員等が客より受け取るチップは労働基準法第11条の賃金ではないが、チップに類するものであっても、使用者が奉仕料として一定率を定め、客に請求し、収納したものを、一定期間ごとに締め切って、その奉仕料の収納のあった当日に出勤した労働者に全額を均等配分している場合には、同条の賃金に該当する。",a:true,exp:"設問の通り正しい。使用者が奉仕料として一定率を定め客に請求・収納し、当日出勤した労働者に均等配分する場合は、法11条の賃金に該当する。",src:"労基法11条、昭23.2.3基発164号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問2",opt:"A",q:"解雇制限期間中にある労働者であっても、当該労働者の責に帰すべき事由がある場合においては、解雇制限が解除され、当該解雇制限期間の満了を待たずに解雇することができる。",a:false,exp:"解雇制限期間中は、労働者の責に帰すべき事由がある場合でも、法19条1項ただし書の除外事由（打切補償の支払又は天災事変等による事業継続不能で行政官庁の認定）がない限り解雇することはできない。",src:"労基法19条",cat:"択一式（労働基準法）"},
{no:"TAC社06-問2",opt:"B",q:"業務上負傷し又は疾病にかかり療養していた労働者が完全に治ゆしたのではないが、稼働し得る程度に回復したので出勤し、元の職場で平常通り稼働していたところ、使用者が就業後30日を経過した後にこの労働者を労働基準法第20条に定める解雇予告手当を支給して即時解雇した場合には、同法第19条違反には当たらない。",a:true,exp:"設問の通り正しい。療養休業中の傷病が治ゆし稼働し得る程度に回復して出勤し30日経過した場合は、解雇は制限されない。",src:"労基法19条、昭24.4.12基収1134号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問2",opt:"C",q:"解雇予告手当については、解雇の意思表示に際して支払わなければ解雇の効力を生じないものと解されるので、一般には、時効の問題は生じないとされている。",a:true,exp:"設問の通り正しい。解雇予告手当は解雇の意思表示に際して支払わなければ解雇の効力を生じないため、一般には時効の問題は生じないとされている。",src:"労基法20条、昭27.5.17基収1906号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問2",opt:"D",q:"使用者が所轄労働基準監督署長の認定を受けることなく労働者を即時解雇した場合であっても、客観的に解雇予告除外事由が存在する場合は、その即時解雇は有効に成立する。",a:true,exp:"設問の通り正しい。なお即時解雇の効力は有効に成立するが、使用者はその後に除外認定の申請を行ったとしても、法20条（解雇の予告）違反として罰則の適用を受ける。",src:"労基法20条、則7条、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問2",opt:"E",q:"解雇の予告がなされても、解雇予告期間が満了するまでは労働関係は有効に存続するのであるから、その期間中労働者は労務の提供をしなければならず、使用者はこれに対して賃金を支払わなければならない。",a:true,exp:"設問の通り正しい。解雇予告期間中も労働関係は有効に存続するため、労働者は労務を提供しなければならず、使用者はこれに対して賃金を支払わなければならない。",src:"労基法20条",cat:"択一式（労働基準法）"},
{no:"TAC社06-問3",opt:"ア",q:"使用者は、退職手当については、賃金の支払方法として、労働基準法施行規則第7条の2第1項第3号に掲げる要件を満たすものとして厚生労働大臣の指定を受けた資金移動業者（指定資金移動業者）のうち労働者が指定するものの第2種資金移動業に係る口座への資金移動（いわゆる賃金のデジタル払い）により支払うことはできない。",a:false,exp:"退職手当についても、いわゆる賃金のデジタル払いにより支払うことができる。",src:"労基則7条の2第2項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問3",opt:"イ",q:"労働者が職種や業務内容を特定せずに労働契約を締結した場合においては、現に就業を命じられた特定の業務について労務の提供が十全にはできないとしても、その能力、経験、地位、当該企業の規模、業種、当該企業における労働者の配置・異動の実情及び難易等に照らして当該労働者が配置される現実的可能性があると認められる他の業務について労務の提供をすることができ、かつ、その提供を申し出ているならば、なお債務の本旨に従った履行の提供があると解するのが相当である、とするのが最高裁判所の判例である。",a:true,exp:"設問の通り正しい。職種や業務内容を特定せずに労働契約を締結した場合の、債務の本旨に従った履行の提供に関する判例である。",src:"最判平10.4.9 片山組事件",cat:"択一式（労働基準法）"},
{no:"TAC社06-問3",opt:"ウ",q:"労働者が未成年者である場合において、使用者が賃金を労働者の親権者その他の法定代理人に支払うことは、賃金直接払の原則に違反しない。",a:false,exp:"賃金を労働者の親権者その他の法定代理人・任意代理人に支払うことは、賃金直接払の原則に違反する（未成年者であっても同様）。法59条は親権者等による未成年者の賃金の代理受領を禁止している。",src:"労基法24条1項・59条、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問3",opt:"エ",q:"賞与を支給日に在籍している者に対してのみ支給する旨のいわゆる賞与支給日在籍要件の慣行を明文化した就業規則の規定に基づき、支給日の直前に退職した者に賞与を支給しなかった事案について、賞与支給日在籍要件を定めた就業規則の規定は無効であり、支給日の直前に退職した労働者に賞与を支給しないことは、賃金全額払の原則を定めた労働基準法第24条第1項に違反する、とするのが最高裁判所の判例である。",a:false,exp:"最高裁判例では賞与支給日在籍要件を就業規則の合理性判断として有効としており、支給日前に退職した労働者に賞与を支給しないことは、賃金全額払の原則（法24条1項）に違反するものではない。",src:"労基法24条1項、最判昭57.10.7 大和銀行事件",cat:"択一式（労働基準法）"},
{no:"TAC社06-問3",opt:"オ",q:"労働基準法第25条により労働者が非常時払を請求し得る事由には、「労働者の収入によって生計を維持する者」の出産、疾病、災害等が含まれるが、ここにいう「労働者の収入によって生計を維持する者」には、親族であって独立の生計を営む者は含まれない。",a:true,exp:"設問の通り正しい。「労働者の収入によって生計を維持する者」は、扶養義務を負う親族に限らず、労働者の収入で生計を営む者であれば親族でなく同居人でも差し支えないが、独立の生計を営む者は含まれない。",src:"労基法25条、則9条",cat:"択一式（労働基準法）"},
{no:"TAC社06-問4",opt:"A",q:"常時10人以上の労働者を使用する事業場において労働基準法第32条の3に定めるいわゆるフレックスタイム制を採用する場合は、就業規則にその労働者に係る始業及び終業の時刻をその労働者の決定に委ねることを定めなければならない。",a:true,exp:"設問の通り正しい。フレックスタイム制を採用する場合、就業規則に、その労働者に係る始業及び終業の時刻をその労働者の決定に委ねる旨を定めなければならない。",src:"労基法32条の3第1項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問4",opt:"B",q:"フレックスタイム制が適用される1週間の所定労働日数が5日の労働者について、労使協定により、労働時間の限度について、当該清算期間における所定労働日数を1日の法定労働時間に乗じて得た時間とする旨を定めたときは、清算期間として定められた期間を平均し1週間当たりの労働時間が当該清算期間における日数を7で除して得た数をもってその時間を除して得た時間を超えない範囲内において、1週間又は1日において法定労働時間を超えて、労働させることができる。",a:true,exp:"設問の通り正しい。完全週休2日制の下でのフレックスタイム制において、曜日のめぐりによっては法定労働時間の総枠を超える場合があるために設けられた規定である。",src:"労基法32条の3第3項、平30.9.7基発0907第1号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問4",opt:"C",q:"労働基準法第32条の4に定めるいわゆる1年単位の変形労働時間制を採用する場合は、労使協定に対象期間における労働日及び当該労働日ごとの労働時間を定めなければならないが、例えば「7月から9月までの間に労働者の指定する3日間について休日を与える」と定めたうえで、対象期間開始後に労働者に休日を特定させることは、労働日が特定されたことにはならない。",a:true,exp:"設問の通り正しい。労働者に休日を特定させる方式では、労働日が特定されたことにはならない。",src:"労基法32条の4第1項4号、平6.5.31基発330号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問4",opt:"D",q:"1年単位の変形労働時間制の対象期間は、「1箇月を超え1年以内の期間に限るものとする」とされていることから、例えば1年間のうち2箇月間だけ1年単位の変形労働時間制を適用することもできる。",a:true,exp:"設問の通り正しい。対象期間は1箇月を超え1年以内の期間に限られるため、1年間のうち2箇月間だけ適用することもできる。",src:"労基法32条の4第1項・4項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問4",opt:"E",q:"常時8人の労働者を使用する小売業の事業場において労働基準法第32条の5に定めるいわゆる1週間単位の非定型的変形労働時間制を採用する場合は、1週間の所定労働時間の合計が44時間となる範囲において、1日について10時間まで労働させることができる。",a:false,exp:"1週間単位の非定型的変形労働時間制を採用する場合には1週44時間の労働時間の特例は適用されないため、設問の小売業（常時10人未満の商業）であっても、1週間の労働時間の限度は40時間となる（1日の限度は10時間）。",src:"労基法32条の5第1項、則12条の5",cat:"択一式（労働基準法）"},
{no:"TAC社06-問5",opt:"A",q:"労働基準法第32条第2項は、「使用者は、1週間の各日については、労働者に、休憩時間を除き1日について8時間を超えて、労働させてはならない。」と定めているが、ここにいう「1日」とは、原則として、所定労働時間の始業時刻を起算点とした継続した24時間をいう。",a:false,exp:"「1日」とは、原則として、午前0時から午後12時までの暦日24時間をいう。なお1勤務が2暦日にわたる場合は、当該勤務は始業時刻の属する日の労働として、当該日の「1日」の労働とする。",src:"労基法32条2項、昭63.1.1基発1号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問5",opt:"B",q:"使用者が自由意思によって行う労働者の技術水準向上のための技術教育を、法定労働時間外に実施する場合の、労働基準法第36条第1項の適用に関しては、その教育に参加することについて、就業規則上の制裁等の不利益取扱による出席の強制がなく自由参加のものであれば、同項の時間外労働とはならない。",a:true,exp:"設問の通り正しい。就業規則上の制裁等の不利益取扱による出席の強制がなく、自由参加の技術教育であれば、時間外労働とはならない。",src:"労基法32条・36条1項、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問5",opt:"C",q:"定期路線トラック業者において、運転手に対して路線運転業務の他、貨物の積込、積卸を行わせることとし、小口の貨物が逐次持ち込まれるのを待機する意味でトラック出発時刻の数時間前に出勤を命じている場合、現実に貨物の積込を行う以外の時間は全く労働の提供はなく、いわゆる手待ち時間がそれの大半を占めていたとしても、出勤を命ぜられ、一定の場所に拘束されている以上労働時間と解される。",a:true,exp:"設問の通り正しい。いわゆる手待ち時間も、出勤を命ぜられ一定の場所に拘束されている以上、労働時間と解される。",src:"労基法32条、昭33.10.11基収6286号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問5",opt:"D",q:"所定労働時間が6時間である労働者について、労働時間を延長して12時間労働させた場合においては、所定労働時間の途中に与えられる休憩時間も含めて、少なくとも1時間の休憩時間を与えなければならない。",a:true,exp:"設問の通り正しい。法34条の「労働時間」は実労働時間をいう。所定労働時間中に45分の休憩を与えていた場合は15分追加すれば足り、1時間与えていた場合は追加して与える必要はない。",src:"労基法34条、昭26.10.23基収5058号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問5",opt:"E",q:"日曜日と月曜日が所定休日である事業場においては、使用者が、労働者を日曜日に労働させたとしても、その週の月曜日の休日が確保されている限り、労働基準法第35条には違反しない。",a:true,exp:"設問の通り正しい。1週間に所定休日が2回ある場合、そのうちの1回について労働させたとしても、法35条（休日）違反とはならない。",src:"労基法35条、昭23.12.18基収3970号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問6",opt:"ア",q:"労働基準法第33条第3項の定めにより国家公務員及び地方公務員に時間外労働又は休日労働をさせる場合であっても、満18歳に満たない者については、午後10時から午前5時まで（厚生労働大臣が必要であると認める場合においては、その定める地域又は期間については午後11時から午前6時まで）の間に労働させることはできない。",a:true,exp:"設問の通り正しい。公務のため臨時の必要がある場合であっても、満18歳に満たない者に深夜業をさせることはできない（非常災害の場合は認められる）。",src:"労基法33条3項・61条",cat:"択一式（労働基準法）"},
{no:"TAC社06-問6",opt:"イ",q:"労働基準法第36条第5項は、同条第1項の協定において、通常予見することのできない業務量の大幅な増加等に伴い臨時的に同条第3項の限度時間を超えて労働させる必要がある場合における特別の条項を設けることができることとされているが、当該特別の条項を設ける場合には、1箇月及び1年について、それぞれ、「労働時間を延長して労働させ、及び休日において労働させることができる時間」を定めなければならない。",a:false,exp:"特別の条項を設ける場合、1箇月について「労働時間を延長して労働させ、及び休日において労働させることができる時間」並びに1年について「労働時間を延長して労働させることができる時間」を定めなければならない（1年について定める時間には休日労働の時間は含まれない）。",src:"労基法36条5項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問6",opt:"ウ",q:"時間外・休日労働協定の締結当事者たる労働者の過半数を代表する者は、労働基準法第41条第2号に定める監督又は管理の地位にある者でないことが要件とされる。",a:true,exp:"設問の通り正しい。過半数代表者は、法41条2号に定める監督又は管理の地位にある者でないことが要件とされる。",src:"労基則6条の2第1項1号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問6",opt:"エ",q:"労働者を午後10時から午前5時まで（厚生労働大臣が必要であると認める場合においては、その定める地域又は期間については午後11時から午前6時まで）の間において労働させるためには、時間外・休日労働協定を締結しなければならない。",a:false,exp:"時間外・休日労働協定を締結していない場合であっても、深夜業をさせることができる。",src:"労基法36条1項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問6",opt:"オ",q:"労働基準法第38条の3に定めるいわゆる専門業務型裁量労働制に関する労使協定で1日当たりの時間数を8時間と定めている事業場において、当該専門業務型裁量労働制により労働する労働者が、1日について実労働時間で12時間労働するためには、時間外・休日労働協定を締結しなければならない。",a:false,exp:"設問の者は1日の実労働時間にかかわらず1日について8時間労働したものとみなされるため、実労働時間で12時間労働しても1日8時間を超えて労働させたことにはならない。みなしの1週間の労働時間が法定労働時間を超えない限り、協定の締結は不要。",src:"労基法32条2項・38条の3",cat:"択一式（労働基準法）"},
{no:"TAC社06-問7",opt:"ア",q:"使用者が労働基準法第39条第9項に違反して年次有給休暇の賃金を支払わなかった場合において、当該違反のあった時から3年以内に労働者から裁判所に対して請求があったときは、裁判所は、当該使用者に対して、同項の定めにより使用者が支払わなければならない金額についての未払金のほか、これと同一額の付加金の支払を命ずることができる。",a:true,exp:"設問の通り正しい。付加金の請求は、当分の間、違反のあった時から3年以内に限られる。",src:"労基法114条、附則143条2項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問7",opt:"イ",q:"会社が合併したことにより労働関係の当事者が交替した場合には、労働基準法第39条第1項に定める「継続勤務」の計算においては、合併の前後の期間は通算されない。",a:false,exp:"会社の合併では、合併前の会社とその労働者の間の労働関係も合併後の会社との間に当然承継され勤務関係も継続するため、「継続勤務」の計算において合併の前後の期間は通算される。",src:"労基法39条1項、昭24.1.25基収168号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問7",opt:"ウ",q:"労働者が業務上負傷したことにより休業した期間は、労働基準法第39条第1項の「使用者は、その雇入れの日から起算して6箇月間継続勤務し全労働日の8割以上出勤した労働者に対して、継続し、又は分割した10労働日の有給休暇を与えなければならない。」の適用においては、全労働日に含めないこととされている。",a:false,exp:"労働者が業務上負傷したことにより休業した期間は、法39条1項の適用において出勤したものとみなされる（全労働日にも含まれる）。",src:"労基法39条1項・10項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問7",opt:"エ",q:"労働者の年次有給休暇の請求（時季指定）に対する使用者の時季変更権の行使が労働者の指定した休暇期間が開始し又は経過した後にされた場合は、労働者の休暇の請求自体がその指定した休暇期間の始期にきわめて接近してされたため使用者において時季変更権を行使するか否かを事前に判断する時間的余裕がなかったような事情があったとしても、その時季変更権の行使は違法といわざるを得ない、とするのが最高裁判所の判例である。",a:false,exp:"判例では、事前にされなかったことのゆえに直ちに時季変更権の行使が不適法となるものではなく、客観的に時季変更権を行使しうる事由が存し、かつその行使が遅滞なくされたものである場合には、適法な時季変更権の行使があったものとしてその効力を認めるのが相当としている。",src:"最判昭57.3.18 此花電報電話局事件",cat:"択一式（労働基準法）"},
{no:"TAC社06-問7",opt:"オ",q:"使用者は、令和7年10月1日（労働基準法第39条第7項にいう基準日であるものとする。）に付与した年次有給休暇の日数が10労働日である労働者に対して、同日から令和8年9月30日までの期間に同条第5項の定めにより日を単位として2日、同条第6項の定めにより3日の年次有給休暇を与えている場合には、同期間内においては、同条第7項の定めにより、使用者が時季を定めることにより年次有給休暇を与える必要はない。",a:true,exp:"設問の通り正しい。使用者の時季指定により与える年休は原則5日であるが、法39条5項（時季指定・変更）又は6項（計画的付与）により与えた日数分（5日を上限）は時季指定を要しない。設問は合計5日付与済みのため、使用者が時季を定める必要はない。",src:"労基法39条7項・8項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問8",opt:"A",q:"妊娠中の女性が妊娠中絶をした場合には、妊娠4箇月以上の分娩であっても、労働基準法第65条第2項に定める産後休業の規定は適用されない。",a:false,exp:"「出産」とは妊娠4箇月以上の分娩をいい、生産のみならず流産・死産・妊娠中絶も含まれる。したがって設問の妊娠中絶の場合も、産後休業の規定が適用される。",src:"労基法65条2項、昭26.4.2婦発113号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問8",opt:"B",q:"労働基準法第66条第3項は「使用者は、妊産婦が請求した場合においては、深夜業をさせてはならない。」と定めているが、同項の定めは同法第41条により同法の労働時間等に関する規定の適用が除外されている者については、適用されない。",a:false,exp:"法41条にいう「労働時間」には深夜業を含まないと解されるため、法41条該当者についても法66条3項の深夜業の規定は適用される。したがって法41条に該当する妊産婦が請求した場合には、深夜業をさせてはならない。",src:"労基法41条・66条3項、昭61.3.20基発151号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問8",opt:"C",q:"労働基準法第68条は「使用者は、生理日の就業が著しく困難な女性が休暇を請求したときは、その者を生理日に就業させてはならない。」と定めているが、同条の休暇の請求は、必ずしも暦日単位で行わなければならないものではなく、女性が半日単位又は時間単位で請求した場合には、使用者はその範囲で就業させなければ足りる。",a:true,exp:"設問の通り正しい。生理休暇の請求は必ずしも暦日単位で行う必要はなく、半日単位又は時間単位で請求した場合は、使用者はその範囲で就業させなければ足りる。",src:"労基法68条、昭61.3.20基発151号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問8",opt:"D",q:"生後満1年に達しない生児を育てる男性労働者は、労働基準法第67条の育児時間を請求することができる。",a:false,exp:"男性労働者は育児時間の取得を請求できない。法67条1項は「生後満1年に達しない生児を育てる女性は、第34条の休憩時間のほか、1日2回各々少なくとも30分、その生児を育てるための時間を請求することができる。」と定めている。",src:"労基法67条1項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問8",opt:"E",q:"妊娠3箇月の女性が、使用者に対して他の軽易な業務に転換することを請求した場合であっても、使用者は、これに応じる必要はない。",a:false,exp:"法65条3項は「使用者は、妊娠中の女性が請求した場合においては、他の軽易な業務に転換させなければならない。」と定めているため、設問のように妊娠3箇月の女性から請求があった場合も、使用者は軽易な業務に転換させなければならない（妊娠4箇月以上である必要はない）。",src:"労基法65条3項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問9",opt:"A",q:"一の企業がA工場（常時使用する労働者の数は7人）と、B工場（常時使用する労働者の数は6人）の2つの工場をもっており、これら2つの工場がそれぞれ独立した事業場と考えられる場合には、A工場とB工場のいずれの使用者も、就業規則の作成義務を負わない。",a:true,exp:"設問の通り正しい。就業規則の作成義務の要件である「常時10人以上の労働者を使用する」は企業単位ではなく事業場単位でみる。独立した事業場と考えられる場合、いずれも10人以上を満たさず作成義務を負わない。",src:"労基法89条",cat:"択一式（労働基準法）"},
{no:"TAC社06-問9",opt:"B",q:"労働基準法第92条第1項は「就業規則は、法令又は当該事業場について適用される労働協約に反してはならない。」と定めているが、同法第89条による就業規則の作成義務がない使用者が、同条の趣旨に鑑み就業規則を作成した場合においては、同項の規定の適用を受けない。",a:false,exp:"法89条による就業規則の作成義務のない使用者が作成した就業規則も、法92条（法令及び労働協約との関係）の規定の適用を受ける（法91条・93条の定めも適用される）。",src:"労基法89条・92条1項",cat:"択一式（労働基準法）"},
{no:"TAC社06-問9",opt:"C",q:"労働基準法第89条による就業規則の作成義務のある使用者が、いわゆる相対的必要記載事項のうち当該事業場が適用を受けるべき事項の記載を欠いている就業規則を作成し、これを所轄労働基準監督署長に届け出た場合は、同条の義務を果たしたことにならない。",a:true,exp:"設問の通り正しい。法89条の「作成」は法に定める必要事項をすべて含むものを作成することを意味し、相対的必要記載事項であっても当該事業場が適用を受けるべき事項を欠けば、作成の義務を果たしたとはいえず処罰の対象となり得る。",src:"労基法89条、則49条1項、平11.3.31基発168号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問9",opt:"D",q:"就業規則の記載事項として労働基準法第89条第1号に定める「始業及び終業の時刻」とは、当該事業場における所定労働時間の開始時刻と終了時刻をいうものであり、例えば「1日8時間とする」というような規定だけでは同号の要件を満たさない。",a:true,exp:"設問の通り正しい。「始業及び終業の時刻」とは所定労働時間の開始時刻と終了時刻をいうものであり、「1日8時間とする」というような規定だけでは同号の要件を満たさない。",src:"労基法89条1号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問9",opt:"E",q:"労働者に対する制裁として賞与から減額することは、賞与も賃金であることから、労働基準法第91条の制裁規定の制限の規定が適用され、その減給は、1回の事由については平均賃金の1日分の半額を超えてはならず、また、総額については一賃金支払期における賃金の総額の10分の1を超えてはならない。",a:true,exp:"設問の通り正しい。賞与からの減額も、賞与が賃金であることから、法91条の制裁規定の制限（1回の額は平均賃金1日分の半額、総額は一賃金支払期の賃金総額の10分の1まで）が適用される。",src:"労基法91条、昭63.3.14基発150号",cat:"択一式（労働基準法）"},
{no:"TAC社06-問10",opt:"A",q:"事業者は、立旋盤、プレーナー等を使用する作業場において作業に従事する作業従事者を運転中の立旋盤、プレーナー等のテーブルに乗せてはならない。ただし、テーブルに乗った者又は操作盤に配置された者が、直ちに機械を停止することができるときは、この限りでない。",a:true,exp:"設問の通り正しい。運転中の立旋盤、プレーナー等のテーブルに作業従事者を乗せてはならないが、直ちに機械を停止することができるときはこの限りでない。",src:"安衛法20条1号、安衛則116条1項",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問10",opt:"B",q:"事業者は、研削といしについては、その日の作業を開始する前には1分間以上、研削といしを取り替えたときには3分間以上試運転をしなければならない。",a:true,exp:"設問の通り正しい。研削といしについては、その日の作業開始前には1分間以上、研削といしを取り替えたときには3分間以上試運転をしなければならない。",src:"安衛法20条1号、安衛則118条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問10",opt:"C",q:"事業者は、動力により駆動される機械に作業中の労働者の頭髪又は被服が巻き込まれるおそれのあるときは、当該労働者に適当な作業帽又は作業服を着用させなければならない。",a:true,exp:"設問の通り正しい。動力により駆動される機械に作業中の労働者の頭髪又は被服が巻き込まれるおそれのあるときは、適当な作業帽又は作業服を着用させなければならない。",src:"安衛法20条1号、安衛則110条1項",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問10",opt:"D",q:"事業者は、繊維ロープを貨物自動車の荷掛けに使用するときは、その日の使用を開始する前に、当該繊維ロープを点検し、異常を認めたときは、14日以内に取り替えなければならない。",a:false,exp:"設問の場合は「14日以内に取り替えなければならない」ではなく、「直ちに取り替えなければならない」と規定されている。",src:"安衛法20条1号、安衛則151条の69",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問10",opt:"E",q:"事業者は、木材加工用丸のこ盤（横切用丸のこ盤その他反ぱつにより労働者に危険を及ぼすおそれのないものを除く。）には、割刃その他の反ぱつ予防装置を設けなければならない。",a:true,exp:"設問の通り正しい。木材加工用丸のこ盤（反ぱつにより労働者に危険を及ぼすおそれのないものを除く。）には、割刃その他の反ぱつ予防装置を設けなければならない。",src:"安衛法20条1号、安衛則122条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問11",opt:"A",q:"事業者は、労働者を常時就業させる場所（感光材料を取り扱う作業場、坑内の作業場その他特殊な作業を行う作業場を除く。）の作業面の照度を一定の基準に適合させなければならず、精密な作業を行う作業面の照度は、150ルクス以上にしなければならないとされている。",a:false,exp:"「精密な作業」を行う作業面の照度は「300ルクス以上」にしなければならない（普通の作業は150ルクス以上、粗な作業は70ルクス以上）。",src:"安衛則604条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問11",opt:"B",q:"元方事業者は、関係請負人又は関係請負人に係る作業従事者が、当該仕事に関し、労働安全衛生法又はこれに基づく命令の規定に違反していると認めるときは、必要な指導を行わなければならない。",a:false,exp:"設問の場合は規定に違反しているので、「必要な指導を行わなければならない」ではなく、「是正のため必要な指示を行わなければならない」である。なお法29条1項は、違反しないよう必要な指導を行わなければならないとしている。",src:"安衛法29条2項",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問11",opt:"C",q:"製造業その他政令で定める業種に属する事業（特定事業を除く。）の元方事業者は、その労働者である作業従事者及び関係請負人に係る作業従事者の作業が同一の場所において行われることによって生ずる労働災害を防止するため、協議組織の設置及び運営を行うことに関する措置その他必要な措置を講じなければならない。",a:false,exp:"設問の製造業等の元方事業者は「作業間の連絡及び調整を行うこと」に関する措置等を講じなければならない。「協議組織の設置及び運営」は特定元方事業者の講ずべき措置である。なお「政令で定める業種」は現在定められておらず、製造業（造船業を除く。）の元方事業者のみが該当する。",src:"安衛法30条の2第1項",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問11",opt:"D",q:"建築物で、政令で定めるもの（事務所、工場その他の事業の用に供される建築物）を事業を行う者に貸与する者（建築物貸与者）は、当該建築物の貸与を受けた者の事業に係る当該建築物による労働災害を防止するため必要な措置を講じなければならないが、当該建築物（3階建て）の1階を事業者甲に、2階を個人事業者乙に、3階を個人事業者丙に貸与するときは、当該必要な措置を講じる必要はない。",a:false,exp:"建築物貸与者は必要な措置を講じなければならないが、当該建築物の全部を一の事業者若しくは個人事業者に貸与するとき、又は2以上の個人事業者のみに貸与するときはこの限りでない。設問は1階を事業者甲、2階を個人事業者乙、3階を個人事業者丙に貸与しているので、必要な措置を講じなければならない。",src:"安衛法34条、令11条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問11",opt:"E",q:"機械等で、政令で定めるもの（車両系建設機械等）を事業を行う者に貸与する者で、厚生労働省令で定めるもの（機械等貸与者）は、当該機械等の貸与を受けた事業を行う者の事業場における当該機械等による労働災害を防止するため必要な措置を講じなければならない。",a:true,exp:"設問の通り正しい。なお機械等貸与者から機械等の貸与を受けた者は、当該機械等を操作する者がその使用する労働者でないときは、当該機械等の操作による労働災害を防止するため必要な措置を講じなければならない。",src:"安衛法33条1項、令10条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問12",opt:"A",q:"【労働安全衛生法第37条第1項の特定機械等（労働安全衛生法施行令に掲げる機械等）に該当するものとして正しいか】つり上げ荷重が2トン以上のデリック。",a:true,exp:"設問のデリックは特定機械等に該当する。デリックはつり上げ荷重が2トン以上のものが特定機械等とされる。",src:"安衛法37条1項、令12条1項5号",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問12",opt:"B",q:"【労働安全衛生法第37条第1項の特定機械等（労働安全衛生法施行令に掲げる機械等）に該当するものとして正しいか】最大荷重が1トン以上のフォークリフト。",a:false,exp:"設問の「最大荷重が1トン以上のフォークリフト」は労働安全衛生法施行令に掲げられていない。つまり特定機械等に該当しない。",src:"安衛法37条1項、令12条",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問12",opt:"C",q:"【労働安全衛生法第37条第1項の特定機械等（労働安全衛生法施行令に掲げる機械等）に該当するものとして正しいか】積載荷重が1トン以上のエレベーター（簡易リフト及び建設用リフトを除く。）。",a:true,exp:"設問のエレベーターは特定機械等に該当する（積載荷重が1トン以上のもの。簡易リフト及び建設用リフトを除く。）。",src:"安衛法37条1項、令12条1項6号",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問12",opt:"D",q:"【労働安全衛生法第37条第1項の特定機械等（労働安全衛生法施行令に掲げる機械等）に該当するものとして正しいか】ガイドレール（昇降路を有するものにあっては、昇降路）の高さが18メートル以上の建設用リフト（積載荷重が0.25トン未満のものを除く。）。",a:true,exp:"設問の建設用リフトは特定機械等に該当する（ガイドレール等の高さが18メートル以上のもの。積載荷重が0.25トン未満のものを除く。）。",src:"安衛法37条1項、令12条1項7号",cat:"択一式（安全衛生法）"},
{no:"TAC社06-問12",opt:"E",q:"【労働安全衛生法第37条第1項の特定機械等（労働安全衛生法施行令に掲げる機械等）に該当するものとして正しいか】ゴンドラ。",a:true,exp:"設問のゴンドラは特定機械等に該当する。",src:"安衛法37条1項、令12条1項8号",cat:"択一式（安全衛生法）"},
{type:"select",no:"LEC第2回-問1",opt:"正しい記述",context:"X事業場の使用者X及びY事業場の使用者Yと以下の所定労働日及び所定労働時間等で労働契約をそれぞれ締結した労働者Zについて、当該所定労働日に以下の所定外労働が発生した場合における労働基準法第37条に規定する割増賃金に関する次の記述のうち、正しいものはどれか。なお、X事業場の使用者X及びY事業場の使用者Yともに、①自らの下での労働時間に加え、他の使用者の事業場での労働時間も労働者からの申告等により把握し、②同一の労働時間制度（1週40時間、1日8時間）を採用し、③日曜日から土曜日までの暦週を採用しているものとし、本問に記載されていないことについて考慮しないものとする。〔X事業場に係る労働〕労働契約の締結日：令和8年4月1日（水）、所定労働日：令和8年4月5日（日）、所定労働時間：1日4時間（15:00〜19:00）、発生した所定外労働：1時間（19:00〜20:00）。〔Y事業場に係る労働〕労働契約の締結日：令和8年4月3日（金）、所定労働日：令和8年4月5日（日）、所定労働時間：1日3時間（8:00〜11:00）、発生した所定外労働：2時間（11:00〜13:00）。",choices:["使用者X及び使用者Yは、当該所定労働日に係る2時間の時間外労働について、各事業場に係る通常の労働時間の賃金の計算額を合算した額を2で除した額の2割5分以上の率で計算した割増賃金を労働者Zにそれぞれ支払わなければならない。", "使用者X及び使用者Yは、当該所定労働日について、ともに割増賃金を労働者Zに支払うことを要しない。", "使用者Xは、X事業場で行う1時間の所定外労働（19:00〜20:00）について、使用者Yは、Y事業場で行う1時間の所定外労働（12:00〜13:00）について、割増賃金を労働者Zにそれぞれ支払わなければならない。", "使用者Xは、当該所定労働日に係る2時間の時間外労働（18:00〜20:00）について、割増賃金を労働者Zに支払わなければならない。", "使用者Yは、Y事業場で行う2時間の所定外労働（11:00〜13:00）について、割増賃金を労働者Zに支払わなければならない。"],answer:"使用者Xは、X事業場で行う1時間の所定外労働（19:00〜20:00）について、使用者Yは、Y事業場で行う1時間の所定外労働（12:00〜13:00）について、割増賃金を労働者Zにそれぞれ支払わなければならない。",exp:"副業・兼業の場合の労働時間は、まず「労働契約の締結の先後の順」に所定労働時間を通算し、次に「所定外労働の発生順」に所定外労働時間を通算する。通算の結果、法定労働時間を超える部分のうち、各使用者が自ら労働させた時間について割増賃金を支払う。本問では①X事業場の所定労働時間（4時間）→②Y事業場の所定労働時間（3時間）→③Y事業場の所定外労働時間（2時間）→④X事業場の所定外労働時間（1時間）の順に通算し、①＋②＋（③のうち1時間）で1日の法定労働時間（8時間）に達する。したがって、使用者XはX事業場で行う1時間の所定外労働（19:00〜20:00）について、使用者YはY事業場で行う1時間の所定外労働（12:00〜13:00）について、割増賃金を支払わなければならない。正解はC（厚生労働省「副業・兼業のガイドライン」Q&A）。",src:"労基法37条",cat:"選択式（労働基準法）"},
{no:"LEC第2回-問2",opt:"A",q:"令和4年4月1日に雇い入れられた労働者X（労働基準法第39条第3項の規定（いわゆる年次有給休暇の比例付与）が適用されるものとする。）は、令和7年9月30日において3労働日の年次有給休暇を有していたところ、同年10月1日に8労働日の年次有給休暇が新たに付与された。同年10月1日において、労働基準法第39条第7項の規定（いわゆる年次有給休暇の使用者による時季指定付与）が適用される労働者にXが該当することから、当該使用者は、Xに対して、原則として、Xが有する11労働日の年次有給休暇のうち5労働日について、同年10月1日から令和8年9月30日までの期間にその時季を定めることにより年次有給休暇を与えなければならない。",a:false,exp:"本肢の場合、労働者Xに対して、法39条7項（使用者による時季指定付与）の規定は「適用されない」（平30.12.28基発1228第15号）。同項の規定は、基準日に付与される年次有給休暇の日数が10労働日以上である労働者について適用される。本肢の基準日（令和7年10月1日）に付与される年次有給休暇が10労働日未満であるXには適用されない。",src:"労基法39条7項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問2",opt:"B",q:"令和8年4月1日に雇い入れられた労働者Xは、同日に分割付与として5労働日の年次有給休暇が付与され、同年10月1日にさらに5労働日を付与されることとされていた（これ以外に特別の有給休暇はないものとする。）。この場合において、同年4月1日にXに付与した5労働日の年次有給休暇について、当該使用者は、労働基準法第39条第6項に規定するいわゆる年次有給休暇の計画的付与として、Xに対して、同年8月3日から7日までの間に年次有給休暇を付与することができる。",a:false,exp:"本肢の場合、令和8年8月3日から7日までの期間について、使用者は計画的に付与することは「できない」（平6.5.31基発330号）。法39条6項の計画的付与は「5労働日を超える部分」が対象とされており、同年8月3日時点で5労働日の年次有給休暇しか付与されていないXに対して計画的に付与することはできない。",src:"労基法39条6項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問2",opt:"C",q:"労働基準法第39条第1項から第3項までの規定による年次有給休暇の期間について、就業規則により所定労働時間労働した場合に支払われる通常の賃金を支払うこととしている事業場において、労働基準法第32条の2に規定する1箇月単位の変形労働時間制を採用していることにより各日の所定労働時間が異なっている場合、当該事業場の使用者は、賃金が時給制によって定められている労働者に対して、当該変形労働時間制の期間中における年次有給休暇期間については、各日の所定労働時間に応じて算定される賃金を支払わなければならない。",a:true,exp:"本肢のとおりである（法39条9項、昭63.3.14基発150号）。",src:"労基法39条9項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問2",opt:"D",q:"労働基準法第39条第4項に規定するいわゆる時間単位の年次有給休暇を採用するにあたって、使用者は、少なくとも、労使協定に年次有給休暇の利用目的を基準とした時間単位の年次有給休暇の対象労働者の範囲を定めなければならない。",a:false,exp:"法39条4項に規定する時間単位の年次有給休暇を採用するにあたって、使用者は、年次有給休暇の利用目的によって時間単位の年次有給休暇の対象労働者の範囲を定めることは「できない」（法39条4項、平21.5.29基発0529001号ほか）。",src:"労基法39条4項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問2",opt:"E",q:"労働基準法第39条第1項（年次有給休暇の付与要件）に規定される「継続勤務」の判断にあたっては勤務の実態に即し実質的に判断すべきものとされており、労働者が出向をした場合には、在籍型出向及び移籍型出向の別にかかわらず、出向前及び出向後の在籍期間を通算して、当該継続勤務の期間を判断しなければならない。",a:false,exp:"本肢の「継続勤務」とは、労働契約の存続期間、すなわち在籍期間をいうことから、通常、出向元との労働関係はいったん消滅し、労働関係が新たに出向先との間に成立する移籍型出向については、「移籍型出向の出向前と出向後の在籍期間は通算されない」（昭63.3.14基発150号ほか）。",src:"労基法39条1項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問3",opt:"ア",q:"労働基準法第15条第1項の規定に基づいて明示しなければならない労働条件には「就業の場所及び従事すべき業務の変更の範囲」が含まれており、当該就業の場所及び従事すべき業務とは、労働者が通常就業することが想定されている就業の場所及び労働者が通常従事することが想定されている業務をいうことから、配置転換及び在籍型出向が命じられた場合の当該配置転換及び在籍型出向先の場所及び業務はこれに含まれる。",a:true,exp:"本肢のとおりである（労働基準法施行規則5条1項1号の3、令5.10.12基発1012第2号）。",src:"労基法15条1項・則5条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問3",opt:"イ",q:"「被上告会社が営業担当社員に対し退職後の同業他社への就職をある程度の期間制限することは、社員の職業の自由等を不当に拘束するものと解すべきである。したがって、被上告会社がその退職金規則において、右制限に反して同業他社に就職した退職社員に支給すべき退職金につき、支給額を一般の自己都合による退職の場合の半額と定めることは、本件退職金が功労報償的な性格を併せ有していたとしても、合理性のない措置であると解すべきである。」とするのが、最高裁判所の判例である。",a:false,exp:"最高裁判例によると、「被上告会社が営業担当社員に対し退職後の同業他社への就職をある程度の期間制限することをもって直ちに社員の職業の自由等を不当に拘束するものとは認められず」、したがって、支給額を一般の自己都合による退職の場合の半額と定めることも、本件退職金が功労報償的な性格を併せ有することにかんがみれば、合理性のない措置であるとすることは「できない」とされている（最高裁第二小法廷判決 昭52.8.9 三晃社事件）。",src:"三晃社事件（最判昭52.8.9）",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問3",opt:"ウ",q:"使用者が、労働基準法第56条（最低年齢）の規定に違反して児童を違法に使用している場合には、このような違法な状態の継続を認めないとの趣旨から、労働基準法第20条（解雇の予告）の規定を適用せず、使用者は当該児童を即時解雇しなければならないこととされている。",a:false,exp:"法56条（最低年齢）に違反する無効な労働契約の下に就労している場合であっても、事実上の労働関係が成立していると認められる限り、法20条（解雇の予告）が「適用され」、違法状態の継続を認めない建前から、使用者は「平均賃金の30日分以上の解雇予告手当を支払って」当該児童を即時解雇しなければならない（法20条、昭23.10.18基収3102号ほか）。",src:"労基法20条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問3",opt:"エ",q:"解雇する日の30日前に労働基準法第20条に規定する解雇の予告をした場合であって、当該解雇の予告に係る期間満了の直前にその労働者が業務上負傷し又は疾病にかかり療養のために休業をしたときにおいて、当該解雇の予告は、当該休業の期間にかかわらず、その効力を失ったものと解されることから、治ゆした日に改めて解雇の予告をする必要がある。",a:false,exp:"本肢の場合であって、当該解雇予告期間満了の直前にその労働者が業務上負傷し又は疾病にかかり療養のために休業をしたときであっても、前の解雇の予告の効力の発生自体は中止されるだけであるから、休業期間が長期にわたり、解雇の予告として効力を失うものと認められる場合を除き、治ゆした日に「改めて解雇の予告をする必要はない」（昭26.6.25基収2609号）。",src:"労基法20条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問3",opt:"オ",q:"使用者が前借金その他労働することを条件とする前貸の債権と賃金を相殺することは労働基準法第17条において禁じられているが、例えば、使用者が労働組合との労働協約の締結あるいは労働者からの申出に基づき、生活必需品の購入等のための生活資金を貸付け、その後この貸付金を賃金より分割控除する場合においても、その貸付の原因、期間、金額、金利の有無等を総合的に判断して労働することが条件となっていないことが極めて明白な場合には、同条の規定は適用されないこととされている。",a:true,exp:"本肢のとおりである（法17条、昭63.3.14基発150号）。",src:"労基法17条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問4",opt:"A",q:"労働者の国籍、信条又は社会的身分を理由として、賃金、労働時間その他の労働条件について就業規則に差別規程が設けられている場合には、現実に差別が行われていないときであっても、労働基準法第3条（均等待遇）違反となる。",a:false,exp:"労働者の国籍、信条又は社会的身分を理由として、賃金、労働時間その他の労働条件について就業規則に差別規程が設けられている場合であっても、「現実に差別が行われていないときは、法3条（均等待遇）違反とはならない」（法3条ほか）。",src:"労基法3条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問4",opt:"B",q:"労働基準法第4条において、「使用者は、労働者が女性であることを理由として、賃金について、男性と差別的取扱いをしてはならない。」と規定されており、当該「女性であることを理由として」とは、労働者が女性であることのみを理由とすること、あるいは、社会通念として又は当該事業場において女性労働者が一般的又は平均的に能率が悪いことや勤続年数が短いこと等を理由とすることをいう。",a:true,exp:"本肢のとおりである（法4条、平9.9.25基発648号ほか）。なお、本肢の「差別的取扱い」をするとは、不利に取扱う場合のみならず「有利に扱う場合も含まれる」。",src:"労基法4条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問4",opt:"C",q:"労働基準法における「使用者」であるか否かの認定は、部長、課長等の形式にとらわれることなく、同法各条の義務について実質的に一定の権限を与えられているか否かによるものとされており、かかる権限が与えられておらず、単に上司の命令の伝達者にすぎない場合は、当該使用者とされない。",a:true,exp:"本肢のとおりである（昭22.9.13発基17号）。労働基準法における「使用者」とは、事業主又は事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者をいう。",src:"労基法10条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問4",opt:"D",q:"平均賃金を算定する期間中に、数時間労働した後に使用者の責めに帰すべき休業をした日があった場合、その日の労働に対して支払われた賃金が平均賃金の100分の60を超えると否とにかかわらずその日は休業日とされ、その日及びその日の賃金を平均賃金の算定基礎となる期間及び賃金から控除するものとされている。",a:true,exp:"本肢のとおりである（昭25.8.28基収2397号）。",src:"労基法12条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問4",opt:"E",q:"労働者が法令により負担すべき所得税等（健康保険料、厚生年金保険料、雇用保険料等の本人負担部分を含む。）を事業主が労働者に代わって負担する場合であって、当該労働者が法律上生ずる義務を免れることとなるときは、その事業主が労働者に代わって負担する部分は、労働基準法第11条に規定する賃金に該当するものとされている。",a:true,exp:"本肢のとおりである（昭63.3.14基発150号）。労働基準法における賃金とは、賃金、給料、手当、賞与その他名称の如何を問わず、労働の対償として使用者が労働者に支払うすべてのものをいう（法11条）。",src:"労基法11条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問5",opt:"A",q:"「適正な賃金の額を支払うための手段たる相殺は、労働基準法24条1項但書（賃金全額払の例外）によって除外される場合にあたらなくても、その行使の時期、方法、金額等からみて労働者の経済生活の安定との関係上不当と認められないものであれば、同項の禁止するところではないと解するのが相当である。この見地からすれば、許さるべき相殺は、過払のあった時期と賃金の清算調整の実を失わない程度に合理的に接着した時期においてされ、また、あらかじめ労働者にそのことが予告されるとか、その額が多額にわたらないとか、要は労働者の経済生活の安定をおびやかすおそれのない場合でなければならないものと解せられる。」とするのが、最高裁判所の判例である。",a:true,exp:"本肢のとおりである（最高裁第一小法廷判決 昭44.12.18 福島県教組事件）。",src:"福島県教組事件（最判昭44.12.18）",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問5",opt:"B",q:"労働基準法第24条第2項本文によると、賃金は、原則として、毎月1回以上、一定の期日を定めて支払わなければならないとされており、月給者について、「給料は毎月第4月曜日に支払う。」とする就業規則の定めは、同項に抵触するものとされている。",a:true,exp:"本肢のとおりである（法24条2項ほか）。本肢の「一定の期日」とは、期日が特定されるとともに、その期日が周期的に到来するものでなければならないとされており、「毎月第4月曜日」とするのは、毎月の期日が特定されず、変動するものであるから、一定期日払の原則に抵触する。",src:"労基法24条2項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問5",opt:"C",q:"新規学卒者のいわゆる採用内定により、当該企業の例年の入社時期を就労の始期とし、一定の事由による解約権を留保した労働契約が成立したとみられる場合であって、使用者の都合で就労の始期を繰り下げる、いわゆる自宅待機の措置をとるときにおいて、当該自宅待機の措置をとっている期間について、使用者は、労働基準法第26条に規定する休業手当を支払う義務を負うものとされている。",a:true,exp:"本肢のとおりである（昭63.3.14基発150号）。使用者の責に帰すべき事由による休業の場合においては、使用者は、休業期間中当該労働者に、その平均賃金の100分の60以上の手当を支払わなければならない（法26条）。",src:"労基法26条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問5",opt:"D",q:"使用者は、労働者の同意を得た場合には、賃金の支払について、労働者が指定する銀行その他の金融機関に対する当該労働者の預金又は貯金への振込みの方法によることができ、当該「指定」とは、労働者が賃金の振込み対象として銀行その他の金融機関に対する当該労働者本人名義の預貯金口座等を指定するとの意味であって、この指定が行われれば特段の事情のない限り労働者の同意が得られているものと解される。",a:true,exp:"本肢のとおりである（則7条の2、昭63.1.1基発1号）。",src:"則7条の2",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問5",opt:"E",q:"労働基準法第27条において、「出来高払制その他の請負制で使用する労働者については、使用者は、その成果に応じ一定額の賃金の保障をしなければならない。」と規定されている",a:false,exp:"出来高払制その他の請負制で使用する労働者については、使用者は、「労働時間」に応じ一定額の賃金の保障をしなければならない（法27条）。「成果」に応じではない。",src:"労基法27条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問6",opt:"A",q:"労働基準法第66条第3項の規定において、「使用者は、妊産婦が請求した場合においては、深夜業をさせてはならない。」と規定されており、当該規定は、同法第41条第2号に規定する監督又は管理の地位にある妊産婦が当該請求した場合においても適用される。",a:true,exp:"本肢のとおりである（法66条3項、昭61.3.20基発151号）。本肢の「監督若しくは管理の地位にある者」とは、一般的には、部長、工場長等労働条件の決定その他労務管理について経営者と一体的な立場にある者の意であり、名称にとらわれず、実態に即して判断すべきものである（昭63.3.14基発150号ほか）。",src:"労基法66条3項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問6",opt:"B",q:"生後満1年に達しない生児を育てる女性は、労働基準法第34条の休憩時間のほか、1日2回各々少なくとも30分、その生児を育てるための時間を請求することができるとされているが、1日の労働時間が6時間を超えない限り、1日1回の育児時間の付与をもって足りるものとされている。",a:false,exp:"1日の労働時間が「4時間以内」である場合には、1日1回の育児時間の付与をもって足りるものとされている。その他の記述は正しい（法67条1項、昭36.1.9基収8996号）。",src:"労基法67条1項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問6",opt:"C",q:"労働基準法第68条において、「使用者は、生理日の就業が著しく困難な女性が休暇を請求したときは、その者を生理日に就業させてはならない。」と規定されており、就業規則等により当該休暇の日数を限定することは、許されないものとされている。",a:true,exp:"本肢のとおりである（法68条、昭63.3.14基発150号ほか）。",src:"労基法68条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問6",opt:"D",q:"使用者は、労働基準法第57条第1項の規定（年少者の証明書）等により、労働者の雇入れに際してその年齢を確認しなければならず、満18歳未満の者であるか否か疑わしい者について、単純に当該者の申告を信用して、同項の規定による満18歳未満の者の年齢証明書を備え付けなかった場合、原則として、当該使用者は、同条違反の責を免れないものとされている。",a:true,exp:"本肢のとおりである（法57条1項、昭27.2.14基収52号ほか）。なお、使用者が年齢を確認するに当たっては一般に必要とされる程度の注意義務を尽くせば足り、必ずしも公文書によって確認する義務はないものと解されるので、何人が観察しても年少者ではないかという疑念をはさむ余地の全くない者については、その労働者の申告を基準として判断して使用していても、使用者は年齢を確認すべき義務を故意に怠ったものとはいえないものとされている。",src:"労基法57条1項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問6",opt:"E",q:"労働基準法第59条において、「未成年者は、独立して賃金を請求することができる。親権者又は後見人は、未成年者の賃金を代って受け取ってはならない。」と規定されている。",a:true,exp:"本肢のとおりである（法59条）。",src:"労基法59条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問7",opt:"A",q:"労働基準法第32条の3に規定するいわゆるフレックスタイム制の下で、清算期間における実際の労働時間に過剰があった場合において、総労働時間として定められた時間分のみをその期間の賃金支払日に支払い、それを超えて労働した時間分を次の清算期間中の総労働時間の一部に充当することは、各清算期間を通算した場合に結果として実労働時間に対応した賃金が支払われることとなるため、労働基準法第24条（賃金の支払）に違反するものではない。",a:false,exp:"清算期間における実際の労働時間に過剰があった場合、総労働時間として定められた時間分はその期間の賃金支払日に支払うが、それを超えて労働した時間分を次の清算期間中の総労働時間の一部に充当することは、その清算期間内における「労働の対価の一部がその期間の賃金支払日に支払われない」こととなり、「法24条の賃金の全額払の原則に違反し、許されない」（昭63.1.1基発1号）。",src:"労基法24条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問7",opt:"B",q:"監視又は断続的労働に従事する者で、使用者が行政官庁の許可を受けたものは、労働基準法第4章（労働時間、休憩、休日及び年次有給休暇）、第6章（年少者）及び第6章の2（妊産婦等）で定める労働時間、休憩及び休日に関する規定が適用されないものとされており、当該許可を受け得る業務として、交通関係の監視、車両誘導を行う駐車場の監視等の精神的緊張の高い業務が含まれている。",a:false,exp:"交通関係の監視、車両誘導を行う駐車場の監視等の精神的緊張の高い業務については、本肢の「許可の対象としない」ものとされている（法41条、昭22.9.13発基17号）。法41条3号に規定する「監視に従事する者」は、原則として、一定部署にあって監視するのを本来の業務とし、常態として身体又は精神的緊張の少ない者について同号の許可をするものとされている。",src:"労基法41条3号",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問7",opt:"C",q:"裁判所は、労働基準法第20条（解雇予告手当）、同法第26条（休業手当）若しくは同法第37条（時間外、休日及び深夜の割増賃金）の規定に違反した使用者又は同法第39条第9項（年次有給休暇の賃金）の規定による賃金を支払わなかった使用者に対して、労働者の請求により、これらの規定により使用者が支払わなければならない金額についての未払金のほか、当該未払金の額の2倍に相当する額の付加金の支払を命ずることができる。ただし、当該請求は、当分の間、違反のあった時から3年以内にしなければならない。",a:false,exp:"裁判所は、本肢の使用者に対して、労働者の請求により、これらの規定により当該使用者が支払わなければならない金額についての未払金のほか、これと「同一額の付加金」の支払を命ずることができる。その他の記述は正しい（法114条、法附則143条2項）。",src:"労基法114条",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問7",opt:"D",q:"労働基準法の違反行為をした者が、当該事業の労働者に関する事項について、事業主のために行為した代理人、使用人その他の従業者である場合においては、原則として、事業主に対しても各本条の罰金刑を科するものとされているが、事業主（事業主が法人である場合においてはその代表者、事業主が営業に関し成年者と同一の行為能力を有しない未成年者又は成年被後見人である場合においてはその法定代理人（法定代理人が法人であるときは、その代表者）を事業主とする。）が違反の防止に必要な措置をした場合においては、この限りでないものとされている。",a:true,exp:"本肢のとおりである（法121条1項）。",src:"労基法121条1項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問7",opt:"E",q:"労働基準法第107条第1項において、「使用者は、各事業場ごとに労働者名簿を、各労働者について調製し、労働者の氏名、生年月日、履歴その他厚生労働省令で定める事項を記入しなければならない。」と規定されており、日日雇い入れられる者は、当該各労働者に含まれている。",a:false,exp:"法107条において「使用者は、各事業場ごとに労働者名簿を、各労働者（日日雇い入れられる者を『除く』）について調製し、労働者の氏名、生年月日、履歴その他厚生労働省令で定める事項を記入しなければならない」と規定されている（法107条1項）。日日雇い入れられる者は含まれない。",src:"労基法107条1項",cat:"択一式（労働基準法）"},
{no:"LEC第2回-問8",opt:"ア",q:"製造業の事業場の事業者であって常時3,000人の労働者を使用しているものは、6人以上の衛生管理者を選任しなければならない。",a:false,exp:"製造業の事業場の事業者であって常時3,000人の労働者を使用しているものは、「5人」以上の衛生管理者を選任しなければならない（労働安全衛生法12条1項、労働安全衛生規則7条1項4号）。",src:"安衛法12条1項・安衛則7条",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問8",opt:"イ",q:"産業医は、少なくとも毎月1回（産業医が、事業者から、毎月1回以上、労働安全衛生規則第15条各号に掲げる情報の提供を受けている場合であって、事業者の同意を得ているときは、少なくとも2月に1回）作業場等を巡視し、作業方法又は衛生状態に有害のおそれがあるときは、直ちに、労働者の健康障害を防止するため必要な措置を講じなければならない。",a:true,exp:"本肢のとおりである（則15条）。",src:"安衛則15条",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問8",opt:"ウ",q:"【本問の「委員会」とは、安全委員会・衛生委員会又は安全衛生委員会をいう。】委員会を設ける場合において、事業者は、当該委員会のすべての委員の半数については、当該事業場に労働者の過半数で組織する労働組合があるときにおいてはその労働組合、労働者の過半数で組織する労働組合がないときにおいては労働者の過半数を代表する者の推薦に基づき指名しなければならない。",a:false,exp:"委員会を設ける場合において、事業者は、当該委員会の委員のうち、「議長となるべき委員（総括安全衛生管理者又は総括安全衛生管理者以外の者で当該事業場においてその事業の実施を統括管理するもの若しくはこれに準ずる者のうちから事業者が指名した者）以外の委員の半数」について、原則として、当該事業場に労働者の過半数で組織する労働組合があるときはその労働組合、ないときは労働者の過半数を代表する者の推薦に基づき指名しなければならない（法17条4項、法18条4項、法19条4項）。「すべての委員の半数」ではない。",src:"安衛法17条4項ほか",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問8",opt:"エ",q:"圧気工法による作業を行う建設業の仕事（当該一の場所において、その労働者である作業従事者及び関係請負人に係る作業従事者が作業を行うものとする。）であって、これらの作業従事者数が常時20人である事業場に係る特定元方事業者は、統括安全衛生責任者を選任し、その者に元方安全衛生管理者の指揮をさせるとともに、労働安全衛生法第30条第1項各号に規定する事項を統括管理させなければならない。",a:false,exp:"本肢の特定元方事業者は、作業従事者数が常時30人未満であるため、統括安全衛生責任者を選任することを「要しない」（法15条1項、労働安全衛生法施行令7条2項）。",src:"安衛法15条1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問8",opt:"オ",q:"統括安全衛生責任者を選任した事業者で、造船業に属する事業を行うものは、厚生労働省令で定める資格を有する者のうちから、厚生労働省令で定めるところにより、元方安全衛生管理者を選任し、その者に労働安全衛生法第30条第1項各号に規定する事項のうち技術的事項を管理させなければならない。",a:false,exp:"本肢の事業者は、元方安全衛生管理者を選任することを「要しない」。統括安全衛生責任者を選任した事業者で、「建設業」に属する事業を行うものが、厚生労働省令で定める資格を有する者のうちから元方安全衛生管理者を選任し、その者に法30条1項各号に規定する事項のうち技術的事項を管理させなければならない（法15条の2第1項）。造船業は対象ではない。",src:"安衛法15条の2第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問9",opt:"A",q:"事業者は、労働基準法第41条の2第1項（いわゆる高度プロフェッショナル制度）の規定により労働する労働者であって、その健康管理時間が当該労働者の健康の保持を考慮して厚生労働省令で定める時間を超えるものに対し、厚生労働省令で定めるところにより、医師による面接指導を行わなければならないとされており、当該厚生労働省令で定める時間とは、1月当たり80時間とされている。",a:false,exp:"本肢の厚生労働省令で定める時間（高度プロフェッショナル制度の適用を受ける者に対する面接指導に係る健康管理時間）とは、「1週間当たりの健康管理時間が40時間を超えた場合におけるその超えた時間について、1月当たり100時間」とされている（法66条の8の4第1項、則52条の7の4第1項）。",src:"安衛法66条の8の4第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問9",opt:"B",q:"事業者は、ストレスチェックを受けた労働者に対し、厚生労働省令で定めるところにより、当該ストレスチェックを行った医師、保健師その他の厚生労働省令で定める者（以下本問において「医師等」とする。）から当該ストレスチェックの結果が通知されるようにしなければならず、当該医師等は、当該労働者への当該ストレスチェックの結果の通知と同時に事業者に当該結果を提供しなければならない。",a:false,exp:"本肢後段のような規定はない。本肢の医師等は、「あらかじめ当該ストレスチェックを受けた労働者の同意を得ないで、当該労働者のストレスチェックの結果を事業者に提供してはならない」（法66条の10第2項）。",src:"安衛法66条の10第2項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問9",opt:"C",q:"事業者は、労働者に対し、厚生労働省令で定めるところにより、医師等によるストレスチェックを行わなければならず、当該事業場でストレスチェックを実施する時点で休業している労働者に対しても、ストレスチェックを実施しなければならない。",a:false,exp:"事業場でストレスチェックを実施する時点で休業している労働者については、当該事業場の事業者は、当該労働者に対してストレスチェックを実施しなくても「差し支えない」（法66条の10第1項、平27.5.1基発0501第3号）。",src:"安衛法66条の10第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問9",opt:"D",q:"労働安全衛生法第66条第2項に規定するいわゆる特殊健康診断は、事業の遂行にからんで当然実施されなければならない性格のものであり、原則として、所定労働時間内に行なわれるものとされている。また、当該特殊健康診断の実施に要する時間は労働時間と解されるので、当該特殊健康診断が法定労働時間外に行なわれた場合には、当然に割増賃金を支払わなければならない。",a:true,exp:"本肢のとおりである（法66条2項・3項、昭47.9.18基発602号）。",src:"安衛法66条2項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問9",opt:"E",q:"労働安全衛生法第66条第4項において、「都道府県労働局長は、労働者の健康を保持するため必要があると認めるときは、産業医の意見に基づき、厚生労働省令で定めるところにより、事業者に対し、臨時の健康診断の実施その他必要な事項を指示することができる。」と規定されている。",a:false,exp:"都道府県労働局長は、労働者の健康を保持するため必要があると認めるときは、「労働衛生指導医」の意見に基づき、厚生労働省令で定めるところにより、事業者に対し、臨時の健康診断の実施その他必要な事項を指示することができる（法66条4項）。「産業医」の意見ではない。",src:"安衛法66条4項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問10",opt:"A",q:"労働安全衛生規則第34条の2の10第1項において、「労働基準監督署長は、化学物質による労働災害が発生した、又はそのおそれがある事業場の事業者に対し、当該事業場において化学物質の管理が適切に行われていない疑いがあると認めるときは、当該事業場における化学物質の管理の状況について改善すべき旨を指示することができる。」と規定されており、当該指示を受けた事業者は、遅滞なく、事業場における化学物質の管理について必要な知識及び技能を有する者として厚生労働大臣が定めるものから、当該事業場における化学物質の管理の状況についての確認及び当該事業場が実施し得る望ましい改善措置に関する助言を受けなければならない。",a:true,exp:"本肢のとおりである（則34条の2の10第1項・2項）。本肢の「事業場における化学物質の管理について必要な知識及び技能を有する者として厚生労働大臣が定めるもの」を「化学物質管理専門家」という。",src:"安衛則34条の2の10第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問10",opt:"B",q:"事業者は、最大積載量が2トン以上の貨物自動車に荷を積む作業（ロープ掛けの作業及びシート掛けの作業を含む。）又は最大積載量が2トン以上の貨物自動車から荷を卸す作業（ロープ解きの作業及びシート外しの作業を含む。）を行うときは、墜落による労働者の危険を防止するため、当該作業に従事する労働者が床面と荷台との間及び床面と荷台上の荷の上面との間を安全に昇降するための設備を設けなければならない。",a:true,exp:"本肢のとおりである（則151条の67第1項）。",src:"安衛則151条の67第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問10",opt:"C",q:"特定元方事業者は、労働安全衛生法第30条第1項第2号に規定する特定元方事業者の講ずべき措置の1つである「作業間の連絡及び調整」については、随時、特定元方事業者と関係請負人との間及び関係請負人相互間における連絡及び調整を行わなければならない。",a:true,exp:"本肢のとおりである（則636条）。",src:"安衛則636条",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問10",opt:"D",q:"事業者は、リスクアセスメントを行ったときは、労働安全衛生規則第34条の2の8第1項各号に掲げる事項について、記録を作成し、次にリスクアセスメントを行うまでの期間（リスクアセスメントを行った日から起算して3年以内に当該リスクアセスメント対象物についてリスクアセスメントを行ったときは、3年間）保存するとともに、当該事項を、リスクアセスメント対象物を製造し、又は取り扱う業務に従事する労働者に周知させなければならない。",a:true,exp:"本肢のとおりである（則34条の2の8第1項）。",src:"安衛則34条の2の8第1項",cat:"択一式（安全衛生法）"},
{no:"LEC第2回-問10",opt:"E",q:"労働安全衛生規則第151条の18において、「事業者は、フォークリフトについては、ヘッドガードを備えたものでなければ使用してはならない。ただし、マストの後方に荷が落下することにより労働者に危険を及ぼすおそれのないときは、この限りでない。」と規定されている。",a:false,exp:"則151条の18において「事業者は、フォークリフトについては、「バックレスト」を備えたものでなければ使用してはならない。ただし、マストの後方に荷が落下することにより労働者に危険を及ぼすおそれのないときは、この限りでない」と規定されている（則151条の18）。「ヘッドガード」を備えるべき旨は則151条の17の規定であり、本肢は条文を取り違えている。",src:"安衛則151条の18",cat:"択一式（安全衛生法）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄A",context:"最高裁判所は、出張・外勤命令に従わず内勤業務に従事した従業員に対して使用者が賃金の支払義務を負うか否かが問題となった事件において、次のように判示した。「…上告人らが、本件業務命令によって指定された時間、その指定された出張・外勤業務に従事せず内勤業務に従事したことは、【A】に従った労務の提供をしたものとはいえず、また、被上告人は、本件業務命令を事前に発したことにより、その指定した時間については「出張・外勤以外の労務の受領をあらかじめ拒絶した」ものと解すべきであるから、上告人らが提供した内勤業務についての労務を受領したものとはいえず、したがって、被上告人は、上告人らに対し右の時間に対応する賃金の支払義務を負うものではない…」（最判昭60.3.7 水道機工事件）",choices:["債務の本旨", "合意した労働契約の内容", "労働基準法その他労働関係諸法令", "労働者の自由な意思"],answer:"債務の本旨",exp:"最判昭60.3.7 水道機工事件。指定された出張・外勤業務に従事せず内勤業務に従事したことは、「債務の本旨」に従った労務の提供をしたものとはいえないとされた。",src:"水道機工事件（最判昭60.3.7）",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄B",context:"最高裁判所は、出張・外勤命令に従わず内勤業務に従事した従業員に対して使用者が賃金の支払義務を負うか否かが問題となった事件において、次のように判示した。「…上告人らが、本件業務命令によって指定された時間、その指定された出張・外勤業務に従事せず内勤業務に従事したことは、「債務の本旨」に従った労務の提供をしたものとはいえず、また、被上告人は、本件業務命令を事前に発したことにより、その指定した時間については【B】ものと解すべきであるから、上告人らが提供した内勤業務についての労務を受領したものとはいえず、したがって、被上告人は、上告人らに対し右の時間に対応する賃金の支払義務を負うものではない…」（最判昭60.3.7 水道機工事件）",choices:["出張・外勤以外の労務の受領をあらかじめ拒絶した", "解除条件が成就し、労働契約はその限りにおいてその効力を失った", "上告人らに対して内勤業務への従事を禁止した", "内勤業務について休業命令を発した"],answer:"出張・外勤以外の労務の受領をあらかじめ拒絶した",exp:"同判例。被上告人は本件業務命令を事前に発したことにより、その指定した時間については「出張・外勤以外の労務の受領をあらかじめ拒絶した」ものと解すべきとされた。",src:"水道機工事件（最判昭60.3.7）",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄C",context:"使用者は、所定の要件を満たして労働者の同意を得た場合には、賃金の支払方法として、所定の要件を満たすものとして厚生労働大臣の指定を受けた資金移動業者（指定資金移動業者）のうち労働者が指定するものの第2種資金移動業に係る口座への資金移動によること（いわゆる賃金のデジタル払い）ができるものとされている。当該指定資金移動業者となるための所定の要件の1つとして、「賃金の支払に係る資金移動を行う口座について、特段の事情がない限り、当該口座に係る資金移動が最後にあった日から少なくとも【C】年間は、労働者に対して負担する為替取引に関する債務を履行することができるための措置を講じていること。」がある。",choices:["10", "2", "3", "5"],answer:"10",exp:"賃金のデジタル払い。指定資金移動業者となるための要件の1つとして、口座に係る資金移動が最後にあった日から少なくとも「10」年間は、労働者に対して負担する為替取引に関する債務を履行できるための措置を講じていることが必要（則7条の2第1項）。",src:"則7条の2第1項",cat:"選択式（労働基準法）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄D",context:"労働安全衛生法第38条第1項本文によると、所定の特定機械等を製造し、若しくは輸入した者、当該特定機械等で厚生労働省令で定める期間設置されなかったものを設置しようとする者又は当該特定機械等で使用を廃止したものを再び設置し、若しくは使用しようとする者は、原則として、厚生労働省令で定めるところにより、当該特定機械等及びこれに係る厚生労働省令で定める事項について、【D】の検査を受けなければならないとされており、当該特定機械には、移動式クレーンが含まれている。",choices:["登録設計審査等機関", "登録性能検査機関", "都道府県労働局長", "労働基準監督署長"],answer:"登録設計審査等機関",exp:"製造時等検査。特定機械等を製造・輸入等した者は、原則として「登録設計審査等機関」の検査（製造時等検査）を受けなければならない（法38条1項）。",src:"安衛法38条1項",cat:"選択式（安全衛生法）"},
{type:"select",no:"LEC第2回-選択1",opt:"空欄E",context:"労働安全衛生法第38条第1項本文によると、所定の特定機械等を製造し、若しくは輸入した者、当該特定機械等で厚生労働省令で定める期間設置されなかったものを設置しようとする者又は当該特定機械等で使用を廃止したものを再び設置し、若しくは使用しようとする者は、原則として、厚生労働省令で定めるところにより、当該特定機械等及びこれに係る厚生労働省令で定める事項について、登録設計審査等機関の検査を受けなければならないとされており、当該特定機械には、【E】が含まれている。",choices:["移動式クレーン", "エレベーター", "建設用リフト", "デリック"],answer:"移動式クレーン",exp:"特定機械等（別表1）には、ボイラー、第1種圧力容器、「移動式クレーン」、ゴンドラ等が含まれる（法38条1項・別表1）。エレベーター・建設用リフト・デリックは特定機械等に当たらない。",src:"安衛法38条1項・別表1",cat:"選択式（安全衛生法）"},
{no:"TAC中間模試-問1",opt:"A",q:"労働基準法第3条は労働者の信条によって賃金その他の労働条件につき差別することを禁じているが、これは、雇入れ後における労働条件についての制限であって、雇入れそのものを制約する規定ではないとするのが、最高裁判所の判例である。",a:true,exp:"法3条、最大判昭48.12.12「三菱樹脂事件」。設問の通り正しい。",src:"労基法3条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問1",opt:"B",q:"労働基準法第4条において禁止している労働者が女性であることを理由とする賃金についての「差別的取扱い」とは、女性労働者を不利に取り扱うことをいうものであり、有利に取り扱う場合は含まれない。",a:false,exp:"法4条、平9.9.25基発648号。法4条で禁止している「差別的取扱い」には、女性労働者を不利に取り扱う場合のみならず、「有利に取り扱う場合も含まれる」。",src:"労基法4条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問1",opt:"C",q:"労働基準法第5条は「使用者は、暴行、脅迫、監禁その他精神又は身体の自由を不当に拘束する手段によって、労働者の意思に反して労働を強制してはならない。」と定めており、使用者が詐欺の手段によって労働させることは同条に違反する。",a:false,exp:"法5条、昭23.3.2基発381号。使用者が詐欺の手段によって労働させても、通常、労働者は無意識の状態にあって意思を抑圧されるものではないから、「必ずしもそれ自体としては法5条違反に該当しない」。",src:"労基法5条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問1",opt:"D",q:"労働基準法第6条は「何人も、法律に基いて許される場合の外、業として他人の就業に介入して利益を得てはならない。」と定めており、当該「法律に基いて許される場合」には、労働者派遣法による労働者派遣が含まれる。",a:false,exp:"法6条、昭33.2.13基発90号、平11.3.31基発168号。労働者派遣法による労働者派遣は、派遣元と労働者との労働契約関係及び派遣先と労働者との指揮命令関係を合わせたものが全体として当該労働者の労働関係となるものであり、第三者が他人の労働関係に介入するものではなく、「労働基準法6条の中間搾取に該当しない」（＝「法律に基いて許される場合」に含めて論じる設問は誤り）。",src:"労基法6条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問1",opt:"E",q:"労働基準法の適用単位である「事業」とは、工場、事務所、店舗等の一定の場所において相関連する組織のもとに業として継続的に行われる作業の一体を意味するものであるが、営利を目的としない社会事業団体や宗教団体が行う継続的活動は「事業」に該当しない。",a:false,exp:"法9条、平11.3.31基発168号。営利を目的としない社会事業団体や宗教団体が行う継続的活動であっても、「工場、事務所、店舗等の一定の場所において相関連する組織のもとに業として継続的に行われる作業の一体」である限り、「事業」に該当する。",src:"労基法9条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問2",opt:"ア",q:"労働基準法第1条にいう「労働条件」とは、賃金、労働時間はもちろんのこと、解雇、災害補償、安全衛生、寄宿舎等に関する条件を含む労働者の職場における一切の待遇をいう。",a:true,exp:"法1条。設問の通り正しい。",src:"労基法1条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問2",opt:"イ",q:"労働基準法第2条第2項は「労働者及び使用者は、労働協約、就業規則及び労働契約を遵守し、誠実に各々その義務を履行しなければならない。」と定めているが、同項違反には罰則の定めがなく、同項の規定は訓示的規定と解されている。",a:true,exp:"法2条2項。設問の通り正しい。訓示的規定と解されており、労働協約・就業規則・労働契約の遵守義務違反があっても、それは直接法2条2項にかかわる問題ではないと解されている。",src:"労基法2条2項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問2",opt:"ウ",q:"労働基準法で定める労働条件の基準は最低のものであるが、労働契約に定める労働条件が同法で定める基準を下回るものであっても、労使が当該労働条件について合意していた場合は、契約自由の原則により、その合意が優先される。",a:false,exp:"法1条2項、法13条。労働契約に定める労働条件が同法で定める基準を下回るものである場合は、法13条により、その部分は無効となり「労働基準法で定める基準による」（合意が優先されるわけではない）。",src:"労基法13条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問3",opt:"A",q:"労働契約の締結に際して行う労働条件の明示のうち、労働基準法施行規則第5条第1項第4号の2から第11号までに定めるいわゆる労働条件の相対的明示事項の明示については、書面の交付によらず口頭で行うことで足りる。",a:true,exp:"法15条1項、則5条3項・4項。設問の通り正しい。なお絶対的明示事項のうち「昇給に関する事項」は口頭明示で足りるが、それ以外の事項は書面の交付により明示しなければならない。",src:"労基法15条・則5条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問3",opt:"B",q:"労働者が労働基準法第22条第1項の定めにより退職の事由について証明書を請求した場合において、当該退職の事由に労使に見解の相違があるときは、使用者は、当該証明書に労働者の見解を記載したうえで交付しなければならない。",a:false,exp:"法22条1項、平11.3.31基発169号。退職の事由について労使に見解の相違がある場合、使用者は「自らの見解」を証明書に記載して交付すれば足りる。",src:"労基法22条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問3",opt:"C",q:"使用者は、あらかじめ第三者と謀り、労働者の就業を妨げることを目的として、労働基準法第22条第1項及び第2項の証明書に秘密の記号を記入してはならないが、当該秘密の記号の記入は、労働者の「国籍」、「信条」、「社会的身分」又は「労働組合運動」の4つの事項に限定して禁止されている。",a:false,exp:"法22条4項。秘密の記号の記入は、「国籍」「信条」「社会的身分」「労働組合運動」の4つの事項に限られず、「いかなる事項について記入しても」法22条4項に抵触する。なお、あらかじめ第三者と謀り就業を妨げる目的の「通信」は、これら4つの事項に限定して禁止される。",src:"労基法22条3項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問3",opt:"D",q:"賃金の支払いに関し、毎月1日から末日までの賃金を翌月20日に支払うこととされている労働者が、5月31日に退職し、6月1日に労働基準法第23条第1項の定めによる金品の返還の請求をした場合、使用者は、5月分の賃金については6月20日までに支払うことで足りる。",a:false,exp:"法23条1項。設問の場合は、5月分の賃金を「6月1日から7日以内」に支払わなければならない。",src:"労基法23条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問3",opt:"E",q:"労働基準法第14条第2項に基づき厚生労働大臣が定めた基準により、使用者は、有期労働契約（当該契約を3回以上更新し、又は雇入れの日から起算して1年を超えて継続勤務している者に係るものに限る。）を更新しようとする場合においては、当該契約の実態及び当該労働者の希望に応じて、契約期間をできる限り長くするよう努めなければならない。",a:false,exp:"法14条2項、令5.3.30厚労告114号。設問のカッコ書が誤り。正しくは「当該契約を1回以上更新し、かつ、雇入れの日から起算して1年を超えて継続勤務している者に係るものに限る」。",src:"労基法14条2項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問4",opt:"A",q:"労働基準法第36条第1項の協定（以下、B及びCにおいて「36協定」という。）を締結していない事業場において、同法第33条（非常災害等の場合）に該当する事由がないにも関わらず法定の休日に労働者を使用したときは、同法第36条（労使協定による時間外・休日労働）違反ではなく、同法第35条（休日）違反となる。",a:true,exp:"法36条1項。設問の通り正しい。36協定の締結及び届出をせずに時間外・休日労働をさせた場合は法36条違反とはならず、法32条・法35条・法40条違反となる。",src:"労基法35条・36条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問4",opt:"B",q:"労働基準法第32条の労働時間を延長して労働させることにつき、使用者が、36協定を締結し、これを所轄労働基準監督署長に届け出た場合において、使用者が当該事業場に適用される就業規則に当該36協定の範囲内で一定の業務上の事由があれば労働契約に定める労働時間を延長して労働者を労働させることができる旨定めているときは、当該就業規則の規定の内容が合理的なものである限り、それが具体的労働契約の内容をなすから、右就業規則の規定の適用を受ける労働者は、その定めるところに従い、労働契約に定める労働時間を超えて労働をする義務を負うものと解するを相当とするとするのが、最高裁判所の判例である。",a:true,exp:"最一小平3.11.28「日立製作所武蔵工場事件」。設問の通り正しい。",src:"日立製作所武蔵工場事件",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問4",opt:"C",q:"36協定が有する労働基準法の規制を解除する効力は、当該36協定の締結に反対している労働者にも及ぶ。",a:true,exp:"法36条。設問の通り正しい。36協定の免罰的効力は、その締結に反対している労働者にも及ぶ。",src:"労基法36条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問4",opt:"D",q:"使用者は、労働者が労使協定の締結当事者である過半数代表者であること若しくは過半数代表者になろうとしたこと又は過半数代表者として正当な行為をしたことを理由として不利益な取扱いをしてはならないこととされており、これに違反した使用者は6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:false,exp:"法120条、則6条の2第2項・3項。過半数代表者であること等を理由とする不利益取扱いの禁止に「違反した場合の罰則の定めはない」（6月以下の拘禁刑又は30万円以下の罰金とする設問は誤り）。",src:"則6条の2",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問4",opt:"E",q:"労使協定は、その事業場に使用されているすべての労働者の過半数の意思を問うためのものであるため、協定有効期間中に全く出勤が予想されない労働者等も労働者数に含まれる。",a:true,exp:"平11.3.31基発168号。設問の通り正しい。",src:"労基法36条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問5",opt:"ア",q:"育児休業申出前に育児休業期間中の日について時季指定や労使協定に基づく計画的付与が行われた場合には、当該日には年次有給休暇を取得したものと解され、当該日に係る賃金支払日については使用者に賃金支払義務が生じる。",a:true,exp:"法39条6項・9項、平3.12.20基発712号。設問の通り正しい。",src:"労基法39条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問5",opt:"イ",q:"年次有給休暇の権利についての消滅時効期間は「これを行使することができる時から2年間」であるが、就業規則に、年次有給休暇を翌年度に繰り越すことはできない旨を定めた場合には、年次有給休暇が付与された年度が経過したときに、当該権利は消滅する。",a:false,exp:"法39条1項、法115条、昭22.12.15基発501号ほか。年次有給休暇の権利の消滅時効期間は2年であり、就業規則に翌年度繰越不可の旨を定めても、時効による権利消滅前は、年度経過後においても「当該権利は消滅しない」。",src:"労基法115条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問5",opt:"ウ",q:"年次有給休暇の時季指定の効果は、使用者の適法な時季変更権の行使を解除条件として発生するのであって、年次有給休暇の成立要件として、労働者による「休暇の請求」や、これに対する使用者の「承認」の観念を容れる余地はないものといわなければならない、とするのが最高裁判所の判例である。",a:true,exp:"最二小昭48.3.2「白石営林署事件」。設問の通り正しい。",src:"白石営林署事件",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問5",opt:"エ",q:"定年退職による退職者を引き続き嘱託等として再採用している場合、労働基準法第39条第1項に定める年次有給休暇の付与要件における「継続勤務」の期間算定に当たっては、退職手当規程に基づき所定の退職手当を支給したような場合も含み、原則として、定年退職前後の勤務年数を通算する。",a:true,exp:"法39条1項、昭63.3.14基発150号。設問の通り正しい。「継続勤務」は在籍期間をいい、定年退職と再採用との間に相当期間が存し客観的に労働関係が断続していると認められる場合を除き、定年退職前後の期間を通算する。",src:"労基法39条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問5",opt:"オ",q:"使用者は、労働基準法第32条の3の規定による、いわゆるフレックスタイム制の適用を受ける労働者については、同法第39条第6項に定める年次有給休暇の計画的付与の対象とすることができない。",a:false,exp:"法32条の3、法39条6項。設問のような規定はない。フレックスタイム制の適用を受ける労働者についても、年次有給休暇の「計画的付与の対象とすることができる」。",src:"労基法39条6項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問6",opt:"A",q:"労働協約に反する就業規則は、その部分については、労働協約の適用を受ける労働者との間では適用されない。",a:true,exp:"法92条1項。設問の通り正しい。",src:"労基法92条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問6",opt:"B",q:"退職手当の定めは、いわゆる就業規則の相対的必要記載事項であり、その定めをする場合においてのみ、適用される労働者の範囲、退職手当の決定、計算及び支払の方法並びに退職手当の支払の時期に関する事項を就業規則に記載する義務が生じる。",a:true,exp:"法89条3号の2。設問の通り正しい。",src:"労基法89条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問6",opt:"C",q:"労働者派遣を行う派遣元の使用者が、派遣中の労働者を30人、それ以外の労働者を5人使用している場合は、当該使用者は、労働基準法第89条により就業規則の作成及び届出の義務を負う。",a:true,exp:"法89条、昭61.6.6基発333号。設問の通り正しい。派遣元の使用者は、派遣中の労働者とそれ以外の労働者を合わせて常時10人以上を使用している場合、法89条により就業規則の作成及び届出の義務を負う。",src:"労基法89条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問6",opt:"D",q:"自動車会社において運転手として勤務していた労働者について、使用者が、交通事故を惹起した自動車運転手を制裁として助手に格下げし、従って賃金も助手のそれに低下せしめるとしても、交通事故を惹起したことが運転手として不適格であるから助手に格下げするものであるならば、賃金の低下は、その労働者の職務の変更に伴う当然の結果であるから、労働基準法第91条の制裁規定の制限に抵触するものではない。",a:true,exp:"法91条、昭26.3.14基収518号。設問の通り正しい。",src:"労基法91条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問6",opt:"E",q:"使用者は、寄宿舎規則における「建設物及び設備の管理に関する事項」についての規定の作成又は変更を行う場合は、寄宿舎に寄宿する労働者の過半数を代表する者の同意を得なければならない。",a:false,exp:"法95条2項。「建設物及び設備の管理に関する事項」については、寄宿舎に寄宿する労働者の過半数を代表する者の「同意を得る必要はない」。同意が必要なのは、①起床・就寝・外出及び外泊、②行事、③食事、④安全及び衛生に関する事項であり、⑤建設物及び設備の管理に関する事項は同意不要。",src:"労基法95条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問7",opt:"ア",q:"使用者は、労働基準法及び同法に基いて発する命令のうち、寄宿舎に関する規定及び寄宿舎規則を、当該事業場で使用するすべての労働者に対して周知しなければならない。",a:false,exp:"法106条2項。寄宿舎に関する規定及び寄宿舎規則は、「寄宿舎に寄宿する労働者」に周知させればよく、当該事業場で使用するすべての労働者に対して周知する必要はない。",src:"労基法106条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問7",opt:"イ",q:"労働基準法の規定による賃金の請求権のうち、退職手当の請求権については、これを行使することができる時から3年間行わない場合においては、時効によって消滅する。",a:false,exp:"法115条、法附則143条3項。退職手当の請求権の消滅時効は「これを行使することができる時から5年間」とされている（3年間とする設問は誤り）。",src:"労基法115条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問7",opt:"ウ",q:"使用者は、日日雇い入れられる者については、労働者名簿を調製する必要はない。",a:true,exp:"法107条1項。設問の通り正しい。労働者名簿は各労働者（日日雇い入れられる者を除く）について調製する。",src:"労基法107条1項",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問7",opt:"エ",q:"使用者は、労働者名簿、賃金台帳及び雇入れ、解雇、災害補償、賃金その他労働関係に関する重要な書類を2年間保存しなければならない。",a:false,exp:"法109条、法附則143条1項。重要書類の保存期間は「5年間（当分の間は3年間）」であり、2年間とする設問は誤り。",src:"労基法109条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問7",opt:"オ",q:"労働基準法第113条は「労働基準法に基いて発する命令は、その草案について、公聴会で労働者を代表する者、使用者を代表する者及び公益を代表する者の意見を聴いて、これを制定する。」と定めている。",a:true,exp:"法113条。設問の通り正しい。意見を「聴く」とは公聴会を開催する手続を要求するものであって、公聴会における意見を採用することを義務付けるものではない。",src:"労基法113条",cat:"択一式（労働基準法）"},
{no:"TAC中間模試-問8",opt:"A",q:"常時50人以上の労働者を使用する建設業の事業場の事業者は、産業医を選任しなければならないが、産業医は、労働衛生コンサルタント試験に合格した医師でその試験の区分が保健衛生であるもののほか、産業医試験に合格し免許を取得した者の中から選任しなければならない。",a:false,exp:"法13条1項・2項、令5条、則14条2項。「産業医試験に合格し免許を取得した者の中から選任しなければならない」という規定はない（産業医試験という制度は存在しない）。産業医は、労働衛生コンサルタント試験合格医師（区分が保健衛生）のほか、厚生労働大臣の指定する者が行う研修を修了した医師、産業医科大学等の所定課程修了医師等から選任する。",src:"安衛法13条",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問8",opt:"B",q:"常時3,000人を超える労働者を使用する製造業の事業場の事業者は、総括安全衛生管理者を1人、安全管理者を1人、衛生管理者を5人以上、産業医を2人以上選任しなければならない。",a:false,exp:"法10〜13条、令2条2号ほか。設問の場合（常時3,000人を超える製造業）、衛生管理者を「6人以上」選任しなければならない（5人以上ではない）。その他の記述は正しい。",src:"安衛法10〜13条",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問8",opt:"C",q:"事業者は、労働安全衛生法第13条第5項の規定により、労働者の健康管理等について産業医の勧告を受けたときは、当該勧告の内容及び当該勧告を踏まえて講じた措置の内容（措置を講じない場合にあっては、その旨及びその理由）を記録し、これを5年間保存しなければならない。",a:false,exp:"法13条5項、則14条の3。産業医の勧告の内容等の記録の保存期間は「5年間」ではなく、正しくは「3年間」。",src:"安衛法13条5項・則14条の3",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問8",opt:"D",q:"常時500人を超える労働者を使用する事業場で、ラジウム放射線、エックス線その他の有害放射線にさらされる業務に常時30人の労働者を従事させる事業者は、衛生管理者のうち1人を衛生工学衛生管理者免許を受けた者のうちから選任しなければならない。",a:true,exp:"則7条1項6号。設問の通り正しい。",src:"安衛則7条1項6号",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問8",opt:"E",q:"二以上の建設業に属する事業の事業者が、一の場所において行われる当該事業の仕事を共同連帯して請け負った場合においては、そのうちの一人を代表者として定め、これを当該仕事の開始の日の30日前までに、当該仕事が行われる場所を管轄する労働基準監督署長を経由して、当該仕事が行われる場所を管轄する都道府県労働局長に届け出なければならない。",a:false,exp:"法5条1項、則1条2項・4項。共同企業体の代表者の届出は「30日前まで」ではなく、正しくは「14日前まで」に届け出なければならない。",src:"安衛法5条",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問9",opt:"A",q:"【労働安全衛生法第42条により厚生労働大臣が定める規格又は安全装置を具備しなければ譲渡・貸与・設置してはならない機械等として正しいか】ゴム、ゴム化合物又は合成樹脂を練るロール機及びその急停止装置",a:true,exp:"法42条、法別表第2第1号。ゴム、ゴム化合物又は合成樹脂を練るロール機及びその急停止装置は、法42条の機械等に該当する。",src:"安衛法42条・別表2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問9",opt:"B",q:"【労働安全衛生法第42条により厚生労働大臣が定める規格又は安全装置を具備しなければ譲渡・貸与・設置してはならない機械等として正しいか】クレーン又は移動式クレーンの過負荷防止装置",a:true,exp:"法42条、法別表第2第7号。クレーン又は移動式クレーンの過負荷防止装置は、法42条の機械等に該当する。",src:"安衛法42条・別表2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問9",opt:"C",q:"【労働安全衛生法第42条により厚生労働大臣が定める規格又は安全装置を具備しなければ譲渡・貸与・設置してはならない機械等として正しいか】作業床の高さが2メートル未満の高所作業車",a:false,exp:"法42条、令13条3項34号。法42条による規制の対象となる高所作業車は、作業床の高さが「2メートル以上」のものである。「2メートル未満」のものは対象とならない。",src:"安衛法42条・別表2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問9",opt:"D",q:"【労働安全衛生法第42条により厚生労働大臣が定める規格又は安全装置を具備しなければ譲渡・貸与・設置してはならない機械等として正しいか】動力により駆動されるプレス機械",a:true,exp:"法42条、法別表第2第11号。動力により駆動されるプレス機械は、法42条の機械等に該当する。",src:"安衛法42条・別表2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問9",opt:"E",q:"【労働安全衛生法第42条により厚生労働大臣が定める規格又は安全装置を具備しなければ譲渡・貸与・設置してはならない機械等として正しいか】交流アーク溶接機用自動電撃防止装置",a:true,exp:"法42条、法別表第2第12号。交流アーク溶接機用自動電撃防止装置は、法42条の機械等に該当する。",src:"安衛法42条・別表2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問10",opt:"A",q:"本邦外の地域に労働者を6月以上派遣しようとする事業者が行うべき海外派遣労働者の健康診断の実施については、当該実施日の3箇月前に労働者が定期健康診断を受けていた場合であっても、その定期健康診断の項目に相当する項目を省略して行うことはできない。",a:false,exp:"則45条の2第1項・3項。設問の海外派遣労働者については、実施日前6月間に受けた定期健康診断等の項目に相当する項目を「省略して行うことができる」。",src:"安衛則45条の2",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問10",opt:"B",q:"事業者は、有機溶剤を製造し、又は取り扱う業務に常時従事する労働者に対して特殊健康診断（定期のものに限る。）を行った場合であっても、その使用する労働者の数が常時50人未満の場合は、所轄労働基準監督署長に対し、健康診断結果報告をする必要はない。",a:false,exp:"法66条2項、有機則29条2項・30条の3。特殊健康診断（定期のものに限る）の結果報告は、その使用する労働者の人数に関係なく、所轄労働基準監督署長に対し「しなければならない」（常時50人未満でも報告が必要）。",src:"有機則30条の3",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問10",opt:"C",q:"事業者は、常時使用する労働者（特定業務従事者を除く。）に対し、1年以内ごとに1回、定期に、医師による健康診断を行わなければならないが、定期健康診断を実施すべき時期に、労働者が育児休業により休業中の場合には、定期健康診断を実施しなくても差し支えないとされており、育児休業終了後、当該労働者が職場復帰した場合においても、次回の定期健康診断を受診させれば足りるものであるとされている。",a:false,exp:"則44条1項、平4.3.13基発115号。育児休業中のため定期健康診断を実施しなかった場合は、育児休業終了後「速やかに」当該労働者に定期健康診断を実施しなければならない（次回の定期健康診断でよいわけではない）。",src:"安衛則44条",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問10",opt:"D",q:"産業医は、労働安全衛生法第66条の8の4に規定する高度プロフェッショナル制度の下で労働する労働者に対する面接指導の要件に該当する労働者に対して、当該面接指導の申出を行うよう勧奨することができるとされている。",a:false,exp:"法66条の8の4第1項、則52条の7の4第2項。産業医が面接指導の申出を勧奨できるのは法66条の8第1項の「長時間労働者」に対してであり、高度プロフェッショナル制度対象労働者に対する面接指導は労働者の申出により行われるものではないため、設問のような勧奨の規定はない。",src:"安衛法66条の8の4・則52条の7の3",cat:"択一式（安全衛生法）"},
{no:"TAC中間模試-問10",opt:"E",q:"定期健康診断受診後、労働者が要再検査又は要精密検査と診断された場合、再検査又は精密検査は、診断の確定や症状の程度を明らかにするものであり、一律には事業者にその実施が義務付けられているものではないが、有機溶剤中毒予防規則、鉛中毒予防規則、特定化学物質障害予防規則、高気圧作業安全衛生規則及び石綿障害予防規則に基づく特殊健康診断として規定されているものについては、事業者にその実施が義務付けられている。",a:true,exp:"平29.4.14公示9号。設問の通り正しい。",src:"各特別規則",cat:"択一式（安全衛生法）"},
{type:"select",no:"TAC中間模試-選択1",opt:"空欄A",context:"労働基準法第92条第1項は、「就業規則は、【A】に反してはならない。」と定めている。",choices:["法令又は当該事業場について適用される労働協約", "法令又は労働契約", "法令、当該事業場について適用される労働協約又は労働契約", "労働契約"],answer:"法令又は当該事業場について適用される労働協約",exp:"法92条1項。就業規則は「法令又は当該事業場について適用される労働協約」に反してはならない。なお、就業規則と労働契約の関係は労働契約法12条により、就業規則で定める基準に達しない労働条件を定める労働契約はその部分が無効となり、就業規則で定める基準による（法93条）。",src:"労基法92条1項",cat:"選択式（労働基準法）"},
{type:"select",no:"TAC中間模試-選択2",opt:"空欄B",context:"最高裁判所は、従業員が会社の承認を得ないで公職に就任したときは懲戒解雇する旨の就業規則条項の効力が問題となった事件において、次のように判示した。「労働基準法７条が、特に、労働者に対し【B】公民としての権利の行使および公の職務の執行を保障していることにかんがみるときは、公職の就任を使用者の承認にかからしめ、その承認を得ずして公職に就任した者を懲戒解雇に附する旨の前記条項は、右労働基準法の規定の趣旨に反し、無効のものと解すべきである。従つて、所論のごとく公職に就任することが会社業務の逐行を著しく阻害する虞れのある場合においても、普通解雇に附するは格別、同条項を適用して従業員を懲戒解雇に附することは、許されないものといわなければならない。」",choices:["労働時間中における", "事業の正常な運営を妨げない範囲における", "就業時間外の", "賃金請求権を失うことなく"],answer:"労働時間中における",exp:"最二小昭38.6.21「十和田観光電鉄事件」。法7条は、使用者は、労働者が「労働時間中に」選挙権その他公民としての権利を行使し、又は公の職務を執行するために必要な時間を請求した場合においては、拒んではならないと定めており、この文言から「労働時間中における」が導ける。",src:"十和田観光電鉄事件（最二小昭38.6.21）",cat:"選択式（労働基準法）"},
{type:"select",no:"TAC中間模試-選択3",opt:"空欄C",context:"最高裁判所は、解雇無効により復職した労働者について、労働基準法第39条第1項及び第2項における年次有給休暇権の成立要件に係る当該解雇期間の取扱いが問題となった事件において、次のように判示した。「労働基準法39条１項及び２項における前年度の全労働日に係る出勤率が８割以上であることという年次有給休暇権の成立要件は、法の制定時の状況等を踏まえ、労働者の責めに帰すべき事由による欠勤率が特に高い者をその対象から除外する趣旨で定められたものと解される。このような同条１項及び２項の規定の趣旨に照らすと、前年度の総暦日の中で、就業規則や労働協約等に定められた休日以外の不就労日のうち、労働者の責めに帰すべき事由によるとはいえないものは、不可抗力や使用者側に起因する経営、管理上の障害による休業日等のように当事者間の衡平等の観点から出勤日数に算入するのが相当でなく全労働日から除かれるべきものは別として、上記出勤率の算定に当たっては、【C】ものと解するのが相当である。」",choices:["出勤日数に算入すべきものとして全労働日に含まれる", "出勤日数に算入すべきものではあるが、全労働日には含まれない", "出勤日数には算入されないが全労働日には含まれる", "全労働日に含まれないため、当然に出勤日数にも算入されない"],answer:"出勤日数に算入すべきものとして全労働日に含まれる",exp:"最一小平25.6.6「八千代交通事件」。解雇無効により復職した労働者の解雇期間中の不就労日のうち、労働者の責めに帰すべき事由によるとはいえず全労働日から除かれるべきものに該当しないものは、出勤率の算定上「出勤日数に算入すべきものとして全労働日に含まれる」。",src:"八千代交通事件（最一小平25.6.6）",cat:"選択式（労働基準法）"},
{type:"select",no:"TAC中間模試-選択4",opt:"空欄D",context:"労働安全衛生法第34条は、「建築物で、政令で定めるものを事業を行う者に貸与する者（以下「建築物貸与者」という。）は、当該建築物の貸与を受けた者の事業に係る当該建築物による労働災害を防止するため必要な措置を講じなければならない。ただし、当該建築物の全部を【D】に貸与するときは、この限りでない。」と定めている。",choices:["一の事業者若しくは個人事業者に貸与するとき、又は二以上の個人事業者のみ", "一の個人事業者に貸与するとき、又は二以上の個人事業者のみ", "一の事業者", "一の事業者若しくは個人事業者に貸与するとき、又は二以上の個人事業者"],answer:"一の事業者若しくは個人事業者に貸与するとき、又は二以上の個人事業者のみ",exp:"安衛法34条。令和8年4月1日施行の改正により、個人事業者に対する建築物の貸与も規制の対象となった。建築物の全部を「一の事業者若しくは個人事業者に貸与するとき、又は二以上の個人事業者のみ」に貸与するときは、貸与を受けた者が全部を有効に管理でき、又はそもそも労働者がいないため、建築物貸与者に措置義務は課されない。",src:"安衛法34条",cat:"選択式（安全衛生法）"},
{type:"select",no:"TAC中間模試-選択5",opt:"空欄E",context:"労働安全衛生規則第679条第1項は、「建築物貸与者は、貸与する建築物のうち、貸与を受けた二以上の事業を行う者に専ら使用させる部分以外の部分（「共用部分」という。）において、高さが【E】以上の作業床の端、開口部等で墜落により事業を行う者の労働者に危険を及ぼすおそれのある箇所には、囲い、手すり、覆い等を設けなければならない。」と定めている。",choices:["2メートル", "1メートル", "1.5メートル", "3メートル"],answer:"2メートル",exp:"安衛則679条1項。改正により、建築物貸与者は、共用部分において高さが「2メートル」以上の作業床の端・開口部等で墜落により事業を行う者の労働者に危険を及ぼすおそれのある箇所に、囲い・手すり・覆い等を設けなければならないとされた。",src:"安衛則679条1項",cat:"選択式（安全衛生法）"},
{no:"TAC全国模試-問1",opt:"A",q:"労働基準法第10条に規定する「使用者」とは、労働者と相対する労働契約の締結当事者であって、その使用する労働者に対して賃金を支払う者をいい、労働契約法第2条第2項に規定する「使用者」と同義である。",a:false,exp:"法10条、労働契約法2条2項、昭和22.9.13発基17号、平成24.8.10基発0810第2号。労働基準法10条に規定する「使用者」とは、「事業主又は事業の経営担当者その他その事業の労働者に関する事項について、事業主のために行為をするすべての者」をいうものとされ、同法各条の義務についての履行の責任者としての意義を有するものである。したがって、労働契約法2条2項に規定する使用者（労働者と相対する労働契約の締結当事者であり、その使用する労働者に対して賃金を支払う者）よりも「広い概念」である。",src:"労基法10条・労働契約法2条2項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問1",opt:"B",q:"労働基準法第9条に規定する「労働者」に該当する者であっても、その者が同時にある事項について権限と責任を持っていれば、その事項については、その者が同法第10条に規定する「使用者」となる場合がある。",a:true,exp:"法9条、法10条。設問の通り正しい。労働基準法上の「使用者」は、同法各条の義務についての履行の責任者を指す概念であるため、労働者に該当する者であっても、ある事項について権限と責任を持っていれば、その事項については「使用者」となる場合がある。",src:"労基法9条・10条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問1",opt:"C",q:"非常勤の消防団員であって火災、堤防の決壊等限られた場合のみ出勤するものについては、労働基準法第9条に規定する「労働者」には該当しない。",a:true,exp:"法9条、昭和33.2.13基発90号。設問の通り正しい。",src:"労基法9条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問1",opt:"D",q:"看護師を2、3名雇用して看護師見習の業務に従事させ、かたわら家事その他の業務に従事させる場合は、看護師見習が本来の業務であり、通常これに従事する者は、労働基準法第9条に規定する「労働者」に該当する。",a:true,exp:"法9条、昭和24.4.13基収886号。設問の通り正しい。",src:"労基法9条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問1",opt:"E",q:"在宅勤務者についての、労働基準法第9条に規定する「労働者」に該当するか否かの労働者性の判断においては、勤務時間が定められ、本人の自主管理及び報告により使用者が管理している場合には、その判断要素である「指揮監督下の労働」であることを肯定する重要な要素となる。",a:true,exp:"法9条。設問の通り正しい。労働者性の有無は、「使用従属性」の有無、すなわち「使用される（＝指揮監督下の労働）」であるかどうか、及び「報酬が賃金として支払われている」かどうかを判断する。設問の在宅勤務の態様は、このうちの「指揮監督下の労働」を肯定する要素となる。",src:"労基法9条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問2",opt:"ア",q:"【労働基準法第24条に定める賃金の支払等に関する記述として正しいか】労働基準法第24条第1項では、賃金は、労働協約に別段の定めがある場合においては通貨以外のもので支払うことができることを定めているが、ここにいう「労働協約」は、労働組合法でいう労働協約のみを意味するものであり、労働組合のない場合に労働者の過半数を代表する者と使用者が書面により協定した場合であっても、これを同項の労働協約とみなすことはできない。",a:true,exp:"法24条1項ただし書、昭和63.3.14基発150号。設問の通り正しい。なお、労働協約の定めによって通貨以外のもので支払うことが許されるのは、「その労働協約の適用を受ける労働者」に限られる。",src:"労基法24条1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問2",opt:"イ",q:"【労働基準法第24条に定める賃金の支払等に関する記述として正しいか】就業規則の制限に反して同業他社に就職した退職社員に支給すべき退職金につき、「その点を考慮して、支給額を一般の自己都合による退職の場合の半額と定めることも、本件退職金が功労報償的な性格を併せ有することにかんがみれば、合理性のない措置であるとすることはできない。」とし、その定めは、労働基準法第24条等の規定にはなんら違反するものではないとするのが、最高裁判所の判例である。",a:true,exp:"最二小昭和52.8.9三晃社事件。設問の通り正しい。この場合の退職金の定めは、制限違反の就職をしたことにより勤務中の功労に対する評価が減殺されて、退職金の権利そのものが一般の自己都合による退職の場合の半額の限度においてしか発生しないこととする趣旨であると解すべきであるから、その定めは、その退職金が労働基準法上の賃金にあたるとしても、所論の同法3条（均等待遇）、16条（賠償予定の禁止）、「24条（賃金の全額払の原則）」及び民法90条（公序良俗）等の規定にはなんら違反するものではない、と判示している。",src:"労基法24条・三晃社事件",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問2",opt:"ウ",q:"【労働基準法第24条に定める賃金の支払等に関する記述として正しいか】労働者の不法行為に基づき使用者が労働者に対して損害賠償の請求権を有することとなった場合に、使用者が当該損害賠償と賃金債権とを相殺することは、労働基準法第24条の規定にはなんら違反するものではないとするのが、最高裁判所の判例である。",a:false,exp:"法24条1項、最大判昭和36.5.31日本勧業経済会事件。最高裁判所の判例では「労働基準法24条1項は、労働者の賃金債権に対しては、使用者は、使用者が労働者に対して有する債権をもって相殺することを許されないとの趣旨を包含するものと解するのが相当である。このことは、その債権が「不法行為を原因としたものであっても変りはない」。」と判示している（使用者が不法行為に基づく損害賠償請求権と賃金債権とを相殺することは同項に違反する。）。",src:"労基法24条1項・日本勧業経済会事件",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問2",opt:"エ",q:"【労働基準法第24条に定める賃金の支払等に関する記述として正しいか】労働基準法第24条第2項に定めるいわゆる賃金の一定期日払の原則は、支払日が不安定で間隔が一定しないことによる労働者の計画的生活の困難を防ぐことを意図したものであるため、当該原則に基づき賃金の支払日として定めた日が休日に当たる場合に、当該支払日を繰り上げることは差し支えないが、繰り下げることは、同項に違反するものと解される。",a:false,exp:"法24条2項。賃金の支払日として定めた日が休日に当たる場合においては、その支払日を繰り上げることのみならず、「繰り下げることも法24条2項の規定に違反しない」ものと解される。なお、設問文中の「いわゆる賃金の一定期日払の原則は、支払日が不安定で間隔が一定しないことによる労働者の計画的生活の困難を防ぐことを意図したものである」との記述は正しい。",src:"労基法24条2項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問2",opt:"オ",q:"【労働基準法第24条に定める賃金の支払等に関する記述として正しいか】割増賃金の計算において、1日における時間外労働、休日労働及び深夜業の各々の時間数に1時間未満の端数がある場合、30分未満の端数を切り捨て、それ以上を1時間に切り上げることは、事務簡便を目的としたものと認められるから、労働基準法第24条第1項に違反するものとは取り扱わないこととされている。",a:false,exp:"法24条1項、昭和63.3.14基発150号。割増賃金の計算の基礎となる時間外労働時間等の端数処理において、設問の取扱いは認められていない。なお、「1か月における時間外労働、休日労働及び深夜業の各々の時間数の合計」に1時間未満の端数がある場合、30分未満の端数を切り捨て、それ以上を1時間に切り上げることは、法24条1項違反としては取り扱わないこととされている（設問は「1日における」「各々の時間数」としている点が誤り）。",src:"労基法24条1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問3",opt:"A",q:"無効な解雇が行われた場合において、「使用者の責めに帰すべき事由によって解雇された労働者が解雇期間中に他の職に就いて利益を得たときは、使用者は、右労働者に解雇期間中の賃金を支払うに当たり右利益（以下「中間利益」という。）の額を賃金額から控除することができるが、右賃金額のうち労働基準法12条1項所定の平均賃金の6割に達するまでの部分については利益控除の対象とすることが禁止されているものと解するのが相当である。」とするのが、最高裁判所の判例である。",a:true,exp:"最一小昭和62.4.2あけぼのタクシー事件。設問の通り正しい。無効な解雇が行われた場合には、使用者は、民法536条2項（債務者の危険負担等）の規定により、労働者に対して当該解雇期間中の賃金を支払わなければならないが、労働者が解雇期間中に他の職に就いて利益（中間利益）を得たときは、当該利益を賃金の額から控除して支払うことができるものとされている。設問の判例では、当該控除について判示している。",src:"労基法12条・あけぼのタクシー事件",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問3",opt:"B",q:"平均賃金の額が10,000円である者について、1日の所定労働時間の一部のみ使用者の責に帰すべき事由による休業がなされ、当該日について労働した時間に対する賃金として6,000円が支払われた場合、当該日について休業手当の支払義務は生じない。",a:true,exp:"法26条、昭和27.8.7基収3445号。設問の通り正しい。1日の所定労働時間の一部のみ使用者の責に帰すべき事由による休業がなされた場合においては、現実に労働した時間に対して支払われる賃金が平均賃金の「100分の60」に相当する金額に満たない場合には、その差額を支払わなければならないこととされているが、設問の場合は、現実に労働した時間に対して支払われる賃金が平均賃金の100分の60に達しているため、休業手当の支払義務は生じない。",src:"労基法26条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問3",opt:"C",q:"派遣中の労働者の休業手当について、労働基準法第26条の「使用者の責に帰すべき事由」があるかどうかの判断は、派遣元の使用者についてなされることとされている。",a:true,exp:"法26条、昭和61.6.6基発333号。設問の通り正しい。なお、設問の場合の「使用者の責に帰すべき事由」があるかの判断は、派遣先の事業場が天災地変等の不可抗力によって操業できないために、派遣されている労働者を当該派遣先の事業場で就業させることができない場合であっても、それが使用者の責に帰すべき事由に該当しないこととは必ずしもいえず、派遣元の使用者について、当該労働者を他の事業場に派遣する可能性等を含めて判断し、その責に帰すべき事由に該当しないかどうかを判断することとなる。",src:"労基法26条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問3",opt:"D",q:"使用者の責に帰すべき事由により、労働者を2日以上休業させた場合における休業手当の額の算定に用いる平均賃金は、当該休業の最初の日を算定事由発生日として算定する。",a:true,exp:"法12条。設問の通り正しい。休業手当（使用者の責に帰すべき事由による休業中に支払う手当）の算定事由発生日は、「休業をさせた日（2日以上にわたる場合には、最初の日）」である。",src:"労基法12条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問3",opt:"E",q:"親工場の経営難から下請工場が資材、資金の獲得ができない場合は不可抗力による休業と解され、これを理由として労働者に休業をさせた場合は、使用者に休業手当の支払義務は生じない。",a:false,exp:"法26条、昭和23.6.11基収1998号。親工場の経営難から下請工場が資材、資金の獲得ができない場合は、法26条の「使用者の責に帰すべき事由に該当する」ものと解され、これを理由として労働者に休業をさせた場合は、使用者に休業手当の支払義務が生じる。",src:"労基法26条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問4",opt:"ア",q:"【労働基準法の労働時間等に関する記述として正しいか】労働基準法第32条第1項は「使用者は、労働者に、休憩時間を除き1週間について40時間を超えて、労働させてはならない。」と定めているが、就業規則において同項の1週間を「月曜日から日曜日まで」と定めた場合は、その定めるところにより同項を適用する。",a:true,exp:"法32条1項、昭和63.1.1基発1号。設問の通り正しい。法32条1項にいう「1週間」とは、当該事業場における就業規則その他において定めがある場合にはその定めるところにより、当該定めがない場合には暦週（日曜日から土曜日まで）をいうものと解されている。",src:"労基法32条1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問4",opt:"イ",q:"【労働基準法の労働時間等に関する記述として正しいか】保健衛生の事業において常時8人の労働者を使用する使用者は、労働基準法第40条により1週間について44時間、1日について8時間まで労働させることができるとする特例の下に、同法第32条の2に定めるいわゆる1箇月単位の変形労働時間制を採用することができる。",a:true,exp:"法32条の2,1項、法40条、則25条の2,1項、2項、平成9.3.25基発195号。設問の通り正しい。",src:"労基法32条の2・40条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問4",opt:"ウ",q:"【労働基準法の労働時間等に関する記述として正しいか】労働基準法第36条第4項に定める時間外労働の限度時間は、1箇月について45時間及び1年について360時間（1年単位の変形労働時間制の規定により労働させる場合にあっては、1箇月について42時間及び1年について320時間）とされている。",a:false,exp:"法36条4項。設問のカッコ書内が誤りである。1箇月について42時間及び1年について320時間とする限度時間は、1年単位の変形労働時間制の規定による「対象期間として3箇月を超える期間を定めて」、当該規定により労働させる場合に適用されるところ、設問は、「1年単位の変形労働時間制の規定により労働させる場合」（1年単位の変形労働時間制の対象期間として3箇月を超える期間を定める場合に限定していない。）としている点で誤りである。",src:"労基法36条4項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問4",opt:"エ",q:"【労働基準法の労働時間等に関する記述として正しいか】坑内労働等の労働時間の延長は、1日について2時間を超えてはならないと規定されているが、休日においては、時間外労働の概念がないため、坑内労働等をさせる時間の制限はない。",a:false,exp:"法36条6項1号、平成31.4.1基発0401第43号。坑内労働等の労働時間の延長は、1日について2時間を超えてはならないと規定されているが、休日においては、「10時間（8時間＋2時間）を超えて休日労働をさせることを禁止する法意」であると解されている。",src:"労基法36条6項1号",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問4",opt:"オ",q:"【労働基準法の労働時間等に関する記述として正しいか】労働基準法第35条第2項は、法定休日を定める同条第1項の例外規定として「前項の規定は、4週間を通じ4日以上の休日を与える使用者については適用しない。」と定めているが、同条第2項の適用に関し、業種の限定は定められていない。",a:true,exp:"法35条2項。設問の通り正しい。",src:"労基法35条2項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問5",opt:"A",q:"週休2日制をとる事業場において2日の休日のうち1日労働させたとしても、労働基準法上は休日労働させたことにはならず、当該日の労働について、同法第37条第1項の休日労働に対する割増賃金の支払義務は生じない。",a:true,exp:"法35条1項、法36条1項、法37条1項。設問の通り正しい。休日労働に対する割増賃金は、法定休日に労働させた場合にその支払義務が生じるが、設問においては、他に1日休日（法定休日）を与えているため、休日労働をさせたことにはならず、休日労働に対する割増賃金の支払義務は生じない。なお、所定の休日に労働をさせたことにより1週間について法定労働時間を超えて労働させることとなった場合には、時間外労働に対する割増賃金の支払義務が生じる。",src:"労基法35条・36条・37条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問5",opt:"B",q:"来客当番によって休憩が与えられなかった労働者については、別途休憩を与えることを要するが、来客当番として労働に従事する時間が他の労働時間と通算し、法定労働時間を超える場合においては、使用者に法律上の割増賃金の支払義務が生ずる。",a:true,exp:"法37条1項、昭和23.4.7基収1196号。設問の通り正しい。",src:"労基法37条1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問5",opt:"C",q:"坑内労働については、休憩時間を含め1日の拘束時間が8時間、又は1週間の拘束時間が週の法定労働時間を超えた場合に、使用者に割増賃金の支払義務が生ずる。",a:true,exp:"法37条1項、法38条2項、昭和63.3.14基発150号。設問の通り正しい。",src:"労基法37条1項・38条2項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問5",opt:"D",q:"労働基準法第35条の休日は、原則として午前0時から午後12時までの暦日を指すが、所定労働日における時間外労働が継続して翌日の法定休日に及んだ場合は、たとえ暦日を異にするときであっても始業時刻の属する日の労働として1日の労働とされるので、その法定休日における労働は、所定労働日の時間外労働として2割5分（深夜の時間帯においては5割）以上の率で計算した割増賃金を支払えば足りる。",a:false,exp:"法37条1項、4項、割増賃金令、平成6.5.31基発331号。法定休日の前日の勤務が延長されて法定休日に及んだ場合には、法定休日は暦日をいうので、その日の午前0時から午後12時までの時間帯に労働した部分につき「休日労働に関する割増賃金」を支払う必要がある。したがって、設問の場合は法定休日における労働については「3割5分（深夜の時間帯においては6割）以上の率」で計算した割増賃金を支払わなければならない。",src:"労基法37条1項・4項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問5",opt:"E",q:"タクシー料金の月間水揚高に一定の歩合を乗じて賃金を算定・支給する完全歩合給制において、上告人（労働者）らが被上告人（使用者）に対して賃金を請求した期間（以下「本件請求期間」という。）に上告人らに支給された歩合給の額が、上告人らが時間外及び深夜の労働を行った場合においても増額されるものではなく、通常の労働時間の賃金に当たる部分と時間外及び深夜の割増賃金に当たる部分とを判別することもできないものであった場合において、「この歩合給の支給によって、上告人らに対して労働基準法37条の規定する時間外及び深夜の割増賃金が支払われたとすることは困難なものというべきであり、被上告人は、上告人らに対し、本件請求期間における上告人らの時間外及び深夜の労働について、同条及び労働基準法施行規則19条1項6号の規定に従って計算した額の割増賃金を支払う義務があることになる」とするのが、最高裁判所の判例である。",a:true,exp:"最二小平成6.6.13高知県観光事件。設問の通り正しい。",src:"労基法37条・高知県観光事件",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問6",opt:"A",q:"労働契約が未成年者に不利であると認める場合における当該労働契約の解除権は、所轄労働基準監督署長のみが有するものであり、親権者が当該労働契約を解除することはできない。",a:false,exp:"法58条2項、年少則3条。設問の労働契約の解除権を有するのは、「親権者若しくは後見人又は行政官庁（所轄労働基準監督署長）」であるため、親権者も当該労働契約の解除権を有する。",src:"労基法58条2項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問6",opt:"B",q:"労働基準法第61条第3項の定めにより、交替制によって労働させる事業で年少者を午後10時から午後10時30分まで労働させる場合においては、使用者には、当該30分の深夜業に対する割増賃金の支払義務が発生する。",a:true,exp:"法37条4項、法61条3項、昭和63.3.14基発150号。設問の通り正しい。交替制によって労働させる事業については、行政官庁（所轄労働基準監督署長）の許可を受けて、午後10時30分まで年少者を労働させることができるが、この場合、深夜業に対する割増賃金の支払義務は発生する。",src:"労基法37条4項・61条3項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問6",opt:"C",q:"使用者は、妊娠中の女性及び産後1年を経過しない女性（以下本問において「妊産婦」という。）が請求した場合においては、当該妊産婦を労働基準法第32条の2第1項に定めるいわゆる1箇月単位の変形労働時間制、同法第32条の4第1項に定めるいわゆる1年単位の変形労働時間制及び同法第32条の5第1項に定めるいわゆる1週間単位の非定型的変形労働時間制の下で労働させてはならない。",a:false,exp:"法66条1項。使用者は、妊産婦が請求した場合においては、法32条の2,1項（1箇月単位の変形労働時間制）、法32条の4,1項（1年単位の変形労働時間制）及び法32条の5,1項（1週間単位の非定型的変形労働時間制）の規定にかかわらず、1週間について、又は1日について「法定労働時間を超えて労働させてはならない」のであり、これらの変形労働時間制を適用することそのものを禁止してはいない。なお、当該制限規定により、これらの変形労働時間制の下で労働する妊産婦は、1日又は1週間の法定労働時間を超える時間について労働しないことを請求することができる。",src:"労基法66条1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問6",opt:"D",q:"使用者は、妊娠中の女性が請求した場合であっても、当該女性が労働基準法第41条各号に該当する場合には、他の軽易な業務に転換させる必要はない。",a:false,exp:"法41条、法65条3項。設問の他の軽易な業務への転換の規定は、「法41条に該当する者にも適用される」ため、使用者は、妊娠中の女性が請求した場合においては、当該女性が法41条各号に該当する場合であっても、他の軽易な業務に転換させなければならない。",src:"労基法41条・65条3項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問6",opt:"E",q:"労働基準法第64条の3第1項では、使用者は、妊産婦が請求した場合においては、重量物を取り扱う業務、有害ガスを発散する場所における業務その他妊産婦の妊娠、出産、哺育等に有害な業務に就かせてはならない旨規定している。",a:false,exp:"法64条の3,1項。「妊産婦が請求した場合においては」とする記述が誤りである。法64条の3,1項は、「使用者は、妊娠中の女性及び産後1年を経過しない女性（以下「妊産婦」という。）を、重量物を取り扱う業務、有害ガスを発散する場所における業務その他妊産婦の妊娠、出産、哺育等に有害な業務に就かせてはならない。」と規定している（妊産婦が請求した場合に限定していない。）。",src:"労基法64条の3第1項",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問7",opt:"A",q:"労働基準法第89条により就業規則の作成義務のある使用者が、就業規則を定めない代わりに同条所定の事項を個々の労働契約書に網羅して記載した場合においても、同条の「作成」の義務を免れない。",a:true,exp:"法89条。設問の通り正しい。法89条所定の事項を個々の労働契約書に網羅して記載してあっても、使用者は、就業規則を作成しない限り、同条にいう「作成」の義務を免れない。",src:"労基法89条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問7",opt:"B",q:"中小企業退職金共済制度、確定給付企業年金制度等の社外積立型退職手当制度を利用して退職制度を設けている場合は、労働基準法第89条第3号の2の「退職手当の定めをする場合」に該当するものであり、就業規則に、同号に定める事項を記載しなければならない。",a:true,exp:"法89条3号の2。設問の通り正しい。設問の場合には、「適用される労働者の範囲、退職手当の決定、計算及び支払の方法並びに退職手当の支払の時期」に関する事項を記載しなければならない。",src:"労基法89条3号の2",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問7",opt:"C",q:"病気、事故等による欠勤を労働者の請求により年次有給休暇に振替えることができることとする取扱いが制度として確立している場合は、就業規則に当該取扱いを規定しなければならない。",a:true,exp:"法89条、昭和63.3.14基発150号。設問の通り正しい。",src:"労基法89条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問7",opt:"D",q:"労働者の過半数代表者等の意見が就業規則に全面的に反対するものであると、特定部分に関して反対するものであるとを問わず、また、その反対事由のいかんを問わず、その効力の発生について他の要件を具備する限り、就業規則の効力には影響はない。",a:true,exp:"法90条、昭和24.3.28基発373号。設問の通り正しい。",src:"労基法90条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問7",opt:"E",q:"一賃金支払期に発生した数事案について減給の制裁を行う場合において、一賃金支払期の賃金の総額の10分の1を超えて減給の制裁を行う必要が生じた場合には、その超える部分については次期以降の賃金支払期における賃金から減給をすることを就業規則に定めることは、労働基準法第91条に違反する。",a:false,exp:"法91条、昭和23.9.20基収1789号。設問の定めは、「法91条に違反しない」。なお、一賃金支払期の賃金の総額の10分の1を超えて減給の制裁を行う必要が生じた場合には、その超える部分については次期以降の賃金支払期に延ばさなければならない。",src:"労基法91条",cat:"択一式（労働基準法）"},
{no:"TAC全国模試-問8",opt:"A",q:"特定元方事業者は、その労働者である作業従事者（当該労働者である作業従事者のほか、労働者以外の当該特定元方事業者に係る作業従事者がある場合には、当該者を含む。）及び関係請負人に係る作業従事者の作業が同一の場所において行われることによって生ずる労働災害を防止するために、作業期間中、少なくとも1週間に1回、作業場所を巡視しなければならない。",a:false,exp:"法30条1項3号、則637条1項。設問の巡視については、「毎作業日に少なくとも1回」、これを行わなければならない。",src:"安衛法30条1項3号・則637条1項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問8",opt:"B",q:"労働安全衛生法第122条のいわゆる両罰規定について、事業者が法人の場合、その法人の代表者がその法人の業務に関して同条に定められている各規定の違反行為をしたときは、当該代表者が「行為者」として罰せられるほか、その法人に対しても当該各規定に定める罰金刑が科せられることがある。",a:true,exp:"法122条。設問の通り正しい。両罰規定は、「法人の代表者又は法人若しくは人の代理人、使用人その他の従業者が、その法人又は人の業務に関して、第116条、第117条、第119条又は第120条の違反行為をしたときは、行為者を罰するほか、その法人又は人に対しても、各本条の罰金刑を科する。」と定めている。",src:"安衛法122条",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問8",opt:"C",q:"労働安全衛生法第29条第2項には、元方事業者の講ずべき措置として、「元方事業者は、関係請負人又は関係請負人に係る作業従事者が、当該仕事に関し、この法律又はこれに基づく命令の規定に違反していると認めるときは、是正のため必要な指示を行わなければならない。」との規定が置かれており、この規定の違反には、罰則が設けられている。",a:false,exp:"法29条2項。法29条違反について、「罰則の定めはない」。なお、法29条の規定は、業種のいかんを問わず、元方事業者について適用される。",src:"安衛法29条2項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問8",opt:"D",q:"都道府県労働局長は、労働災害を防止するため必要があると認めるときは、事業者に対し、総括安全衛生管理者の解任を命ずることができる。",a:false,exp:"法10条3項。都道府県労働局長は、労働災害を防止するため必要があると認めるときは、「総括安全衛生管理者の業務の執行について事業者に勧告することができる」。",src:"安衛法10条3項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問8",opt:"E",q:"事業者が労働安全衛生法第17条の規定により安全委員会を設置しなければならない場合、事業者は、当該事業場の労働者の過半数で組織する労働組合との間における労働協約に別段の定めがあるときを除き、その委員の半数については、当該事業場に労働者の過半数で組織する労働組合があるときにおいてはその労働組合、労働者の過半数で組織する労働組合がないときにおいては労働者の過半数を代表する者の推薦に基づき指名しなければならない。",a:false,exp:"法17条4項、5項。設問文中の「その委員の半数」は、正しくは「安全委員会の議長となるべき委員以外の委員の半数」である。",src:"安衛法17条4項・5項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問9",opt:"ア",q:"特定事業の仕事を自ら行う注文者は、建設物、設備又は原材料（以下「建設物等」という。）を、当該仕事を行う場所においてその請負人（当該仕事が数次の請負契約によって行われるときは、当該請負人の請負契約の後次の全ての請負契約の当事者である請負人を含む。）に係る作業従事者（労働者及び労働者と同一の場所において仕事の作業に従事する労働者以外の作業従事者に限る。）に使用させるときは、当該建設物等について、労働災害を防止するため必要な措置を講じなければならない。",a:true,exp:"法31条1項。設問の通り正しい。",src:"安衛法31条1項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問9",opt:"イ",q:"注文者は、その請負人（仕事が数次の請負契約によって行われるときは、当該請負人の請負契約の後次の全ての請負契約の当事者である請負人を含む。）に対し、当該仕事に関し、その指示に従って当該請負人に係る作業従事者が作業を行ったならば、労働安全衛生法又はこれに基づく命令の規定に違反することとなる指示をしてはならない。",a:true,exp:"法31条の4。設問の通り正しい。",src:"安衛法31条の4",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問9",opt:"ウ",q:"事業者は、労働安全衛生法第45条第1項の機械等で政令で定めるものについて同項の規定による自主検査のうち厚生労働省令で定める自主検査（以下「特定自主検査」という。）を行うときは、当該事業者（事業者が法人である場合には、その代表者又は役員）で厚生労働省令で定める資格を有するものが自ら実施し、又はその使用する労働者で当該厚生労働省令で定める資格を有するもの若しくは同法第54条の3第1項に規定する登録を受け、他人の求めに応じて当該機械等について特定自主検査を行う者（以下エにおいて「検査業者」という。）に実施させなければならない。",a:true,exp:"法45条2項。設問の通り正しい。特定自主検査については、従来、「その使用する労働者で厚生労働省令で定める資格を有するもの又は検査業者」に実施させなければならないとされていたが、改正により、これらの者に加えて、「当該事業者（事業者が法人である場合には、その代表者又は役員）で厚生労働省令で定める資格を有するもの」が自ら実施することができることとされた。",src:"安衛法45条2項",cat:"択一式（安全衛生法）"},
{no:"TAC全国模試-問9",opt:"エ",q:"検査業者は、他人の求めに応じて特定自主検査を行うときは、厚生労働省令で定める資格を有する者にこれを実施させなければならない。この場合において、検査業者は、労働安全衛生法第45条第3項の基準（厚生労働大臣の定める基準）に従って特定自主検査を行わなければならない。",a:true,exp:"法54条の4。設問の通り正しい。",src:"安衛法54条の4",cat:"択一式（安全衛生法）"},
