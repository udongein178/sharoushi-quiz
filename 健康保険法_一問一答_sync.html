{no:"TAC社06-問1",opt:"D",q:"強制適用事業所の要件の1つである「常時5人以上」の従業員の員数の算定に当たっては、その事業所に常時使用されるすべての者について計算すべきものとされ、適用除外に該当し被保険者となることができない者であっても当該事業所に常時使用されるものについてはこれを算入すべきものとされている。",a:true,exp:"設問の通り正しい。",src:"法3条3項1号、昭和18.4.5保発905号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問1",opt:"E",q:"任意適用事業所の認可を受けようとする事業主は、当該事業所に常時使用されるすべての者の2分の1以上の同意を得て申請し、厚生労働大臣の認可を受けなければならない。",a:false,exp:"「常時使用されるすべての者の2分の1以上の同意」とする部分が誤りである。任意適用事業所の認可に係る申請における「2分の1以上の同意」は、当該事業所に使用される者のうち、「被保険者となるべき者」の2分の1以上の同意であり、必ずしも「常時使用されるすべての者」の2分の1以上の同意ではない。",src:"法31条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問2",opt:"A",q:"子ども・子育て支援金率を定める際に基礎となる率は、各年度において全ての保険者が納付すべき子ども・子育て支援納付金の総額を当該年度における全ての保険者が管掌する被保険者の総報酬額の総額の見込額で除して得た率とされている。",a:true,exp:"設問の通り正しい。子ども・子育て支援金率は、各年度において全ての保険者が納付すべき子ども・子育て支援納付金の総額を当該年度における全ての保険者が管掌する被保険者の総報酬額の総額の見込額で除した率を基礎として政令で定める率（1000分の2.5）の範囲内において、保険者が定めることとされている。",src:"法160条の2第1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問2",opt:"B",q:"厚生労働大臣は、健康保険法第166条（口座振替による納付）の規定による納付義務者からの申出を承認したときは、同条の金融機関に対し、保険料の納付に必要な納入告知書で納入の告知をしなければならない。ただし、当該保険料の納付に関し必要な事項について同条の金融機関に電磁的記録により通知をしたときは、この限りでない。",a:true,exp:"設問の通り正しい。なお、厚生労働大臣は、保険料納付義務者から口座振替による保険料の納付を希望する旨の申出を受けたときは、その納付が確実と認められ、かつ、その申出の承認が保険料の徴収上有利であると認められるときに限り、その申出を承認することができる。",src:"法166条、則143条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問2",opt:"C",q:"国庫は、健康保険事業の事務の執行に要する費用を負担するほか、健康保険組合管掌健康保険の事業の執行に要する費用のうち、被保険者（日雇特例被保険者を除く。）に係る療養の給付等の保険給付（一定のものを除く。）の支給に要する費用の額、前期高齢者納付金及び流行初期医療確保拠出金の納付に要する費用の額について、所定の方法により算定した額に1000分の130から1000分の200までの範囲内で政令で定める割合を乗じて得た額を補助することとされている。",a:false,exp:"「健康保険組合管掌健康保険の事業」を「全国健康保険協会管掌健康保険の事業」とすると正しい記述となる。国庫は、全国健康保険協会管掌健康保険の事業の執行に要する費用のうち、被保険者（日雇特例被保険者を除く。）に係る主要な保険給付の支給に要する費用等の額について所定の方法により算定した額に1000分の130から1000分の200までの範囲内において、政令で定める割合を乗じて得た額を補助することとされているが、健康保険組合管掌健康保険の事業に要する費用について、同様の補助を行うことは規定されていない。",src:"法153条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問2",opt:"D",q:"厚生労働大臣は、全国健康保険協会と協議を行い、効果的な保険料の徴収を行うために必要があると認めるときは、全国健康保険協会に保険料滞納者に関する情報その他必要な情報を提供するとともに、当該滞納者に係る保険料の徴収を行わせることができる。",a:true,exp:"設問の通り正しい。通常、全国健康保険協会管掌健康保険の被保険者（任意継続被保険者を除く。）に関する保険料は、厚生労働大臣が徴収し、厚生労働大臣が行う健康保険事業の事務の執行に要する費用に相当する額（当該費用に係る国庫負担金の額を除く。）を控除した上で、政府が全国健康保険協会に交付するが、設問の規定により、全国健康保険協会に当該滞納者に関する保険料を徴収させることができ、全国健康保険協会が当該保険料を徴収したときは、その徴収した額に相当する額については、政府から全国健康保険協会に対し、交付したものとみなされる。",src:"法181条の3第1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問2",opt:"E",q:"一般の被保険者が同時に2以上の事業所に使用される場合における各事業主の負担すべき標準報酬月額に係る保険料の額は、原則として、当該被保険者の保険料の半額に、各事業所について健康保険法の標準報酬月額の決定又は改定の規定により算定した額を当該被保険者の報酬月額で除して得た数を乗じて得た額とされている。",a:true,exp:"設問の通り正しい。一般の被保険者が同時に2以上の事業所に使用される場合は、各事業主が保険料の納付義務を負い、各事業主の負担する標準報酬月額に係る保険料の額は、被保険者の各事業所における報酬月額の割合によって按分され、事業所ごとに徴収される。なお、標準賞与額に係る保険料についても、同様に各事業主が支払った賞与額の割合によって按分され、各事業主が負担・納付義務を負う。",src:"法161条4項、令47条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問3",opt:"ア",q:"道路交通法規違反によって処罰されるべき行為（例えば、制限速度超過、無免許運転等）中に起こした事故により死亡した場合は、その死亡事故が、当該犯罪行為と相当因果関係があると認められるときは、健康保険法第116条の規定により、埋葬料は保険給付の制限に該当するものといえるが、死亡は最終1回限りの絶対的事故であること等から埋葬料については、支給して差し支えないとされている。",a:true,exp:"設問の通り正しい。被保険者が、道路交通法規違反による処罰せらるべき行為（例えば、制限速度超過、無免許運転等）中に起こした事故により死亡した場合において、その死亡事故が、当該犯罪行為と相当因果関係があると認められるときは、健康保険法116条の規定により、埋葬料は保険給付の制限に該当するものと考えられるが、死亡は最終1回限りの絶対的な事故であるとともに、この死亡による埋葬料の支給は、被保険者であった者に生計を依存していた者で、埋葬を行うものに対し、その救済又は弔意を目的として支給するという性質のものである趣旨にかんがみ、支給して差し支えないとされている。",src:"法116条、昭和36.7.5保険発63号の2",cat:"択一式（TAC社06）"},
{no:"TAC社06-問3",opt:"イ",q:"子ども・子育て支援納付金の創設に伴い、健康保険組合及び全国健康保険協会が積立てを義務付けられている準備金に係る規定において勘案されている、健康保険組合及び全国健康保険協会が納付の義務を負う介護納付金等の納付に要する費用に、子ども・子育て支援納付金の納付に要する費用が追加されている。準備金のうち、子ども・子育て支援納付金に係る部分については、厚生労働大臣が財務大臣と協議して定める額とされている。",a:false,exp:"「財務大臣」を「内閣総理大臣」とすると、正しい記述となる。準備金のうち、子ども・子育て支援納付金に係る部分については、厚生労働大臣が「内閣総理大臣」と協議して定める額とされている。なお、設問のその他の記述は正しい。",src:"法160条の3、令46条1項・2項、令和7.12.17保発1217第1号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問3",opt:"ウ",q:"全国健康保険協会は、毎事業年度、財務諸表を作成し、これに当該事業年度の事業報告書等を添え、監事及び健康保険法第7条の29第2項の規定により選任された会計監査人の意見を付けて、決算完結後2月以内に厚生労働大臣に提出し、その承認を受けなければならない。",a:true,exp:"設問の通り正しい。",src:"法7条の28第2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問3",opt:"エ",q:"特定適用事業所である適用事業所が、特定適用事業所に該当しなくなった場合は、当該特定適用事業所に使用される特定4分の3未満短時間労働者は、その翌日にその被保険者の資格を喪失する。",a:false,exp:"特定適用事業所である適用事業所が、特定適用事業所に該当しなくなった場合は、当該事業所の事業主が特定適用事業所不該当の申出を行わない限り、当該事業所に使用される特定4分の3未満短時間労働者は、その被保険者資格を喪失することなく、引き続き被保険者となる。なお、当該事業所の事業主が所定の手続きにより特定適用事業所不該当の申出を行った場合は、その申出が受理された日の翌日に、特定4分の3未満短時間労働者は、その被保険者資格を喪失する。",src:"(24)法附則46条2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問3",opt:"オ",q:"後期高齢者医療の被保険者等は、一般の被保険者となることはないが、適用事業所に使用される日雇労働者が厚生労働大臣の承認を受けたときは、後期高齢者医療の被保険者等であっても、日雇特例被保険者となることができる。",a:false,exp:"設問文後半部分が誤りである。適用事業所に使用される日雇労働者である後期高齢者医療の被保険者等が厚生労働大臣の承認を受けて日雇特例被保険者となることができる旨の規定はない。後期高齢者医療の被保険者等は、一般の被保険者又は任意継続被保険者（特例退職被保険者）となることができないほか、日雇特例被保険者となることもできない。",src:"法3条1項7号・2項・8項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問4",opt:"A",q:"被扶養者としての届出に係る者が、被保険者と同一の世帯に属する22歳の子（障害厚生年金の受給要件に該当する程度の障害者ではないものとする。）であり、その年間収入が150万円未満であって、かつ、被保険者の年間収入の2分の1未満である場合は、原則として被扶養者に該当するものとされる。",a:true,exp:"設問の通り正しい。収入がある者についての被扶養者の認定において、被扶養者としての届出に係る者（以下「認定対象者」という。）が被保険者と同一の世帯に属している場合、当該認定対象者の年間収入が130万円未満〔認定対象者が19歳以上23歳未満の者（被保険者の配偶者を除く。）である場合にあっては150万円未満又は60歳以上若しくは概ね厚生年金保険法による障害厚生年金の受給要件に該当する程度の障害者である場合にあっては180万円未満〕であって、かつ、被保険者の年間収入の2分の1未満であるときは、被扶養者に該当することとされている。",src:"法3条7項、平成5.3.5保発15号・庁保発4号、令和7.7.4保発0704第1号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問4",opt:"B",q:"70歳以上の場合の特定疾病に係る高額療養費算定基準額は、特定疾病の種類及び所得区分にかかわらず、10,000円である。",a:true,exp:"設問の通り正しい。なお、特定疾病に係る高額療養費算定基準額は、年齢・所得区分にかかわらず、10,000円を基本とするが、療養のあった月に70歳未満で標準報酬月額が53万円以上の場合に限り、「人工腎臓を実施している慢性腎不全（人工透析治療等）」について20,000円とされている。",src:"法115条、令42条9項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問4",opt:"C",q:"出産手当金の額は、1日につき、出産手当金の支給を始める日の属する月以前の直近の継続した12月間の各月の標準報酬月額（被保険者が現に属する保険者等により定められたものに限る。以下本肢において同じ。）を平均した額の30分の1に相当する額の3分の2に相当する金額であるが、その期間が12月に満たない場合は、①出産手当金の支給を始める日の属する月以前の直近の継続した各月の標準報酬月額を平均した額の30分の1に相当する額、②出産手当金の支給を始める日の属する年度の前年度の9月30日における全被保険者の同月の標準報酬月額を平均した額を標準報酬月額の基礎となる報酬月額とみなしたときの標準報酬月額の30分の1に相当する額、のいずれか少ない額の3分の2に相当する金額とする。",a:true,exp:"設問の通り正しい。",src:"法102条2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問4",opt:"D",q:"被保険者が使用される工場又は事業所の譲渡により事業主に変更があった場合は、納期前であっても、その保険料をすべて徴収することができる。",a:true,exp:"設問の通り正しい。工場又は事業所の譲渡により事業主に変更があった場合は、保険料の繰上徴収の要件となる「被保険者の使用される事業所が、廃止された場合」に含まれ、納期前であっても、その保険料をすべて徴収することができる。",src:"法172条3号、昭和5.11.5保理513号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問4",opt:"E",q:"令和2年4月1日に甲適用事業所に雇い入れられて被保険者の資格を取得した者が令和8年8月15日に当該事業所を退職して被保険者資格を喪失した後に、同月20日に乙適用事業所に雇い入れられて被保険者の資格を再取得した。この場合、その者について、同年8月分の保険料は、甲適用事業所に係るものと乙適用事業所に係るものの両方が算定される。",a:false,exp:"設問の場合における令和8年8月の保険料は、乙適用事業所に係るもののみが算定され、甲適用事業所に係るものは算定されない。保険料の算定は、月を単位とし、各月につき算定されるが、前月から引き続き被保険者である者がその資格を喪失した場合においては、その月分の保険料は算定されない。設問の者は、令和8年8月の前月から引き続き甲適用事業所において被保険者であったので、甲適用事業所における被保険者の資格を喪失した8月分の保険料は算定されないこととなる。また、同月は、乙適用事業所における被保険者資格を取得しているので、乙適用事業所における被保険者として保険料が算定される。",src:"法156条1項・3項、昭和27.7.14保文発129107号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問5",opt:"A",q:"厚生労働大臣は、医師若しくは歯科医師又は薬剤師から保険医又は保険薬剤師の登録の申請があった場合において、申請者が、拘禁刑以上の刑に処せられ、その執行を終わり、又は執行を受けることがなくなるまでの者であるときは、中央社会保険医療協議会の議を経た上で、その登録をしないことができる。",a:false,exp:"「中央社会保険医療協議会」を「地方社会保険医療協議会」とすると正しい記述となる。",src:"法71条2項3号・3項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問5",opt:"B",q:"傷病手当金は、被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときに、その労務に服することができなくなった日から起算して3日を経過した日から労務に服することができない期間支給されるものであるが、医師の指示又は許可のもとに半日出勤し、従前の業務に服する場合は、「労務に服することができない」ことに当たらず、傷病手当金は支給されない。",a:true,exp:"設問の通り正しい。設問の場合のほか、就業時間を短縮せず配置転換により同一事業所内で従前に比しやや軽い労働に服する場合も同様に、傷病手当金は支給されない場合として掲げられている。",src:"法99条1項、昭和29.12.9保文発14236号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問5",opt:"C",q:"特例退職被保険者の標準報酬月額は、当該特例退職被保険者が属する特定健康保険組合が管掌する前年（1月から3月までの標準報酬月額については、前々年）の9月30日における特例退職被保険者以外の全被保険者の同月の標準報酬月額を平均した額と当該特例退職被保険者が退職により被保険者資格を喪失したときの標準報酬月額のいずれか低い額とする。",a:false,exp:"特例退職被保険者の標準報酬月額については、当該特例退職被保険者が属する特定健康保険組合が管掌する前年（1月から3月までの標準報酬月額については、前々年）の9月30日における特例退職被保険者以外の全被保険者の同月の標準報酬月額を平均した額の範囲内においてその規約で定めた額を標準報酬月額の基礎となる報酬月額とみなしたときの標準報酬月額とされている。特例退職被保険者の標準報酬月額は、任意継続被保険者のように、一般の被保険者の資格を喪失したときの標準報酬月額と当該保険者の平均標準報酬月額とを比較して定めるものではない。",src:"法附則3条4項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問5",opt:"D",q:"一時帰休に伴い、就労していたならば受けられるであろう報酬よりも低額な休業手当等を支払われた場合は、その状態が継続して3月を超えるときであっても、固定的賃金の変動に当たらないため、随時改定の対象とならない。",a:false,exp:"一時帰休に伴い、就労していたならば受けられるであろう報酬よりも低額な休業手当等が支払われ、その状態が3月を超える場合は、固定的賃金の変動とみなされ、随時改定の対象となる。",src:"法43条1項、平成15.2.25保保発0225004号・庁保険発3号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問5",opt:"E",q:"出産手当金並びに出産育児一時金及び家族出産育児一時金の支給に要する費用の一部については、政令で定めるところにより、高齢者の医療の確保に関する法律第124条の4第1項の規定により社会保険診療報酬支払基金が保険者に対して交付する出産育児交付金をもって充てる。",a:false,exp:"出産育児交付金は、出産育児一時金及び家族出産育児一時金の支給に要する費用の一部に充てるものであり、出産手当金の支給に要する費用はその対象となっていない。",src:"法152条の2",cat:"択一式（TAC社06）"},
{no:"TAC社06-問6",opt:"A",q:"一般の被保険者が刑事施設、労役場その他これらに準ずる施設に拘禁された場合等には、その者に関する保険料は免除されるが、免除される期間は、原則として、その前月から引き続き一般の被保険者である者がこれに該当したときは、該当した月以後、該当しなくなった月までの期間とされ、一般の被保険者の資格を取得した月においてこれに該当したときは、該当した月の翌月以後、該当しなくなった月までの期間とされている。",a:false,exp:"設問の場合における保険料の免除期間は、前月から引き続き一般の被保険者である者の場合は、拘禁等された月以後、拘禁等されなくなった「月の前月」までの期間であり、一般の被保険者の資格を取得した月に拘禁等された場合は、拘禁等された月の翌月以後、拘禁等されなくなった「月の前月」までの期間である。なお、拘禁等された月において、拘禁等されなくなったときは、その月の保険料は徴収される。",src:"法158条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問6",opt:"B",q:"任意継続被保険者は、健康保険法第38条第7号の規定により保険者に申し出ることにより、その資格を喪失することができ、その場合は、その申出が受理された日の属する月の末日の翌日からその資格を喪失することになるが、当該資格喪失の申出のあった日が保険料納付期日である10日より前であり、当該月の保険料をまだ納付していなかった場合は、同条第3号の規定により、当該月の保険料納付期日の翌日からその資格を喪失することとなる。",a:true,exp:"設問の通り正しい。",src:"法38条7号、令和3.12.27事務連絡",cat:"択一式（TAC社06）"},
{no:"TAC社06-問6",opt:"C",q:"予約に基づく診察は、保険外併用療養費に係る選定療養に該当し、特別の料金を徴収することができるが、特別の料金を徴収するに当たっては、それぞれの患者が予約した時刻に診療を適切に受けられるような体制が確保されていることが必要であり、予約時間から一定時間（30分程度）以上患者を待たせた場合は、予約料の徴収は認められない。",a:true,exp:"設問の通り正しい。",src:"法63条2項5号、法86条1項、令和7.12.26厚労告324号、平成28.6.24保医発0624第3号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問6",opt:"D",q:"厚生労働大臣は、生活療養標準負担額を定めた後に勘案又はしん酌すべき事項に係る事情が著しく変動したときは、速やかにその額を改定しなければならない。",a:true,exp:"設問の通り正しい。なお、入院時食事療養費に係る食事療養標準負担額についても、同様の規定が設けられている。",src:"法85条の2第4項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問6",opt:"E",q:"移送費は、被保険者が療養の給付（保険外併用療養費に係る療養を含む。）を受けるため、病院又は診療所に移送されたときに支給されるものであるが、被保険者が外来療養を受けるために、日常的に通院する場合の交通費に充てることは想定していない。",a:true,exp:"設問の通り正しい。移送費は、通院など一時的、緊急的とは認められない場合は、支給対象としていない。移送費は、被保険者が療養の給付（保険外併用療養費に係る療養を含む。）を受けるため、保険者が、次のいずれにも該当するため必要と認める場合に支給されるものである。①移送により法に基づく適切な療養を受けたこと。②移送の原因である疾病又は負傷により移動をすることが著しく困難であったこと。③緊急その他やむを得なかったこと。",src:"法97条、則81条、平成6.9.9保険発119号・庁保険発9号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問7",opt:"A",q:"その地方に保険医がいない場合又は保険医がいても、その者が傷病のために、診療に従事することができない場合等は、健康保険法第87条第1項の「療養の給付若しくは入院時食事療養費、入院時生活療養費若しくは保険外併用療養費の支給を行うことが困難であるとき」に含まれ、療養費の支給対象となり、また、単に保険診療が不評であるという理由で保険医以外の医師の診療を受けた場合であっても、自己の選定した医師から診療を受けたものであれば、療養費の支給対象となる。",a:false,exp:"設問後半部分が誤りである。単に保険診療が不評であるという理由で保険医以外の医師の診療を受けた場合は、療養費の支給対象とならない。",src:"法87条1項、昭和24.6.6保文発1017号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問7",opt:"B",q:"夫婦がともに70歳未満の被保険者である世帯においては、同一の月に、夫婦がそれぞれ21,000円以上の一部負担金等を支払っている場合であっても、高額療養費の算定における世帯合算は行われないが、夫婦がともに70歳以上の被保険者である場合には、同一の月にそれぞれが支払った一部負担金等の額にかかわらず、世帯合算が行われる。",a:false,exp:"設問後半部分が誤りである。高額療養費の算定における世帯合算は、被保険者及びその被扶養者を単位として行われるものであり、夫婦がともに被保険者である場合は、その年齢にかかわらず、夫婦が支払った一部負担金等の額について世帯合算は行われない。",src:"法115条、令41条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問7",opt:"C",q:"高額療養費の多数回該当について、全国健康保険協会管掌健康保険の被保険者が転職等により管轄の年金事務所に変更があった場合には、その前後に支給された高額療養費の支給回数は通算されない。",a:false,exp:"高額療養費の多数回該当の回数通算は、その管掌する保険者が変わった場合には、通算されないのであって、設問の場合のように全国健康保険協会管掌健康保険の被保険者の管轄の年金事務所に変更があった場合は、保険者に変更があったわけではないので、その前後の高額療養費の支給回数は通算される。",src:"法115条、平成19.3.7保保発0307005号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問7",opt:"D",q:"労働者災害補償保険（以下「労災保険」という。）の任意適用事業所に使用される被保険者に係る通勤災害については、それが、労災保険の保険関係の成立の日前に発生したものであるときは、健康保険により保険給付を行うことになる。ただし、事業主の申請により、保険関係成立の日から労災保険の通勤災害の給付が行われる場合は、この限りでない。",a:true,exp:"設問の通り正しい。健康保険法55条1項の規定により、通勤災害として健康保険から給付しないものとするのは、当該事故が通勤災害の範囲に該当するものであるほか、当該被保険者が使用される事業所につき労災保険が適用され、又は適用されるべき場合である。しかし、設問のように、労災保険の任意適用事業所に使用される被保険者については、それが、労災保険の保険関係の成立の日前に発生したものであるときは、健康保険で保険給付を行うものであることとされる。なお、事業主の申請により保険関係成立の日から労災保険の通勤災害の給付が行われるときは、健康保険から保険給付は行われない。",src:"法55条1項、昭和48.12.1保険発105号・庁保険発24号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問7",opt:"E",q:"厚生労働大臣は、日雇特例被保険者に係る健康保険事業に要する費用に充てるため、保険料を徴収するほか、毎年度、日雇関係組合から拠出金を徴収するものとされており、当該拠出金の納期は、原則として、毎年度終了後6月以内とされている。",a:false,exp:"設問は、日雇拠出金の徴収に関する問題であるが、日雇拠出金の納期は、「毎年度終了後6月以内」ではなく、原則として、毎年度「9月30日及び3月31日」の2回である。なお、それぞれ、当該年度の拠出額の2分の1相当額が対象となるとされている。",src:"法173条1項、令55条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問8",opt:"A",q:"被保険者丙は、令和8年8月18日に療養のため労務に服することができなくなり、同日以後、1日も出社することなく、同月26日に退職して被保険者の資格を喪失した。令和8年8月18日以後、退職日当日まで年次有給休暇を取得しているため傷病手当金の支給を受けている日がない場合であっても、被保険者丙が退職日までに引き続き1年以上被保険者（任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く。）であったときは、資格喪失後の傷病手当金の継続給付の支給要件を満たすこととなる。",a:true,exp:"設問の通り正しい。被保険者丙は、令和8年8月18日に労務不能となり、同月26日の退職日当日まで年次有給休暇を取得しているので、8月18日から20日までの3日間の待期期間は満了している。また、設問では、待期期間満了後退職日当日まで年次有給休暇を取得していることで、報酬との調整により傷病手当金が支給されていないが、資格喪失の際（退職日＝資格喪失日の前日）に傷病手当金の支給を受け得る状態にあり、かつ、資格喪失日の前日までに1年以上被保険者（任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く。）であったことから、資格喪失後の傷病手当金の継続給付の支給要件を満たすことになる。",src:"法104条、法108条1項、法附則3条6項、昭和26.2.20保文発419号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問8",opt:"B",q:"労働者災害補償保険法による休業補償給付を受けている被保険者が、業務外の事由による他の傷病を併発し、健康保険法に基づく療養の給付を受けその傷病についても労務不能となった場合は、同一の事由によるものではないため、休業補償給付と傷病手当金のそれぞれ全額が支給される。",a:false,exp:"設問の場合は、休業補償給付の額が傷病手当金の額を下回るときは、その差額が傷病手当金として支給される。",src:"法108条、昭和33.7.8保険発95号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問8",opt:"C",q:"被保険者が死亡した場合、その被保険者により生計を維持していた者で埋葬を行うものに対し、埋葬料が支給されるが、この場合の「埋葬を行うもの」とは、埋葬を現実に行う者又は行った者ではなく、社会通念上埋葬を行うべきものをいう。",a:true,exp:"設問の通り正しい。",src:"法100条1項、昭和2.7.14保理2788号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問8",opt:"D",q:"診療担当者より受けた診断書、意見書等により一般に療養の指示と認められる事実があったにもかかわらずこれに従わないため、療養上の障害を生じ著しく給付費の増加をもたらすと認められる場合は、健康保険法第119条の「正当な理由がないのに療養に関する指示に従わないとき」に該当し、保険給付の一部を行わないことができる。",a:true,exp:"設問の通り正しい。なお、設問の場合のほか、「保険者又は療養担当者の療養の指示に関する明白な意思表示があったにもかかわらずこれに従わない場合」についても、健康保険法119条の「正当な理由がないのに療養に関する指示に従わないとき」に該当する。",src:"法119条、昭和26.5.9保発37号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問8",opt:"E",q:"被扶養者の認定要件における「同一の世帯」とは、住居及び家計を被保険者と共にしている状況をいう。この場合、同一戸籍内にあることを必ずしも要せず、被保険者が世帯主であることも要しない。",a:true,exp:"設問の通り正しい。",src:"法3条7項、昭和27.6.23保文発3533号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"ア",q:"都道府県知事は、保険医療機関若しくは保険薬局又は指定訪問看護事業者の指定に関し必要があると認めるときは、当該指定に係る開設者若しくは管理者又は申請者の社会保険料の納付状況につき、当該社会保険料を徴収する者に対し、必要な書類の閲覧又は資料の提供を求めることができる。",a:false,exp:"設問の必要な書類の閲覧又は資料の提供を求めることができるのは、「都道府県知事」ではなく、「厚生労働大臣」である。",src:"法199条2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"イ",q:"健康保険法第68条の2第1項の規定により3年以内の期限を付して保険医療機関の指定をされた診療所について、その指定の効力を失う日前6月から同日前3月までの間に、別段の申出がないときは、指定の申請があったものとみなされる。",a:false,exp:"3年以内の期限を付して保険医療機関の指定をされた診療所については、設問の指定の申請のみなし（指定申請手続きの簡素化）の規定は適用されない。",src:"法68条の2",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"ウ",q:"全国健康保険協会が管掌する健康保険の適用事業所においては、厚生労働大臣の承認を受けて、事業主の負担すべき一般保険料等額又は介護保険料額の負担割合を増加することができる。",a:false,exp:"全国健康保険協会が管掌する健康保険では、設問のように事業主の負担すべき一般保険料等額又は介護保険料額の負担割合を増加させることは認められていない。事業主の負担割合の増加が認められているのは、健康保険組合である。",src:"法162条",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"エ",q:"特定適用事業所に使用される特定4分の3未満短時間労働者が一般の被保険者の資格を取得するためには、少なくとも、報酬（最低賃金法で賃金に算入しないものに相当するものを除く。）の月額が88,000円以上であることが必要とされるが、この報酬の額の算定に際して、当該報酬が月給、週給等一定の期間で定められる場合は、被保険者の資格を取得した日現在の報酬の額をその期間の総日数で除して得た額の30倍に相当する額を報酬の月額とする。",a:true,exp:"設問の通り正しい。設問の特定4分の3未満短時間労働者の資格取得要件における「88,000円」の金額は、標準報酬月額の資格取得時決定の例により算定されるので、設問のように、報酬が、月給、週給等一定の期間で定められる場合は、被保険者資格を取得した日現在の報酬の額をその期間の総日数で除して得た額の30倍に相当する額を報酬の月額とする。",src:"法3条1項9号ロ、法42条1項1号、(24)法附則46条1項、令和6.8.21保保発0821第1号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問9",opt:"オ",q:"72歳で療養の給付を受ける月の標準報酬月額が28万円以上である被保険者について、71歳の被扶養者がある場合において、当該被扶養者の収入も含めて年収の額が520万円に満たないときは、申請により、当該被保険者の療養の給付に係る一部負担金の割合を100分の20とすることができる。",a:true,exp:"設問の通り正しい。70歳以上の被保険者で、療養の給付を受ける月の標準報酬月額が28万円以上であるものに係る一部負担金の負担割合は100分の30とすることが原則であるが、70歳以上の被扶養者がある被保険者については、当該被扶養者の収入も含めて年収の額が520万円に満たないとき、また、当該被扶養者がいない被保険者については、年収の額が383万円に満たないときは、申請により、一部負担金の負担割合を100分の20とすることができる。",src:"法74条1項3号、令34条1項・2項1号",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"A",q:"一般の被保険者が出産（多胎妊娠ではないものとする。）の日以前42日から出産の日後56日までの間において、通常の労務に服し報酬を受けている日がある場合、その日については、調整により出産手当金は支給しないこととするのが原則であるが、その間に支給される報酬の額が出産手当金の額に満たないときは、その差額が出産手当金として支給される。",a:false,exp:"出産手当金は、「労務に服さなかった」期間について支給されるものである。設問の場合、報酬の額が出産手当金の額に満たないとしても、労務に服しているので、その期間について出産手当金が支給されることはない。",src:"法99条1項カッコ書、法102条1項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"B",q:"保険者等は、①被保険者に関する保険料の納入の告知をした後に告知をした保険料額が、当該納付義務者の納付すべき保険料額を超えていることを知ったとき、又は、②納付した被保険者に関する保険料額が、当該納付義務者の納付すべき保険料額を超えていることを知ったときは、その超えている部分に関する納入の告知（①の場合）又は納付（②の場合）を、当該告知又は納付の日の翌日から6月以内の期日に納付されるべき保険料について納期を繰り上げてしたものとみなすことができる。",a:true,exp:"設問の通り正しい。",src:"法164条2項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"C",q:"訪問看護療養費の額は、当該指定訪問看護につき指定訪問看護に要する平均的な費用の額を勘案して厚生労働大臣が定めるところにより算定した費用の額から、その額に健康保険法第74条第1項各号（一部負担金）に掲げる場合の区分に応じ、同項各号に定める割合を乗じて得た額（療養の給付に係る同項の一部負担金について同法第75条の2第1項各号（一部負担金の額の特例）の措置が採られるべきときは、当該措置が採られたものとした場合の額）を控除した額とする。",a:true,exp:"設問の通り正しい。",src:"法88条4項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"D",q:"日雇特例被保険者に係る傷病手当金の支給期間は、同一の疾病又は負傷及びこれにより発した疾病に関しては、その支給を始めた日から起算して6月（厚生労働大臣が指定する疾病に関しては、1年6月）を超えないものとする。",a:true,exp:"設問の通り正しい。なお、日雇特例被保険者に係る傷病手当金の支給期間は、日雇特例被保険者以外の被保険者に係る傷病手当金とは異なり、その支給を始めた日から「通算して」6月間（1年6月間）ではないことに注意すること。",src:"法135条3項",cat:"択一式（TAC社06）"},
{no:"TAC社06-問10",opt:"E",q:"健康保険組合の設立を命ぜられた事業主が、正当な理由がなくて厚生労働大臣が指定する期日までに設立の認可を申請しなかったときは、その手続の遅延した期間、その負担すべき保険料額の2倍に相当する金額以下の過料に処せられる。",a:true,exp:"設問の通り正しい。",src:"法218条",cat:"択一式（TAC社06）"},
{no:"LEC第2回-問1",opt:"ア",q:"夫婦とも被用者保険の被保険者の場合の被扶養者の認定に当たっては、被扶養者とすべき者の員数にかかわらず、被保険者の年間収入が多い方の被扶養者とするのが原則とされているが、この場合の年間収入とは、過去の収入、現時点の収入、将来の収入等から今後1年間の収入を見込んだものをいう。",a:true,exp:"本肢のとおり正しい（令3.4.30保保発0430第2号）。",src:"令3.4.30保保発0430第2号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"イ",q:"被保険者が手術に伴って受けた保存血による輸血は、療養費の支給対象となる。",a:false,exp:"被保険者が手術に伴って受けた保存血による輸血は、「療養の給付」が行われる（昭14.5.13社医発336号）。なお、生血による輸血に係る血液料金は療養費の支給対象となる。",src:"昭14.5.13社医発336号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"ウ",q:"被保険者の資格に関する処分に不服がある者が社会保険審査官に対して審査請求をした日から1月以内に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる。",a:false,exp:"審査請求をした日から「2月以内」に決定がないときは、審査請求人は、社会保険審査官が審査請求を棄却したものとみなすことができる（法189条2項）。",src:"法189条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"エ",q:"被保険者が妊娠4か月以上の出産をした場合であっても、それが父が不明のいわゆる婚外子出産である場合には、出産育児一時金は支給されない。",a:false,exp:"被保険者が妊娠4か月以上の出産をした場合は、それが父が不明のいわゆる婚外子出産である場合であっても、出産育児一時金が「支給される」（昭2.3.17保理792号ほか）。",src:"昭2.3.17保理792号ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問1",opt:"オ",q:"子ども・子育て支援金率は、各年度において全ての保険者が納付すべき子ども・子育て支援納付金の総額を当該年度における全ての保険者が管掌する被保険者の総報酬額の総額の見込額で除した率を基礎として政令で定める率の範囲内において、保険者が定める。",a:true,exp:"本肢のとおり正しい（法160条の2第1項）。なお、全国健康保険協会は、子ども・子育て支援金率を定めたときは、厚生労働省令で定めるところにより、遅滞なく、その旨を厚生労働大臣に通知しなければならない。",src:"法160条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"A",q:"健康保険組合の理事の定数は、9人以内とされ、設立事業所の事業主、被保険者である組合員及び健康保険組合の業務の適正な運営に必要な学識経験を有する者のうちから、当該健康保険組合が各同数を任命する。",a:false,exp:"健康保険組合の理事の定数は、「偶数とし、その半数は設立事業所の事業主の選定した組合会議員において、他の半数は被保険者である組合員の互選した組合会議員において、それぞれ互選する」（法21条2項）。",src:"法21条2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"B",q:"被保険者の資格を喪失した後、配偶者の被扶養者となった者が6月以内に出産した場合において、当該出産が資格喪失後の出産育児一時金と家族出産育児一時金の両方の支給対象となるときは、家族出産育児一時金の支給が優先され、資格喪失後の出産育児一時金は支給されない。",a:false,exp:"被保険者資格喪失後6月以内に出産した者が健康保険の被扶養者になっている場合は、被保険者本人として資格喪失後の出産育児一時金を受給するか、被扶養者としての家族出産育児一時金を受給するかは、「請求者の選択にまかせる」ものとされている。したがって、資格喪失後の出産育児一時金が支給される場合もある（昭48.11.7保険発99号・庁保険発21号）。",src:"昭48.11.7保険発99号・庁保険発21号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"C",q:"被保険者の資格取得時決定の際に、時間外労働に係る時間外手当を1万円と見込んで報酬月額を算定して標準報酬月額が決定された後、実際の時間外手当の金額が当初の見込みより増減した場合、事業主からの届出に基づき、標準報酬月額の訂正が行われる。",a:false,exp:"被保険者資格を取得した際の標準報酬月額については、固定的賃金の算定誤り等があった場合に訂正を行うことはできるが、「残業代のような非固定的賃金について、その見込みが当初の算定額より増減した場合は、訂正することはできない」（令5.6.27事務連絡）。",src:"令5.6.27事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"D",q:"地域型健康保険組合は、当該合併が行われた日の属する年度及びこれに続く5箇年度に限り、健康保険法第160条第13項において準用する同条第1項に規定する範囲内において、不均一の一般保険料率を決定することができる。",a:true,exp:"本肢のとおり正しい（法附則3条の2第1項）。",src:"法附則3条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問2",opt:"E",q:"任意継続被保険者が、任意継続被保険者でなくなることを希望する旨を保険者に申し出た場合、当該任意継続被保険者は、その申し出た日の翌日に任意継続被保険者の資格を喪失する。",a:false,exp:"任意継続被保険者が、任意継続被保険者でなくなることを希望する旨を保険者に申し出た場合において、「その申出が受理された日の属する月の末日が到来したとき」は、当該任意継続被保険者は、「その日の翌日」（つまり、申出が受理された日の属する月の翌月1日）に任意継続被保険者の資格を喪失する（法38条）。",src:"法38条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"A",q:"保険料が前納された後、前納に係る期間の経過前において任意継続被保険者に係る保険料の額の引下げが行われることとなった場合においては、前納された保険料の額のうち当該保険料の額の引下げが行われることとなった後の期間に係る額から当該期間の各月につき納付すべきこととなる保険料の額の合計額を控除した額は、当該前納に係る期間の後に引き続き保険料を前納することができる期間に係る前納されるべき保険料の額の一部とみなす。ただし、当該任意継続被保険者の請求があったときは、当該控除した額が当該任意継続被保険者に還付される。",a:true,exp:"本肢のとおり正しい（健康保険法施行規則140条）。なお、前納した保険料の還付を請求しようとする者は、所定の事項を記載した還付請求書を、所定の保険者に提出しなければならない（則141条1項）。",src:"則140条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"B",q:"被保険者が食事療養を受けた際に負担した食事療養標準負担額及び生活療養を受けた際に負担した生活療養標準負担額は、高額療養費の算定対象とならない。",a:true,exp:"本肢のとおり正しい（法115条1項ほか）。",src:"法115条1項ほか",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"C",q:"被保険者が療養のため労務に服することができない日であっても、その日が事業所の公休日とされている場合は、その日については傷病手当金は支給されない。",a:false,exp:"事業所の公休日、日曜、祭日であっても、療養のため労務に服することができない状態にあれば、その他の要件を満たすことにより、傷病手当金は「支給される」（昭2.2.5保理659号）。",src:"昭2.2.5保理659号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"D",q:"日雇特例被保険者手帳の交付の申請に関して虚偽の申請をした者は、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:true,exp:"本肢のとおり正しい（法211条）。",src:"法211条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問3",opt:"E",q:"保険者は、保険給付に関する処分を行ったときは、速やかに、文書でその内容を申請者に通知しなければならない。この場合において、保険給付の全部又は一部につき不支給の処分をしたときは、その理由を付記しなければならない。",a:true,exp:"本肢のとおり正しい（則112条）。",src:"則112条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"A",q:"特例退職被保険者の標準報酬月額は、当該特定健康保険組合が管掌する前年（1月から3月までの標準報酬月額については、前々年）の3月31日における特例退職被保険者以外の全被保険者の同月の標準報酬月額を平均した額の範囲内においてその規約で定めた額を標準報酬月額の基礎となる報酬月額とみなしたときの標準報酬月額である。",a:false,exp:"特例退職被保険者の標準報酬月額は、当該特定健康保険組合が管掌する前年（1月から3月までの標準報酬月額については、前々年）の「9月30日」における特例退職被保険者以外の全被保険者の同月の標準報酬月額を平均した額の範囲内においてその規約で定めた額を標準報酬月額の基礎となる報酬月額とみなしたときの標準報酬月額である（法附則3条4項）。",src:"法附則3条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"B",q:"厚生労働大臣は、健康保険法第85条第2項の入院時食事療養費に係る食事療養に関する費用の額の算定に関する基準を定めようとするときは、社会保障審議会に諮問するものとされている。",a:false,exp:"厚生労働大臣は、入院時食事療養費に係る食事療養に関する費用の額の算定に関する基準を定めようとするときは、「中央社会保険医療協議会」に諮問するものとされている（法85条3項）。",src:"法85条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"C",q:"全国健康保険協会は、毎事業年度、財務諸表を作成し、これに当該事業年度の事業報告書等を添え、監事及び会計監査人の意見を付けて、決算完結後2月以内に財務大臣に提出し、その承認を受けなければならない。",a:false,exp:"全国健康保険協会は、毎事業年度、財務諸表を作成し、これに当該事業年度の事業報告書等を添え、監事及び会計監査人の意見を付けて、決算完結後2月以内に「厚生労働大臣」に提出し、その承認を受けなければならない（法7条の28第2項）。",src:"法7条の28第2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"D",q:"特定健康保険組合について、厚生労働大臣の認可の取消しを受けようとするときは、申請書に、認可の取消しを受けることにつき当該健康保険組合の組合会において議員定数の4分の3以上の多数により議決していることを証する書類を添付して、厚生労働大臣に提出しなければならない。",a:false,exp:"特定健康保険組合について、厚生労働大臣の認可の取消しを受けようとするときは、申請書に、認可の取消しを受けることにつき当該健康保険組合の組合会において議員定数の「3分の2以上」の多数により議決していることを証する書類を添付して、厚生労働大臣に提出しなければならない（則166条）。",src:"則166条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問4",opt:"E",q:"業務災害により労災保険法の休業補償給付を受けている期間中に私傷病により労務不能となったため、傷病手当金の支給も受けることができることとなった場合、当該傷病手当金の額が当該休業補償給付の額を上回っていれば、休業補償給付に加えて、その差額が傷病手当金として支給される。",a:true,exp:"本肢のとおり正しい（昭33.7.8保険発95号の2）。",src:"昭33.7.8保険発95号の2",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"ア",q:"健康保険組合の設立を命ぜられた事業主が、正当な理由がなくて厚生労働大臣が指定する期日までに設立の認可を申請しなかったときは、その手続の遅延した期間、その負担すべき保険料額の3倍に相当する金額以下の過料に処せられる。",a:false,exp:"健康保険組合の設立を命ぜられた事業主が、正当な理由がなくて厚生労働大臣が指定する期日までに設立の認可を申請しなかったときは、その手続の遅延した期間、その負担すべき保険料額の「2倍」に相当する金額以下の過料に処せられる（法218条）。",src:"法218条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"イ",q:"育児休業等を終了した際の標準報酬月額の改定は、育児休業等終了日の翌日が属する月以後3月間に受けた報酬の総額をその期間の月数で除して得た額を報酬月額とした場合の標準報酬月額が、その者について既に決定されている標準報酬月額と比較して2等級以上の差が生じていなければ、行われない。",a:false,exp:"育児休業等終了時改定は、随時改定とは異なり、「標準報酬月額に2等級以上の差が生じない場合であっても、他の要件を満たす限り行われる」（法43条の2第1項）。",src:"法43条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"ウ",q:"診療所又は薬局が医師若しくは歯科医師又は薬剤師の開設したものであり、かつ、当該開設者（医療法第30条の18の6第6項の規定による都道府県知事の要請を受け、これに応じなかった者を除く。）である医師若しくは歯科医師又は薬剤師のみが診療又は調剤に従事している場合において、当該医師若しくは歯科医師又は薬剤師について保険医又は保険薬剤師の登録があったときは、当該診療所又は薬局について、保険医療機関又は保険薬局の指定があったものとみなされる。ただし、当該診療所又は薬局が、健康保険法第65条第3項又は第4項の保険医療機関又は保険薬局の指定拒否又は一部指定拒否に規定する要件に該当する場合であって、厚生労働大臣が当該指定があったものとみなすことが不適当と認められるときは、この限りでない。",a:true,exp:"本肢のとおり正しい（法69条）。",src:"法69条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"エ",q:"健康保険組合の監事は、理事又は健康保険組合の職員と兼ねることができない。",a:true,exp:"本肢のとおり正しい（法21条5項）。",src:"法21条5項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問5",opt:"オ",q:"健康保険組合は、組合会において組合会議員の定数の4分の3以上の多数により議決した上で厚生労働大臣の認可を受けることにより、健康保険組合の分割をすることができるが、当該分割は、設立事業所の一部について行うことはできない。",a:true,exp:"本肢のとおり正しい（法24条1項・2項）。なお、分割によって健康保険組合を設立するには、分割により設立される健康保険組合の設立事業所となるべき適用事業所の事業主が規約を作り、その他設立に必要な行為をしなければならない（同条4項）。",src:"法24条1項・2項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"A",q:"事業主に変更があったときは、変更前の事業主は、5日以内に、事業所の名称及び所在地、変更前の事業主及び変更後の事業主の氏名又は名称及び住所並びに変更の年月日を記載した届書を厚生労働大臣又は健康保険組合に提出しなければならない。",a:false,exp:"事業主に変更があったときは、「変更後」の事業主は、5日以内に、事業所の名称及び所在地、変更前の事業主及び変更後の事業主の氏名又は名称及び住所並びに変更の年月日を記載した届書を厚生労働大臣又は健康保険組合に提出しなければならない（則31条）。",src:"則31条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"B",q:"高額介護合算療養費は、介護合算一部負担金等世帯合算額から介護合算算定基準額を控除して得た額が500円を超えない場合には、支給されない。",a:true,exp:"本肢のとおり正しい（令43条の2第1項、平20.3.31厚労告225号）。",src:"令43条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"C",q:"被保険者について「奨学金返還支援（代理返還）」を利用して給与規程等に基づいて支給される給与とは別に事業主が返還金を日本学生支援機構に直接送金する場合は、その返還金に相当する額は、事業主から被保険者に対する報酬等に該当する。",a:false,exp:"「奨学金返還支援（代理返還）」を利用して給与とは別に事業主が直接返還金を送金する場合は、当該返還金が奨学金の返済に充てられることが明らかであり、被保険者の通常の生計に充てられるものではないことから「報酬等に該当しない」（令5.6.27事務連絡）。",src:"令5.6.27事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"D",q:"全国健康保険協会が都道府県単位保険料率を変更しようとするときは、あらかじめ、理事長が当該変更に係る都道府県に所在する支部の支部長の同意を得た上で、運営委員会の議を経なければならない。",a:false,exp:"全国健康保険協会が都道府県単位保険料率を変更しようとするときは、あらかじめ、理事長が当該変更に係る都道府県に所在する支部の支部長の「意見を聴いた上」で、運営委員会の議を経なければならない（法160条6項）。",src:"法160条6項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問6",opt:"E",q:"被保険者が闘争、泥酔又は著しい不行跡によって給付事由を生じさせたときは、当該給付事由に係る保険給付の一部を行わないことができるが、その全部を行わないこととすることまではできない。",a:false,exp:"被保険者が闘争、泥酔又は著しい不行跡によって給付事由を生じさせたときは、当該給付事由に係る保険給付は、その「全部」又は一部を行わないことができる（法117条）。",src:"法117条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"A",q:"日雇特例被保険者が死亡した場合において、その死亡が療養の給付を受けなくなった日後6月以内であったときは、その者により生計を維持していた者であって、埋葬を行うものに対し、埋葬料が支給される。",a:false,exp:"日雇特例被保険者が死亡した場合において、その死亡が療養の給付を受けなくなった日後「3月以内」であったときは、その者により生計を維持していた者であって、埋葬を行うものに対し、埋葬料が支給される（法136条1項）。",src:"法136条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"B",q:"全国健康保険協会は、厚生労働省令で定める重要な財産を譲渡し、又は担保に供しようとするときは、あらかじめその旨を厚生労働大臣に届け出なければならない。",a:false,exp:"全国健康保険協会は、厚生労働省令で定める重要な財産を譲渡し、又は担保に供しようとするときは、「厚生労働大臣の認可を受けなければならない」（法7条の34）。",src:"法7条の34",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"C",q:"被扶養者の要件のうち、「被保険者と同一の世帯に属する」とは、被保険者と住居及び家計を共同にし、かつ、被保険者と同一戸籍内にあることをいう。",a:false,exp:"被扶養者の要件のうち、「被保険者と同一の世帯に属する」とは、被保険者と住居及び家計を共同にする者をいい、「同一戸籍内にあるか否かは問われない」（昭15.6.26社発7号）。なお、被保険者が世帯主であることも要しない。",src:"昭15.6.26社発7号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"D",q:"現に海外にある被保険者からの療養費の支給申請は、原則として、事業主等を経由して行わせるものとされているが、療養費の受領を事業主等が代理して行うことは認められないため、直接被保険者に対して療養費の金額が送金されなければならない。",a:false,exp:"現に海外にある被保険者からの療養費の支給申請は、原則として、事業主等を経由して行わせ、その受領は、「事業主等が代理して行うため、保険者からの直接の海外送金は行われない」（昭56.2.25保険発10号・庁保険発2号）。",src:"昭56.2.25保険発10号・庁保険発2号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問7",opt:"E",q:"健康保険法施行規則第50条第1項の規定により保険者による検認又は更新が行われた場合において、その検認又は更新を受けない資格確認書は無効とされる。",a:true,exp:"本肢のとおり正しい（則50条9項）。なお、保険者は、毎年一定の期日を定め、資格確認書の検認若しくは更新又は被扶養者に係る確認をすることができる。",src:"則50条9項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"A",q:"厚生労働大臣は、診療所の開設者又は管理者が医療法第30条の18の6第6項の規定による地域外来医療の提供に係る都道府県知事の要請を受け、これに応じなかった場合において、保険医療機関の指定を行うときは、3年以内の期限を付することができる。",a:true,exp:"本肢のとおり正しい（法68条の2第1項）。",src:"法68条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"B",q:"保険者は、保険医療機関が偽りその他不正の行為によって療養の給付に関する費用の支払を受けたときは、当該保険医療機関に対し、その支払った額につき返還させるほか、その返還させる額に100分の40を乗じて得た額を支払わせることができる。",a:true,exp:"本肢のとおり正しい（法58条3項）。",src:"法58条3項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"C",q:"厚生労働大臣は、保険医療機関の指定の申請があった場合において、その指定をしないこととするときは、当該医療機関の開設者に対し、弁明の機会を与えなければならない。この場合においては、あらかじめ、書面で、弁明をすべき日時、場所及びその事由を通知しなければならない。",a:true,exp:"本肢のとおり正しい（法83条）。",src:"法83条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"D",q:"報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合においては、その価額は、その地方の時価によって、保険者が定める。",a:false,exp:"報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合においては、その価額は、その地方の時価によって、「厚生労働大臣」が定める（法46条1項）。なお、健康保険組合は、現物給与の価額について、規約で別段の定めをすることができる。",src:"法46条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問8",opt:"E",q:"被扶養者としての認定対象者であって、19歳以上23歳未満であるもの（配偶者（届出をしていないが、事実上婚姻関係と同様の事情にある者を含む。）を除く。）が被保険者と同一世帯に属している場合、当該認定対象者の年間収入が150万円未満であって、かつ、被保険者の年間収入の2分の1未満である場合は、原則として、当該認定対象者は被扶養者に該当する。",a:true,exp:"本肢のとおり正しい（令7.7.4事務連絡）。",src:"令7.7.4事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"A",q:"厚生労働大臣は、全国健康保険協会が管掌する健康保険の被保険者に対し、被保険者情報の登録又は健康保険法施行規則の規定による資格確認書の交付、提供、返付若しくは再交付が行われるまでの間に当該被保険者を使用する事業主又は当該被保険者から求めがあった場合において、当該被保険者が療養を受ける必要があると認めたときに限り、被保険者資格証明書を有効期限を定めて交付するものとされている。",a:true,exp:"本肢のとおり正しい（則50条の2第1項）。",src:"則50条の2第1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"B",q:"健康保険組合が厚生労働大臣に提出すべき書類は、当該健康保険組合の主たる事務所の所在地を管轄する年金事務所を経由するものとされている。",a:false,exp:"健康保険組合が厚生労働大臣に提出すべき書類は、当該健康保険組合の主たる事務所の所在地を管轄する「地方厚生局長等」を経由するものとされている（則18条）。",src:"則18条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"C",q:"コルセットの装着について療養費が支給される場合において、当該コルセットの装着が令和8年7月31日に行われ、当該装着に係る代金が同年8月10日に支払われたときは、当該療養費を受ける権利の消滅時効の起算日は、同年8月1日である。",a:false,exp:"療養費の請求権の消滅時効は、療養費の請求権が発生し、かつ、これを行使し得るに至った日の翌日から起算されるものであるため、本肢の場合には、コルセットの代金を支払った日の翌日である「令和8年8月11日」が消滅時効の起算日となる（昭31.3.31保文発1903号）。",src:"昭31.3.31保文発1903号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"D",q:"任意継続被保険者の保険料の前納は、1月から6月まで若しくは7月から12月までの6月間又は1月から12月までの12月間を単位として行うものとされている。ただし、当該6月又は12月の間において、任意継続被保険者の資格を取得した者又はその資格を喪失することが明らかである者については、当該6月間又は12月間のうち、その資格を取得した日の属する月の翌月以降の期間又はその資格を喪失する日の属する月の前月までの期間の保険料について前納を行うことができる。",a:false,exp:"任意継続被保険者の保険料の前納は、「4月から9月まで」若しくは「10月から翌年3月まで」の6月間又は「4月から翌年3月まで」の12月間を単位として行うものとされている（令48条）。ただし書（資格取得・喪失が明らかな者の取扱い）は本肢のとおり。",src:"令48条",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問9",opt:"E",q:"適用事業所に使用されなくなったために被保険者の資格を喪失した者が任意継続被保険者となるための要件の1つとして、喪失の日の前日まで継続して2年以上被保険者（日雇特例被保険者、任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く。）であった者であることが必要である。",a:false,exp:"適用事業所に使用されなくなったために被保険者の資格を喪失した者が任意継続被保険者となるための要件の1つとして、喪失の日の前日まで継続して「2月以上」被保険者（日雇特例被保険者、任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く）であった者であることが必要である（法3条4項）。",src:"法3条4項",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"A",q:"保険者が第三者の行為によって生じた事故について保険給付をしたときにその給付の価額の限度において被保険者が第三者に対して有する損害賠償請求の権利を取得するのは、健康保険法の規定に基づく法律上当然の取得であり、当該損害賠償請求権は保険者に当然に移転するものである。したがって、一般の債権譲渡のように、第三者に対する通知又はその承諾を要件とするものではない。",a:true,exp:"本肢のとおり正しい（昭31.11.7保文発9218号）。",src:"昭31.11.7保文発9218号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"B",q:"事業譲渡によって、被保険者を使用している事業主が変更された場合、保険料の繰上徴収が行われる場合がある。",a:true,exp:"本肢のとおり正しい（昭5.11.5保理513号）。",src:"昭5.11.5保理513号",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"C",q:"海外において臓器移植を受ける患者が、海外へ渡航するために利用した航空機等の費用については、移送費の対象となる。",a:false,exp:"移送費は、被保険者が療養の給付（保険外併用療養費に係る療養を含む）を受けるため、病院又は診療所に移送されたときに支給されるものである。海外での治療は、療養の給付を受けることには該当しないため、「移送費は支給されない」（平29.12.22事務連絡）。",src:"平29.12.22事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"D",q:"被扶養者としての認定対象者の年間収入の判定に当たって、労働契約に明確な規定がなく、労働契約段階では時間外労働の見込みがなかった場合は、扶養認定時点で時間外労働が発生していたとしても、当年度においては一時的な収入変動とみなして、当該時間外労働に対する賃金等は認定対象者の年間収入の見込額には含めないものとされている。",a:true,exp:"本肢のとおり正しい（令7.10.1事務連絡）。",src:"令7.10.1事務連絡",cat:"択一式（LEC公開模試）"},
{no:"LEC第2回-問10",opt:"E",q:"傷病手当金の支給期間は、初回の申請から3日間の待期期間を経て、支給を始める4日目より暦に従って1年6月間の計算を行い、確定される。当該支給期間は、傷病手当金の支給単位で減少し、途中に傷病手当金が支給されない無支給期間がある場合には、当該無支給期間の日数分について支給期間は減少しない。",a:true,exp:"本肢のとおり正しい（令3.12.27事務連絡ほか）。傷病手当金の支給期間は、同一の疾病又は負傷及びこれにより発した疾病に関しては、その支給を始めた日から通算して1年6月間とされている。",src:"令3.12.27事務連絡ほか",cat:"択一式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問1",opt:"空欄A",context:"【A】に係る健康保険事業を行うため、全国健康保険協会（以下本問において「協会」とする。）を設ける。",choices:["健康保険組合の組合員でない被保険者", "健康保険法の被扶養者でない者", "健康保険法の被保険者、被保険者であった者及び被保険者になろうとする者", "国民健康保険法の被保険者でない者"],answer:"健康保険組合の組合員でない被保険者",exp:"正解は「健康保険組合の組合員でない被保険者」。協会は、健康保険組合の組合員でない被保険者に係る健康保険事業を行うため設けられる。",src:"法7条の2第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問1",opt:"空欄B",context:"協会は、都道府県ごとの実情に応じた業務の適正な運営に資するため、支部ごとに【B】を設け、当該支部における業務の実施について、【B】の意見を聴くものとする。",choices:["評議会", "運営委員会", "運営協議会", "保険者協議会"],answer:"評議会",exp:"正解は「評議会」。協会は、支部ごとに評議会を設け、当該支部における業務の実施について評議会の意見を聴くものとされている。",src:"法7条の21",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問1",opt:"空欄C",context:"協会は、毎事業年度、貸借対照表、損益計算書、利益の処分又は損失の処理に関する書類その他厚生労働省令で定める書類及びこれらの附属明細書を作成し、これに当該事業年度の事業報告書及び決算報告書を添え、【C】及び健康保険法第7条の29第2項の規定により選任された会計監査人の意見を付けて、決算完結後2月以内に厚生労働大臣に提出し、その承認を受けなければならない。",choices:["監事", "役員", "理事", "職員"],answer:"監事",exp:"正解は「監事」。財務諸表等には、監事及び会計監査人の意見を付けて、決算完結後2月以内に厚生労働大臣に提出し、その承認を受けなければならない。",src:"法7条の28第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問1",opt:"空欄D",context:"協会は、毎事業年度、貸借対照表、損益計算書、利益の処分又は損失の処理に関する書類その他厚生労働省令で定める書類及びこれらの附属明細書を作成し、これに当該事業年度の事業報告書及び決算報告書を添え、監事及び健康保険法第7条の29第2項の規定により選任された会計監査人の意見を付けて、決算完結後【D】に提出し、その承認を受けなければならない。",choices:["2月以内に厚生労働大臣", "2月以内に都道府県知事", "3月以内に厚生労働大臣", "3月以内に都道府県知事"],answer:"2月以内に厚生労働大臣",exp:"正解は「2月以内に厚生労働大臣」。提出先は厚生労働大臣、期限は決算完結後2月以内である。",src:"法7条の28第2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問1",opt:"空欄E",context:"協会の業務上の余裕金の運用は、政令で定めるところにより、事業の目的及び資金の性質に応じ、【E】しなければならない。",choices:["安全かつ効率的に", "効果的に", "慎重かつ細心の注意を払って、", "総合的かつ計画的に"],answer:"安全かつ効率的に",exp:"正解は「安全かつ効率的に」。協会の業務上の余裕金の運用は、事業の目的及び資金の性質に応じ、安全かつ効率的に行わなければならない。",src:"法7条の38",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問2",opt:"空欄A",context:"健康保険組合は、適用事業所の事業主、その適用事業所に使用される【A】をもって組織する。",choices:["被保険者及び任意継続被保険者", "被保険者、任意継続被保険者及び日雇特例被保険者", "被保険者、任意継続被保険者、特例退職被保険者及び日雇特例被保険者", "被保険者及び日雇特例被保険者"],answer:"被保険者及び任意継続被保険者",exp:"正解は「被保険者及び任意継続被保険者」。健康保険組合は、適用事業所の事業主、その適用事業所に使用される被保険者及び任意継続被保険者をもって組織する。",src:"法8条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問2",opt:"空欄B",context:"適用事業所の事業主は、健康保険組合を設立しようとするときは、健康保険組合を設立しようとする適用事業所に使用される被保険者の【B】の同意を得て、規約を作り、厚生労働大臣の認可を受けなければならない。",choices:["2分の1以上", "3分の2以上", "4分の3以上", "過半数"],answer:"2分の1以上",exp:"正解は「2分の1以上」。設立にあたっては、被保険者の2分の1以上の同意を得て規約を作り、厚生労働大臣の認可を受けなければならない。",src:"法11条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問2",opt:"空欄C",context:"適用事業所の事業主は、健康保険組合を設立しようとするときは、健康保険組合を設立しようとする適用事業所に使用される被保険者の2分の1以上の同意を得て、規約を作り、【C】の認可を受けなければならない。",choices:["厚生労働大臣", "市町村長（特別区にあっては、その区長）", "全国健康保険協会の理事長", "都道府県知事"],answer:"厚生労働大臣",exp:"正解は「厚生労働大臣」。健康保険組合の設立認可・規約変更の認可・事業及び決算に関する報告書の提出先は、いずれも厚生労働大臣である。",src:"法11条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問2",opt:"空欄D",context:"健康保険組合は、規約において、健康保険法第16条第1項に掲げる事項を定めなければならず、当該規約の変更（厚生労働省令で定める事項に係るものを除く。）は、厚生労働大臣の認可を受けなければ、その効力を生じないものとされている。当該厚生労働省令で定める事項には、「【D】」が含まれている。",choices:["事務所の所在地", "公告に関する事項", "準備金その他の財産の管理に関する事項", "保険料に関する事項"],answer:"事務所の所在地",exp:"正解は「事務所の所在地」。規約変更につき厚生労働大臣の認可を要しない（届出で足りる）軽微な事項として、事務所の所在地等が定められている。",src:"則7条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問2",opt:"空欄E",context:"健康保険組合は、毎年度終了後【E】以内に、厚生労働省令で定めるところにより、事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならない。",choices:["6月", "1月", "3月", "1年"],answer:"6月",exp:"正解は「6月」。健康保険組合は、毎年度終了後6月以内に、事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならない。",src:"則159条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問3",opt:"空欄A",context:"健康保険法において「報酬」とは、賃金、給料、俸給、手当、賞与その他いかなる名称であるかを問わず、労働者が、【A】受けるすべてのものをいう。ただし、臨時に受けるもの及び3月を超える期間ごとに受けるものは、この限りでない。",choices:["労働の対償として", "生活の保障として", "適用事業所の事業主及び顧客から", "適用事業所の事業主から"],answer:"労働の対償として",exp:"正解は「労働の対償として」。報酬とは、労働者が労働の対償として受けるすべてのものをいい、臨時に受けるもの及び3月を超える期間ごとに受けるものを除く。",src:"法3条5項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問3",opt:"空欄B",context:"健康保険法第41条第1項において、「保険者等は、被保険者が毎年【B】現に使用される事業所において同日前3月間（その事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が17日（厚生労働省令で定める者にあっては、11日。第43条第1項、第43条の2第1項及び第43条の3第1項において同じ。）未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額を報酬月額として、標準報酬月額を決定する。」と規定されている。",choices:["7月1日", "4月1日", "8月1日", "10月1日"],answer:"7月1日",exp:"正解は「7月1日」。定時決定は、毎年7月1日現に使用される事業所において、同日前3月間（4月・5月・6月）に受けた報酬の総額を基礎として行う。",src:"法41条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問3",opt:"空欄C",context:"健康保険法第41条第1項において、「保険者等は、被保険者が毎年7月1日現に使用される事業所において同日前3月間（その事業所で継続して使用された期間に限るものとし、かつ、報酬支払の基礎となった日数が【C】（厚生労働省令で定める者にあっては、11日。第43条第1項、第43条の2第1項及び第43条の3第1項において同じ。）未満である月があるときは、その月を除く。）に受けた報酬の総額をその期間の月数で除して得た額を報酬月額として、標準報酬月額を決定する。」と規定されている。",choices:["17日", "14日", "15日", "20日"],answer:"17日",exp:"正解は「17日」。定時決定では、報酬支払の基礎となった日数が17日（短時間労働者等は11日）未満である月は、算定の対象から除かれる。",src:"法41条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問3",opt:"空欄D",context:"健康保険法第101条において、「被保険者が出産したときは、出産育児一時金として、政令で定める金額を支給する。」と規定されており、当該政令で定める金額は、原則として、【D】とされている。ただし、病院、診療所、助産所その他の者であって、健康保険法施行令第36条各号に掲げる要件のいずれにも該当するものによる医学的管理の下における出産であると保険者が認めるときは、【D】に、同条第1号に規定する保険契約に関し被保険者が追加的に必要となる費用の額を基準として、3万円を超えない範囲内で保険者が定める金額を加算した金額とされている。",choices:["48万8千円", "48万円", "50万円", "50万8千円"],answer:"48万8千円",exp:"正解は「48万8千円」。出産育児一時金の原則額は48万8千円であり、産科医療補償制度に係る加算（3万円を超えない範囲）を加えると、合計50万円となる。",src:"法101条・令36条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問3",opt:"空欄E",context:"健康保険組合は、健康保険法第161条第1項の規定にかかわらず、規約で定めるところにより、【E】させることができる。",choices:["事業主の負担すべき一般保険料額又は介護保険料額の負担の割合を増加", "事業主及び被保険者の負担すべき一般保険料額又は介護保険料額の負担の割合を減少", "事業主及び被保険者の負担すべき一般保険料額又は介護保険料額の負担の割合を増加", "事業主の負担すべき一般保険料額又は介護保険料額の負担の割合を減少"],answer:"事業主の負担すべき一般保険料額又は介護保険料額の負担の割合を増加",exp:"正解は「事業主の負担すべき一般保険料額又は介護保険料額の負担の割合を増加」。健康保険組合は、規約で定めることにより、事業主の保険料負担割合を被保険者より多くする（増加させる）ことができる。",src:"法162条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問4",opt:"空欄A",context:"厚生労働大臣は、健康保険法第89条第1項の訪問看護事業を行う者の申請があった場合において、申請者が、この法律の規定により指定訪問看護事業者に係る同法第89条第1項の指定訪問看護事業者に係る指定を取り消され、その取消しの日から【A】を経過しない者であるときは、同法第88条第1項の指定訪問看護事業者に係る指定をしてはならない。",choices:["5年", "6月", "1年", "3年"],answer:"5年",exp:"正解は「5年」。指定を取り消され、その取消しの日から5年を経過しない者については、指定訪問看護事業者の指定をしてはならない。",src:"法89条2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問4",opt:"空欄B",context:"厚生労働大臣は、健康保険法第88条第1項の指定訪問看護事業者に係る指定をしてはならない場合の一つとして、申請者が、社会保険料について、当該申請をした日の前日までに、社会保険各法又は地方税法の規定に基づく滞納処分を受け、かつ、当該処分を受けた日から正当な理由なく【B】以上の期間にわたり、当該処分を受けた日以降に納期限の到来した社会保険料の全てを引き続き滞納している者であるときが定められている。",choices:["3月", "6月", "12月", "2年"],answer:"3月",exp:"正解は「3月」。滞納処分を受けた日から正当な理由なく3月以上の期間にわたり社会保険料の全てを引き続き滞納している者は、指定拒否事由に該当する。",src:"法89条2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問4",opt:"空欄C",context:"厚生労働大臣は、健康保険法第88条第1項の指定訪問看護事業者に係る指定をしてはならない場合の一つとして、申請者が、社会保険料について、当該申請をした日の前日までに、社会保険各法又は地方税法の規定に基づく滞納処分を受け、かつ、当該処分を受けた日から正当な理由なく3月以上の期間にわたり、当該処分を受けた日以降に納期限の到来した社会保険料の【C】を引き続き滞納している者であるときが定められている。",choices:["全て", "2分の1に相当する額", "3分の2に相当する額", "一部"],answer:"全て",exp:"正解は「全て」。当該処分を受けた日以降に納期限の到来した社会保険料の全てを引き続き滞納していることが要件である。",src:"法89条2項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問4",opt:"空欄D",context:"健康保険法第106条において、「1年以上被保険者であった者が被保険者の資格を喪失した日後【D】に出産したときは、被保険者として受けることができるはずであった出産育児一時金の支給を最後の保険者から受けることができる。」と規定されている。",choices:["6月以内", "1月以内", "1年以内", "3月以内"],answer:"6月以内",exp:"正解は「6月以内」。資格喪失後の出産育児一時金は、1年以上被保険者であった者が、資格喪失日後6月以内に出産したときに支給される。",src:"法106条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問4",opt:"空欄E",context:"健康保険法第106条において、「1年以上被保険者であった者が被保険者の資格を喪失した日後6月以内に出産したときは、被保険者として受けることができるはずであった出産育児一時金の支給を【E】保険者から受けることができる。」と規定されている。",choices:["最後の", "厚生労働大臣が指定した", "最初の", "被保険者が選択した"],answer:"最後の",exp:"正解は「最後の」。資格喪失後の出産育児一時金は、被保険者であった間における最後の保険者から受けることができる。",src:"法106条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄A",context:"健康保険法は、労働者又はその被扶養者の【A】（労働者災害補償保険法第7条第1項第1号に規定する【A】をいう。）以外の疾病、負傷若しくは死亡又は出産に関して保険給付を行い、もって国民の生活の安定と福祉の向上に寄与することを目的としている。",choices:["業務災害", "業務災害、通勤災害及び複数業務要因災害", "通勤災害", "複数業務要因災害"],answer:"業務災害",exp:"正解は「業務災害」。健康保険法は、労働者又はその被扶養者の業務災害（労災保険法7条1項1号に規定する業務災害）以外の疾病・負傷・死亡・出産に関して保険給付を行う。",src:"法1条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄B",context:"健康保険法は、労働者又はその被扶養者の業務災害（労働者災害補償保険法第7条第1項第1号に規定する業務災害をいう。）以外の【B】に関して保険給付を行い、もって国民の生活の安定と福祉の向上に寄与することを目的としている。",choices:["疾病、負傷若しくは死亡又は出産", "疾病、負傷、障害若しくは死亡又は出産", "傷病、障害若しくは死亡又は妊娠", "傷病若しくは埋葬又は妊娠"],answer:"疾病、負傷若しくは死亡又は出産",exp:"正解は「疾病、負傷若しくは死亡又は出産」。健康保険の保険給付の対象は、業務災害以外の疾病・負傷・死亡・出産である。",src:"法1条",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄C",context:"登録型派遣労働者の適用については、派遣就業に係る一の雇用契約の終了後、最大【C】以内に、同一の派遣元事業主のもとでの派遣就業に係る次回の雇用契約（【C】以上のものに限る。）が確実に見込まれるときは、使用関係が継続しているものとして取り扱い、被保険者資格は喪失させないこととして差し支えないこととされている。",choices:["1月", "14日", "2月", "90日"],answer:"1月",exp:"正解は「1月」。登録型派遣労働者について、雇用契約終了後最大1月以内に同一派遣元での次回雇用契約（1月以上）が確実に見込まれるときは、使用関係継続として被保険者資格を喪失させないこととして差し支えない。",src:"平14.4.24保保発0424001号",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄D",context:"45歳の被保険者であって、療養のあった月の標準報酬月額が【D】以上83万円未満であるものの一部負担金等世帯合算額が「167,400円＋（療養に要した費用－558,000円）×1%」の算式によって計算した金額を超える場合、その者に対して高額療養費が支給される。なお、一部負担金等の額のうち、21,000円未満のものは、一部負担金等世帯合算額に算入されない。",choices:["53万円", "28万円", "38万円", "62万円"],answer:"53万円",exp:"正解は「53万円」。標準報酬月額53万円以上83万円未満の区分では、自己負担限度額は「167,400円＋（療養に要した費用－558,000円）×1%」で算定される。",src:"令42条1項",cat:"選択式（LEC公開模試）"},
{type:"select",no:"LEC第2回-選択問6",opt:"空欄E",context:"45歳の被保険者であって、療養のあった月の標準報酬月額が53万円以上83万円未満であるものの一部負担金等世帯合算額が「167,400円＋（療養に要した費用－558,000円）×1%」の算式によって計算した金額を超える場合、その者に対して高額療養費が支給される。なお、一部負担金等の額のうち、【E】未満のものは、一部負担金等世帯合算額に算入されない。",choices:["21,000円", "10,500円", "18,000円", "24,600円"],answer:"21,000円",exp:"正解は「21,000円」。世帯合算による高額療養費では、一部負担金等の額のうち21,000円未満のものは、世帯合算額に算入されない。",src:"令41条1項",cat:"選択式（LEC公開模試）"},
{no:"TAC中間-問1",opt:"A",q:"被保険者がその使用される事業所の労働組合の専従役職員となりその職務に従事するときは、当該事業所に使用される者としての被保険者資格と当該労働組合に使用される者としての被保険者資格の両方を有することとなるため、当該被保険者は、健康保険法施行規則第37条第1項の規定による2以上の事業所勤務の届出をしなければならない。",a:false,exp:"労働組合の専従役職員となった場合、従前の事業主との関係では被保険者資格を喪失し、その労働組合に使用される者としてのみ被保険者となり得るため、「2以上の事業所勤務の届出」を行う義務は生じない。",src:"法3条1項・則37条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問1",opt:"B",q:"高齢受給者証を交付された任意継続被保険者又は特例退職被保険者は、高齢受給者証に記載されている一部負担金の割合が変更されるときは、5日以内に高齢受給者証を事業主を通じて保険者に返納しなければならない。",a:false,exp:"高齢受給者証の返納は、一般の被保険者については事業主を通じて行うが、任意継続被保険者や特例退職被保険者の場合は「直接保険者」に対して行う。設問の「事業主を通じて」が誤り（5日以内である点は正しい）。",src:"則52条3項・則170条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問1",opt:"C",q:"保険医療機関は、その入院患者に対して食事療養を行うに当たっては、病状に応じて適切に行うとともに、その提供する食事の内容の向上並びに温度、照明及び給水に関する適切な療養環境の形成に努めなければならない。",a:false,exp:"設問文中の「食事療養」を「生活療養」とすると正しい記述となる。温度・照明・給水に関する療養環境の形成に努める義務は生活療養に係るもの。なお食事療養については食事の内容の向上に努めなければならないとされている。",src:"法63条2項2号",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問1",opt:"D",q:"入院時食事療養費、入院時生活療養費、保険外併用療養費、療養費、訪問看護療養費、移送費、傷病手当金、埋葬料、出産育児一時金、出産手当金、家族療養費、家族訪問看護療養費、家族移送費、家族埋葬料及び家族出産育児一時金の支給は、その都度、行わなければならない。健康保険法第100条第2項（同法第105条第2項において準用する場合を含む。）の規定による埋葬に要した費用に相当する金額の支給についても、同様とする。ただし、この規定にかかわらず、傷病手当金及び出産手当金の支給は、毎月一定の期日に行うことができる。",a:true,exp:"設問の通り正しい。現金給付は迅速な支給が重要であるため、その都度支給を原則としつつ、傷病手当金・出産手当金は報酬支払の慣行により「毎月一定の期日」に支給することができる。",src:"法56条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問1",opt:"E",q:"療養の給付に係る事由又は入院時食事療養費、入院時生活療養費若しくは保険外併用療養費の支給に係る事由が第三者の行為によって生じたものであるときは、被保険者は、当該事由が生じた日から5日以内に、届出に係る事実、第三者の氏名及び住所又は居所（氏名又は住所若しくは居所が明らかでないときは、その旨）並びに被害の状況を記載した届書を、保険者に提出しなければならない。",a:false,exp:"第三者の行為による被害の届出は、「当該事由が生じた日から5日以内」ではなく「遅滞なく」、保険者に提出しなければならない。",src:"則65条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問2",opt:"A",q:"保険者は、健康保険法第4章の規定による保険給付及び同法第5章第3節の規定による日雇特例被保険者に係る保険給付の支給、同法第6章の規定による保健事業及び福祉事業の実施、同法第155条の規定による保険料の徴収その他の厚生労働省令で定める事務に係る被保険者等に係る情報の利用又は提供に関する事務を社会保険診療報酬支払基金又は国民健康保険団体連合会に委託することができる。",a:true,exp:"設問の通り正しい。これらの事務は社会保険診療報酬支払基金又は国民健康保険団体連合会に委託することができる。",src:"法205条の4第1項3号",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問2",opt:"B",q:"退職を事由に支払われる退職金であって、退職時に支払われるもの又は事業主の都合等により退職前に一時金として支払われるものは、報酬又は賞与に該当しないが、被保険者の在職時に、退職金相当額の全部又は一部を給与や賞与に上乗せするなど前払いされる場合は、当該退職金相当額の全部又は一部は、報酬又は賞与に該当する。",a:true,exp:"設問の通り正しい。退職金相当額が在職中に給与・賞与に上乗せして前払いされる場合は、労働の対償としての性格が明確であり、原則として報酬又は賞与に該当する。",src:"法3条5項・6項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問2",opt:"C",q:"事業主は、被保険者に対して通貨をもって報酬を支払う場合においては、被保険者の負担すべき前月の標準報酬月額に係る保険料（被保険者がその事業所に使用されなくなった場合においては、前月及びその月の標準報酬月額に係る保険料）を報酬から控除することができる。例えば、前月から引き続き被保険者である者が令和8年9月20日に退職して被保険者資格を喪失した場合については、同年8月及び9月の標準報酬月額に係る被保険者の負担すべき保険料を控除することができる。",a:false,exp:"設問の後半部分が誤り。令和8年9月20日退職の場合、資格喪失日は9月21日で資格を喪失した月は9月となるため、9月分の保険料は算定されず、「8月分の保険料のみ」控除できる。前月及びその月の両方を控除できるのは、その月の最終日に退職・死亡し翌月初日に資格を喪失した場合に限られる。",src:"法156条1項・3項、法167条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問2",opt:"D",q:"訪問看護療養費の額は、当該指定訪問看護につき指定訪問看護に要する平均的な費用の額を勘案して厚生労働大臣が定めるところにより算定した費用の額から、その額に健康保険法第74条第1項各号に掲げる区分に応じ、同項各号に定める割合を乗じて得た額（療養の給付に係る一部負担金について、同法第75条の2第1項各号の措置が採られるべきときは、当該措置が採られたものとした場合の額）を控除した額とされるが、厚生労働大臣は、この定めをしようとするときは、中央社会保険医療協議会に諮問するものとされている。",a:true,exp:"設問の通り正しい。なお同法第75条の2第1項各号の措置とは、一部負担金の額の特例（減額・免除・徴収猶予）の措置のことである。",src:"法88条4項・5項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問2",opt:"E",q:"健康保険法における標準報酬月額は、被保険者の報酬月額に基づき、第1級の5万8千円から、第50級の139万円までの50の等級区分により定められている。",a:true,exp:"設問の通り正しい。健康保険法の標準報酬月額は第1級5万8千円から第50級139万円までの50等級。なお厚生年金保険法では第1級8万8千円から第32級65万円までの32等級である。",src:"法40条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問3",opt:"ア",q:"健康保険法における「賞与」とは、賃金、給料、俸給、手当、賞与その他いかなる名称であるかを問わず、労働者が、労働の対償として受けるすべてのもののうち、臨時に受けるもの及び3月を超える期間ごとに受けるものをいう。",a:false,exp:"「賞与」とは、労働の対償として受けるすべてのもののうち「3月を超える期間ごとに受けるもの」をいう。「臨時に受けるもの」は賞与にも報酬にも該当しない。設問は臨時に受けるものを賞与に含めており誤り。",src:"法3条6項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問3",opt:"イ",q:"基本給の減給制裁があったため、継続した3月間（いずれの月も報酬支払基礎日数が17日（厚生労働省令で定める者については11日）以上であるものとする。）に受けた報酬の総額を3で除して得た額が、その者の標準報酬月額の基礎となった従前の報酬月額と比べて2等級以上下がった場合でも、随時改定の対象とならない。",a:true,exp:"設問の通り正しい。減給制裁は「固定的賃金の変動」には当たらないため、その結果2等級以上の差が生じても随時改定の対象とならない。",src:"法43条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問3",opt:"ウ",q:"産前産後休業期間中の保険料免除の申出は、事業主が所定の申出書を当該産前産後休業期間中又は当該休業期間終了後の一定期間中（当該休業終了日から起算して1月以内）に日本年金機構又は健康保険組合に提出することとされており、当該休業期間終了日から一定期間を経過した後（当該休業終了日から起算して1月を経過した日後）に申出書を提出する場合においては、理由書等を添付するものとされている。",a:true,exp:"設問の通り正しい。",src:"法159条の3、則135条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問3",opt:"エ",q:"全国健康保険協会が都道府県単位保険料率を変更しようとするときは、あらかじめ、理事長が当該変更に係る都道府県に所在する支部の支部長の意見を聴いた上で、評議会の議を経なければならない。",a:false,exp:"全国健康保険協会が都道府県単位保険料率を変更しようとするときは、支部長の意見を聴いた上で、「評議会」ではなく「運営委員会」の議を経なければならない。",src:"法160条6項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問3",opt:"オ",q:"保険者等は、納付義務者が督促を受け、その指定の期限までに保険料等を納付しないときは、国税滞納処分の例によってこれを処分し、又は納付義務者の居住地若しくはその者の財産所在地の市町村（特別区を含むものとし、地方自治法第252条の19第1項の指定都市にあっては、区又は総合区とする。以下本肢において同じ。）に対して処分を請求することができる。この処分の請求を受けた市町村は、市町村民税の例によりこれを処分することができ、この場合においては、保険者は、徴収金の100分の10に相当する額を当該市町村に交付しなければならない。",a:false,exp:"設問の「100分の10」を「100分の4」とすると正しい記述となる。処分の請求を受けた市町村が処分した場合、保険者は徴収金の100分の4に相当する額を当該市町村に交付しなければならない。",src:"法180条4項1号・6項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問4",opt:"A",q:"療養の給付は、被保険者の資格取得が適正である限り、その資格取得前の疾病又は負傷に対しても被保険者として受けることのできる期間、給付を行うものとされている。",a:true,exp:"設問の通り正しい。療養の給付は、被保険者の資格取得が適正であれば、資格取得前に発した疾病・負傷に対しても、被保険者として受け得る期間、給付される。",src:"法63条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問4",opt:"B",q:"入院時食事療養費に係る食事療養標準負担額は、所得の状況その他の事情をしん酌し、一定の要件に該当する者については、減額の特例の対象となるが、難病の患者に対する医療等に関する法律第5条第1項に規定する指定特定医療を受ける同項に規定する指定難病の患者は、その対象に含まれる。",a:true,exp:"設問の通り正しい。指定難病の患者は、食事療養標準負担額の減額特例の対象に含まれる。",src:"法85条2項・則58条5号",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問4",opt:"C",q:"傷病手当金の支給を受けている期間に別の疾病又は負傷及びこれにより発した疾病につき傷病手当金の支給を受けることができるときは、それぞれの疾病又は負傷及びこれにより発した疾病に係る傷病手当金について健康保険法第99条第2項の規定により算定される額のいずれか多い額を支給する。",a:true,exp:"設問の通り正しい。傷病手当金受給期間中に別の傷病で傷病手当金を受けられるときは、いずれか多い額を支給する。",src:"法99条2項・則84条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問4",opt:"D",q:"保険者は、傷病手当金の支給を行うにつき必要があると認めるときは、当該傷病手当金の支給を受ける者の同意を得た場合に限り、労働者災害補償保険法、国家公務員災害補償法又は地方公務員災害補償法若しくは同法に基づく条例の規定により給付を行う者に対し、当該給付の支給状況につき、必要な資料の提供を求めることができる。",a:false,exp:"給付の支給状況につき必要な資料の提供を求めるに当たっては、当該傷病手当金の支給を受ける者の「同意を得る必要はない」。設問の「同意を得た場合に限り」が誤り。",src:"法55条2項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問4",opt:"E",q:"被保険者の被扶養者が、家族療養費に係る療養を受けるために病院又は診療所に移送されたときは、保険者が必要と認める場合に、厚生労働省令で定めるところによって算定した金額が家族移送費として被保険者に支給される。",a:true,exp:"設問の通り正しい。",src:"法112条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問5",opt:"A",q:"被扶養者としての届出に係る者（以下本問において「認定対象者」という。）がワーキングホリデー制度を利用して海外渡航する場合は、ワーキングホリデーでの渡航は、海外滞在期間中の旅行・滞在資金を補うための付随的な就労が認められるものの、就労を目的とする海外渡航とは言えないため、被扶養者としての認定要件における国内居住要件の例外として認められる。",a:true,exp:"設問の通り正しい。ワーキングホリデーでの渡航は付随的な就労が認められるものの就労を目的とする渡航とは言えず、則37条の2第3号の「観光、保養又はボランティア活動その他就労以外の目的で一時的に海外渡航する者」に含まれ、被扶養者の国内居住要件の例外として認められる。",src:"法3条7項・則37条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問5",opt:"B",q:"認定対象者が、被保険者と同一世帯に属する19歳以上23歳未満の者（被保険者の配偶者を除き、概ね厚生年金保険法による障害厚生年金の受給要件に該当する程度の障害者ではないものとする。）である場合は、その者が学生であるときに限り、その者の年間収入が150万円未満で、かつ、被保険者の年間収入の2分の1未満であれば、原則として、被扶養者の認定に係る生計維持要件を満たすものとする。",a:false,exp:"設問中の「その者が学生であるときに限り」とする部分が誤り。19歳以上23歳未満の認定対象者（被保険者の配偶者を除く。）に係る年間収入の基準額を「150万円未満」とする取扱いは、学生であることの要件を求めていない（令和7年10月1日からの新基準）。",src:"法3条7項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問5",opt:"C",q:"任意継続被保険者又はその被扶養者が介護保険第2号被保険者に該当しなくなったときは、遅滞なく、所定の事項を記載した届書を、厚生労働大臣又は健康保険組合に届け出なければならない。ただし、当該被保険者又はその被扶養者が65歳に達したときは、この限りでない。",a:false,exp:"設問の場合の届書は、「厚生労働大臣又は健康保険組合」ではなく「保険者」に届け出なければならない。全国健康保険協会管掌健康保険の任意継続被保険者に係る届出先は全国健康保険協会である。",src:"則40条1項・2項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問5",opt:"D",q:"任意継続被保険者は、将来の一定期間の保険料を前納することができるが、前納された保険料は、前納に係る期間の各月の10日が到来したときに、それぞれ、その月の保険料が納付されたものとみなされる。",a:false,exp:"設問の後半部分が誤り。前納された保険料は、前納に係る期間の各月の「10日」ではなく「初日」が到来したときに、それぞれその月の保険料が納付されたものとみなされる。",src:"法165条1項・3項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問5",opt:"E",q:"被保険者が闘争、泥酔又は著しい不行跡によって給付事由を生じさせたときは、当該給付事由に係る保険給付の一部を行わないこととすることができるが、当該給付事由に係る保険給付の全部を行わないこととすることはできない。",a:false,exp:"設問の場合においては、当該給付事由に係る保険給付の一部を行わないことができるほか、「全部」を行わないこととすることもできる。",src:"法117条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問6",opt:"A",q:"被保険者の標準報酬月額が24万円で、被保険者及びその被扶養者がともに71歳である場合、同一の月に、被保険者がA病院で受けた外来療養による一部負担金が25,000円、被扶養者がB病院で受けた外来療養による自己負担額が20,000円であるとき、被保険者及び被扶養者の外来療養に係る当該月の高額療養費は27,000円となる。なお、当該被保険者及び被扶養者について、当該月において入院療養及び特定疾病に係る療養を受けていないものとする。",a:false,exp:"標準報酬月額24万円は所得区分「一般」に該当し、外来療養に係る高額療養費算定基準額は18,000円となる。70歳以上の一般所得者の外来は個人単位で算定するため、被保険者分は7,000円（25,000円−18,000円）、被扶養者分は2,000円（20,000円−18,000円）となり、当該月の外来療養に係る高額療養費は合計「9,000円」となる（設問の27,000円は誤り）。",src:"法115条、令41条5項・42条5項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問6",opt:"B",q:"被保険者であった者が資格喪失後の傷病手当金の継続給付を受けている期間中に死亡したときは、資格喪失後3月以内の死亡である場合に限り、健康保険法第105条の規定に基づき、埋葬料又は埋葬に要した費用に相当する金額が支給される。",a:false,exp:"資格喪失後の継続給付を受けている期間中に死亡した場合は、その「死亡の時期にかかわらず」、資格喪失後の埋葬料又は埋葬に要した費用に相当する金額（埋葬費）が支給される。設問の「資格喪失後3月以内の死亡である場合に限り」が誤り。",src:"法105条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問6",opt:"C",q:"事業所で所在地が一定しないものに雇い入れられた者については、健康保険の被保険者の資格を取得しないものとされているが、雇入れ後6月を超えて引き続き使用されるに至ったときは、その至ったときから被保険者の資格を取得する。",a:false,exp:"事業所で所在地が一定しないものに使用される者については、その「使用期間の長短にかかわらず」被保険者とならない。設問の「6月を超えて引き続き使用されるに至ったときから資格を取得する」が誤り。",src:"法3条1項3号",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問6",opt:"D",q:"特例退職被保険者となる旨の申出は、原則として、特例退職被保険者になろうとする者に係る年金証書等が到達した日の翌日（被用者年金給付の支給がその者の年齢を事由としてその全額について停止された者については、その停止すべき事由が消滅した日の翌日）から起算して20日以内にしなければならない。",a:false,exp:"設問の「20日以内」を「3月以内」とすると正しい記述となる。特例退職被保険者となる旨の申出は、年金証書等が到達した日の翌日等から起算して3月以内にしなければならない。",src:"法附則3条1項・則168条3項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問6",opt:"E",q:"保険者は、被保険者が疾病又は負傷により居宅において継続して療養を受ける状態にある者（健康保険法施行規則第67条の基準に適合している者に限る。）であると認められる場合に訪問看護療養費を支給する。ただし、他の訪問看護ステーション（指定訪問看護事業者が当該指定に係る訪問看護事業を行う事業所をいう。）から現に指定訪問看護を受けるときは、この限りでない。",a:true,exp:"設問の通り正しい。被保険者は同時に2か所以上の訪問看護ステーションから指定訪問看護を受けることはできない。",src:"法88条1項・則69条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問7",opt:"A",q:"労働者派遣事業の事業所に使用される派遣労働者のうち登録型派遣労働者について、派遣就業に係る1つの雇用契約の終了後、最大1月以内に、同一の派遣元事業主のもとでの派遣就業に係る次回の雇用契約（1月以上のものに限る。）が確実に見込まれるときは、使用関係が継続しているものとして取り扱い、被保険者資格は喪失させないものとして差し支えないとされている。",a:true,exp:"設問の通り正しい。登録型派遣労働者は、雇用契約終了後最大1月以内に次回の雇用契約（1月以上）が確実に見込まれるときは、使用関係が継続しているものとして被保険者資格を喪失させないものとして差し支えない。",src:"法36条2号",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問7",opt:"B",q:"介護保険法第41条第1項本文の規定による指定居宅サービス事業者（訪問看護事業を行う者のうち、厚生労働省令で定める基準に該当するものに限る。）の指定があったことにより指定訪問看護事業者の指定があったものとみなされた者について、介護保険法第70条の2第1項の規定により指定居宅サービス事業者の指定が失効したときであっても、指定訪問看護事業者として受けたものとみなされた指定の効力に影響を及ぼさない。",a:true,exp:"設問の通り正しい。介護保険法上の指定の失効・取消し・効力停止は、指定訪問看護事業者として受けたものとみなされた指定の効力に影響を及ぼさない。",src:"法89条2項・3項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問7",opt:"C",q:"厚生労働大臣は、保険医療機関又は保険薬局に係る健康保険法第63条第3項第1号の指定を行おうとするときは、地方社会保険医療協議会に諮問することとされているが、保険医又は保険薬剤師に係る同法第64条の登録に当たっては、地方社会保険医療協議会への諮問は必要とされていない。",a:true,exp:"設問の通り正しい。保険医療機関・保険薬局の指定には地方社会保険医療協議会への諮問を要するが、保険医・保険薬剤師の登録には諮問は必要とされていない。",src:"法65条1項・71条1項・82条2項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問7",opt:"D",q:"被保険者は、その住所を変更したときは、速やかに、変更後の住所を事業主に申し出なければならない。ただし、当該被保険者が全国健康保険協会が管掌する健康保険の被保険者であって、厚生労働大臣が当該被保険者に係る機構保存本人確認情報の提供を受けることができるとき及び当該被保険者が健康保険組合が管掌する健康保険の被保険者であって、当該健康保険組合が当該被保険者に係る機構保存本人確認情報の提供を受けることができるとき（当該健康保険組合が、事業主に対し、当該被保険者の住所に係る情報の提供を求めないときに限る。）は、この限りでない。",a:true,exp:"設問の通り正しい。被保険者から住所変更に係る申出を受けた事業主は、遅滞なく、健康保険被保険者住所変更届を厚生労働大臣又は健康保険組合に提出しなければならない。",src:"則36条の2",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問7",opt:"E",q:"2以上の健康保険組合は、関係各健康保険組合の組合会において組合会議員の定数の4分の3以上の多数により議決し、厚生労働大臣の認可を受けることで、合併することができるが、合併により消滅した健康保険組合の権利義務は、全国健康保険協会が承継する。",a:false,exp:"合併により消滅した健康保険組合の権利義務は、「全国健康保険協会」ではなく「合併により設立された健康保険組合又は合併後存続する健康保険組合」が承継する。なお設問の前半部分（議決要件・認可）は正しい。",src:"法23条1項・3項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問8",opt:"ア",q:"臨時に使用される者であって、日々雇い入れられるものは、同一事業所で1月の期間を超えて引き続き使用される見込みがあるときは、健康保険法第3条第8項の日雇労働者に該当しないため、日雇特例被保険者となることはない。",a:false,exp:"日々雇い入れられる者は、同一事業所で1月を超えて引き続き使用される見込みがある場合であっても、当該事業所で1月を超えて引き続き使用されるに至るまでは、日雇労働者に該当し、日雇特例被保険者となり得る。",src:"法3条2項・8項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問8",opt:"イ",q:"特定適用事業所に使用される短時間労働者の被保険者資格の取得要件の1つである、報酬の月額が88,000円以上であることの算定において、午後10時から午前5時まで（労働基準法第37条第4項の規定により厚生労働大臣が定める地域又は期間については、午後11時から午前6時まで）の間の労働に対して支払われる賃金のうち通常の労働時間の賃金の計算額を超える部分については、報酬に含めずに算定する。",a:true,exp:"設問の通り正しい。深夜労働に対して支払われる賃金のうち通常の労働時間の賃金の計算額を超える部分は、88,000円以上であることの算定上、報酬に含めずに算定する。",src:"法3条1項9号ロ、則23条の4",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問8",opt:"ウ",q:"その使用される事業所が、健康保険法第33条第1項の規定に基づき厚生労働大臣の認可を受けて適用事業所でなくなったことにより被保険者の資格を喪失した者については、資格喪失の日の前日まで継続して2月以上被保険者（日雇特例被保険者、任意継続被保険者又は共済組合の組合員である被保険者を除く。）であったこと等の所定の要件を満たしていれば、資格喪失の日から20日以内に保険者に申し出ることにより、任意継続被保険者となることができる。",a:false,exp:"任意継続被保険者となることができるのは、適用事業所に使用されなくなったため、又は適用除外の要件に該当するに至ったため被保険者資格を喪失した場合に限られる。厚生労働大臣の認可を受けて任意適用事業所の取消しがあったため資格を喪失した者は、任意継続被保険者となることができない。",src:"法3条4項・36条4号・37条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問8",opt:"エ",q:"給与の締め日が20日から25日に変更された場合の定時決定の取扱いは、締め日を変更した月のみ、給与の計算期間が前月21日から当月25日までとなるため、前月21日から前月25日までの給与を除外し、締め日変更後の給与制度で計算すべき期間（前月26日から当月25日まで）で算出された報酬をその月の報酬としてその他の月との3月間の平均を算出して、標準報酬月額を保険者等算定することとされている。",a:true,exp:"設問の通り正しい。給与締め日の変更により報酬支払基礎日数が暦日を超えて増加した場合、通常受ける報酬以外の報酬（前月21日から前月25日までの分）を除外した上で、その他の月の報酬との平均を算出して標準報酬月額を算定する。",src:"法41条1項・44条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問8",opt:"オ",q:"傷病手当金の支給を受けるべき者が、同一の疾病又は負傷及びこれにより発した疾病に関し、厚生年金保険法による障害厚生年金の支給を受けることができるときは、併給調整により、原則として傷病手当金は支給されないが、傷病手当金の支給を受けるべき者が、同一の疾病又は負傷及びこれにより発した疾病に関し、同法による障害手当金の支給を受けることができるときは、併給調整は行われず、傷病手当金の全額が支給される。",a:false,exp:"設問の後半部分が誤り。傷病手当金を受けるべき者が同一傷病に関し障害手当金の支給を受けることができるときについても併給調整が行われ、傷病手当金の額の合計額が当該障害手当金の額に達するに至る日までの間、傷病手当金は支給されない。",src:"法108条3項・4項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問9",opt:"A",q:"傷病手当金（日雇特例被保険者に係るものを除く。）の支給期間は、同一の疾病又は負傷及びこれにより発した疾病に関して、その支給を始めた日から通算して1年6月間とされており、1日分支給するごとに支給期間が1日分減少し、残りの支給日数が0日となる日が支給満了日となる。報酬、障害年金又は出産手当金等との併給調整により、傷病手当金の全額が不支給となった日については、その支給期間は減少しないこととされている。",a:true,exp:"設問の通り正しい。併給調整により傷病手当金の全額が不支給となった日については、支給期間（通算1年6月）は減少しない。なお一部が支給される場合は支給期間は減少する。",src:"法99条4項・則84条の3",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問9",opt:"B",q:"被保険者であった者が、被保険者の資格喪失日後6月以内に出産した場合において、その被保険者の資格を喪失した日の前日まで、引き続き1年以上被保険者（任意継続被保険者又は共済組合の組合員である被保険者を除く。）であったときは、資格喪失後の出産育児一時金が支給されることとなるが、資格喪失後受胎したことが明らかな場合でも、資格喪失日後6月以内の出産であれば、資格喪失後の出産育児一時金の支給対象となる。",a:true,exp:"設問の通り正しい。資格喪失後受胎したことが明らかな場合でも、資格喪失日後6月以内の出産であれば、資格喪失後の出産育児一時金の支給対象となる。",src:"法106条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問9",opt:"C",q:"多胎出産の場合の出産育児一時金の額は、胎盤数にかかわらず、一産児排出を一出産と認め、胎児数に応じて出産育児一時金を支給する。",a:true,exp:"設問の通り正しい。例えば双児出産の場合は出産育児一時金が2人分支給される。",src:"法101条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問9",opt:"D",q:"全国健康保険協会は、日雇関係組合（日雇特例被保険者を使用する事業主が設立する健康保険組合をいう。）に対し、政令で定めるところにより、日雇特例被保険者の保険の保険者の事務のうち全国健康保険協会が行うものの一部を委託することができる。",a:false,exp:"設問の「日雇関係組合（日雇特例被保険者を使用する事業主が設立する健康保険組合をいう。）」を「市町村（特別区を含む。）」とすると正しい記述となる。全国健康保険協会は市町村に対し、日雇特例被保険者の保険者事務の一部を委託することができる。",src:"法203条2項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問9",opt:"E",q:"日雇特例被保険者が死亡した場合において、その死亡が、療養の給付若しくは保険外併用療養費、療養費若しくは訪問看護療養費の支給を受けなくなった日後3月以内であったときは、その者により生計を維持していた者であって、埋葬を行うものに対し、埋葬料を支給する。",a:true,exp:"設問の通り正しい。なお設問中の療養の給付等は、死亡の原因となった傷病に係るものでなくてもよいとされている。",src:"法136条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問10",opt:"A",q:"健康保険組合は、毎年度終了後6月以内に、厚生労働省令で定めるところにより、事業及び決算に関する報告書を作成し、厚生労働大臣に提出しなければならず、健康保険組合は、この書類を健康保険組合の主たる事務所に備え付けて置かなければならない。組合員又は組合員であった者は、健康保険組合に対し、この書類の閲覧を請求することができ、この場合において、健康保険組合は、正当な理由がある場合を除き、これを拒んではならない。",a:true,exp:"設問の通り正しい。健康保険組合は毎年度終了後6月以内に事業・決算報告書を作成・提出し、主たる事務所に備え付け、組合員等の閲覧請求には正当な理由がある場合を除き応じなければならない。",src:"法30条、令24条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問10",opt:"B",q:"健康保険組合は、重要な財産を処分しようとするときは、財務大臣及び厚生労働大臣の認可を受けなければならない。",a:false,exp:"健康保険組合が重要な財産を処分しようとするときは、「財務大臣及び厚生労働大臣の認可」ではなく「厚生労働大臣の認可」を受けなければならない。",src:"法30条、令23条",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問10",opt:"C",q:"ある健康保険組合が管掌する健康保険の適用事業所甲に使用される被保険者が、令和8年6月19日に甲から同年度の1回目の賞与215万円を支給された後、同年7月15日をもって甲を退職し、同年8月3日から全国健康保険協会が管掌する健康保険の適用事業所乙に転職して、被保険者資格を再取得した。その後、乙から同年12月1日及び翌年の令和9年3月1日に、それぞれ200万円の賞与を支給された場合、令和9年3月1日に支給された賞与の標準賞与額は、158万円として決定される。",a:false,exp:"令和9年3月1日に乙から支給された賞与の標準賞与額は「158万円」ではなく「200万円」として決定される。標準賞与額の累計は保険者単位で行われ、健康保険組合管掌の甲と全国健康保険協会管掌の乙とでは累計されない。乙からの賞与（12月200万円＋3月200万円＝400万円）は上限額573万円以内のため、3月の賞与は200万円として決定される。",src:"法45条1項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問10",opt:"D",q:"療養の給付は、保険医療機関又は保険薬局以外の医療機関からは受けることができない。",a:false,exp:"療養の給付は、保険医療機関・保険薬局以外にも、いわゆる事業主医局等（特定の保険者が管掌する被保険者に対して診療等を行う病院等で当該保険者が指定したもの）及び健康保険組合である保険者が開設する病院・診療所・薬局からも受けることができる。",src:"法63条3項",cat:"択一式（TAC中間模試）"},
{no:"TAC中間-問10",opt:"E",q:"健康保険組合が一般保険料率を変更するに当たっては、厚生労働大臣の認可を受けることが求められるが、一般保険料率と調整保険料率とを合算した率に変更が生じない一般保険料率の変更を決定した場合は、この厚生労働大臣の認可を受ける必要はなく、変更後の一般保険料率を厚生労働大臣に届け出る必要もない。",a:false,exp:"一般保険料率と調整保険料率とを合算した率に変更を生じない一般保険料率を決定した場合は、厚生労働大臣の認可を受ける必要はないが、変更後の一般保険料率を厚生労働大臣に「届け出る必要がある」。設問の「届け出る必要もない」が誤り。",src:"法附則2条8項・9項",cat:"択一式（TAC中間模試）"},
{type:"select",no:"TAC中間-選択問6",opt:"空欄A",context:"健康保険法第23条第3項の合併により設立された健康保険組合又は合併後存続する健康保険組合のうち所定の要件のいずれにも該当する合併に係るもの（以下「地域型健康保険組合」という。）は、当該合併が行われた日の属する年度及びこれに続く【A】に限り、同法第160条第13項において準用する同条第1項に規定する範囲内において、不均一の一般保険料率を決定することができる。",choices:["2箇年度", "3箇年度", "5箇年度", "6箇年度"],answer:"5箇年度",exp:"地域型健康保険組合は、合併が行われた日の属する年度及びこれに続く「5箇年度」に限り、不均一の一般保険料率を決定することができる。",src:"法附則3条の2第1項",cat:"選択式（TAC中間模試）"},
{type:"select",no:"TAC中間-選択問6",opt:"空欄B",context:"地域型健康保険組合に該当する合併の要件の一つとして、合併前の健康保険組合の設立事業所がいずれも【B】の区域にあることが必要とされている。",choices:["同一市町村（特別区を含む。）", "同一都道府県", "隣接する2以上の市町村（特別区を含む。）", "隣接する2以上の都道府県"],answer:"同一都道府県",exp:"地域型健康保険組合の要件として、合併前の健康保険組合の設立事業所がいずれも「同一都道府県」の区域にあることが必要とされている。",src:"法附則3条の2第1項",cat:"選択式（TAC中間模試）"},
{type:"select",no:"TAC中間-選択問6",opt:"空欄C",context:"地域型健康保険組合に該当する合併の要件の一つとして、当該合併が、指定健康保険組合、被保険者の数が政令で定める数に満たなくなった健康保険組合その他【C】が必要と認められる健康保険組合として厚生労働省令で定めるものを含むことが必要とされている。",choices:["健康保険事業の適切な実施", "健全化計画の策定", "財政の安定化", "事業運営基盤の安定"],answer:"事業運営基盤の安定",exp:"地域型健康保険組合の要件として、指定健康保険組合や被保険者数が政令で定める数に満たなくなった健康保険組合のほか、「事業運営基盤の安定」が必要と認められる健康保険組合として厚生労働省令で定めるものを含むこととされている。",src:"法附則3条の2第1項",cat:"選択式（TAC中間模試）"},
{type:"select",no:"TAC中間-選択問6",opt:"空欄D",context:"健康保険法第63条第2項第4号に規定する「【D】」とは、高度の医療技術を用いた療養であって、当該療養を受けようとする者の申出に基づき、同条第1項の給付の対象とすべきものであるか否かについて、適正な医療の効率的な提供を図る観点から評価を行うことが必要な療養として厚生労働大臣が定めるものをいう。",choices:["患者申出療養", "評価療養", "選定療養", "高度先進医療"],answer:"患者申出療養",exp:"法63条2項4号の「患者申出療養」とは、高度の医療技術を用いた療養であって、療養を受けようとする者の「申出」に基づき評価を行うことが必要な療養として厚生労働大臣が定めるものをいう。「評価療養」「選定療養」と区別すること。",src:"法63条2項4号",cat:"選択式（TAC中間模試）"},
{type:"select",no:"TAC中間-選択問6",opt:"空欄E",context:"患者申出療養に係る申出は、厚生労働大臣が定めるところにより、厚生労働大臣に対し、当該申出に係る療養を行う医療法第4条の3に規定する臨床研究中核病院（【E】であるものに限る。）の開設者の意見書その他必要な書類を添えて行うものとする。",choices:["保険医療機関", "保険医療機関及び保険薬局", "健康保険組合直営医療機関", "健康保険組合の事業主医局等"],answer:"保険医療機関",exp:"患者申出療養に係る申出は、当該療養を行う医療法上の臨床研究中核病院（「保険医療機関」であるものに限る。）の開設者の意見書等を添えて行う。ダミー肢の「保険医療機関及び保険薬局」と混同しないこと。",src:"法附則3条の2第2項",cat:"選択式（TAC中間模試）"},
{no:"TAC公開模試-問1",opt:"A",q:"保険医療機関又は保険薬局は、いつでも任意に、その指定を辞退することができるが、その指定を辞退しようとするときは、3月以上の予告期間を設けなければならない。",a:false,exp:"法79条1項。保険医療機関又は保険薬局は、いつでも任意にその指定を辞退することができるが、その指定を辞退しようとするときは、「3月以上」ではなく、「1月以上」の予告期間を設けなければならない。",src:"法79条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問1",opt:"B",q:"厚生労働大臣は、病院又は病床を有する診療所について、保険医療機関の指定の申請があった場合において、当該申請に係る病院又は診療所の医師、歯科医師、看護師その他の従業者の人員が、医療法第21条第1項第1号又は第2項第1号に規定する厚生労働省令で定める員数及び同条第3項に規定する厚生労働省令で定める基準を勘案して厚生労働大臣が定める基準により算定した員数を満たしていないとき等の一定の場合には、保険医療機関の指定をしてはならない。",a:false,exp:"法65条4項。設問の場合は、その申請に係る病床の全部又は一部を除いて、保険医療機関の指定を行うことができるのであり、「保険医療機関の指定をしてはならない」とするものではない。なお、病床の全部又は一部を除いて保険医療機関の指定を行うに当たっては、地方社会保険医療協議会の議を経なければならない。",src:"法65条4項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問1",opt:"C",q:"6月の契約期間で臨時的事業の事業所に雇い入れられ、被保険者の資格を取得しなかった者が、6月の契約期間満了前に雇用契約を延長することになった。この場合、その者は、当初の雇用期間である6月を超えて引き続き使用されるに至ったときから、被保険者の資格を取得することになる。",a:false,exp:"法3条1項5号、昭和18.4.5保発905号。設問の者については、当初の契約期間（6月）を超えて使用されるに至っても、被保険者の資格を取得しない。臨時的事業に6月以内の期間を限って使用される者は、健康保険の適用除外とされるが、当初から継続して6月を超える予定で使用される者は、初めから被保険者となる。ただし、設問の場合のように、たまたま業務の都合等で継続して6月を超えて使用されることになっても、被保険者の資格を取得しない。",src:"法3条1項5号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問1",opt:"D",q:"健康保険被保険者報酬月額変更届の届出は、事業年度の開始の時における資本金の額が1億円を超える法人の事業所の事業主にあっては、電子情報処理組織を使用して行うものとされている。ただし、電気通信回線の故障、災害その他の理由により電子情報処理組織を使用することが困難であると認められる場合で、かつ、電子情報処理組織を使用しないで当該届出を行うことができると認められる場合は、この限りでない。",a:true,exp:"則26条3項。設問の通り正しい。特定法人の事業所の事業主にあっては、「健康保険被保険者報酬月額算定基礎届」「健康保険被保険者報酬月額変更届」「健康保険被保険者賞与支払届」は、電子情報処理組織を使用して行うものとされている（設問のただし書の場合を除く。）。なお、「特定法人」とは、「事業年度の開始の時における資本金の額、出資金の額又は銀行等保有株式取得機構に納付する拠出金等の額の合計額が1億円を超える法人」、「保険業法に規定する相互会社、投資信託及び投資法人に関する法律に規定する投資法人」、又は「資産の流動化に関する法律に規定する特定目的会社」をいう。",src:"則26条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問1",opt:"E",q:"被保険者（任意継続被保険者を含む。）の資格の取得及び喪失は、保険者等の確認によって、その効力を生ずるものとされている。ただし、健康保険法第36条第4号に該当したことによる被保険者の資格の喪失は、この限りでない。",a:false,exp:"法39条1項。設問のカッコ内が誤りである。被保険者の資格の取得及び喪失は、保険者等の確認によって、その効力を生ずるが、健康保険法第36条第4号に該当したことによる被保険者の資格の喪失（任意適用事業所の取消しによる資格喪失）及び「任意継続被保険者の資格の取得及び喪失」は、この確認を必要としない。",src:"法39条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問2",opt:"A",q:"健康保険組合は、支払上現金に不足を生じたときは、準備金に属する現金を繰替使用し、又は一時借入金をすることができる旨規定されている。この規定により繰替使用した金額及び一時借入金は、当該会計年度内に償還しなければならない。",a:true,exp:"令21条。設問の通り正しい。",src:"令21条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問2",opt:"B",q:"保険料その他健康保険法の規定による徴収金を滞納する者があるときは、保険者等は、健康保険法第172条の規定により納期を繰り上げて保険料を徴収する場合を除き、期限を指定して、これを督促しなければならない。この期限は、督促状により指定するものであるが、督促状を発する日から起算して、14日以上経過した日でなければならない。",a:false,exp:"法180条1項〜3項。設問の後半部分が誤りである。督促状により指定すべき期限は、督促状を発する日から起算して、「14日」以上ではなく、「10日」以上経過した日でなければならない。この「10日以上経過した日」は、健康保険法独自のものではなく、労働保険徴収法、国民年金法、厚生年金保険法との共通事項となっている。",src:"法180条1項〜3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問2",opt:"C",q:"初めて適用事業所となった事業所の事業主は、当該事実があった日から5日以内に所定の事項を記載した届書を厚生労働大臣に提出しなければならないが、初めて適用事業所となったと同時に当該適用事業所を健康保険組合の設立に係る適用事業所としようとする場合には、当該健康保険組合に提出しなければならない。",a:true,exp:"則19条1項。設問の通り正しい。なお、初めて適用事業所となった事業所が、全国健康保険協会（以下「協会」という。）が管掌する健康保険の適用事業所である場合において、当該事業所の事業主が設問の届書（新規適用届）に併せて、労働保険徴収法の規定による保険関係成立届又は雇用保険法の規定による適用事業所設置届を提出するときは、所轄労働基準監督署長又は所轄公共職業安定所長を経由して、当該届書を厚生労働大臣（日本年金機構）に提出することができる。",src:"則19条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問2",opt:"D",q:"被保険者の出産については出産育児一時金の支給対象となるが、出産育児一時金は、妊娠4月以上の出産であれば、生産、死産、早産、流産のいずれを問わず支給され、医師の手当を必要とする異常出産の場合は、保険医療機関において手当を受けたときには、療養の給付の支給対象にもなる。ただし、死産の場合には、被扶養者の死亡には当たらないため、家族埋葬料の支給対象にはならない。",a:true,exp:"法63条1項、法101条、法113条、昭和17.1.28社発82号、昭和23.12.2保文発898号、昭和27.6.16保文発2427号。設問の通り正しい。",src:"法101条・法113条ほか",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問2",opt:"E",q:"政府は、全国健康保険協会（以下「協会」という。）が行う健康保険事業に要する費用に充てるため、協会に対し、政令で定めるところにより、厚生労働大臣が徴収した保険料その他健康保険法の規定による徴収金の額及び印紙をもつてする歳入金納付に関する法律の規定による納付金に相当する額から厚生労働大臣が行う健康保険事業の事務の執行に要する費用に相当する額（同法第151条の規定による当該費用に係る国庫負担金の額を除く。）を控除した額を交付する。",a:true,exp:"法155条の2。設問の通り正しい。",src:"法155条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問3",opt:"A",q:"被扶養者としての届出に係る者（以下「認定対象者」という。）の年間収入について労働契約の内容によって認定を行っている場合、当該認定の適否に係る確認時において、当初想定されなかった臨時収入により、結果的に年間収入が130万円（認定対象者が60歳以上の者である場合又は概ね厚生年金保険法による障害厚生年金の受給要件に該当する程度の障害者である場合にあっては、180万円、認定対象者（被保険者の配偶者を除く。）が19歳以上23歳未満である場合にあっては150万円）以上となった場合は、速やかに被扶養者としての取扱いを変更することとされている。",a:false,exp:"法3条7項、令和7.10.1保保発1001第3号。設問の認定対象者について、当初想定されていなかった臨時収入により、結果的に年間収入が130万円（150万円・180万円）以上となった場合でも、当該臨時収入が「社会通念上妥当である範囲」に留まる場合には、これを理由として、被扶養者としての取扱いを変更する必要はないものとされている。",src:"法3条7項、令和7.10.1保保発1001第3号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問3",opt:"B",q:"健康保険法第198条第1項の規定による厚生労働大臣の命令並びに質問及び検査の権限（健康保険組合に係る場合及び保険給付に関するものを除く。）に係る事務は、協会に行わせるものとされている。ただし、当該権限は、厚生労働大臣が自ら行うことを妨げない。",a:false,exp:"法204条の7,1項。設問カッコ内の「健康保険組合に係る場合及び保険給付に関するものを除く。」としている部分が誤りである。設問の健康保険法198条1項の規定による厚生労働大臣の命令並びに質問及び検査（事業主に対して行う立入検査等）の権限に係る事務は、健康保険組合に係る場合を除き、「保険給付に関するものに限り」、協会に行わせるものとされている。事業主に対する立入検査等の権限は、健康保険組合に係る場合を除き、日本年金機構に委任されているが、保険給付に関するものに限り、その実施主体である協会に行わせるものとしている。なお、協会が当該権限に係る事務を行う場合には、あらかじめ、厚生労働大臣の認可を受けなければならない。",src:"法204条の7,1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問3",opt:"C",q:"保険医療機関は、その担当した療養の給付等に係る患者（被保険者及び被保険者であった者並びにこれらの者の被扶養者である患者をいう。）の疾病又は負傷に関し、他の保険医療機関から照会があった場合には、これに適切に対応しなければならない。",a:true,exp:"保険医療担規則2条2項、同規則2条の2。設問の通り正しい。",src:"療担規則2条2項・2条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問3",opt:"D",q:"健康保険組合の議決機関として置かれている組合会は、理事長が招集するが、組合会議員の定数の2分の1以上の者が会議に付議すべき事項及び召集の理由を記載した書面を理事長に提出して組合会の招集を請求したときは、理事長は、その請求のあった日から20日以内に組合会を招集しなければならない。",a:false,exp:"法18条1項、令7条1項。設問の「組合会議員の定数の2分の1以上の者」を「組合会議員の定数の3分の1以上の者」とすると正しい記述となる。",src:"法18条1項、令7条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問3",opt:"E",q:"協会が管掌する健康保険の事業に関する業務のうち、健康保険法第6章の規定による保健事業及び福祉事業に関する業務については、厚生労働大臣が行うこととされている。",a:false,exp:"法5条2項、法7条の2,2項。協会が管掌する健康保険の事業に関する業務のうち、保健事業及び福祉事業に関する業務は、「厚生労働大臣」ではなく、「協会」自身が行うこととされている。なお、協会が管掌する健康保険の事業に関する業務のうち、被保険者の資格の取得及び喪失の確認、標準報酬月額及び標準賞与額の決定並びに保険料の徴収（任意継続被保険者に係るものを除く。）並びにこれらに附帯する業務は、厚生労働大臣が行う。",src:"法5条2項、法7条の2,2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問4",opt:"A",q:"高額療養費の多数回該当の回数の算定においては、同一世帯で、療養があった月以前の12月以内に高額療養費が支給されている月数を算定することから、当該期間内において管掌する保険者が変わった場合においても、その変わった前後の支給回数は通算して算定する取扱いとなっている。",a:false,exp:"法115条1項、令42条1項、平成19.3.7保保発0307005号。高額療養費の多数回該当について、実際の回数の通算に当たっては、管掌する保険者が変わった場合には、その変わった前後の支給回数は「通算されない」こととされているため、設問は誤りとなる。なお、協会が保険者である場合において、管轄する年金事務所が変わった場合は、保険者が変わったわけではないので、通算されることになる。",src:"法115条1項、令42条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問4",opt:"B",q:"被保険者が海外にあるときに発生した給付事由に係る療養費に関する申請手続きにおいて、提出する申請書に添付するものとされている療養に要した費用の額を証明する書類が外国語で作成されたものであるときは、日本語の翻訳文を添付するものとされている。",a:true,exp:"法87条1項、則66条1項〜3項。設問の通り正しい。なお、被保険者が海外の病院等において療養等を受けた場合の費用については、療養費（海外療養費）の支給対象となる。現に海外にある被保険者からの支給申請は、原則として、事業主等を経由して行わせ、その受領は事業主等が代理して行うものとし、保険者から国外への送金は行わない。",src:"法87条1項、則66条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問4",opt:"C",q:"事業主が被保険者資格取得届の提出を怠ったため、被保険者が保険医療機関等での受診の際に被保険者であることの証明をすることができない場合は、療養費の支給要件における「療養の給付を行うことが困難なとき」に該当し、療養費の支給対象となる。",a:true,exp:"法87条1項、昭和3.4.30保理発1089号。設問の通り正しい。",src:"法87条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問4",opt:"D",q:"被保険者の被扶養者が指定訪問看護事業者から指定訪問看護を受けたときは、被保険者に対し、その指定訪問看護に要した費用について、家族訪問看護療養費を支給することとされているが、その額は、当該指定訪問看護につき健康保険法第88条第4項の厚生労働大臣の定めの例により算定した費用の額に家族療養費に係る被扶養者の区分に応じ、各区分に定める割合を乗じて得た額（家族療養費の支給について同法第110条の2第1項又は第2項の規定による家族療養費の額の特例が適用されるべきときは、当該規定が適用されたものとした場合の額）とされている。",a:true,exp:"法111条1項、2項。設問の通り正しい。なお、設問の「当該指定訪問看護につき健康保険法第88条第4項の厚生労働大臣の定めの例により算定した費用の額」とは、被扶養者に対して行われた指定訪問看護につき、訪問看護療養費の額の算定に用いる訪問看護療養費に係る指定訪問看護の費用の額の算定方法の例により算定した費用の額のことである。",src:"法111条1項・2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問4",opt:"E",q:"傷病手当金の支給を受けるときに提出する申請書には、被保険者の疾病又は負傷の発生した年月日、原因、主症状、経過の概要及び当該申請書の記載事項のうちの「労務に服することができなかった期間」に関しては、医師又は歯科医師の意見書を添付しなければならない。",a:true,exp:"法99条1項、則84条1項4号、2項1号。設問の通り正しい。",src:"法99条1項、則84条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問5",opt:"A",q:"傷病手当金の額の算定に際して、被保険者の資格の喪失と取得が同一の月内に発生したことにより、同一の月に同一の保険者等により定められた標準報酬月額が2以上ある月については、それぞれの標準報酬月額を平均した額に基づきその月の標準報酬月額を決定し、傷病手当金の額の算定に用いる。",a:false,exp:"法99条2項、則84条の2,6項。傷病手当金の額の算定に際して、被保険者資格の喪失及び取得が同一月内に発生したことにより、同一の月に同一の保険者等により定められた標準報酬月額が2以上ある月については、「それぞれの標準報酬月額を平均した額に基づきその月の標準報酬月額を決定し」、傷病手当金の額の算定に用いるのではなく、原則として、「当該月の直近の（最後に定められた）標準報酬月額」を傷病手当金の額の算定に用いる。",src:"法99条2項、則84条の2,6項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問5",opt:"B",q:"給与規程が6月30日に改定され、その日以降の賞与の支給回数が、年間を通じて4回から3回に変更された適用事業所における被保険者について、翌年の定時決定による標準報酬月額が適用されるまでの間において支給された賞与については、標準賞与額の決定は行われない。なお、当該事業所の全ての被保険者について標準報酬月額の随時改定は行われないものとする。",a:false,exp:"法3条5項、6項、法45条1項、平成30.7.30保保発0730第1号。設問の場合、当該適用事業所に使用される被保険者について、翌年の定時決定による標準報酬月額が適用されるまでの間において支給された賞与については、標準賞与額の決定は「行われる」。標準賞与額の算定の対象となる健康保険法3条6項の「賞与」に該当するか否かは、毎年7月1日現在における支給実態により定まることとされ、毎年7月1日現在における支給実態が、①給与規程、賃金協約等の諸規定によって年間を通じて4回以上の支給につき客観的に定められているとき、又は②賞与の支給が7月1日前の1年間を通じ4回以上行われているときは、当該賞与は同法3条5項の「報酬」に該当する。設問の場合は、6月30日に給与規程が改定されており、その年の7月1日現在においては、当該賞与は年間を通じて3回支給されるものと定められているため、同法3条6項の「賞与」に該当し、標準賞与額の決定が行われる。",src:"法3条5項・6項、法45条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問5",opt:"C",q:"都道府県単位保険料率は、支部被保険者を単位として、健康保険法第160条第3項各号に掲げる額に照らし、当該事業年度から5箇年間において財政の均衡を保つことができるものとなるよう、政令で定めるところにより算定する。",a:false,exp:"法160条3項。設問の「当該事業年度から5箇年間において」の部分が誤りである。都道府県単位保険料率は、支部被保険者を単位として、健康保険法160条3号各号に掲げる額に照らし、「毎事業年度」において財政の均衡を保つことができるものとなるよう、政令で定めるところにより算定することとされている。協会が管掌する健康保険の保険財政については、毎事業年度ごとの収支均衡を図る財政運営とするとされている。",src:"法160条3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問5",opt:"D",q:"新たに適用事業所に雇い入れられ、被保険者の資格を取得した者について標準報酬月額を決定する場合において、その者の報酬が、日、時間、出来高又は請負によって定められているときは、当該被保険者の資格を取得した月前1月間に現に使用される事業所において、同様の業務に従事し、かつ、同様の報酬を受ける者が受けた報酬の額を平均した額を報酬月額とし、その額を基礎として、その者の標準報酬月額を決定する。",a:true,exp:"法42条1項2号。設問の通り正しい。なお、月、週その他一定期間によって報酬が定められる場合には、被保険者の資格を取得した日の現在の報酬の額をその期間の総日数で除して得た額の30倍に相当する額を報酬月額とする。",src:"法42条1項2号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問5",opt:"E",q:"健康保険法第75条の2第1項第3号の保険者による一部負担金等の徴収の猶予は、被保険者が震災、風水害、火災その他これらに類する災害により、住宅、家財又はその他の財産について著しい損害を受けたことにより、その生活が困難となった場合において保険者が必要と認めるときに、当該被保険者の申請により、5年を限度に行われるものである。",a:false,exp:"法75条の2,1項、則56条の2、平成18.9.14保保発0914001号。設問の一部負担金等の徴収の猶予は、「5年を限度に」行われるのではなく、「6か月以内の期間を限って」行われる。なお、設問のその他の記述は正しい。",src:"法75条の2,1項、則56条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問6",opt:"A",q:"事業主が被保険者資格の得喪に関する届出を怠った等により、裁判の判決又は社会保険審査官若しくは社会保険審査会の決定等により遡って現保険者の被保険者資格を取得した場合における療養費請求権の消滅時効の起算日は、当該判決又は決定等が確定した日の翌日とされる。",a:true,exp:"法193条1項、平成26.5.15保保発0515第1号。設問の通り正しい。保険給付を受ける権利の消滅時効は、その権利を「行使することができる時」から進行する。設問の場合は、当該被保険者は当該判決又は決定等により初めて当該被保険者資格を有するに至ったものであり、それ以前は保険給付を受ける権利を行使することが不可能であったことから、この場合における療養費請求権の消滅時効の起算日は、「当該判決又は決定等が確定した日の翌日」となる。",src:"法193条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問6",opt:"B",q:"保険医療機関に通院するために定期的にタクシーを利用するような場合は、移送費の支給対象とされない。",a:true,exp:"法97条、則81条3号、平成6.9.9保険発119号・庁保険発9号。設問の通り正しい。移送費は、被保険者が疾病にかかり又は負傷したために、移動することが著しく困難であって、医師の指示により一時的、緊急的な必要があって移送せざるを得ないときに、その病院又は診療所までの移送に要した費用を支給するものである。したがって、通院など緊急的、一時的とは認められないときは、移送費の支給対象とはならない。",src:"法97条、則81条3号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問6",opt:"C",q:"出産手当金を支給する場合（報酬並びに厚生年金保険法による障害厚生年金及び障害手当金の支給はないものとする。）においては、その期間、傷病手当金は支給しない。ただし、その受けることができる出産手当金の額が、健康保険法第99条第2項の規定により算定される傷病手当金の額よりも少ないときは、その差額を傷病手当金として支給する。",a:true,exp:"法103条。設問の通り正しい。",src:"法103条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問6",opt:"D",q:"被保険者の資格を喪失した日の前日まで引き続き1年以上被保険者（任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く。）であった者が、被保険者の資格を喪失した日後6月以内に出産し、その出産の当時、被保険者の被扶養者となっていたときは、被保険者本人としての出産育児一時金を受給するか、被扶養者としての家族出産育児一時金を受給するかは、請求者の選択によるものとされている。",a:true,exp:"法106条、法114条、法附則3条6項、昭和48.11.7保険発99号・庁保険発21号。設問の通り正しい。",src:"法106条、法114条ほか",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問6",opt:"E",q:"保険者は、健康保険法第150条第1項の保健事業及び同条第5項の福祉事業の事業を被保険者等（被保険者又はその被扶養者をいう。）でない者に利用させることはできない。ただし、利用料を請求する場合は、この限りでない。",a:false,exp:"法150条6項。保険者は、保健事業及び福祉事業に支障がない場合に限り、被保険者等でない者にこれらの事業を利用させることができるとされており、また、この場合において、保険者は、これらの事業の利用者に対し、厚生労働省令で定めるところにより、利用料を請求することができるとされている。つまり、被保険者等でない者の利用（員外利用）が可能であることを基本とするものであり、設問のように員外利用について利用料の請求を要件とするものでもないため、設問は誤りである。",src:"法150条6項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問7",opt:"ア",q:"被保険者甲は、令和8年9月10日に傷病手当金の支給を受け始めたが、同月20日に事業所を退職し、任意継続被保険者となる旨の申出を行い、任意継続被保険者の資格を取得した。甲が同月20日まで引き続き1年以上被保険者（任意継続被保険者、特例退職被保険者又は共済組合の組合員である被保険者を除く。）であり、かつ、同日現在傷病手当金の支給を受けていた場合であっても、同月21日において任意継続被保険者の資格を取得しているため、資格喪失後の傷病手当金の支給を受けることができない。",a:false,exp:"法104条、法附則3条6項。傷病手当金は、原則として任意継続被保険者に対しては支給されないが、資格喪失後の傷病手当金の継続給付の支給要件を満たした者が任意継続被保険者となった場合には、その者に対し資格喪失後の傷病手当金の継続給付は行われる。なお、特例退職被保険者に対しては、傷病手当金の支給は行われず、資格喪失後の傷病手当金の継続給付の支給要件を満たす者が特例退職被保険者となった場合には、当該継続給付は行われない。",src:"法104条、法附則3条6項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問7",opt:"イ",q:"日雇特例被保険者の保険の保険者の業務のうち、日雇特例被保険者手帳の交付、日雇特例被保険者に係る保険料の徴収及び日雇拠出金の徴収並びにこれらに附帯する業務は、厚生労働大臣が行う。",a:true,exp:"法123条2項。設問の通り正しい。",src:"法123条2項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問7",opt:"ウ",q:"介護休業期間中の標準報酬月額は、休業直前の標準報酬月額の算定の基礎となった報酬に基づき算定した額とされている。また、当該期間中の保険料の被保険者負担分については、被保険者本人が負担することとされるが、被保険者負担分相当額を介護休業手当等として支給することについては差し支えないとされている。",a:true,exp:"平成11.3.31保険発46号・庁保険発9号。設問の通り正しい。",src:"平成11.3.31保険発46号ほか",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問7",opt:"エ",q:"健康保険組合が管掌する健康保険の適用事業所に使用されている者について、傷病手当金の支給要件を満たしているが、報酬を受けているためその全額が支給停止となっている場合においては、当該健康保険組合の規約により、当該支給停止の期間中に傷病手当金付加金のみ支給されているときであっても、その日数分、傷病手当金支給期間は減少する取扱いとなっている。",a:false,exp:"法99条4項、令和3.12.27事務連絡。報酬や障害年金等との併給調整により、傷病手当金が不支給となった期間において、健康保険組合の規約により、傷病手当金付加金のみ支給される日については、その日数分、傷病手当金の支給期間が減少するものとはされていない（減少しない。）。",src:"法99条4項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問7",opt:"オ",q:"国に使用される者、地方公共団体の事務所に使用される者又は法人に使用される者であって共済組合の組合員であるものは、健康保険の被保険者となることはない。",a:false,exp:"法3条1項、法200条1項。設問の者については、健康保険法の適用から除外されているわけではないので、健康保険の被保険者となる。なお、これらの者については、共済組合の組合員としての給付の対象とされているため、健康保険から保険給付は行われず、健康保険の保険料も徴収されない。",src:"法3条1項、法200条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問8",opt:"A",q:"定時決定においては、4月、5月及び6月のうち、報酬支払基礎日数が17日（厚生労働省令で定める者にあっては11日）以上である月に受けた報酬の総額をその期間の月数で除して得た額を報酬月額として標準報酬月額を決定するが、一時帰休による休業手当等を支払われた日についても、報酬支払基礎日数に含まれる。",a:true,exp:"法41条1項、令和5.6.27事務連絡。設問の通り正しい。なお、一時帰休に伴い、就労していたならば受けられるであろう報酬よりも低額な休業手当等が支払われる場合、定時決定の対象月に支払われた当該低額な休業手当等の額をもって報酬月額を算定し、定時決定を行う（定時決定の際、すでに一時帰休の状態が解消している場合は、その年の9月以降において受けるべき報酬をもって報酬月額を算定する。）。",src:"法41条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問8",opt:"B",q:"健康保険法における「報酬」は、同法第3条第5項において「労働者が、労働の対償として受けるすべてのもの」と規定されており、労働の対償として経常的かつ実質的に受けるもので、被保険者の通常の生計に充てられるすべてのものを包含するものであるとされている。ただし、臨時に受けるもの及び3月を超える期間ごとに受けるものは除かれる。",a:true,exp:"法3条5項、令和5.6.27事務連絡。設問の通り正しい。なお、労働の対償として支給されるものであっても、被保険者が常態として受ける報酬以外のものについては、支給事由の発生、支給条件、支給額等が不確定で、経常的に受けるものではないものは、被保険者の通常の生計に充てられるものとは言えないため、健康保険法上の「報酬」に含まれないとされている（例：大入り袋）。「賞与」についても同様の考え方によるものとされているが、「賞与」に該当するのは、3月を超える期間ごとに受けるものに限られる。",src:"法3条5項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問8",opt:"C",q:"報酬又は賞与の全部又は一部が、通貨以外のもので支払われる場合においては、その価額は、その地方の時価によって、厚生労働大臣が定めることとされているが、健康保険組合は、通貨以外のもので支払われる報酬又は賞与の価額について、規約で別段の定めをすることができる。",a:true,exp:"法46条。設問の通り正しい。",src:"法46条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問8",opt:"D",q:"厚生労働大臣が、健康保険法第40条第2項の規定に基づき、標準報酬月額等級の最高等級の上に更に等級区分を加える標準報酬月額の等級区分の改定を行う政令の制定又は改正について立案を行う場合には、社会保障審議会の意見を聴くものとされている。",a:true,exp:"法40条2項、3項。設問の通り正しい。",src:"法40条2項・3項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問8",opt:"E",q:"保険者等は、被保険者が賞与を受けた月において、その月に当該被保険者が受けた賞与額に基づき、これに500円未満の端数を生じたときは、これを切り捨て、500円以上1,000円未満の端数を生じたときは、これを1,000円に切り上げて、その月における標準賞与額を決定する。ただし、その月に当該被保険者が受けた賞与によりその年度における標準賞与額の累計額が573万円（健康保険法第40条第2項の規定による標準報酬月額の等級区分の改定が行われたときは、政令で定める額。以下本肢において同じ。）を超えることとなる場合には、当該累計額が573万円となるようその月の標準賞与額を決定し、その年度においてその月の翌月以降に受ける賞与の標準賞与額は零とする。",a:false,exp:"法45条1項。設問の前半の端数処理に関する部分が誤りである。被保険者が賞与を受けた月において、その月に当該被保険者が受けた賞与額に基づき、これに「500円未満の端数を生じたときは、これを切り捨て、500円以上1,000円未満の端数を生じたときは、これを1,000円に切り上げ」るのではなく、これに「1,000円未満の端数が生じたときは、これを切り捨て」て、標準賞与額を決定する。",src:"法45条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問9",opt:"ア",q:"被保険者及び被保険者を使用する事業主は、それぞれ保険料額の2分の1ずつを負担する。ただし、健康保険法第158条、第159条第1項、第159条の3の規定により保険料の徴収の特例が適用される場合においては、事業主のみがその2分の1を負担し、被保険者は負担することを要しない。",a:false,exp:"法158条、法159条1項、法159条の3,1項、法161条1項。設問の後半部分が誤りである。健康保険法158条（少年院等にある場合の保険料免除）、法159条1項（育児休業等期間中の保険料の免除）、法159条の3（産前産後休業期間中の保険料の免除）の規定が適用される場合は、被保険者の負担だけでなく、事業主による保険料の負担も免除される。",src:"法158条、法159条ほか",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問9",opt:"イ",q:"被保険者に関する毎月の保険料は、翌月末日までに、納付しなければならない。ただし、任意継続被保険者に関する保険料については、その月の末日（初めて納付すべき保険料については、保険者が指定する日）までとする。",a:false,exp:"法164条1項。設問のうち、任意継続被保険者に関する保険料の納付期日に関する記述が誤りである。任意継続被保険者に関する保険料は、「その月の末日」ではなく、「その月の10日」までに納付しなければならない。",src:"法164条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問9",opt:"ウ",q:"健康保険組合が管掌する健康保険の医療に関する給付、保健事業及び福祉事業の実施又は健康保険組合に係る前期高齢者納付金等、後期高齢者支援金等、日雇拠出金、介護納付金、流行初期医療確保拠出金等若しくは子ども・子育て支援納付金の納付に要する費用の財源の不均衡を調整するため、健康保険組合連合会は、政令で定めるところにより、会員である健康保険組合に対する交付金の交付の事業を行うものとされている。国は、政令で定めるところにより、健康保険組合連合会に対し、政令で定める健康保険組合に対する当該交付金の交付に要する費用について、予算の範囲内で、その一部を負担する。",a:true,exp:"法附則2条1項、法附則2条の2。設問の通り正しい。なお、健康保険組合連合会の会員である健康保険組合は、この事業に要する費用に充てるため、健康保険組合連合会に対し、政令で定めるところにより、拠出金を拠出するものとされ、その拠出に要する費用に充てるため、「調整保険料」を徴収する。",src:"法附則2条1項・2条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問9",opt:"エ",q:"事業主は、通貨をもって支払う報酬又は賞与から保険料を控除したときは、所定の事項を記載した保険料の控除に関する計算書を作成し、かつ、事業所ごとに、これを備え、その控除額を被保険者に通知しなければならない。",a:true,exp:"法167条3項、則144条。設問の通り正しい。",src:"法167条3項、則144条",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問9",opt:"オ",q:"厚生労働大臣は、日雇特例被保険者に係る健康保険事業に要する費用に充てるため、保険料を徴収するほか、毎年度、日雇特例被保険者を使用する事業主が設立する健康保険組合以外の健康保険組合から、拠出金を徴収する。",a:false,exp:"法173条1項。設問の拠出金は、「日雇特例被保険者を使用する事業主が設立する健康保険組合以外の健康保険組合」から徴収するのではなく、「日雇特例被保険者を使用する事業主が設立する健康保険組合（「日雇関係組合」という。）」から徴収する。なお、設問のその他の記述は正しい。",src:"法173条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問10",opt:"A",q:"「外国において留学する学生その他の日本国内に住所を有しないが渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められるものとして厚生労働省令で定めるもの」は、被扶養者の認定における日本国内に住所を有しない場合の認定要件として規定されているが、例えば、外国に赴任する被保険者に同行する者は、これに該当するものとされている。",a:true,exp:"法3条7項、則37条の2,2号。設問の通り正しい。日本国内に住所を有していない場合であっても、①外国において留学をする学生、②外国に赴任する被保険者に同行する者、③観光、保養又はボランティア活動その他就労以外の目的で一時的に海外に渡航する者、④被保険者が外国に赴任している間に当該被保険者との身分関係が生じた者であって②に掲げる者と同等と認められるもの、⑤①から④に掲げる者のほか、渡航目的その他の事情を考慮して日本国内に生活の基礎があると認められる者については、被扶養者の認定における国内居住要件の例外として認められる。",src:"法3条7項、則37条の2",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問10",opt:"B",q:"夫婦共同扶養の場合における被扶養者の認定において、夫婦とも健康保険の被保険者である場合は、被扶養者とすべき者の員数に関わらず、被保険者の年間収入が多い方の被扶養者とすることとされているが、夫婦双方の年間収入の差額が年間収入の多い方の3割以内である場合は、被扶養者の地位の安定を図るため、届出により、主として生計を維持する者の被扶養者とすることとされている。",a:false,exp:"法3条7項、令和3.4.30保保発0430第2号。設問の「3割以内」を「1割以内」とすると正しい記述となる。",src:"法3条7項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問10",opt:"C",q:"予約に基づく診察は、保険外併用療養費に係る選定療養に該当し、特別の料金を徴収することができるが、予約料の徴収は、患者の自主的な選択に基づく予約診察にのみ認められるものであり、病院側の一方的な都合による徴収は認められないものとされている。",a:true,exp:"法63条2項5号、法86条1項、令和7.12.26厚労告324号、平成28.6.24保医発0624第3号。設問の通り正しい。",src:"法63条2項5号、法86条1項",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問10",opt:"D",q:"厚生労働大臣は、健康保険法第7条の27の規定による協会の事業計画及び予算の認可、同法第7条の31第1項若しくは第2項ただし書の規定による協会が行う短期借入金等の認可又は同法第7条の34の規定による協会が行う重要な財産の処分に係る認可をしようとするときは、あらかじめ、財務大臣に協議しなければならない。",a:true,exp:"法7条の42,1号。設問の通り正しい。",src:"法7条の42,1号",cat:"択一式（TAC全国公開模試）"},
{no:"TAC公開模試-問10",opt:"E",q:"保険者は、健康保険法第205条の4第1項の規定により同項第2号又は第3号に掲げる事務を社会保険診療報酬支払基金又は国民健康保険団体連合会に委託する場合は、他の社会保険診療報酬支払基金法第1条に規定する保険者、法令の規定により医療に関する給付その他の事務を行う者であって厚生労働省令で定めるもの並びに介護保険法第3条の規定により介護保険を行う市町村及び特別区と共同して委託するものとする。",a:true,exp:"法205条の4,2項。設問の通り正しい。",src:"法205条の4,2項",cat:"択一式（TAC全国公開模試）"},
{type:"select",no:"TAC公開模試-選択1",opt:"空欄A",context:"健康保険組合がその設立事業所を増加させ、又は減少させようとするときは、その増加又は減少に係る適用事業所の事業主の【A】及びその適用事業所に使用される被保険者の2分の1以上の同意を得なければならない。",choices:["全部", "過半数", "3分の1以上", "5分の4以上"],answer:"全部",exp:"法25条1項。完成文は「健康保険組合がその設立事業所を増加させ、又は減少させようとするときは、その増加又は減少に係る適用事業所の事業主の「全部」及びその適用事業所に使用される被保険者の2分の1以上の同意を得なければならない。」となる。",src:"法25条1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC公開模試-選択2",opt:"空欄B",context:"健康保険法第63条第3項第1号の保険医療機関又は保険薬局の指定は、指定の日から起算して【B】を経過したときは、その効力を失うとされているが、厚生労働大臣は、診療所の開設者又は管理者が医療法第30条の18の6第6項の規定による都道府県知事の要請を受け、これに応じなかった場合、同条第9項の規定による都道府県知事の勧告を受けた場合又は当該勧告を受け、これに従わなかった場合には、厚生労働省令で定めるところにより、健康保険法第63条第3項第1号の指定を行うに当たっては、3年以内の期限を付することができるとされているため、この場合には、指定の日から起算して【B】を経過していなくても、その効力を失うこととなる。",choices:["6年", "3年", "4年", "5年"],answer:"6年",exp:"法68条1項。保険医療機関等の指定の有効期間は、「6年」を原則とする。なお、令和8年4月1日施行の医療法の改正に伴い、保険医療機関の指定の申請に係る診療所（病床を有しないものに限る。）の開設者又は管理者が、地域において特に必要とされる外来療養（地域外来療養）の提供に係る都道府県知事の要請等に応じなかった場合等においては、厚生労働大臣は、保険医療機関の指定を行うに当たって、3年以内の期限を付することができることとなった。",src:"法68条1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC公開模試-選択3",opt:"空欄C",context:"健康保険法第63条第3項第1号の保険医療機関又は保険薬局の指定は、指定の日から起算して6年を経過したときは、その効力を失うとされているが、厚生労働大臣は、診療所の開設者又は管理者が医療法第30条の18の6第6項の規定による都道府県知事の要請を受け、これに応じなかった場合、同条第9項の規定による都道府県知事の勧告を受けた場合又は当該勧告を受け、これに従わなかった場合には、厚生労働省令で定めるところにより、健康保険法第63条第3項第1号の指定を行うに当たっては、【C】以内の期限を付することができるとされているため、この場合には、指定の日から起算して6年を経過していなくても、その効力を失うこととなる。",choices:["3年", "1年", "2年", "5年"],answer:"3年",exp:"法68条の2,1項。令和8年4月1日施行の医療法の改正に伴い、保険医療機関の指定の申請に係る診療所（病床を有しないものに限る。）の開設者又は管理者が、地域において特に必要とされる外来療養（地域外来療養）の提供に係る都道府県知事の要請等に応じなかった場合等においては、厚生労働大臣は、保険医療機関の指定を行うに当たって、「3年以内」の期限を付することができることとなった。なお、この3年以内の期限を付した指定をされた場合は、「指定申請手続の簡素化」の規定は適用されず、また、上記都道府県知事の要請に応じなかった場合は、その開設者が保険医の登録を受けたときに保険医療機関の指定があったものとみなす「指定手続の簡素化」の規定は適用されない。",src:"法68条の2,1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC公開模試-選択4",opt:"空欄D",context:"被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときは、【D】から起算して3日を経過した日から労務に服することができない期間、傷病手当金が支給される。この「労務に服することができない」ことの判定は、必ずしも医学的基準によって行わなければならないものではなく、その被保険者が従事する業務の種別等を考えて、その本来の業務に堪え得るか否かを標準として、社会通念に基づき認定する。",choices:["その労務に服することができなくなった日", "医師の診断を受けた日", "その療養に係る初診日", "当該傷病手当金の支給決定がなされた日"],answer:"その労務に服することができなくなった日",exp:"法99条1項。傷病手当金は、被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときは、「その労務に服することができなくなった日」から起算して3日を経過した日から労務に服することができない期間、支給される。",src:"法99条1項",cat:"選択式（TAC全国公開模試）"},
{type:"select",no:"TAC公開模試-選択5",opt:"空欄E",context:"被保険者（任意継続被保険者を除く。）が療養のため労務に服することができないときは、その労務に服することができなくなった日から起算して3日を経過した日から労務に服することができない期間、傷病手当金が支給される。この「労務に服することができない」ことの判定は、必ずしも医学的基準によって行わなければならないものではなく、その被保険者が従事する業務の種別等を考えて、その本来の業務に堪え得るか否かを標準として、【E】に基づき認定する。",choices:["社会通念", "経験則を踏まえた基準", "厚生労働大臣が定める基準", "倫理"],answer:"社会通念",exp:"昭和31.1.19保文発340号。「労務に服することができない」ことの判定は、必ずしも医学的基準によって行わなければならないものではなく、その被保険者が従事する業務の種別等を考えて、その本来の業務に堪え得るか否かを標準として、「社会通念」に基づき認定する。",src:"昭和31.1.19保文発340号",cat:"選択式（TAC全国公開模試）"},
{no:"LEC第3回-問1",opt:"A",q:"令和8年7月27日から同年8月2日までの1週間にわたって育児休業等を取得した被保険者を使用する事業所の事業主が、厚生労働省令で定めるところにより保険者等に申出をしたときは、同年7月分の標準報酬月額に係る保険料が免除される。なお、本肢の被保険者は、健康保険法第159条の3（産前産後休業期間中の保険料免除）の規定の適用は受けていないものとする。",a:true,exp:"法159条1項。本肢のとおり正しい。その育児休業等を開始した日の属する月とその育児休業等が終了する日の翌日が属する月とが異なる場合の育児休業等に係る保険料免除は、その育児休業等を開始した日の属する月からその育児休業等が終了する日の翌日が属する月の前月までの月の保険料（その育児休業等の期間が1月以下である者については、標準報酬月額に係る保険料に限る）について行われる。",src:"法159条1項",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"B",q:"被保険者が故意に給付事由を生じさせた場合は、当該給付事由に係る保険給付は行われないが、自殺未遂による傷病について、その傷病の発生が精神疾患等に起因するものと認められる場合は、「故意」に給付事由を生じさせたことに当たらず、保険給付は行われるものとされている。",a:true,exp:"法116条、平22.5.21保保発0521第1号ほか。本肢のとおり正しい。被保険者又は被保険者であった者が、自己の故意の犯罪行為により、又は故意に給付事由を生じさせたときは、当該給付事由に係る保険給付は行わない。",src:"法116条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"C",q:"白内障に罹患している患者に対する水晶体再建に使用する眼鏡装用率の軽減効果を有する多焦点眼内レンズの支給は、選定療養に該当し、保険外併用療養費の支給対象となる。",a:true,exp:"平18.9.12厚労告495号。本肢のとおり正しい。",src:"平18.9.12厚労告495号",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"D",q:"国に使用される者であって、法律によって組織される共済組合（当該共済組合の給付の種類及び程度は、健康保険の給付の種類及び程度以上であるものとする。）の組合員であるものは、被保険者とならない。",a:false,exp:"法200条、法202条。所定の共済組合の組合員に対しては保険給付が行われず、保険料も徴収されないが、当該組合員は「被保険者には該当する」。",src:"法200条、法202条",cat:"択一式（LEC公開模試）"},
{no:"LEC第3回-問1",opt:"E",q:"前納された任意継続被保険者に係る保険料については、前納に係る期間の各月の初日が到来したときに、それぞれその月の保険料が納付されたものとみなされる。",a:true,exp:"法165条3項。本肢のとおり正しい。",src:"法165条3項",cat:"択一式（LEC公開模試）"},
