<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雇用保険法 一問一答 — 社労士試験対策</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}

/* ===== SYNC BAR ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;background:#1a2434;border:1px solid #283848;border-radius:10px;padding:10px 14px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9bb0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#556070;flex-shrink:0;transition:background .3s}
.sync-dot.connected{background:#3dbe82}
.sync-dot.syncing{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.error{background:#e05050}
.sync-user{font-size:11px;color:#556070;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btns{display:flex;gap:6px;align-items:center}
.btn-gsign{display:flex;align-items:center;gap:6px;background:#fff;color:#3c4043;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-gsign:hover{background:#f1f3f4}
.btn-gsign svg{flex-shrink:0}
.btn-sync{background:transparent;border:1px solid #283848;color:#8a9bb0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sync:hover{border-color:#4a9eca;color:#4a9eca}
.btn-sync:disabled{opacity:.4;cursor:default}
.btn-signout{background:transparent;border:1px solid #283848;color:#556070;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-signout:hover{border-color:#e05050;color:#e05050}

/* ===== HEADER ===== */
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}

/* ===== QUESTION CARD ===== */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:14px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-num{font-size:15px;color:#556070}
/* Accuracy badge on card */
.q-acc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:none}
.q-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.q-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.q-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.q-text{font-size:18px;line-height:1.8;color:#d8d0c0;word-break:break-word;white-space:pre-wrap;padding-right:40px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}

/* ===== OX BUTTONS ===== */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* あなたの選択ラベル */
.your-choice-label{font-size:9px;letter-spacing:.08em;opacity:.85;margin-top:2px;font-weight:700}
/* 挑戦回数バッジ */
.q-tries{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(138,155,176,.12);border:1px solid #283848;color:#8a9bb0;display:none}

/* ===== SELECT CHOICES (選択式用) ===== */
.choices-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-choice{background:#182030;border:1.5px solid #283848;border-radius:8px;padding:12px 10px;font-size:13px;color:#c8c0b0;cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.btn-choice:hover{border-color:#c97a4a;background:#1e2a3a}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice:disabled{cursor:default}
.q-type-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
.q-type-badge.ox{background:rgba(91,184,224,.12);border:1px solid rgba(91,184,224,.25);color:#5bb8e0}
.q-type-badge.sel{background:rgba(130,201,122,.12);border:1px solid rgba(130,201,122,.25);color:#82c97a}
.q-blank{background:rgba(201,122,74,.15);border-bottom:2px solid #c97a4a;color:#e8a87a;padding:0 4px;font-weight:700;border-radius:2px}

/* ===== RESULT PANEL ===== */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:18px;font-weight:700;margin-bottom:8px}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:17px;line-height:1.7;color:#a0b0c0}
.result-exp b{color:#f0c987;font-weight:700}
.result-source{font-size:15px;color:#556070;margin-top:8px}

/* ===== NAV BUTTONS ===== */
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;white-space:nowrap}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:disabled{opacity:.3;cursor:default}
/* ⏸ 中断ボタン */
.btn-suspend{border-color:#4a3a10 !important;color:#e8c97a !important}
.btn-suspend:hover{background:rgba(232,201,122,.1) !important;border-color:#e8c97a !important}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;border:none;background:#c97a4a;color:#1a0800;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}

/* ===== START SCREEN ===== */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filters{margin-bottom:22px}
.filter-label{font-size:12px;color:#8a9bb0;margin-bottom:8px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn-filter{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-filter.active{border-color:#c97a4a;background:rgba(201,122,74,.12);color:#c97a4a}
.btn-filter:hover{border-color:#4a9eca;color:#4a9eca}
.random-mode{margin-bottom:18px}
.random-input-wrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.random-input{background:#1a2434;border:1.5px solid #283848;border-radius:6px;color:#e8e0d0;padding:8px 10px;font-size:14px;width:60px;text-align:center}
.random-input:focus{outline:none;border-color:#c97a4a}
.random-label{font-size:13px;color:#8a9bb0}
.start-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-start{border:1.5px solid #c97a4a;background:transparent;color:#c97a4a;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-start:hover{background:rgba(201,122,74,.12)}
.btn-start.primary{background:#c97a4a;color:#1a0800}
.btn-start.primary:hover{background:#e8a87a}
.btn-shuffle{border:1.5px solid #8a9bb0;background:transparent;color:#8a9bb0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-shuffle:hover{background:rgba(138,155,176,.1)}

/* ===== RESULT SCREEN ===== */
.result-screen{text-align:center;padding:36px 16px}
.result-title{font-size:24px;font-weight:700;color:#e8e0d0;margin-bottom:16px}
.result-score{font-size:36px;font-weight:700;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-retry:hover{background:rgba(201,122,74,.12)}

/* ===== BOOKMARK LIST ===== */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-acc{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:1px}
.bm-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.bm-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.bm-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0;flex:1;min-width:0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2434;border:1px solid #283848;border-radius:8px;padding:10px 18px;font-size:13px;color:#e8e0d0;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#3dbe82;color:#3dbe82}
.toast.error{border-color:#e05050;color:#e05050}
.toast.warn{border-color:#c9a84c;color:#c9a84c}

/* ===== RESUME MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999}
.modal{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:24px;max-width:400px;width:90vw}
.modal-title{font-size:16px;font-weight:700;color:#e8e0d0;margin-bottom:12px}
.modal-desc{font-size:14px;color:#a0b0c0;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-modal{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-modal.primary{border-color:#c97a4a;color:#c97a4a}
.btn-modal:hover{background:rgba(138,155,176,.1)}
.btn-modal.primary:hover{background:rgba(201,122,74,.12)}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .3s ease}
</style>
</head>
<body>
<div class="app">

<!-- ===== GOOGLE DRIVE SYNC BAR ===== -->
<div class="sync-bar">
  <div class="sync-status">
    <div id="syncDot" class="sync-dot"></div>
    <span id="syncStatusText">Googleアカウントで同期</span>
    <div id="syncUser" class="sync-user"></div>
  </div>
  <div class="sync-btns">
    <button id="btnSignIn" class="btn-gsign" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <button id="btnManualSync" class="btn-sync" onclick="manualSync()">↑↓ 同期</button>
    <button id="btnSignOut" class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>社労士試験対策</h1>
  <div id="appTitle" class="title">雇用保険法 一問一答</div>
  <div id="appSubtitle" class="subtitle">TAC・LEC 択一式140問 ＋ 選択式31問　計171問</div>
</div>

<!-- ===== NAV TABS ===== -->
<div class="nav-tabs">
  <button id="tabMain"  class="nav-tab active" onclick="showMain()">学習</button>
  <button id="tabBookmarks" class="nav-tab" onclick="showBookmarks()">栞<span id="bmBadge" class="bm-badge" style="display:none">0</span></button>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="screenMain" class="screen show">

<!-- ===== PROGRESS BAR ===== -->
<div id="progressWrap" class="progress-wrap" style="display:none">
  <div class="progress-info">
    <div id="progressNum" class="progress-num">0 / 0</div>
    <div id="progressScore" class="progress-score">正解: 0問</div>
  </div>
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill" style="width:0%"></div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="startScreen" class="start-screen">
  <span id="startCount" class="start-count">171</span>
  <span class="start-unit">問</span>
  <div class="start-desc">雇用保険法の知識を一問一答で確認しよう。<br>TAC・LEC第1回の問題を計171問（択一式140問・選択式31問）収録。</div>
  
  <!-- フィルター -->
  <div class="filters">
    <div class="filter-label">出題範囲</div>
    <div id="filterBtns" class="filter-btns">
      <button class="btn-filter active" data-cat="all">すべて</button>
    </div>
  </div>

  <!-- ランダム出題モード -->
  <div class="random-mode">
    <div class="random-input-wrap">
      <input id="randomInput" class="random-input" type="number" value="10" min="1" max="171" oninput="updateRandomBtn()">
      <span class="random-label">問をランダムで出題</span>
    </div>
    <button id="btnRandomStart" class="btn-start" onclick="startRandom()">10問ランダムで出題</button>
  </div>

  <!-- 栞ランダム出題モード -->
  <div id="bookmarkRandomMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="bookmarkRandomInput" class="random-input" type="number" value="10" min="1" max="110" oninput="updateBookmarkRandomBtn()">
      <span class="random-label">問を栞からランダムで出題</span>
    </div>
    <button id="btnBookmarkRandomStart" class="btn-start" onclick="startBookmarkRandom()">栞から10問ランダムで出題</button>
  </div>

  <!-- ボタン群 -->
  <div class="start-btns">
    <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
    <button id="btnResumeStart" class="btn-start" onclick="resumeSession()" style="display:none">▶ 続きから開始</button>
    <button id="btnWeakStart" class="btn-start" onclick="startWeak()" style="display:none">正答率50%以下の問題を出題</button>
    <button id="btnLeastTried" class="btn-start" onclick="startLeastTried()" style="display:none">挑戦回数が少ない問題を出題</button>
    <button class="btn-start primary" onclick="start()">学習スタート</button>
    <button id="btnBookmarkStart" class="btn-start" onclick="startBookmarks()" style="display:none">栞の問題のみ</button>
  </div>
</div>

<!-- ===== QUESTION SCREEN ===== -->
<div id="questionScreen" class="screen">
  <div class="card">
    <div class="q-meta">
      <span id="qTag" class="q-tag">択一式（雇用保険法）</span>
      <span id="qTypeBadge" class="q-type-badge"></span>
      <span id="qNum" class="q-num"></span>
      <span id="qAcc" class="q-acc"></span>
      <span id="qTries" class="q-tries"></span>
    </div>
    <div id="qText" class="q-text"></div>
    <button id="btnBookmark" class="btn-bookmark" onclick="toggleBookmark()">☆</button>
  </div>

  <!-- ○× ボタン -->
  <div id="oxRow" class="btn-row">
    <button id="btnMaru" class="btn-answer btn-maru" onclick="answerOx(true)">
      <div>○</div><div class="btn-label">正しい</div>
    </button>

{no:"問1",opt:"A",q:"学校教育法第1条に規定する学校等の学生又は生徒であっても、大学の夜間学部及び高等学校の夜間等の定時制の課程の者等以外のもの（以下「昼間学生」という。）は被保険者とはならないとされており、昼間学生が夜間等において就労しても被保険者とはならない。",a:true,exp:"設問のとおり正しい。なお昼間学生であっても、①卒業予定者で卒業後も引き続き雇用される者、②休学中の者、③事業主の命で大学等に在学する者等は被保険者となる。",src:"法6条4号、則3条の2、行政手引20303",cat:"択一式（雇用保険法）"},
{no:"問1",opt:"B",q:"適用事業に雇用される労働者が、その事業主との雇用関係を存続したまま労働組合の役職員となったこと（いわゆる在籍専従）により同時に2以上の雇用関係を有することとなったときは、原則として、その者が生計を維持するに必要な主たる賃金を受ける一の雇用関係についてのみ被保険者となる。",a:true,exp:"設問のとおり正しい。同時に2以上の雇用関係を有する場合の原則は、主たる賃金を受ける一の雇用関係についてのみ被保険者となることである。",src:"法4条1項、行政手引20352",cat:"択一式（雇用保険法）"},
{no:"問1",opt:"C",q:"被保険者である労働者が長期欠勤している場合であっても、雇用関係が存続する限り賃金の支払を受けていると否とを問わず被保険者とされる。",a:true,exp:"設問のとおり正しい。雇用関係が存続している限り、長期欠勤中であっても被保険者の資格は継続する。",src:"法4条1項、行政手引20352",cat:"択一式（雇用保険法）"},
{no:"問1",opt:"D",q:"適用事業に雇用される労働者が事業主の命により日本国の領域外において就労する場合、その者が日本国の領域外に出張して就労するときは、被保険者となるが、その者が日本国の領域外にある適用事業主の支店、出張所等に転勤したときは、被保険者とならない。",a:false,exp:"「被保険者とならない」が誤り。日本国の領域外にある適用事業主の支店・出張所等に転勤した場合も被保険者となる。なお、国外の関係会社等への転籍の場合は被保険者とならない。",src:"法4条1項、行政手引20352",cat:"択一式（雇用保険法）"},
{no:"問1",opt:"E",q:"ワーキング・ホリデー制度による入国者は、主として休暇を過ごすことを目的として入国し、その休暇の付随的な活動として旅行資金を補うための就労が認められるものであることから、被保険者とならない。",a:true,exp:"設問のとおり正しい。ワーキング・ホリデー制度による入国者は、主として休暇目的で就労が付随的活動にすぎないため、被保険者とならない。なお日本国に在住する外国人は、外国公務員等を除き国籍のいかんを問わず被保険者となる。",src:"法4条1項、行政手引20352",cat:"択一式（雇用保険法）"},
{no:"問2",opt:"A",q:"事業主は、その雇用する労働者が当該事業主の行う適用事業に係る被保険者となったことについて、当該事実のあった日の翌日から起算して10日以内に、雇用保険被保険者資格取得届をその事業所の所在地を管轄する公共職業安定所の長に提出しなければならない。",a:false,exp:"「翌日から起算して10日以内」が誤り。正しくは「当該事実のあった日の属する月の翌10日まで」に提出しなければならない。なお資格取得届は年金事務所を経由して提出することもできる。",src:"法7条、則6条1項",cat:"択一式（雇用保険法）"},
{no:"問2",opt:"B",q:"事業主は、雇用保険被保険者資格喪失届（以下「資格喪失届」という。）を提出する際に当該被保険者が雇用保険被保険者離職票の交付を希望しないときは、資格喪失届に雇用保険被保険者離職証明書を添えないことができるが、離職の日において59歳以上である被保険者については、この限りでない。",a:true,exp:"設問のとおり正しい。59歳以上の被保険者については、本人が離職票の交付を希望しない場合でも離職証明書の添付が必要である。",src:"法7条、則7条3項",cat:"択一式（雇用保険法）"},
{no:"問2",opt:"C",q:"事業主は、その雇用する被保険者を当該事業主の一の事業所から他の事業所に転勤させたときは、当該事実のあった日の翌日から起算して10日以内に雇用保険被保険者転勤届を転勤前及び転勤後の事業所の所在地を管轄する公共職業安定所の長に提出しなければならない。",a:false,exp:"「転勤前及び転勤後」が誤り。転勤届は転勤後の事業所の所在地を管轄する公共職業安定所の長に提出すれば足り、転勤前の安定所に提出する必要はない。",src:"法7条、則13条",cat:"択一式（雇用保険法）"},
{no:"問2",opt:"D",q:"事業主は、その雇用する被保険者（短期雇用特例被保険者及び日雇労働被保険者を除く。）が介護休業給付金に係る介護休業を開始したときは、当該休業を開始した日の翌日から起算して10日以内に、雇用保険被保険者休業開始時賃金月額証明書・所定労働時間短縮開始時賃金証明書に所定の書類を添えて、その事業所の所在地を管轄する公共職業安定所の長に提出しなければならない。",a:false,exp:"「10日以内」が誤り。正しくは「当該被保険者が介護休業給付金支給申請書の提出をする日まで」に提出しなければならない。",src:"法7条、則14条の3、1項1号",cat:"択一式（雇用保険法）"},
{no:"問2",opt:"E",q:"未支給の失業等給付の支給を請求しようとする者は、死亡した受給資格者等が死亡した日の翌日から起算して6か月以内に、未支給失業等給付請求書に所定の書類を添えて、その請求者の住所又は居所を管轄する公共職業安定所の長に提出しなければならない。",a:false,exp:"「請求者の住所又は居所を管轄する公共職業安定所の長」が誤り。正しくは「死亡者に係る公共職業安定所の長（失業等給付の支給を受けることができる者の死亡の当時の住所又は居所を管轄する公共職業安定所の長）」に提出しなければならない。",src:"則17条の2、1項",cat:"択一式（雇用保険法）"},
{no:"問3",opt:"A",q:"基本手当は、被保険者が失業した場合において、離職の日以前2年間に、被保険者期間が通算して12か月以上であったときに支給されるが、正当な理由により離職した者については、離職の日以前2年間に被保険者期間が通算して12か月以上なくとも、離職の日以前1年間に被保険者期間が通算して6か月以上あれば、基本手当の支給対象となる。",a:true,exp:"設問のとおり正しい。正当な理由による離職（特定受給資格者・特定理由離職者）の場合は受給要件が緩和され、離職前1年間に6か月以上の被保険者期間があれば支給対象となる。",src:"法13条、則19条の2",cat:"択一式（雇用保険法）"},
{no:"問3",opt:"B",q:"離職の日まで引き続いて被保険者として甲事業に雇用されている者が、甲事業の被保険者となった日の3月前までに乙事業の被保険者であったことがある場合において、乙事業の離職により受給資格を取得していたが、当該受給資格に基づく基本手当の支給を受けていなかったときは、甲事業の離職による受給資格に係る算定基礎期間は、甲事業で雇用された期間と乙事業で被保険者であった期間を通算した期間となる。",a:true,exp:"設問のとおり正しい。甲・乙の空白期間は3か月（1年以内）のため除外期間①に該当せず、かつ乙事業の受給資格に基づく基本手当の支給を受けていないため除外期間②にも該当しない。よって乙事業の被保険者期間は算定基礎期間に含まれ、甲・乙の期間を通算した期間となる。",src:"法22条3項",cat:"択一式（雇用保険法）"},
{no:"問3",opt:"C",q:"賃金日額は、算定対象期間において被保険者期間として計算された最後の6か月間に支払われた賃金（臨時に支払われる賃金及び3か月を超える期間ごとに支払われる賃金を除く。以下本肢において同じ。）の総額を180で除して得た額とされるが、賃金が請負制によって定められている場合、賃金日額として算定された額が、当該最後の6か月間に支払われた賃金の総額を所定労働日数で除して得た額の100分の70に相当する額に満たないときは、当該100分の70に相当する額が賃金日額となる。",a:false,exp:"設問の前半の記述は正しいが、後半の記述が誤りである。賃金が請負制によって定められている場合、賃金日額として算定された額が、当該最後の6か月間に支払われた賃金の総額を「当該最後の6か月間に労働した日数」で除して得た額の100分の70に相当する額に満たないときは、当該100分の70に相当する額が賃金日額となる。",src:"法17条1項、2項",cat:"択一式（雇用保険法）"},
{no:"問3",opt:"D",q:"基本手当に係る被保険者期間を計算する場合において、当該被保険者が教育訓練休暇給付金の支給を受けたことがある場合には、教育訓練休暇給付金に係る休暇開始日前における被保険者であった期間は、被保険者期間の計算の基礎となる被保険者であった期間に含まない。",a:true,exp:"設問のとおり正しい。教育訓練休暇給付金の支給を受けたことがある場合、その休暇開始日前の被保険者期間は基本手当の被保険者期間の計算基礎に含まれない。",src:"法14条2項3号",cat:"択一式（雇用保険法）"},
{no:"問3",opt:"E",q:"基本手当は、受給資格者が当該基本手当の受給資格に係る離職後最初に公共職業安定所に求職の申込みをした日以後において、失業している日（疾病又は負傷のため職業に就くことができない日を含む。）が通算して7日に満たない間は、支給されない。",a:true,exp:"設問のとおり正しい。7日間の待期期間中は基本手当は支給されない。この7日間を待期といい、待期は1受給期間内に1回をもって足りる。",src:"法21条",cat:"択一式（雇用保険法）"},
{no:"問4",opt:"A",q:"再就職手当は、雇入れをすることを雇用保険法第21条に規定する待期期間中に約した事業主に雇用されたときであっても、他の要件を満たす限り、支給される。",a:true,exp:"設問のとおり正しい。再就職手当が支給されないのは、雇入れをすることを「求職の申込みをした日前」に約した事業主に雇用された場合であり、待期期間中に約した場合は支給される。",src:"法58条の3、1項1号、則82条1項",cat:"択一式（雇用保険法）"},
{no:"問4",opt:"B",q:"受給資格者が、その離職をした日前3年の期間内の就職について再就職手当の支給を受けたことがあるときは、当該離職後の再就職について再就職手当は支給されない。",a:false,exp:"「離職をした日前3年の期間内の就職について再就職手当の支給を受けたことがあるとき」とする記述が誤りである。正しくは「安定した職業に就いた日前3年の期間内の就職（受給資格者等に係る就職に限る。）」について就業促進手当（再就職手当・就業促進定着手当）の支給を受けたことがあるときは、就業促進手当は支給されない。",src:"法58条の3、2項、則82条の4",cat:"択一式（雇用保険法）"},
{no:"問4",opt:"C",q:"受給資格者に対する常用就職支度手当の額は、その者の基本手当の所定給付日数が270日であり、職業に就いた日の前日における基本手当の支給残日数が30日である場合、基本手当日額に45に10分の4を乗じて得た数を乗じて得た額となる。",a:false,exp:"「45」が誤り。所定給付日数が270日以上の受給資格者の常用就職支度手当の額は、支給残日数にかかわらず、基本手当日額に「90」に10分の4を乗じて得た数（36）を乗じて得た額となる。",src:"法56条の3、3項2号イ、則83条の6",cat:"択一式（雇用保険法）"},
{no:"問4",opt:"D",q:"高年齢再就職給付金の支給を受けることができる者が、同一の就職につき常用就職支度手当の支給を受けることができる場合において、その者が常用就職手当の支給を受けたときは高年齢再就職給付金は支給されない。",a:false,exp:"設問のような規定はない。なお、高年齢再就職給付金の支給を受けることができる者が、同一の就職につき再就職手当の支給を受けることができる場合において、その者が再就職手当の支給を受けたときは高年齢再就職給付金は支給されず、高年齢再就職給付金の支給を受けたときは再就職手当は支給されない。",src:"法61条の2、4項",cat:"択一式（雇用保険法）"},
{no:"問4",opt:"E",q:"移転費は、受給資格者等が公共職業安定所、特定地方公共団体若しくは職業紹介事業者の紹介した職業に就くため、その住所又は居所を変更する場合には、その雇用期間が1年未満であっても、他の要件を満たす限り、支給される。",a:false,exp:"「1年未満であっても支給される」が誤り。移転費は、その雇用期間が1年未満である場合には支給されない。",src:"法58条1項、則86条",cat:"択一式（雇用保険法）"},
{no:"問5",opt:"A",q:"特例一時金の支給を受けようとする特例受給資格者は、離職の日の翌日から起算して6か月を経過する日までに、公共職業安定所に出頭し、求職の申込みをした上、失業していることについての認定を受けなければならない。",a:true,exp:"設問のとおり正しい。なお高年齢求職者給付金の支給を受けようとする高年齢受給資格者は、離職の日の翌日から起算して1年を経過する日までに認定を受けなければならない。",src:"法40条3項",cat:"択一式（雇用保険法）"},
{no:"問5",opt:"B",q:"特例一時金の額は、失業の認定があった日から、離職の日の翌日から起算して6か月を経過する日までの日数が20日である場合、基本手当の日額の20日分となる。",a:true,exp:"設問のとおり正しい。特例一時金の額は、原則として基本手当の日額の30日分（当分の間40日分）であるが、失業の認定があった日から、離職の日の翌日から起算して6か月を経過する日までの日数が30日未満であるときは、その日数に相当する日数分となる。なお、高年齢求職者給付金についても同様の規定が設けられている。",src:"法40条1項、法附則8条",cat:"択一式（雇用保険法）"},
{no:"問5",opt:"C",q:"特例受給資格に係る離職の日において65歳以上の者に支給される特例一時金について、その額の算定基礎となる賃金日額の上限額は、基本手当の受給資格に係る離職の日において30歳未満である受給資格者について定められた上限額となる。",a:true,exp:"設問のとおり正しい。65歳以上の者の特例一時金の賃金日額の上限額は、基本手当の離職の日において30歳未満である受給資格者について定められた上限額が適用される。",src:"法40条2項",cat:"択一式（雇用保険法）"},
{no:"問5",opt:"D",q:"雇用保険の被保険者となったことがない者が、4月10日に短期雇用特例被保険者の資格を取得し、9月20日に離職してその資格を喪失した場合、各暦月の賃金の支払の基礎となった日数が11日以上ある場合には、その者の被保険者期間は6か月として計算される。",a:true,exp:"設問のとおり正しい。短期雇用特例被保険者が離職により短期雇用特例被保険者でなくなった場合、被保険者期間は暦月で計算されるので、4月から9月の各暦月にそれぞれ賃金支払基礎日数が11日以上ある場合には、その者の被保険者期間は6か月として計算される。",src:"法39条1項、法附則3条",cat:"択一式（雇用保険法）"},
{no:"問5",opt:"E",q:"特例受給資格者が、失業の認定に係る期間中に自己の労働によって収入を得た場合には、その収入の基礎となった日数に応じ、特例一時金の額が減額される。",a:false,exp:"設問のような規定はない。特例一時金は基本手当と異なり、失業の認定に係る期間中に自己の労働によって収入を得た場合であっても減額されることはない。なお高年齢求職者給付金についても同様である。",src:"法40条4項他",cat:"択一式（雇用保険法）"},
{no:"問6",opt:"A",q:"高年齢被保険者には、介護休業給付金は支給されない。",a:false,exp:"「支給されない」が誤り。高年齢被保険者も一般被保険者と同様に介護休業給付金の支給対象となる。なお、短期雇用特例被保険者及び日雇労働被保険者には支給されない。",src:"法61条の4、1項",cat:"択一式（雇用保険法）"},
{no:"問6",opt:"B",q:"同一の対象家族について当該被保険者が3回以上の介護休業をした場合における3回目以後の介護休業については、介護休業給付金は支給されない。",a:false,exp:"「3回以上」「3回目以後」が誤り。正しくは「4回以上の介護休業をした場合における4回目以後」の介護休業については、介護休業給付金は支給されない。",src:"法61条の4、6項1号",cat:"択一式（雇用保険法）"},
{no:"問6",opt:"C",q:"介護休業をした被保険者に当該被保険者を雇用している事業主から支給単位期間に賃金が支払われた場合において、当該賃金の額が休業開始時賃金日額に支給日数を乗じて得た額の100分の80に相当する額以上であるときは、当該支給単位期間については、介護休業給付金は支給されない。",a:true,exp:"設問のとおり正しい。休業開始時賃金日額×支給日数の100分の80以上の賃金が支払われた場合は、介護休業給付金は支給されない。",src:"法61条の4、5項",cat:"択一式（雇用保険法）"},
{no:"問6",opt:"D",q:"偽りその他不正の行為により介護休業給付金の支給を受けた者には、当該給付金の支給を受けた日以後、介護休業給付金を支給しないものとされており、新たに介護休業を開始したとしても、介護休業給付金は支給されない。",a:false,exp:"「新たに介護休業を開始したとしても支給されない」が誤り。不正受給による支給停止は当該給付金についてのみであり、新たな介護休業については要件を満たせば支給される。",src:"法61条の5",cat:"択一式（雇用保険法）"},
{no:"問6",opt:"E",q:"被保険者は、介護休業給付金の支給を受けようとするときは、当該休業を終了した日の翌日から起算して4か月を経過する日の属する月の末日までに、介護休業給付金支給申請書に所定の書類を添えて、原則として、事業主を経由してその事業所の所在地を管轄する公共職業安定所の長に提出しなければならない。",a:false,exp:"「4か月」が誤り。正しくは「2か月」を経過する日の属する月の末日までに提出しなければならない。",src:"則101条の19、1項",cat:"択一式（雇用保険法）"},
{no:"問7",opt:"A",q:"雇用保険法第9条の規定による確認、失業等給付等に関する処分又は同法第10条の4第1項若しくは第2項（不正受給者からの返還命令等）の規定による処分に不服のある者は、雇用保険審査官に対して審査請求をし、その決定に不服のある者は、労働保険審査会に対して再審査請求をすることができる。",a:true,exp:"設問のとおり正しい。雇用保険に関する処分への不服申立ては、まず雇用保険審査官への審査請求、次に労働保険審査会への再審査請求の手順となる。",src:"法69条1項",cat:"択一式（雇用保険法）"},
{no:"問7",opt:"B",q:"公共職業安定所長が基本手当の所定給付日数を決定する行為は、将来その日数分しか基本手当を支給しないであろうということを示したに過ぎないものであるから、その時点では審査請求の対象となる処分に該当せず、後にその給付日数の支給が終了し、以後はもはや基本手当が支給されない段階に達したときに、はじめて「○月○日以後基本手当を支給しない」旨の基本手当の支給に関する処分がなされたこととなる。",a:true,exp:"設問のとおり正しい。所定給付日数の決定行為は処分ではなく、基本手当が支給されなくなった段階で初めて「支給しない」旨の処分がなされたこととなる。",src:"法69条1項",cat:"択一式（雇用保険法）"},
{no:"問7",opt:"C",q:"基本手当に係る待期期間満了後の公共職業安定所長による「失業の不認定」については、失業の認定日ごとになされる「○○円の基本手当を支給する」又は「基本手当を支給しない」旨の基本手当の支給に関する処分の理由に過ぎないものであるから、「○○円の基本手当を支給する」又は「基本手当を支給しない」旨の処分を対象として審査請求を行うことになる。",a:true,exp:"設問のとおり正しい。失業の不認定それ自体は審査請求の対象となる処分ではなく、基本手当の支給に関する処分の理由に過ぎない。",src:"法69条1項",cat:"択一式（雇用保険法）"},
{no:"問7",opt:"D",q:"雇用保険審査官に対して審査請求をしている者は、審査請求をした日の翌日から起算して2か月を経過しても審査請求についての決定がないときは、雇用保険審査官が審査請求を棄却したものとみなすことができる。",a:false,exp:"「2か月」が誤り。正しくは「3か月」を経過しても決定がないときに、棄却したものとみなすことができる。なお、健康保険法・厚生年金保険法・国民年金法における社会保険審査官に対する審査請求については「2か月」とされている。",src:"法69条2項",cat:"択一式（雇用保険法）"},
{no:"問7",opt:"E",q:"労働保険審査会に対する再審査請求は、決定書の謄本が送付された日の翌日から起算して2か月を経過したときは、することができない。",a:true,exp:"設問のとおり正しい。再審査請求の期限は決定書の謄本が送付された日の翌日から起算して2か月以内である。なお、労働保険審査会による審査請求についても同様の規定がある。",src:"労審法38条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問1",opt:"A",q:"同一の事業主の適用事業に継続して31日以上雇用されることが見込まれない者は、日雇労働被保険者となる場合を除き、被保険者とならないが、31日未満の期間を定めて雇用される場合であっても、雇用契約書においてその契約が更新される場合がある旨明示されており、かつ、当該事業所において同様の雇用契約に基づき雇用されている者について更新等により31日以上雇用された実績があるときは、31日以上雇用されることが見込まれるものとして一般被保険者又は高年齢被保険者となる。",a:true,exp:"設問のとおり正しい。雇用契約書に更新明示があり、かつ同一事業所で同様の契約による31日以上雇用の実績があれば、31日以上の雇用が見込まれるものとして被保険者となる。",src:"法6条2号、行政手引20303",cat:"択一式（雇用保険法）"},
{no:"第2-問1",opt:"B",q:"当初の雇入時に31日以上雇用されることが見込まれないため、被保険者とならなかった者が、雇入れ後において、雇入れ時から継続して31日以上雇用されることが見込まれることとなった場合には、その時点から一般被保険者又は高年齢被保険者となる。",a:true,exp:"設問のとおり正しい。当初被保険者にならなかった者でも、雇入れ後に31日以上の雇用見込みが生じた場合は、その時点から被保険者となる。",src:"法6条2号、行政手引20303",cat:"択一式（雇用保険法）"},
{no:"第2-問1",opt:"C",q:"1週間の所定労働時間が30時間で、3か月の期間を定めて季節的に雇用される者は、日雇労働被保険者となる場合を除き、被保険者とならないが、その後に雇用期間が6か月に延長されたため、当初の3か月を超えて引き続き同一の事業主に雇用されるに至ったときは、4か月目の初日から短期雇用特例被保険者となる。",a:true,exp:"設問のとおり正しい。当初3か月で被保険者とならなかった者が雇用延長により4か月目に入った場合、4か月目の初日から短期雇用特例被保険者となる（6か月未満のため一般・高年齢被保険者にはならない）。",src:"法6条3号、38条1項、行政手引20555",cat:"択一式（雇用保険法）"},
{no:"第2-問1",opt:"D",q:"1週間の所定労働時間が30時間で、6か月の期間を定めて季節的に雇用される短期雇用特例被保険者が、その後に雇用期間の定めのない契約とされたため、当初の6か月を超えて引き続き同一の事業主に雇用されるに至ったときは、7か月目の初日から一般被保険者又は高年齢被保険者に切り替わることとなる。",a:false,exp:"「7か月目の初日から」が誤り。短期雇用特例被保険者が同一事業主に引き続き1年以上雇用されるに至ったときは、「1年以上雇用されるに至った日」から一般被保険者又は高年齢被保険者となる。7か月目の初日ではない。",src:"法38条1項、行政手引20451",cat:"択一式（雇用保険法）"},
{no:"第2-問1",opt:"E",q:"厚生労働大臣は、雇用保険法第7条の規定による被保険者に関する届出若しくは同法第8条の規定による被保険者又は被保険者であった者の請求により、又は職権で、労働者が被保険者となったこと又は被保険者でなくなったことの確認を行うものとされている。",a:true,exp:"設問のとおり正しい。被保険者資格の得喪の確認は、事業主の届出や被保険者の請求のほか、職権によっても行われる。",src:"法9条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問2",opt:"A",q:"賃金（退職手当を除く。）の額を3で除して得た額を上回る額が支払期日までに支払われなかったことにより離職した者は、他の要件を満たす限り、特定受給資格者となる。",a:true,exp:"設問のとおり正しい。賃金の3分の1を超える額が支払期日までに支払われなかった場合は特定受給資格者となる。",src:"法23条2項2号、則36条3号",cat:"択一式（雇用保険法）"},
{no:"第2-問2",opt:"B",q:"予期し得ず、離職の日の属する月以後6月のうちいずれかの月に支払われる賃金の額が当該月の前6月のうちいずれかの月の賃金の額に100分の90を乗じて得た額を下回ると見込まれることとなったことにより離職した者は、他の要件を満たす限り、特定受給資格者となる。",a:false,exp:"「100分の90」が誤り。正しくは「100分の85」を乗じて得た額を下回ると見込まれる場合が特定受給資格者の要件となる。",src:"法23条2項2号、則36条4号イ",cat:"択一式（雇用保険法）"},
{no:"第2-問2",opt:"C",q:"離職の日の属する月の前6月のうち通算して3か月以上の期間において労働基準法に規定する限度時間に相当する時間数である45時間を超えて、時間外労働及び休日労働が行われたことにより離職した者は、他の要件を満たす限り、特定受給資格者となる。",a:false,exp:"「通算して3か月以上」が誤り。正しくは「いずれか連続した3か月以上」の期間において45時間を超える時間外・休日労働が行われた場合が要件となる。",src:"法23条2項2号、則36条5号イ",cat:"択一式（雇用保険法）"},
{no:"第2-問2",opt:"D",q:"期間の定めのある労働契約の締結に際し当該労働契約が更新されることがある旨が明示された場合において当該労働契約が更新されないこととなったことにより離職した者は、他の要件を満たす限り、特定受給資格者となる。",a:false,exp:"設問の記述は不完全で誤り。「更新されることがある旨が明示された」場合でも、更新回数の上限が明確に定められており当該上限まで更新されて離職した場合は特定受給資格者とならない等の例外がある。",src:"法23条2項2号、則36条7号の2",cat:"択一式（雇用保険法）"},
{no:"第2-問2",opt:"E",q:"事業所において使用者の責めに帰すべき事由により行われた休業が引き続き1か月以上となったことにより離職した者は、他の要件を満たす限り、特定受給資格者となる。",a:false,exp:"「1か月以上」が誤り。正しくは「3か月以上」の休業が引き続き行われたことにより離職した者が特定受給資格者となる。",src:"法23条2項2号、則36条10号",cat:"択一式（雇用保険法）"},
{no:"第2-問3",opt:"A",q:"日雇労働求職者給付金は、普通給付であるか特例給付であるかを問わず、その支給を受けることができる者が基本手当の受給資格者である場合には、その者に日雇労働求職者給付金は支給されず、基本手当が支給されることとなる。",a:false,exp:"「基本手当が支給されることとなる」が誤り。日雇労働求職者給付金の受給資格者が基本手当の受給資格も有する場合、日雇労働求職者給付金が支給された日については基本手当は支給されず、逆に基本手当の支給対象となった日については日雇労働求職者給付金も支給されない（相互排他）。",src:"法46条、法55条4項",cat:"択一式（雇用保険法）"},
{no:"第2-問3",opt:"B",q:"普通給付による日雇労働求職者給付金の日額は、その失業の日の属する月の前2か月間に納付された印紙保険料のうち、第1級印紙保険料が24日分以上であるときは、7,500円となる。",a:true,exp:"設問のとおり正しい。前2か月間に第1級印紙保険料が24日分以上納付されている場合、普通給付の日額は7,500円（第1級）となる。",src:"法48条1号",cat:"択一式（雇用保険法）"},
{no:"第2-問3",opt:"C",q:"日雇労働求職者給付金は、普通給付であるか特例給付であるかを問わず、各週（日曜日から土曜日までの7日をいう。）につき日雇労働被保険者が職業に就かなかった最初の日については、支給しない。",a:true,exp:"設問のとおり正しい。各週の最初の失業日については待期として日雇労働求職者給付金は支給されない（普通給付・特例給付共通）。",src:"法50条2項、法55条4項",cat:"択一式（雇用保険法）"},
{no:"第2-問3",opt:"D",q:"日雇労働求職者給付金は、公共職業安定所において、失業の認定を行った日に、当該失業の認定に係る日分を支給するものとされており、普通給付による日雇労働求職者給付金の失業の認定は、日々その日について行われ、特例給付による日雇労働求職者給付金の失業の認定は、特例給付の申出をした日から起算して4週間に1回ずつ行われる。",a:true,exp:"設問のとおり正しい。普通給付は日々認定、特例給付は4週間に1回の認定となる。",src:"法51条1項、法55条4項、則75条1項、則76条1項、則79条1項、則80条",cat:"択一式（雇用保険法）"},
{no:"第2-問3",opt:"E",q:"厚生労働大臣は、平均定期給与額が、直近の日雇労働求職者給付金の日額等の変更の基礎となった平均定期給与額の100分の120を超え、又は100分の83を下るに至った場合において、その状態が継続すると認めるときは、その平均定期給与額の上昇し、又は低下した比率を基準として、日雇労働求職者給付金の日額等を変更しなければならない。",a:true,exp:"設問のとおり正しい。平均定期給与額の変動が120%超または83%未満となり継続する場合、日額等を変更しなければならない。",src:"法49条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問4",opt:"A",q:"教育訓練給付金の支給要件期間の算定に当たり、その教育訓練を開始する日前に教育訓練給付金の支給を受けたことがあるときは、その支給を受けた教育訓練給付金に係る教育訓練を修了した日前の被保険者であった期間は、支給要件期間の算定の対象とならない。",a:false,exp:"「修了した日前」が誤り。正しくは、その支給を受けた教育訓練給付金に係る教育訓練を「開始」した日（基準日）前の被保険者であった期間は、支給要件期間の算定の対象とならない。「修了した日前」ではなく「開始した日（基準日）前」の期間が除外される。",src:"法60条の2、2項2号",cat:"択一式（雇用保険法）"},
{no:"第2-問4",opt:"B",q:"教育訓練給付金の支給要件期間の算定に当たり、その教育訓練を開始する日前に教育訓練休暇給付金の支給を受けたことがあるときは、その支給を受けた教育訓練休暇給付金に係る教育訓練休暇の期間における被保険者であった期間は、支給要件期間の算定の対象とならない。",a:false,exp:"「算定の対象とならない」が誤り。教育訓練休暇給付金に係る教育訓練休暇の期間における被保険者期間は、教育訓練給付金の支給要件期間の算定の対象となる（除外されない）。",src:"法60条の2、2項",cat:"択一式（雇用保険法）"},
{no:"第2-問4",opt:"C",q:"教育訓練休暇給付金に係る教育訓練休暇中に、教育訓練給付金に係る指定教育訓練実施者が行う教育訓練を受けた場合、教育訓練休暇給付金及び教育訓練給付金のそれぞれの支給要件を満たせば、教育訓練休暇給付金と教育訓練給付金が併せて支給されることとなる。",a:true,exp:"設問のとおり正しい。教育訓練休暇中に指定教育訓練を受けた場合、それぞれの要件を満たせば両給付金は併給される。",src:"法60条の2、1項、60条の3、1項、則101条の2の18、2項2号、行政手引56728",cat:"択一式（雇用保険法）"},
{no:"第2-問4",opt:"D",q:"一般教育訓練に係る教育訓練給付金の対象となる費用には、一般教育訓練の受講開始日前1年以内にキャリアコンサルタントが行うキャリアコンサルティングを受けた場合は、10万円を限度として、その費用が含まれる。",a:false,exp:"「10万円を限度」が誤り。正しくは「2万円を限度」として、受講開始日前1年以内のキャリアコンサルティング費用が含まれる。",src:"法60条の2、4項、則101条の2の6、2号、3号",cat:"択一式（雇用保険法）"},
{no:"第2-問4",opt:"E",q:"教育訓練給付金の額の上限額は、原則として、特定一般教育訓練を受け、修了した者については20万円であるが、特定一般教育訓練を受け、修了し、当該特定一般教育訓練に係る資格の取得等をし、かつ、当該特定一般教育訓練を修了した日の翌日から起算して1年以内に一般被保険者又は高年齢被保険者（特例高年齢被保険者を除く。）として雇用された者については、30万円である。",a:false,exp:"「30万円」が誤り。特定一般教育訓練で資格取得等し1年以内に就職した場合の上限は「25万円」である（原則20万円の追加支給分も含めた合計）。",src:"法60条の2、4項、則101条の2の7、2号、3号",cat:"択一式（雇用保険法）"},
{no:"第2-問5",opt:"A",q:"60歳に達する前から引き続き60歳以降に雇用されている被保険者について、60歳到達時の賃金月額（みなし賃金日額に30を乗じて得た額）が40万円であり、60歳以降のある月に受けた賃金の額が疾病により2万円減額されたためその実際の支給額が28万円となったときは、その月については高年齢雇用継続基本給付は支給されないこととなる。",a:true,exp:"設問のとおり正しい。高年齢雇用継続基本給付金の算定では、疾病等で支払われなかった賃金も含めた額（28万円+2万円=30万円）で判断する。30万円は60歳到達時賃金月額40万円の75%（30万円）以上となるため支給要件を満たさず支給されない。",src:"法61条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問5",opt:"B",q:"高年齢再就職給付金が支給されるのは、就職日の属する月の翌月から当該就職日の翌日から起算して2年（当該就職日の前日における支給残日数が100日以上200日未満である被保険者については、1年）を経過する日の属する月までであるが、その月が被保険者が65歳に達する日の属する月後であるときは、65歳に達する日の属する月までとなる。",a:false,exp:"「就職日の属する月の翌月から」が誤り。高年齢再就職給付金が支給されるのは「就職日の属する月から」（翌月ではなく当月から）2年（支給残日数100日以上200日未満は1年）を経過する日の属する月までとなる。",src:"法61条の2、2項",cat:"択一式（雇用保険法）"},
{no:"第2-問5",opt:"C",q:"教育訓練休暇給付金に係る教育訓練休暇取得の認定を受けた日が1日でもある月は、高年齢雇用継続基本給付金の支給対象月とはならないため、当該月について、高年齢雇用継続基本給付金が支給されることはない。",a:true,exp:"設問のとおり正しい。高年齢雇用継続基本給付金の支給対象月は「その月の初日から末日まで引き続いて被保険者であり、かつ教育訓練休暇給付金の支給を受けられる休暇の取得をしなかった月」に限られるため、教育訓練休暇取得の認定を受けた日が1日でもある月は支給対象月とならず、高年齢雇用継続基本給付金は支給されない。",src:"法61条2項、行政手引56728",cat:"択一式（雇用保険法）"},
{no:"第2-問5",opt:"D",q:"高年齢雇用継続基本給付金又は高年齢再就職給付金の支給を受けることができる者が、同一の就業につき育児時短就業給付金の支給を受けることができる場合において、その者が高年齢雇用継続基本給付金又は高年齢再就職給付金の支給を受けたときは、育児時短就業給付金は支給されない。",a:true,exp:"設問のとおり正しい。高年齢雇用継続給付（高年齢雇用継続基本給付金・高年齢再就職給付金）と育児時短就業給付金は同一の就業について併給されない。",src:"法61条の12、10項",cat:"択一式（雇用保険法）"},
{no:"第2-問5",opt:"E",q:"支給対象月における高年齢雇用継続基本給付金の額として算定された額が賃金日額の最低限度額の100分の80に相当する額を超えないときは、当該支給対象月については、高年齢雇用継続基本給付金は支給されない。",a:true,exp:"設問のとおり正しい。算定された高年齢雇用継続基本給付金の額が賃金日額の最低限度額の100分の80以下の場合は支給されない（支給額が一定額以下は不支給）。",src:"法61条6項",cat:"択一式（雇用保険法）"},
{no:"第2-問6",opt:"A",q:"育児休業給付金に係る支給単位期間において、公共職業安定所長が就業をしていると認める日数が10日間あり、かつ、就業をしていると認める時間が80時間であるときは、当該支給単位期間について、育児休業給付金は支給されない。",a:false,exp:"設問の場合は支給される。育児休業給付金が支給されないのは、公共職業安定所長が就業をしていると認める日数が10日を超え、かつ、就業をしていると認める時間が80時間を超える場合（両方の条件を満たす場合）である。設問は10日間・80時間でいずれも「超え」ていないため、支給される。",src:"法61条の7、1項、則101条の22",cat:"択一式（雇用保険法）"},
{no:"第2-問6",opt:"B",q:"被保険者に対して出生後休業支援給付金が支給されるには、その被保険者の配偶者についても当該出生後休業に係る子について出生後休業をしたことを要するので、当該配偶者が適用事業に雇用される労働者でない場合には、被保険者に対して出生後休業支援給付金は支給されない。",a:false,exp:"「支給されない」が誤り。配偶者が適用事業に雇用される労働者でない場合（自営業者・専業主婦等）は、配偶者要件が免除されるため、被保険者に対して出生後休業支援給付金が支給される場合がある。",src:"法61条の10、2項2号",cat:"択一式（雇用保険法）"},
{no:"第2-問6",opt:"C",q:"育児休業について、育児休業給付金と出生後休業支援給付金が併せて支給される場合において、その支給単位期間に事業主から賃金が支払われたため、育児休業給付金の額の一部が減額されることとなるときは、出生後休業支援給付金の額も併せて減額されることとなる。",a:false,exp:"「出生後休業支援給付金の額も併せて減額される」が誤り。事業主から賃金が支払われた場合に減額調整の対象となるのは育児休業給付金（又は出生時育児休業給付金）であり、出生後休業支援給付金については支給額の減額は行われない。",src:"法61条の7、7項、61条の10、行政手引60006",cat:"択一式（雇用保険法）"},
{no:"第2-問6",opt:"D",q:"育児時短就業給付金は、被保険者が、その2歳に満たない子を養育するための所定労働時間を短縮することによる就業をした場合に支給されるものであるが、1週間当たりの所定労働日数を少なくしたものの、1日の所定労働時間を短縮していないようなときは、育児時短就業給付金の対象とならない。",a:false,exp:"「対象とならない」が誤り。育児時短就業給付金に係る育児時短就業は「事業主が講じた1週間の所定労働時間を短縮する措置である就業」であり、1日の所定労働時間が短縮されなくても、1週間当たりの所定労働日数を変更した結果として1週間当たりの所定労働時間が短縮される場合には、育児時短就業給付金の対象となる。",src:"法61条の12、1項、則101条の43、行政手引60503",cat:"択一式（雇用保険法）"},
{no:"第2-問6",opt:"E",q:"出生後休業支援給付及び育児時短就業給付に要する費用については、雇用保険法による国庫負担は行われず、また、出生後休業支援給付及び育児時短就業給付に係る事業の事務の執行に要する経費についても、同法による国庫負担は行われない。",a:true,exp:"設問のとおり正しい。出生後休業支援給付及び育児時短就業給付に要する費用並びにこれらの給付に関する事務の執行に要する経費は、子ども・子育て支援法の規定により政府が徴収する子ども・子育て支援納付金をもって充てることとされており、雇用保険法による国庫負担は行われない。",src:"法66条1項、5項、68条の2",cat:"択一式（雇用保険法）"},
{no:"第2-問7",opt:"A",q:"偽りその他不正の行為により失業等給付の支給を受けた者がある場合には、政府は、その者に対して、支給した失業等給付の全部又は一部を返還することを命ずることができ、また、厚生労働大臣の定める基準により、当該偽りその他不正の行為により支給を受けた失業等給付の額の2倍に相当する額以下の金額を納付することを命ずることができる。",a:true,exp:"設問のとおり正しい。不正受給の場合、①既支給分の返還命令と②不正受給額の2倍以下の納付命令（いわゆる3倍返し）が行われる。",src:"法10条の4、1項",cat:"択一式（雇用保険法）"},
{no:"第2-問7",opt:"B",q:"日雇労働求職者給付金の支給を受けることができる者が公共職業安定所の紹介する業務に就くことを拒んだときは、原則として、その拒んだ日から起算して7日間は、日雇労働求職者給付金を支給しない。",a:true,exp:"設問のとおり正しい。公共職業安定所の紹介を拒否した場合、その日から7日間は日雇労働求職者給付金が支給されない（普通給付・特例給付共通）。",src:"法52条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問7",opt:"C",q:"被保険者が自己の責めに帰すべき重大な理由によって解雇された場合には、待期期間の満了後1か月以上3か月以内の間で公共職業安定所長の定める期間は、基本手当を支給しない。ただし、教育訓練給付金に係る教育訓練その他の厚生労働省令で定める訓練を基準日前1年以内に受けたことがある受給資格者については、この限りでない。",a:false,exp:"「ただし書き」が誤り。教育訓練を受けたことがある受給資格者について給付制限が免除されるのは「正当な理由のない自己都合離職」の場合のみである。「自己の責めに帰すべき重大な理由による解雇」の場合には、このただし書きの例外は適用されず給付制限は行われる。",src:"法33条1項",cat:"択一式（雇用保険法）"},
{no:"第2-問7",opt:"D",q:"教育訓練給付金支給対象者が教育訓練を開始した日前3年の期間内に教育訓練給付金の支給を受けたことがあるときは、教育訓練給付金は、支給しない。",a:true,exp:"設問のとおり正しい。教育訓練給付金は、教育訓練を開始した日前3年（初回は1年）の期間内に教育訓練給付金の支給を受けたことがある場合には支給されない。",src:"法60条の2、5項、則101条の2の10",cat:"択一式（雇用保険法）"},
{no:"第2-問7",opt:"E",q:"傷病手当に係る傷病の認定を受けた受給資格者が、当該認定を受けた日について、健康保険法の規定による傷病手当金の支給を受けることができる場合には、傷病手当は、支給しない。",a:true,exp:"設問のとおり正しい。傷病手当と健康保険の傷病手当金は併給されない。健康保険の傷病手当金が支給される場合は雇用保険の傷病手当は支給されない。",src:"法37条8項",cat:"択一式（雇用保険法）"},
{type:"select",no:"選択1",opt:"空欄A",context:"教育訓練休暇給付金は、一般被保険者が、職業に関する教育訓練を受けるための休暇（以下「教育訓練休暇」という。）を取得した場合に、当該教育訓練休暇（当該教育訓練休暇を開始した日から起算して1年を経過する日までに2回以上の教育訓練休暇を取得した場合にあっては、初回の教育訓練休暇）を開始した日（以下「休暇開始日」という。）から起算して【A】の期間内の教育訓練休暇を取得している日（教育訓練休暇を取得していることについての認定を受けた日に限る。）について、雇用保険法第60条の3第6項の規定による日数に相当する日数分を限度として支給する。",choices:["1月", "6月", "1年", "1年6月"],answer:"1年",exp:"教育訓練休暇給付金は、休暇開始日から起算して1年の期間内の教育訓練休暇を取得している日（認定を受けた日に限る）について、所定の日数分を限度として支給される。",src:"法60条の3、1項",cat:"選択式"},
{type:"select",no:"選択1",opt:"空欄B",context:"教育訓練休暇は、上記の教育訓練休暇であって、当該休暇の期間が【B】以上であり、かつ、次に掲げる訓練（学校教育法に基づく大学・高等専門学校・専修学校・各種学校が行う教育訓練、厚生労働大臣の指定を受けた指定教育訓練実施者が行う教育訓練等）を受けるものとして、事業主の承認を受けたものとする。",choices:["14日", "30日", "1月", "2月"],answer:"30日",exp:"教育訓練休暇給付金の対象となる教育訓練休暇は、その期間が30日以上であることが要件の一つとされている。",src:"法60条の3、1項",cat:"選択式"},
{type:"select",no:"選択1",opt:"空欄C",context:"教育訓練休暇は、当該休暇の期間が30日以上であり、かつ、所定の訓練を受けるものとして、【C】を受けたものとする。",choices:["教育訓練実施者の証明", "公共職業安定所長の認定", "事業主の承認", "労働者の申出"],answer:"事業主の承認",exp:"教育訓練休暇は、就業規則等に基づき、教育訓練休暇の期間、教育訓練の目標、内容、実施方法等を明らかにして事業主の承認を得た上で取得した休暇であることを要する。",src:"法60条の3、1項",cat:"選択式"},
{type:"select",no:"選択1",opt:"空欄D",context:"教育訓練休暇を取得していることについての認定は、公共職業安定所長が、休暇開始日から起算して【D】について行うものとする。",choices:["4週間に1回ずつ直前の28日の各日", "30日に1回ずつ直前の30日の各日", "1月に1回、直前の月に属する各日", "支給単位期間ごとに1回、当該支給単位期間の各日"],answer:"30日に1回ずつ直前の30日の各日",exp:"教育訓練休暇を取得していることについての認定は、公共職業安定所長が、休暇開始日から起算して30日に1回ずつ直前の30日の各日について行うものとされる。",src:"法60条の3、4項",cat:"選択式"},
{type:"select",no:"選択1",opt:"空欄E",context:"国庫は、毎会計年度の前々会計年度における労働保険特別会計の雇用勘定の財政状況及び求職者給付の支給を受けた受給資格者の数の状況が、当該会計年度における求職者給付の支給に支障が生じるおそれがあるものとして政令で定める基準に該当する場合には、教育訓練休暇給付金に要する費用の【E】を負担する。",choices:["3分の1", "4分の1", "30分の1", "40分の1"],answer:"4分の1",exp:"設問の政令で定める基準に該当する場合は、国庫は教育訓練休暇給付金に要する費用の4分の1を負担する。なお、それ以外の場合は40分の1となる。また、教育訓練休暇給付金以外の教育訓練給付（教育訓練給付金・教育訓練支援給付金）については、国庫負担は行われない。",src:"法66条1項3号イ",cat:"選択式"},
{type:"select",no:"第2-選択1",opt:"空欄A",context:"求職活動関係役務利用費は、受給資格者等が求人者との面接等をし、又は求職活動関係役務利用費対象訓練を受講するため、その子に関して、保育等サービスを利用する場合（【A】が経過した後に保育等サービスを利用する場合に限る。）に支給するものとする。",choices:["雇用保険法第21条の規定による待期期間", "雇用保険法第21条の規定による待期期間又は同法第32条第1項、第2項若しくは同法第52条第1項の規定による就職拒否等による給付制限期間", "雇用保険法第21条の規定による待期期間、同法第32条第1項、第2項若しくは同法第52条第1項の規定による就職拒否等による給付制限期間又は同法第33条第1項の規定による離職理由による給付制限期間", "雇用保険法第21条の規定による待期期間又は同法第33条第1項の規定による離職理由による給付制限期間"],answer:"雇用保険法第21条の規定による待期期間",exp:"求職活動関係役務利用費は「待期期間」経過後の保育等サービスの利用に限り支給される。なお、就職拒否等による給付制限期間や離職理由による給付制限期間が経過した後であることは要件とされていない（広域求職活動費は「待期期間又は就職拒否等による給付制限期間」経過後が要件となる点と区別すること）。",src:"則100条の6",cat:"選択式"},
{type:"select",no:"第2-選択1",opt:"空欄B",context:"求職活動関係役務利用費の額は、受給資格者等が保育等サービスの利用のために負担した費用の額（1日当たり【B】円を限度とする。）に100分の80を乗じて得た額とする。",choices:["4,000", "8,000", "10,000", "20,000"],answer:"8,000",exp:"求職活動関係役務利用費の対象となる費用は、1日当たり8,000円を限度とされている。",src:"則100条の7",cat:"選択式"},
{type:"select",no:"第2-選択1",opt:"空欄C",context:"求職活動関係役務利用費の額は、受給資格者等が保育等サービスの利用のために負担した費用の額（1日当たり8,000円を限度とする。）に100分の【C】を乗じて得た額とする。",choices:["50", "75", "80", "100"],answer:"80",exp:"求職活動関係役務利用費は、保育等サービスの利用費用（1日当たり8,000円を限度）に100分の80（80%）を乗じて得た額が支給される。",src:"則100条の7",cat:"選択式"},
{type:"select",no:"第2-選択1",opt:"空欄D",context:"求職活動関係役務利用費は、求人者との面接等をした日については【D】日を限度として支給される。",choices:["14", "15", "30", "50"],answer:"15",exp:"求人者との面接等をした日については、15日を限度として求職活動関係役務利用費が支給される。",src:"則100条の7",cat:"選択式"},
{type:"select",no:"第2-選択1",opt:"空欄E",context:"求職活動関係役務利用費は、求職活動関係役務利用費対象訓練を受講した日については【E】日を限度として支給される。",choices:["28", "60", "64", "120"],answer:"60",exp:"求職活動関係役務利用費対象訓練を受講した日については、60日を限度として求職活動関係役務利用費が支給される。",src:"則100条の7",cat:"選択式"},
{no:"LEC第1回-問1",opt:"A",q:"5箇月間の期間を定めて季節的に雇用される労働者の1週間の所定労働時間が40時間である場合、当該労働者は被保険者とならない。",a:false,exp:"季節的に雇用される者であって、①4箇月以内の期間を定めて雇用される者又は②1週間の所定労働時間が20時間以上30時間未満である者のいずれかに該当する者は、被保険者とならない。本肢の者は①②のいずれにも該当しないため、被保険者（短期雇用特例被保険者）となる。",src:"法6条・法38条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問1",opt:"B",q:"同時に2以上の雇用関係にある労働者については、当該2以上の雇用関係のうち、当該労働者が任意に選択する一の雇用関係についてのみ、被保険者となる。",a:false,exp:"同時に2以上の雇用関係にある労働者については、原則として、その者が生計を維持するに必要な「主たる賃金を受ける一の雇用関係」についてのみ、被保険者となる（行政手引20352）。",src:"行政手引20352",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問1",opt:"C",q:"ワーキング・ホリデー制度による入国者は、旅行資金を補うための就労が認められるものであることから、被保険者となる。",a:false,exp:"ワーキング・ホリデー制度による入国者は、主として休暇を過ごすことを目的として入国し、その休暇の付随的な活動として旅行資金を補うための就労が認められるものであることから、被保険者とならない（行政手引20352）。",src:"行政手引20352",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問1",opt:"D",q:"社会人大学院生など、事業主の命により又は事業主の承認を受けて大学院等に在学する者は、事業主との雇用関係を存続している場合であっても、被保険者とならない。",a:false,exp:"事業主との雇用関係を存続した上で、事業主の命により又は事業主の承認を受け、大学院等に在学する者（社会人大学院生など）は、被保険者となる（行政手引20303）。",src:"行政手引20303",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問1",opt:"E",q:"都道府県等の長が、当該都道府県等の事業に雇用される者について、雇用保険法を適用しないことについて厚生労働大臣に対して承認の申請を行い、その承認を受けた場合、その承認の申請に係る被保険者については、その承認の申請がなされた日から同法が適用されない。",a:true,exp:"本肢のとおりである（雇用保険法施行規則4条2項）。",src:"則4条2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問2",opt:"A",q:"公共職業安定所長は、雇用保険法第9条の規定により被保険者となったことの確認をしたときは、その確認に係る者に雇用保険被保険者証を交付しなければならないが、この交付は、当該被保険者を雇用する事業主を通じて行うことができる。",a:true,exp:"本肢のとおりである（則10条1項・2項）。",src:"則10条1項・2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問2",opt:"B",q:"雇用保険法第8条の規定による被保険者となったこと又は被保険者でなくなったことの確認の請求は、文書のみならず、口頭で行うこともできる。",a:true,exp:"本肢のとおりである（則8条1項）。",src:"則8条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問2",opt:"C",q:"雇用保険の適用事業である株式会社について、その代表取締役が退任し、他の取締役が代表取締役に就任した場合、雇用保険法施行規則第142条の事業主事業所各種変更届を提出する必要はない。",a:true,exp:"本肢のとおりである（則142条1項、行政手引22351）。法人の代表者の異動については、事業主事業所各種変更届の提出事由となっていない。",src:"則142条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問2",opt:"D",q:"雇用保険被保険者資格取得届は、被保険者となった事実のあった日の属する月の翌月10日までにその事業所の所在地を管轄する公共職業安定所の長に提出しなければならず、この期限を徒過した届書は受理されない。",a:false,exp:"「翌月10日まで」とは事業主の届出の期限を示したものであって、その日を徒過したからといって届出を受理しないものではない。本肢前段の記述は正しい（則6条1項、行政手引20704）。",src:"則6条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問2",opt:"E",q:"被保険者が離職した場合において、当該被保険者がその離職の日において59歳以上である場合は、当該被保険者が雇用保険被保険者離職票の交付を希望しないときであっても、雇用保険被保険者資格喪失届に雇用保険被保険者離職証明書を添付しなければならない。",a:true,exp:"本肢のとおりである（則7条3項）。",src:"則7条3項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問3",opt:"A",q:"未支給失業等給付の支給を請求することができる遺族の要件のうち、「生計を同じくしていた」とは、生計の全部又は一部を共同計算することによって日常生活を営むグループの構成員であったということである。したがって、生計を維持されていたことを要せず、また、必ずしも同居していたことを要しない。",a:true,exp:"本肢のとおりである（行政手引53102）。なお、生計を維持されていた場合には生計を同じくしていたものと推定して差し支えない。",src:"行政手引53102",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問3",opt:"B",q:"未支給失業等給付に係る失業等給付の支給を受けることができる者の「死亡」とは、官公署又は医師によって死亡の証明がなされ得るものであるから、民法の規定による失踪宣告がなされた場合を除き、死亡が確認されていない行方不明は含まれない。",a:true,exp:"本肢のとおりである（行政手引53102）。",src:"行政手引53102",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問3",opt:"C",q:"未支給失業等給付の支給は、死亡日後最初の失業の認定日の前日までをその支給対象日として行うことができる。",a:false,exp:"未支給失業等給付の支給は、原則として、死亡の日以後の日分について行うことができない（行政手引53103）。なお、死亡の時刻等を勘案し、死亡の日を含めて失業の認定ができる場合は、死亡の日についても支給して差し支えないとされている。",src:"行政手引53103",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問3",opt:"D",q:"未支給給付請求者が、未支給失業等給付の請求をしたものの当該未支給失業等給付の支給を受けないうちに死亡した場合は、その者の相続人はその支給を請求することができる。",a:true,exp:"本肢のとおりである（行政手引53105）。",src:"行政手引53105",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問3",opt:"E",q:"未支給失業等給付は、死亡者に係る公共職業安定所の長が支給決定をした日の翌日から起算して7日以内に支給される。",a:true,exp:"本肢のとおりである（則17条の3）。",src:"則17条の3",cat:"択一式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-問4",opt:"加算日数",context:"一般被保険者Xについて、傷病により賃金の支払を受けることができなかった期間が、令和6年3月1日から同年4月5日までの36日間、令和7年2月1日から同月20日までの20日間及び令和8年1月1日から同年3月20日までの79日間あった。この場合において、Xが令和8年3月31日に離職したときの基本手当の受給資格に係る算定対象期間に加算することができる日数は【　】である。なお、Xは特定理由離職者及び特定受給資格者には該当しないものとし、各傷病はそれぞれ別の理由によって生じたものとする。",choices:["79日", "56日", "99日", "115日", "135日"],answer:"79日",exp:"算定対象期間は離職の日以前2年間（疾病・負傷等により引き続き30日以上賃金を受けることができなかった被保険者は、その日数を2年に加算した期間。最大4年）をいう。Xの離職前2年間は令和6年4月1日から令和8年3月31日まで。36日間は2年間内にある日数が5日しかないため対象外、20日間は30日未満のため対象外、79日間のみが延長の対象となる。よって加算できる日数は「79日」となる（法13条1項、行政手引50153）。",src:"法13条1項",cat:"選択式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問5",opt:"ア",q:"【基本手当に関する記述として正しいか】疾病により公共職業安定所に出頭することができなかった場合において、その期間が継続して20日に及んだときは、医師その他診療を担当した者の証明書を提出することによって、失業の認定を受けることができる。",a:false,exp:"疾病により公共職業安定所に出頭することができなかった場合において、その期間が継続して「15日未満」であるときは、医師その他診療を担当した者の証明書を提出することによって、失業の認定を受けることができる（法15条4項、則25条1項）。",src:"法15条4項・則25条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問5",opt:"イ",q:"【基本手当に関する記述として正しいか】雇用保険法第20条の2の規定による事業を開始したことによる基本手当の受給期間の特例に係る申出は、当該申出に係る者が当該事業を開始した日の翌日から起算して1箇月以内にしなければならない。ただし、天災その他申出をしなかったことについてやむを得ない理由があるときは、この限りでない。",a:false,exp:"事業を開始したことによる基本手当の受給期間の特例に係る申出は、当該事業を開始した日の翌日から起算して「2箇月以内」にしなければならない。本肢ただし書の記述は正しい（則31条の6第3項）。",src:"則31条の6第3項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問5",opt:"ウ",q:"【基本手当に関する記述として正しいか】雇用保険法第24条の2第2項の規定により、同法第22条第2項に規定する就職が困難な受給資格者に対して個別延長給付が行われる場合の延長日数の限度は、その者の所定給付日数にかかわらず、60日である。",a:true,exp:"本肢のとおりである（法24条の2第3項）。",src:"法24条の2第3項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問5",opt:"エ",q:"【基本手当に関する記述として正しいか】一般被保険者が教育訓練休暇給付金の支給を受けたことがある場合、その者が特定教育訓練休暇給付金受給者に該当する場合を除き、当該教育訓練休暇給付金に係る休暇開始日前における被保険者であった期間は、被保険者期間の計算上、被保険者であった期間に含まれない。",a:true,exp:"本肢のとおりである（法14条2項）。",src:"法14条2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問5",opt:"オ",q:"【基本手当に関する記述として正しいか】基本手当の日額の計算の基礎となる賃金日額は、算定対象期間において被保険者期間として計算された最後の6箇月間に支払われた賃金（臨時に支払われる賃金及び1箇月を超える期間ごとに支払われる賃金を除く。）の総額を180で除して得た額である。",a:false,exp:"賃金日額は、原則として、算定対象期間において被保険者期間として計算された最後の6箇月間に支払われた賃金（臨時に支払われる賃金及び「3箇月」を超える期間ごとに支払われる賃金を除く）の総額を180で除して得た額である（法17条1項）。",src:"法17条1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問6",opt:"A",q:"育児時短就業給付金の支給を受けた者が、同一の就業につき高年齢雇用継続基本給付金の支給を受けることができる場合、高年齢雇用継続基本給付金については支給されない。ただし、高年齢雇用継続基本給付金の額が育児時短就業給付金の額に満たない場合は、その差額が高年齢雇用継続基本給付金として支給される。",a:false,exp:"本肢のような差額支給の規定はない。育児時短就業給付金の支給を受けることができる者が、同一の就業につき高年齢雇用継続基本給付金又は高年齢再就職給付金の支給を受けることができる場合、その者が高年齢雇用継続基本給付金等の支給を受けたときは育児時短就業給付金は支給されず、育児時短就業給付金の支給を受けたときは高年齢雇用継続基本給付金等は支給されない（法61条の12第10項）。",src:"法61条の12第10項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問6",opt:"B",q:"育児時短就業給付金の支給限度額は、労働者をその賃金の額の高低に従い区分し、その区分された階層のうち最も高い賃金の額に係る階層に属する労働者の賃金の額の平均値の額を基礎として厚生労働大臣が定める。",a:false,exp:"育児時短就業給付金の支給限度額は、労働者をその賃金の額の高低に従い区分し、その区分された階層のうち最も高い賃金の額に係る階層に属する労働者の賃金の額の「中央値」の額を基礎として厚生労働大臣が定める（法61条の12第2項）。",src:"法61条の12第2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問6",opt:"C",q:"一般被保険者が出生後休業をした場合において、当該一般被保険者の配偶者が期間を定めて雇用される者であり、その養育する子の出生の日（出産予定日前に当該子が出生した場合にあっては、当該出産予定日）から起算して8週間を経過する日の翌日から6月を経過する日までにその労働契約（契約が更新される場合にあっては、更新後のもの）が満了することが明らかであるときは、出生後休業支援給付金の支給に当たって、配偶者が通算して14日以上の出生後休業をしたことの要件は問われない。",a:true,exp:"本肢のとおりである（法61条の10第2項、則101条の38、行政手引6005）。",src:"法61条の10第2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問6",opt:"D",q:"初めて育児休業給付金の支給を受けようとする場合の育児休業給付受給資格確認票・（初回）育児休業給付金／出生後休業支援給付金支給申請書の提出は、支給単位期間の初日から起算して2箇月を経過する日の属する月の末日までに行わなければならない。",a:false,exp:"本肢の提出は、支給単位期間の初日から起算して「4箇月」を経過する日の属する月の末日までに行わなければならない（則101条の30第1項）。",src:"則101条の30第1項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問6",opt:"E",q:"育児休業を開始した日から起算して育児休業給付金の支給に係る休業日数が通算して180日に達するまでの間にある支給単位期間において、事業主から支払われた賃金の額が、休業開始時賃金日額に支給日数を乗じて得た額の100分の67以上となるときは、当該支給単位期間については育児休業給付金は支給されない。",a:false,exp:"育児休業給付金は、180日に達するまでの間にある支給単位期間であるか否かにかかわらず、支給単位期間において事業主から支払われた賃金の額が、休業開始時賃金日額に支給日数を乗じて得た額の「100分の80以上」となるときは支給されない（法61条の7第7項）。",src:"法61条の7第7項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問7",opt:"ア",q:"【日雇労働求職者給付金に関する記述として正しいか。なお、本問において「基礎期間」とは、印紙保険料が各月11日分以上、かつ、通算して78日分以上納付されている継続する6月間をいう。】日雇労働求職者給付金の支給を受けることができる者が、偽りその他不正の行為により求職者給付又は就職促進給付の支給を受け、又は受けようとしたときは、その支給を受け、又は受けようとした月及びその月の翌月から3箇月間は、日雇労働求職者給付金は支給されない。ただし、やむを得ない理由がある場合には、日雇労働求職者給付金の全部又は一部を支給することができる。",a:true,exp:"本肢のとおりである（法52条3項）。",src:"法52条3項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問7",opt:"イ",q:"【日雇労働求職者給付金に関する記述として正しいか。なお、本問において「基礎期間」とは、印紙保険料が各月11日分以上、かつ、通算して78日分以上納付されている継続する6月間をいう。】日雇労働被保険者が失業し、その失業の日の属する月の前月の印紙保険料の納付日数が10日、その失業の日の属する月の前々月の印紙保険料の納付日数が14日であった場合、当該日雇労働被保険者は、その失業について普通給付の日雇労働求職者給付金の支給を受けることはできない。",a:true,exp:"本肢のとおりである（法45条）。普通給付の日雇労働求職者給付金の支給を受けるためには、失業の日の属する月の前2月間に、印紙保険料が通算して26日分以上納付されていることが必要である。本肢の者は通算して24日分しか納付されていないため、支給されない。",src:"法45条",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問7",opt:"ウ",q:"【日雇労働求職者給付金に関する記述として正しいか。なお、本問において「基礎期間」とは、印紙保険料が各月11日分以上、かつ、通算して78日分以上納付されている継続する6月間をいう。】特例給付の日雇労働求職者給付金の支給を受けることができる期間及び日数は、基礎期間の最後の月の翌月以後4月の期間内の失業している日について、通算して60日分が限度とされている。",a:true,exp:"本肢のとおりである（法54条）。",src:"法54条",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問7",opt:"エ",q:"【日雇労働求職者給付金に関する記述として正しいか。なお、本問において「基礎期間」とは、印紙保険料が各月11日分以上、かつ、通算して78日分以上納付されている継続する6月間をいう。】普通給付の日雇労働求職者給付金は、各月につき日雇労働被保険者が職業に就かなかった最初の日については支給されない。",a:false,exp:"普通給付の日雇労働求職者給付金は、「各週」につき日雇労働被保険者が職業に就かなかった最初の日については支給されない（法50条2項）。",src:"法50条2項",cat:"択一式（雇用保険法・LEC第1回）"},
{no:"LEC第1回-問7",opt:"オ",q:"【日雇労働求職者給付金に関する記述として正しいか。なお、本問において「基礎期間」とは、印紙保険料が各月11日分以上、かつ、通算して78日分以上納付されている継続する6月間をいう。】特例給付の日雇労働求職者給付金の支給を受けるための申出は、基礎期間の最後の月の翌月以後2月の期間内に行わなければならない。",a:false,exp:"特例給付の日雇労働求職者給付金の支給を受けるための申出は、基礎期間の最後の月の翌月以後「4月」の期間内に行わなければならない（法53条2項）。",src:"法53条2項",cat:"択一式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問3",opt:"空欄A",context:"再就職手当は、【A】受給資格者であって、当該職業に就いた日の前日における基本手当の支給残日数が当該受給資格に基づく所定給付日数の3分の1以上であるものに対して、公共職業安定所長が厚生労働省令で定める基準に従って必要があると認めたときに、支給する。",choices:["厚生労働省令で定める安定した職業に就いた", "期間の定めのない労働契約を締結した", "公共職業安定所又は職業紹介事業者等の紹介により職業に就いた", "厚生労働省令で定める期間以上の期間の定めのある労働契約を締結した"],answer:"厚生労働省令で定める安定した職業に就いた",exp:"再就職手当は、厚生労働省令で定める安定した職業に就いた受給資格者であって、基本手当の支給残日数が当該受給資格に基づく所定給付日数の3分の1以上であるものに対して支給する（法56条の3第1項）。",src:"法56条の3第1項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問3",opt:"空欄B",context:"再就職手当は、厚生労働省令で定める安定した職業に就いた受給資格者であって、当該職業に就いた日の前日における基本手当の支給残日数が【B】であるものに対して、公共職業安定所長が厚生労働省令で定める基準に従って必要があると認めたときに、支給する。",choices:["当該受給資格に基づく所定給付日数の3分の1以上", "当該受給資格に基づく所定給付日数の3分の2以上", "45日以上", "90日以上"],answer:"当該受給資格に基づく所定給付日数の3分の1以上",exp:"再就職手当の支給残日数の要件は、当該受給資格に基づく所定給付日数の3分の1以上である（法56条の3第1項）。",src:"法56条の3第1項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問3",opt:"空欄C",context:"出生後休業支援給付金の額は、賃金日額に相当する額に当該被保険者が対象期間内に出生後休業をした日数（その日数が【C】を超えるときは、【C】）を乗じて得た額の100分の13に相当する額とする。",choices:["28日", "30日", "42日", "60日"],answer:"28日",exp:"出生後休業支援給付金の額の算定において、出生後休業をした日数の上限となるのは「28日」である（法61条の10第6項）。",src:"法61条の10第6項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問3",opt:"空欄D",context:"出生後休業支援給付金の額は、賃金日額に相当する額に当該被保険者が対象期間内に出生後休業をした日数（その日数が28日を超えるときは、28日）を乗じて得た額の【D】に相当する額とする。",choices:["100分の13", "100分の10", "100分の18", "100分の20"],answer:"100分の13",exp:"出生後休業支援給付金の額は、上記により得た額の100分の13に相当する額とする（法61条の10第6項）。",src:"法61条の10第6項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問3",opt:"空欄E",context:"一般被保険者Xが令和3年8月31日にY社を正当な理由なく自己の都合により離職し、当該離職について基本手当を受給した後、令和4年5月1日にZ社に就職して再び一般被保険者となった。その後、令和6年2月28日にZ社を正当な理由なく自己の都合により離職し、当該離職について基本手当を受給した後、令和7年2月1日にW社に就職して再び一般被保険者となった。この場合において、令和8年4月30日にXがW社を正当な理由なく自己の都合により離職し、当該離職について受給資格の決定を受けたときの基本手当の給付制限期間は、【E】となる。",choices:["3か月", "1か月", "2か月", "4か月"],answer:"3か月",exp:"基本手当の給付制限に関する出題である（法33条1項、行政手引52205-1）。本問の場合、正当な理由のない自己の都合による離職に係る基本手当の給付制限期間は「3か月」となる。",src:"法33条1項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問8",opt:"空欄A",context:"雇用保険法第3条において、「雇用保険は、第1条の目的を達成するため、失業等給付及び【A】を行うほか、雇用安定事業及び能力開発事業を行うことができる。」と規定されている。",choices:["育児休業等給付", "介護休業給付", "教育訓練給付", "二次健康診断等給付"],answer:"育児休業等給付",exp:"雇用保険は、失業等給付及び育児休業等給付を行うほか、雇用安定事業及び能力開発事業を行うことができる（法3条）。",src:"法3条",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問8",opt:"空欄B",context:"雇用保険法における求職者給付は、基本手当、【B】とされている。",choices:["技能習得手当、寄宿手当及び傷病手当", "技能習得手当、通所手当及び傷病手当", "就業促進手当、寄宿手当及び傷病手当", "就業促進手当、受講手当及び傷病手当"],answer:"技能習得手当、寄宿手当及び傷病手当",exp:"一般被保険者に係る求職者給付は、基本手当、技能習得手当、寄宿手当及び傷病手当とされている（法10条）。",src:"法10条",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問8",opt:"空欄C",context:"雇用保険法第9条によると、厚生労働大臣は、同法第7条の規定による届出若しくは同法第8条の規定による確認の請求により、又は職権で、労働者が被保険者となったこと又は被保険者でなくなったことの確認を行うものとされているが、【C】については、これらの規定は適用されない。",choices:["日雇労働被保険者", "高年齢被保険者、短期雇用特例被保険者及び日雇労働被保険者", "短期雇用特例被保険者及び日雇労働被保険者", "短期雇用特例被保険者"],answer:"日雇労働被保険者",exp:"被保険者となったこと等の確認に関する規定は、日雇労働被保険者については適用されない（法9条2項）。",src:"法9条2項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問8",opt:"空欄D",context:"一般被保険者Xが、その雇用されていた事業主の事業について発生した更生手続開始に伴い離職した場合において、基準日における年齢が満60歳であって、算定基礎期間が20年であるときは、Xの基本手当の所定給付日数は、【D】となる。なお、Xは、雇用保険法第22条第2項の「厚生労働省令で定める理由により就職が困難なもの」には該当しないものとする。",choices:["240日", "210日", "270日", "330日"],answer:"240日",exp:"更生手続開始に伴う離職者は特定受給資格者に該当する。基準日における年齢60歳以上65歳未満・算定基礎期間20年以上の場合の所定給付日数は240日である（法23条1項）。",src:"法23条1項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問8",opt:"空欄E",context:"事業主及び労働保険事務組合は、雇用保険に関する書類（雇用安定事業又は能力開発事業に関する書類及び労働保険徴収法又は労働保険徴収法施行規則に関する書類を除く。）をその完結の日から2年間（被保険者に関する書類にあっては、【E】年間）保管しなければならない。",choices:["4", "2", "3", "5"],answer:"4",exp:"雇用保険に関する書類は、その完結の日から2年間（被保険者に関する書類にあっては4年間）保管しなければならない（則143条）。",src:"則143条",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問9",opt:"空欄A",context:"教育訓練給付金は、次のいずれかに該当する者が、厚生労働省令で定めるところにより、【A】を図るために必要な職業に関する教育訓練として厚生労働大臣が指定する教育訓練を受け、当該教育訓練を修了した場合（当該教育訓練に係る指定教育訓練実施者により厚生労働省令で定める証明がされた場合等に限る。）において、支給要件期間が3年以上であるときに、支給する。",choices:["雇用の安定及び就職の促進", "雇用状態の是正", "雇用の継続", "職業能力の開発及び向上"],answer:"雇用の安定及び就職の促進",exp:"教育訓練給付金は、雇用の安定及び就職の促進を図るために必要な職業に関する教育訓練として厚生労働大臣が指定する教育訓練を受け修了した場合等に支給する（法60条の2第1項）。",src:"法60条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問9",opt:"空欄B",context:"教育訓練給付金は、厚生労働大臣が指定する教育訓練を受け修了した場合（当該教育訓練を受けている場合であって厚生労働省令で定める場合を含み、【B】により厚生労働省令で定める証明がされた場合に限る。）において支給される。",choices:["当該教育訓練に係る指定教育訓練実施者", "市町村長（特別区長を含む。）", "所轄公共職業安定所長", "都道府県知事"],answer:"当該教育訓練に係る指定教育訓練実施者",exp:"教育訓練を受け又は受けていること等の証明は、当該教育訓練に係る指定教育訓練実施者により行われる（法60条の2第1項）。",src:"法60条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問9",opt:"空欄C",context:"教育訓練給付金は、雇用の安定及び就職の促進を図るために必要な職業に関する教育訓練として厚生労働大臣が指定する教育訓練を受け、当該教育訓練を修了した場合（当該教育訓練に係る指定教育訓練実施者により厚生労働省令で定める証明がされた場合等に限る。）において、【C】であるときに、支給する。",choices:["支給要件期間が3年以上", "支給単位期間が3年以上", "支給単位期間が5年以上", "支給要件期間が5年以上"],answer:"支給要件期間が3年以上",exp:"教育訓練給付金は、支給要件期間が3年以上であるときに支給する（法60条の2第1項）。",src:"法60条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問9",opt:"空欄D",context:"「厚生労働省令で定める期間」は原則1年であるが、妊娠、出産、育児、疾病、負傷その他やむを得ない理由により引き続き30日以上教育訓練を開始することができない者が一定の手続をした場合には、当該教育訓練を開始することができない日数を加算するものとし、その加算された期間が【D】を超えるときは、【D】とする。",choices:["20年", "3年", "5年", "10年"],answer:"20年",exp:"教育訓練給付の適用対象期間の延長における上限は20年とされている（法60条の2）。",src:"法60条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問9",opt:"空欄E",context:"教育訓練給付金の額は、教育訓練給付対象者が教育訓練の受講のために支払った費用（当該費用の額であることについて当該教育訓練に係る指定教育訓練実施者により証明がされたものに限る。）に【E】の範囲内において厚生労働省令で定める率を乗じて得た額（その額が厚生労働省令で定める額を超えるときは、その定める額。）とする。",choices:["100分の20以上100分の80以下", "100分の20以上100分の90以下", "100分の30以上100分の80以下", "100分の30以上100分の90以下"],answer:"100分の20以上100分の80以下",exp:"教育訓練給付金の額は、支払った費用の額に100分の20以上100分の80以下の範囲内において厚生労働省令で定める率を乗じて得た額とする（法60条の2）。",src:"法60条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問10",opt:"空欄A",context:"失業等給付の支給を受けることができる者が死亡した場合であって、その者に支給されるべき失業等給付でまだ支給されていないものがあるときにおいて、その者の遺族は、その者の死亡の当時当該その者と生計を同じくしていた子W及び母X並びにその者の死亡の当時その者と生計を同じくしていなかった妻Y及び子Zがいた。この場合における未支給の失業等給付の支給を受けるべき者の順位が最も高いものは、【A】である。",choices:["W", "W及びX", "W、Y及びZ", "Y"],answer:"W",exp:"未支給の失業等給付を受けるべき遺族の順位は、配偶者・子・父母・孫・祖父母・兄弟姉妹の順であり、死亡の当時その者と生計を同じくしていた者に限られる。本問では生計を同じくしていた子W及び母Xのうち、子Wの順位が最も高い（法10条の3）。",src:"法10条の3",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問10",opt:"空欄B",context:"雇用保険法第37条第3項において、「傷病手当の日額は、第16条の規定による【B】に相当する額とする。」と規定されている。",choices:["基本手当の日額", "基本手当の日額の2分の1", "基本手当の日額の3分の2", "基本手当の日額の4分の3"],answer:"基本手当の日額",exp:"傷病手当の日額は、第16条の規定による基本手当の日額に相当する額とする（法37条3項）。",src:"法37条3項",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問10",opt:"空欄C",context:"育児時短就業給付金の受給資格者が出向した場合であって、当該被保険者資格の喪失後1日の空白もなく被保険者資格を取得したときは、雇用関係が継続しているものとみなされるので、当該喪失が離職によるものか否かにかかわらず、当該出向のあった月も支給対象となり得る。この場合の当該出向のあった月に係る支給申請は、【C】所轄公共職業安定所に対して行うものとされている。",choices:["出向後の", "出向前の", "出向前及び出向後の双方の", "当該者が選択する"],answer:"出向後の",exp:"出向のあった月に係る育児時短就業給付金の支給申請は、出向後の所轄公共職業安定所に対して行うものとされている（法61条の12）。",src:"法61条の12",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問10",opt:"空欄D",context:"雇用保険法第67条の2において、「国庫は、毎会計年度において、労働保険特別会計の雇用勘定の財政状況を踏まえ、必要がある場合（一定の場合に限る。）には、当該会計年度における失業等給付及び第64条に規定する【D】の支給に要する費用の一部に充てるため、予算で定めるところにより、一定の規定により負担する額を超えて、その費用の一部を負担することができる。」と規定されている。",choices:["職業訓練受講給付金", "就労自立給付金", "人材開発支援助成金", "地域雇用開発助成金"],answer:"職業訓練受講給付金",exp:"雇用保険法第64条に規定する求職者支援に係る給付は職業訓練受講給付金であり、国庫はその支給に要する費用の一部を負担することができる（法67条の2）。",src:"法67条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{type:"select",no:"LEC第1回-選択問10",opt:"空欄E",context:"雇用保険法第68条の2によると、【E】に要する費用並びにこれらの給付に関する事務の執行に要する経費については、子ども・子育て支援法第71条の3第1項の規定により政府が徴収する子ども・子育て支援納付金をもって充てるものとされている。",choices:["出生後休業支援給付及び育児時短就業給付", "育児休業給付", "育児休業等給付", "出生時育児休業給付金及び出生後休業支援給付金"],answer:"出生後休業支援給付及び育児時短就業給付",exp:"出生後休業支援給付及び育児時短就業給付に要する費用等は、子ども・子育て支援納付金をもって充てるものとされている（法68条の2）。",src:"法68条の2",cat:"選択式（雇用保険法・LEC第1回）"},
{no:"TAC社06-問1",opt:"A",q:"雇用保険法の適用を受けない労働者のみを雇用する事業主の事業（国、都道府県、市町村その他これらに準ずるものの事業及び法人である事業主の事業を除く。）は、その労働者の数が常時5人未満であれば、任意適用事業となる。",a:false,exp:"任意適用事業（暫定任意適用事業）となるのは、常時5人未満の労働者を雇用する個人経営の農林水産の事業（船員が雇用される事業を除く。）である。また、雇用保険法の適用を受けない労働者のみを雇用する事業主の事業については、その数のいかんにかかわらず、適用事業として取り扱う必要はないとされている（法5条1項、法附則2条1項、令附則2条、行政手引20105）。",src:"法5条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問1",opt:"B",q:"短期雇用特例被保険者は、同一の事業主に引き続き1年以上（受給要件の緩和が認められる期間はないものとする。）雇用されるに至った日において65歳以上であるときは、その日に被保険者資格を喪失する。",a:false,exp:"設問の者は、1年以上雇用されるに至った日（切替日）に「高年齢被保険者」となる。なお、同一の事業主に引き続いて1年以上（原則）雇用されるに至った日（切替日）に65歳未満の者は、切替日から一般被保険者となる（法4条1項、行政手引20451）。",src:"法4条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問1",opt:"C",q:"家事使用人は被保険者とならないが、適用事業に雇用されて主として家事以外の労働に従事することを本務とする者は、家事に使用されることがあっても、被保険者となり得る。",a:true,exp:"設問の通り正しい（法4条1項、行政手引20351）。",src:"法4条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問1",opt:"D",q:"労働者が長期欠勤している場合であっても、その雇用される適用事業の事業主から賃金の支払を受けているときに限り、被保険者となる。",a:false,exp:"労働者が長期欠勤している場合であっても、雇用関係が存続する限り「賃金の支払を受けていると否とを問わず」被保険者となる（法4条1項、行政手引20352）。",src:"法4条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問1",opt:"E",q:"個人事業の事業主は被保険者とならないが、労働者災害補償保険法の規定に基づき、いわゆる一人親方等として労働者災害補償保険に特別加入している者については、一人親方等の団体を事業主と、一人親方等を労働者とみなした場合の雇用関係に基づき雇用保険法を適用し、被保険者となる。",a:false,exp:"一人親方等として労働者災害補償保険に特別加入をしていたとしても、そのことにより雇用保険の被保険者とされることはないので誤り（法4条1項、行政手引20351）。",src:"法4条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問2",opt:"ア",q:"【特定法人にあっては、原則として、当該届書又は申請書の提出に代えて、これらに記載すべき事項を電子情報処理組織を使用して提出すること（電子申請）とされているか】雇用保険適用事業所設置（又は廃止）届",a:false,exp:"当該適用事業所設置（又は廃止）届については、電子情報処理組織を使用して提出することとはされていない（則141条）。",src:"則141条",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問2",opt:"イ",q:"【特定法人にあっては、原則として、当該届書又は申請書の提出に代えて、これらに記載すべき事項を電子情報処理組織を使用して提出すること（電子申請）とされているか】雇用保険被保険者資格取得届",a:true,exp:"当該資格取得届は、特定法人にあっては、原則として、電子情報処理組織を使用して提出することとされている（則6条9項）。",src:"則6条9項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問2",opt:"ウ",q:"【特定法人にあっては、原則として、当該届書又は申請書の提出に代えて、これらに記載すべき事項を電子情報処理組織を使用して提出すること（電子申請）とされているか】雇用保険被保険者資格喪失届",a:true,exp:"当該資格喪失届は、特定法人にあっては、原則として、電子情報処理組織を使用して提出することとされている（則7条7項）。",src:"則7条7項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問2",opt:"エ",q:"【特定法人にあっては、原則として、当該届書又は申請書の提出に代えて、これらに記載すべき事項を電子情報処理組織を使用して提出すること（電子申請）とされているか】雇用保険被保険者転勤届",a:true,exp:"当該転勤届は、特定法人にあっては、原則として、電子情報処理組織を使用して提出することとされている（則13条6項）。",src:"則13条6項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問2",opt:"オ",q:"【特定法人にあっては、原則として、当該届書又は申請書の提出に代えて、これらに記載すべき事項を電子情報処理組織を使用して提出すること（電子申請）とされているか】介護休業給付金支給申請書",a:false,exp:"当該介護休業給付金支給申請書については、電子情報処理組織を使用して提出することとはされていない（則101条の19）。特定法人の電子申請義務は、資格取得届・資格喪失届・転勤届、高年齢雇用継続基本給付金の支給申請、育児休業等給付の支給申請の5つである。",src:"則101条の19",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問3",opt:"ア",q:"【基本手当に関する記述として正しいか。なお「就職困難者」とは雇用保険法第22条第2項に規定する厚生労働省令で定める理由により就職が困難な者であり、「基準日」とは基本手当の受給資格に係る離職の日のことである。また、特定教育訓練休暇給付金受給者は考慮しないものとする。】一般被保険者が令和8年3月1日に就職し、同年8月25日に離職したとき、同年3月1日から3月25日までの間に賃金の支払の基礎になった日数が11日以上あれば、被保険者期間は6箇月となる。",a:false,exp:"設問の場合、令和8年3月1日から3月25日までの期間は2分の1箇月の被保険者期間として計算される。したがって、設問の者の被保険者期間は最長でも5.5箇月であり、「6箇月」となることはない（法14条1項）。",src:"法14条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問3",opt:"イ",q:"【基本手当に関する記述として正しいか。なお「就職困難者」とは雇用保険法第22条第2項に規定する厚生労働省令で定める理由により就職が困難な者であり、「基準日」とは基本手当の受給資格に係る離職の日のことである。また、特定教育訓練休暇給付金受給者は考慮しないものとする。】いわゆる日給者の賃金日額は、算定対象期間において被保険者期間として計算された最後の6箇月間に支払われた賃金（臨時に支払われる賃金及び3箇月を超える期間ごとに支払われる賃金を除く。）の総額を当該最後の6箇月間に労働した日数で除して得た額の100分の60に相当する額が最低保障される。",a:false,exp:"いわゆる日給者等の賃金日額は、最後の6箇月間に支払われた賃金の総額を当該最後の6箇月間に労働した日数で除して得た額の「100分の70」に相当する額が最低保障される（法17条2項1号）。",src:"法17条2項1号",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問3",opt:"ウ",q:"【基本手当に関する記述として正しいか。なお「就職困難者」とは雇用保険法第22条第2項に規定する厚生労働省令で定める理由により就職が困難な者であり、「基準日」とは基本手当の受給資格に係る離職の日のことである。また、特定教育訓練休暇給付金受給者は考慮しないものとする。】雇用保険受給資格者証の交付を受けた受給資格者は、受給期間内に就職したときは、その期間内に再び離職し、当該受給資格に基づき基本手当の支給を受ける場合のために、雇用保険受給資格者証を保管しなければならない。",a:true,exp:"設問の通り正しい（則20条1項）。",src:"則20条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問3",opt:"エ",q:"【基本手当に関する記述として正しいか。なお「就職困難者」とは雇用保険法第22条第2項に規定する厚生労働省令で定める理由により就職が困難な者であり、「基準日」とは基本手当の受給資格に係る離職の日のことである。また、特定教育訓練休暇給付金受給者は考慮しないものとする。】雇用保険法第21条の規定による待期は、1受給期間内に1回をもって足り、受給期間内に就職して新たな受給資格を取得することなく、再び失業した場合には、最初の離職後において既に7日の待期を満了している者については再び要求されない。",a:true,exp:"設問の通り正しい（法21条、行政手引51102）。",src:"法21条",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問3",opt:"オ",q:"【基本手当に関する記述として正しいか。なお「就職困難者」とは雇用保険法第22条第2項に規定する厚生労働省令で定める理由により就職が困難な者であり、「基準日」とは基本手当の受給資格に係る離職の日のことである。また、特定教育訓練休暇給付金受給者は考慮しないものとする。】期間の定めのある労働契約の期間が満了し、かつ、当該労働契約の更新を希望したにもかかわらず、当該更新についての合意が成立するに至らなかったために、令和8年6月30日に離職した特定理由離職者である受給資格者（就職困難者に該当しないものとする。）の基準日における年齢が45歳であり、かつ、算定基礎期間が10年である場合、所定給付日数は270日となる。",a:true,exp:"設問の通り正しい（法13条3項、法23条1項2号ロ、法附則4条1項、則19条の2第1号、則附則18条）。設問の特定理由離職者（希望に反して契約更新がなかったことにより離職した者）については、特定受給資格者とみなして所定給付日数（及び受給期間）の規定が適用される。",src:"法23条1項2号ロ",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問4",opt:"A",q:"失業の認定は、原則として、管轄公共職業安定所の長が行うこととされているが、管轄公共職業安定所の長は、受給資格者の申出によって必要があると認めるときは、その者について行う基本手当に関する事務を他の公共職業安定所長に委嘱することができる。",a:true,exp:"設問の通り正しい。なお、設問の場合には、その委嘱に係る受給資格者についての失業の認定等は、当該委嘱を受けた公共職業安定所長が行う（法15条2項、則1条5項1号、則22条、則54条1項）。",src:"法15条2項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問4",opt:"B",q:"職業に就くためやむを得ず所定の失業の認定日に管轄公共職業安定所に出頭することができない者は、管轄公共職業安定所の長に対し、失業の認定日の変更を申し出ることができる。",a:true,exp:"設問の通り正しい（法15条3項、則23条1項1号、行政手引51351）。",src:"法15条3項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問4",opt:"C",q:"管轄公共職業安定所の長は、失業の認定に当たっては、失業認定申告書に記載された求職活動の内容を確認するとともに、受給資格者に対し、職業紹介又は職業指導を行うものとされているが、離職理由による給付制限の規定により基本手当の支給をしないこととされる受給資格者に対しても職業紹介又は職業指導を行うものとされている。",a:true,exp:"設問の通り正しい（則28条の2第1項・3項、則48条）。",src:"則28条の2",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問4",opt:"D",q:"高年齢求職者給付金及び特例一時金については、基本手当と異なり、失業の認定は管轄公共職業安定所の長が指定する日、1回のみ行われるものとされており、高年齢受給資格者及び特例受給資格者は、受給手続の際、求職の申込みをすることを要しない。",a:false,exp:"高年齢求職者給付金又は特例一時金を受けようとする場合も、求職の申込みをした上、失業していることについての認定を受けなければならない（法37条の4第5項、法40条3項）。",src:"法37条の4第5項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問4",opt:"E",q:"日雇労働求職者給付金のいわゆる普通給付に係る失業の認定を受けようとする日が、行政機関の休日であって、かつ、公共職業安定所が日雇労働被保険者の職業紹介について平常通り業務を行わない日であるときは、その日（その日が引き続く場合には、その最後の日）の後1箇月以内にその日に職業に就くことができなかったことを届け出て失業の認定を受けることができる。",a:true,exp:"設問の通り正しい（則75条2項1号）。",src:"則75条2項1号",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問5",opt:"A",q:"傷病手当の支給に関して、疾病又は負傷のために基本手当の支給を受けることができないことについての認定を受けた受給資格者が、当該認定を受けた日について労働者災害補償保険法の規定による複数事業労働者休業給付の支給を受けることができる場合には、傷病手当は減額して支給される。",a:false,exp:"設問の場合、傷病手当は支給されないので誤り。設問の認定を受けた日について、健康保険法の規定による傷病手当金、労働基準法の規定による休業補償、労働者災害補償保険法の規定による休業補償給付又は休業給付等を受けることができる場合にも、傷病手当は支給されない（法37条1項・8項）。",src:"法37条1項・8項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問5",opt:"B",q:"受講手当は、受給資格者が公共職業安定所長の指示した公共職業訓練等（その期間が2年以内のものに限る。）を受けた日であって基本手当の支給対象となる日に支給されるものであり、当該受給資格者が、自己の労働による収入があったために減額計算を行った結果基本手当が支給されないこととなる日については、支給されない。",a:false,exp:"受講手当は「基本手当の支給の対象となる日」について支給されるものであるが、当該「基本手当の支給の対象となる日」には、自己の労働による収入があったために基本手当が支給されないこととなる日が含まれる。したがって、設問の場合には、受講手当は支給される（法36条1項、令4条1項、則57条1項、行政手引52851）。",src:"法36条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問5",opt:"C",q:"高年齢求職者給付金の支給を受けた者が、失業の認定日の翌日に就職した場合、当該高年齢求職者給付金を返還しなければならない。",a:false,exp:"高年齢求職者給付金は、失業の認定の日に失業の状態にあればよいのであり、翌日から就職したとしても返還の必要はない。なお、特例一時金も同様である（法37条の4第5項、行政手引54201）。",src:"法37条の4第5項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問5",opt:"D",q:"令和8年2月10日に雇用され、同日に短期雇用特例被保険者の資格を取得した者が、同年7月20日に離職し、失業している場合において、各月の賃金支払基礎日数が11日以上あるときは、その者は特例受給資格者となる。",a:true,exp:"設問の通り正しい。短期雇用特例被保険者の被保険者期間は暦月で計算されるため2分の1箇月と計算されることはない。したがって、設問の者の被保険者期間は6箇月となり、特例受給資格者となる（法14条1項、法39条1項、法附則3条）。",src:"法39条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問5",opt:"E",q:"日雇労働被保険者が日雇労働求職者給付金の支給を受けることができる場合において、その者が同時に基本手当の受給資格を満たしているときは、基本手当が支給され、日雇労働求職者給付金の支給を受けることはできない。",a:false,exp:"日雇労働求職者給付金の支給を受けることができる者が基本手当の受給資格者である場合において、基本手当の支給を受けたときはその支給の対象となった日については日雇労働求職者給付金を支給せず、日雇労働求職者給付金の支給を受けたときはその支給の対象となった日については基本手当を支給しないとされている（法46条、法55条4項）。",src:"法46条",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問6",opt:"A",q:"受給資格者が、自ら事業（当該事業により当該受給資格者が自立することができると公共職業安定所長が認めたものに限る。）を開始した場合には、再就職手当又は常用就職支度手当の支給対象となる。",a:false,exp:"事業（当該事業により当該受給資格者が自立することができると公共職業安定所長が認めたものに限る。）を開始した場合は、再就職手当の支給対象となるが、常用就職支度手当の支給対象とはならない（法56条の3第1項、則82条の2、則82条の3第1項）。",src:"法56条の3第1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問6",opt:"B",q:"移転費の支給を受けた受給資格者等は、公共職業安定所、特定地方公共団体又は職業紹介事業者の紹介した職業に就かなかったときは、その事実が確定した日の翌日から起算して10日以内に移転費を支給した公共職業安定所長にその旨を届け出るとともに、その支給を受けた移転費に相当する額を返還しなければならない。",a:true,exp:"設問の通り正しい。なお、公共職業安定所長の指示した公共職業訓練等を受けなかったときも同様である（則95条1項）。",src:"則95条1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問6",opt:"C",q:"一般被保険者でなくなって1年を経過しない者が負傷により30日以上教育訓練を開始することができない場合であって、傷病手当の支給を受けているときは、教育訓練給付金適用対象期間延長の対象とならない。",a:false,exp:"設問の場合は、傷病手当の支給を受けていても、教育訓練給付金適用対象期間の延長の対象となる（法60条の2第1項2号、則101条の2の5第1項、行政手引58022）。",src:"法60条の2第1項2号",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問6",opt:"D",q:"教育訓練給付金支給対象者であって専門実践教育訓練に係る教育訓練給付金の支給を受けようとする者は、当該専門実践教育訓練の受講開始後遅滞なく、教育訓練給付金及び教育訓練支援給付金受給資格確認票その他必要な書類を管轄公共職業安定所の長に提出しなければならない。",a:false,exp:"設問の教育訓練給付金及び教育訓練支援給付金受給資格確認票は、専門実践教育訓練を「開始する日の14日前までに」提出しなければならない（則101条の2の13第1項）。",src:"則101条の2の13第1項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問6",opt:"E",q:"教育訓練休暇給付金の支給の対象となる教育訓練休暇の期間は、30日（当分の間にあっては40日）以上とされている。",a:false,exp:"教育訓練休暇給付金の支給の対象となる教育訓練休暇の期間は、30日以上とされている。カッコ書の「当分の間にあっては40日」という規定はない（則101条の2の18第2項）。",src:"則101条の2の18第2項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問7",opt:"A",q:"支給対象月における高年齢雇用継続基本給付金の額として算定された額が、賃金日額の最低限度額に相当する額を超えないときは、当該支給対象月については、高年齢雇用継続基本給付金は支給されない。",a:false,exp:"支給対象月における高年齢雇用継続基本給付金の額として算定された額が、賃金日額の「最低限度額（3,014円）の100分の80」に相当する額を超えないときは、当該支給対象月については、高年齢雇用継続基本給付金は支給されない（法18条3項、法61条6項、令和7.7.22厚労告201号）。",src:"法61条6項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問7",opt:"B",q:"受給資格に係る離職の日において60歳であって、かつ、所定給付日数が180日である特定受給資格者が100日分の基本手当を受給した後、安定した職業に就いたことにより被保険者となった場合には、他の要件を満たしていても高年齢再就職給付金は支給されない。",a:true,exp:"設問の通り正しい。高年齢再就職給付金は、就職日の前日における支給残日数が100日未満であるときは支給されない。設問の場合、当該支給残日数は80日（180日－100日）であるので、高年齢再就職給付金は支給されない（法61条の2第1項1号）。",src:"法61条の2第1項1号",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問7",opt:"C",q:"基本手当の受給資格者であって、5月10日に60歳に達した者が、その翌々月の7月2日に再就職した場合に他の要件を満たしていれば、当該7月について、高年齢再就職給付金が支給される。",a:false,exp:"高年齢再就職給付金が支給される「再就職後の支給対象月」は、その月の初日から末日まで引き続いて、被保険者であることが必要である。設問の場合、7月2日に再就職（7月の途中に被保険者資格を取得）していることから、当該7月には、高年齢再就職給付金が支給されることはない（法61条の2第1項・2項）。",src:"法61条の2",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問7",opt:"D",q:"介護休業給付金の支給要件に係るみなし被保険者期間を算定する場合には、介護休業（同一の対象家族について2回以上の介護休業をした場合にあっては、初回の介護休業とする。）を開始した日の前日からさかのぼって、被保険者であった期間を1箇月ごとに区分し、各区分期間のうち賃金支払基礎日数が14日以上あるものをみなし被保険者期間1箇月として計算する。",a:false,exp:"介護休業給付金の支給要件に係るみなし被保険者期間を算定する場合には、各区分期間のうち賃金支払基礎日数が「11日以上」あるものをみなし被保険者期間1箇月として計算する（法61条の4第2項）。",src:"法61条の4第2項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問7",opt:"E",q:"令和8年2月1日に介護休業を開始した被保険者（介護休業給付金に係る休業開始時賃金日額は10,000円とする。）について、同年2月1日から2月28日の期間（当該介護休業を終了した日の属する支給単位期間以外の支給単位期間とする。）において事業主から賃金を受けていない場合、当該支給単位期間に支給されることとなる介護休業給付金の額は、187,600円となる。",a:false,exp:"支給単位期間に賃金が支払われなかった場合の介護休業給付金の額は、「休業開始時賃金日額×支給日数×100分の40（当分の間は100分の67）」である。設問は「終了した日の属する支給単位期間以外の支給単位期間」であるから、支給日数は「30日」で計算し、10,000円×30×100分の67＝「201,000円」が介護休業給付金の額となる（法61条の4第4項1号、法附則12条）。",src:"法61条の4第4項1号",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問8",opt:"A",q:"育児休業の申出をした被保険者について、休業終了予定日とされた日までに労働基準法の規定による産前産後休業期間が始まった場合、当該育児休業の申出に係る子を養育するための新たな休業をする期間が始まったときを除き、当該産前産後休業期間が始まった日以後の休業については、当該申出に係る育児休業給付金の支給を受けることはできない。",a:true,exp:"設問の通り正しい（則101条の22第1項3号ハ）。",src:"則101条の22第1項3号ハ",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問8",opt:"B",q:"育児休業給付金の支給に係るみなし被保険者期間の計算において、被保険者が教育訓練休暇給付金の支給を受けたことがある場合であっても、当該教育訓練休暇給付金に係る休暇開始日前における被保険者であった期間は、みなし被保険者期間に含まれる。",a:true,exp:"設問の通り正しい。育児休業給付金のほか、出生時育児休業給付金、出生後休業支援給付金及び育児時短就業給付金に係るみなし被保険者期間の算定に当たり、教育訓練休暇給付金に係る休暇開始日前における被保険者であった期間は、みなし被保険者期間の算定の対象となる期間に含まれる（法14条2項3号、法61条の7第3項）。",src:"法61条の7第3項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問8",opt:"C",q:"出生時育児休業給付金の額は、原則として、休業開始時賃金日額に支給日数を乗じて得た額の100分の67に相当する額とされている。",a:true,exp:"設問の通り正しい。「支給日数」とは、同一の子について当該被保険者がした出生時育児休業ごとに、当該出生時育児休業を開始した日から終了した日までの日数を合算して得た日数（その日数が28日を超えるときは、28日）をいう（法61条の8第4項）。",src:"法61条の8第4項",cat:"択一式（雇用保険法・TAC社06）"},
{no:"TAC社06-問8",opt:"D",q:"受給資格者が死亡し、その者に支給されるべき失業等給付でまだ支給されていないものがある場合において、その者の死亡の当時その者と生計を同じくしていた遺族として、婚姻の届出をしていないがその者と事実上の婚姻関係にあったX、その者の子Y及びその者の母Zがあるときは、Xは自己の名で、その未支給の失業等給付の支給を請求することができる。",a:true,exp:"設問の通り正しい。未支給の失業等給付の請求権者は、配偶者（婚姻の届出をしていないが、事実上婚姻関係と同様の事情にあった者を含む。）、子、父母、孫、祖父母又は兄弟姉妹であって、その者の死亡の当時その者と生計を同じくしていたものとされており、支給を受けるべき者の順位も、この順序による（法10条の3第1項・2項）。",src:"法10条の3",cat:"択一式（雇用保険法・TAC社06）"},
