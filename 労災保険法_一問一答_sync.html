<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>労災保険法 一問一答 — 社労士試験対策</title>
<script src="https://apis.google.com/js/api.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#11161e;color:#e8e0d0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.app{width:100%;max-width:640px}

/* ===== SYNC BAR ===== */
.sync-bar{display:flex;align-items:center;justify-content:space-between;background:#1a2434;border:1px solid #283848;border-radius:10px;padding:10px 14px;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.sync-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a9bb0}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#556070;flex-shrink:0;transition:background .3s}
.sync-dot.connected{background:#3dbe82}
.sync-dot.syncing{background:#c9a84c;animation:pulse 1s infinite}
.sync-dot.error{background:#e05050}
.sync-user{font-size:11px;color:#556070;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sync-btns{display:flex;gap:6px;align-items:center}
.btn-gsign{display:flex;align-items:center;gap:6px;background:#fff;color:#3c4043;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s;white-space:nowrap}
.btn-gsign:hover{background:#f1f3f4}
.btn-gsign svg{flex-shrink:0}
.btn-sync{background:transparent;border:1px solid #283848;color:#8a9bb0;border-radius:6px;padding:5px 10px;font-size:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-sync:hover{border-color:#4a9eca;color:#4a9eca}
.btn-sync:disabled{opacity:.4;cursor:default}
.btn-signout{background:transparent;border:1px solid #283848;color:#556070;border-radius:6px;padding:5px 8px;font-size:11px;cursor:pointer;transition:all .15s}
.btn-signout:hover{border-color:#e05050;color:#e05050}

/* ===== HEADER ===== */
.header{text-align:center;padding:20px 0 16px}
.header h1{font-size:12px;letter-spacing:.15em;color:#8a9bb0;text-transform:uppercase;margin-bottom:4px}
.header .title{font-size:21px;font-weight:700;color:#e8e0d0}
.header .subtitle{font-size:12px;color:#556070;margin-top:5px}
.nav-tabs{display:flex;gap:4px;background:#131920;border-radius:10px;padding:4px;margin-bottom:18px}
.nav-tab{flex:1;padding:8px;border:none;border-radius:8px;background:transparent;color:#556070;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.nav-tab.active{background:#1a2434;color:#e8e0d0}
.bm-badge{display:inline-block;background:rgba(232,201,122,.2);color:#e8c97a;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px;font-weight:700}

/* ===== PROGRESS ===== */
.progress-wrap{margin-bottom:18px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.progress-num{font-size:12px;color:#8a9bb0}
.progress-score{font-size:12px;color:#8a9bb0}
.progress-bar-bg{width:100%;height:3px;background:#1a2434;border-radius:2px}
.progress-bar-fill{height:3px;background:linear-gradient(90deg,#c97a4a,#e8a87a);border-radius:2px;transition:width .4s ease}

/* ===== QUESTION CARD ===== */
.card{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:22px 20px;margin-bottom:14px;position:relative}
.q-meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.q-tag{font-size:14px;letter-spacing:.1em;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 8px;font-weight:600}
.q-num{font-size:15px;color:#556070}
/* Accuracy badge on card */
.q-acc{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;display:none}
.q-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.q-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.q-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.q-text{font-size:18px;line-height:1.8;color:#d8d0c0;word-break:break-word;white-space:pre-wrap;padding-right:40px}
.btn-bookmark{position:absolute;top:18px;right:14px;background:none;border:none;cursor:pointer;font-size:20px;line-height:1;padding:4px;color:#556070;transition:color .15s,transform .1s}
.btn-bookmark:hover{color:#e8c97a;transform:scale(1.1)}
.btn-bookmark.active{color:#e8c97a}

/* ===== OX BUTTONS ===== */
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.btn-answer{border:none;border-radius:10px;padding:18px 12px;font-size:26px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;display:flex;flex-direction:column;align-items:center;gap:4px}
.btn-answer:active{transform:scale(.96)}
.btn-maru{background:#1c3040;border:1.5px solid #2a4a60;color:#5bb8e0}
.btn-maru:hover{background:#1e3a50;border-color:#5bb8e0}
.btn-batsu{background:#301c1c;border:1.5px solid #50282a;color:#e07060}
.btn-batsu:hover{background:#3a2020;border-color:#e07060}
.btn-label{font-size:10px;letter-spacing:.1em;opacity:.7}
.btn-answer.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-answer.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-answer:disabled{cursor:default}
/* あなたの選択ラベル */
.your-choice-label{font-size:9px;letter-spacing:.08em;opacity:.85;margin-top:2px;font-weight:700}
/* 挑戦回数バッジ */
.q-tries{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;background:rgba(138,155,176,.12);border:1px solid #283848;color:#8a9bb0;display:none}

/* ===== SELECT CHOICES (選択式用) ===== */
.choices-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn-choice{background:#182030;border:1.5px solid #283848;border-radius:8px;padding:12px 10px;font-size:13px;color:#c8c0b0;cursor:pointer;transition:all .15s;text-align:center;line-height:1.5}
.btn-choice:hover{border-color:#c97a4a;background:#1e2a3a}
.btn-choice.correct-chosen{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice.wrong-chosen{background:#331616;border-color:#e05050;color:#e05050}
.btn-choice.reveal-correct{background:#163328;border-color:#3dbe82;color:#3dbe82}
.btn-choice:disabled{cursor:default}
.q-type-badge{font-size:10px;border-radius:4px;padding:2px 7px;font-weight:600;letter-spacing:.05em}
.q-type-badge.ox{background:rgba(91,184,224,.12);border:1px solid rgba(91,184,224,.25);color:#5bb8e0}
.q-type-badge.sel{background:rgba(130,201,122,.12);border:1px solid rgba(130,201,122,.25);color:#82c97a}
.q-blank{background:rgba(201,122,74,.15);border-bottom:2px solid #c97a4a;color:#e8a87a;padding:0 4px;font-weight:700;border-radius:2px}

/* ===== RESULT PANEL ===== */
.result-panel{border-radius:10px;padding:14px 16px;margin-bottom:14px;display:none;animation:fadeUp .2s ease}
.result-panel.correct{background:#0d2a1e;border:1px solid #2a6044}
.result-panel.wrong{background:#2a0d0d;border:1px solid #6a2020}
.result-header{font-size:18px;font-weight:700;margin-bottom:8px}
.result-panel.correct .result-header{color:#3dbe82}
.result-panel.wrong .result-header{color:#e05050}
.result-exp{font-size:17px;line-height:1.7;color:#a0b0c0}
.result-exp b{color:#f0c987;font-weight:700}
.result-source{font-size:15px;color:#556070;margin-top:8px}

/* ===== NAV BUTTONS ===== */
.nav-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.btn-nav{border-radius:9px;padding:11px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:1.5px solid #283848;background:transparent;color:#8a9bb0;white-space:nowrap}
.btn-nav:hover{background:#1a2434;color:#c8c0b0}
.btn-nav:disabled{opacity:.3;cursor:default}
/* ⏸ 中断ボタン */
.btn-suspend{border-color:#4a3a10 !important;color:#e8c97a !important}
.btn-suspend:hover{background:rgba(232,201,122,.1) !important;border-color:#e8c97a !important}
.btn-next{border-radius:9px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s;border:none;background:#c97a4a;color:#1a0800;letter-spacing:.05em;display:none;width:100%;margin-bottom:6px}
.btn-next:hover{background:#e8a87a}

/* ===== START SCREEN ===== */
.start-screen{text-align:center;padding:24px 16px}
.start-count{font-size:44px;font-weight:700;color:#c97a4a;display:block;margin-bottom:4px}
.start-unit{font-size:13px;color:#8a9bb0;margin-bottom:22px;display:block}
.start-desc{font-size:13px;color:#8a9bb0;line-height:1.7;margin-bottom:22px}
.filters{margin-bottom:22px}
.filter-label{font-size:12px;color:#8a9bb0;margin-bottom:8px}
.filter-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.btn-filter{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:18px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-filter.active{border-color:#c97a4a;background:rgba(201,122,74,.12);color:#c97a4a}
.btn-filter:hover{border-color:#4a9eca;color:#4a9eca}
.random-mode{margin-bottom:18px}
.random-input-wrap{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px}
.random-input{background:#1a2434;border:1.5px solid #283848;border-radius:6px;color:#e8e0d0;padding:8px 10px;font-size:14px;width:60px;text-align:center}
.random-input:focus{outline:none;border-color:#c97a4a}
.random-label{font-size:13px;color:#8a9bb0}
.start-btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn-start{border:1.5px solid #c97a4a;background:transparent;color:#c97a4a;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-start:hover{background:rgba(201,122,74,.12)}
.btn-start.primary{background:#c97a4a;color:#1a0800}
.btn-start.primary:hover{background:#e8a87a}
.btn-shuffle{border:1.5px solid #8a9bb0;background:transparent;color:#8a9bb0;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-shuffle:hover{background:rgba(138,155,176,.1)}

/* ===== RESULT SCREEN ===== */
.result-screen{text-align:center;padding:36px 16px}
.result-title{font-size:24px;font-weight:700;color:#e8e0d0;margin-bottom:16px}
.result-score{font-size:36px;font-weight:700;color:#c97a4a;margin-bottom:8px}
.score-msg{font-size:13px;color:#8a9bb0;margin-bottom:22px;line-height:1.7;white-space:pre-line}
.breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.breakdown-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px;text-align:center}
.breakdown-num{font-size:26px;font-weight:700}
.breakdown-num.ok{color:#3dbe82}
.breakdown-num.ng{color:#e05050}
.breakdown-num.sk{color:#8a9bb0}
.breakdown-label{font-size:11px;color:#8a9bb0;margin-top:3px}
.btns-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.btn-retry{background:transparent;border:1.5px solid #c97a4a;color:#c97a4a;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-retry:hover{background:rgba(201,122,74,.12)}

/* ===== BOOKMARK LIST ===== */
.bookmark-list{display:none}
.bookmark-list.show{display:block}
.section-title{font-size:12px;color:#556070;letter-spacing:.1em;margin-bottom:12px;text-align:center;text-transform:uppercase}
.bm-item{background:#1a2434;border:1px solid #283848;border-radius:10px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s}
.bm-item:hover{border-color:#c97a4a}
.bm-star{font-size:14px;color:#e8c97a;flex-shrink:0}
.bm-tag{font-size:10px;color:#c97a4a;background:rgba(201,122,74,.12);border:1px solid rgba(201,122,74,.25);border-radius:4px;padding:2px 6px;white-space:nowrap;flex-shrink:0;font-weight:600}
.bm-acc{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:1px}
.bm-acc.low{background:rgba(224,80,80,.12);border:1px solid rgba(224,80,80,.3);color:#e05050}
.bm-acc.mid{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:#c9a84c}
.bm-acc.high{background:rgba(61,190,130,.12);border:1px solid rgba(61,190,130,.3);color:#3dbe82}
.bm-text{font-size:13px;line-height:1.55;color:#a0b0c0;flex:1;min-width:0}
.empty-bm{text-align:center;padding:36px 20px;color:#556070;font-size:14px;line-height:1.7}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a2434;border:1px solid #283848;border-radius:8px;padding:10px 18px;font-size:13px;color:#e8e0d0;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:#3dbe82;color:#3dbe82}
.toast.error{border-color:#e05050;color:#e05050}
.toast.warn{border-color:#c9a84c;color:#c9a84c}

/* ===== RESUME MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:999}
.modal{background:#1a2434;border:1px solid #283848;border-radius:12px;padding:24px;max-width:400px;width:90vw}
.modal-title{font-size:16px;font-weight:700;color:#e8e0d0;margin-bottom:12px}
.modal-desc{font-size:14px;color:#a0b0c0;line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end}
.btn-modal{border:1.5px solid #283848;background:transparent;color:#8a9bb0;border-radius:8px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-modal.primary{border-color:#c97a4a;color:#c97a4a}
.btn-modal:hover{background:rgba(138,155,176,.1)}
.btn-modal.primary:hover{background:rgba(201,122,74,.12)}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{display:none}
.screen.show{display:block;animation:fadeUp .3s ease}
</style>
</head>
<body>
<div class="app">

<!-- ===== GOOGLE DRIVE SYNC BAR ===== -->
<div class="sync-bar">
  <div class="sync-status">
    <div id="syncDot" class="sync-dot"></div>
    <span id="syncStatusText">Googleアカウントで同期</span>
    <div id="syncUser" class="sync-user"></div>
  </div>
  <div class="sync-btns">
    <button id="btnSignIn" class="btn-gsign" onclick="signIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Googleでログイン
    </button>
    <button id="btnManualSync" class="btn-sync" onclick="manualSync()">↑↓ 同期</button>
    <button id="btnSignOut" class="btn-signout" onclick="signOut()">ログアウト</button>
  </div>
</div>

<!-- ===== HEADER ===== -->
<div class="header">
  <h1>社労士試験対策</h1>
  <div id="appTitle" class="title">雇用保険法 一問一答</div>
  <div id="appSubtitle" class="subtitle">TAC・LEC 択一式145問 ＋ 選択式30問　計175問</div>
</div>

<!-- ===== NAV TABS ===== -->
<div class="nav-tabs">
  <button id="tabMain"  class="nav-tab active" onclick="showMain()">学習</button>
  <button id="tabBookmarks" class="nav-tab" onclick="showBookmarks()">栞<span id="bmBadge" class="bm-badge" style="display:none">0</span></button>
</div>

<!-- ===== MAIN SCREEN ===== -->
<div id="screenMain" class="screen show">

<!-- ===== PROGRESS BAR ===== -->
<div id="progressWrap" class="progress-wrap" style="display:none">
  <div class="progress-info">
    <div id="progressNum" class="progress-num">0 / 0</div>
    <div id="progressScore" class="progress-score">正解: 0問</div>
  </div>
  <div class="progress-bar-bg">
    <div id="progressFill" class="progress-bar-fill" style="width:0%"></div>
  </div>
</div>

<!-- ===== START SCREEN ===== -->
<div id="startScreen" class="start-screen">
  <span id="startCount" class="start-count">175</span>
  <span class="start-unit">問</span>
  <div class="start-desc">労災保険法の知識を一問一答で確認しよう。<br>TAC＋LEC公開模試 第1回。択一式145問・選択式30問（計175問）を収録。</div>
  
  <!-- フィルター -->
  <div class="filters">
    <div class="filter-label">出題範囲</div>
    <div id="filterBtns" class="filter-btns">
      <button class="btn-filter active" data-cat="all">すべて</button>
    </div>
  </div>

  <!-- ランダム出題モード -->
  <div class="random-mode">
    <div class="random-input-wrap">
      <input id="randomInput" class="random-input" type="number" value="10" min="1" max="175" oninput="updateRandomBtn()">
      <span class="random-label">問をランダムで出題</span>
    </div>
    <button id="btnRandomStart" class="btn-start" onclick="startRandom()">10問ランダムで出題</button>
  </div>

  <!-- 栞ランダム出題モード -->
  <div id="bookmarkRandomMode" class="random-mode" style="display:none">
    <div class="random-input-wrap">
      <input id="bookmarkRandomInput" class="random-input" type="number" value="10" min="1" max="175" oninput="updateBookmarkRandomBtn()">
      <span class="random-label">問を栞からランダムで出題</span>
    </div>
    <button id="btnBookmarkRandomStart" class="btn-start" onclick="startBookmarkRandom()">栞から10問ランダムで出題</button>
  </div>

  <!-- ボタン群 -->
  <div class="start-btns">
    <button class="btn-shuffle" onclick="shuffle()">🔀 シャッフル</button>
    <button id="btnResumeStart" class="btn-start" onclick="resumeSession()" style="display:none">▶ 続きから開始</button>
    <button id="btnWeakStart" class="btn-start" onclick="startWeak()" style="display:none">正答率50%以下の問題を出題</button>
    <button id="btnLeastTried" class="btn-start" onclick="startLeastTried()" style="display:none">挑戦回数が少ない問題を出題</button>
    <button class="btn-start primary" onclick="start()">学習スタート</button>
    <button id="btnBookmarkStart" class="btn-start" onclick="startBookmarks()" style="display:none">栞の問題のみ</button>
  </div>
</div>

<!-- ===== QUESTION SCREEN ===== -->
<div id="questionScreen" class="screen">
  <div class="card">
    <div class="q-meta">
      <span id="qTag" class="q-tag">択一式（雇用保険法）</span>
      <span id="qTypeBadge" class="q-type-badge"></span>
      <span id="qNum" class="q-num"></span>
      <span id="qAcc" class="q-acc"></span>
      <span id="qTries" class="q-tries"></span>
    </div>
    <div id="qText" class="q-text"></div>
    <button id="btnBookmark" class="btn-bookmark" onclick="toggleBookmark()">☆</button>
  </div>

  <!-- ○× ボタン -->
  <div id="oxRow" class="btn-row">
    <button id="btnMaru" class="btn-answer btn-maru" onclick="answerOx(true)">
      <div>○</div><div class="btn-label">正しい</div>

const ALL_QUESTIONS = [
{no:"問1",opt:"A",q:"次の(1)、(2)又は(3)の業務による明らかな過重負荷を受けたことにより発症した脳血管疾患及び虚血性心疾患等（負傷に起因するものを除く。以下「脳・心臓疾患」という。）は、業務に起因する疾病として取り扱う。(1)発症前の長期間にわたって、著しい疲労の蓄積をもたらす特に過重な業務（以下「長期間の過重業務」という。）に就労したこと。(2)発症に近接した時期において、特に過重な業務（以下「短期間の過重業務」という。）に就労したこと。(3)発症直前から前日までの間において、発生状態を時間的及び場所的に明確にし得る異常な出来事に遭遇したこと。",a:true,exp:"設問の通り正しい。なお、認定基準の対象となる疾病は、脳血管疾患（脳内出血（脳出血）・くも膜下出血・脳梗塞・高血圧性脳症）と虚血性心疾患（心筋梗塞・狭心症・心停止（心臓性突然死を含む。）・重篤な心不全・大動脈解離）であり、認定要件の判断に当たっては、まず疾患名を特定し、対象疾病に該当することを確認することとされている。",src:"令和3.9.14基発0914第1号／最終改正令和5.10.18基発1018第1号",cat:"択一式（労災保険法）"},,
{no:"問1",opt:"B",q:"長期間の過重業務に係る「発症前の長期間」とは、発症前おおむね6か月間をいい、発症前おおむね6か月より前の業務については、疲労の蓄積に係る業務の過重性を評価するに当たり考慮しない。",a:false,exp:"「考慮しない」とする記述が誤りである。長期間の過重業務に係る「発症前の長期間」とは、発症前おおむね6か月間をいい、発症前おおむね6か月より前の業務については、疲労の蓄積に係る業務の過重性を評価するに当たり、付加的要因として考慮する。なお、著しい疲労の蓄積をもたらす特に過重な業務に就労したと認められるか否かについては、業務量、業務内容、作業環境等を考慮し、同種労働者にとっても、特に過重な身体的、精神的負荷と認められる業務であるか否かという観点から、客観的かつ総合的に判断することとされている。",src:"令和3.9.14基発0914第1号／最終改正令和5.10.18基発1018第1号",cat:"択一式（労災保険法）"},,
{no:"問1",opt:"C",q:"長期間の過重業務に係る業務の過重性の具体的な評価に当たっては、疲労の蓄積をもたらす最も重要な要因と考えられる労働時間に着目すると、その時間が長いほど、業務の過重性が増すところであり、具体的には、発症日を起点とした1か月単位の連続した期間をみて、発症前1か月間におおむね100時間又は発症前2か月間ないし6か月間にわたって、1か月当たりおおむね80時間を超える時間外労働が認められる場合は、業務と発症との関連性が強いと評価できることを踏まえて判断する。",a:true,exp:"設問の通り正しい。なお、発症日を起点とした1か月単位の連続した期間をみて、発症前1か月間ないし6か月間にわたって、1か月当たりおおむね45時間を超える時間外労働が認められない場合は、業務と発症との関連性が弱いが、おおむね45時間を超えて時間外労働時間が長くなるほど、業務と発症との関連性が徐々に強まると評価できることを踏まえて判断することとされている。",src:"令和3.9.14基発0914第1号／最終改正令和5.10.18基発1018第1号",cat:"択一式（労災保険法）"},,
{no:"問1",opt:"D",q:"発症に近接した時期とは、発症前おおむね1週間をいい、発症前おおむね1週間より前の業務については、原則として長期間の負荷として評価するが、発症前1か月間より短い期間のみに過重な業務が集中し、それより前の業務の過重性が低いために、長期間の過重業務とは認められないような場合には、発症前1週間を含めた当該期間に就労した業務の過重性を評価し、それが特に過重な業務と認められるときは、短期間の過重業務に就労したものと判断する。",a:true,exp:"設問の通り正しい。なお、短期間の過重業務と発症との関連性を時間的にみた場合、業務による過重な負荷は、発症に近ければ近いほど影響が強いと考えられることから、発症に最も密接な関連性を有する業務は、発症直前から前日までの間の業務であるので、まず、この間の業務が特に過重であるか否かを判断する。",src:"令和3.9.14基発0914第1号／最終改正令和5.10.18基発1018第1号",cat:"択一式（労災保険法）"},,
{no:"問1",opt:"E",q:"複数業務要因災害による脳・心臓疾患の「長期間の過重業務」及び「短期間の過重業務」の判断について、業務の過重性の検討に当たっては、異なる事業における労働時間を通算して評価する。また、労働時間以外の負荷要因については、異なる事業における負荷を合わせて評価する。",a:true,exp:"設問の通り正しい。なお、認定基準では、複数業務要因災害による脳・心臓疾患の「異常な出来事」に関し、これが認められる場合には、一の事業における業務災害に該当すると考えられることから、一般的には、異なる事業における負荷を合わせて評価することはないものと考えられる、としている。",src:"令和3.9.14基発0914第1号／最終改正令和5.10.18基発1018第1号",cat:"択一式（労災保険法）"},,
{no:"問2",opt:"A",q:"休業補償給付の額の算定の基礎として用いる休業給付基礎日額については、原則として、四半期ごとの平均給与額が、その休業を開始した日の属する四半期の平均給与額の100分の110を超え、又は100分の90を下るに至った場合には、その上昇し、又は低下した比率を基準として厚生労働大臣が定める率（いわゆるスライド率）を労災保険法第8条の規定により給付基礎日額として算定した額に乗じて得た額とする。",a:false,exp:"「その休業を開始した日」を「算定事由発生日」と読み替えると、正しい記述となる。なお、改定された休業給付基礎日額は、その上昇し、又は低下するに至った四半期の翌々四半期に属する最初の日以後に支給すべき事由が生じた休業補償給付から適用される。",src:"法8条の2,1項2号",cat:"択一式（労災保険法）"},,
{no:"問2",opt:"B",q:"算定事由発生日の属する年度の翌年度の7月以前の分として支給する年金たる保険給付については、労災保険法第8条の規定により給付基礎日額として算定した額を年金給付基礎日額とし、算定事由発生日の属する年度の翌年度の8月以後は、当該給付基礎日額についてスライド率による改定が行われる。",a:false,exp:"算定事由発生日の属する年度の「翌々年度」の7月以前の分として支給する年金たる保険給付については、労災保険法第8条の規定により給付基礎日額として算定した額を年金給付基礎日額とし、算定事由発生日の属する年度の「翌々年度」の8月以後は、当該給付基礎日額についてスライド率による改定が行われる。なお、年金給付基礎日額に係るスライド率は、「年金たる保険給付を支給すべき月の属する年度の前年度（当該月が4月から7月までの月に該当する場合にあっては、前々年度）の平均給与額を算定事由発生日の属する年度の平均給与額で除して得た率を基準として厚生労働大臣が定める率」である。",src:"法8条の3,1項2号",cat:"択一式（労災保険法）"},,
{no:"問2",opt:"C",q:"複数事業労働者の給付基礎日額は、複数事業労働者を使用する事業ごとに算定した給付基礎日額に相当する額を合算した額とされているが、その算定に当たり、当該事業ごとに算定した給付基礎日額に相当する額が自動変更対象額に満たないときは、これを自動変更対象額として算定することとなる。",a:false,exp:"複数事業労働者の給付基礎日額の算定に当たり、事業ごとに算定した給付基礎日額に相当する額には、自動変更対象額の規定は適用されず、事業ごとに算定した給付基礎日額に相当する額を合算した額（＝給付基礎日額）について、自動変更対象額の規定が適用される。",src:"法8条3項、則9条の2の2,1号、2号",cat:"択一式（労災保険法）"},,
{no:"問2",opt:"D",q:"休業給付基礎日額又は年金給付基礎日額について、年齢階層別の最低・最高限度額の規定が適用され、かつ、スライド率による改定が行われるべき場合には、スライド率による改定後の給付基礎日額について年齢階層別の最低・最高限度額の規定が適用される。",a:true,exp:"設問の通り正しい。",src:"法8条の2,2項、8条の3,2項",cat:"択一式（労災保険法）"},,
{no:"問2",opt:"E",q:"障害補償一時金等の一時金の額の算定の基礎として用いる給付基礎日額については、年齢階層別の最低・最高限度額の規定の適用はなく、スライド率による改定も行われない。",a:false,exp:"一時金の額の算定の基礎として用いる給付基礎日額については、年齢階層別の最低・最高限度額の規定の適用はないが、年金給付基礎日額と同様の仕組みにより、スライド率による改定は行われる。",src:"法8条の4",cat:"択一式（労災保険法）"},,
{no:"問3",opt:"A",q:"療養の給付の範囲は、①診察、②薬剤又は治療材料の支給、③処置、手術その他の治療、④居宅における療養上の管理及びその療養に伴う世話その他の看護、⑤病院又は診療所への入院及びその療養に伴う世話その他の看護及び⑥移送のうち、医師が必要と認めるものに限られる。",a:false,exp:"「医師」とする記述が誤りである。療養の給付の範囲は、①診察、②薬剤又は治療材料の支給、③処置、手術その他の治療、④居宅における療養上の管理及びその療養に伴う世話その他の看護、⑤病院又は診療所への入院及びその療養に伴う世話その他の看護及び⑥移送のうち、「政府」が必要と認めるものに限られる。",src:"法13条2項",cat:"択一式（労災保険法）"},,
{no:"問3",opt:"B",q:"療養の給付に代えて療養の費用を支給することができるのは、療養の給付をすることが困難な場合のほか、療養の給付を受けないことについて労働者に相当の理由がある場合に限られる。",a:true,exp:"設問の通り正しい。なお、「療養の給付をすることが困難な場合、療養の給付を受けないことについて労働者に相当の理由がある場合」とする文言は、正確に押さえておこう。",src:"法13条3項、則11条の2",cat:"択一式（労災保険法）"},,
{no:"問3",opt:"C",q:"療養の給付は、社会復帰促進等事業として設置された病院若しくは診療所又は都道府県労働局長の指定する病院若しくは診療所、薬局若しくは訪問看護事業者において行われる。",a:true,exp:"設問の通り正しい。設問の病院等を「指定病院等」という。なお、二次健康診断等給付は、健診給付病院等（社会復帰促進等事業として設置された病院若しくは診療所又は都道府県労働局長の指定する病院若しくは診療所）において行われるが、「指定病院等」と「健診給付病院等」は必ずしも一致しない（例えば、指定病院等であるからといって、健診給付病院等であるとは限らない。）。",src:"則11条1項",cat:"択一式（労災保険法）"},,
{no:"問3",opt:"D",q:"療養補償給付たる療養の費用の請求に当たっては、請求書の記載事項のうち、「傷病名及び療養の内容」及び「療養に要した費用の額」について、診療担当者の証明を受けなければならない。",a:true,exp:"設問の通り正しい。なお、診療担当者とは、医師その他の診療、薬剤の支給、手当又は訪問看護を担当した者をいう。",src:"則12条の2,2項",cat:"択一式（労災保険法）"},,
{no:"問3",opt:"E",q:"療養補償給付たる療養の費用の支給を受けようとする者は、所定の事項を記載した請求書を、所轄労働基準監督署長に提出しなければならないが、都道府県労働局長が定める指名施術所において治療を受ける場合にあっては、当該請求書を、当該指名施術所を経由して所轄労働基準監督署長に提出することができる。",a:true,exp:"設問の通り正しい。指名施術所において治療を受ける場合の請求書の提出について、「指名施術所を経由すること」は任意であり、義務ではないことに注意。なお、指名施術所とは、施術所（あん摩マッサージ指圧師、はり師、きゅう師等に関する法律に規定する届出に係る施術所及び柔道整復師法に規定する施術所をいう。）のうち都道府県労働局長が定めるものをいう。",src:"則12条の2,1項",cat:"択一式（労災保険法）"},,
{no:"問4",opt:"A",q:"傷病補償年金の傷病等級に係る障害の程度は、傷病等級の第1級、第2級及び第3級とされており、3か月以上の期間にわたって存する障害の状態により認定する。",a:false,exp:"傷病補償年金の傷病等級に係る障害の程度は、傷病等級の第1級、第2級及び第3級とされており、「6か月以上」の期間にわたって存する障害の状態により認定する。",src:"法12条の8,3項2号、則18条、則別表第2",cat:"択一式（労災保険法）"},,
{no:"問4",opt:"B",q:"傷病補償年金を受ける労働者の当該障害の程度に変更があったため、新たに他の傷病等級に該当するに至った場合において、当該受給権者の請求があったときは、所轄労働基準監督署長は、当該変更に関する決定をしなければならない。",a:false,exp:"「当該受給権者の請求があったときは」とする記述が誤りである。傷病補償年金を受ける労働者の当該障害の程度に変更があったため、新たに他の傷病等級に該当するに至った場合には、政府は、新たに該当するに至った傷病等級に応ずる傷病補償年金を支給するものとし、その後は、従前の傷病補償年金は支給しないこととされており、この場合には、所轄労働基準監督署長は、当該労働者について傷病等級の変更による傷病補償年金の変更に関する決定をしなければならない。傷病補償年金の支給決定及び傷病等級の変更は、所轄労働基準監督署長の職権で行われるので、受給権者の請求は必要ない。",src:"法18条の2、則18条の3",cat:"択一式（労災保険法）"},,
{no:"問4",opt:"C",q:"傷病補償年金を受けている者が傷病等級に該当しなくなった場合には、傷病補償年金の受給権は消滅するが、なおも療養のために労働することができず賃金の支払を受けることができないときは、その者の請求により、当該受給権が消滅した月の翌月から休業補償給付が行われる。",a:true,exp:"設問の通り正しい。「傷病補償年金を受ける者には、休業補償給付は行わない」こととされているが、傷病補償年金の受給権消滅後に引き続き休業補償給付の要件を満たす場合には、その者の請求により、傷病補償年金の受給権が消滅した月の翌月から休業補償給付が行われることとなる（傷病補償年金は、「受給権を取得した月の翌月から当該受給権が消滅した月まで」支給される。したがって、傷病補償年金の受給権消滅後に引き続き休業補償給付の要件を満たす場合、休業補償給付が行われるのは傷病補償年金の受給権が消滅した月の翌月（の初日）からとなる。また、休業補償給付が行われている者が傷病補償年金の受給権を取得した場合、休業補償給付は傷病補償年金の受給権を取得した月の末日まで行われ、その取得した月の翌月から傷病補償年金が行われることとなる。）。",src:"法9条1項、12条の8,3項、18条2項、昭和52.3.30基発192号",cat:"択一式（労災保険法）"},,
{no:"問4",opt:"D",q:"介護補償給付は、障害補償年金又は傷病補償年金を受ける権利を有する労働者が、その受ける権利を有する障害補償年金又は傷病補償年金の支給事由となる障害であって厚生労働省令で定める程度のものにより、常時又は随時介護を要する状態にある場合には、常時又は随時介護を受けていないときであっても、支給される場合がある。",a:false,exp:"介護補償給付は、常時又は随時介護を受けていないときは、支給されない。介護補償給付は、障害補償年金又は傷病補償年金を受ける権利を有する労働者が、その受ける権利を有する障害補償年金又は傷病補償年金の支給事由となる障害であって厚生労働省令で定める程度のものにより、常時又は随時介護を要する状態にあり、かつ、常時又は随時介護を受けているときに、当該介護を受けている間（次の①〜③に掲げる間を除く。）、当該労働者に対し、その請求に基づいて行われる。①障害者支援施設に入所している間（生活介護を受けている場合に限る。）②障害者支援施設（生活介護を行うものに限る。）に準ずる施設として厚生労働大臣が定めるものに入所している間 ③病院又は診療所に入院している間",src:"法32条の4,1項、派遣法44条2項、平成9.3.25基発195号",cat:"択一式（労災保険法）"},,
{no:"問4",opt:"E",q:"介護補償給付を支給すべき事由が生じた月において介護に要する費用を支出した日がなく、親族又はこれに準ずる者による介護を受けた日があるときは、当該月について、介護補償給付として厚生労働省令で定める最低保障額が支給される。",a:false,exp:"介護補償給付を支給すべき事由が生じた月において介護に要する費用を支出した日がないときは、親族又はこれに準ずる者による介護を受けたときであっても、介護補償給付は支給されない。",src:"法19条の2、則18条の3の4,1項2号",cat:"択一式（労災保険法）"},,
{no:"問5",opt:"A",q:"同一の業務災害により障害等級表に該当する障害が2以上あって厚生労働省令で定める要件を満たす場合には、その障害等級は、厚生労働省令で定めるところに従い繰り上げた障害等級による。繰り上げた障害等級の具体例を挙げれば、次のとおりである。①第8級、第10級、第12級の3障害がある場合……第7級 ②第5級、第6級、第8級、第14級の4障害がある場合…第3級 ③第4級、第5級の2障害がある場合……第1級",a:true,exp:"設問の通り正しい。設問の①は、第13級以上の障害が2以上ある場合なので、重い方の障害等級（第8級）を1級繰上げ、第7級となる。設問の②は、第8級以上の障害が2以上ある場合なので、重い方の障害等級（第5級）を2級繰上げ、第3級となる。設問の③は、第5級以上の障害が2以上ある場合なので、重い方の障害等級（第4級）を3級繰上げ、第1級となる。",src:"法15条1項、則14条3項",cat:"択一式（労災保険法）"},,
{no:"問5",opt:"B",q:"既に障害等級第8級の障害のあった者が、業務上の負傷又は疾病により同一の部位について障害の程度を障害等級第5級に加重した場合における当該事由に係る障害補償給付は、障害等級第5級に応ずる障害補償年金とされ、その額は、障害等級第5級に応ずる障害補償年金の額から、既にあった障害等級第8級に応ずる障害補償一時金の額を25で除して得た額を差し引いた額となる。",a:true,exp:"設問の通り正しい。障害等級の加重に関する問題である。加重の場合、障害補償給付の額は、加重の前後がともに年金である場合又はともに一時金である場合には、加重後の障害等級に応ずる障害補償給付の額から、加重前の障害等級に応ずる障害補償給付の額を差し引いた額となる。また、設問の場合のように、加重前が一時金・加重後が年金である場合には、加重後の障害等級に応ずる障害補償年金の額から、加重前の障害等級に応ずる障害補償一時金の額を25で除して得た額を差し引いた額となる。",src:"法15条1項、則14条5項",cat:"択一式（労災保険法）"},,
{no:"問5",opt:"C",q:"障害等級第12級に応ずる障害補償一時金を受けた労働者の当該障害の程度が自然的経過により変更したため、新たに障害等級第10級に該当するに至った場合であっても、新たに該当するに至った障害等級第10級に応ずる障害補償一時金は支給されず、また、障害等級第10級と障害等級第12級との差額が支給されることもない。",a:true,exp:"設問の通り正しい。障害補償一時金の支給を受けた者の障害の程度が自然的経過により増悪又は軽減しても、新たな障害等級による障害補償給付が行われることはなく、差額の支給も行われない。なお、障害補償年金を受ける労働者の当該障害の程度に変更があったため、新たに他の障害等級に該当するに至った場合には、政府は、新たに該当するに至った障害等級に応ずる障害補償年金又は障害補償一時金を支給するものとし、その後は、従前の障害補償年金は支給しないこととされている。",src:"法15条の2",cat:"択一式（労災保険法）"},,
{no:"問5",opt:"D",q:"障害補償年金前払一時金の請求は、同一の事由に関し、1回に限り行うことができる。",a:true,exp:"設問の通り正しい。なお、障害補償年金前払一時金の請求は、障害補償年金の請求と同時に行わなければならないとされているが、障害補償年金の支給の決定の通知のあった日の翌日から起算して1年を経過する日までの間は、当該障害補償年金を請求した後においても障害補償年金前払一時金を請求することができる。また、障害補償年金前払一時金は、その請求が障害補償年金の支給の決定の通知のあった日の翌日から起算して1年を経過する日までの間に行われる場合（障害補償年金の請求と同時に行わない場合）は、1月、3月、5月、7月、9月又は11月のうち当該障害補償年金前払一時金の請求が行われた月後の最初の月に支給される。",src:"則附則27項",cat:"択一式（労災保険法）"},,
{no:"問5",opt:"E",q:"障害補償年金差額一時金を受けることができる遺族として、障害補償年金の受給権者である労働者の死亡の当時、生計を同じくしていなかった妻と生計を同じくしていた妹がある場合、妻が障害補償年金差額一時金の受給権者となる。",a:false,exp:"設問の場合、「妹」が障害補償年金差額一時金の受給権者となる。障害補償年金差額一時金を受けることができる遺族は、次の①②に掲げる者とされ、この場合において、障害補償年金差額一時金を受けるべき遺族の順位は、次の①②の順序により、①②に掲げる者のうちにあっては、それぞれ、①②に掲げる順序によるものとされている。①労働者の死亡の当時その者と生計を同じくしていた配偶者、子、父母、孫、祖父母及び兄弟姉妹 ②上記①に該当しない配偶者、子、父母、孫、祖父母及び兄弟姉妹",src:"法附則58条2項",cat:"択一式（労災保険法）"},,
{no:"問6",opt:"A",q:"休業特別支給金の額は、1日につき算定基礎日額の100分の20に相当する額である。",a:false,exp:"休業特別支給金の額は、1日につき「休業給付基礎日額」の100分の20に相当する額である。なお、休業特別支給金の支給を受けようとする者は、当該休業特別支給金の支給の申請の際に、所轄労働基準監督署長に、特別給与の総額を記載した届書を提出しなければならない。",src:"法29条2項、支給金則3条1項",cat:"択一式（労災保険法）"},,
{no:"問6",opt:"B",q:"算定基礎年額は、原則として、負傷又は発病の日以前6か月間（雇入後6か月に満たない者については、雇入後の期間）に当該労働者に対して支払われた特別給与の総額である。",a:false,exp:"算定基礎年額は、原則として、負傷又は発病の日以前「1年」間（雇入後「1年」に満たない者については、雇入後の期間）に当該労働者に対して支払われた特別給与の総額である。なお、特別給与の総額が、当該労働者に係る給付基礎日額に365を乗じて得た額の100分の20に相当する額を超える場合には、当該100分の20に相当する額を算定基礎年額とすることとされている。また、上記により算定された額が150万円を超える場合には、150万円を算定基礎年額とする。",src:"法29条2項、支給金則6条1項",cat:"択一式（労災保険法）"},,
{no:"問6",opt:"C",q:"特別加入者には、特別支給金は支給されない。",a:false,exp:"特別加入者（中小事業主等、一人親方等及び海外派遣者）については、特別給与を算定基礎とする特別支給金の規定は適用されない（支給されない）が、定額・定率の特別支給金の規定は適用される（支給される）。",src:"法29条2項、支給金則16条1項、17条1項、18条1項、19条",cat:"択一式（労災保険法）"},,
{no:"問6",opt:"D",q:"遺族特別年金前払一時金が支給される場合には、遺族特別年金は、各月に支給されるべき額の合計額が厚生労働省令で定める算定方法に従い当該遺族特別年金前払一時金の額に達するまでの間、その支給が停止される。",a:false,exp:"遺族特別年金前払一時金という特別支給金はない。特別支給金には前払制度がないので、例えば、遺族補償年金前払一時金の支給を受けた場合には、遺族補償年金は、一定の期間その支給が停止されるが、この場合であっても、遺族特別年金は支給停止されない。",src:"法29条2項、特支則9条他",cat:"択一式（労災保険法）"},,
{no:"問6",opt:"E",q:"特別支給金の原因である事故が第三者の行為によって生じた場合、特別支給金を受けるべき者が当該第三者から同一の事故について損害賠償を受けたときであっても、特別支給金はその全額が支給される。",a:true,exp:"設問の通り正しい。特別支給金については、保険給付と異なり、第三者行為災害における損害賠償との調整（求償及び控除）は行われない。",src:"法29条2項、特支則20条他",cat:"択一式（労災保険法）"},,
{no:"問7",opt:"A",q:"労災保険法に基づく保険給付を受ける権利を有する者が死亡した場合において、その死亡した者に支給すべき保険給付でまだその者に支給しなかったものがあるときは、その者の配偶者（婚姻の届出をしていないが、事実上婚姻関係と同様の事情にあった者を含む。以下同じ。）、子、父母、孫、祖父母又は兄弟姉妹であって、その者の死亡の当時その者と生計を同じくしていたもの（遺族補償年金については当該遺族補償年金を受けることができる他の遺族、複数事業労働者遺族年金については当該複数事業労働者遺族年金を受けることができる他の遺族、遺族年金については当該遺族年金を受けることができる他の遺族）は、自己の名で、その未支給の保険給付の支給を請求することができる。",a:true,exp:"設問の通り正しい。未支給の遺族（補償）等年金については、当該遺族（補償）等年金を受けることができる他の遺族が請求権者となることに注意。",src:"法11条1項",cat:"択一式（労災保険法）"},,
{no:"問7",opt:"B",q:"傷病補償年金を受ける権利を有する者が死亡したためその支給を受ける権利が消滅したにもかかわらず、その死亡の日の属する月の翌月以後の分として当該傷病補償年金の過誤払が行われた場合において、当該過誤払による返還金に係る債権に係る債務の弁済をすべき者に支払うべき障害補償年金があるときは、当該障害補償年金の支払金の金額を当該過誤払による返還金債権の金額に充当することができる。",a:false,exp:"設問の充当処理の対象となる保険給付は、年金たる保険給付の受給権者の死亡に伴い支給される保険給付であり、障害補償年金はその対象とならない。",src:"法12条の2、則10条の2",cat:"択一式（労災保険法）"},,
{no:"問7",opt:"C",q:"保険給付を受ける権利は、労働者の退職によって変更されることはない。",a:true,exp:"設問の通り正しい。",src:"法12条の5,1項",cat:"択一式（労災保険法）"},,
{no:"問7",opt:"D",q:"保険給付を受ける権利は、譲り渡し、担保に供し、又は差し押さえることができない。",a:true,exp:"設問の通り正しい。なお、租税その他の公課は、保険給付として支給を受けた金品を標準として課することはできない。",src:"法12条の5,2項",cat:"択一式（労災保険法）"},,
{no:"問7",opt:"E",q:"労災保険に係る保険関係が成立し、若しくは成立していた事業の事業主又は労働保険事務組合若しくは労働保険事務組合であった団体は、労災保険に関する書類（労働保険徴収法又は同法施行規則による書類を除く。）を、その完結の日から3年間保存しなければならない。",a:true,exp:"設問の通り正しい。",src:"則51条",cat:"択一式（労災保険法）"},,
{no:"第2-問1",opt:"A",q:"次の(1)、(2)及び(3)のいずれの要件も満たす対象疾病は、労働基準法施行規則別表第1の2第9号に該当する業務上の疾病として取り扱う。(1)対象疾病を発病していること。(2)対象疾病の発病前おおむね6か月の間に、業務による強い心理的負荷が認められること。(3)業務以外の心理的負荷及び個体側要因により対象疾病を発病したとは認められないこと。",a:true,exp:"設問の通り正しい。なお、対象疾病とは、疾病及び関連保健問題の国際統計分類第10回改訂版（ICD-10）第V章「精神及び行動の障害」に分類される精神障害であって、器質性のもの及び有害物質に起因するものを除くものである。",src:"令和5.9.1基発0901第2号",cat:"択一式（労災保険法）"},,
{no:"第2-問1",opt:"B",q:"発病の時期を判断する際、強い心理的負荷と認められる出来事の前と後の両方に発病の兆候と理解し得る言動があるものの、診断基準を満たした時期の特定が困難な場合には、出来事の後に発病したものと取り扱う。",a:true,exp:"設問の通り正しい。なお、生死にかかわるケガ、強姦等の特に強い心理的負荷となる出来事を体験した場合、出来事の直後に解離等の心理的反応が生じ、受診時期が遅れることがある。このような場合には、当該心理的反応が生じた時期（特に強い心理的負荷となる出来事の直後）を発病時期と判断して当該出来事を評価の対象とする。",src:"令和5.9.1基発0901第2号",cat:"択一式（労災保険法）"},,
{no:"第2-問1",opt:"C",q:"心理的負荷の評価に当たっては、精神障害を発病した労働者が、その出来事及び出来事後の状況を主観的にどう受け止めたかによって評価するのではなく、同じ事態に遭遇した場合、同種の労働者が一般的にその出来事及び出来事後の状況をどう受け止めるかという観点から評価する。",a:true,exp:"設問の通り正しい。なお、「同種の労働者」は、精神障害を発病した労働者と職種、職場における立場や職責、年齢、経験等が類似する者をいう。",src:"令和5.9.1基発0901第2号",cat:"択一式（労災保険法）"},,
{no:"第2-問1",opt:"D",q:"ハラスメントやいじめのように出来事が繰り返されるものについては、繰り返される出来事を一体のものとして評価することとなるので、発病の6か月よりも前にそれが開始されている場合でも、発病前おおむね6か月の期間にも継続しているときは、発病前おおむね6か月の間の行為を評価の対象とする。",a:false,exp:"「発病前おおむね6か月の間の行為を評価の対象とする」とする記述が誤りである。ハラスメントやいじめのように出来事が繰り返されるものについては、繰り返される出来事を一体のものとして評価することとなるので、発病の6か月よりも前にそれが開始されている場合でも、発病前おおむね6か月の期間にも継続しているときは、「開始時からのすべての行為」を評価の対象とする。なお、出来事の起点が発病の6か月より前であっても、その出来事（出来事後の状況）が継続している場合にあっては、発病前おおむね6か月の間における状況や対応について評価の対象とする。例えば、業務上の傷病により長期療養中の場合、その傷病の発生は発病の6か月より前であっても、当該傷病により発病前おおむね6か月の間に生じている強い苦痛や社会復帰が困難な状況等を出来事として評価する。",src:"令和5.9.1基発0901第2号",cat:"択一式（労災保険法）"},,
{no:"第2-問1",opt:"E",q:"セクシュアルハラスメントを受けた者は、勤務を継続したいとか、セクシュアルハラスメントを行った者（以下「行為者」という。）からのセクシュアルハラスメントの被害をできるだけ軽くしたいとの心理などから、やむを得ず行為者に迎合するようなメール等を送ることや、行為者の誘いを受け入れることがあるが、これらの事実はセクシュアルハラスメントを受けたことを単純に否定する理由にはならない。",a:true,exp:"設問の通り正しい。セクシュアルハラスメントが原因で対象疾病を発病したとして労災請求がなされた事案の心理的負荷の評価に際しては、特に次の事項に留意することとされている。①セクシュアルハラスメントを受けた者（被害者）は、勤務を継続したいとか、セクシュアルハラスメントを行った者（行為者）からのセクシュアルハラスメントの被害をできるだけ軽くしたいとの心理などから、やむを得ず行為者に迎合するようなメール等を送ることや、行為者の誘いを受け入れることがあるが、これらの事実はセクシュアルハラスメントを受けたことを単純に否定する理由にはならないこと。②被害者は、被害を受けてからすぐに相談行動をとらないことがあるが、この事実は心理的負荷が弱いと単純に判断する理由にならないこと。③被害者は、医療機関でもセクシュアルハラスメントを受けたということをすぐに話せないこともあるが、初診時にセクシュアルハラスメントの事実を申し立てていないことは心理的負荷が弱いと単純に判断する理由にならないこと。④行為者が上司であり被害者が部下である場合や行為者が正規雇用労働者であり被害者が非正規雇用労働者である場合等のように行為者が雇用関係上被害者に対して優越的な立場にある事実は心理的負荷を強める要素となり得ること。",src:"令和5.9.1基発0901第2号",cat:"択一式（労災保険法）"},,
{no:"第2-問2",opt:"A",q:"一次健康診断において、血圧検査、血液検査その他業務上の事由による脳血管疾患及び心臓疾患の発生にかかわる身体の状態に関する検査であって、厚生労働省令で定めるものが行われた場合において、当該検査を受けた労働者がそのいずれの項目にも異常の所見があると診断されたときは、既に脳血管疾患又は心臓疾患の症状を有するか否かにかかわらず、その者の請求に基づいて、二次健康診断等給付が行われる。",a:false,exp:"二次健康診断等給付は、一次健康診断の結果その他の事情により既に脳血管疾患又は心臓疾患の症状を有すると認められるものには、行われない。なお、二次健康診断の結果その他の事情により既に脳血管疾患又は心臓疾患の症状を有すると認められる労働者については、当該二次健康診断に係る特定保健指導は行われない。",src:"法26条1項",cat:"択一式（労災保険法）"},,
{no:"第2-問2",opt:"B",q:"二次健康診断等給付のうち、二次健康診断は、脳血管及び心臓の状態を把握するために必要な検査であって厚生労働省令で定めるものを行う医師による健康診断であり、一次健康診断ごとに1回に限られる。",a:false,exp:"二次健康診断は、「一次健康診断ごとに1回」ではなく、「1年度につき1回」に限られる。その他の記述は正しい。",src:"法26条2項1号",cat:"択一式（労災保険法）"},,
{no:"第2-問2",opt:"C",q:"二次健康診断等給付の請求は、一次健康診断の結果を知った日から3か月以内に行わなければならないが、天災その他請求をしなかったことについてやむを得ない理由があるときは、この限りでない。",a:false,exp:"二次健康診断等給付の請求は、「一次健康診断の結果を知った日」ではなく、「一次健康診断を受けた日」から3か月以内に行わなければならない。その他の記述は正しい。なお、二次健康診断等給付の請求書は、健診給付病院等を経由して所轄都道府県労働局長に提出しなければならない。",src:"法28条、則18条の19,4項",cat:"択一式（労災保険法）"},,
{no:"第2-問2",opt:"D",q:"二次健康診断を受けた労働者から3か月以内に当該二次健康診断の結果を証明する書面の提出を受けた事業者は、二次健康診断の結果（当該二次健康診断の項目に異常の所見があると診断された労働者に係るものに限る。）に基づき、当該労働者の健康を保持するために必要な措置について、医師の意見を聴かなければならない。",a:true,exp:"設問の通り正しい。なお、医師の意見聴取は、二次健康診断の結果を証明する書面が事業者に提出された日から2月以内に行うこととされており、聴取した医師の意見は、健康診断個人票に記載することとされている。",src:"法27条、安衛法66条の4",cat:"択一式（労災保険法）"},,
{no:"第2-問2",opt:"E",q:"二次健康診断の受診に要した時間の賃金の支払いについては、二次健康診断は、事業の遂行に伴い労災保険法上労働者の請求により当然実施されなければならない性格のものであり、その受診に要した時間は労働時間と解されるので、当該二次健康診断が法定労働時間外に行われた場合には、当然割増賃金を支払わなければならないものである。",a:false,exp:"二次健康診断の受診に要した時間は、労働時間に該当せず、その時間の賃金の支払いについては労使協議して定めるべきものとされている。したがって、二次健康診断が法定労働時間外に行われた場合であっても、割増賃金を支払う必要はない。なお、脳及び心臓疾患の発症のおそれのある労働者の健康確保は、事業の円滑な運営の不可欠な条件であることを考えると、その受診に要した時間の賃金を事業主が支払うことが望ましいとされている。",src:"平成13.3.30基発233号",cat:"択一式（労災保険法）"},,
{no:"第2-問3",opt:"A",q:"療養のため労働することができないため、療養開始から1年6か月を経過しても引き続き休業補償給付の支給を受けている労働者が、ある日について、所定労働時間8時間のうち3時間労働して5,000円の賃金の支払を受け、残りの時間について無給の休業をした。当該労働者の平均賃金（給付基礎日額も同額とする。）が18,000円、年齢階層別の最高限度額が15,625円である場合、当該日の休業補償給付の額は、(15,625円－5,000円)×100分の60で計算される。",a:false,exp:"設問の場合、当該日の休業補償給付の額は、(18,000円－5,000円)×100分の60で計算される。設問の労働者は、療養開始から1年6か月を経過しているので、年齢階層別の最高限度額が適用されるが、労働者が業務上の負傷又は疾病による療養のため所定労働時間のうちその一部分についてのみ労働する日若しくは賃金が支払われる休暇（部分算定日）における休業補償給付の額は、給付基礎日額（最高限度額を給付基礎日額とすることとされている場合にあっては、最高限度額の規定の適用がないものとした場合における給付基礎日額）（設問の場合18,000円）から部分算定日に対して支払われる賃金の額（設問の場合5,000円）を控除して得た額〔当該控除して得た額が最高限度額を超える場合にあっては、最高限度額に相当する額（設問の場合、控除して得た額である13,000円は最高限度額を超えていない）〕の100分の60に相当する額とされている。",src:"法14条1項",cat:"択一式（労災保険法）"},,
{no:"第2-問3",opt:"B",q:"療養のため労働することができないため、引き続き休業補償給付の支給を受けている労働者が、ある日について、所定労働時間8時間の全部について労働不能であるものの、そのうち6時間について労働基準法第39条第4項の規定によるいわゆる時間単位年休の取得により7,000円の賃金の支払を受け、残りの時間について無給の休業をした。当該労働者の平均賃金（給付基礎日額も同額とする。）が10,000円である場合、当該日について休業補償給付は支給されない。",a:true,exp:"設問の通り正しい。所定労働時間の全部について労働することができない場合（全部労働不能の場合）であって、平均賃金の100分の60以上の金額を受ける日は、休業補償給付の支給要件である「賃金を受けない日」に該当しないため、休業補償給付は支給されない。設問の場合、全部労働不能であって、平均賃金（10,000円）の100分の60以上の賃金（7,000円）の支払を受けているので、休業補償給付は支給されない。",src:"法14条1項、令和3.3.18基保発0318第1号他",cat:"択一式（労災保険法）"},,
{no:"第2-問3",opt:"C",q:"労働者が刑事施設、労役場その他これらに準ずる施設に拘禁されている場合（厚生労働省令で定める場合に限る。）には、休業補償給付は行わないこととされており、この場合には、休業特別支給金も支給されない。",a:true,exp:"設問の通り正しい。なお、少年院その他これに準ずる施設に収容されている場合（厚生労働省令で定める場合に限る。）についても同様に、休業補償給付及び休業特別支給金の支給はともに行われない。",src:"法14条の2、29条2項、支給金則3条2項",cat:"択一式（労災保険法）"},,
{no:"第2-問3",opt:"D",q:"休業補償給付の支給を受けている労働者について、老齢厚生年金の支給を受けることができることとなった場合には、休業補償給付の額は減額されないが、同一の事由について障害厚生年金の支給を受けることができることとなった場合には、休業補償給付の額は減額される。",a:true,exp:"設問の通り正しい。社会保険の年金給付との調整が行われるのは、同一の事由による社会保険の年金給付であり、老齢厚生年金との調整は行われない。また、休業補償給付を受ける労働者が同一の事由について障害厚生年金を受けることができるときは、当該労働者に支給する休業補償給付の額は、給付基礎日額の100分の60に相当する額に政令で定める率のうち傷病補償年金について定める率を乗じて得た額（その額が政令で定める額を下回る場合には、当該政令で定める額）に減額される。",src:"法14条2項",cat:"択一式（労災保険法）"},,
{no:"第2-問3",opt:"E",q:"同一の業務上の事由による負傷又は疾病に関し、休業補償給付を受けている労働者が障害補償給付を受ける権利を有することとなり、かつ、休業補償給付を行わないこととなった場合において、その後も休業補償給付が支払われたときは、その支払われた休業補償給付は、当該障害補償給付の内払とみなされる。",a:true,exp:"設問の通り正しい。",src:"法12条3項",cat:"択一式（労災保険法）"},,
{no:"第2-問4",opt:"A",q:"遺族補償年金を受けることができる遺族が、死亡した労働者の妻（32歳）、母（58歳）及び弟（29歳）であり、妻と母の2人が生計を同じくし、弟が生計を同じくしていない場合、妻に対して給付基礎日額の153日分の遺族補償年金が支給される。なお、労働者の死亡の当時厚生労働省令で定める障害の状態にある遺族はいないものとする。",a:true,exp:"設問の通り正しい。設問の遺族補償年金を受けることができる遺族（受給資格者）のうち、最先順位者は妻であり、妻が遺族補償年金の受給権者となる。また、遺族補償年金の額は、遺族補償年金の受給権者及びその者と生計を同じくしている受給資格者の人数により定められているが、若年停止者（55歳以上60歳未満の夫、父母、祖父母、兄弟姉妹であって厚生労働省令で定める障害の状態にないもの）は、その人数に含まれない。設問の場合、受給権者（妻）と生計を同じくしている受給資格者は58歳の母であるから、遺族補償年金の額の基礎となる遺族は妻1人となる。遺族補償年金の額の基礎となる遺族が妻1人の場合、遺族補償年金の額は、その妻が55歳以上又は厚生労働省令で定める障害の状態にあるときを除き、給付基礎日額の153日分であり、設問の場合（妻が32歳であり、厚生労働省令で定める障害の状態にない場合）、遺族補償年金の額は給付基礎日額の153日分となる。",src:"法16条の2,3項、16条の3,1項、法別表第1",cat:"択一式（労災保険法）"},,
{no:"第2-問4",opt:"B",q:"遺族補償年金の受給権者である死亡した労働者の子（15歳）が、厚生労働省令で定める障害の状態になかったが、17歳のときに当該障害の状態に該当するに至ったときは、18歳に達した日以後の最初の3月31日が終了しても受給権は消滅しない。",a:false,exp:"設問の場合、18歳に達した日以後の最初の3月31日が終了したときは、受給権は消滅する。なお、労働者の死亡の時から引き続き厚生労働省令で定める障害の状態にあるときは、18歳に達した日以後の最初の3月31日が終了しても受給権は消滅しない。",src:"法16条の4,1項",cat:"択一式（労災保険法）"},,
{no:"第2-問4",opt:"C",q:"遺族補償年金を受ける権利を有する者の所在が1年以上明らかでない場合には、当該遺族補償年金は、同順位者があるときは同順位者の、同順位者がないときは次順位者の申請によって、その申請があった月の翌月から、その支給が停止される。",a:false,exp:"遺族補償年金を受ける権利を有する者の所在が1年以上明らかでない場合には、当該遺族補償年金は、同順位者があるときは同順位者の、同順位者がないときは次順位者の申請によって、その「所在が明らかでない間」、その支給が停止される。なお、この場合、同順位者がないときは、その間、次順位者を先順位者とすることとされている。",src:"法16条の5,1項",cat:"択一式（労災保険法）"},,
{no:"第2-問4",opt:"D",q:"遺族補償年金の受給権者である死亡した労働者の55歳以上60歳未満の夫は、60歳に達する月までの間は、遺族補償年金の支給が停止されるが、その支給停止の間においても遺族補償年金前払一時金の支給を受けることはできる。この場合、遺族補償年金前払一時金の支給を受けたときは、その支給を受けたことによる支給停止は行われず、60歳に達した月の翌月から、遺族補償年金が支給されることとなる。",a:false,exp:"設問後段のような規定はない。設問のように遺族補償年金前払一時金の支給を受けた場合、60歳に達する月までの間は、いわゆる若年停止により支給停止が行われ、60歳に達した月の翌月から、遺族補償年金前払一時金の支給を受けたことによる支給停止が行われる。",src:"法附則60条3項、(40)法附則43条1項、3項",cat:"択一式（労災保険法）"},,
{no:"第2-問4",opt:"E",q:"遺族補償一時金を受けることができる遺族として、労働者の死亡の当時、その収入により生計を維持していなかった父と生計を維持していた弟がある場合、弟が遺族補償一時金の受給権者となる。",a:false,exp:"設問の場合、「父」が遺族補償一時金の受給権者となる。遺族補償一時金を受けるべき遺族の順位は、①〜④の順序により、②及び③に掲げる者のうちにあっては、それぞれ、②③に掲げる順序によるものとされている。①配偶者 ②労働者の死亡の当時その収入によって生計を維持していた子、父母、孫及び祖父母 ③前記②に該当しない子、父母、孫及び祖父母 ④兄弟姉妹",src:"法16条の7",cat:"択一式（労災保険法）"},,
{no:"第2-問5",opt:"A",q:"サービス業を主たる事業とする事業主であって常時100人以下の労働者を使用する事業主は、労働保険事務組合に労働保険事務の処理を委託していれば、中小事業主等の特別加入の対象となる。",a:true,exp:"設問の通り正しい。次に掲げる数以下の労働者を使用する事業の事業主で、労働保険事務組合に労働保険事務の処理を委託するものは、中小事業主の特別加入の対象となる。①金融業若しくは保険業、不動産業又は小売業：常時50人以下 ②卸売業又はサービス業：常時100人以下 ③上記①②以外の事業：常時300人以下",src:"法33条1号、則46条の16",cat:"択一式（労災保険法）"},,
{no:"第2-問5",opt:"B",q:"中小事業主等の特別加入者であって、自動車を使用して行う旅客若しくは貨物の運送の事業又は原動機付自転車若しくは自転車を使用して行う貨物の運送の事業に従事する者については、通勤災害に関する保険給付は行われない。",a:false,exp:"中小事業主等の特別加入者には、通勤災害に関する保険給付は行われる。通勤災害に関する保険給付が行われないのは、一人親方等の特別加入者であって、次の①又は②に掲げる事業を労働者を使用しないで行うことを常態とする者及びこれらの者が行う事業に従事する者並びに③又は④に掲げる作業に従事する者である。①自動車を使用して行う旅客若しくは貨物の運送の事業又は原動機付自転車若しくは自転車を使用して行う貨物の運送の事業 ②漁船による水産動植物の採捕の事業（船員法に規定する船員が行う事業を除く。）③特定農作業・指定農業機械作業 ④家内労働者又はその補助者が行う作業",src:"法35条1項、則46条の22の2",cat:"択一式（労災保険法）"},,
{no:"第2-問5",opt:"C",q:"一人親方等の特別加入者の事故が、第2種特別加入保険料が滞納されている期間中に生じたものであるときは、政府は、当該事故に係る保険給付の全部又は一部を行わないことができる。",a:true,exp:"設問の通り正しい。中小事業主等の特別加入者、一人親方等の特別加入者又は海外派遣の特別加入者の事故が、特別加入保険料が滞納されている期間中に生じたものであるときは、政府は、当該事故に係る保険給付の全部又は一部を行わないことができる（支給制限）とされている。",src:"法35条1項7号",cat:"択一式（労災保険法）"},,
{no:"第2-問5",opt:"D",q:"特別加入者には、二次健康診断等給付は行われない。",a:true,exp:"設問の通り正しい。",src:"法34条1項、35条1項、36条1項",cat:"択一式（労災保険法）"},,
{no:"第2-問5",opt:"E",q:"特別加入者に係る業務災害、複数業務要因災害及び通勤災害の認定は、厚生労働省労働基準局長が定める基準によって行うこととされている。",a:true,exp:"設問の通り正しい。",src:"法37条、則46条の26",cat:"択一式（労災保険法）"},,
{no:"第2-問6",opt:"A",q:"通勤は、「就業に関し」行われるものであるが、1日について1回のみしか認められないものではなく、昼休み等就業の時間の間に相当の間隔があって帰宅するような場合には、昼休みについていえば、午前中の業務を終了して帰り、午後の業務に就くために出勤するものと考えられるので、その往復行為は就業との関連性が認められる。",a:true,exp:"設問の通り正しい。「就業に関し」とは、移動行為が業務に就くため又は業務を終えたことにより行われるものであることを必要とする趣旨を示すものであり、通勤と認められるには、移動行為が業務と密接な関連（就業関連性）をもって行われることを要することを示している。",src:"法7条2項、平成28.12.28基発1228第1号",cat:"択一式（労災保険法）"},,
{no:"第2-問6",opt:"B",q:"友人宅で麻雀をし、翌朝そこから直接出勤する場合等は、その友人宅は就業の拠点となっているものではないので、通勤に係る「住居」とは認められない。",a:true,exp:"設問の通り正しい。なお、通勤に係る「住居」とは、労働者が居住して日常生活の用に供している家屋等の場所で、本人の就業のための拠点となるところを指す。",src:"法7条2項、平成28.12.28基発1228第1号",cat:"択一式（労災保険法）"},,
{no:"第2-問6",opt:"C",q:"鉄道、バス等の公共交通機関を利用し、自動車、自転車等を本来の用法に従って使用する場合は、通勤に係る「合理的な方法」と認められ、したがって事業主の提供する専用交通機関を利用してする移動は、通勤に当たる。",a:false,exp:"事業主の提供する専用交通機関を利用してする通勤は、「業務の性質を有するもの」に当たり、労災保険法7条2項の通勤に当たらない。",src:"法7条2項、平成28.12.28基発1228第1号",cat:"択一式（労災保険法）"},,
{no:"第2-問6",opt:"D",q:"物品を得意先に届けてその届け先から直接帰宅する場合の物品の届け先、全員参加で出勤扱いとなる会社主催の運動会の会場等は、通勤に係る「就業の場所」に当たる。",a:true,exp:"設問の通り正しい。なお、通勤に係る「就業の場所」とは、業務を開始し、又は終了する場所をいう。",src:"法7条2項、平成28.12.28基発1228第1号",cat:"択一式（労災保険法）"},,
{no:"第2-問6",opt:"E",q:"経路の近くにある公衆便所を使用する場合、帰途に経路の近くにある公園で短時間休息する場合や、経路上の店でタバコ、雑誌等を購入する場合は、通勤に係る「逸脱又は中断」に該当しない。",a:true,exp:"設問の通り正しい。設問のように、通常経路の途中で行うようなささいな行為を行う場合には、逸脱、中断に該当しない。なお、通勤に係る「逸脱」とは、通勤の途中において就業又は通勤とは関係のない目的で合理的な経路をそれることをいい、「中断」とは、通勤の経路上において通勤とは関係のない行為を行うことをいう。",src:"法7条2項、3項、平成28.12.28基発1228第1号",cat:"択一式（労災保険法）"},,
{no:"第2-問7",opt:"ア",q:"【遺族補償給付の受給資格の欠格に関する記述として正しいか】労働者の死亡前に、当該労働者の死亡によって遺族補償年金を受けることができる先順位の遺族となるべき者を故意に死亡させた者は、遺族補償年金を受けることができる遺族としない。",a:true,exp:"設問の通り正しい。労働者の死亡前に、当該労働者の死亡によって遺族補償年金を受けることができる先順位又は同順位の遺族となるべき者を故意に死亡させた者は、遺族補償年金を受けることができる遺族としない。",src:"法16条の9,2項",cat:"択一式（労災保険法）"},,
{no:"第2-問7",opt:"イ",q:"【遺族補償給付の受給資格の欠格に関する記述として正しいか】遺族補償年金を受ける権利を有する遺族が、遺族補償年金を受けることができる同順位の他の遺族を故意に死亡させたときは、その権利は、消滅する。",a:true,exp:"設問の通り正しい。",src:"法16条の9,4項",cat:"択一式（労災保険法）"},,
{no:"第2-問7",opt:"ウ",q:"【遺族補償給付の受給資格の欠格に関する記述として正しいか】遺族補償年金を受けることができる遺族が、遺族補償年金を受けることができる後順位の他の遺族を故意に死亡させたときは、その者は、遺族補償年金を受けることができる遺族でなくなる。",a:false,exp:"「後順位」とする記述が誤りである。遺族補償年金を受けることができる遺族が、遺族補償年金を受けることができる「先順位又は同順位」の他の遺族を故意に死亡させたときは、その者は、遺族補償年金を受けることができる遺族でなくなる。",src:"法16条の9,4項",cat:"択一式（労災保険法）"},,
{no:"第2-問7",opt:"エ",q:"【遺族補償給付の受給資格の欠格に関する記述として正しいか】労働者の死亡前に、当該労働者の死亡によって遺族補償年金を受けることができる遺族となるべき者を故意に死亡させた者は、遺族補償一時金を受けることができる遺族としない。",a:true,exp:"設問の通り正しい。",src:"法16条の9,3項",cat:"択一式（労災保険法）"},,
{no:"第2-問7",opt:"オ",q:"【遺族補償給付の受給資格の欠格に関する記述として正しいか】遺族補償年金を受けることができる遺族を故意に死亡させた者は、遺族補償一時金を受けることができる遺族としない。",a:true,exp:"設問の通り正しい。",src:"法16条の9,3項",cat:"択一式（労災保険法）"},,
{type:"select",no:"選択1",opt:"空欄A",context:"労働者災害補償保険法第10条前段では、「船舶が沈没し、転覆し、滅失し、若しくは行方不明となった際現にその船舶に乗っていた労働者若しくは船舶に乗っていてその船舶の航行中に行方不明となった労働者の生死が【A】間わからない場合又はこれらの労働者の死亡が【A】以内に明らかとなり、かつ、その死亡の時期がわからない場合には、【B】の支給に関する規定の適用については、その船舶が沈没し、転覆し、滅失し、若しくは行方不明となった日又は労働者が行方不明となった日に、当該労働者は、死亡したものと推定する。」と規定している。",choices:["3か月", "6か月", "1年", "2年"],answer:"3か月",exp:"労災保険法10条前段における死亡の推定期間は3か月である。なお、死亡したものと推定される日は、「船舶が沈没し、転覆し、滅失し、若しくは行方不明となった日又は労働者が行方不明となった日」であり、3か月を経過した日ではない。",src:"法10条",cat:"選択式"},,
{type:"select",no:"選択1",opt:"空欄B",context:"労働者災害補償保険法第10条前段では、「船舶が沈没し、転覆し、滅失し、若しくは行方不明となった際現にその船舶に乗っていた労働者若しくは船舶に乗っていてその船舶の航行中に行方不明となった労働者の生死が3か月間わからない場合又はこれらの労働者の死亡が3か月以内に明らかとなり、かつ、その死亡の時期がわからない場合には、【B】の支給に関する規定の適用については、その船舶が沈没し、転覆し、滅失し、若しくは行方不明となった日又は労働者が行方不明となった日に、当該労働者は、死亡したものと推定する。」と規定している。",choices:["遺族補償給付、葬祭料、遺族給付及び葬祭給付", "遺族補償年金、葬祭料、遺族年金及び葬祭給付", "遺族補償年金、葬祭料、複数事業労働者遺族年金、複数事業労働者葬祭給付、遺族年金及び葬祭給付", "遺族補償給付、複数事業労働者遺族給付及び遺族給付"],answer:"遺族補償給付、葬祭料、遺族給付及び葬祭給付",exp:"「死亡の推定」の規定は、遺族補償給付、葬祭料、遺族給付及び葬祭給付のほか、障害補償年金差額一時金・障害年金差額一時金についても適用されること、また、複数業務要因災害（複数事業労働者遺族給付、複数事業労働者葬祭給付）には適用されないことに注意。",src:"法10条",cat:"選択式"},,
{type:"select",no:"選択1",opt:"空欄C",context:"業務災害に関する保険給付（【C】を除く。）は、労働基準法に規定する災害補償の事由又は【D】に規定する災害補償の事由が生じた場合に、補償を受けるべき労働者若しくは遺族又は【E】に対し、その請求に基づいて行う。",choices:["傷病補償年金及び介護補償給付", "遺族補償一時金及び障害補償一時金", "二次健康診断等給付", "介護を行う者"],answer:"傷病補償年金及び介護補償給付",exp:"労災保険法の業務災害に関する保険給付のうち、傷病補償年金は昭和51年の労災保険法の改正により、介護補償給付は平成7年の労災保険法の改正により設けられたものであり、労働基準法の災害補償中に直接対応するものはない。",src:"法12条の8,2項",cat:"選択式"},,
{type:"select",no:"選択1",opt:"空欄D",context:"業務災害に関する保険給付（傷病補償年金及び介護補償給付を除く。）は、労働基準法に規定する災害補償の事由又は【D】に規定する災害補償の事由が生じた場合に、補償を受けるべき労働者若しくは遺族又は【E】に対し、その請求に基づいて行う。",choices:["船員法", "船員保険法", "国家公務員災害補償法若しくは地方公務員災害補償法", "国家公務員法若しくは地方公務員法"],answer:"船員法",exp:"船員法の災害補償の事由が生じた場合には、従来船員保険法において給付が行われていたが、平成22年に船員保険法の職務上疾病・年金部門のうち労災保険相当分は労災保険法に統合されており、船員法の災害補償の事由が生じた場合についても、船員保険法の独自給付分・上乗せ給付分を除き、労災保険法により給付が行われている。",src:"法12条の8,2項",cat:"選択式"},,
{type:"select",no:"選択1",opt:"空欄E",context:"業務災害に関する保険給付（傷病補償年金及び介護補償給付を除く。）は、労働基準法に規定する災害補償の事由又は船員法に規定する災害補償の事由が生じた場合に、補償を受けるべき労働者若しくは遺族又は【E】に対し、その請求に基づいて行う。",choices:["葬祭を行う者", "葬祭料", "診療を担当する者", "その他同居の親族"],answer:"葬祭を行う者",exp:"業務災害に関する保険給付のうち、葬祭料については、補償を受けるべき労働者若しくは遺族ではなく、「葬祭を行う者」に対し、その請求に基づいて行われる。",src:"法12条の8,2項",cat:"選択式"},,
{type:"select",no:"第2-選択1",opt:"空欄A",context:"労働者災害補償保険等関係事務のうち、保険給付（【A】を除く。）並びに社会復帰促進等事業のうち労災就学等援護費及び特別支給金の支給並びに厚生労働省労働基準局長が定める給付に関する事務は、都道府県労働局長の指揮監督を受けて、所轄労働基準監督署長が行う。",choices:["二次健康診断等給付", "通勤災害に関する保険給付", "特別加入者に関する保険給付", "未支給の保険給付"],answer:"二次健康診断等給付",exp:"労働者災害補償保険等関係事務は、厚生労働省労働基準局長の指揮監督を受けて、所轄都道府県労働局長が行うものとされているが、このうち、保険給付（二次健康診断等給付を除く。）並びに社会復帰促進等事業のうち労災就学等援護費及び特別支給金の支給並びに厚生労働省労働基準局長が定める給付に関する事務は、都道府県労働局長の指揮監督を受けて、所轄労働基準監督署長が行うこととされている。したがって、二次健康診断等給付の請求先は所轄都道府県労働局長であり、それ以外の保険給付の請求先は所轄労働基準監督署長である。",src:"則1条3項",cat:"選択式"},,
{type:"select",no:"第2-選択1",opt:"空欄B",context:"労働者災害補償保険等関係事務のうち、当該労働者災害補償保険等関係事務が【B】に関するものである場合 … 生計維持事業の主たる事務所の所在地を管轄する労働基準監督署長",choices:["複数業務要因災害", "通勤災害", "特別加入者", "二次健康診断等給付"],answer:"複数業務要因災害",exp:"複数業務要因災害に関する保険給付に関する事務は、生計維持事業の主たる事務所の所在地を管轄する労働基準監督署長が行うこととされているが、複数事業労働者の業務災害及び通勤災害に関する保険給付に関する事務については、（業務災害又は通勤災害に係る）所轄労働基準監督署長が行うこととなる（必ずしも生計維持事業の主たる事務所の所在地を管轄する労働基準監督署長とは限らない。）。なお、生計維持事業とは、複数事業労働者の2以上の事業のうち、その収入が当該複数事業労働者の生計を維持する程度が最も高いものをいう。",src:"則1条3項",cat:"選択式"},,
{type:"select",no:"第2-選択1",opt:"空欄C",context:"所轄労働基準監督署長は、業務上の事由により負傷し、又は疾病にかかった労働者の当該負傷又は疾病が療養の開始後【C】を経過した日において治っていないときは、同日以後【D】以内に、当該労働者から所定の事項を記載した届書（傷病の状態等に関する届）を提出させるものとする。",choices:["6か月", "1年", "1年6か月", "3年"],answer:"1年6か月",exp:"傷病補償年金の支給事由は、業務上の事由による療養の開始後1年6か月を経過した日又は同日後において、当該負傷又は疾病が治っていないこと及び当該負傷又は疾病による障害の程度が厚生労働省令で定める傷病等級に該当していることとされている。所轄労働基準監督署長は、療養開始後1年6か月を経過しても治っていない労働者について、その後1か月以内に傷病の状態等に関する届を提出させるものとされている。",src:"則18条の2,2項",cat:"選択式"},,
{type:"select",no:"第2-選択1",opt:"空欄D",context:"所轄労働基準監督署長は、業務上の事由により負傷し、又は疾病にかかった労働者の当該負傷又は疾病が療養の開始後1年6か月を経過した日において治っていないときは、同日以後【D】以内に、当該労働者から所定の事項を記載した届書（傷病の状態等に関する届）を提出させるものとする。",choices:["10日", "1か月", "2か月", "3か月"],answer:"1か月",exp:"所轄労働基準監督署長は、療養開始後1年6か月を経過しても治っていない労働者について、その後1か月以内に傷病の状態等に関する届を提出させるものとされている。",src:"則18条の2,2項",cat:"選択式"},,
{type:"select",no:"第2-選択1",opt:"空欄E",context:"毎年【E】から同月末日までの間に業務上の事由による負傷又は疾病に係る療養のため労働することができないために賃金を受けなかった日がある労働者が、その日について休業補償給付の支給を請求しようとする場合に、同月1日において当該負傷又は疾病に係る療養の開始後1年6か月を経過しているときは、当該労働者は、当該賃金を受けなかった日に係る休業補償給付の請求書に添えて所定の事項を記載した報告書（傷病の状態等に関する報告書）を所轄労働基準監督署長に提出しなければならない。",choices:["1月1日", "4月1日", "8月1日", "12月1日"],answer:"1月1日",exp:"1年6か月を経過しても治っておらず、しかも傷病補償年金の支給決定を受けるに至っていない労働者は、毎年1月分の休業補償給付を請求する際に、傷病の状態に関する報告書を併せて提出しなければならないこととされている。",src:"則19条の2,1項",cat:"選択式"},
{no:"LEC第1回-問1",opt:"A",q:"一の事業場における主たる作業が労災保険の強制適用事業に該当する場合には、その事業場の中の任意適用に該当する部分をも含めて強制適用の事業場とされる。",a:true,exp:"本肢のとおりである（昭22.9.11基発36号）。",src:"昭22.9.11基発36号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問1",opt:"B",q:"市が経営する水道事業は、強制適用事業に該当する。",a:true,exp:"本肢のとおりである（昭27.8.9基収3670号）。",src:"昭27.8.9基収3670号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問1",opt:"C",q:"非現業の一般職の国家公務員には、労災保険法が適用されない。",a:true,exp:"本肢のとおりである（労災保険法3条2項ほか）。本肢の国家公務員については国家公務員災害補償法が適用されるため、労災保険法は適用されない。",src:"労災法3条2項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問1",opt:"D",q:"行政執行法人の職員には、労災保険法が適用される。",a:false,exp:"行政執行法人の職員には、国家公務員災害補償法が適用されるため、労災保険法は適用されない（独立行政法人通則法59条1項）。なお、行政執行法人以外の独立行政法人の職員に対しては労災保険法が適用される（平13.2.22基発93号ほか）。",src:"独立行政法人通則法59条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問1",opt:"E",q:"都道府県労働委員会の委員には、労災保険法が適用されない。",a:true,exp:"本肢のとおりである（昭25.8.28基収2414号）。",src:"昭25.8.28基収2414号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問2",opt:"A",q:"労働組合が企業整備のために行われた事業主による指名解雇通知について争ったため、当該事業主が裁判所に被解雇者の事業場立入禁止の仮処分申請を行ったところ、当該労働組合は裁判所に協議約款違反による無効確認訴訟を提起し、併せて被解雇者の身分保全の仮処分を申請した。このとき、当該労働組合が裁判所の決定を待たずに被解雇者らを就労させ、その作業中に負傷事故が発生した場合、業務災害と認められる。",a:false,exp:"本肢の事故は業務災害と「認められない」（昭28.12.18基収4466号）。",src:"昭28.12.18基収4466号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問2",opt:"B",q:"午前7時の作業開始15分前に、労働者が休憩室に設置されているドラム缶の暖房装置を囲んで他の労働者らといつものように暖を取っていたところ、あまり薪が燃えなかったことから他の労働者が機械掃除用のために作業場に置いてあった石油を持ってきて薪にかけて燃やした際、当該労働者のズボンに火が燃え移って火傷を負った場合、業務災害と認められる。",a:true,exp:"本肢のとおりである（昭23.6.1基発1458号）。",src:"昭23.6.1基発1458号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問2",opt:"C",q:"出張の機会を利用して当該出張期間内において、出張先に赴く前後に自宅に立ち寄る行為（自宅から次の目的地に赴く行為を含む。）については、当該立ち寄る行為が出張経路を著しく逸脱していないと認められる限り、原則として、通勤として取り扱われる。",a:false,exp:"出張先に赴く前後に自宅に立ち寄る行為については、当該立ち寄る行為が出張経路を著しく逸脱していないと認められる限り、原則として、通常の出張の場合と同様、「業務」として取り扱われる（平18.3.31基労管発0331001号）。",src:"平18.3.31基労管発0331001号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問2",opt:"D",q:"労働者が通勤の途中、経路上で発生した交通事故により転倒したタンクローリーから流れ出した有害物質により急性中毒疾患に罹患した場合は、通勤災害と認められない。",a:false,exp:"本肢の場合、通勤災害と「認められる」（昭48.11.22基発644号）。",src:"昭48.11.22基発644号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問2",opt:"E",q:"通勤途上において労働者が自殺した場合は、通勤災害と認められる。",a:false,exp:"通勤途上の自殺は、通勤をしていることが原因となって災害が発生したものではないので、通勤災害と「認められない」（昭48.11.22基発644号）。",src:"昭48.11.22基発644号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問3",opt:"A",q:"業務災害による疾病が治ゆするまでは療養補償給付が行われるが、この治ゆとは、症状が安定し、疾病が固定した状態になって治療の必要がなくなったものをいう。",a:true,exp:"本肢のとおりである（昭23.1.13基災発3号ほか）。業務上の疾病が治って療養の必要がなくなった場合でも、その後にその疾病が再発すれば、新たな業務上の事由による疾病でなくても、業務上の疾病と認められ、療養補償給付が行われる。",src:"昭23.1.13基災発3号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問3",opt:"B",q:"療養補償給付である療養の費用の支給を受けようとする者は、所定の事項を記載した請求書を所轄労働基準監督署長に提出しなければならないが、当該請求書に記載した事項のうち、「負傷又は発病の年月日」については事業主の証明を受けなければならず、「災害の原因及び発生状況」、「傷病名及び療養の内容」並びに「療養に要した費用の額」については診療担当者の証明を受けなければならない。",a:false,exp:"「負傷又は発病の年月日」並びに「災害の原因及び発生状況」については事業主の証明を受けなければならず、「傷病名及び療養の内容」並びに「療養に要した費用の額」については診療担当者の証明を受けなければならない（労災保険法施行規則12条の2第1項・2項）。",src:"労災則12条の2第1項・2項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問3",opt:"C",q:"医師が直接の指導を行わない温泉療養については、療養補償給付は行われない。ただし、病院等の付属施設で医師が直接指導のもとに行うものについては、この限りでない。",a:true,exp:"本肢のとおりである（昭25.10.6基発916号）。",src:"昭25.10.6基発916号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問3",opt:"D",q:"療養補償給付である療養の給付は、社会復帰促進等事業として設置された病院若しくは診療所又は都道府県労働局長の指定する病院若しくは診療所、薬局若しくは訪問看護事業者において行われる。",a:true,exp:"本肢のとおりである（労災保険法施行規則11条1項）。本肢の病院等を「指定病院等」という。",src:"労災則11条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問3",opt:"E",q:"労働者が遠隔地において業務災害により死亡した場合の火葬料及び遺骨を移送するに必要な費用は、療養補償給付の対象とならない。",a:true,exp:"本肢のとおりである（昭24.7.22基収2303号）。",src:"昭24.7.22基収2303号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問4",opt:"ア",q:"【遺族補償給付に関する記述として正しいか】遺族補償年金の支給要件の一つである労働者による生計維持要件を満たすためには、専ら、又は主として労働者の収入によって生計を維持していたこと、すなわち労働者の収入によって消費生活の大部分を営んでいたことが必要である。",a:false,exp:"生計維持要件を満たすためには、専ら、又は主として労働者の収入によって生計を維持していたことを「要せず」、原則として、労働者の収入によって日常の消費生活の全部又は一部を営んでいればよい（昭41.1.31基発73号ほか）。",src:"昭41.1.31基発73号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問4",opt:"イ",q:"【遺族補償給付に関する記述として正しいか】労働者の死亡の当時胎児であった子が出生した場合において、その子が出生当時から厚生労働省令で定める障害の状態にあるときは、遺族補償年金の支給については、将来に向かって、その子は労働者の死亡の当時その収入によって生計を維持していた子とみなされ、他の失権事由に該当しない限り、20歳に達するまで遺族補償年金の支給を受けることができる。",a:false,exp:"労働者の死亡の当時胎児であった子が出生したときは、将来に向かって、その子は労働者の死亡の当時その収入によって生計を維持していた子とみなされるが、出生当時から厚生労働省令で定める障害の状態にあったとしても、「労働者の死亡の当時厚生労働省令で定める障害の状態にあった」とはみなされないため、他の失権事由に該当しない限り、「18歳に達した日以後の最初の3月31日が終了したとき」まで遺族補償年金の支給を受けることができる（法16条の2第2項）。",src:"労災法16条の2第2項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問4",opt:"ウ",q:"【遺族補償給付に関する記述として正しいか】遺族補償年金の支給要件の一つである厚生労働省令で定める障害の状態は、身体に障害等級第5級以上に該当する障害がある状態又は傷病が治らないで、身体の機能若しくは精神に、労働が高度の制限を受けるか、若しくは労働に高度の制限を加えることを必要とする程度以上の障害がある状態とされているが、この「労働の高度の制限」とは、完全労働不能で長期間にわたる高度の安静と常時の監視又は介護を要する程度よりは軽いが、「労働の著しい制限」よりは重い程度であって、長期間にわたり中等度の安静を要する状態をいう。",a:true,exp:"本肢のとおりである（則15条、昭41.1.31基発73号）。",src:"労災則15条、昭41.1.31基発73号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問4",opt:"エ",q:"【遺族補償給付に関する記述として正しいか】遺族補償年金の受給権者である妻が婚姻したことにより当該遺族補償年金の受給権が消滅した場合、妻は同一の事由について遺族補償一時金を受けることはできない。",a:false,exp:"遺族補償年金を受ける権利を有する者の権利が消滅した場合において、他に当該遺族補償年金を受けることができる遺族がなく、かつ、当該労働者の死亡に関し支給された遺族補償年金及び遺族補償年金前払一時金の額の合計額が給付基礎日額の1,000日分に満たないときは、所定の遺族に遺族補償一時金が支給される。したがって、妻が婚姻により受給権が失権した場合でも、既に受けた額の合計額が1,000日分に満たないときは、妻は遺族補償一時金の支給を受けることができる（法16条の6第1項、法16条の7第1項）。",src:"労災法16条の6第1項・16条の7第1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問4",opt:"オ",q:"【遺族補償給付に関する記述として正しいか】遺族補償年金の請求を行った後に遺族補償年金前払一時金の請求をすることができる場合、原則として、給付基礎日額の1,000日分から既に支給を受けた遺族補償年金の額の合計額を減じた額の範囲内で当該請求を行うこととなる。",a:true,exp:"本肢のとおりである（則附則33項ほか）。",src:"労災則附則33項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問5",opt:"A",q:"振動障害に係るアフターケアは、業務災害による振動障害の傷病者であって、労災保険法による障害補償給付を受けている者又は受けると見込まれる者（症状固定した者に限る。）のうち、医学的に早期にアフターケアの実施が必要であると認められる者に対して行われる。",a:true,exp:"本肢のとおりである（平19.4.23基発0423002号）。",src:"平19.4.23基発0423002号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問5",opt:"B",q:"アフターケア通院費の支給を受けようとする者は、アフターケア通院費支給申請書及びアフターケア通院費支給内訳書に通院費の額を証明する書類を添付し、被災事業場の所在地を管轄する労働基準監督署長に申請しなければならない。",a:false,exp:"アフターケア通院費の支給を受けようとする者は、所定の申請書等に通院費の額を証明する書類を添付し、「アフターケア手帳の交付を受けた都道府県労働局長」に申請しなければならない（平9.8.26基発596号）。",src:"平9.8.26基発596号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問5",opt:"C",q:"頭頸部外傷症候群等に係るアフターケアに関するアフターケア手帳の有効期間は交付日から起算して2年間であり、更新による再交付はできないものとされている。",a:true,exp:"本肢のとおりである（平19.4.23基発0423002号）。",src:"平19.4.23基発0423002号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問5",opt:"D",q:"慢性肝炎に係るアフターケアは、原則として、症状固定後3年を限度として、B型肝炎ウイルス感染者のうちHBe抗原陽性者及びC型肝炎ウイルス感染者については1か月に1回程度、B型肝炎ウイルス感染者のうちHBe抗原陰性者については6か月に1回程度必要に応じて行うものとされているが、医学的に必要のある者については、さらに継続して行うことができるものとされている。",a:true,exp:"本肢のとおりである（平19.4.23基発0423002号）。",src:"平19.4.23基発0423002号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問5",opt:"E",q:"アフターケア通院費の決定については、処分性が認められるため、行政事件訴訟法、行政不服審査法及び行政手続法の適用がある。",a:true,exp:"本肢のとおりである（平9.8.26基発596号）。",src:"平9.8.26基発596号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問6",opt:"A",q:"特別加入者が労働安全衛生法に規定する一次健康診断に相当する健康診断を任意に受けている場合、所定の要件を満たす限り、二次健康診断等給付を受けることができる。",a:false,exp:"特別加入者については、「二次健康診断等給付は行われない」（平13.3.30基発233号）。",src:"平13.3.30基発233号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問6",opt:"B",q:"特別加入前の事由により疾病にかかった特別加入者が、特別加入時に既に当該疾病の症状が療養補償給付の対象となる程度まで進行していたことが明らかである場合であっても、特別加入後に当該疾病について保険給付が行われる。",a:false,exp:"加入時に既に当該疾病の症状が療養補償給付の対象となる程度まで進行していたことが明らかな者については、特別加入後に当該疾病を事由とする保険給付は「行われない」（昭62.3.30基発175号）。",src:"昭62.3.30基発175号",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問6",opt:"C",q:"特別加入者の給付基礎日額については、年齢階層別の最低限度額及び最高限度額の規定は適用されないが、スライド制は適用される。",a:true,exp:"本肢のとおりである（則46条の20第2項・4項、則46条の24、則46条の25の3）。",src:"労災則46条の20第2項・4項ほか",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問6",opt:"D",q:"中小事業主等の特別加入者に係る事故が、第1種特別加入保険料が滞納されている期間中に生じたものであるときは、政府は、その保険給付に要した費用に相当する金額の全部又は一部を事業主から徴収することができる。",a:false,exp:"中小事業主等の特別加入者に係る事故が、第1種特別加入保険料が滞納されている期間中に生じたものであるときは、政府は、当該事故に係る「保険給付の全部又は一部を行わないことができる」（法34条1項）。",src:"労災法34条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問6",opt:"E",q:"中小事業主等の特別加入者のうち、その事業が自動車を使用して行う貨物の運送の事業であるものは、通勤災害に関する保険給付を受けることができない。",a:false,exp:"「一人親方等の特別加入者」のうち、自動車を使用して行う貨物の運送の事業を労働者を使用しないで行うことを常態とする者は、通勤災害に関する保険給付を受けることができない（法35条1項、則46条の22の2）。",src:"労災法35条1項、則46条の22の2",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問7",opt:"A",q:"介護補償給付を受ける権利は、その月に介護を受けた最後の日の翌日から起算して2年を経過したときは、時効によって消滅する。",a:false,exp:"介護補償給付を受ける権利は、「介護を受けた月の翌月の初日」から起算して2年を経過したときは、時効によって消滅する（法42条1項ほか）。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問7",opt:"B",q:"葬祭料を受ける権利は、葬祭を行った日の翌日から起算して2年を経過したときは、時効によって消滅する。",a:false,exp:"葬祭料を受ける権利は、「労働者が死亡した日の翌日」から起算して2年を経過したときは、時効によって消滅する（法42条1項ほか）。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問7",opt:"C",q:"療養補償給付である療養の費用の支給を受ける権利は、療養を受けた日ごとにその翌日から起算して2年を経過したときは、時効によって消滅する。",a:false,exp:"療養補償給付である療養の費用の支給を受ける権利は、「療養の費用を支払った日ごとにその翌日」から起算して2年を経過したときは、時効によって消滅する（法42条1項ほか）。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問7",opt:"D",q:"休業補償給付を受ける権利は、業務上の傷病による療養のため労働することができないために賃金を受けない日ごとにその翌日から起算して5年を経過したときは、時効によって消滅する。",a:false,exp:"休業補償給付を受ける権利は、業務上の傷病による療養のため労働することができないために賃金を受けない日ごとにその翌日から起算して「2年」を経過したときは、時効によって消滅する（法42条1項ほか）。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{no:"LEC第1回-問7",opt:"E",q:"障害補償給付を受ける権利は、傷病が治った日の翌日から起算して5年を経過したときは、時効によって消滅する。",a:true,exp:"本肢のとおりである（法42条1項ほか）。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{type:"select",no:"LEC選択問2",opt:"空欄A",context:"厚生労働省労働基準局長通知（「心理的負荷による精神障害の認定基準について」令和5年9月1日付け基発0901第2号）によれば、対象疾病の発病前おおむね【A】の間に、業務による強い心理的負荷が認められること等の要件を満たす対象疾病は、労働基準法施行規則別表第1の2第9号に該当する業務上の疾病として取り扱うこととされている。",choices:["3か月", "6か月", "1年", "1年6か月"],answer:"6か月",exp:"対象疾病の発病前おおむね6か月の間に、業務による強い心理的負荷が認められることが要件とされている。",src:"基発0901第2号(令5.9.1)",cat:"選択式"},
{type:"select",no:"LEC選択問2",opt:"空欄B",context:"「心理的負荷による精神障害の認定基準について」（令5.9.1基発0901第2号）において、専門医又は労働基準監督署長が高度な医学的検討が必要と判断した事案については、主治医の意見に加え、【B】精神障害専門部会に協議して合議による意見を求め、その意見に基づき認定要件を満たすか否かを判断することとされている。",choices:["地方労災医員協議会", "中央労働委員会", "労働政策審議会", "労働保険審査会"],answer:"地方労災医員協議会",exp:"高度な医学的検討が必要な事案は、主治医の意見に加え、地方労災医員協議会精神障害専門部会の合議による意見に基づき判断される。",src:"基発0901第2号(令5.9.1)",cat:"選択式"},
{type:"select",no:"LEC選択問2",opt:"空欄C",context:"同一の部位について障害の程度を加重した場合における障害補償給付の額の計算方法を規定した労災保険法施行規則第14条第5項では、「既に身体障害のあった者が、負傷又は疾病により同一の部位について障害の程度を加重した場合における当該事由に係る障害補償給付は、現在の身体障害の該当する障害等級に応ずる障害補償給付とし、その額は、現在の身体障害の該当する障害等級に応ずる障害補償給付の額から、既にあった身体障害の該当する障害等級に応ずる障害補償給付の額（現在の身体障害の該当する障害等級に応ずる障害補償給付が障害補償年金であって、既にあった身体障害の該当する障害等級に応ずる障害補償給付が障害補償一時金である場合には、その障害補償一時金の額（当該障害補償年金を支給すべき場合において、法第8条の3第2項において準用する法第8条の2第2項各号に掲げる場合に該当するときは、当該各号に定める額を法第8条の4の給付基礎日額として算定した既にあった身体障害の該当する障害等級に応ずる障害補償一時金の額）を【C】で除して得た額）を差し引いた額による。」と規定している。",choices:["10", "15", "20", "25"],answer:"25",exp:"加重の場合、既にあった身体障害に応ずる障害補償一時金の額を25で除して得た額を、現在の障害に応ずる給付額から差し引く。",src:"労災則14条5項",cat:"選択式"},
{type:"select",no:"LEC選択問2",opt:"空欄D",context:"死亡の推定を規定した労災保険法第10条では、「船舶が沈没し、転覆し、滅失し、若しくは行方不明となった際現にその船舶に乗っていた労働者若しくは船舶に乗っていてその船舶の航行中に行方不明となった労働者の生死が【D】間わからない場合又はこれらの労働者の死亡が【D】以内に明らかとなり、かつ、その死亡の時期がわからない場合には、遺族補償給付、葬祭料、遺族給付及び葬祭給付の支給に関する規定の適用については、その船舶が沈没し、転覆し、滅失し、若しくは行方不明となった日又は労働者が行方不明となった日に、当該労働者は、死亡したものと推定する。航空機が墜落し、滅失し、若しくは行方不明となった際現にその航空機に乗っていた労働者若しくは航空機に乗っていてその航空機の航行中行方不明となった労働者の生死が【D】間わからない場合又はこれらの労働者の死亡が【D】以内に明らかとなり、かつ、その死亡の時期がわからない場合にも、同様とする。」と規定している。",choices:["1箇月", "3箇月", "6箇月", "1年"],answer:"3箇月",exp:"死亡の推定における期間は3箇月である（労災保険法10条）。",src:"労災法10条",cat:"選択式"},
{type:"select",no:"LEC選択問2",opt:"空欄E",context:"死亡の推定を規定した労災保険法第10条では、「船舶が沈没し、転覆し、滅失し、若しくは行方不明となった際現にその船舶に乗っていた労働者若しくは船舶に乗っていてその船舶の航行中に行方不明となった労働者の生死が3箇月間わからない場合又はこれらの労働者の死亡が3箇月以内に明らかとなり、かつ、その死亡の時期がわからない場合には、遺族補償給付、葬祭料、遺族給付及び葬祭給付の支給に関する規定の適用については、その船舶が沈没し、転覆し、滅失し、若しくは行方不明となった日又は労働者が行方不明となった日に、当該労働者は、死亡したものと【E】。」と規定している。",choices:["仮定する", "推定する", "断定する", "みなす"],answer:"推定する",exp:"労災保険法10条の死亡の推定では、その日に当該労働者は死亡したものと「推定する」とされている。",src:"労災法10条",cat:"選択式"},
{type:"select",no:"LEC選択問5",opt:"空欄A",context:"労災保険は、労災保険法第1条の目的を達成するため、業務上の事由、【A】の2以上の事業の業務を要因とする事由又は通勤による労働者の負傷、疾病、障害、死亡等に関して保険給付を行うほか、社会復帰促進等事業を行うことができる。",choices:["複数事業労働者", "特別加入をしている者", "非正規雇用労働者", "日日雇い入れられる者"],answer:"複数事業労働者",exp:"複数事業労働者の2以上の事業の業務を要因とする事由（複数業務要因災害）による負傷等に関しても保険給付が行われる。",src:"労災法7条1項",cat:"選択式"},
{type:"select",no:"LEC選択問5",opt:"空欄B",context:"労災保険は、労災保険法第1条の目的を達成するため、業務上の事由、複数事業労働者の2以上の事業の業務を要因とする事由又は通勤による労働者の負傷、疾病、障害、死亡等に関して保険給付を行うほか、【B】を行うことができる。",choices:["社会復帰促進等事業", "就職支援法事業", "地域支援事業", "能力開発事業"],answer:"社会復帰促進等事業",exp:"労災保険は、保険給付を行うほか、社会復帰促進等事業を行うことができる。",src:"労災法2条の2",cat:"選択式"},
{type:"select",no:"LEC選択問5",opt:"空欄C",context:"労災保険法においては、労働者を使用する事業を適用事業とするものとされており、同法第3条第2項において、「前項の規定にかかわらず、【C】（労働基準法（昭和22年法律第49号）別表第1に掲げる事業を除く。）については、この法律は、適用しない。」と規定されている。",choices:["国の直営事業及び官公署の事業", "船員法第1条に規定する船員を使用して行う船舶所有者の事業", "農業（畜産及び養蚕の事業を含む。）", "林業"],answer:"国の直営事業及び官公署の事業",exp:"国の直営事業及び官公署の事業（労基法別表第1に掲げる事業を除く。）については、労災保険法は適用しない。",src:"労災法3条2項",cat:"選択式"},
{type:"select",no:"LEC選択問5",opt:"空欄D",context:"休業補償給付は、労働者が業務上の負傷又は疾病による療養のため労働することができないために【D】から支給するものとし、その額は、原則として、1日につき給付基礎日額の100分の60に相当する額とする。",choices:["賃金を受けない日の第4日目", "賃金を受けない日", "賃金を受けない日の第7日目", "賃金を受けない日の第10日目"],answer:"賃金を受けない日の第4日目",exp:"休業補償給付は、賃金を受けない日の第4日目から支給される（待期3日間）。",src:"労災法14条1項",cat:"選択式"},
{type:"select",no:"LEC選択問5",opt:"空欄E",context:"最高裁判所は、労災保険法に基づく業務災害に関する保険給付の要件が問題となった事件において、次のように判示した。「労働者の負傷、疾病、障害又は死亡（以下「災害」という。）が労災保険法に基づく業務災害に関する保険給付の対象となるには、それが業務上の事由によるものであることを要するところ、そのための要件の一つとして、【E】当該災害が発生したことが必要であると解するのが相当である。」",choices:["労働者が労働契約に基づき事業主の支配下にある状態において", "事業主が所有する施設において", "事業主の責めに帰すべき事由により", "労働者の責めに帰すべき事由により"],answer:"労働者が労働契約に基づき事業主の支配下にある状態において",exp:"業務災害と認められるには、労働者が労働契約に基づき事業主の支配下にある状態において当該災害が発生したこと（業務遂行性）が必要である。",src:"最高裁判例",cat:"選択式"},
{type:"select",no:"LEC選択問6",opt:"空欄A",context:"「血管病変等を著しく増悪させる業務による脳血管疾患及び虚血性心疾患等の認定基準について（令3.9.14基発0914第1号）」によると、業務による明らかな過重負荷を受けたことにより発症した脳・心臓疾患は業務に起因する疾病として取り扱われるが、当該認定基準にいう「発症前の長期間」とは、発症前おおむね【A】をいう。",choices:["6か月間", "1年6か月間", "1年間", "3か月間"],answer:"6か月間",exp:"脳・心臓疾患の認定基準において、「発症前の長期間」とは発症前おおむね6か月間をいう。",src:"基発0914第1号(令3.9.14)",cat:"選択式"},
{type:"select",no:"LEC選択問6",opt:"空欄B",context:"脳・心臓疾患の認定基準（令3.9.14基発0914第1号）において、「特に過重な業務」とは、日常業務に比較して特に過重な身体的、精神的負荷を生じさせたと客観的に認められる業務をいうものであり、ここでいう日常業務とは、【B】をいう。",choices:["通常の所定労働時間内の所定業務内容", "総労働時間内の一定の業務内容", "通勤及び業務に係るすべての行為", "当該事業場内で行うすべての行為"],answer:"通常の所定労働時間内の所定業務内容",exp:"認定基準にいう「日常業務」とは、通常の所定労働時間内の所定業務内容をいう。",src:"基発0914第1号(令3.9.14)",cat:"選択式"},
{type:"select",no:"LEC選択問6",opt:"空欄C",context:"年金たる保険給付の支給は、支給すべき事由が生じた月【C】で終わるものとする。",choices:["の翌月から始め、支給を受ける権利が消滅した月", "から始め、支給を受ける権利が消滅した月", "から始め、支給を受ける権利が消滅した月の翌月", "の翌月から始め、支給を受ける権利が消滅した月の翌月"],answer:"の翌月から始め、支給を受ける権利が消滅した月",exp:"年金たる保険給付の支給は、支給すべき事由が生じた月の翌月から始め、支給を受ける権利が消滅した月で終わる。",src:"労災法9条1項",cat:"選択式"},
{type:"select",no:"LEC選択問6",opt:"空欄D",context:"傷病等級第1級に該当する障害の状態にある者に係る傷病補償年金の額は、給付基礎日額の【D】分としている。",choices:["313日", "153日", "245日", "277日"],answer:"313日",exp:"傷病等級第1級に係る傷病補償年金の額は、給付基礎日額の313日分である。",src:"労災法別表第1",cat:"選択式"},
{type:"select",no:"LEC選択問6",opt:"空欄E",context:"政府は、社会復帰促進等事業のうち、【E】法第12条第1項に掲げるものを【E】に行わせるものとされている。",choices:["独立行政法人労働者健康安全機構", "独立行政法人福祉医療機構", "独立行政法人労働政策研究・研修機構", "日本年金機構"],answer:"独立行政法人労働者健康安全機構",exp:"政府は、社会復帰促進等事業のうち独立行政法人労働者健康安全機構法第12条第1項に掲げるものを、独立行政法人労働者健康安全機構に行わせる。",src:"労災法29条2項",cat:"選択式"},
{type:"select",no:"LEC選択問7",opt:"空欄A",context:"「心理的負荷による精神障害の認定基準について（令5.9.1基発0901第2号）」によると、心理的負荷による精神障害の【A】を判断する要件としては、対象疾病が発病しており、当該対象疾病の発病の前おおむね6か月の間に業務による強い心理的負荷が認められることを掲げている。さらに、これらの要件が認められた場合であっても、明らかに業務以外の心理的負荷や個体側要因によって発病したと認められる場合には、【A】が否定される。",choices:["業務起因性", "業務遂行性", "結果回避可能性", "予見可能性"],answer:"業務起因性",exp:"心理的負荷による精神障害の業務起因性を判断する要件として、発病前おおむね6か月の間に業務による強い心理的負荷が認められること等が掲げられている。",src:"基発0901第2号(令5.9.1)",cat:"選択式"},
{type:"select",no:"LEC選択問7",opt:"空欄B",context:"心理的負荷による精神障害の認定基準（令5.9.1基発0901第2号）によると、認定要件が認められた場合であっても、明らかに業務以外の心理的負荷や【B】によって発病したと認められる場合には、業務起因性が否定される。",choices:["個体側要因", "業務起因性", "結果回避可能性", "予見可能性"],answer:"個体側要因",exp:"業務以外の心理的負荷や個体側要因によって発病したと認められる場合には、業務起因性が否定される。",src:"基発0901第2号(令5.9.1)",cat:"選択式"},
{type:"select",no:"LEC選択問7",opt:"空欄C",context:"遺族補償年金の受給権者の所在が1年以上明らかでない場合には、当該遺族補償年金は、同順位者があるときは同順位者の、同順位者がないときは次順位者の申請によって、その所在が明らかでない間、その支給が停止される。この場合において、同順位者がないときは、【C】、当該次順位者が最先順位として受給権者となる。",choices:["受給権者が所在不明となったときにさかのぼって", "受給権者となったときにさかのぼって", "他の遺族の同意を得た場合に", "当該申請した日から起算して3月を経過した日に"],answer:"受給権者が所在不明となったときにさかのぼって",exp:"同順位者がないときは、受給権者が所在不明となったときにさかのぼって、当該次順位者が最先順位として受給権者となる。",src:"労災法16条の5第1項",cat:"選択式"},
{type:"select",no:"LEC選択問7",opt:"空欄D",context:"遺族補償年金の支給を停止された遺族は、【D】、その支給停止の解除を申請することができる。",choices:["いつでも", "当該支給が停止したことを知った日から起算して14日を経過するまでに", "当該支給が停止したことを知った日から起算して3月を経過するまでに", "当該申請した日に"],answer:"いつでも",exp:"支給を停止された遺族は、いつでも、その支給停止の解除を申請することができる。",src:"労災法16条の5第2項",cat:"選択式"},
{type:"select",no:"LEC選択問7",opt:"空欄E",context:"労災保険法第45条において、「市町村長（特別区の区長を含むものとし、地方自治法（昭和22年法律第67号）第252条の19第1項の指定都市においては、区長又は総合区長とする。）は、行政庁又は保険給付を受けようとする者に対して、当該市（特別区を含む。）町村の条例で定めるところにより、保険給付を受けようとする者又は遺族の戸籍に関し、【E】。」と規定されている。",choices:["無料で証明を行うことができる", "無料で証明を行わなければならない", "有料で証明を行うことができる", "有料で証明を行わなければならない"],answer:"無料で証明を行うことができる",exp:"市町村長は、戸籍に関し、無料で証明を行うことができる（労災保険法45条）。",src:"労災法45条",cat:"選択式"},
{no:"TAC問13",opt:"A",q:"業務による心理的負荷の強度の判断に当たっては、別表1「業務による心理的負荷評価表」（以下本問において「別表1」という。）を指標として、心理的負荷の強度を、「強」、「中」、「弱」の3段階に区分するが、発病前おおむね6か月間に生じた業務による出来事の心理的負荷の評価は、別表1に掲げる「具体的出来事」に一つも該当しない場合には行わない。",a:false,exp:"別表1に掲げる「具体的出来事」に合致しない場合にも、近い「具体的出来事」に当てはめ、総合評価を行う（令5.9.1基発0901第2号）。「該当しない場合には行わない」とする点が誤り。",src:"令5.9.1基発0901第2号",cat:"択一式（労災保険法）"},
{no:"TAC問13",opt:"B",q:"心理的負荷の評価は、同種の労働者が一般的に受けるであろう心理的負荷を基準として行うものとされており、本人の主観的な受け止め方のみによって評価するものではないが、業務による心理的負荷の強度が「強」と判断される場合には、業務以外の心理的負荷や個体側要因を考慮することなく、業務起因性を決定する。",a:false,exp:"心理的負荷の強度が「強」とされ②の要件を満たしても、業務上の疾病となるには、①対象疾病を発病していること及び③業務以外の心理的負荷及び個体側要因により発病したと認められないことの要件も満たす必要がある（令5.9.1基発0901第2号）。",src:"令5.9.1基発0901第2号",cat:"択一式（労災保険法）"},
{no:"TAC問13",opt:"C",q:"業務による心理的負荷の強度が「強」と判断される場合において、業務以外の心理的負荷や個体側要因が発病の主たる原因であると医学的に認められる場合には、業務起因性は認められない。",a:true,exp:"設問のとおり正しい。発病前おおむね6か月の間に業務による強い心理的負荷が認められた場合であっても、明らかに業務以外の心理的負荷や個体側要因によって発病したと認められる場合には、業務起因性が「否定される」（令5.9.1基発0901第2号）。",src:"令5.9.1基発0901第2号",cat:"択一式（労災保険法）"},
{no:"TAC問13",opt:"D",q:"2以上の事業の業務による心理的負荷を評価する際、異なる事業における労働時間、労働日数は、通算せず、個別に判断する。",a:false,exp:"2以上の事業の業務による心理的負荷を評価する際、異なる事業における労働時間、労働日数は、それぞれ「通算する」（令5.9.1基発0901第2号）。",src:"令5.9.1基発0901第2号",cat:"択一式（労災保険法）"},
{no:"TAC問13",opt:"E",q:"セクシュアルハラスメントが原因で対象疾病を発病したとして労災請求がなされた事案の心理的負荷の評価に際しては、セクシュアルハラスメントを行った者（以下「行為者」という。）が、セクシュアルハラスメントを受けた者（以下「被害者」という。）に対して雇用関係上優越的な立場にある事実（例えば、行為者が上司で被害者が部下、あるいは行為者が正規雇用労働者であり被害者が非正規雇用労働者である場合等）は、心理的負荷を強める要素とはならない。",a:false,exp:"行為者が雇用関係上被害者に対して優越的な立場にある事実は、心理的負荷を「強める要素となり得る」（令5.9.1基発0901第2号）。",src:"令5.9.1基発0901第2号",cat:"択一式（労災保険法）"},
{no:"TAC問14",opt:"ア",q:"【労災保険法施行規則第8条に定める「日常生活上必要な行為」に該当するか】日用品の購入。",a:true,exp:"「日用品の購入」は、日常生活上必要な行為として労災保険法施行規則8条1号に定められている。",src:"労災則8条1号",cat:"択一式（労災保険法）"},
{no:"TAC問14",opt:"イ",q:"【労災保険法施行規則第8条に定める「日常生活上必要な行為」に該当するか】学校教育法第1条に規定する学校において行われる教育であって、職業能力の開発向上に資するものを受けること。",a:true,exp:"本肢の行為は、日常生活上必要な行為として労災保険法施行規則8条2号に定められている。",src:"労災則8条2号",cat:"択一式（労災保険法）"},
{no:"TAC問14",opt:"ウ",q:"【労災保険法施行規則第8条に定める「日常生活上必要な行為」に該当するか】選挙権の行使。",a:true,exp:"「選挙権の行使」は、日常生活上必要な行為として労災保険法施行規則8条3号に定められている。",src:"労災則8条3号",cat:"択一式（労災保険法）"},
{no:"TAC問14",opt:"エ",q:"【労災保険法施行規則第8条に定める「日常生活上必要な行為」に該当するか】病院において治療を受けること。",a:true,exp:"「病院において治療を受けること」は、日常生活上必要な行為として労災保険法施行規則8条4号に定められている。",src:"労災則8条4号",cat:"択一式（労災保険法）"},
{no:"TAC問14",opt:"オ",q:"【労災保険法施行規則第8条に定める「日常生活上必要な行為」に該当するか】要介護状態にある配偶者の祖母の介護（継続的に又は反復して行われるものに限る。）。",a:false,exp:"則8条5号に定める介護の対象は、要介護状態にある配偶者、子、父母、孫、祖父母及び兄弟姉妹並びに配偶者の父母であり、「配偶者の祖母」の介護は定められて「いない」。",src:"労災則8条",cat:"択一式（労災保険法）"},
{no:"TAC問15",opt:"A",q:"複数事業労働者に関する保険給付に係る給付基礎日額については、平均賃金相当額について複数事業労働者を使用する事業場ごとに算定することとなるが、事業場ごとに算定した平均賃金相当額が労災保険法施行規則第9条第1項第5号に規定する自動変更対象額（以下「自動変更対象額」という。）に満たない場合においても、同則第9条の2の2の規定に基づき、事業場ごとに算定した平均賃金相当額にそれぞれ自動変更対象額の規定を適用するのではなく、自動変更対象額に満たない金額を合算し、当該合算額に自動変更対象額を適用する。",a:true,exp:"設問のとおり正しい。複数事業労働者の給付基礎日額については、個々の事業ごとに算定した給付基礎日額相当額には自動変更対象額は適用されず、これらを合算した額（給付基礎日額）に自動変更対象額が適用される（則9条の2の2、令2.8.21基発0821第2号）。",src:"労災則9条の2の2",cat:"択一式（労災保険法）"},
{no:"TAC問15",opt:"B",q:"複数事業労働者に該当する特別加入者のうち、労働者であって、かつ、特別加入者である者に係る給付基礎日額は、労働者としての給付基礎日額相当額と特別加入者としての給付基礎日額相当額を合算するが、この場合、労働者としての給付基礎日額相当額は、合算前に自動変更対象額、スライド制及び年齢階層別の最低・最高限度額の規定が適用され、特別加入者としての給付基礎日額相当額は、合算前にスライド制の規定は適用されるが、自動変更対象額及び年齢階層別の最低・最高限度額の規定は適用されない。",a:true,exp:"設問のとおり正しい（則46条の20第3項・5項、則46条の24、則46条の25の3）。",src:"労災則46条の20ほか",cat:"択一式（労災保険法）"},
{no:"TAC問15",opt:"C",q:"休業補償給付、複数事業労働者休業給付又は休業給付（以下、本肢において「休業補償給付等」という。）の額の算定の基礎として用いる給付基礎日額については、当該休業補償給付等を支給すべき事由が生じた日が当該休業補償給付等に係る療養を開始した日から起算して1年6箇月を経過した日以後の日である場合において、四半期ごとの平均給与額が算定事由発生日の属する四半期の平均給与額の100分の110を超え、又は100分の90を下るに至ったときは、その上下した比率を基準としてスライド改定が行われる。",a:false,exp:"休業給付基礎日額のスライド改定は、四半期ごとの平均給与額が算定事由発生日の属する四半期の平均給与額と比較して10%を超えて変動するに至った場合に、その四半期の翌々四半期に属する最初の日以後に行われるのであって、「療養を開始した日から起算して1年6箇月を経過した日以後」に行われるのではない（法8条の2第1項）。",src:"労災法8条の2第1項",cat:"択一式（労災保険法）"},
{no:"TAC問15",opt:"D",q:"業務上の事故が発生した場合において、当該事故が発生した日（算定事由発生日）の属する年度の翌々年度の8月以後に労働者が死亡し、葬祭料が支給されることとなったときは、葬祭料を遺族補償一時金とみなして、その額の算定の基礎となる給付基礎日額にスライド制の規定が適用される。",a:true,exp:"設問のとおり正しい。一時金たる保険給付の額の算定の基礎となる給付基礎日額についても、年金給付基礎日額と同様のスライド制が適用される（法8条の4、則17条カッコ書）。",src:"労災法8条の4",cat:"択一式（労災保険法）"},
{no:"TAC問15",opt:"E",q:"給付基礎日額に1円未満の端数があるときは、これを1円に切り上げる。",a:true,exp:"設問のとおり正しい（法8条の5）。",src:"労災法8条の5",cat:"択一式（労災保険法）"},
{no:"TAC問16",opt:"ア",q:"【同一の災害により系列を異にする身体障害を2以上残した場合の障害等級の決定として正しいか】障害等級第4級及び第14級の2障害を残した場合、障害補償給付の障害等級は第3級となる。",a:false,exp:"第14級の障害があるため併合となり、重い方の身体障害の障害等級「第4級」となる。第3級ではない（則14条2項）。",src:"労災則14条2項",cat:"択一式（労災保険法）"},
{no:"TAC問16",opt:"イ",q:"【同一の災害により系列を異にする身体障害を2以上残した場合の障害等級の決定として正しいか】障害等級第6級及び第8級の2障害を残した場合、障害補償給付の障害等級は第4級となる。",a:true,exp:"第8級以上に該当する身体障害が2以上（第6級、第8級）あるため、最も重い第6級を2級繰り上げて第4級となる（則14条3項）。",src:"労災則14条3項",cat:"択一式（労災保険法）"},
{no:"TAC問16",opt:"ウ",q:"【同一の災害により系列を異にする身体障害を2以上残した場合の障害等級の決定として正しいか】障害等級第9級及び第12級の2障害を残した場合、障害補償給付の障害等級は第8級となる。",a:true,exp:"第13級以上に該当する身体障害が2以上（第9級、第12級）あるため、最も重い第9級を1級繰り上げて第8級となる（則14条3項）。",src:"労災則14条3項",cat:"択一式（労災保険法）"},
{no:"TAC問16",opt:"エ",q:"【同一の災害により系列を異にする身体障害を2以上残した場合の障害等級の決定として正しいか】障害等級第4級及び第5級の2障害を残した場合、障害補償給付の障害等級は第1級となる。",a:true,exp:"第5級以上に該当する身体障害が2以上（第4級、第5級）あるため、最も重い第4級を3級繰り上げて第1級となる（則14条3項）。",src:"労災則14条3項",cat:"択一式（労災保険法）"},
{no:"TAC問16",opt:"オ",q:"【同一の災害により系列を異にする身体障害を2以上残した場合の障害等級の決定として正しいか】障害等級第7級、第8級、第11級及び第13級の4障害を残した場合、障害補償給付の障害等級は第6級となる。",a:false,exp:"3以上の身体障害を残した場合は重い方から順に2の障害について併合繰上げをする。第8級以上が2以上（第7級、第8級）あるため、最も重い第7級を2級繰り上げて「第5級」となる。第6級ではない（則14条3項）。",src:"労災則14条3項",cat:"択一式（労災保険法）"},
{no:"TAC問17",opt:"A",q:"遺族補償年金の支給要件にある「厚生労働省令で定める障害の状態」とは、身体に障害等級第7級以上に該当する障害がある状態又は傷病が治らないで、身体の機能若しくは精神に、労働が著しい制限を受けるか、若しくは労働に著しい制限を加えることを必要とする程度以上の障害がある状態をいう。",a:false,exp:"「厚生労働省令で定める障害の状態」とは、障害等級「第5級」以上に該当する障害がある状態、又は傷病が治らないで、身体の機能若しくは精神に労働が「高度の制限」を受ける等の障害がある状態をいう（則15条）。第7級・著しい制限ではない。",src:"労災則15条",cat:"択一式（労災保険法）"},
{no:"TAC問17",opt:"B",q:"遺族補償年金の支給要件にある「労働者の死亡の当時その収入によって生計を維持していた」とは、もっぱら又は主として労働者の収入によって生計を維持されていることをいい、いわゆる共稼ぎはこれに含まれない。",a:false,exp:"「生計を維持していた」とは、もっぱら又は主として労働者の収入によって生計を維持されていることを要せず、収入によって生計の一部を維持されていれば足りるため、いわゆる共稼ぎも「これに含まれる」（昭41.1.31基発73号）。",src:"昭41.1.31基発73号",cat:"択一式（労災保険法）"},
{no:"TAC問17",opt:"C",q:"遺族補償年金を受けることができる遺族が、死亡労働者の53歳の妻1人である場合（厚生労働省令で定める障害の状態にない）、当該妻が55歳に達したときは、55歳に達した月から遺族補償年金の額を改定する。",a:false,exp:"設問の場合、妻が55歳に達した「月の翌月」から遺族補償年金の額を改定する（法16条の3第4項）。",src:"労災法16条の3第4項",cat:"択一式（労災保険法）"},
{no:"TAC問17",opt:"D",q:"遺族補償年金を受ける権利を有する死亡労働者の子が、祖父（死亡労働者の父）の養子となったときであっても、これを理由に当該子の有する遺族補償年金を受ける権利は消滅しない。",a:true,exp:"失権事由となる養子縁組は「直系血族又は直系姻族以外の者の養子」となった場合である。祖父（直系血族）の養子となった場合は失権事由に該当せず、遺族補償年金を受ける権利は消滅しない（法16条の4第1項3号）。",src:"労災法16条の4第1項3号",cat:"択一式（労災保険法）"},
{no:"TAC問17",opt:"E",q:"労働者の死亡の当時に胎児であった子が、厚生労働省令で定める障害の状態で出生した場合、当該子が18歳に達した日以後の最初の3月31日が経過したときであっても、当該子の有する遺族補償年金を受ける権利は消滅しない。",a:false,exp:"胎児が出生したときは、将来に向かって生計を維持していた子とみなされるが、労働者の死亡の当時障害の状態にあったとはみなされない。したがって18歳に達した日以後の最初の3月31日が終了したときは、当該子の遺族補償年金を受ける権利は消滅する（法16条の2第1項・2項、法16条の4第1項5号）。",src:"労災法16条の2第1項・2項",cat:"択一式（労災保険法）"},
{no:"TAC問18",opt:"A",q:"二次健康診断等給付は、社会復帰促進等事業として設置された病院若しくは診療所又は都道府県労働局長の指定する病院若しくは診療所において行う。",a:true,exp:"設問のとおり正しい（則11条の3第1項）。",src:"労災則11条の3第1項",cat:"択一式（労災保険法）"},
{no:"TAC問18",opt:"B",q:"一次健康診断の結果その他の事情により、既に脳血管疾患又は心臓疾患の症状を有すると認められるものには、二次健康診断等給付は行われない。",a:true,exp:"設問のとおり正しい（法26条1項カッコ書）。なお、二次健康診断の結果その他の事情により既に脳血管疾患又は心臓疾患の症状を有すると認められる労働者については、当該二次健康診断に係る特定保健指導は行われない。",src:"労災法26条1項",cat:"択一式（労災保険法）"},
{no:"TAC問18",opt:"C",q:"二次健康診断等給付のうち特定保健指導とは、一次健康診断の結果に基づき、脳血管疾患及び心臓疾患の発生の予防を図るため、面接により行われる医師又は看護師による保健指導をいう。",a:false,exp:"特定保健指導とは、「二次健康診断」の結果に基づき、脳血管疾患及び心臓疾患の発生の予防を図るため、面接により行われる医師又は「保健師」による保健指導をいう（法26条2項2号）。「一次健康診断」「看護師」ではない。",src:"労災法26条2項2号",cat:"択一式（労災保険法）"},
{no:"TAC問18",opt:"D",q:"二次健康診断等給付の請求は、天災その他請求をしなかったことについてやむを得ない理由があるときを除き、一次健康診断を受けた日から3か月以内に行わなければならない。",a:true,exp:"設問のとおり正しい（則18条の19第4項）。なお、二次健康診断等給付に係る請求書は、健診給付病院等を経由して所轄都道府県労働局長に提出しなければならない（「労働基準監督署長」ではない）。",src:"労災則18条の19第4項",cat:"択一式（労災保険法）"},
{no:"TAC問18",opt:"E",q:"特定保健指導を受ける権利は、労働者が、一次健康診断の結果を了知し得る日の翌日から2年を経過したときは、時効によって消滅する。",a:true,exp:"設問のとおり正しい（法42条1項）。二次健康診断等給付（特定保健指導を含む。）を受ける権利は、これを行使することができる時から2年を経過したときは、時効によって消滅する。",src:"労災法42条1項",cat:"択一式（労災保険法）"},
{no:"TAC問19",opt:"A",q:"一人親方等として特別加入をしている者は、当該特別加入に係る団体以外の団体を通じて、当該特別加入に係る事業と異なる種類の事業に関し、重ねて特別加入をすることができる。",a:true,exp:"設問のとおり正しい（法35条2項、平11.12.3基発695号）。なお、特別加入した一人親方等及び特定作業従事者は、同一の種類の事業又は同一の種類の作業に関しては、他の団体に関し重ねて特別加入することができない。",src:"労災法35条2項",cat:"択一式（労災保険法）"},
{no:"TAC問19",opt:"B",q:"特別加入している中小事業主の業務災害の原因である事故が当該事業主の故意又は重大な過失によって生じたものであるときは、保険給付に要した費用の全部又は一部が徴収される。",a:false,exp:"設問の場合、政府はその事故に係る保険給付の全部又は一部を「行わないことができる」（特別加入者については「費用徴収」ではなく「支給制限」が行われる）（法34条1項4号）。",src:"労災法34条1項4号",cat:"択一式（労災保険法）"},
{no:"TAC問19",opt:"C",q:"特別加入者に係る業務災害、複数業務要因災害及び通勤災害の認定は、厚生労働省労働基準局長の定める基準によって行われる。",a:true,exp:"設問のとおり正しい（則46条の26）。",src:"労災則46条の26",cat:"択一式（労災保険法）"},
{no:"TAC問19",opt:"D",q:"特別加入者に対する休業補償給付は、特別加入者が業務上負傷し、又は疾病にかかり、その療養のため業務遂行性が認められる範囲の業務又は作業について全部労働不能であるときは、所得喪失の有無にかかわらず、休業4日目から支給される。",a:true,exp:"設問のとおり正しい（平13.3.30基発233号）。",src:"平13.3.30基発233号",cat:"択一式（労災保険法）"},
{no:"TAC問19",opt:"E",q:"障害補償年金を受ける特別加入者に対しては、障害特別支給金は支給されるが、障害特別年金は支給されない。",a:true,exp:"設問のとおり正しい（特別支給金規則19条）。特別加入者には原則として特別給与（ボーナス等）がないため、定率又は定額の特別支給金は支給されるが、特別給与を算定基礎とする特別支給金（特別年金及び特別一時金）は支給されない。",src:"特別支給金規則19条",cat:"択一式（労災保険法）"},
{no:"TAC問20",opt:"ア",q:"【通則・雑則等に関する記述として正しいか】保険給付として支給を受けた金品を標準として租税その他の公課を課することはできない。",a:true,exp:"設問のとおり正しい（法12条の6）。",src:"労災法12条の6",cat:"択一式（労災保険法）"},
{no:"TAC問20",opt:"イ",q:"【通則・雑則等に関する記述として正しいか】保険給付を受ける権利は、労働者の退職日の翌日から起算して2年を経過したときは、時効によって消滅する。",a:false,exp:"保険給付を受ける権利は、労働者の退職によって変更されることはない。したがって「労働者の退職日の翌日から起算して2年を経過したときは、時効によって消滅する」とする点は誤り（法12条の5第1項）。",src:"労災法12条の5第1項",cat:"択一式（労災保険法）"},
{no:"TAC問20",opt:"ウ",q:"【通則・雑則等に関する記述として正しいか】労働者派遣法に規定する派遣先の事業主が、労災保険法第46条（事業主等に対する報告命令等）の規定に違反し、行政庁に対して、虚偽の報告をした場合には、6月以下の拘禁刑又は30万円以下の罰金に処せられる。",a:true,exp:"設問のとおり正しい（法51条）。",src:"労災法51条",cat:"択一式（労災保険法）"},
{no:"TAC問20",opt:"エ",q:"【通則・雑則等に関する記述として正しいか】事業主は、労災保険に関する法令のうち、労働者に関係のある規定の要旨、労災保険に係る保険関係成立の年月日及び労働保険番号を、電磁的方法により提供し、又は常時事業場の見易い場所に掲示し、若しくは備え付ける等の方法によって、労働者に周知させなければならない。",a:true,exp:"設問のとおり正しい（則49条1項）。",src:"労災則49条1項",cat:"択一式（労災保険法）"},
{no:"TAC問20",opt:"オ",q:"【通則・雑則等に関する記述として正しいか】労災保険に係る保険関係が成立し、若しくは成立していた事業の事業主又は労働保険事務組合若しくは労働保険事務組合であった団体は、労災保険に関する書類（労働保険徴収法又は同法施行規則による書類を除く。）を、その完結の日から5年間保存しなければならない。",a:false,exp:"本肢の書類の保存期間は、その完結の日から「5年間」ではなく「3年間」である（則51条）。",src:"労災則51条",cat:"択一式（労災保険法）"}
];
